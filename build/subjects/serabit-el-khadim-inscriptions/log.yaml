  - id: L-11
    date: 2026-10-16
    entry: >
      FUNDING AND CONTROL: what the sources opened state, and the tasks that remain. STATED (and claimed as sk-claim-expedition-funding-stated): Petrie's preface says the Egypt Exploration Fund bore the cost of the main expedition and the expenses of three workers, two others were from private means, the Fund will publish the atlas of inscriptions, and the Fund had ceased to provide for his researches;
