  - id: L-12
    date: 2026-10-16
    entry: >
      WHAT CHANGED IN THE CLAIMS. New: sk-claim-petrie-1906-report, sk-claim-expedition-funding-stated, sk-claim-count-ten-eleven, sk-claim-gp-table-v-record, sk-claim-gardiner-1916-reading (all established, anchor_checked primary, each about what a document read directly says), sk-claim-sinai-357-readings (contested, secondary), sk-claim-no-slave-term-read (searched gap, absence anchor).
      Reworked, ids kept: the five speaker claims; sk-claim-found-1905 (now contested on the season); sk-claim-sphinx-345-two-scripts; sk-claim-baalat-reading (the "same sources do not read Yahweh" clause moved to sk-sp-god-yahweh; anchor_checked now no, because Haring and Wilson-Wright attribute the reading to the same earlier authors); sk-claim-decipherment-status (unsourced adoption note removed);
      sk-claim-date-range; sk-claim-writers-identity; sk-claim-bar-ron-moses (now read from the page text, anchor_checked secondary); sk-claim-holders; sk-claim-primary-signs-unread. Unsourced adoption notes were removed or replaced by a read sentence, or marked "not measured" with weight 1 as a placeholder. The divergence-note sentence that nobody read calls them slaves
      was restated as: no inscription translation read contains a word for slave or captive; Albright infers forced labour. Added: headline, assessment (three key points, no percentages), timeline.yaml and PROPOSED_TAXONOMY.yaml. build/taxonomy.yaml was not edited; the taxonomy entry is requested for the owner.
  - id: L-13
    date: 2026-10-16
    entry: >
      CORRECTIONS AFTER THE REVIEW OF COMMIT 9b02071 (new entry; earlier entries unchanged). (1) Mine XX: claims.yaml (divergence note and the anchor of sk-sp-scratched-on-walls-of-cave-mines) said a text on a pillar in Mine XX was "found in 2022". Tallet and Laisney 2024 (p. 7) say it was found in 2010, was then poorly documented, and was studied more carefully in September 2022. Corrected in both places.
      The timeline entry t12 already said "found 2010" and is unchanged. (2) The season of Petrie's expedition was stated as 1904-5 in the search_summary, assessment text and first key point; claim sk-claim-found-1905 is contested (the Fund's 1906 report and the 1917 editors say 1904-5, Haring 2019 says 1905-1906, National Geographic says 1906), so those lines now attribute 1904-5 to the Fund and the editors and say the season is disputed.
      (3) sk-claim-bar-ron-moses opened with a flat statement that 357 and 361 contain the name Moses; it now reads "M. S. Bar-Ron reads ... as containing the name Moses". anchor_checked stays secondary; Bar-Ron's thesis (src-bar-ron-2025) was never opened. (4) Attributions in the same claim: the National Geographic page says Schneider's words were told to The Daily Mail (a link on the page; The Daily Mail was not opened), and the sentence that correct readings would not necessarily show the biblical Moses is the article author's, not Feldman's; Feldman is reported for "may well be an Egyptian name".
      Both entries corrected. (5) Table V: 345 and 347 are "Temple ?" and 346 is "Temple"; the claim had grouped all three as "Temple". Corrected. (6) The Lundberg list gives Cairo Museum as the location of the original for Sinai 357 and 358 (file re-opened and hash-matched, sha256 f54df77e...), while Albright 1966 and Wilson-Wright 2026 say 357 is in situ; the conflict is now stated in sk-claim-holders and not resolved.
      (7) Manifest wording for Diez 2024 ("partly an advocate") replaced by "favours one reading". (8) Node serabit-proposed-dates-alphabetic-inscriptions rev 3: `time` set to -1850, the earliest proposal, so that the text, the time field and the window agree (it was -1831); the timeline pin is now rev 3. (9) sk-claim-gardiner-1916-reading: the adoption note now separates evidential weight 4 (what the 1916 article says, read as page images) from adoption 4 (Haring's sentence that the b'lt explanation was accepted and stands); the placeholder adoption weight 1 on other claims is unchanged.
      (10) Labels: the manifest now gives two labels for Petrie 1906, Gardiner 1916 and Gardiner and Peet 1917: interpretive for what the objects are (testimony and decipherment), primary_text for what the document itself says (read directly); the six claims about document contents keep primary_text.
