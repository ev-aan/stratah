subject: serabit-el-khadim-inscriptions
title: "The Serabit el-Khadim inscriptions (Proto-Sinaitic): what they are, when, who made them, and whether Yahweh is in them"
question: "What do the Serabit el-Khadim inscriptions say, when were they made, and does the name Yahweh appear in them?"
dig_status: open
headline: "Serabit el-Khadim's early alphabetic texts: date disputed, and no Yahweh in the sources read"
headline_claim: sk-sp-god-yahweh
headline_status: draft
search_summary: >-
  The Serabit el-Khadim inscriptions are short texts in an early alphabetic script cut at an Egyptian turquoise-mining site in Sinai: on small temple
  objects, on rock panels at mines and on mine walls and pillars. Petrie's expedition of winter 1904-5 found the first ten; the editors of 1917 number eleven
  (345 to 355) with one from a squeeze. About 45 are now known in Sinai (Tallet and Laisney 2024). Proposed dates run from about 1850 to about 1250 BCE; the
  most recent sources read favour the late Middle Kingdom. A few strings, such as one read "the Lady", are widely read, but readings of the one best-preserved
  text (Sinai 357) differ. No source read shows Yahweh in them; that rests on a search of the sources opened, not on the signs, which this dig did not read.
description: >-
  Second pass (2026-10-16). Read directly this time: Petrie 1906 (preface and pp. 128-132, two scans), Gardiner 1916 and Cowley 1916 (JEA 3, text and photograph plates),
  Gardiner and Peet 1917 (introduction and Table V as a page image), the Egypt Exploration Fund's report of 1906 (p. 31), Albright 1966, Haring 2019, Wilson-Wright 2019 and 2026,
  Tallet and Laisney 2024 (the excavation team) and Diez 2024 (Sinai 357), and the National Geographic article (page text). Viewed as images: 1916 photographs of Sinai 346 and 349 to 355,
  and modern photographs of Sinai 345 and 357 in Wilson-Wright 2026. Not read: the signs (no claim here transliterates them), the British Museum record (HTTP 403), InscriptiFact,
  Eisler 1919, Butin, Sass, Hamilton, Darnell, Parker 2022, Petrovich, and Bar-Ron's thesis (HTTP 403). One speaker sentence is split into five claims and each is weighed; the video is never an anchor.
divergence_note: >-
  The speaker sentence is "The earliest written example was scratched on the walls of cave mines by slaves who remembered their god Yahweh." (dh-KNhzmEKodZg-22).
  The sources read say something narrower and more divided. Some texts are cut in the rock at or in mines (Sinai 357 in a cave; one found in 2022 on a pillar in Mine XX), but others are on
  small objects from the Hathor temple. Who made them is open: Gardiner (1916) argues they are the work of strangers who accompanied the Egyptians; Petrie (1906) says probably Aamu or Retennu "Syrians";
  Albright (1966) says Hyksos-era Semites and reads some texts as alluding to the miners' sufferings; Wilson-Wright (2019, 2026) says West Semitic speakers in the Egyptian expeditions, with texts naming a "miner" and a
  "chief of miners". None of the sources read reports an inscription containing a word for slave; Albright infers forced labour from historical context. No source read gives anything for "remembered".
  The divine names scholars read are "the Lady" (Baalat), El and, for Sinai 357, Tessob (Wilson-Wright); Cowley (1916) also proposed a goddess Kesh. Yahweh was searched for in every source opened and not found, but those
  sources cover only part of the literature and none transliterates the signs, so that is a search result and not a finding about the corpus. The gap between the speaker's wording and the sources, and the
  gap between scholars on the date and on the readings, is the product here.

assessment:
  question: "What do the Serabit el-Khadim inscriptions say, when were they made, and does the name Yahweh appear in them?"
  answer: unsettled
  headline: "Their date and most readings are unsettled, and no source read shows Yahweh in them."
  text: >-
    The inscriptions are short texts in an early alphabetic script. Petrie's expedition of winter 1904-5 found the first ten; one more, from a squeeze marked as from Maghârah, makes the
    editors' eleven (Gardiner 1916; Gardiner and Peet 1917). The editors dated them "Middle Kingdom ?". Later proposals run from about 1850 to about 1250 BCE and the most recent sources read favour the
    late Middle Kingdom (the excavation team Tallet and Laisney 2024, and Wilson-Wright 2026, both citing Parker 2022, which was not opened). Only a few strings are widely read, chiefly one
    taken as "lady" (Gardiner 1916, who called it an unverifiable hypothesis; Eisler 1919, not opened). The best-preserved text, Sinai 357, has been read as a debt note (Albright), a work order (Rainey, as reported)
    and a votive text to Tessob (Wilson-Wright), and as naming Moses (Bar-Ron, whose thesis could not be opened and whom Wilson-Wright answers). Yahweh was searched for in every source opened and not found; that is a search result.
    The speaker's "slaves" is Albright's inference for part of the labour, not a word found in a text; "remembered their god" has nothing to attach to. This dig read no signs itself, so every claim about what the texts say rests on scholars' readings.
  key_points:
    - "Petrie's 1904-5 expedition found ten of the first eleven texts (345-355); about 45 are known in Sinai now, and only a few strings are widely read."
    - "Proposed dates run from about 1850 to 1250 BCE; the editors wrote 'Middle Kingdom ?' and the newest sources read favour the late Middle Kingdom."
    - "No source read shows Yahweh in them. This dig read no signs, and published readings of Sinai 357 differ."
  basis: [sk-claim-count-ten-eleven, sk-claim-decipherment-status, sk-claim-date-range, sk-claim-gp-table-v-record, sk-sp-god-yahweh, sk-claim-sinai-357-readings, sk-claim-primary-signs-unread]
  would_settle: >-
    Photographs, squeezes or RTI images of the signs (InscriptiFact, the Cairo, British and Harvard collections, the Tel Aviv archive) transliterated independently by readers who do not share a lineage;
    a corpus edition with a collated reading; a stratified or dated find tying a text to a period; and, for Yahweh, a specialist transliteration that reads that name with the argument for the reading.

claims:

  # ------------------------- THE SPEAKER SENTENCE, SPLIT INTO ITS PARTS -------------------------

  - id: sk-sp-earliest-written-example
    state: contested
    statement: >-
      "The earliest written example" (dh-KNhzmEKodZg-22; part 1 of 5 of the sentence "The earliest written example was scratched on the walls of cave mines by slaves who remembered their god Yahweh.")
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured: no source read counts how many people use the phrase. Weight 1 is a placeholder for no read basis, not a finding of low adoption."
    would_change_if: >-
      the speaker's meaning is read from the transcript and a defined object (for example earliest alphabetic text) is tested; the Wadi el-Hol texts or another find are securely dated before the Serabit texts; or a dating method fixes the Serabit texts independently
    disputed_by:
      - who: "B. J. J. Haring (2019)"
        kind: person
        position: "'the earliest evidence for alphabetic writing remains a topic shrouded in mystery and controversy'; the dates of the Sinai and Wadi el-Hol texts are both controversial."
        source_read: "Haring 2019, p. 53, read"
        via: "direct"
      - who: "J. C. Darnell and colleagues, as reported by Haring"
        kind: work
        position: "The two Wadi el-Hol texts 'would be among the earliest (if not the earliest) specimen of alphabetic writing discovered to date'."
        source_read: "Haring 2019, p. 57 (quoting Darnell et al. 2005, 90); Darnell et al. not read"
        via: "Haring 2019"
      - who: "B. Sass, as reported by Haring"
        kind: work
        position: "In a later publication suggested a date around 1300 BCE for the Sinai and Wadi el-Hol corpus."
        source_read: "Haring 2019, p. 58; Sass not read"
        via: "Haring 2019"
      - who: "A. M. Wilson-Wright (2019, 2026)"
        kind: person
        position: "Calls the Serabit and Wadi el-Hol texts the earliest alphabetic inscriptions (2019, section I) and 'some of the oldest unambiguous alphabetic texts' (2026, p. 10)."
        source_read: "Wilson-Wright 2019 section I and 2026 p. 10, read"
        via: "direct"
    anchor:
      type: interpretive
      description: >-
        Read: Haring 2019 pp. 53, 57-58; Wilson-Wright 2019 section I and 2026 p. 10. Also read, on the other half of the phrase: Gardiner and Peet 1917, introduction, "Date": the Egyptian monuments in Sinai range from Dynasty I to XX (circa 3200-1150 BC),
        so Egyptian writing at the same site is older by the editors' own dating. The speaker's phrase does not say earliest of what (writing, alphabet or script); that meaning was not read. The sources agree the texts are among the earliest alphabetic ones
        and disagree on the date; they draw on the same literature (Sass, Darnell, Goldwasser) and are not counted as independent.
      sources: [src-haring-2019, src-wilson-wright-2019, src-wilson-wright-2026, src-gardiner-peet-1917]
      nodes:
        - {node: serabit-proposed-dates-alphabetic-inscriptions, verb: qualifies}
    basis: >-
      # V: Haring 2019, Wilson-Wright 2019 and 2026 and the 1917 introduction read 2026-10-16. Not filed as refuted or established: the earliest-alphabet question is itself open in the sources read, and the speaker's object of comparison is not stated.

  - id: sk-sp-scratched-on-walls-of-cave-mines
    state: proposed
    statement: >-
      "was scratched on the walls of cave mines" (dh-KNhzmEKodZg-22; part 2 of 5)
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 1
    adoption_note: "Not measured: no source read counts how widely the picture of scratches in mine caves is held. Weight 1 is a placeholder for no read basis."
    would_change_if: >-
      photographs, squeezes or the objects show tool marks and findspots that differ from what the observers report, or the speaker's own basis shows which texts were meant
    anchor:
      type: interpretive
      description: >-
        Three observers who saw the sites at different times agree that some texts are cut at or in mines. Petrie (1905 expedition; 1906 pp. 129-130): texts "carved over the mine at L", about eight tablets "roughly cut" with grooves round them.
        Albright (saw No. 357 in situ in 1947-8; 1966 pp. 3 and 23): a "cave inscription (No. 357)", "carved on rock wall", location Mine L. Tallet and Laisney (survey 2006-2012 and 2022; 2024 pp. 7-8): most texts found "inside or in the vicinity" of mines I, IV, XI, XII, XIII and XIV, sometimes on
        pillars holding the roof of rock-cut rooms, and a new text in 2022 on a pillar in a small cave (Mine XX) with copper-chisel marks. Diez 2024 (pp. 22-23, citing Wilson-Wright 2016) describes 357 as cut on the cave wall with a thin metal tool.
        The same sources put other texts on temple objects: Gardiner and Peet 1917 Table V gives 345, 346 and 347 "Temple" and 349 to 355 "Mine L"; 348 "Magharah ?". "Scratched on the walls of cave mines" therefore fits some texts and not the temple objects. The sources differ on carved versus scratched.
      sources: [src-petrie-1906, src-albright-1966, src-tallet-laisney-2024, src-diez-2024, src-gardiner-peet-1917, src-gardiner-1916-jea]
      nodes:
        - {node: serabit-1905-petrie-finds-foreign-inscriptions, verb: qualifies}
    basis: >-
      # V: Petrie pp. 129-130, Albright pp. 3 and 23, Tallet and Laisney pp. 7-8, Diez pp. 22-23 and Table V read 2026-10-16. Petrie, Albright and the Tallet team are separate observers; Gardiner 1916 repeats Petrie's copies and is not counted.
      Whether every mine is a cave was not read; Mine XX and No. 357 are described as caves. These are observers' reports; the photographs of 357 in Wilson-Wright 2026 (Figure 5) show chisel-cut marks on a rough red rock face and were viewed, but no sign was read.

  - id: sk-sp-by-slaves
    state: contested
    statement: >-
      "by slaves" (dh-KNhzmEKodZg-22; part 3 of 5)
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured: no source read counts adherents of the slave view. Weight 1 is a placeholder for no read basis."
    would_change_if: >-
      an Egyptian or Semitic text from the site calls the writers captives or slaves; a legal or administrative record of the labour at Serabit is read; Albright's historical step is checked against texts 350, 352, 356 and 374; or the transcript shows what the speaker means by slaves
    disputed_by:
      - who: "A. H. Gardiner (1916)"
        kind: person
        position: "'to the last degree improbable' that the new-script monuments are the work of the indigenous Semitic nomads of Sinai; they are due to 'strangers from other parts who accompanied the Egyptians on their expeditions'. He does not use the word slave."
        source_read: "Gardiner 1916, p. 14, read as a page image"
        via: "direct"
      - who: "W. M. F. Petrie (1906)"
        kind: person
        position: "'Common Syrian workmen' of the Egyptians, 'probably the Aamu or Retennu - Syrians'; he does not call them slaves."
        source_read: "Petrie 1906, pp. 131-132, read in two scans"
        via: "direct"
      - who: "W. F. Albright (1966)"
        kind: person
        position: "The miners 'belonged to the recently conquered Hyksos elements of the population' (p. 12). Texts 350, 352, 356 and 374 'clearly or probably allude to the sufferings of the miners' and he cites 'traditions of state slavery in the mines of the New Kingdom' (pp. 14-15). Cutting against the neat reading: he says Hyksos captives were unlikely to be sent to Sinai before about 1550-1540, that Semitic miners 'can scarcely have been sent to Nubia as state slaves' before the occupation of Wawat, and his note that captives 'may well have been forced to work in the mines of lower Nubia' is about Nubia, not Sinai. He reads No. 357 as 'purely mundane matters'."
        source_read: "Albright 1966, pp. 12-15, 23-24 and note to No. 351, read"
        via: "direct"
      - who: "A. M. Wilson-Wright (2019, 2026)"
        kind: person
        position: "Writers were West Semitic speakers in the Egyptian expeditions, at 'the bottom of the socio-economic order'; texts name a miner (Sinai 350) and a chief of miners (346, 349) who 'oversaw a group of only nine other workers'. He does not call them slaves."
        source_read: "Wilson-Wright 2019 p. 6 and 2026 p. 1, read"
        via: "direct"
      - who: "O. Goldwasser and C. Rollston, as reported by Haring"
        kind: person
        position: "Goldwasser: the inventors were 'the illiterate workers in the Sinai turquoise mines'; Rollston: the Canaanite elite. Neither is described as arguing the writers were slaves."
        source_read: "Haring 2019, p. 56; neither read"
        via: "Haring 2019"
    anchor:
      type: interpretive
      description: >-
        Read: Gardiner 1916 p. 14; Petrie 1906 pp. 131-132; Albright 1966 pp. 12-15; Wilson-Wright 2019 p. 6 and 2026 p. 1; Haring 2019 p. 56. All are interpretations. Slavery is Albright's inference for part of the labour; the others do not use the word.
        What the inscriptions themselves say about status is a separate claim (sk-claim-no-slave-term-read).
      sources: [src-gardiner-1916-jea, src-petrie-1906, src-albright-1966, src-wilson-wright-2019, src-wilson-wright-2026, src-haring-2019]
    basis: >-
      # V: the passages read 2026-10-16. Not filed as refuted: Albright holds that part of the mining labour in Sinai was forced. Each scholar named is held to the same bar: all are interpretations, none from the signs read here.

  - id: sk-sp-who-remembered-their-god
    state: searched_gap
    statement: >-
      "who remembered their god" (dh-KNhzmEKodZg-22; part 4 of 5)
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured. Weight 1 is a placeholder for no read basis."
    would_change_if: >-
      a text read from the site shows an appeal to an ancestral god or to a god of the writers' own people, with a source that dates and reads it
    gap_type: structural
    gap_reason: >-
      Remembering is a mental state. No inscription, translation or commentary can show what a writer remembered. At most a text could show a god the writers invoked and a scholar's argument about its origin, which is a different claim (see sk-sp-god-yahweh).
    anchor:
      type: search-record
      description: >-
        Searched: Gardiner 1916 with Cowley's note, Petrie 1906 pp. 128-132, Gardiner and Peet 1917, Albright 1966, Haring 2019, Wilson-Wright 2019 and 2026, Tallet and Laisney 2024 and Diez 2024. None uses the idea of remembering a god.
        Albright reads El and Baalat as invoked and ties El to patriarchal religion (1966 p. 13, citing F. M. Cross); that is his claim, not something the writers are shown to have remembered.
      sources: [src-gardiner-1916-jea, src-petrie-1906, src-albright-1966, src-haring-2019, src-wilson-wright-2019, src-wilson-wright-2026, src-tallet-laisney-2024, src-diez-2024]
    absence_anchor: true
    basis: "Not testable by the method. Kept as a gap so the speaker's wording is not dropped."

  - id: sk-sp-god-yahweh
    state: searched_gap
    statement: >-
      "Yahweh" (dh-KNhzmEKodZg-22; part 5 of 5, the god named in "their god Yahweh"). No source opened shows the name Yahweh in a Serabit el-Khadim inscription; this is a search result over the sources opened, not a statement about the corpus.
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured: no source read counts how many people link the Sinai texts to Yahweh, Moses or Israel. Weight 1 is a placeholder for no read basis."
    would_change_if: >-
      a specialist's transliteration of an inscription, checked against a photograph or squeeze, reads a name as Yahweh (YHWH) with the argument for the reading; the unread works listed in next_step read it; or the speaker's own basis names a text
    next_step: >-
      Open Albright 1948 (BASOR 110), Butin 1928, 1932 and 1936, Sass 1988, Hamilton 2006, Petrovich 2016, Krahmalkov 2017, Bar-Ron's thesis and Wilson-Wright 2016 (Sinai 357) and Eisler 1919, and search each divine name read for Yahweh or YHWH;
      then open photographs of Sinai 345 to 375 in InscriptiFact or museum images and transliterate the signs independently.
    anchor:
      type: search-record
      description: >-
        Searched for Yahweh, YHWH, Jehovah and Yahu in the full text of Gardiner 1916 (volume text), Petrie 1906 (two scans), Gardiner and Peet 1917 and 1955 (OCR), Albright 1966, Haring 2019, Wilson-Wright 2019 and 2026, Tallet and Laisney 2024, Diez 2024 and the National Geographic page.
        Hits: Albright 1966 three times, in notes and references (Cross's article 'Yahweh and the God of the Patriarchs'; a reading of a verse of 1 Samuel; a reference to his own book), none as a name he reads in a Sinai text; Petrie 1906 once, the word 'Jehovistic' in a chapter on the Pentateuch;
        Gardiner 1916 once, a place name (Tell el-Yahudiyeh) in another article. The gods named in the readings found: the Lady (Baalat) and a proposed Kesh (Gardiner 1916, Cowley 1916), El, Asherah and Hathor as Baalat (Albright 1966), Tessob for Sinai 357 (Wilson-Wright 2016, 2026),
        and El and Baalat (National Geographic). Not searched, because not opened: the works listed in next_step. The signs were not read, so a reading of Yahweh could not have been checked.
      sources: [src-gardiner-1916-jea, src-petrie-1906, src-gardiner-peet-1917, src-gardiner-peet-cerny-1955, src-albright-1966, src-haring-2019, src-wilson-wright-2019, src-wilson-wright-2026, src-tallet-laisney-2024, src-diez-2024, src-natgeo-moss-2025, src-petrovich-2016]
    absence_anchor: true
    basis: >-
      # V: keyword searches run over the extracted text of each source listed, 2026-10-16. Absence in the sources opened is not absence in the corpus (Haring: the texts are 'largely undeciphered').
      Filed as a gap, not as 'not there'. The headline's second half rests on this absence and carries this flag.

  # ------------------------- WHAT THE DOCUMENTS SAY (read directly) -------------------------

  - id: sk-claim-petrie-1906-report
    state: established
    statement: >-
      Petrie's book of 1906 reports foreign-script inscriptions in the Hathor temple (a figure, fig. 138, and a small sphinx, fig. 141) and about eight roughly cut tablets over the mine at L; says the same five signs recur on four monuments; reads the writing as left to right; dates it "about 1500 B.C."
      on pottery, the place of one figure and the red sandstone of the sphinx; and suggests it was used by workmen "probably the Aamu or Retennu - Syrians".
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured. This claim is about what one document says. Weight 1 is a placeholder for no read basis."
    would_change_if: "the page images of pp. 128-132 or another printing read differently from the OCR in the two scans compared"
    anchor:
      type: primary_text
      description: >-
        Petrie 1906 pp. 129-132 read in two independent Internet Archive scans (Toronto and Google copies); the OCR agrees on every statement listed. A stored extract (sources/extracts/petrie-1906-extract.txt) holds the passages. The document is the finder's report, so this claim is only about what the report says, not about the objects.
      sources: [src-petrie-1906]
    basis: >-
      # V: pp. 129-132 read in both scans, 2026-10-16. Primary for what the book says; the objects were not seen.

  - id: sk-claim-expedition-funding-stated
    state: established
    statement: >-
      Petrie's preface states that the cost of the main expedition "was borne by the Egypt Exploration Fund", with the expenses of three workers, and that two other workers' expenses "were from private means"; the Fund ceased to provide for his researches. The Fund's 1905-1906 report names its officers and committee. Nothing is read here on who paid the Fund.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured. This claim is about what two documents state. Weight 1 is a placeholder for no read basis."
    would_change_if: "the Fund's accounts or subscription lists for 1904-5 are read and differ from the preface"
    anchor:
      type: primary_text
      description: >-
        Petrie 1906 preface pp. vi-vii (read in two scans) and the Egypt Exploration Fund Archaeological Report 1905-1906 (officers and committee list read in the OCR; p. 31 viewed as an image). Funding beyond what the preface says is a task (see the manifest), not a finding. No motive is drawn from it.
      sources: [src-petrie-1906, src-eef-report-1906]
    basis: >-
      # V: preface and the report's p. 31 read 2026-10-16. The Fund's accounts and subscribers were not searched.

  - id: sk-claim-count-ten-eleven
    state: established
    statement: >-
      Gardiner (1916) says Petrie's expedition found "a series of ten" inscriptions in the unknown script and that "a short inscription previously published from a squeeze by M. Weill brings the total up to eleven"; his note marks that squeeze as referring to an inscription at Maghârah. Gardiner and Peet (1917) number eleven foreign inscriptions, 345 to 355, and list 348 as from "Magharah ?", traced from a squeeze.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured. This claim is about what two documents say. Weight 1 is a placeholder for no read basis."
    would_change_if: "the 1917 memoir's Descriptive Text or Weill's Recueil of 1904 gives a different findspot or count"
    anchor:
      type: primary_text
      description: >-
        Gardiner 1916 pp. 12-13 (the series of ten on p. 12 from the OCR; the total of eleven and footnote 1 on p. 13 read as a page image) and Gardiner and Peet 1917 introduction and Table V (page image). This explains why Wilson-Wright 2019 and 2026 say ten and Gardiner and Peet say eleven: ten from Petrie's expedition and Weill's, not a contradiction between them.
        The two documents come from the same circle (Gardiner is an editor of both) and are not counted as independent; the claim is about what each says.
      sources: [src-gardiner-1916-jea, src-gardiner-peet-1917]
    basis: >-
      # V: Gardiner p. 13 and Table V read as images, p. 12 from the OCR, 2026-10-16. Wilson-Wright 2019 p. 1 says ten found in 1905; 2026 p. 1 says 'the first ten'. Tallet and Laisney say 45 are known in Sinai now.

  - id: sk-claim-gp-table-v-record
    state: established
    statement: >-
      Table V of Gardiner and Peet's 1917 memoir lists the eleven foreign inscriptions 345 to 355, gives each a date of "Middle Kingdom ?", gives the findspot of 345 and 347 as "Temple ?", 346 as "Temple", 348 as "Magharah ?" and 349 to 355 as "Mine L", and records the copies:
      345 collated with the original, 346 and 349 to 355 collated with a photograph, 347 not collated, 348 traced from a squeeze.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured. This claim is about what one printed table says. Weight 1 is a placeholder for no read basis."
    would_change_if: "the 1952 printing or the Descriptive Text gives different findspots, dates or collation symbols"
    anchor:
      type: primary_text
      description: >-
        Gardiner and Peet 1917, Table V (printed p. 16), viewed and read as a page image (PDF page 21). The ditto marks for the date and provenance columns were read in the image. The query mark on the date is the editors'. The Nature of Copy symbols (original, photograph, squeeze) are explained in the introduction.
        The editors' 1955 commentary on 345 (Part II) is read below in sk-claim-sphinx-345-two-scripts. A transcription of the table is stored in sources/extracts/gardiner-peet-1917-extract.txt.
      sources: [src-gardiner-peet-1917]
      nodes:
        - {node: serabit-1905-petrie-finds-foreign-inscriptions, verb: supports}
    basis: >-
      # V: Table V viewed as an image 2026-10-16. The 'Nature of Copy' column, not recorded in the first pass, shows that most of the editors' copies were checked against photographs; it does not show that any sign was read from the object by this dig.

  - id: sk-claim-gardiner-1916-reading
    state: established
    statement: >-
      Gardiner (1916) proposed that a recurring four-sign string read, in Hebrew letters, "Ba'alat" and named the local goddess (the Egyptian Hathor), and wrote that "so far as I am concerned" the decipherment "must remain" an "unverifiable hypothesis"; he said the monuments were not made by the indigenous Semitic nomads and that
      the end of the Twelfth Dynasty might be "a more probable date" than Petrie's 1500 BC while accepting that the writing was, "at all events", not later than 1500 BC. Cowley's note in the same volume read 345 (right) as "the sphinx of the goddess" and proposed a goddess Kesh in other texts, with "very uncertain" suggestions.
