  - id: sk-claim-holders
    state: proposed
    statement: >-
      The sphinx Sinai 345 is in the British Museum (no. 41748); most other texts of the Petrie and later finds are in the Cairo Museum; Sinai 347 is in Brussels and a few fragments are at the Harvard Semitic Museum; Sinai 357 is cut in the rock at Mine L (Mine XIII in the numeral system) and a plaster cast of 361 is in the Harvard Museum of the Ancient Near East.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 1
    adoption_note: "Not measured. Catalogue information. Weight 1 is a placeholder."
    would_change_if: "the museum registers (British Museum, Cairo, Brussels, Harvard) are read and give different holders or numbers"
    anchor:
      type: interpretive
      description: >-
        British Museum no. 41748 for the sphinx is given by two independent sources: Gardiner, Peet and Cerny 1955 (entry 345: "Now in the B.M. (no. 41748)") and Albright 1966 ("now British Museum, 41748"), and by Haring 2019 (Figure 4.1 caption) and Wilson-Wright 2026 (photograph credit).
        Albright 1966 gives Cairo Museum 38268 for 346 and Brussels for 347; the Lundberg list gives Cairo for most of 346 to 375, Brussels for 347 and Harvard for 375a to 375c. Wilson-Wright 2026 says 357 "remains in situ inside Mine XIII" and 361 is "currently housed in the Cairo Museum", with a plaster cast of 361 at the Harvard museum. The British Museum record was blocked (HTTP 403) on two tools.
      sources: [src-gardiner-peet-cerny-1955, src-albright-1966, src-haring-2019, src-wilson-wright-2026, src-isf-lundberg-list, src-bm-ea41748]
      nodes:
