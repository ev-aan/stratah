    url: https://archive.org/details/researchesinsina00petruoft
    document_class: "interpretive: the excavator's report (testimony by the finder, not the object). Eyewitness text; not primary data."
    read: "yes, directly: preface and pp. 128-132 read in two independent scans of the same edition (Toronto copy researchesinsina00petruoft, OCR sha256 5a04edbf6cd0dab23ba7727aa10a9dfcdb6a56bb068fde19bb1a73979a918f8f; Google copy researchesinsin00currgoog, OCR sha256 a0a3d7d0c9af7c384667feae40f923c5f543be4709ee3cb592ad1718b684ae0f). Figures 138-141 not viewed. Short extract stored: sources/extracts/petrie-1906-extract.txt"
    funding_and_control: >
      The preface says the cost of the main expedition was borne by the Egypt Exploration Fund and the expenses of three workers, and that two other workers' expenses were from private means; the Fund will publish the atlas of inscriptions; the book is a separate publication apart from the Fund. It says
      Currelly's expedition was undertaken for the Egyptian Research Account, and that the Fund had ceased to provide for Petrie's researches. Published by John Murray (London) and Dutton (New York).
    funding_next_step: "Find the Fund's own accounts or subscription lists for 1904-5 (the Archaeological Report series is on the Internet Archive) and say who paid; look up John Murray's and Dutton's ownership in a publishing history. Task only; no finding."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Title page read: first edition May 1906. Two Internet Archive scans (University of Toronto copy uploaded by the Internet Archive; Google copy). The two OCR texts agree on pp. 128-132. Holders of the printed copies not recorded."
      tests:
        - "Gardiner 1916 (JEA 3, p. 13) quotes Petrie's list of reasons for a c. 1500 BC date and cites Researches p. 131; the sentence quoted is in the book at p. 131 (could have failed)"
        - "Gardiner and Peet 1917 Table V cites P. R. fig. 141 for Sinai 345 and figs. 138-9 for Sinai 346; Petrie's text describes fig. 141 as the small sphinx and fig. 138 as the best of the figures (could have failed)"
      tested_by: "Stratah dig agent (not independent of the dig). Both witnesses are later authors who used the same book."
      gaps: ["Figures 138-144 and Map 3 not viewed", "Page images of pp. 128-132 not viewed; text read from OCR in two scans", "Currelly's chapters not read"]
      next_step: "View the figure pages (138-141) and compare with Gardiner's 1916 photographs."
      checked: 2026-10-16

