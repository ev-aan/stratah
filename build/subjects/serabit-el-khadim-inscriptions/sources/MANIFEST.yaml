# Sources for the serabit-el-khadim-inscriptions dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Every book, translation, commentary and video below is a CLAIM that needs proof, on the same footing. None is primary data. Primary data is the inscribed
# objects, their photographs, squeezes and the excavation plates. Only the editors' hand-copy facsimile plates (Gardiner and Peet 1917, Plates LXXXII and LXXXIII) were viewed;
# no photograph, squeeze or object was seen. No file from these sources is stored in the repository (sha256 values are of the local copies used for reading).
# Tests were run in this session (2026-10-14), which is not an independent review.
# Funding and control of each author, editor and publisher is traced where a source opened here says it, otherwise marked UNRESEARCHED.
retrieved: 2026-10-14
sources:

  - id: src-petrie-1906
    title: "W. M. F. Petrie (with C. T. Currelly), Researches in Sinai (London: John Murray, 1906; first edition May 1906, reprinted October 1906), pp. v-vii (preface), 128-132 (the foreign sculptures and 'The foreign writing'), 133 onward not read in full"
    url: https://archive.org/details/researchesinsin00currgoog
    document_class: "interpretive: excavator's report by the finder (testimony, not the object). Not primary data."
    read: "yes, directly (Internet Archive OCR text of the Google-scanned copy, sha256 a0a3d7d0c9af7c384667feae40f923c5f543be4709ee3cb592ad1718b684ae0f; preface and pp. 128-132 read; keyword searches for Yahweh, Jehovah and slave run over the whole text)"
    funding_and_control: >
      From the preface (read): "The cost of the main expedition described here was borne by the Egypt Exploration Fund, and the expenses of three workers; while the expenses of two other workers of our party were from private means."
      The preface says the book "is a separate publication apart from the Fund, and is not, therefore, given to the subscribers", published by John Murray (a commercial publisher; its ownership and terms UNRESEARCHED).
      The expedition described in Currelly's chapters "was undertaken for the Egyptian Research Account". Petrie also writes that the Fund had ceased to provide for his researches and that he would trust "the Egyptian Research Account and British School of Archaeology in Egypt" for the future.
      Who funded the Fund's subscribers, who sat on its committee in 1905 and what the Fund expected of Petrie: UNRESEARCHED. Petrie's own stake (he argues the writing proves common Syrian labourers could write and that this "disproves the hypothesis that the Israelites ... could not have used writing", p. 132) is stated in the text.
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Title page read in the OCR: Researches in Sinai, first edition May 1906, reprinted October 1906. Internet Archive item researchesinsin00currgoog (Google scan, the Google notice says public domain in the United States). A second Internet Archive copy, researchesinsina0000wmfl, exists and was not compared. Holder of the scanned copy not recorded here."
      tests:
        - "Gardiner and Peet's 1917 table cites 'P. R., figs. 138-9' for Sinai 346 (squatting statue) and 'P. R., fig. 141' for Sinai 345 (small sphinx); Petrie's text read here describes fig. 138 as the best of the figures with inscription and fig. 141 as a small sphinx (could have failed)"
        - "Haring (2019) cites Petrie 1906, 129 for the phrase being 'of religious significance' and 131 for the date of about 1500 BC and the red sandstone argument; both statements were found in the OCR on pp. 129-131 (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review). Both witnesses are later scholars who used the same book."
      gaps: ["OCR only; page images of the book not viewed", "Plates and figures in the book (figs. 138-144, Map 3) not viewed", "Not compared with the second Internet Archive copy", "The Egyptian Research Account and Currelly chapters not read"]
      next_step: "View figs. 138-141 and Map 3 in the page images and compare the sign groups with Gardiner and Peet Plates LXXXII and LXXXIII."
      checked: 2026-10-14

  - id: src-gardiner-peet-1917
    title: "A. H. Gardiner and T. E. Peet, The Inscriptions of Sinai, Part I: Introduction and Plates (Egypt Exploration Fund Memoir 36, London, 1917), introduction and table V 'The Foreign Inscriptions'"
    url: https://archive.org/details/EXCMEM36
    document_class: "interpretive: the editors' catalogue and introduction (testimony). Not primary data."
    read: "yes, directly (Internet Archive OCR text, sha256 08b301f37b7e7371be97aa40579eaf4da5f1a63988003b61713f793b2a2cd425; the table of foreign inscriptions 345-355 and the Aim and scope passage read)"
    funding_and_control: "Published by the Egypt Exploration Fund (title pages in the OCR). The introduction says the work was 'originally entrusted by the Egypt Exploration Fund to the authors' and based on the copies of the Fund expedition of 1904-5. Who paid for the work and who controlled the Fund: UNRESEARCHED beyond that statement. The Internet Archive item is from a collection (EXCMEM) whose uploader and rights basis were not looked up."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Internet Archive item EXCMEM36, 'MEEF 36 Gardiner, AH - The Inscriptions of Sinai Vol 1 (1917)', PDF of 113 pages (sha256 15062e05b538a0f0c041b723e69d21a1e6fd1a39a8dc33211b4d831d4339115e). Rights stated for the item: none in the item metadata. The volume was published in 1917; the uploader is not stated in the metadata."
      tests:
        - "The table's bibliographical column cites Petrie's Researches figs. 141 and 138-9 for Sinai 345 and 346; these agree with Petrie's own text (could have failed)"
        - "Haring 2019 (Figure 4.1 caption) cites the facsimile of Sinai 345 as pl. lxxxii of Gardiner and Peet; the plate viewed here is numbered LXXXII and shows Sinai 345 (could have failed). Haring cites 'Gardiner and Peet 1952'; the Internet Archive item viewed is dated 1917 (Part I); the second edition of 1952 was not seen (see log L-04)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["OCR of the table has dittos that are hard to read (see claim sk-claim-findspots)", "No photograph or squeeze viewed", "The 1952 edition cited by Haring was not seen", "Part II (1955, EXCMEM45, with Cerny) was downloaded as OCR and searched for 'Proto-Sinaitic' and 'new alphabet' with no useful hit; not read"]
      next_step: "Read the Descriptive Text (Part II, 1955) for Sinai 345 to 355 and compare the plates with a photograph of the object."
      checked: 2026-10-14

