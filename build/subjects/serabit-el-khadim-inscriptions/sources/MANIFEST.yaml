# Sources for the serabit-el-khadim-inscriptions dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Every book, article, translation, commentary and video below is a CLAIM that needs proof, on the same footing. Primary data is the inscribed objects, their photographs,
# squeezes and the excavation records. This dig read: (a) the finders' and editors' own reports (testimony about the objects), (b) the 1916 photographs and hand copies of
# Gardiner's JEA article (viewed as page images; photographs of the objects, 1916 halftones), (c) modern photographs of Sinai 345 and 357 inside Wilson-Wright 2026 (viewed),
# and (d) later scholars' readings. No signs were transliterated by this dig, so no claim carries anchor_checked primary for what an inscription says.
# Only short extracts of public-domain works are stored (sources/extracts/); nothing in copyright and no image is stored. sha256 values are of the local files used for reading.
# Session 1 (2026-10-14) and session 2 (2026-10-16) were both run by the dig agent; neither is an independent review.
# Funding and control: each entry says only what the opened source states. Everything else is a named task in `funding_next_step`; none is a finding.
retrieved: 2026-10-16
