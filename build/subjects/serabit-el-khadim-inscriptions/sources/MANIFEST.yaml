  - id: src-albright-1966
    title: "W. F. Albright, The Proto-Sinaitic Inscriptions and Their Decipherment (Harvard Theological Studies 22; Cambridge, Mass.: Harvard University Press, 1966; second printing), pp. 1-15 read in full, glossary and notes searched"
    url: https://archive.org/details/AlbrightTheProtoSinaiticInscriptionsAndTheirDecipherment1969
    document_class: "interpretive: one scholar's decipherment (a claim). Not primary data. Copyright 1966, President and Fellows of Harvard College: in copyright; read, quoted briefly, NOT stored."
    read: "yes, directly (Internet Archive PDF with text layer, sha256 a85ddb3a1c2480287b6b36e3dd8eeb3306e96715da727378dc59b512274961df; text extracted with pdftotext; keyword search for Yahweh/YHWH run over the whole text)"
    funding_and_control: "Published by Harvard University Press in the Harvard Theological Studies series. The preface-footnote read thanks two research assistants (1962-64) and does not name a funder. Who funded Albright's research, and what he stood to gain (his work ties the inscriptions to Biblical tradition, pp. 12-15): UNRESEARCHED."
    authenticity:
      status: authenticated
      strength: weak
      provenance: "Title page and copyright page read in the text layer. The Internet Archive item was uploaded by a third party (curation note: checked for malware only); the file is a second printing. Not compared with a library copy."
      tests:
        - "Albright calls No. 346 a 'cuboid figure from the temple' and No. 349 a 'steliform text'; Gardiner and Peet's 1917 table lists 346 as 'Squatting statue' and 349 as 'Rock stele', so the numbering is shared (could have failed). Albright's No. 347 is a 'sphinx statuette'; the 1917 table lists 347 as 'Bust': a discrepancy, not resolved here"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Uploader is not the publisher; rights status of the upload not established", "Text layer is OCR; page images not compared", "Albright's decipherment itself is a claim and was not independently tested here"]
      next_step: "Use a library copy; read Chapters III to V (texts, grammar, glossary) against the plates."
      checked: 2026-10-14

  - id: src-haring-2019
    title: "B. J. J. Haring, 'Ancient Egypt and the earliest known stages of alphabetic writing', in P. Boyes and P. Steele (eds), Understanding Relations Between Scripts II: Early Alphabets (Oxford and Philadelphia: Oxbow Books, 2019), pp. 53-67"
    url: https://hdl.handle.net/1887/3295773
    document_class: "interpretive: a specialist review chapter (a claim about the evidence). Not primary data."
    read: "yes, directly (publisher's version PDF from the Leiden University repository, text extracted with pdftotext, sha256 f8e89e0c62daa9b9a031527e71091d0f412678ab21d746f91715124a4bcb58f6 of the file downloaded; pp. 53-60 read)"
    funding_and_control: "Published by Oxbow Books (a commercial academic publisher); volume editors Boyes and Steele. The chapter's footnote thanks Helen Richardson-Hewitt for correcting the English. No funder is named in the pages read. The repository record says the copy is licensed under Article 25fa of the Dutch Copyright Act (Amendment Taverne). Funding of the volume or the 2017 conference behind it: UNRESEARCHED."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Leiden University repository (hdl.handle.net/1887/3295773, item 3295774); the cover sheet gives the citation, 'Publisher's Version' and the licence. Held by Leiden; not compared with the printed book."
      tests:
        - "Haring attributes to Petrie 1906 p. 129 the idea that the group is a phrase of religious significance and p. 131 the c. 1500 BC date; both were found at those places in Petrie's OCR (could have failed)"
        - "Haring's caption cites a facsimile of Sinai 345 from Gardiner and Peet pl. lxxxii; Plate LXXXII viewed here shows Sinai 345 (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["The scholarly works Haring cites for each proposed date (Sass 1988, Hamilton 2006, Darnell et al. 2005, Goldwasser, Briquel-Chatonnet) were not opened, so every date attributed to them here is Haring's report", "Printed pagination not compared"]
      next_step: "Open Hamilton 2006, Sass 1988 and Darnell et al. 2005 and check the dates and signs Haring attributes to them."
      checked: 2026-10-14

