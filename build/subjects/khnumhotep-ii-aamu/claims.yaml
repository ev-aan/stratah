subject: khnumhotep-ii-aamu
title: "The Aamu procession in the tomb of Khnumhotep II at Beni Hasan: what the caption says, and what the Dead Hidden videos say it says"
question: "What does the Aamu scene in tomb BH 3 record, and does it say what the speaker says?"
dig_status: open
headline_status: draft
headline: "A year 6 caption at Beni Hasan counts 37 Aamu; read scholars differ on why they came"
headline_claim: khn-caption-aamu-of-shu-37
search_summary: >-
  The north wall of tomb BH 3 at Beni Hasan shows a group of Aamu (Asiatics) led by a man whose title is rendered 'ruler of a foreign land' or 'ruler of the hill-lands', under a caption dated year 6 of Senusret II.
  Newberry (1893) and Kamrin (2009) read the caption as counting 37 Aamu 'of Shu' and naming eye-paint; Kamrin counts 15 people drawn. The signs themselves were not read here.
  Kamrin lists traders, envoys, migrant workers and metalworkers as readings of why they came. No source read gives a land grant, Goshen or 40 in all.
description: >-
  Second round (2026-10-16) on a first-round dig that rested on translations. Read in full: Kamrin 2009 (peer-reviewed article, 15 pages and 136 notes, open download). Re-read: Newberry 1893 Part I p. 69, with Plates XXXI and XXXVIII looked at at full resolution; Newberry Part II pp. 91-92; the Met API record again; the Ministry page and the ABR article again. Looked at as a picture: Lepsius, Denkmaeler Abt. II Bl. 133.
  Read for the speaker's later claims: Josephus, Against Apion I.14 (Whiston's translation), which quotes Manetho on the Hyksos. Not read: the hieroglyphic signs (no claim here is anchor_checked: primary), Hay, Goedicke 1984, Bietak 2001, Franke 1991, the Kamose stelae, Tell el-Dab'a reports, the Met web page and Open Access page (HTTP 429).
  The speaker's claims are split one assertion per claim in the speaker's wording; the videos are never an anchor.
divergence_note: >-
  The speaker says the wall records Abishai, a Hyksos, with 37 Aamu who came to trade in antimony and animals, that this is the earliest mention of the Hyksos, and that these people were given the best lands and later took the throne peacefully.
  What was read gives this. A caption dated year 6 of Senusret II is read as counting 37 Aamu 'of Shu' with eye-paint (Newberry; Kamrin, who takes the roll from Newberry's facsimile). Kamrin states that fifteen Aamu are drawn, not thirty-seven, and that a smaller group can stand for a larger one.
  The leader's name is read 'Abishai' by Goedicke and Saretta and 'Abisharie' by Schneider and by Kamrin herself, all as reported by Kamrin; Newberry prints 'Ibsha'. His title (heqa khasut) is the word behind 'Hyksos'; Kamrin says it was used from at least the Sixth Dynasty for chieftains from Syro-Palestine and that the Hyksos conquest came more than two hundred years after the scene; the ABR article sees no reason to link this group to the later Hyksos; the Ministry page calls it the oldest known example of the word.
  On purpose, Kamrin lists traders (Klebs, Wilson, Helck, Shea), diplomatic envoys (Hayes, Aufrere), migrant workers (Goedicke), a gift or tribute (her own simplest reconstruction) and others, and writes that no firm conclusion can be drawn. The 'antimony and animals' wording is closest to Newberry's 'stibium'; Kamrin reads the animals as offerings. One sentence of hers cuts against a flat 'nothing says they settled': the families 'imply perhaps' an interest in settling, as she writes many compatriots did in that era.
  No source read mentions Goshen, Avaris in connection with the scene, a count of 40 or three earlier residents, or a throne. Those are statements about the sources read (about 15 pages of Kamrin, one page of Newberry, two short pages and one article), not about the wall. Manetho as quoted by Josephus describes the Hyksos takeover as a conquest 'without our hazarding a battle' followed by burning and killing, and a long war later; it does not mention Beni Hasan.
assessment:
  question: "Does the Aamu scene in tomb BH 3 say what the speaker says?"
  answer: partly
  headline: "A caption counts 37 Aamu with eye-paint in year 6 of Senusret II; the other parts of the speaker's story are not in what was read."
  key_points:
    - "Newberry (1893) and Kamrin (2009) read 37 Aamu of Shu with eye-paint in year 6 of Senusret II. It is one reading, from one facsimile; the signs were not read here."
    - "The title is the word behind 'Hyksos'. Kamrin says it was in use by the Sixth Dynasty; the Ministry calls this the oldest example; ABR sees no link to later Hyksos."
    - "Kamrin lists traders, envoys, migrant workers and metalworkers as readings of the visit. No source read gives a land grant, Goshen, 40 in all or a peaceful throne."
  text: >-
    The count and date rest on a reading of the roll that Newberry made and that Kamrin reproduced from his facsimile; other scholars' renderings (Goedicke, Kessler, Vernus, Staubli, Rabehl) are reported by Kamrin and were not opened. All give 37. The grammar of who brought whom is disputed (khn-caption-who-brought).
    Whether the title makes the leader 'a Hyksos' in the later dynastic sense is kept open with each holder's position stated. The absence statements (land, Goshen, 40, throne) are limited to the sources read and are capped at provisional.
  basis: [khn-caption-aamu-of-shu-37, khn-sp-02d-leader-a-hyksos, khn-sp-03a-first-mention-hyksos, khn-sp-02e-purpose-trade-antimony-animals, khn-sp-03b-best-lands-goshen-avaris, khn-sp-09c-peaceful-ascent-no-wars]
  would_settle: "Reading the caption signs on a photograph or a full-size copy against a modern edition; reading Goedicke 1984 and Bietak 2001 (the sources of Kamrin's statements on the name and on earlier use of the title); the Second Intermediate Period texts and Tell el-Dab'a reports for the later claims."

claims:
  - id: "khn-object-bh3-khnumhotep"
    state: "proposed"
    statement: "The Aamu scene is on the north wall of the main chamber of tomb No. 3 (BH 3) at Beni Hasan, the tomb of the official Khnumhotep (II), in the third register from the top, and it is the scene the speaker means."
    statement_kind: "reported"
    evidence_class: "interpretive"
    confidence: "low"
    evidential_weight: 2
    anchor_checked: "secondary"
    adoption_weight: 1
    adoption_note: "Not measured. Tomb and wall are named alike by Newberry 1893, Kamrin 2009, the Egyptian Ministry page and the Met record locale; none of these is the wall."
    would_change_if: "the wall or a photograph of it is read and the scene is in another tomb, or the owner's name is read differently by a specialist"
    anchor:
      type: "interpretive"
      description: "Newberry 1893 p. 69 heads the description 'North Wall' of Tomb No. 3, names the owner 'Nehera's son Chnemhotep' and places the foreigners in 'Row 3'. Kamrin 2009 p. 22-23: 'the tomb of Khnumhotep II at Beni Hassan (Tomb 3, henceforth BH 3)'; the procession 'occupies the third register of the north wall'. Met API locale 'Tomb of Khnumhotep (Tomb 3)'. Ministry page: 'on the north wall, to the left of the entrance'. These are independent descriptions by a survey memoir, a peer-reviewed article, a museum and a ministry, each reporting the wall. Numbering differs by source and is kept distinct: Lepsius's plate (Abt. II Bl. 133) is labelled 'Grab 2, Nordseite'; the ABR article calls the owner of Tomb Three 'Khnum-Hotep III' ('a modern designation'), where Kamrin makes Khnumhotep III the owner's son."
      sources:
        - "src-newberry-1893"
        - "src-kamrin-2009-fulltext"
        - "src-met-33-8-17-api"
        - "src-egymonuments"
        - "src-lepsius-denkmaeler-ii-133"
        - "src-abr-byers-2009"
      nodes:
        - node: "khnumhotep-bh3-year6-senusret-ii-aamu-caption"
          verb: "supports"
    basis: "Four independent descriptions agree on the tomb number (Newberry's), the wall and the register; none is the wall. Which Khnumhotep the speaker means was taken from the tomb number, not checked."

  - id: "khn-caption-aamu-of-shu-37"
    state: "proposed"
    statement: "Newberry (1893) reads the roll held by the royal scribe in the north-wall scene as: year 6 under Usertsen II, 'the number of Aamu brought by the son of the ha-prince, Chnemhotep, on account of the mesdemet (eye-paint, stibium or kohl), Aamu of Shu, number amounting to 37'; a second caption is read 'arrival bringing kohl which 37 Aamu bring to him'. Kamrin (2009) gives the roll as 'Year 6 ... accounting of the Aamu that the son of the Mayor, Khnumhotep, brought because of mesdemet; being Aamu of Shu, number amounting to thirty-seven', taking it from Newberry's facsimile."
    statement_kind: "reported"
    evidence_class: "interpretive"
    confidence: "low"
    evidential_weight: 2
    anchor_checked: "no"
    adoption_weight: 1
    adoption_note: "Not measured. The 37 and the eye-paint are repeated by the Egyptian Ministry page and the ABR article; repeats are not checks of the wall."
    would_change_if: "the signs are read (Lepsius, Hay, the wall or its photographs) and the numeral, the phrase 'Aamu of Shu' or the verb differ from Newberry's reading, or a modern edition gives another sense"
    anchor:
      type: "interpretive"
      description: "Newberry 1893 p. 69 (OCR in two scans of one printing, read; his transliteration prints the numeral as 'xxxvii', the OCR '87' in one scan is an error; the roll is on Plate XXXVIII fig. 2, looked at at full resolution, signs not read). Kamrin 2009 p. 24, Figure 3 'Newberry's facsimile of Neferhotep's writing board or papyrus', and note 20, which gives Goedicke ('Asiatics of Sw(t): their number-37'), Kessler and Vernus ('compte afferent: 37') as also reading 37 (those works were not opened). Kamrin takes the text 'according to his [Newberry's] facsimile' (p. 24), so her roll reading and Newberry's are one reading, not two. Ministry page 'a delegation of 37 Amu'; ABR 'thirty-seven Asiatics (Aamu)' repeat it. Marked 'no', not 'secondary': the translators work from the same facsimile and the web pages repeat them."
      sources:
        - "src-newberry-1893"
        - "src-newberry-translation"
        - "src-kamrin-2009-fulltext"
        - "src-egymonuments"
        - "src-abr-byers-2009"
      nodes:
        - node: "khnumhotep-bh3-year6-senusret-ii-aamu-caption"
          verb: "supports"
    basis: "# V: p. 69 of Newberry read in both scans on 2026-10-14 and again 2026-10-16; Kamrin pp. 24 and 33 (note 20) read in full on 2026-10-16.\nSays what Newberry printed and what Kamrin reproduced. The signs themselves were not read here."

  - id: "khn-caption-who-brought"
    state: "contested"
    statement: "Who 'brought' the Aamu in the roll's wording is read differently. Newberry: the number of Aamu 'brought by the son of the ha-prince, Chnemhotep'. Kamrin's own rendering allows 'he brought thirty-seven Aamu' or 'which thirty-seven Aamu brought to him'. Goedicke divides the line so that the Egyptian officials come to bring eye-paint and 'he (the foreign leader) has brought 37 Aamu'. Who the 'son of the Mayor, Khnumhotep' is also differs: Newberry the tomb owner himself, Goedicke the official Neferhotep, Franke the owner's son Khnumhotep III."
    statement_kind: "reported"
    evidence_class: "interpretive"
    confidence: "low"
    evidential_weight: 1
    anchor_checked: "no"
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "the signs of the caption are read and the grammar of the verb and its subject is argued by a specialist read directly (Goedicke 1984, Vernus 1989, Kessler 1987 were not opened)"
    disputed_by:
      - who: "P. E. Newberry 1893"
        kind: "person"
        position: "'brought by the son of the ha-prince, Chnemhotep'; Chnemhotep is the tomb owner (Newberry p. 69)"
        source_read: "yes"
        via: "Internet Archive scan"
      - who: "Hans Goedicke 1984, as reported by Kamrin note 18 and p. 25"
        kind: "person"
        position: "'Coming about bringing (procuring) black eye-paint' refers to the two Egyptian officials, and 'He (the foreign leader) has brought 37 Aamu'; the 'son of the Mayor' is Neferhotep"
        source_read: "no (via Kamrin only)"
        via: "Kamrin 2009 note 18, p. 25 and note 48"
      - who: "Detlef Franke 1991, as reported by Kamrin p. 25"
        kind: "person"
        position: "the son of the Mayor is Khnumhotep III"
        source_read: "no (via Kamrin only)"
        via: "Kamrin 2009 p. 25 and note 49"
      - who: "Janice Kamrin 2009"
        kind: "person"
        position: "gives both 'he brought thirty-seven Aamu' and 'which thirty-seven Aamu brought to him'; calls Franke's suggestion 'certainly a valid one' but says the original reading of the tomb owner 'is still a good possibility'"
        source_read: "yes"
        via: "full text PDF"
    anchor:
      type: "interpretive"
      description: "Kamrin 2009 p. 24 (her two renderings), p. 25 (the son of the Mayor: Newberry, Goedicke, Franke) and note 18 (p. 32; the renderings of Newberry, Goedicke, Kessler, Vernus, Rabehl and Staubli). Newberry 1893 p. 69. The alternatives by the other authors were not opened; their wording here is Kamrin's report of them."
      sources:
        - "src-kamrin-2009-fulltext"
        - "src-newberry-1893"
    basis: "Kamrin's note 18 lists six translators who differ on this line. A disagreement on the verb's subject changes whether the leader brought the group, which bears on the speaker's 'came to Egypt' wording."

