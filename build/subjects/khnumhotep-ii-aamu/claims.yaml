  - id: "khn-scene-context-inw-symbolic"
    state: "proposed"
    statement: "Kamrin reads the Aamu procession as both a record of a specific event in year 6 and a symbolic scene. On the north wall it sits among scenes of the delivery of 'inw' to the tomb owner as a royal delegate; and, because foreigners in such settings stand for the chaotic world, these armed, peaceful foreigners 'are no longer completely foreign'."
    statement_kind: "judgment"
    evidence_class: "interpretive"
    confidence: "low"
    evidential_weight: 2
    anchor_checked: "no"
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "a specialist read directly (Kessler 1987, Rabehl 2005 and 2006) argues the scene is only symbolic or only historical"
    anchor:
      type: "interpretive"
      description: "Kamrin 2009 pp. 29-31: the precise date on the writing board 'suggests that a specific event' is represented (p. 27); the wall's scenes are 'clearly part of the bringing of inw to Khnumhotep II' (p. 29); Kessler sees the wall as an allusion to the New Year's festival and Rabehl as the owner's loyalty to the royal house (p. 29, notes 105-106, not opened); the scene is unique and shows foreigners bearing arms, which 'is unusual in Egyptian monumental art' (p. 31). Her abstract and conclusion say the symbolic levels 'neither conflict with nor detract from its historic value'. One author's interpretation, reported here."
      sources:
        - "src-kamrin-2009-fulltext"
    basis: "One article, with the positions of Kessler and Rabehl reported through it."

  - id: "khn-lepsius-plate-133"
    state: "proposed"
    statement: "Lepsius's Denkmaeler (Abt. II, Bl. 133) carries a coloured copy of the Aamu procession under the label 'Benihassan, Grab 2, Nordseite', published in 1849-1859 (the date range in the Internet Archive item description), with a short hieroglyphic caption over the leaders; Newberry (1893) says his Plate XXXI is a copy 'after Hay', an earlier copyist."
    statement_kind: "reported"
    evidence_class: "interpretive"
    confidence: "low"
    evidential_weight: 2
    anchor_checked: "no"
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "the plate is compared with the wall and found to differ, or the signs of its caption are read and differ from Newberry's"
    anchor:
      type: "interpretive"
      description: "Looked at as a picture on 2026-10-16: PDF denkmaeler-4.pdf page 55 of the Internet Archive item 'denkmaler-aus-aegypten-und-aethiopien' (sha256 775768304034b681332d18cc94436479e803fd7ce74b586677526a2bf71b7a66), printed marks 'Altes Reich Dyn. XII', 'Benihassan. Grab 2. Nordseite.' and 'Abth. II Bl. 133.'. Newberry Plate XXXI is headed 'The Aamu Group' and its contents list reads '(P.E.N, after Hay)'. Kamrin note 16 lists Newberry's Plates XXX, XXXI and XXXVIII.1, a reprint of Lepsius's Denkmaeler (1984, cited by figure number, not Bl. 133) and Wilkinson 1847 pl. XII among the published copies. The signs on the plate were not read. 'Grab 2' is Lepsius's numbering and is not the same number as Newberry's 'Tomb No. 3'; the plate was matched by its subject."
      sources:
        - "src-lepsius-denkmaeler-ii-133"
        - "src-newberry-1893"
        - "src-kamrin-2009-fulltext"
    basis: "Establishes that independent 19th-century copies exist and where to read the signs; it does not read them."

