subject: khnumhotep-ii-aamu
title: "The Aamu procession in the tomb of Khnumhotep II at Beni Hasan: what the caption says, and what the Dead Hidden videos say it says"
question: "What does the Aamu scene in tomb BH 3 record, and does it say what the speaker says?"
dig_status: open
headline_status: draft
search_summary: >-
  The north wall of tomb BH 3 at Beni Hasan shows a group of Aamu led by a man with a title read as ruler of a foreign land, dated to year 6 of Senusret II.
  A 1893 translation reads a count of 37 and eye-paint (stibium). Pages read agree on 37, but the wall itself was not read here. Nothing read says they were given land, settled or became rulers.
description: >-
  First dig on this scene. Read: Newberry 1893 (Beni Hasan Part I, two scans, p. 69 and Plates XXVIII to XXXI looked at), the Met API record and image for facsimile 33.8.17, the Egyptian Ministry page, the ABR article and the Kamrin abstract.
  Blocked or not opened: the Met web page (HTTP 429), the journal page of Kamrin 2009 (bot page) and a PDF mirror (403), Lepsius, Hay, Newberry Part II. The speaker's claims are split into separate parts and kept in the speaker's wording; the videos are never an anchor.
divergence_note: >-
  The speaker says the wall records Abishai, a Hyksos, with 37 Aamu who came to trade in antimony and animals, that this is the earliest mention of the Hyksos, and that these people were given the best lands and later took the throne peacefully.
  The sources read say less: a caption dated year 6 of Senusret II counts 37 Aamu of Shu bringing eye-paint, led by a man whose title is the root of the word Hyksos (two pages read) but whom a third page (ABR) says there is no reason to link to the later Hyksos.
  Nothing read mentions land, Goshen, Avaris, a count of 40, three earlier residents, trade or a throne. The gap between the wall's wording and the speaker's story is the product. The signs themselves are unread.
assessment:
  question: "Does the Aamu scene in tomb BH 3 say what the speaker says?"
  answer: partly
  headline: "The count of 37 and the eye-paint match a 19th-century translation; the Hyksos, trade, land and throne parts are not in anything read."
  key_points:
    - "A 1893 translation reads 37 Aamu of Shu bringing eye-paint in year 6 of Senusret II; three pages read repeat the 37."
    - "The leader's title is the root of the word Hyksos per two pages; a third says no link should be made with the later Hyksos."
    - "Land grants, Goshen, Avaris, 40 in all and a peaceful accession appear in no source read."
  text: >-
    The count and the date rest on a translation by Newberry (1893) and on pages that repeat it. The signs on the wall were not read by this dig. Whether the title makes the leader a Hyksos in the dynastic sense is kept open with named positions.
  basis: [khn-caption-aamu-of-shu-37, khn-sp-02d-leader-a-hyksos, khn-sp-03b-best-lands-goshen-avaris]
  would_settle: "Reading the caption signs on a photograph or a full-size copy against a modern edition, reading Kamrin 2009 in full, and opening the Second Intermediate Period texts."

