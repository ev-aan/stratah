  - id: "khn-count-vs-figures"
    state: "proposed"
    statement: "The caption number is 37 but the group drawn shows fifteen people. Kamrin: 'there are fifteen Aamu represented here, not thirty-seven; of these only twelve are adult'; the group is eight men, four women, three children and two donkeys. She adds that a smaller group commonly stood for a larger one and that it is 'still unclear' how many were in the full group: 37 people, or 37 men plus families."
    statement_kind: "reported"
    evidence_class: "interpretive"
    confidence: "low"
    evidential_weight: 2
    anchor_checked: "no"
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "a high-resolution image of the wall is counted by a specialist and differs from Kamrin's count, or a source read argues for a full group of a different size"
    anchor:
      type: "interpretive"
      description: "Kamrin 2009 pp. 23-24: the group 'of eight men, four women, three children, and two donkeys'; 'fifteen Aamu ... not thirty-seven; of these only twelve are adult'; the practice of a smaller group standing for a larger one (note 22, Shea 1981, not opened); Goedicke's point that the word Aamu is determined by a male figure, so 37 men plus families is possible, 'perhaps well over one hundred' (p. 24; note 23: 'four or five times as many'; not opened); 'no firm conclusion can be drawn'. This dig also looked at Newberry's Plate XXXI (after Hay) and Lepsius's plate Bl. 133 and the figures look to agree with Kamrin's numbers; that is a look by the dig session, not a count made by a person and not the basis. Round 1's 'difference not explained' is out of date: Kamrin explains it and leaves the full size open."
      sources:
        - "src-kamrin-2009-fulltext"
        - "src-newberry-1893"
        - "src-lepsius-denkmaeler-ii-133"
    basis: "One article's count, with the other scholars' positions reported through it. The difference between 37 and 15 does not show the 37 is wrong."

