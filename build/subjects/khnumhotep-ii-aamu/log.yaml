subject: khnumhotep-ii-aamu
# Append-only. Corrections are new entries; earlier entries are never edited.
log:
  - id: L-01
    date: 2026-10-14
    entry: >
      DIG OPENED from a handoff written by another agent (khnumhotep-ii-aamu.yaml). Its object identification (Beni Hasan tomb 3, Aamu procession, Newberry Beni Hasan I) was an unverified guess; it was matched, not verified (khn-object-bh3-khnumhotep, secondary).
      Five Dead Hidden speaker claims (dh-K3pw12lBcXM-02, -03; dh-qL1VmGF3BF8-07, -08, -09) were split into separate parts, each carrying the speaker's wording unchanged, plus a bracketed label saying which part is tested. Wording was checked against ~/dead_hidden_claims/*.yaml.
      No headline is published (headline_status draft). Owner rules applied from the start: books, translations, museum pages and videos are claims on the same footing; none is primary data; nothing here is anchor_checked: primary.
  - id: L-02
    date: 2026-10-14
    entry: >
      WHAT WAS OPENED AND READ. (1) Newberry, Beni Hasan Part I (1893): Internet Archive item gri_33125001148937 (Getty/Griffith copy), OCR text sha256 c591a436...; and a second scan, benihasan00grifgoog (Google scan), OCR sha256 e3c8fc87...:
      p. 69 (the Aamu passage, in both scans), Editor's Preface and Newberry's Preface. Page images n171 to n176 of the first scan were looked at (n171, n173, n175 are blank tissue guards or faint plates; n172 is Plate XXIX, n174 Plate XXX with the north wall, n176 Plate XXXI 'The Aamu Group', after Hay); sha256 of n176 is 9ba782efd7b7f7c590a5c3ca1f0d8a38f0c6c823a40f603d5e61f126fe0ab670. The page images are cited by URL only and not stored.
      (2) Metropolitan Museum of Art Open Access API object 544548 (JSON) and the image DT272586.jpg (stored; sha256 6f5645f9...; the record says isPublicDomain true). A second, larger image of the same object (33.8.17_EGDP012884.jpg) was downloaded and looked at but not stored. (3) The Egyptian Ministry of Tourism and Antiquities page on the tomb, raw HTML. (4) Gary Byers, Associates for Biblical Research, raw HTML. (5) The abstract page for Kamrin 2009 on egyptianexpedition.org, raw HTML.
      The signs on the Met facsimile and on Newberry's plates were looked at as pictures; this dig did not read hieroglyphs, so no claim has anchor_checked: primary. The text-layer of the Newberry scans shows '87' for '37' in one scan (an OCR error; the other scan and the roll's numeral 'xxxvii' agree). Page views through the fetch tool are summaries by a small model; where a quotation is used it was checked against the raw HTML saved by curl.
  - id: L-03
    date: 2026-10-14
    entry: >
      WHAT WAS BLOCKED OR NOT OPENED. Met web page for 33.8.17 (https://www.metmuseum.org/art/collection/search/544548): HTTP 429 twice; not retried further, not bypassed; its description text was not read (a search summary quoted it, which is a lead only). The Met Archives page on Jacob S. Rogers: HTTP 429; seen only through a search summary.
      Kamrin 2009 full text: the journal page (journals.librarypublishing.arizona.edu) returned an Anubis 'Access Denied' bot page; a scispace PDF mirror returned HTTP 403 (CloudFront); academia.edu copies were not opened (login wall expected). Not bypassed.
      Not opened at all: Lepsius, Denkmaeler II (the 19th-century copy of the wall); Hay's manuscripts (British Library Add. MS 29813, 29847); Newberry Part II p. 21 (indexed 'Aamu, people of'); Beni Hasan Parts III to V; Madain Project page; Wikipedia and mirrors (never used); any Hyksos or Second Intermediate Period work (Ryholt, Bietak, Mourad); Manetho/Josephus; the Kamose stelae; Tell el-Dab'a reports; a modern hieroglyphic edition of the captions.
      Web-search summaries were used only to find pages; nothing in them is cited as read.
  - id: L-04
    date: 2026-10-14
    entry: >
      WHO FUNDED AND CONTROLLED THE WORK (traced as far as read; the rest is stated as UNRESEARCHED). Newberry 1893: published 'under the auspices of the Egypt Exploration Fund'; the Survey party was 'sent out by the Committee of the Egypt Exploration Fund'; Newberry was on the Fund's staff; F. Ll. Griffith edited and was Superintendent of the Survey; Miss Amelia B. Edwards (late Honorary Secretary) and Prof. R. Stuart Poole are thanked; the preface mentions 'early support' for the Survey without naming supporters; the series list says 'to Subscribers'; permits came from the Director-General of the Administration of the Antiquities of Egypt. Publisher: Kegan Paul, Trench, Truebner and Co. NOT traced: individual subscribers or donors, control of the Fund's Committee, what the authors stood to gain, who paid the printing.
      Met facsimile: credit line 'Rogers Fund, 1933' (read in the API). What that fund is came only from a search summary of an unopened page (a 1901 bequest by a locomotive manufacturer): a lead. Funding and control of the Met's 1931 Egyptian Expedition: UNRESEARCHED. Davies's own position: not researched.
      Egyptian Ministry page: a state body; the page's author and sources are unnamed: UNRESEARCHED. ABR: the article's publisher is Associates for Biblical Research; its funders and governance were not read: UNRESEARCHED (the page returned no funding statement to the fetch tool). Kamrin 2009: author's institution, funders and the journal's publisher: UNRESEARCHED; the website egyptianexpedition.org: owner not established.
  - id: L-05
    date: 2026-10-14
    entry: >
      WEIGHING. Supported at a secondary level only (weight 2 or less): the wall and tomb (khn-object-bh3-khnumhotep); the roll's count of 37 Aamu of Shu bringing eye-paint in year 6 (khn-caption-aamu-of-shu-37, khn-sp-02a, -07a, -08a); the leader's title meaning a foreign ruler (khn-sp-02c).
      Kept open as contested, with named positions: the leader's name spelling (khn-name-form), the title's translation (khn-title-translation), the date in BCE (khn-date-year6-bce), whether the leader is 'a Hyksos' (khn-sp-02d), the purpose of the visit (khn-sp-02e), the lineage to the 15th Dynasty (khn-sp-07c-lineage-15th-dynasty) and a peaceful accession (khn-sp-09c).
      Searched gaps (absence in the sources read, not in the world): priority of the Hyksos mention (khn-sp-03a, -07c), land grants, Goshen and Avaris (khn-sp-03b, -09a), 'Aamu of the Hyksos' (khn-sp-07b), 40 in all with three already there (khn-sp-08b), growth in wealth (khn-sp-09b).
      Nothing is called refuted: the signs were not read and the speaker's basis may lie outside the tomb. What the sources read do not contain is not the same as what the wall does not contain.
      OBSERVATION: the caption counts 37, but Plate XXXI (after Hay) shows about 15 people by one count (khn-count-vs-figures); the difference is recorded, not explained. Newberry's 'brought by the son of the ha-prince, Chnemhotep' differs from the speaker's 'came to Egypt'.
      Two read sources disagree on the Hyksos link: the Ministry page says the title is the oldest known example of the word Hyksos; the ABR article says it is the root of the word but that there is no reason to link this group to the later Hyksos. Neither is a specialist reading from the signs.
  - id: L-06
    date: 2026-10-14
    entry: >
      WHERE THE FACTS END (best of current knowledge, to the extent this dig read). Known from what was read: a printed translation of the wall's captions (Newberry 1893), repeated in part by two web pages, and a public-domain facsimile image of two leaders. Not known here: what the signs say; the exact title and its grammar; the name's vocalisation and meaning; where Shu was; the absolute date; why the group came; whether the 37 includes the leader; what became of them; any link to the 15th Dynasty. Next steps: Lepsius Denkmaeler II 133 and Hay for the signs; Kamrin 2009 in full; Newberry Part II p. 21; the Met description; a specialist treatment of heqa khasut; Tell el-Dab'a reports.
  - id: L-07
    date: 2026-10-16
    entry: >
      ROUND 2 (a builder agent fixing the dig after an independent review of PR #31; not an independent review itself). WHAT WAS OPENED AND READ.
      (1) Kamrin, 'The Aamu of Shu in the Tomb of Khnumhotep II at Beni Hassan', Journal of Ancient Egyptian Interconnections 1(3), pp. 22-36: the PDF at the journal's download address (sha256 08a5698b...; md5 722be958dfe565c52baf966de10097bb, equal to the checksum on the journal page), all 15 pages and notes 1-136 read as extracted text; the journal page (html sha256 60256e96...) read for author, affiliation, dates and licence. Notes 20, 51 and 52 read as printed; the works they cite were not opened.
      (2) Newberry, Beni Hasan Part I: both OCR texts re-downloaded and matched to the round-1 hashes (c591a436..., e3c8fc87...); p. 69 re-read; full-resolution images of the plates downloaded and Plate XXXI and the top of Plate XXXVIII viewed (hashes in the manifest).
      (3) Newberry, Beni Hasan Part II, pp. 91-92, OCR of two scans (22c8520c..., 4b344cdc...): the sentence calling Aamu a designation of the tribes north-east of Egypt and of the Asiatics, and saying those figured in the tomb of Khnemhotep II 'had perhaps wandered into the desert between the Nile and the Red Sea'.
      (4) Lepsius, Denkmaeler Abt. II Bl. 133, looked at as a picture (Internet Archive file denkmaeler-4.pdf, sha256 77576830..., page 55). (5) Josephus, Against Apion I.14, Whiston translation (Gutenberg, sha256 b6791c01...), quoting Manetho on the Hyksos. (6) The Met API record again (sha256 ead767dd...), the Ministry page and the ABR article again (hashes in the manifest).
      WHAT WAS BLOCKED OR NOT OPENED. Met web page 544548 and Met Open Access policy page: HTTP 429 on 2026-10-16; a web.archive.org copy of the policy page returned 403 and was not retried. The Thesaurus Linguae Aegyptiae returned a script-driven page without a record. Not opened: Hay, Goedicke 1984, Bietak 2001, Franke 1991, Saretta 1997, Schneider 1998, Kessler 1987, Vernus 1989, Ryholt, Mourad, the Kamose stelae, Tell el-Dab'a reports, Newberry's index entry 'Aamu, people of'. The hieroglyphs were not read by this dig on any plate, so no claim carries anchor_checked: primary.
  - id: L-08
    date: 2026-10-16
    entry: >
      CORRECTIONS TO EARLIER ENTRIES (new entry; L-02 to L-06 are not edited). (a) L-03 and the manifest said the Kamrin full text was blocked. It was readable: a plain request to the journal's own download address returned the PDF. Round 1's request carried a browser-like User-Agent string and met an Anubis bot page; the CloudFront 403 was a different mirror. Nothing was bypassed in round 2. (b) L-04 and the manifest listed 'what the authors stood to gain' as an untraced item. That is a motive question no source read raises; it is withdrawn and removed from the manifest. (c) L-04 and the manifest repeated a search-snippet line about the Rogers Fund (a locomotive manufacturer's bequest). It was never read from a page; removed from the manifest and not to be relied on. (d) L-05 said of the Ministry page and the ABR article, 'Neither is a specialist reading from the signs.' No page read says who wrote the Ministry text; the statement is withdrawn. The manifest's 'advocacy-aligned organisation' for ABR had no page behind it and was removed. (e) L-06 listed as not known: where Shu was, the name's meaning, the title's earlier use and the 37 against the 15 figures. Kamrin gives positions on each (claims khn-sp-07a-aamu-of-shu, khn-name-form, khn-sp-03a-first-mention-hyksos, khn-count-vs-figures). (f) L-02 recorded the sha256 of Plate XXXI as 9ba782ef...; that is of a 1110 x 1500 rendering; the full-resolution file is a907de49.... (g) L-05 and claim khn-name-form said nothing read gives 'Abishai'; Kamrin reports it as Goedicke's and Saretta's reading. (h) Round 1 did not record that the ABR article names the owner of Tomb Three 'Khnum-Hotep III' and gives 'Shut ... may have been located in modern Jordan'; both are now recorded.
  - id: L-09
    date: 2026-10-16
    entry: >
      WEIGHING, ROUND 2. No claim id was renumbered or removed. Three claim ids are new: khn-caption-who-brought, khn-scene-context-inw-symbolic, khn-lepsius-plate-133. Changes to states and weights, with reasons.
      anchor_checked lowered from secondary to no on khn-caption-aamu-of-shu-37, khn-leader-title-and-name, khn-name-form, khn-title-translation, khn-date-year6-bce, khn-sp-02a, -02b, -02c, -02d, -02e, -07a, -08a and khn-met-facsimile-exists: Newberry and Kamrin read the roll from the same facsimile (Kamrin says so on p. 24), later pages repeat them, and the other translators Kamrin lists were not opened; the museum record is one source. khn-object-bh3-khnumhotep stays secondary because a survey memoir, a peer-reviewed article, a museum record and a ministry page independently place the scene on the north wall of tomb 3.
      State changes: khn-sp-03a and khn-sp-07c-earliest from searched_gap to contested (a read source, Kamrin, states an earlier use of the title; the Ministry page states the opposite; neither is checked against a list of attestations); khn-sp-02b and khn-sp-07a from proposed to contested (positions now named). khn-sp-07c-lineage-15th-dynasty and khn-sp-09c now carry absence_anchor: true, because their support rests partly on no source linking the groups or describing a peaceful accession. Every absence claim names the sources searched and says the searches are of text, not of the wall.
      Adoption weights: all set to 1 with the note 'Not measured'. Round 1 gave 2 and 3 from two web pages and the speaker's videos; no adoption measure was read. Evidential and adoption weights stay separate.
      Wording: 'not in anything read' in the round-1 divergence note, headline and key points is replaced by statements keyed to claims and to the scope of the reading. Round 1's key point 2 gave the title as the root of 'Hyksos' per two pages; it now gives each holder's position, including Kamrin's.
  - id: L-10
    date: 2026-10-16
    entry: >
      IMAGE RIGHTS. The stored copy of Met image DT272586.jpg (sha256 6f5645f9...) was not byte-identical to the file the Met serves today (1a80c663...). The Met's web page and Open Access policy page could not be read (HTTP 429), and the API's rightsAndReproduction field is empty, so the terms of reuse are not known from a page. The stored copy was removed from the repository (git rm) and the node khnumhotep-bh3-aamu-facsimile-met-1931 was bumped to rev 2 without a media block, with a history entry. The image is linked at the holder's server. Kamrin's article is 'All rights reserved' (journal page); it is quoted in short fragments, and nothing from it is stored. The Newberry, Lepsius and Josephus texts were not stored either; they are cited by URL with hashes.
  - id: L-11
    date: 2026-10-16
    entry: >
      WHERE THE FACTS END, ROUND 2 (best of current knowledge, to the extent this dig read). Known from what was read: one peer-reviewed article gives a detailed description of the scene, the renderings of the roll and the leader's caption, and the positions of about fifteen named scholars on the Aamu's home, the name, the title and the purpose; it takes the roll from Newberry's facsimile and counts fifteen figures. Not known here: what the signs say (no plate was read at sign level); the grammar of 'brought'; the earlier attestations of the title behind Kamrin's note 51; the full size of the group; where Shu was; what became of the group; any link to the 15th Dynasty; the Met's reuse terms. Next steps: Goedicke 1984 and Bietak 2001; Lepsius Bl. 133 and Newberry Plate XXVIII at sign level against a modern edition; Hay's copy; the Kamose stelae and Tell el-Dab'a reports for the later claims; the Met's Open Access terms. Funders and controllers of the Egypt Exploration Fund, the Met expedition, ABR, the Ministry text and the journal remain UNRESEARCHED tasks.
  - id: L-12
    date: 2026-10-16
    entry: >
      FIX ROUND after an independent review of commit ca6ebde (builder agent; new entry, earlier entries not edited). (1) The assessment headline said the other parts of the speaker's story were not in what was read; that overstated. The Abishai name (Goedicke, Saretta via Kamrin), 'foreign ruler', the trade reading (Klebs, Wilson, Helck, Shea, ABR) and the title behind 'Hyksos' are all in sources read. The headline now says only that no source read gives a land grant, Goshen, 40 in all or a peaceful throne. (2) khn-sp-08b added to the assessment basis. (3) L-09 and claim khn-object-bh3-khnumhotep said the identification of the wall stays 'secondary' on independent descriptions. Independence is not shown (Kamrin cites Newberry for BH 3; the origin of the Ministry text and the Met locale field is not stated), so it is now 'no'; L-09's sentence on that claim is superseded. The clause 'and it is the scene the speaker means' was removed from that claim and filed as a separate speaker claim, khn-sp-scene-identification; 'from the top' was removed (Kamrin says 'third register', Newberry 'Row 3'). (4) Bundled speaker claims were split into single assertions, old ids kept for the first assertion: 03b (best lands) with new khn-sp-03b-goshen and khn-sp-03b-avaris; 08b (40 in all) with new khn-sp-08b-three-already-there; 09a (given the best lands) with new khn-sp-09a-settled; 09b (multiplied) with new khn-sp-09b-strong and khn-sp-09b-wealthy; 09c (peacefully ascended) with new khn-sp-09c-no-rebellions-or-wars. (5) The Avaris statement in round 2 ('appears only in the Manetho quotation in Josephus') was wrong. Kamrin names Avaris in a Bietak title in note 62, and Tell el-Dab'a in notes 62, 67 and 75, as comparanda. Josephus Against Apion I section 14 has Manetho saying a Hyksos king rebuilt Avaris; on a second pass over the lines naming Avaris in sections 26-28 (read in this fix round, not the whole work), Manetho says a king granted Avaris to the lepers and impure people, a different group; none is tied to Beni Hasan. The anchors now say which parts of Josephus were read. (6) The manifest title of the lead entry src-newberry-part2-lepsius-hay was tidied to list only what is still unopened. (7) Headline reworded: 'A year 6 caption at Beni Hasan counts 37 Aamu; scholars offer several reasons for their visit'.
