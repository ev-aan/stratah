# Sources for the khnumhotep-ii-aamu dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Books, translations, museum pages and videos are all claims here, on the same footing. The primary data is the wall of tomb BH 3 itself,
# its photographs, squeezes and facsimiles. Nobody on this dig saw the wall. The signs on the Met facsimile and on Newberry's plates were looked at
# as pictures but were NOT independently read, so no claim carries anchor_checked: primary.
# Tests were run in this session (2026-10-14), which is not an independent review.
# Only one image is stored (Met 33.8.17, marked public domain by the holder). Everything else is cited by URL.
retrieved: 2026-10-14
sources:

  - id: src-newberry-1893
    title: "P. E. Newberry, Beni Hasan, Part I (Archaeological Survey of Egypt, edited by F. Ll. Griffith; London: Kegan Paul, Trench, Truebner and Co., 1893), p. 69 and Plates XXVIII to XXXI"
    url: https://archive.org/details/gri_33125001148937
    document_class: "interpretive: a survey memoir with the author's own copies, transliteration and translation. Author, editor, publisher and funders: see provenance (partly traced, mostly UNRESEARCHED)"
    read: "yes, directly: Internet Archive OCR text (sha256 c591a436a0b5f409730d6f538324950f16c85845bc2b9f5369bd4915bdf1ba93) lines for p. 69, the Editor's Preface and Newberry's Preface; page images n171 to n176 looked at (Plates XXVIII to XXXI). A second scan of the same work (benihasan00grifgoog, a Google scan, OCR sha256 e3c8fc87dc2a25d11d0c1dd24d1dcf5e52d819a54a217840761178398182d92a) was read for the same lines."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: >-
        Title page read in the OCR: "Published under the auspices of the Egypt Exploration Fund", London, sold by Kegan Paul, Trench, Truebner & Co. and at the Society's offices, 1893; edited by F. Ll. Griffith;
        plans by G. Willoughby Fraser. Newberry's preface (read) says the Survey party was "sent out by the Committee of the Egypt Exploration Fund" and reached Beni Hasan on 25 November 1890,
        and thanks the late Honorary Secretary Miss Amelia B. Edwards, Prof. R. Stuart Poole, H. A. Grueber, W. M. F. Petrie and F. Ll. Griffith. The Editor's Preface (read) thanks the Director-General of the Administration
        of the Antiquities of Egypt for permits. The preface refers to "those through whose early support the Survey was made possible" without naming them. The scanned copy carries a Corcoran Gallery of Art
        stamp and a Getty Center Library stamp (read in the OCR); the holder of the scan is not otherwise recorded here.
      funding_and_control: >-
        Traced as far as read: the work was issued under the Egypt Exploration Fund, whose Committee sent out the party (Newberry's preface); Griffith edited and was Superintendent of the Survey; Newberry was on the Fund's staff ("since his appointment on the staff of the Egypt Exploration Fund").
        NOT traced: who paid the Fund's subscribers' money into the Survey, any individual donors, who controlled the Fund's Committee, what Newberry or Griffith stood to gain, and who funded the printing and the publisher. UNRESEARCHED.
        The "Subscribers" in the series list (First Memoir "to Subscribers 1890-91") shows a subscription model; no list of subscribers was read.
      tests:
        - "Title page, year and publisher read in the OCR (could have failed)"
        - "The Aamu passage (37, Aamu of Shu, Abesha) was read in two separate scans of the book and the two agree (OCR '87' in one scan is '37' in the other and in the roll's numeral 'xxxvii'; could have failed)"
        - "Plate XXXI is headed 'The Aamu Group' and the contents list says '(P.E.N., after Hay)', so the group drawing is a copy of Hay's earlier copy, not Newberry's own tracing (read)"
        - "The two leaders on Plate XXXI (a man with an ibex and a man with a gazelle) match the two men on the Met 1931 facsimile by a different artist (looked at; could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["OCR: transliteration signs are mangled in the text layer; the hieroglyphic captions were not read from the plates", "Newberry's original tracings were unavailable even to the Editor (Editor's note)", "Part II p. 21, indexed under 'Aamu, people of', was not opened", "Hay's manuscripts (British Library Add. MS 29813, 29847) were not seen", "Lepsius Denkmaeler not opened"]
      next_step: "Read the captions on Plates XXVIII and XXX at full resolution against Lepsius, Denkmaeler II, and a modern edition."
      checked: 2026-10-14
    notes: "The scan is a 1893 print of a 19th-century copy: a translation and a copy, not the wall."

