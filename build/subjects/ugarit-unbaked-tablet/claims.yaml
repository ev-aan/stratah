    state: established
    statement: 'Astour (1965, p. 254) wrote that the lot contained "locally made Ugaritic translations" of incoming letters, and that "Two letters written by Ugaritic officers may be the originals, delivered unbaked and put into the oven for better preservation."'
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured (1 is the lowest value, not a measurement)."
    would_change_if: "the printed journal reads differently, or an earlier source is found in which 'unbaked' was said of these tablets"
    anchor:
      type: primary_text
      description: >-
        Astour 1965, p. 254, second column, read in the JSTOR scan (src-astour-last-days). He does not name the two letters. He writes "may be", so the suggestion is his inference, not a finding. The clay of the tablets is not discussed in the article. This is the earliest dated source in this dig that uses
        the word 'unbaked' of oven-lot tablets; the speaker's source for the word is not known.
      sources: [src-astour-last-days]
    basis: "# V: read 2026-10-16. A claim about Astour's wording. It is not evidence that any tablet was unbaked; see ugarit-no-clay-examination-reported."

