subject: ugarit-unbaked-tablet
title: "The Ugarit 'unbaked tablet in an oven' story: which tablet, which date, and what survives of the oven detail"
question: "Was a cuneiform tablet pleading for help against ships found unbaked in an oven at a destroyed city in about 1150 BC, and does that show the attack was too swift to bake it?"
dig_status: open
headline_status: draft
headline: "The Ugarit oven-and-unbaked-tablet story has been revised by the scholars read"
search_summary: >
  The story is usually tied to letters from the Bronze Age city of Ugarit (Ras Shamra, Syria) about enemy ships. Two scholars read here
  say the 'found in an oven' detail has been revised: Cline says scholars have shown the ship letter was not found in a kiln; Caubet says the oven picture
  'had to be revised' and the tablets from it do not date to the very end of the city. No tablet, image or excavation report was seen. Which tablet is meant, its date
  and the Bible/Hittite part of the speaker's claim are unresolved.
description: >
  First dig on the speaker claim dh-oXit2KG1N1s-25. Read: Cline 2014 (publisher's sample PDF of the Prologue), Caubet (chapter in a 2003-era volume, third-party mirror), a CDLI catalogue
  entry (P282588). Blocked or not opened: Ugaritica V (Internet Archive lending, 401), Astour (403), Halayqa (403), the Met essay (429 bot check), and the works Caubet cites for the oven revision
  (Yon 1992, Millard 1995, Calvet 1990, Singer 1987). Nothing here is primary data. The handoff's guess (RS 18.147 / RS 20.18) is not confirmed or refuted.
divergence_note: >
  The speaker says a tablet pleading for help against ships was found unbaked in an oven, showing the attack was so swift the tablet was not even baked, at a destroyed city in 1150 BC.
  Both authors read say the oven picture was a first impression that later work revised, and Caubet adds that the tablets cannot be dated to the very end of the city. The two authors
  also describe the oven differently (Cline: a kiln with over seventy tablets, a letter to Cyprus; Caubet: an oven in a royal-palace courtyard, a letter from the Hittite king to Ammurapi),
  so more than one tablet and findspot may be in play. The gap between the story and what the books now say is the product. The signs, images, inventory numbers and excavation
  reports have not been seen.

assessment:
  question: "Was a cuneiform tablet pleading for help against ships found unbaked in an oven, showing the attack was too swift to bake it?"
  answer: unsettled
  headline: "Unsettled. The two scholars read say the oven detail was later revised, and no tablet or excavation report was seen."
  text: >
    Everything here comes from two books and one catalogue entry, all of which are claims, not the object. Cline (2014) says the ship letter was first reported found in a kiln with more than seventy other tablets, and that scholars have since shown it was not found in a kiln.
    Caubet says the picture of the last batch of tablets in a palace oven had to be revised. They describe different findspots and letters, so the speaker's single tablet may combine more than one. The date 1150 BC is not supported by anything read; the Ugarit letters
    are tied to the reign of its last king by Caubet, and one of her cited scholars (Singer 1987) places some ship letters much earlier. We keep these open.
  key_points:
    - "Both scholars read say the 'found in an oven' picture was revised; neither is the excavation report, which was not read."
    - "The authors describe different ovens, findspots and letters, so which tablet the speaker means is not settled."
    - "The date 1150 BC is not supported by the sources read, and at least one scholar dates the 'menacing boats' letters earlier."
  basis: [ugarit-sp-found-unbaked-in-an-oven, ugarit-ship-letters-exist]
  would_settle: "The excavation reports and Ugaritica V for the exact RS numbers, findspots and states of baking, plus Yon 1992 and Millard 1995 on the oven revision, and photographs of the tablets."

