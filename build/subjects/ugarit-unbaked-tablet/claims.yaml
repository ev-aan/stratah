      description: >-
        Boyes 2021 pp. 237-238: "around 1195-1185", most scholars "towards the later end"; Yon (1992, 119-120) suggests 1195-1185, using the letter RS 86.2230 from the Egyptian vizier Bay, "at the height of his political powers 1197-1192". Cline 2021 p. 107: "usually dated to 1190-1185 BC, though technically it could have been even later" (the letter from Bay predates his execution "in 1191 BC"). Saade 2011 note 135: Courtois (1974) 1180/1175; Yon (1997) c. 1190/1185 (the OCR also prints a figure for Freu that reads '1995', which cannot be a date here; to be checked in print); p. 88 dates RS 86.2230 "vers 1195". RSO XI 1995: Callot and Yon (p. 167) "1190/1180", de Tarragon (p. 206) "1195-1185", the editors' Avant-propos (p. 12) "vers 1180", Millard (p. 122) "early in the twelfth century B.C.". Caubet 2003 p. 19:
        Freu dates the Bay letter to Siptah's fifth year, 1193. The date of the letter (Freu, 1193; Saade, c. 1195) and the date of Bay's execution (Cline, 1191) are different events and are kept apart here.
      sources: [src-boyes-2021, src-cline-2021, src-saade-2011, src-rso-xi-1995, src-caubet-sym]
