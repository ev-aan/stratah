        For the last years of Ugarit: Astour 1965 pp. 254-255 ("belong to the very last years of Ugarit's existence"; the Alashia letters show "the first stage of the Sea Peoples' invasion"); Boyes 2021 p. 249 (RS 20.238 "from Ugarit's final years"); Saade 2011 pp. 91-92; Lebrun 1995 p. 86. Hedged: Cline 2021 p. 107 ("not clear whether it dates to the final days of Ugarit or to some slightly earlier period"); Caubet 2003 p. 18 (the 1956 "Letter from the General" and
        "other letters from the same archives mentioning 'menacing boats' ... may not necessarily be dated to the end of the city and the reign of its last king, Ammurapi"); Arnaud (RSO VII p. 11), as given by Saade p. 84 note 136 (the 'oven' tablets and part of the Rapanu archives could date from Ammurapi's reign). Earlier: Singer (1987), as reported by Caubet p. 18: he places the 'menacing boats' letters in the situation of the Amarna letters under Amenophis III, which Caubet writes as the "15th century b.c.e." (the century as printed
        was not checked against Singer). Singer 1987 and 1999 were not read. Caubet does not number the 'menacing boats' letters; whether RS 20.238 is among them is not stated.
      sources: [src-astour-last-days, src-boyes-2021, src-saade-2011, src-rso-xi-1995, src-cline-2021, src-caubet-sym]
      nodes: [{node: ugarit-1956-letter-from-the-general-found-house-of-rapanu, verb: qualifies}]
    positions:
      - {label: "The letters belong to the last years of Ugarit under Ammurapi", holder: "Michael C. Astour (1965); Philip J. Boyes (2021) for RS 20.238", ground: "Content of the letters (troops in the Hittite lands, ships in Lycia) read against the end of the kingdom."}
      - {label: "Not clear whether the letter belongs to the final days or slightly earlier", holder: "Eric H. Cline (2021, p. 107)", ground: "The findspot revision removed his earlier ground for the final days."}
      - {label: "The 'menacing boats' letters need not belong to the end of the city", holder: "Annie Caubet (2003, p. 18)", ground: "They name no officials or kings."}
      - {label: "The 'menacing boats' letters belong to the Amarna age", holder: "Itamar Singer (1987), as reported by Caubet", ground: "Singer's argument was not read."}
    disputed_by:
      - {who: "Itamar Singer", kind: person, position: "dates the menacing-boats letters to the Amarna age", source_read: false, via: "reported by Caubet 2003 p. 18; not read"}
      - {who: "Annie Caubet", kind: person, position: "the letters need not date to the end of the city", source_read: true, via: "Caubet 2003 p. 18"}
      - {who: "Eric H. Cline", kind: person, position: "not clear whether the ship letter dates to the final days", source_read: true, via: "Cline 2021 p. 107"}
    basis: "# V: read 2026-10-16. The 'menacing boats' letters (Caubet) and RS 20.238 (Cline, Astour) may or may not be the same set; the sources read do not say. Singer's position is attributed to him only as Caubet reports it."

  - id: ugarit-oven-lot-not-the-last-tablets
    state: contested
    statement: "It is disputed whether the Court V 'oven' tablets are the last tablets of Ugarit."
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured (1 is the lowest value, not a measurement). No author read says this claim is widely repeated."
    would_change_if: "Hawley et al. 2008 and Yon 1992 are read and give a dated sequence for the lot"
    anchor:
      type: scholarly-positions
      description: >-
        Caubet 2003 p. 17 describes the older picture as an oven "containing the last batch of cuneiform tablets" and says the tablets "do not date to the very end of the city, although they cannot be dated much earlier". Millard 1995 p. 119: the "oven tablets" have "no more claim to be called 'the last tablets of Ugarit' than the many other groups found in the palace or in other buildings". Saade 2011 p. 332: "il n'y a aucune raison de dire que ce sont les dernières tablettes de la Cité [the OCR text reads 'Gite'], car de nombreux autres lots ont été trouvés". Liverani 1995 p. 115 n. 13 records the doubts "sur la datation des tablettes retrouvées à cet endroit". Arnaud (RSO VII p. 11), as given by Saade p. 84 note 136:
        the 'oven' tablets might date from Ammurapi's reign. The Hawley, Malbran-Labat and Roche-Hawley abstract (HAL, 2008) says the article attempts "une tentative de caractérisation et de datation des textes de ce lot" and gives no result.
      sources: [src-caubet-sym, src-rso-xi-1995, src-saade-2011, src-hal-hawley-2008]
    positions:
      - {label: "The oven lot is the last batch of tablets", holder: "the older picture described by Caubet 2003 p. 17 (holder named by Millard as Schaeffer's reading, p. 119)", ground: "Schaeffer's report; not read."}
      - {label: "The oven lot has no better claim to be last than other groups", holder: "Alan Millard (1995, p. 119)", ground: "Many other groups were found in the palace and other buildings."}
      - {label: "The lot does not date to the very end but not much earlier", holder: "Annie Caubet (2003, p. 17)", ground: "Cites Calvet 1990, Yon 1992 and Millard 1995."}
      - {label: "The lot might date from Ammurapi's reign", holder: "Daniel Arnaud (RSO VII p. 11), as given by Saade p. 84 note 136", ground: "Arnaud's text was not read."}
    disputed_by:
      - {who: "Alan Millard", kind: person, position: "no more claim to be the last tablets than other groups", source_read: true, via: "RSO XI 1995 p. 119"}
      - {who: "Annie Caubet", kind: person, position: "not from the very end of the city", source_read: true, via: "Caubet 2003 p. 17"}
    basis: "# V: read 2026-10-16."

  # ================= The Hittite line =================

  - id: ugarit-sayce-1888-hittite-critic-and-reply
    state: established
    statement: 'Sayce wrote, in the second edition (1890) of a book whose preface is dated October 1888, that "Nearly forty years ago a distinguished scholar" had called the mention of Hittite kings in Second Kings 7:6 of "unhistorical tone", and that "Recent discoveries have retorted the critic''s objections upon himself."'
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured (1 is the lowest value, not a measurement)."
    would_change_if: "the printed edition reads differently from the Gutenberg text and the Internet Archive scan read"
    anchor:
      type: primary_text
      description: >-
        Sayce, The Hittites: The Story of a Forgotten Empire, 2nd ed. (1890; preface dated October 1888), chapter I, printed pp. 11-12; Gutenberg text read and the first two paragraphs compared with the Internet Archive scan of the 1890 edition (src-sayce-1890). A public-domain extract is stored at sources/sayce-1890-ch1-extract.txt.
        The book is by an Oxford professor of philology; the title page names the Religious Tract Society as publisher. No effect of author or publisher on the quoted sentences is claimed. The critic is not named in the pages read. This is a claim about what Sayce wrote; it says nothing about Ugarit, which was first excavated in 1929.
      sources: [src-sayce-1890]
    basis: "# V: Sayce 1890 read (chapter I opening and the preface), 2026-10-16, with the stored extract."

