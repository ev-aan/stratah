  - id: ugarit-sp-attack-so-swift-tablet-not-baked
    state: contested
    statement: '"showing the attack was so swift the tablet was not even baked" (speaker claim dh-oXit2KG1N1s-25, as stated).'
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 4
    adoption_note: >-
      Basis read: Cline (2014 p. 10) says the story of a sack before the letter could be dispatched "has since been repeated in textbooks"; Cline (2021 p. 107) says "repeated over and over". Authors' statements, not a count.
    would_change_if: "the findspot is re-established from the excavation records as a working kiln with unbaked tablets in a destruction layer dated to the final attack"
    anchor:
      type: scholarly-positions
      description: >-
        Astour (1965, p. 254): "the palace employees had no time to take these tablets from the oven to the archives", which he calls "eloquent testimony to the suddenness of the final catastrophe". Cline (2014, p. 10): the excavators and other scholars
        "initially surmised that the enemy ships had returned and sacked the city before the urgent request for assistance could be dispatched"; he says scholars have shown the tablet was not in a kiln and that it "was probably a copy of a letter that had been dispatched to Cyprus after all"
        (his notes were not in the sample). Yon, as reported by Boyes (2021, p. 266), sees at Ugarit "evidence of surprise and haste" in overturned tripods and equipment; that bears on the city, not on this tablet. Yon 1992, as reported by Millard (1995, p. 119 n. 3), suggested that the
        Court V deposit was made after the sack of the palace. The inference needs the oven, the unbaked clay and the identity of the tablet, each addressed in its own claim. Closer to Astour's destruction-time reading is the account in ugarit-court-v-tablets-came-from-upper-floor, in which the tablets fell during the fire (Calvet and Yon 1997, as given by Saade pp. 199 and 332; Boyes p. 125); that account still removes the oven and the unbaked clay.
      sources: [src-astour-last-days, src-cline-2014, src-boyes-2021, src-rso-xi-1995]
    positions:
      - {label: "The attack was so swift that tablets in the oven were not taken to the archives", holder: "Michael C. Astour (1965, p. 254)", ground: "Inference from his oven reading."}
      - {label: "The letter was probably a copy of one that had been dispatched", holder: "Eric H. Cline (2014, p. 10)", ground: "Stated; his basis is in notes not seen."}
      - {label: "The Court V deposit was made after the sack of the palace", holder: "Marguerite Yon (1992, p. 119), as reported by Millard 1995 p. 119 n. 3", ground: "Yon 1992 was not read."}
      - {label: "The tablets fell from the upper floor during the destruction and the fire (see ugarit-court-v-tablets-came-from-upper-floor)", holder: "Calvet (1990) and Yon (1997), as given by Saade 2011 pp. 199, 332; Boyes 2021 p. 125", ground: "Neither Calvet nor Yon was read; this reading puts the deposit at the time of the destruction but gives no oven and no unbaked clay."}
    disputed_by:
