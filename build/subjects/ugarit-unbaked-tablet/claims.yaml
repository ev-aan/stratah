      - {who: "Marguerite Yon", kind: person, position: "deposit after the sack, as reported", source_read: false, via: "Millard 1995 p. 119 n. 3"}
    basis: "# V: read 2026-10-16. The inference stands or falls with the oven, the unbaked clay and the identity of the tablet. Astour is the only author read who draws it from the oven; Yon's evidence of haste at the site is recorded in ugarit-yon-surprise-and-haste-evidence."

