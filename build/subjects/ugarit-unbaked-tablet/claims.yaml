subject: ugarit-unbaked-tablet
title: "The Ugarit 'unbaked tablet in an oven' story: which tablet, which date, and what survives of the oven detail"
question: "Was a cuneiform tablet pleading for help against ships found unbaked in an oven at a destroyed city in about 1150 BC, and does that show the attack was too swift to bake it?"
dig_status: open
headline_status: draft           # the headline claim is contested at low confidence and rests on authors read, not on the excavation reports; it cannot be published as a finding yet
headline_claim: ugarit-court-v-oven-not-a-tablet-oven
headline: "Calvet (1990, as quoted) and authors from 1995 reject Ugarit's palace 'tablet-baking oven'"
search_summary: >
  The story is usually tied to letters from the Bronze Age city of Ugarit (Ras Shamra, Syria) about enemy ships. The 'oven for baking tablets' was Claude Schaeffer's reading of a find in Court V of the royal palace
  (campaigns of 1954 and 1955). Calvet (1990, known only as quoted) and the authors read from 1995 on say it was not a tablet-baking oven. The ship letter usually quoted (RS 20.238) carries a 1956-campaign number and is absent
  from the Court V oven lists read; Cline's 2021 edition places it in Court V on two pages and in the House of Rapanu on another; no source read states its findspot. Ugarit's destruction is dated about 1195 to 1175 BC by the authors read, not 1150. No excavation report, edition or photograph was opened.
description: >
  Second round (rebuild after the review of PR #36). Read in full or in the passages named: Astour 1965 (journal article), the 1995 colloquium volume Ras Shamra-Ougarit XI (Millard, Lombard, Lebrun and others), Saade 2011, Boyes 2021 (open access),
  Cline 2014 (publisher sample) and 2021 (a copy of the revised edition), Caubet 2003, and Sayce 1890 (public domain). Not opened: the excavation reports (Schaeffer, Ugaritica IV and V; Virolleaud, PRU V), Yon 1992, Calvet 1990 and Margueron 1995
  (Persee PDFs refused, HTTP 403), the HAL full texts (bot check), Singer, Hawkins. Every statement here about a tablet comes from a book or article about it, not from the signs or the object.
divergence_note: >
  The speaker says a tablet pleading for help against ships was found unbaked in an oven, showing the attack was so swift the tablet was not even baked, at a destroyed city in 1150 BC.
  Calvet (1990, as quoted) and the authors read from 1995 on say the Court V 'tablet oven' reading was revised, and none reports the clay of any tablet as unbaked; the word 'unbaked' appears in the sources read only in Astour's 1965 suggestion that two letters may be unbaked originals.
  The ship letter quoted by Cline is numbered RS 20.238, a 1956-campaign number, and is absent from the oven-lot lists read (RS 18.x and 19.x, from 1954 and 1955); Cline's 2021 edition places it in Court V on pp. 107 and 140 and in the House of Rapanu on p. 101; no source read states its findspot. The authors read date the destruction of Ugarit between about 1195 and about 1175 BC.

assessment:
  question: "Was a cuneiform tablet pleading for help against ships found unbaked in an oven, showing the attack was too swift to bake it?"
  answer: unsettled
  headline: "Unsettled. The authors read reject the tablet-baking oven and report no unbaked clay; the ship letter's findspot is not stated by any source read, and no excavation report was opened."
  text: >
    The 'oven for baking tablets' was Schaeffer's reading of a find in Court V of the Ugarit palace (campaigns of 1954 and 1955). His own report (Ugaritica IV, 1962) was not read. The authors read who write after the site was re-examined
    (Calvet 1990 as quoted, Millard and Lombard 1995, Saade 2011, Boyes 2021) say the find was not a tablet-baking oven; they differ on what it was (burnt debris, a bread oven, or an oven built by squatters after the palace was abandoned).
    Astour (1965) wrote that two letters may be unbaked originals, and that is the only place the sources read use the word 'unbaked'. No source read reports the baking state of any tablet. The ship letter that Cline quotes is numbered RS 20.238 (Ugaritica V no. 24)
    in the sources read, a 1956-campaign number, and it is absent from the oven-lot lists read (RS 18.x and 19.x); that absence is provisional because the lists are not complete inventories. Cline's 2021 edition places the letter in the House of Rapanu on p. 101 and in Court V on pp. 107 and 140. No source read states its findspot. The destruction of Ugarit is dated by the authors read
    between about 1195 and about 1175 BC. Whether the letter dates to the last days of the city is itself disputed. Claims about the speaker's wording are held as searched gaps or contested; none is established.
  lean:
    toward: "No, not as the story is told"
    short: "no"
    strength: slight
    because: "Calvet (1990, as quoted) and the authors read from 1995 on reject the tablet-baking oven (claim ugarit-court-v-oven-not-a-tablet-oven), and no source read reports an unbaked tablet (claim ugarit-no-clay-examination-reported)."
    caveats: "All of this comes from books and articles about the find. Schaeffer's report, Calvet 1990, Yon 1992 and Margueron 1995 were not read, the authors read share those works as their basis, and no source read states the findspot of the ship letter (Cline 2021 gives two). A lean is not a finding."
  key_points:
    - "Calvet (1990, as quoted) and the authors read from 1995 (Millard, Lombard, Saade, Boyes) reject the 'tablet-baking oven'; Schaeffer's report was not read."
    - "'Unbaked' appears only in Astour's 1965 'may be'; no source read reports the baking state of any tablet."
    - "RS 20.238 has a 1956-campaign number and is absent from the oven lists read; Cline places it in Court V; the destruction is dated about 1195-1175 BC."
  basis:
    - ugarit-court-v-oven-not-a-tablet-oven
    - ugarit-schaeffer-tablet-oven-interpretation
    - ugarit-astour-1965-two-letters-may-be-unbaked-originals
    - ugarit-no-clay-examination-reported
    - ugarit-rs-number-mapping
    - ugarit-cline-2021-gives-two-findspots
    - ugarit-ship-letter-not-in-listed-oven-lot
    - ugarit-destruction-date-estimates
  rated_claim: ugarit-court-v-oven-not-a-tablet-oven
  would_settle: "Schaeffer's report (Ugaritica IV, 31-37), Calvet 1990 and Margueron 1995 read in full; Ugaritica V no. 24 with its findspot note; a museum record or photograph of the tablet that shows its clay; and a dated destruction layer for Court V."

