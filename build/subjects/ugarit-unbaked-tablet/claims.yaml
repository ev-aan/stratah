  # ================= The earliest dated version found: Astour 1965 =================

  - id: ugarit-astour-1965-oven-lot
    state: established
    statement: 'Astour (1965, p. 254) wrote that the Ugaritic letters of the 18th and 19th campaigns most relevant to the last days of Ugarit "belong to the lot found in an oven for baking tablets", and he listed among "the tablets from the oven" PRU V nos. 60 (RS 18.38), 61 (RS 18.147), 62 (RS 18.148), 63 (RS 18.40) and 65 (RS 18.75).'
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured (1 is the lowest value, not a measurement)."
    would_change_if: "the printed journal reads differently from the JSTOR scan read, or the pages quoted are found to be misread"
    anchor:
      type: primary_text
      description: >-
        Astour, American Journal of Archaeology 69.3 (1965) 253-258, read in full in a JSTOR scan (src-astour-last-days). The oven lot is introduced on p. 254 ("the lot found in an oven for baking tablets--the first implement of this kind ever discovered. All the tablets of this lot are incoming letters.").
        The numbers are given where each letter is discussed: PRU V no. 61 = RS 18.147 (p. 255); no. 62 = RS 18.148, no. 60 = RS 18.38 and no. 65 = RS 18.75 (p. 256); no. 63 = RS 18.40 (pp. 256-257). On p. 258 he says that PRU V no. 14 (RS 19.11) "does not belong to the lot found in the oven". The text layer is OCR: transliterated Ugaritic is garbled, the English prose and numbers were read.
        This is a claim about what Astour wrote, not that the tablets were in an oven.
      sources: [src-astour-last-days]
    basis: "# V: Astour 1965 read in full, 2026-10-16. Astour had read the proofs of PRU V (his note 14), so his account depends on the excavators' reports and Virolleaud's volume, none of which was read here."

