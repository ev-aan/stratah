  # ================= Schaeffer's reading and its revision =================

  - id: ugarit-schaeffer-tablet-oven-interpretation
    state: proposed
    statement: "Claude Schaeffer, the excavator, interpreted a find in Court V of the Ugarit royal palace (campaigns of 1954 and 1955) as an oven in which a lot of tablets was being baked."
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "Basis read: see ugarit-sp-found-unbaked-in-an-oven (authors' statements that the story was widely repeated; no count)."
    would_change_if: "Schaeffer's report (Ugaritica IV 1962, pp. 31-37 and fig. 38; the title is quoted by Lombard) is read and says something different"
    anchor:
      type: scholarly-positions
      description: >-
        Four authors read describe Schaeffer's reading; Millard, Lombard and Saade each cite his report directly (Saade also paraphrases and cites Millard, and Cline 2021 note 25 cites Millard, so the descriptions are not fully independent): Millard (1995, p. 119: found in 1954 "in the remains of an oven where they had been in the process of being baked"; Schaeffer saw the tablets arranged "in superimposed circles with a large one at the top"), Lombard (1995, p. 228 and note 9, quoting the title of Schaeffer's
        1962 article "Un four pour la cuisson des tablettes", pp. 31-37), Saade (2011, p. 332: Schaeffer "avait considéré qu'il y avait là un four pour la cuisson des tablettes", after finding two small walls at the south-west corner of the basin), Cline (2014 p. 10; 2021 pp. 10, 107: "kiln"). The counts differ and are not reconciled: Millard writes of over
        one hundred and fifty tablets and fragments (157 on p. 121), Cline of "more than seventy other tablets". Schaeffer's report itself was not read.
      sources: [src-rso-xi-1995, src-saade-2011, src-cline-2014, src-cline-2021, src-ugaritica-iv]
    basis: "# V: the four describing authors were read; Schaeffer was not. Millard, Lombard and Saade (who cites Schaeffer 1962d directly) are the independent descriptions; Saade also paraphrases Millard and Cline cites him. They agree on what the report says; they are not evidence that the report is right."

  - id: ugarit-court-v-oven-not-a-tablet-oven
    state: contested
    statement: "Calvet (1990, as quoted by others) and the authors read from 1995 on hold that the Court V find was not an oven for baking tablets."
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 3
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured (1 is the lowest value, not a measurement). No author read says this claim is widely repeated."
    would_change_if: "Schaeffer's report, Calvet 1990, Margueron 1995 and Coquinot et al. 2008 are read and the excavation evidence supports a tablet-baking oven, or fails to support the revisions"
    anchor:
      type: scholarly-positions
      description: >-
        Authors read, each with the page. Millard 1995 p. 119: "archaeologists now affirm that there was no oven, the tablets simply lay in burnt debris", "no evidence for a tablet-baking process at Ugarit"; his note 2 says J. Lagarce and J. Margueron "informed again the Colloquium that the oven did not exist" and quotes Calvet 1990 (Syria 67, p. 40 n. 2): the analysis of the
        zone "rend caduque l'interprétation de ce four comme destiné à cuire des tablettes". Lombard 1995 p. 228: "un four a effectivement existé" at the south-west corner of the basin, "sans doute construit par des squatters peu après l'abandon du palais", so the oven is later than the tablets' deposit. Saade 2011 p. 199: Calvet (1990, 39-40) says the documents fell from the upper floor and the
        oven was "sans doute d'un fannour pour la cuisson du pain"; p. 332: Yon (1997, 45-46), as quoted by Saade, calls the baking-oven hypothesis "séduisante" but says it meets "difficultés indéniables" and "ne résiste pas à l'examen" (her own judgment); she adds that "l'existence même d'un four en cet endroit ... est mise en doute par certains" (her report of others' doubt, not her own claim). Boyes 2021 pp. 124-125: "Even if there was an oven (which is doubtful), the tablets were not placed within it for firing", citing Margueron 1995a and Coquinot et al. 2008. Caubet 2003 p. 17: the picture
        "had to be revised". Cline 2021 p. 107: "it was not found in a kiln after all". The Coquinot et al. abstract (HAL) says a new analysis led Margueron "à réfuter la thèse de C. Schaeffer" and that the authors' own study of the objects "nous a conduits à émettre une nouvelle hypothèse" (not stated in the abstract). Not independent: all rest on Calvet 1990, Yon 1992 and 1997, and Margueron 1995, none read in full.
      sources: [src-rso-xi-1995, src-saade-2011, src-boyes-2021, src-caubet-sym, src-cline-2021, src-hal-coquinot-2008, src-persee-syria-67]
    positions:
      - {label: "No oven; the tablets lay in burnt debris", holder: "Alan Millard (1995, p. 119), reporting J. Lagarce, J. Margueron and Calvet", ground: "Colloquium discussion and Calvet 1990 n. 2, as he reports."}
      - {label: "An oven existed, built by squatters after the palace was abandoned; it was not a tablet-baking oven", holder: "Pierre Lombard (1995, pp. 228-229)", ground: "His reading of the context Schaeffer described and of a later collapse of the upper floor; Calvet's field observations (p. 229 n. 10)."}
      - {label: "A bread oven; the documents fell from the upper floor", holder: "Yves Calvet (1990), as summarised by Saade 2011 p. 199", ground: "Calvet 1990 was not read."}
      - {label: "The baking-oven hypothesis does not withstand examination; the tablets fell with the wall and ceiling (she reports, separately, that some doubt any oven existed)", holder: "Marguerite Yon (1997, 45-46), as quoted by Saade 2011 p. 332", ground: "Yon 1997 was not read."}
      - {label: "An 'over-imaginative interpretation'; most likely an overturned basket of tablets; any oven doubtful", holder: "Philip J. Boyes (2021, pp. 124-125)", ground: "He cites Margueron 1995a and Coquinot et al. 2008."}
    disputed_by:
      - {who: "Claude Schaeffer", kind: person, position: "tablets in an oven for baking them", source_read: false, via: "described by Millard, Lombard, Saade and Cline; Ugaritica IV not read"}
    basis: >-
      # V: Millard, Lombard, Saade, Boyes, Caubet and Cline read; the works they rely on were not. The authors differ on what the structure was (no oven, a bread oven, an oven built after abandonment), so 'no tablet oven' is not one position. No author read since 1990 defends the baking-oven reading; Schaeffer's reading is described only by others, and the excavation records are needed to decide between the later accounts.

