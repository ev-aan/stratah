# Sources for ugarit-unbaked-tablet (rules A1-A10, build/SCHEMA.md).
# Round 1 retrieved 2026-10-14; round 2 (rebuild after the PR #36 review) retrieved 2026-10-16, both by a Stratah dig agent (not an independent review).
# NO photograph, squeeze, hand copy or sign-level edition of any tablet was seen, and the excavation reports (Schaeffer; Ugaritica IV and V; PRU V) were not opened.
# What WAS read in round 2: one 1965 journal article (Astour), the 1995 colloquium volume Ras Shamra-Ougarit XI (Millard, Lombard, Lebrun and others), a 2011 book by Saade, a 2021 open-access book by Boyes,
# two editions of Cline's book (the 2014 publisher sample and a copy of the 2021 revised edition), Caubet's 2003 chapter, and a public-domain book of 1890 (Sayce).
# Third-party copies of printed books (dokumen.pub, ancientportsantiques.com, the Internet Archive) are copies of the printed volumes. They are access paths, not the works. Nothing copyrighted is stored in the repository.
# The only file stored here is a public-domain extract (sources/sayce-1890-ch1-extract.txt).
# Funding and control: stated per source where a page read states it; otherwise "not stated in the pages read".
retrieved: 2026-10-16
