  - id: L-07
    date: 2026-10-16
    entry: >
      WHAT WAS READ IN ROUND 2 (hashes in sources/MANIFEST.yaml). (1) Astour, AJA 69.3 (1965), 253-258, in full, in a JSTOR scan: the pre-revision oven account, the RS and PRU V numbers, the 'may be unbaked' suggestion. (2) Ras Shamra-Ougarit XI (1995), a scan of the printed volume: Millard 'The last tablets of Ugarit' pp. 119-124 in full
      (including note 2 quoting Calvet 1990 and note 3 citing Yon 1992), Lombard pp. 227-229, Lebrun p. 86, Liverani p. 115 n. 13, the date statements of Callot and Yon, de Tarragon and the editors, and the Avant-propos on funding. (3) Saade, Ougarit et son royaume (IFPO 2011), the passages on the Court V tablets (pp. 199, 331-333), the Akkadian letters (pp. 91-92), the campaign table (pp. 26-27), the
      start of the excavation (pp. 19-21). (4) Boyes, Script and Society (Oxbow 2021, open access), pp. 124-125, 237-238, 241, 249, 264-266. (5) Cline, 1177 B.C., the 2014 Prologue sample again and a copy of the 2021 revised edition (Prologue, chapters Four and Five, notes, and the passage on the Hittites at pp. 31-32). (6) Caubet 2003 again, with page locators. (7) Sayce, The Hittites (1890), chapter I, in the Gutenberg text, checked against the Internet Archive scan;
      a verbatim extract is stored. (8) Abstracts from the HAL API for Coquinot et al. 2008 and Hawley et al. 2008. (9) CDLI P282588 again. Searches for the words oven, kiln, four, Court V, the RS numbers and the destruction dates were run over the texts of (2) to (6). Nothing was bypassed.
