      STATUS. No review.yaml was written and the subject is not added to `publish`. headline_status stays draft: the headline claim (ugarit-court-v-oven-not-a-tablet-oven) is contested at low confidence and rests on authors read, not on the excavation reports. No claim is established except the four that state what one document says (Astour three, Sayce one) and none of them is evidence about the tablets. The taxonomy entry is proposed in
