    date: 2026-10-16
    entry: >
      BLOCKED OR NOT OPENED IN ROUND 2. Ugaritica V and the Internet Archive item that is presumably Ugaritica IV (Schaeffer's 'Un four pour la cuisson des tablettes', pp. 31-37): HTTP 401, 'access-restricted-item: true' in the item metadata (lending library); not bypassed. Persee: the Syria 67 issue page was read; the PDF of Calvet's 'Bassins du palais royal d'Ougarit' (pp. 31-42)
      returned HTTP 403 and was not obtained by another route. HAL full texts of Coquinot et al. and Hawley et al.: a 'Making sure you're not a bot' page (Anubis); no attempt was made to pass it. Halayqa (UF 42): HTTP 403. Met Museum essay: HTTP 429. Web-search tool results were used only to find URLs and are not reads. Not located in an open copy: Yon 1992 and 1997, Margueron 1995a (Syria 72), Singer 1987 and 1999, Hawkins 1995, Nougayrol 1955, 1956 and 1968,
      Virolleaud PRU V (1965), Beckman 1996, Bryce 2005. The Ras Shamra Tablet Inventory database (OCHRE) was not queried. No photograph, hand copy or museum record of any tablet was seen, so no image rights question arose. The speaker's video was not watched.
  - id: L-09
    date: 2026-10-16
    entry: >
      CORRECTIONS TO ROUND 1 (new entry; L-01 to L-05 are not edited). (a) L-03 and the first manifest listed Astour 1965 as blocked (HTTP 403 on 2026-10-14); the same URL downloaded on 2026-10-16 and the article was read in full. (b) L-01 says the handoff was split into six parts; five speaker lines exist in claims.yaml and they are the five kept. (c) Round 1 said Cline and Caubet 'describe different ovens'; both describe the Court V find; Caubet names a letter of the Hittite king to Ammurapi as part of it
      (Astour, Millard and Saade number it RS 18.38) and Cline names the Cyprus letter, and the number lists in Astour, Millard and Saade put RS 18.38 in the oven lot and RS 20.238 in the 1956 campaign (ugarit-ship-letter-not-in-listed-oven-lot, ugarit-cline-2021-gives-two-findspots). (d) Round 1 called the 'menacing boats' letters in Caubet 'independent' of Cline's letter; the sources do not show that Cline's letter is among them, and all depend on Nougayrol's edition, so the claim was reworded and anchor_checked set to 'no' (F9). (e) The handoff note was removed from every anchor (F4); it remains in the manifest and the transmission chain as the origin of the speaker's lines.
      (f) Adoption weights that were 3 to 5 with the note 'not measured' were set to 1 with the note 'Not measured (1 is the lowest value, not a measurement)'; adoption weight 3 or 4 is kept only where an author read says the oven story or the revision is widely repeated, and the note quotes the basis (F5). A position holder named without a source read ('the common popular and textbook placement') was replaced by holders read (F5). (g) ugarit-ship-letters-dating-contested no longer states one side as fact (F6). (h) Round 1 L-04 repeated details of the Schaeffer expedition's support from a
      search-result summary that was not opened; those details are not used. Funding facts that are stated in pages read are now in the ugarit-fund-* claims, including the correction that Caubet's volume is Eisenbrauns 2003, edited by Dever and Gitin, from the Albright/ASOR Centennial Symposium (F7). (i) The 'recalled, not read' point about the order of Hittite discoveries was removed from the claim's next step (F8) and is a lead only: the speaker's link between the Hittites and the Ugarit tablet was searched for in the passages named in ugarit-sp-modern-science-doubted-biblical-hittites and not found.
      (j) The divergence note's phrase 'the gap ... is the product' was replaced by a plain statement of the two differences (F11). (k) The date-1150 and Bible/Hittite search records now carry absence_anchor: true. (l) The transmission chain now includes the earliest dated version found (Astour 1965) and no longer dates the speaker's repetition by the handoff note (F10). (m) A search-result summary seen in round 2 matched RS 18.147 with Ugaritica V no. 24; the works read give RS 20.238 as no. 24 and RS 18.147 as PRU V no. 61, so the summary was not used.
  - id: L-10
    date: 2026-10-16
    entry: >
      LEADS, NOT READ AND NOT USED AS EVIDENCE. (1) Caubet's 'Letter from the General' (found 1956, House of Rapanu) and Astour's note 2 (RS 20.33, 'unpublished', a war report from a Ugaritic commander tied to the Hitto-Egyptian war and Qadesh in 1299) may be the same letter; neither text says so. If they are, that letter would date to the Qadesh war, not to the end of Ugarit; this needs Nougayrol's reports or Izre'el and Singer's edition. A search-result snippet put RS 20.33 at Ugaritica V no. 20; it was not read. (2) Hawkins 1995, p. 58, cited by Caubet for the oven picture in 'seminal works'.
      (3) Cline's notes 22 and 25 (2021 edition) cite Schaeffer 1962: 31-37, Nougayrol et al. 1968: 87-89, Millard 1995: 119, Singer 1999: 705, van Soldt 1999: 32 and Yon 2006: 44 for the kiln statement; each is a route to the findspot of RS 20.238. (4) Cline's 2014 notes 24 and 25. (5) Caubet writes that Singer places the menacing-boats letters under Amenophis III 'in the 15th century b.c.e.'; the century as printed was not checked. (6) Liverani (RSO XI) writes on how and when Ugarit ended and is cited by Millard's colloquium; not read.
      (7) The speaker's source for the words 'oven' and 'unbaked' is unknown; Astour 1965 is the earliest dated source found that uses 'unbaked'.
