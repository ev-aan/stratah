      OPEN TASKS ON FUNDING AND CONTROL (nothing here is a finding). Not stated in the pages read: funding of Astour's article, of Cline's two editions (acknowledgements of the 2021 edition were not read), of the Ras Shamra campaigns of 1954 to 1956, of Schaeffer's reports, of CDLI, and of the speaker's channel. To do: read the acknowledgements of Cline 2021; read the mission-funding notes in Schaeffer's campaign reports and in Yon's account of the programme 1978 to 1993 (RSO XI, pp. 16-17, read only for the sentence on the Commission des fouilles and the publishing series); find out who owns the speaker's channel.
      Funders named in pages read (ERC for Boyes; CNRS and the Ministry of Foreign Affairs for RSO XI and Saade; ASOR, a USIA grant and foundations for the Caubet symposium) are recorded as facts in the ugarit-fund-* claims. No effect of any funder on any statement is claimed.
