assignments:
  ugarit-unbaked-tablet:
    area: archaeology_texts
    areas: [history, media_misinformation]
    types: [is_claim_true, did_it_happen, origin]
    popular_claims: true
# Why: the dig is about a cuneiform tablet and its findspot (archaeology and ancient texts), about the end of a Bronze Age city (history), and about a story repeated in textbooks and videos
# (media). The questions are whether a widely shared claim is true, whether the event happened as told, and where the 'unbaked in an oven' detail began.
