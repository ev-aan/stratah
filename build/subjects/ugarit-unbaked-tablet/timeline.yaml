# Timeline data for the Ugarit 'unbaked tablet' dig. YAML is the source of truth; the diagram is generated by build/tools/render_timeline.py.
# The renderer cannot draw years before the common era, so the BC dates (the destruction of Ugarit, about 1195-1175 BC; the Sea Peoples' defeat in 1177 BC; the letters
# of Bay, 1193-1191 BC) are given in the detail text of the events they affect, with their claims (ugarit-destruction-date-estimates).
# Every dot is a claim about a record, drawn from a book or article about the excavation; none is from an excavation report.
# Sources that were read only in third-party copies of copyrighted works are cited by their print details (publisher, ISBN) and carry no link here; the copies are listed as access paths in sources/MANIFEST.yaml.
timeline:
  id: ugarit-unbaked-tablet
  title: "The Ugarit oven story: excavation, first report, revision (1879 to 2021)"
  as_of: "2026-10-16"
  note: >
    Dates are from the authors read, not from the excavation reports. Campaign dates are from Saade's table (2011). Dates of publications are the years the authors cite. Hollow or dashed dots are single-source or cited-only.
    The Court V oven lot is listed under RS 18.x and 19.x numbers (campaigns of 1954 and 1955). RS 20.238 has a 1956-campaign number and is absent from the oven lists read (a provisional absence); Cline 2021 places it in Court V and in the House of Rapanu; no source read states its findspot.
panels:
  - id: long
    title: "Panel A: 1878 to 2022 (one tick per ten years)"
    start: "1878-01-01T00:00:00Z"
    end:   "2022-12-31T00:00:00Z"
    tick_years: 10
    lanes: [hittites, dig, account, revision]
  - id: dig
    title: "Panel B: the three campaigns, October 1954 to November 1956 (one tick per six months)"
    start: "1954-07-01T00:00:00Z"
    end:   "1957-01-01T00:00:00Z"
    tick_hours: 4380
    lanes: [dig]
lanes:
  hittites: {label: "The Hittites and the Bible (separate line)"}
  dig:      {label: "Excavation at Ras Shamra (Ugarit)"}
  account:  {label: "The oven account and the ship letters"}
  revision: {label: "Revision of the oven account"}
people:
  - {who: "Claude F.-A. Schaeffer", detail: "Directed the Ras Shamra excavations from 1929; the 18th to 20th campaigns (1954-56) are listed as directed by him (Saade 2011, pp. 26-27). Interpreted the Court V find as an oven for baking tablets (as reported by Millard, Lombard, Saade)."}
  - {who: "Michael C. Astour", detail: "Wrote in 1965 that the lot was found in an oven for baking tablets and that two letters may be unbaked originals."}
  - {who: "Yves Calvet", detail: "Resumed the excavation of the Court V area in 1979 (Lombard n. 10); wrote in Syria 67 (1990) that the interpretation of the oven as a tablet oven does not hold (as quoted by Millard and Lombard; not read)."}
  - {who: "Alan Millard, Pierre Lombard", detail: "Authors of papers in Ras Shamra-Ougarit XI (1995) that report the revision."}
  - {who: "Eric H. Cline", detail: "Author of 1177 B.C. (2014; revised 2021), where the ship letter is described as first reported found in a kiln."}
sources:
  s_saade:  {title: "G. Saade, Ougarit et son royaume (Beirut: IFPO, 2011), ISBN 978-2-35159-180-2: campaign table pp. 26-27; pp. 19-21", url: "", authenticity: "print work cited; read in a third-party copy (access path in the dig manifest); unchecked"}
  s_rso:    {title: "Ras Shamra-Ougarit XI (Paris: Editions Recherche sur les Civilisations, 1995), ISBN 2-86538-253-2: Millard pp. 119-124; Lombard pp. 227-229; Avant-propos", url: "", authenticity: "print work cited; read in a third-party scan (access path in the dig manifest); moderate"}
  s_astour: {title: "Astour, American Journal of Archaeology 69.3 (1965) 253-258", url: "http://www.jstor.org/stable/502290", authenticity: "JSTOR stable URL of the print article; read in a copy of the JSTOR scan (access path in the dig manifest); moderate"}
  s_boyes:  {title: "Boyes, Script and Society (Oxbow 2021), open access, pp. 124-125", url: "https://archive.org/details/oapen-20.500.12657-52589", authenticity: "OAPEN open-access edition; moderate"}
  s_cline21: {title: "E. H. Cline, 1177 B.C., revised edition (Princeton University Press, 2021), ISBN 9780691208015: pp. 31-32, 101, 107-108, 140", url: "", authenticity: "print work cited; read in a third-party copy (access path in the dig manifest); unchecked"}
  s_cline14: {title: "Cline, 1177 B.C. (2014), Prologue sample", url: "http://assets.press.princeton.edu/chapters/p10185.pdf", authenticity: "publisher's sample; moderate"}
  s_caubet: {title: "A. Caubet, 'The Case of Ugarit and Carchemish', in Dever and Gitin (eds), Symbiosis, Symbolism, and the Power of the Past (Eisenbrauns 2003), ISBN 9781575065458, pp. 17-19", url: "", authenticity: "print work cited; read in a third-party mirror (access path in the dig manifest); unchecked"}
  s_sayce:  {title: "Sayce, The Hittites, 2nd ed. (1890), chapter I (Project Gutenberg #40243)", url: "https://www.gutenberg.org/cache/epub/40243/pg40243.txt", authenticity: "public domain; transcription checked against the 1890 scan; moderate"}
  s_hal:    {title: "HAL record halshs-01570891 (abstract of Coquinot et al. 2008)", url: "https://api.archives-ouvertes.fr/search/?q=halId_s:halshs-01570891&fl=fileMain_s,title_s,abstract_s", authenticity: "repository record; unchecked"}
events:
  - {id: tl1, panel: long, lane: hittites, time: "1879-06-01T12:00:00Z", precision: year, kind: analysis, status: single, sources: [s_cline21],
     label: "1879: Sayce announces that the Hittites were in Anatolia (per Cline)",
     detail: "Cline 2021 pp. 31-32: early efforts to find the Hittites in the biblical lands 'were unsuccessful'; in 1879 Sayce announced they were located in Anatolia. Sayce's own preface (dated 1888) names his paper of 1880, 'On the Monuments of the Hittites'; the two dates are kept apart. The passage does not mention Ugarit."}
  - {id: tl2, panel: long, lane: hittites, time: "1888-10-01T12:00:00Z", precision: month, kind: document, status: single, sources: [s_sayce],
     label: "Oct 1888: Sayce's preface; the 1890 second edition answers a critic of about 1850",
     detail: "Sayce, chapter I: 'Nearly forty years ago a distinguished scholar' called the mention of Hittite kings in 2 Kings 7:6 'unhistorical'; 'Recent discoveries have retorted the critic's objections upon himself.' Ugarit was first excavated in 1929."}
  - {id: tl3, panel: long, lane: dig, time: "1929-06-01T12:00:00Z", precision: year, kind: analysis, status: single, sources: [s_saade],
     label: "1929: French excavation of Ras Shamra begins under Schaeffer",
     detail: "Saade 2011 p. 19: the Académie des Inscriptions et Belles-Lettres decided on the work at Dussaud's proposal; Dussaud obtained the funds."}
  - {id: tl4, panel: long, lane: dig, time: "1954-10-23T00:00:00Z", end: "1954-12-07T00:00:00Z", precision: range, kind: official, status: reported, sources: [s_saade, s_rso],
     label: "23 Oct - 7 Dec 1954: 18th campaign; the Court V tablets are found",
     detail: "Saade's table gives the campaign dates (Palais Royal); Millard p. 119 says that in 1954 over one hundred and fifty tablets and fragments were found in Court V and were reported to be lying in the remains of an oven. Cline gives 'more than seventy other tablets'."}
  - {id: tl5, panel: long, lane: dig, time: "1955-10-14T00:00:00Z", end: "1955-12-07T00:00:00Z", precision: range, kind: official, status: single, sources: [s_saade],
     label: "14 Oct - 7 Dec 1955: 19th campaign",
     detail: "Saade's table (Palais Royal, Palais Sud). Astour attributes the alphabetic letters of the oven lot to the 18th and 19th campaigns."}
  - {id: tl6, panel: long, lane: dig, node: ugarit-1956-letter-from-the-general-found-house-of-rapanu, rev: 2}
  - {id: tl7, panel: long, lane: dig, time: "1956-09-29T00:00:00Z", end: "1956-11-01T00:00:00Z", precision: range, kind: official, status: single, sources: [s_saade],
     label: "29 Sep - 1 Nov 1956: 20th campaign, residential quarter; the Rapanu archives",
     detail: "Saade p. 21: this campaign 'livra les Archives de Rapanou'. The Akkadian letters of the 20th campaign, including RS 20.18 and RS 20.238, were published in Ugaritica V (1968). No source read states where RS 20.238 was found."}
  - {id: tl8, panel: long, lane: account, time: "1962-06-01T12:00:00Z", precision: year, kind: document, status: single, sources: [s_rso],
     label: "1962: Schaeffer, 'Un four pour la cuisson des tablettes', Ugaritica IV (cited; not read)",
     detail: "The title and pages (31-37) are given in Lombard's note 9 (RSO XI p. 228). The report itself was not read."}
  - {id: tl9, panel: long, lane: account, time: "1965-07-01T12:00:00Z", precision: month, kind: analysis, status: single, sources: [s_astour],
     label: "Jul 1965: Astour writes that two oven letters 'may be' unbaked originals",
     detail: "Astour 1965 p. 254: the lot was 'found in an oven for baking tablets'; 'Two letters written by Ugaritic officers may be the originals, delivered unbaked and put into the oven'; the employees 'had no time to take these tablets from the oven to the archives'."}
  - {id: tl10, panel: long, lane: account, time: "1968-06-01T12:00:00Z", precision: year, kind: document, status: single, sources: [s_saade],
     label: "1968: Ugaritica V publishes the Akkadian letters of the 20th campaign (nos. 22-24 among them)",
     detail: "Saade pp. 91-92 gives RS 20.018 = no. 22, RS L1 = no. 23, RS 20.238 = no. 24. The volume is access-restricted and was not read."}
  - {id: tl11, panel: long, lane: revision, time: "1979-06-01T12:00:00Z", precision: year, kind: analysis, status: single, sources: [s_rso],
     label: "1979: Calvet resumes the excavation of the Court V area",
     detail: "Lombard 1995 p. 229 n. 10: Calvet found access steps to the basin that the first excavator had not seen, and his observations indicate that the interpretation as a 'tablet oven' does not hold."}
  - {id: tl12, panel: long, lane: revision, time: "1990-06-01T12:00:00Z", precision: year, kind: analysis, status: reported, sources: [s_rso, s_saade],
     label: "1990: Calvet, Syria 67, pp. 39-40 and n. 2: the 'tablet oven' reading is no longer held (as quoted; not read)",
     detail: "Millard p. 119 n. 2 quotes Calvet: the analysis of the zone 'rend caduque l'interprétation de ce four comme destiné à cuire des tablettes'. Saade p. 199 gives Calvet's alternative: a bread oven, and tablets fallen from the upper floor. The Persee PDF was refused (HTTP 403)."}
  - {id: tl13, panel: long, lane: revision, time: "1993-06-28T00:00:00Z", end: "1993-07-01T00:00:00Z", precision: range, kind: witness, status: single, sources: [s_rso],
     label: "28 Jun - 1 Jul 1993: Paris colloquium; Lagarce and Margueron say the oven did not exist (as reported by Millard)",
     detail: "Millard p. 119 n. 2. The colloquium proceedings were published in 1995 as Ras Shamra-Ougarit XI. Liverani's note 13 (p. 115) says doubts on the oven were recalled during the colloquium."}
  - {id: tl14, panel: long, lane: revision, time: "1995-06-01T12:00:00Z", precision: year, kind: document, status: reported, sources: [s_rso],
     label: "1995: RSO XI published: Millard, Lombard and others report the revision",
     detail: "Millard p. 119: 'archaeologists now affirm that there was no oven'. Lombard pp. 228-229: an oven existed but was built by squatters after the palace was abandoned. In the same volume the destruction of Ugarit is dated about 1195-1185 BC (de Tarragon), 1190/1180 BC (Callot and Yon) and about 1180 BC (editors)."}
  - {id: tl15, panel: long, lane: revision, time: "2003-06-01T12:00:00Z", precision: year, kind: analysis, status: single, sources: [s_caubet],
     label: "2003: Caubet writes that the oven picture 'had to be revised'",
     detail: "Caubet p. 17 (Eisenbrauns 2003); she adds that the tablets do not date to the very end of the city, and that seminal works 'still refer to the tablets from the oven'."}
  - {id: tl16, panel: long, lane: revision, time: "2008-06-01T12:00:00Z", precision: year, kind: analysis, status: single, sources: [s_hal],
     label: "2008: Coquinot et al. re-analyse the objects of the 'tablet oven' (abstract only read)",
     detail: "The abstract says a new analysis led Margueron to refute Schaeffer's thesis and that the authors' own study of the objects led them to a new hypothesis, which the abstract does not state."}
  - {id: tl17, panel: long, lane: account, time: "2014-06-01T12:00:00Z", precision: year, kind: document, status: single, sources: [s_cline14],
     label: "2014: Cline's 1177 B.C. says the ship letter was first reported found in a kiln, and that scholars have shown it was not",
     detail: "Cline 2014 pp. 9-10 (Prologue sample). He gives 'more than seventy other tablets'. The destruction of Ugarit is dated by the authors read to about 1195-1175 BC (claim ugarit-destruction-date-estimates); Cline's Prologue dates the defeat of the Sea Peoples by Ramses III to 1177 BC."}
  - {id: tl18, panel: long, lane: revision, time: "2021-06-01T12:00:00Z", precision: year, kind: document, status: single, sources: [s_boyes, s_cline21],
     label: "2021: Boyes and Cline (revised edition) restate the revision; Cline places the ship letter in two findspots",
     detail: "Boyes pp. 124-125: 'Most likely it was nothing more than an overturned basket of tablets.' Cline 2021 p. 101 (House of Rapanu), p. 107 and p. 140 (Court V, 'Southern Archive')."}
  - {id: tl19, panel: dig, lane: dig, time: "1954-10-23T00:00:00Z", end: "1954-12-07T00:00:00Z", precision: range, kind: official, status: reported, sources: [s_saade, s_rso],
     label: "18th campaign (1954): Court V tablets",
     detail: "See event 4."}
  - {id: tl20, panel: dig, lane: dig, time: "1955-10-14T00:00:00Z", end: "1955-12-07T00:00:00Z", precision: range, kind: official, status: single, sources: [s_saade],
     label: "19th campaign (1955)", detail: "See event 5."}
  - {id: tl21, panel: dig, lane: dig, time: "1956-09-29T00:00:00Z", end: "1956-11-01T00:00:00Z", precision: range, kind: official, status: single, sources: [s_saade],
     label: "20th campaign (1956): Rapanu archives; RS 20.x numbers", detail: "See event 7."}
