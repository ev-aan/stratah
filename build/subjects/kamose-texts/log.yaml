  - id: L-11
    date: 2026-10-16
    entry: >
      FINDINGS AND WEIGHING AFTER THE REBUILD. (a) The booty noun: Gardiner 'slaves', Griffith 'slaves', Weill 'hommes' (men) from the 1912 plate. The three are translations of photographs of one board and are not independent; they do not agree. (b) The place of the find: Carter (and Gardiner, repeating him) say the Birabi, courtyard of tomb No. 9; Maspero's 1909 note says Drah Abu'l Naga, among spoil of earlier excavations, February 1908. Both are kept; neither is checked against field records.
      (c) The regnal year: 3 for Maspero (1909), Weill (1913) and Gardiner (1916); 7 for Griffith (1912) and, via Gardiner, Newberry. The first pass said Gardiner was the only holder of year 3. (d) The date of writing: Gardiner's concessions (the text is a copy by 'a very careless and ignorant copyist'; the value as history 'is better deferred'; 'no doubt this kind of historical source is not all that could be desired'), Maspero's own doubt about his guess that the text opens a ghost story, and Weill's concessions (the hand is so close to pre-New-Kingdom documents that one is very tempted to date it a few years after the events; as history, the memory of a war between Ahmose's predecessors at Thebes and the powers of Lower Egypt is kept) are recorded beside each position.
      (e) The second stela, as a teaching text: a long list of materials as booty; a phrase glossed 'my captured prisoners' in a clause whose reading (speech or narrative; threat or report) the commentary says is open; a letter from Apophis to the Kushite king; and the fall of Avaris placed under Ahmose I. (f) Ahmose son of Ebana (Breasted 1906; Rutgers): Avaris taken under Ahmose I, captives given to the officer 'for slaves' (Breasted) or as servants (Rutgers); filed as context for who took Avaris and for the slave/servant rendering, and it lends no weight to any claim about Kamose. (g) Not filed refuted: the speaker's wording is not shown wrong by the pages read, and the stelae were not read.
