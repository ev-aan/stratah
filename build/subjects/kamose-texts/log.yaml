      WHAT WAS BLOCKED OR NOT OPENED. BLOCKED: the Thesaurus Linguae Aegyptiae records for Kamose Stela II (text SXQSUAMQH5F2HORTAGXSEWEUGM) and Carnarvon Tablet I (text BMVO6CBMDNBQFMXW3DSIW66WSM) returned a bot-verification notice; footer 'Alle Rechte vorbehalten'; not retried, not bypassed. The tool refused web.archive.org (not tried by other means). A Redford translation page at the University of Arizona redirected to a homepage (dead link) and was not pursued;
      the touregypt.net page (a Pritchard translation, per the EEF guide) failed on a certificate mismatch and was not bypassed; the Rosmorduc text page returned 404. NOT LOCATED OR NOT OPENED: Habachi 1972 (editio princeps of the second stela); Smith and Smith, ZAeS 103 (1976); Helck, Historisch-biographische Texte; the first stela's fragments and publication; the Luxor Museum record; the Cairo Museum record for Tablet I; Porter and Moss; Maspero 1909, Weill 1910-13, Newberry 1913 (known only through Gardiner);
      the full Bronk Ramsey paper; the Sallier papyrus tale; the Plates XIII (JEA 3) and XXVII-XXVIII (1912) page images. The EEF guide page (egyptologyforum.org) was read only to character 100000 of about 199697. Museum numbers J.43 and JE 41790 are from search-result titles only.
  - id: L-04
    date: 2026-10-14
    entry: >
      WHO FUNDED AND CONTROLLED THE WORK (traced as far as sources opened allow). Gardiner: Griffith Institute biography page says he had 'sufficient income from his father', a wealthy businessman, and 'often paid for publications himself or helped finance others'; whether he or the Fund paid for this article is UNRESEARCHED. Journal of Egyptian Archaeology 1916: published by the Egypt Exploration Fund (title page); the Society's history page says it was founded in 1882 by Amelia Edwards and does not say how it was financed
      or who controlled it: UNRESEARCHED (a search summary that was not opened mentioned subscriptions; a lead only). Carnarvon and Carter 1912: the book is in Carnarvon's voice ('I began tentative digging ... in the spring of 1907'), thanks Maspero (Director-General, Service des Antiquites) and Weigall of that service, names Carter 'in charge of all operations', and was printed at the Oxford University Press; it does not say who paid, and a search summary that Carnarvon financed Carter was not opened: UNRESEARCHED.
      Griffith (chapter VI) thanks Gardiner for readings. Digital Karnak: UCLA project moved to UC Santa Cruz in 2021 (About page); no funder stated. Bronk Ramsey et al. 2010: no funding statement on the page read. Rutgers PDFs and the Minot reader: authors or translators not named. Dead Hidden: UNRESEARCHED. The Schilvold e-books: UNRESEARCHED. Nothing here asserts a funder that a source opened did not state.
  - id: L-05
    date: 2026-10-14
    entry: >
      FINDINGS AND WEIGHING. (a) The tablet, in the two translations read, narrates one raid (Nefrusi, against Teti son of Pepi) in which the king's soldiers carry off 'slaves, cattle, fat and honey'; the wife of the enemy is 'caused to go down to the river-bank' (Gardiner: appropriated). That is the only enslavement in what was read, and it is booty at one place. (b) Avaris and Kush are named in the king's speech as the seats of two rival princes; neither translation narrates a defeat of either or any action in Nubia,
      and Griffith says Ahmose took Avaris later. (c) The speaker's sequence 'rebelled ... defeated both ... took their people into slavery' is not what was read, but it is not filed refuted: the hieratic, the second stela and the first stela were not read, and the speaker's basis ('Egyptian records') is unknown. (d) The regnal year is contested between Gardiner (3) and Griffith and Newberry (7). (e) The date of writing is contested between Gardiner, Griffith and Newberry (near-contemporary copy) and Maspero and Weill (later or tale-like), the latter known only through Gardiner. (f) The BCE date is not fixed:
      two web pages say about 1555 to 1550 BCE without authority, a radiocarbon range for the New Kingdom start (1570 to 1544 BCE, abstract only) bounds it from one side by our inference. Gardiner is both the main source and a party to the dating dispute; that is flagged in claim kamose-tablet-date-of-writing. Gardiner's and Griffith's translations are not independent: Griffith used Gardiner's readings. No transmission.yaml was made: no source read traces how the speaker's version spread.
  - id: L-06
    date: 2026-10-14
    entry: >
      WHERE THE FACTS END. Known from a source read: a board found in 1908 at the Birabi site; two printed translations of its text; the booty and Avaris/Kush lines. Not known: the signs of the booty line and the date; where the board is now; whether the board copies a stela and which; what the two stelae say about Avaris, Kush and booty; whether Kamose attacked Nubia; whether Thebes owed submission to Avaris before the war; how long Kamose reigned;
      the BCE year. OPEN POSITIONS KEPT: regnal year 3 vs 7; near-contemporary copy vs later composition; rebellion vs war between two kingdoms. Each lists what would change it in claims.yaml. Plain-language caveat on the node kamose-regnal-year-date-window: the window is our inference from a New Kingdom start range, not a read date. Conformance run at the end of the session; taxonomy.yaml was not edited (rule), so a taxonomy warning for this subject remains for the owner.
