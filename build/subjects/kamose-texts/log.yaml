log:
  - id: L-01
    date: 2026-10-14
    entry: >
      DIG OPENED from a handoff (kamose-texts.yaml) written by another agent. Its identification ('Kamose Stele (Karnak) and Carnarvon Tablet; translations') was an unverified guess; it is treated as a lead. The two speaker claims
      (dh-HN0wNVpfunM-18 and dh-qL1VmGF3BF8-16) were split into six parts and kept in the speaker's wording, unchanged, including the speaker's slip ('1st century BC' for 1550 BC), which is not corrected. The question the handoff gives: 'Does Kamose enslave peoples, and what are the dates?'
      Owner rules applied from the start: books, translations, commentaries and videos are claims, not primary data; any claim resting only on them is proposed or searched_gap, interpretive, anchor_checked secondary or no, confidence low, weight at most 2.
  - id: L-02
    date: 2026-10-14
    entry: >
      WHAT WAS OPENED AND READ. (1) A. H. Gardiner, 'The Defeat of the Hyksos by Kamose: the Carnarvon Tablet No. I', Journal of Egyptian Archaeology 3 (1916) 95-110, from the Internet Archive scan in.ernet.dli.2015.70975 (OCR text, local sha256 22121d9e...; the whole article read, including the Consecutive Translation and the Conclusions). The second scan of the same volume
      (in.gov.ignca.26512, OCR sha256 170a1e26...) was searched for the same passages. (2) Earl of Carnarvon and Howard Carter, Five Years' Explorations at Thebes (1912), Project Gutenberg #48382 (text, sha256 8c062252...): preface, the introduction's paragraph on the tablets, Carter's chapter V on the Birabi site, and Griffith's chapter VI (translation of the tablet). (3) Digital Karnak's 'Victory Stela of Kamose' page and About page
      (as returned by the fetch tool). (4) Rutgers University 'The Second Stela of Kamose' Part I and Part II PDFs (hieroglyph font and transliteration; Part I viewed as page images, Part II as text); no translation in them. (5) The abstract page of Bronk Ramsey et al. 2010 (Haifa repository). (6) Minot State HIST 105 'The Kamose Texts' page (no translation on the page). (7) The Griffith Institute 'Artefacts' biographical page for Gardiner;
      the Egypt Exploration Society history page; the Internet Archive item page for the JEA scan (publisher, scanning centre, rights field). (8) Metadata only of two Internet Archive e-books by Edmund Schilvold on the Kamose stelae; the books were not read and are not relied on. (9) Wikipedia's Kamose page once, for orientation only; nothing from it is an anchor. No image of any object was viewed and no hieratic or hieroglyphic sign was read:
      the only pictures looked at were the typeset transliteration pages (Rutgers), which are not the stela.
