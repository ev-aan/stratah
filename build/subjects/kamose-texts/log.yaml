      (4) NEW: Weill, Journal asiatique 11th series vol. 1 (1913) pp. 536 to 544, page images; Maspero, Recueil de travaux 31 (1909) p. 146 (OCR). (5) NEW: the Rutgers 'Second Stela of Kamose' Parts I (16 pages), II (13) and III (15), every page, and the Rutgers 'Autobiography of Admiral Ahmose' Parts I and II (the passages on Avaris, Sharuhen and Nubia); Breasted, Ancient Records II, sections 1 to 16. (6) The raw HTML of the Digital Karnak object page and About page and of the Minot page (the first pass had the first two only as summarised by a fetch tool).
  - id: L-08
    date: 2026-10-16
    entry: >
      CORRECTIONS TO STATEMENTS IN L-02, L-03 AND THE FIRST-PASS MANIFEST (the statements stay in the log; these are the corrections). (a) L-02 item 4 and the manifest said the Rutgers PDFs were '3 pages each', had 'no translation', were derived from 'an edition not named', and that the 1954 findspot of the second stela came only from an unopened search summary. All four are wrong for material in hand: the files are 16, 13 and 15 pages (Parts I, II and III);
      they contain English glosses of many clauses and grammar commentary (not a continuous translation); the commentary names Habachi, Smith and Smith and Allen as the works it follows or discusses; and Part I itself says the second stela 'was discovered in 1954 in Karnak. It was used as the base of a statue of Ramesses II.' Part II says a passage 'introduces a long list of booty captured from these ships', and has Apophis's letter to the Kushite king and a date for the fall of Avaris in the next reign (Ahmose I, regnal years 18 to 22).
      The edition the transliteration follows is still not stated in the files. (b) L-02 item 3 said Digital Karnak was read 'as returned by the fetch tool'; the raw page was read on 2026-10-16. The raw page says the stela 'celebrates the triumph of Theban ruler Kamose over the Hyksos king Apophis' and that the remainder 'describes Kamose's victory over the Hyksos'; the first pass left both sentences out of the claims on defeat. They are now in kamose-stela-descriptions-victory-over-apophis. (c) The claims said Gardiner and Griffith both have 'carrying off ... fat'; Griffith has 'with slaves, cattle .... honey' and no 'fat'.
      The claims, the assessment text, key point 1 and the search summary are rewritten so that 'slaves' is a translated word in a booty line, quoted separately for each translator. (d) The first-pass claim kamose-nubian-campaign said Nubian inscriptions were 'not opened' and took the lead from a Wikipedia summary; Gardiner 1916, p. 110, which was read, itself mentions an inscription at Toshkeh in Lower Nubia and the Nubian campaign of Ahmose I at El Kab; both are now recorded from the pages read. The Wikipedia leads stay out of the claims.
      (e) The first pass did not use Newberry's remark, reported by Gardiner (p. 110), that Teti son of Piopi may be a son of an Apophis; it is now in claim kamose-tablet-teti-son-of-piopi, with the readings of the name by Gardiner, Griffith and Weill.
