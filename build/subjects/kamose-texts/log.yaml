  - id: L-16
    date: 2026-10-16
    entry: >
      CORRECTIONS FROM THE SECOND REVIEW (the files were changed; L-11 and L-12 are not edited). (1) MASPERO'S REMARK ABOUT THE HAND: L-11, the date-of-writing claim, the timeline (event k5) and the object node (rev 2) said Maspero 1909 judged the hand of the historical text to resemble Twentieth Dynasty cursive hands. His sentence ('Il avait vecu sans doute vers le temps de la XXe dynastie, car l'ecriture de son livre semble se rattacher aux mains cursives de cette epoque') is in the paragraph after his description of the board and concerns 'son livre', the Ptah-hetep text; Gardiner 1916 p. 96 reports it as an opinion about the scribe of the Ptahhotpe duplicate.
      The claim now gives the sentence as he wrote it, notes that it is not stated for the historical text, and lists Maspero as calling the text a half-historical tale (with 'cela n'est pas bien certain' about the ghost-story guess), not as a holder of a Twentieth-Dynasty hand for that text. The timeline event and the object node (new rev 3) are corrected. His 'year III' and his findspot are unchanged. (2) FACES: the 1912 report's own introduction puts the historical text 'on its obverse' and the Ptah-hetep copy 'on its reverse', while its plate captions call the grid face 'Obv.'; the contradiction is inside the 1912 book. The faces claim and the object node now say so, and say that JEA Plates XII and XIII show only the text face, in two portions, and the grid face appears only on 1912 Plate XXVII.
      (3) FINDSPOT: Carter's introduction gives a second wording ('at the very threshold of the tomb (afterwards numbered 9)'); added to kamose-tablet-findspot-1908 and to the stored extract. (4) kamose-tablet-text-no-defeat-of-rulers now records that Weill calls the text a 'proclamation triomphale' and, after the lacuna, 'le recit d'une guerre victorieuse contre les etrangers et de leur expulsion' (page 539 added to the Weill extract). (5) Independence of the year readings and of the dating authors is stated in the `basis` of kamose-tablet-regnal-year (year 3: Maspero and Gardiner count as independent; Weill adds little; year 7 is effectively Griffith alone) and of kamose-tablet-date-of-writing. (6) kamose-objects-identification: Habachi 1972 is Rutgers bibliography entry 33; entry 47 names him by short name. (7) kamose-sp-took-their-people-into-slavery: anchor type changed from interpretive to search-record, as it carries absence_anchor.
