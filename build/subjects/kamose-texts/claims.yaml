  # ------------------------- WHAT THE TABLET TEXT SAYS (translations read) -------------------------

  - id: kamose-tablet-text-avaris-kush
    state: proposed
    statement: >
      In two printed translations of Carnarvon Tablet I, the king speaks of two rival princes and says he sits between them: Gardiner 1916, 'when one prince is in Avaris and another is in Kush, and I sit united with an 'A'am and a Negro - each man holding his slice of the Black Land';
      Griffith 1912, 'One prince is in Avaris, another in Ethiopia!'. Gardiner: 'My desire is to deliver Egypt, and to smite (?) the 'A'amu.'
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "The Avaris and Kush lines are what summaries mean by Kamose facing the Hyksos in the north and Nubia in the south."
    would_change_if: "the hieratic of the lines is read and differs, or the second stela's text shows a different relation to Avaris and Kush"
    anchor:
      type: interpretive
      description: >
        Gardiner 1916, Text, translation and commentary and 'Consecutive Translation' (OCR read; Gardiner marks doubtful words with question marks and identifies Avaris as 'the stronghold and capital of the Hyksos'); Griffith, chapter VI of Carnarvon and Carter 1912.
        These are translations; the hieratic was not read. Griffith had Gardiner's help with readings, so the two are not independent.
      sources: [src-gardiner-translation, src-griffith-translation]
    basis: >
      # V: read 2026-10-14. The text is a king's speech to his council, reported in the first person; the council replies that Elephantine is strong and 'the middle part is with us as far as Cusae', and counsels waiting.

  - id: kamose-tablet-text-booty-slaves
    state: proposed
    statement: >
      In the same two translations, in the one raid the text narrates, at Nefrusi against 'Teti the son of Piopi', the king's soldiers carry off slaves as booty. Gardiner: 'I overthrew him, I destroyed his wall, I slew his folk, I caused his wife to go down to the river-bank. My soldiers were like lions with their prey,
      carrying off slaves, cattle, fat and honey, and dividing up their possessions, their hearts rejoicing.' Griffith: 'I slew his people, I caused my soldiers to embark like wolves with their prey, with slaves, cattle ... honey, dividing their property'. Gardiner's commentary: the sending of Teti's wife to the river-bank 'must signify that she was appropriated by the conqueror'.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 3
    adoption_note: "The booty line is rarely quoted in summaries; 'enslaved the people' is."
    would_change_if: "the hieratic word rendered 'slaves' is read and means something else (for example captives, servants or Asiatic workers), or a reading of the line shows the booty belongs to another episode"
    anchor:
      type: interpretive
      description: >
        Gardiner 1916, 'Consecutive Translation' and the note on the Nefrusi passage (OCR read; Gardiner says the passage 'teems with difficulties' and that 'my conjectural renderings make very free with both vocabulary and grammar' for the final sentences, but the booty line itself carries no question mark in the translation);
        Griffith in Carnarvon and Carter 1912, chapter VI. Translations only; the sign for 'slaves' was not seen.
      sources: [src-gardiner-translation, src-griffith-translation]
    basis: >
      # V: both read 2026-10-14. Two renderings that agree on 'slaves', not independent of each other. The text states booty taken by his soldiers at one place; it does not give the numbers, the origin of the people, or a policy.

  - id: kamose-tablet-text-no-defeat-of-rulers
    state: proposed
    statement: >
      Neither translation of the tablet says Kamose defeated the king of Avaris or a Nubian king, took Avaris, or fought in Nubia. The only victory narrated is over Teti son of Pepi at Nefrusi. Griffith says Ahmose, Kamose's successor, completed the overthrow of the Hyksos 'by the capture of Avaris'
      and that a rival in Nubia 'was likewise crushed by Ahmosi'. Gardiner finds in the text no sign the writer knew of the taking of Avaris.
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    absence_anchor: true
    adoption_weight: 2
    adoption_note: "Against the common summary; not stated in the popular material seen."
    would_change_if: "the lost lines of the tablet, the first or second stela, or another source shows a defeat of the Avaris ruler or a Nubian ruler by Kamose"
    anchor:
      type: search-record
      description: >
        Searched both translations (Gardiner's consecutive translation; Griffith's summary) for: capture of Avaris, defeat of 'the prince in Avaris' or 'the prince in Kush', any action in Kush. None. Gardiner notes missing lines and a lacuna ('the flaking of the stucco about the fracture has robbed us of one line and of the greater part of two more', Griffith). The Conclusions of Gardiner 1916:
        'I am unable to discover any word or phrase which indicates or implies that the writer was aware of the subsequent taking of Avaris'. The second stela and the first stela were not read.
      sources: [src-gardiner-translation, src-griffith-translation, src-gardiner-1916-jea3, src-carnarvon-carter-1912]
    basis: "Absence from a fragmentary tablet is weak. It is capped at provisional (absence_anchor)."

  - id: kamose-tablet-regnal-year
    state: contested
    statement: "The regnal year of the tablet's text is year 3 (Gardiner 1916) or year 7 (Griffith 1912, followed by Newberry)."
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 3
    adoption_note: "Summaries repeat 'year 3'; the 'year 7' reading is rarely mentioned."
    would_change_if: "Plate XIII or the board's date sign is read, or a second stela's date (read in the stone) agrees with one of them"
    disputed_by:
      - {who: "A. H. Gardiner (1916)", kind: person, position: "year 3; says Griffith 'wrongly reads year 7' and notes the date stands unusually before the titulary", source_read: "Gardiner 1916, commentary on the first line, read in OCR", via: direct}
      - {who: "F. Ll. Griffith (1912), followed by P. E. Newberry (1913)", kind: person, position: "year 7", source_read: "Griffith read directly in Carnarvon and Carter 1912; Newberry only through Gardiner's note", via: "direct for Griffith; through Gardiner for Newberry"}
    positions:
      - {label: "year 3", holder: "Gardiner 1916", ground: "reading of the hieratic numeral, with a stated parallel in Sethe's Untersuchungen"}
      - {label: "year 7", holder: "Griffith 1912; Newberry 1913", ground: "reading of the numeral (grounds not read)"}
    anchor:
      type: search-record
      description: "Read Gardiner 1916 (year 3; his note that Griffith and Newberry read year 7) and Griffith 1912 ('The text is dated in the seventh year of King Kamosi'). The numeral was not seen; Plate XIII was not viewed."
      sources: [src-gardiner-translation, src-griffith-translation]
    basis: "Two readings of one number by two scholars, one of whom says the other was wrong. Not settled here. It matters for how long Kamose had reigned when the text was made."
    next_step: "View Plate XIII and the Cairo board's date line; read Newberry 1913 and the TLA entry's transliteration."

  - id: kamose-tablet-date-of-writing
    state: contested
    statement: "Carnarvon Tablet I was written within a few decades of the events it reports (Gardiner, Griffith, Newberry), or much later and not as contemporary history (Maspero, Weill)."
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 3
    adoption_note: "The 1916 dating is the usual one in summaries; the doubters' view is rarely mentioned."
    would_change_if: "a palaeographical study of the hand by a specialist independent of both camps, or a dated parallel found with the same hand, or the tablet's first-stela parallel is read"
    disputed_by:
      - {who: "A. H. Gardiner (1916), with F. Ll. Griffith and P. E. Newberry", kind: person, position: "hand of the end of the Seventeenth Dynasty or very early Eighteenth; 'in no case can it have been written more than fifty years later'; a copy of a commemorative stela, with no reason to doubt its historical value", source_read: "Gardiner 1916, read in OCR; Griffith ('written within a few years of the events') in Carnarvon and Carter 1912, read", via: direct}
      - {who: "G. Maspero (1909)", kind: person, position: "scribe of about the Twentieth Dynasty; the text the beginning of a half-historical tale set in the third year of King Kamosis", source_read: "not opened; Gardiner's account, p. 96", via: "Gardiner 1916"}
      - {who: "R. Weill (1910-1913)", kind: person, position: "doubts the historical character; text composed after the final Theban victory over the northerners, its references to Avaris and the Asiatics conventional", source_read: "not opened; Gardiner's account, p. 96 and Conclusions", via: "Gardiner 1916"}
    positions:
      - {label: "near-contemporary copy of a commemorative stela", holder: "Gardiner 1916; Griffith 1912; Newberry 1913", ground: "palaeography (comparison with Moller's hieratic forms, Rhind and Ebers papyri) and the form of Egyptian commemorative stelae"}
      - {label: "later scribe, text partly or wholly tale", holder: "Maspero 1909; Weill 1910-1913", ground: "Maspero: the hand resembles Twentieth Dynasty cursive; Weill: the content (as Gardiner reports them)"}
    anchor:
      type: search-record
      description: "Gardiner 1916 (read start to end) sets out all of these positions and argues for the earlier date; the opposing works (Maspero, Weill, Newberry) were not opened; the hand was not seen. The first-stela fragments said by a summary to have been found in the 1930s were not read, so Gardiner's 'a direct copy from a stele' remains his conjecture here."
      sources: [src-gardiner-1916-jea3, src-maspero-weill-newberry]
    basis: "Gardiner is both the main source and a party; the other side is known only through him. Not closed."
    next_step: "Open Maspero 1909, Weill 1913 and Newberry 1913; view the board's hand; read what a modern palaeographer says."

  # ------------------------- DATE -------------------------

  - id: kamose-absolute-date-bce
    state: searched_gap
    statement: "Kamose's campaign year in BCE is not fixed by anything read. Two web pages give his reign as about 1555 to 1550 BCE without a stated authority; the speaker says 1550 BC."
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 4
    adoption_note: "1555 to 1550 is the usual summary figure; chronologies of the Seventeenth Dynasty differ by years and its length is itself argued."
    would_change_if: "a named chronology (for example the radiocarbon-informed one) is read and gives Ahmose's accession and Kamose's reign length (a coregency or a longer reign would move the window)"
    anchor:
      type: search-record
      description: >
        Read: Digital Karnak's page ('1555-1550 BCE', no authority given); Minot reader ('around 1555-1550 BCE', no authority); the abstract of Bronk Ramsey et al. 2010 (New Kingdom start 1570-1544 BCE; paper not opened). The tablet gives a regnal year only. No chronology of the Seventeenth Dynasty was read.
        Wikipedia (orientation only, not an anchor) mentions a view that Kamose reigned about five years, with a coregency with Ahmose; it was not checked.
      sources: [src-digital-karnak-victory-stela, src-minot-oer, src-bronk-ramsey-2010]
      nodes: [{node: kamose-regnal-year-date-window, verb: qualifies}]
    basis: "The window node shows the inference and its limits; it is our inference from the New Kingdom start range, not a read date."
    next_step: "Read the Bronk Ramsey paper and a chronology that dates Kamose (Ryholt's work on the Second Intermediate Period, a Cambridge Ancient History chapter) and compute a window with reasons."

  # ------------------------- NUBIA -------------------------

  - id: kamose-nubian-campaign
    state: searched_gap
    statement: "Kamose fought a Nubian (Kushite) king in the south."
    statement_kind: search_result
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 3
    adoption_note: "Repeated in summaries; the speaker has it as a rebellion against 'the Nubian king to the south'."
    would_change_if: "the Nubian inscriptions said to carry his name, or the first or second stela, are read and describe an action against a Kushite ruler"
    next_step: "Read Habachi 1972 and Smith and Smith 1976 for the passages on Kush; locate and read the Nubian rock inscriptions of Kamose (a summary named Arminna and Toshka) in their publications."
    anchor:
      type: search-record
      description: >
        Read: the Carnarvon Tablet translations (Kush is named only in the king's speech, with no action there); Digital Karnak (an intercepted letter from Apophis to the king of Kush; no action by Kamose in Nubia). Not read: any text recording a campaign in Nubia. A summary page (not an anchor) names Nubian inscriptions; not opened.
      sources: [src-gardiner-translation, src-griffith-translation, src-digital-karnak-victory-stela]
    basis: "The tablet speaks of a Kushite rival; it does not report an attack on one."

