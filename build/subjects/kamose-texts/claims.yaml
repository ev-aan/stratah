subject: kamose-texts
title: "Kamose's texts against Avaris: what the Carnarvon Tablet and the second stela are read to say, what is not read, and what Dead Hidden says"
question: "Does Kamose enslave peoples, and what are the dates?"
dig_status: open
headline: "One tablet line on Kamose's campaign reads 'slaves' in two translations and 'men' in a third"
headline_claim: kamose-tablet-text-booty-slaves
headline_status: draft
search_summary: >
  Carnarvon Tablet I is a hieratic writing-board found at Thebes in 1908 that carries a text of the Theban king Kamose. Three printed translations were read (Griffith 1912, Weill 1913, Gardiner 1916).
  In the line about one raid, at Nefrusi, Gardiner and Griffith have his soldiers carrying off 'slaves' with cattle and honey, and Weill has 'hommes' (men). None of the three translations says Kamose took Avaris, defeated a Nubian ruler or enslaved a people.
  The signs of the board were not read: its photographs were viewed and no sign on them was read. A Rutgers teaching text on a second, stone stela was read in full; it gives a long list of materials as booty and glosses one phrase as 'my captured prisoners' (Part I); it is not a translation.
  The regnal year is 3 for Maspero, Weill and Gardiner and 7 for Griffith. No BCE year is fixed by anything read.
description: >
  Rebuild after the independent review of PR #30. Read in full: Gardiner's 1916 article with the translation (OCR and page images), the excavators' report of 1912 with Griffith's chapter, Weill's 1913 pages on the tablet (page images), the Rutgers texts on the second stela (all three parts)
  and on the autobiography of Ahmose son of Ebana, and Breasted's 1906 translation of that autobiography. Read in part: Maspero's 1909 first notice (OCR), two web object records, the abstract of a 2010 radiocarbon chronology. Viewed but not read: photographs of the board (JEA plates XII and XIII, 1912 plates XXVII and XXVIII).
  Blocked: the TLA (bot check), the Minot reader's linked translation (sign-in page), the speaker's transcripts (YouTube refusal). Not opened: the stelae in any edition, Newberry 1913, Habachi 1972. Six speaker assertions are kept separate, in handoff wording only.
divergence_note: >
  The speaker's wording, as the handoff gives it: Kamose rebelled against the king of Avaris and the Nubian king, defeated both, and took their people into slavery, in 1550 BC. What the pages read say, set beside it: the tablet's text, in three translations, is a speech by a Theban king; it names one prince in Avaris and another in Kush; it narrates
  one raid, at Nefrusi, in which his soldiers carry off persons (rendered 'slaves' by two translators and 'men' by one), cattle and honey; none of the three translations says a ruler of Avaris or of Nubia was defeated. The Rutgers commentary on the second stela, read in full, lists materials as booty from ships, has a letter from Apophis to the Kushite king that Kamose's side intercepted, and puts the fall of Avaris in the next reign.
  Points where the two differ or are not settled by anything opened here: whether a ruler was defeated, whether Kamose reached Avaris or fought in Nubia, how many persons were taken and who they were, whether the Thebans owed submission to Avaris, and the year.

assessment:
  question: "Does Kamose enslave peoples, and what are the dates?"
  answer: unsettled
  headline: "No source read states that Kamose enslaved a people; one booty line is 'slaves' in two translations and 'men' in a third, and no BCE year is fixed."
  key_points:
    - "Three printed translations give the booty noun of Carnarvon Tablet I as 'slaves' (Gardiner, Griffith) and 'hommes', men (Weill); no sign on the plates was read here."
    - "Translations place princes in Avaris and Kush and narrate one victory, at Nefrusi; none has Kamose take Avaris or fight in Nubia; Rutgers has Avaris fall under Ahmose."
    - "The regnal year is 3 for Maspero, Weill and Gardiner and 7 for Griffith; no BCE year is fixed by anything read, and the 1555 to 1550 BCE page figures cite no authority."
  text: >
    What was read is four printed readings of one copied text (Maspero 1909, Griffith 1912, Weill 1913, Gardiner 1916), photographs of the board whose signs were not read, and a teaching text on a second, stone stela. The readers of the tablet worked from photographs of the same board and are not independent of each other.
    In the one raid the tablet narrates, at Nefrusi, the line about the soldiers' booty names persons: Gardiner has 'slaves', Griffith has 'slaves', Weill has 'hommes'. Gardiner takes the sending of the enemy's wife to the river-bank to mean she was appropriated. None of the translations gives a number or origin for these persons, and none says a people was enslaved;
    that absence is from fragmentary lines (Griffith counts one line lost and most of two more) and is held at provisional. The Rutgers commentary on the second stela gives a long list of materials as booty and, in a clause whose reading it says is open, 'my captured prisoners'; it gives no continuous translation. The stelae themselves, in any edition, were not opened.
    The dates: the tablet gives a regnal year only, 3 or 7 as read; reign figures of about 1555 to 1550 BCE appear on two web pages without an authority; a radiocarbon range for the start of the following dynasty bounds the period from one side, by the dig's own inference.
  basis: [kamose-tablet-text-booty-slaves, kamose-tablet-text-avaris-kush, kamose-tablet-text-no-defeat-of-rulers, kamose-stela-descriptions-victory-over-apophis, kamose-tablet-regnal-year, kamose-absolute-date-bce, kamose-second-stela-booty-list, kamose-second-stela-captives-clauses, kamose-sp-took-their-people-into-slavery]
  would_settle: "A reader of hieratic reads the signs of the booty line and of the date on the board or a large reproduction; Habachi 1972 and Smith and Smith 1976 are read for the booty, the captives and the Kush passages of the second stela; a named chronology of the Seventeenth Dynasty is read for Kamose's reign."

claims:

  # ------------------------- THE OBJECTS -------------------------

  - id: kamose-objects-identification
    state: searched_gap
    statement: >
      The handoff's 'Kamose Stele (Karnak) and Carnarvon Tablet' is more than two objects: a hieratic writing-board (Carnarvon Tablet I), a second broken board (Tablet II, a different, literary text), and at least one commemorative stone stela of Kamose from Karnak. The pages read give different accounts of the stone: Digital Karnak describes a 'Victory Stela'
      found in fragments in the foundation of the 2nd Pylon and the fill of the 3rd Pylon, now in the Luxor Museum; the Rutgers text on 'The Second Stela of Kamose' says it was discovered in 1954 in Karnak and used as the base of a statue of Ramesses II; the Minot reader says two stone fragments were found in 1932 and 1935. None of the pages says how these relate, and whether the tablet copies one of the stelae has not been checked against the objects.
    statement_kind: search_result
    evidence_class: material
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured: no count or survey of how the objects are described was read."
    would_change_if: "the Luxor Museum record, Habachi 1972, Lacau (ASAE 39) or the TLA records are read and say which stelae exist, where each was found and what each preserves"
    next_step: "Read the TLA records (in a browser), Habachi 1972 and Lacau, ASAE 39, for each stone's findspot, holder and text; then read whether the tablet copies the first stela."
    anchor:
      type: search-record
      description: >
        Read directly: Digital Karnak's object page (raw HTML; the page does not say which stela it describes); the Rutgers Part I text ('The second stela of Kamose, recording his northern campaign, was discovered in 1954 in Karnak. It was used as the base of a statue of Ramesses II.', and, quoting Habachi, that its abrupt beginning 'points to the fact that this stela is the continuation of a previous yet undiscovered stela');
        the Rutgers bibliography (entry 33 is Habachi 1972; entry 47 lists Lacau, ASAE 39, 'Une stele du roi Kamosis', and names Habachi by short name among the editions of the Kamose stelae); the Minot page (two stone fragments, 1932 and 1935, unsourced); Gardiner 1916, p. 109: "It is by no means unlikely that the text of the tablet is a direct copy from a stele set up by Kamose in one of the Theban temples" (his conjecture in 1916, before the stelae were found).
        The two findspot statements (Digital Karnak; Rutgers) differ and may describe different stones. Not opened: the TLA (blocked), Habachi, Lacau, Porter and Moss.
