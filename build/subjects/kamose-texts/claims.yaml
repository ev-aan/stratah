  - id: kamose-sp-king-of-middle-egypt-and-thebes
    state: proposed
    statement: "'Kamose, king of Middle Egypt' (dh-HN0wNVpfunM-18) / 'Kamose, king of Middle Egypt and Thebes' (dh-qL1VmGF3BF8-16)."
    statement_kind: judgment
