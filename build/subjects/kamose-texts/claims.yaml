  # ------------------------- WHAT THE TABLET TEXT SAYS (printed readings) -------------------------

  - id: kamose-tablet-text-avaris-kush
    state: proposed
    statement: >
      Three printed translations of Carnarvon Tablet I have the king speak of two rival princes. Gardiner 1916: "when one prince is in Avaris and another is in Kush, and I sit united with an 'A'am and a Negro". Griffith 1912: "One prince is in Avaris, another in Ethiopia!" Weill 1913: "Un prince est dans Avaris, un autre en Nubie !"
      Gardiner also has the king say "My desire is to deliver Egypt, and to smite (?) the 'A'amu."
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the signs of the lines are read and differ, or the second stela's text shows a different relation to Avaris and Kush"
    anchor:
      type: interpretive
      description: >
        Gardiner 1916, p. 99 and the Consecutive Translation (page image and OCR; Gardiner marks doubtful words with question marks, and identifies Avaris as 'the stronghold and capital of the Hyksos'); Griffith, chapter VI of Carnarvon and Carter 1912; Weill 1913, p. 538 (page image).
        These are translations of photographs of one board; the signs were not read. Griffith had Gardiner's help with readings and Weill worked from the 1912 plate, so the three are not independent of the board's reproductions or of each other. They agree here and differ elsewhere (see the booty and regnal-year claims).
      sources: [src-gardiner-translation, src-griffith-translation, src-weill-1913-ja]
    basis: >
      # V: all three read 2026-10-14 and 2026-10-16. The text is a king's speech to his council, reported in the first person; the council replies, in Gardiner's rendering, that "Elephantine is strong, and the middle part (?) is with us as far as Cusae", and counsels waiting.

  - id: kamose-tablet-text-booty-slaves
    state: proposed
    statement: >
      In the one raid the tablet narrates, at Nefrusi, the three printed translations render the booty line differently. Gardiner 1916: "My soldiers were like lions with their prey, carrying off slaves, cattle, fat and honey, and dividing up their possessions". Griffith 1912: "I caused my soldiers to embark like wolves with their prey, with slaves, cattle .... honey, dividing their property" (no 'fat'; the dots are Griffith's).
      Weill 1913 (French): "mes soldats, comme des lions avec leurs proies (?), avec des hommes, des bestiaux, ... du miel, se partageant ces choses", that is 'with men, cattle, ... honey'. In the same passage Gardiner's note says the sending of the enemy's wife to the river-bank "must signify that she was appropriated by the conqueror".
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the sign rendered 'slaves' by two translators and 'hommes' by one is read and means captives, servants, men or something else, or a reader's translation (Habachi 1972, Smith and Smith 1976) gives a different word"
    anchor:
      type: interpretive
      description: >
        Gardiner 1916, p. 107 (translation and note; OCR and page image): the booty line itself carries no question mark in his translation; of the final sentences he says "my conjectural renderings make very free with both vocabulary and grammar", and of the whole text that it is "the work of a very careless and ignorant copyist". Griffith 1912, chapter VI (Gutenberg text); Weill 1913, p. 540 (page image; his note 2 on the Nefrusi line says "Je dechiffre mal le contexte").
        Three translations of photographs of one board. Griffith had Gardiner's help; Weill worked from the 1912 plate. They are not independent translators, and they do not agree on the noun. The hieratic word was not seen or read here, and the printed hieroglyphic transcription (Gardiner p. 106) was viewed but its signs were not read.
        Gardiner and Griffith agree on 'slaves'; Weill's 'hommes' is the third reading. Which of them is right is not decided here.
      sources: [src-gardiner-translation, src-griffith-translation, src-weill-1913-ja, src-jea3-plates, src-carnarvon-carter-1912-ia]
    basis: >
      # V: Gardiner p. 107 read from the page image 2026-10-16; Griffith read 2026-10-14; Weill p. 540 read from the page image 2026-10-16. The translated line states booty taken by his soldiers at one place; none of the three gives numbers or the origin of the persons.

  - id: kamose-tablet-teti-son-of-piopi
    state: proposed
    statement: >
      The enemy named in the Nefrusi passage is read differently. Gardiner 1916 has "Teti the son of Piopi in Nefrusi"; Griffith 1912 has "Teta the son of Pepa in Nefrus"; Weill 1913 says in a note that he cannot see where Griffith read that name ("n'arrive absolument pas a voir ou Griffith a pu lire"). Newberry, as Gardiner reports him (not opened here), takes Piopi to be a variant of Apopi (Apophis)
      and says Teti son of Piopi "may have been the son of one of the Hyksos rulers called Apophis, probably the last of them" (Gardiner's wording of Newberry's view).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the signs of the name are read, or Newberry 1913 is opened and says something different"
    anchor:
      type: interpretive
      description: >
        Gardiner 1916, pp. 106 and 110 (OCR; the Newberry view is Gardiner's report of it); Griffith 1912 chapter VI; Weill 1913, p. 540, note 2 (page image). Newberry 1913 was not opened. Weill's note says he reads the context badly; it is not a rival reading.
        The identification of Teti with a son of an Apophis is Newberry's, via Gardiner, and is an interpretation of a name, not a statement in the text.
      sources: [src-gardiner-1916-jea3, src-griffith-translation, src-weill-1913-ja, src-newberry-1913-psba]
    basis: "# V: read 2026-10-16. Three readers, two readings and one note of non-reading; one interpretation known only through Gardiner."

  - id: kamose-tablet-text-no-defeat-of-rulers
    state: proposed
    statement: >
      None of the three translations of the tablet says that Kamose defeated the king of Avaris or a Nubian ruler, took Avaris, or fought in Nubia. The only victory narrated is over the man named Teti son of Piopi at Nefrusi (Gardiner), Teta son of Pepa in Nefrus (Griffith). Griffith says Ahmose, Kamose's successor, "completed the overthrow of the Hyksos by the capture of Avaris"
      and that a rival in Nubia was "likewise crushed by Ahmosi". Gardiner finds no sign that the writer knew of the taking of Avaris. In the pages of Weill read (pp. 536 to 544), no defeat of the ruler in Avaris is described either; Weill, who reads the text as written after the final Theban victory, nevertheless describes it as 'une proclamation triomphale' and says that, after the great lacuna, the speech turns to 'le recit d'une guerre victorieuse contre les etrangers et de leur expulsion'.
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    absence_anchor: true
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the lost lines of the tablet, the first or second stela, or another source shows a defeat of the Avaris ruler or a Nubian ruler by Kamose"
    anchor:
      type: search-record
      description: >
        Searched Gardiner's Consecutive Translation (pp. 107 to 108), Griffith's summary and Weill's rendering (p. 540) for: the capture of Avaris, the defeat of 'the prince in Avaris' or 'the prince in Kush', and any action in Kush. None found. Gardiner's Conclusions: "I am unable to discover any word or phrase which indicates or implies that the writer was aware of the subsequent taking of Avaris and of the ultimate triumph of the Thebans."
        Griffith says "the flaking of the stucco about the fracture has robbed us of one line and of the greater part of two more", and that after the passage on the soldiers "Another very obscure line follows". The text is fragmentary, and Gardiner marks the last sentences as conjectural; the absence is from fragments. The second and first stelae were not read.
        Newberry's view (via Gardiner) that Teti may be a son of Apophis is an interpretation of a name and is recorded in kamose-tablet-teti-son-of-piopi; it is not a statement in the text that the ruler of Avaris was defeated.
      sources: [src-gardiner-translation, src-griffith-translation, src-weill-1913-ja, src-gardiner-1916-jea3, src-carnarvon-carter-1912]
    basis: "Absence from a fragmentary tablet in translation is weak. Held at provisional (absence_anchor)."

  - id: kamose-stela-descriptions-victory-over-apophis
    state: proposed
    statement: >
      Two pages describe stone texts of Kamose as victory texts without saying which stela they mean. Digital Karnak says its 'Victory Stela of Kamose' 'celebrates the triumph of Theban ruler Kamose over the Hyksos king Apophis' and that 'The beginning of the text records a letter intercepted by Kamose's army to the king of Kush from Apophis'.
      The Rutgers commentary on the second stela says the destruction of Avaris came later, 'between the regnal years 18 and 22 of the succeeding Ahmose I', and, of the words 'The Asiatic has perished!', that they count 'a little more than wishful thinking'; its Part III commentary has the Hyksos ruler frightened by Kamose's approach, Kamose's force sent against the Baharia oasis, his return to Thebes and the stela set up by an official named Neshi.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "Habachi 1972 or Smith and Smith 1976 is read and says the stela narrates a capture or death of Apophis, or the fall of Avaris under Kamose"
    anchor:
      type: interpretive
      description: >
        Digital Karnak page (raw HTML read 2026-10-16) and Rutgers Parts II and III commentary (all pages read 2026-10-16). The two are by different authors and say different things; neither is the stela, and the Rutgers date for the fall of Avaris is stated without a source in the commentary.
        The Digital Karnak page and the Rutgers Part II place the letter to Kush differently (beginning of the text, against a later part). Which stelae each describes is not stated. 'Triumph' and 'victory' are the pages' words, not a translation of the stela.
      sources: [src-digital-karnak-victory-stela, src-rutgers-kamose-2013]
    basis: "# V: read 2026-10-16. A victory text is not the same as the capture of the enemy king; none of the pages read says Apophis or Avaris fell to Kamose."

  - id: kamose-second-stela-booty-list
    state: proposed
    statement: >
      The Rutgers commentary on Part II of the second stela says one passage 'introduces a long list of booty captured from these ships' (hundreds of cargo ships of cedar). The vocabulary the commentary gives for the passage lists materials: cedar, lapis lazuli, silver, turquoise, bronze, axe, moringa-oil, incense, fat or unguents, honey, willow and other precious woods.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
