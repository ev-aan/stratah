    basis: "Not read at the objects. Two findspot statements for the stone differ; neither is settled."

  - id: kamose-tablet-findspot-1908
    state: contested
    statement: >
      Two printed accounts of where Carnarvon Tablet I was found differ. Carter (in Carnarvon and Carter 1912) places it, in the 1908 work, on a rock ledge among pottery and mutilated mummies in the courtyard of Seventeenth Dynasty tomb No. 9 at the Birabi site near the mouth of the Deir el-Bahari valley; Carter's introduction in the same book gives a second wording: after three days' digging in the loose debris at the Birabi, 'at the very threshold of the tomb (afterwards numbered 9)' two wooden tablets were found. Gardiner 1916 repeats the ledge account.
      Maspero (note dated 23 April 1909) says that in February of the previous year Carnarvon, digging in the hill of Drah Abu'l Naga, found the two pieces of the board among the spoil of earlier excavations; he names neither tomb No. 9 nor the Birabi.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured. The excavators' account is the one repeated by Gardiner; no survey of other repetitions was read."
    would_change_if: "field notes, Service des Antiquites records or the tomb itself show where the board was found, or show that 'Drah Abu'l Naga' and 'the Birabi' name one spot"
    disputed_by:
      - {who: "Howard Carter (1912, chapter V of Carnarvon and Carter)", kind: person, position: "found in 1908 on a rock ledge in the courtyard of tomb No. 9, Birabi site; the excavator's own account", source_read: "Gutenberg text and Internet Archive scan, chapter V read", via: direct}
      - {who: "A. H. Gardiner (1916)", kind: person, position: "repeats the Birabi account (a ledge near the entrance to a plundered tomb in the Birabi), citing the 1912 report", source_read: "Gardiner 1916 p. 95, read in OCR", via: direct}
      - {who: "Gaston Maspero (1909)", kind: person, position: "found by Carnarvon in February 1908 in the Drah Abu'l Naga hill, among spoil of earlier excavations; does not say where he had this from", source_read: "Recueil de travaux 31, p. 146, OCR text; page image not viewed", via: direct}
    positions:
      - {label: "Birabi, courtyard of tomb No. 9, on a ledge", holder: "Carter 1912; Gardiner 1916 (repeating Carter)", ground: "the excavator's report"}
      - {label: "Drah Abu'l Naga hill, among spoil of earlier excavations, February 1908", holder: "Maspero 1909", ground: "not stated"}
    anchor:
      type: interpretive
      description: >
        Carnarvon and Carter 1912, chapter V: "During the work of 1908 the courtyard was found to contain great masses of pottery and mutilated mummies, and it was among these, on a rock ledge, that the important historical tablet referring to the expulsion of the Hyksos by the General Kamosi" and the second tablet were recovered.
        Carnarvon and Carter 1912, introduction: "at the very threshold of the tomb (afterwards numbered 9) were discovered two wooden tablets". Maspero 1909, p. 146 (OCR): "le comte de Carnarvon, fouillant a Thebes dans la montagne de Drah abou'l Neggah, y recueillit, parmi les deblais de fouilles anterieures, les deux morceaux d'une tablette a ecrire". Gardiner repeats the excavators' account and is not a second witness. Maspero was not the excavator and does not give his source. Read in text; the two places may or may not be the same spot.
      sources: [src-carnarvon-carter-1912, src-gardiner-1916-jea3, src-maspero-1909-rt31]
      nodes: [{node: kamose-1908-carnarvon-tablet-found, verb: qualifies}]
    basis: >
      # V: Carter and Gardiner read 2026-10-14; Maspero read 2026-10-16 (OCR). Two accounts that differ; neither is checked against field records. The excavators' own words on the text ('expulsion of the Hyksos', 'General Kamosi') are their reading of the board, not the board.

  - id: kamose-board-faces-as-photographed
    state: established
    statement: >
      The photographs of Carnarvon Tablet I in the 1912 report (Plates XXVII and XXVIII) and in JEA 3 (Plates XII and XIII) show a rectangular writing-board with a long crack through it. One face carries a ruled grid and a block of closely written lines of hieratic along one long side; the other face carries closely written lines of hieratic across the whole surface,
      broken by the crack and by a patch where the writing surface is lost along it. JEA 3 Plates XII and XIII show only the text face, in two portions; the face with the ruled grid appears only on 1912 Plate XXVII. The printed accounts name the faces inconsistently: Gardiner 1916 calls the historical text the obverse, and the 1912 report's own introduction says one tablet has the historical text 'on its obverse' and the Ptah-hetep copy 'on its reverse', but the 1912 plates are captioned 'Obv.' for the face with the grid and 'Rev.' for the face with the continuous text (so the contradiction is inside the 1912 book, between its text and its plate captions).
    statement_kind: reported
    evidence_class: material
    confidence: moderate
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the board is examined and its faces, crack or lost areas differ from the printed photographs, or the plates are shown to be of another object"
    anchor:
      type: material
      description: >
        Viewed 2026-10-16: the JEA 3 PDF (Plate XII, leaf 129, caption 'Carnarvon Tablet No. I, Right-hand portion'; Plate XIII, leaf 130, 'Left-hand portion') and the 1912 report's scan (leaf 173, caption 'Carnarvon Tablet I. Obv.', showing the ruled grid; leaf 175, caption 'Carnarvon Tablet I. Rev.', showing continuous lines of writing and a long crack with a lost patch).
        What is recorded is the layout and the captions only. Photographs, not the object. No hieratic sign was read, no line or stroke was counted from them, and nothing about the date or the booty line rests on them. Griffith's chapter in the same 1912 book says the face has eight lines of the Ptah-hetep text and a draught-board and the other side has the historical text 'of no less than seventeen long lines', and that 'the flaking of the stucco about the fracture has robbed us of one line and of the greater part of two more'.
      sources: [src-jea3-plates, src-carnarvon-carter-1912-ia, src-griffith-translation, src-gardiner-1916-jea3]
      nodes: [{node: object-carnarvon-tablet-i, verb: supports}]
    basis: >
      # V: the plates were viewed 2026-10-16 in two separate printings (the 1912 report and the 1916 journal; different photographs). The layout agrees across them and with Griffith's and Gardiner's descriptions apart from the obverse/reverse labelling, which differs and is reported as such. Not read: any sign.

