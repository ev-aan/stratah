subject: kamose-texts
title: "Kamose's texts against Avaris: what the Carnarvon Tablet says, what is not read, and what Dead Hidden says"
question: "Does Kamose enslave peoples, and what are the dates?"
dig_status: open
headline_status: draft
search_summary: >
  The Carnarvon Tablet I, a hieratic writing-board found in 1908 at Thebes, carries a text of the Theban king Kamose. In the two printed translations read (Gardiner 1916; Griffith 1912), his soldiers carry off
  'slaves, cattle, fat and honey' after he overthrows a man named Teti son of Pepi at Nefrusi; Avaris and Kush are named in his speech as the seats of two rival princes. Neither translation says he defeated the king of Avaris
  or a Nubian king, or enslaved their peoples. No object, plate or hieratic sign was read, and no BCE date is fixed here.
description: >
  First dig on the Kamose texts. Read in full: Gardiner's 1916 article (OCR of the Journal of Egyptian Archaeology volume 3) and the excavators' report of 1912 with Griffith's chapter (Project Gutenberg text). Read in part: two web
  object records, a Rutgers transliteration of the second stela (no translation), the abstract of a 2010 radiocarbon chronology. Blocked: the TLA (bot verification). Not located: the second stela's edition (Habachi 1972), the first stela, the Cairo
  record. Two Dead Hidden speaker claims are split into six parts and kept in the speaker's words.
divergence_note: >
  The speaker's version is a clean sequence: in 1550 BC Kamose, king of Middle Egypt (and Thebes), rebelled against the king of Avaris (the Hyksos) and the Nubian king, defeated both, and enslaved their people. The text that was read is narrower and different in
  kind. It is the speech and boast of a Theban king on a copied commemorative text; it names one prince in Avaris and another in Kush as the problem; it narrates one raid, on Nefrusi, in which soldiers take slaves as booty; it does not narrate a defeat of either named
  ruler or a campaign against Nubia. Whether Kamose reached Avaris, fought Nubia, or how long he ruled are open and partly rest on stelae that were not read (Stela I fragments, the second stela). The gap between the clean sequence and the one-raid text is the product here.

assessment:
  question: "Does Kamose enslave peoples, and what are the dates?"
  answer: partly
  headline: "One printed reading says Kamose's soldiers took slaves in one raid; his people-wide enslavement of Avaris or Nubia is not in what was read, and the BCE date is not fixed."
  key_points:
    - "Two translations of Carnarvon Tablet I have his soldiers 'carrying off slaves, cattle, fat and honey' at Nefrusi; the hieratic word was not seen."
    - "The tablet names Avaris and Kush only in his speech; it does not report a defeat of either ruler or any action against Nubia."
    - "The tablet's regnal year is 3 in one reading and 7 in another; the BCE date (speaker: 1550) is not fixed by anything read."
  text: >
    What was read is two printed translations of one copied text (Gardiner 1916, Griffith 1912), which are not primary data and are not independent of each other. On that footing, the one raid described at Nefrusi includes booty of slaves and the wife of the enemy led to the river-bank
    (Gardiner takes this to mean she was appropriated). That is enslavement by Kamose's soldiers in one episode, not of 'their people' of Avaris and Nubia. The two stelae that may say more were not read. The dates: a regnal year, three or seven, is the only date in the tablet; reign figures of about 1555 to 1550 BCE
    appear on two web pages without a stated authority; a radiocarbon range for the start of the following dynasty bounds the period from the other side.
  basis: [kamose-tablet-text-booty-slaves, kamose-tablet-text-no-defeat-of-rulers, kamose-tablet-regnal-year, kamose-absolute-date-bce]
  would_settle: "Reading the hieratic of the booty line and the regnal date on Plate XIII or the board in Cairo, reading the second stela's edition (Habachi 1972) for its booty and Kush passages, and reading a named chronology for the Seventeenth Dynasty."

claims:

  # ------------------------- THE OBJECTS -------------------------

  - id: kamose-objects-identification
    state: searched_gap
    statement: >
      The handoff's 'Kamose Stele (Karnak) and Carnarvon Tablet' is more than two objects: a hieratic writing-board (Carnarvon Tablet I), at least one more writing-board (Tablet II, a different text), and, per sources not opened here, two commemorative stelae
      of Kamose found at Karnak (a first whose fragments were found in the 1930s and a second found in the 1950s, Luxor Museum J.43). How these relate (whether the tablet copies one of the stelae) has not been checked against the objects.
    statement_kind: search_result
    evidence_class: material
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 3
    adoption_note: "Repeated in summaries; the fragments and the second stela were not opened here."
    would_change_if: "the Luxor Museum record, Habachi 1972, Porter and Moss or the TLA records are read and say which stelae exist, where they were found and what each preserves"
    next_step: "Read the TLA records (in a browser), Habachi 1972 and Porter and Moss, Topographical Bibliography II, for each object's findspot, holder and text; then read whether the tablet copies the first stela."
    anchor:
      type: search-record
      description: >
        Read: Gardiner 1916 (who says it is 'by no means unlikely that the text of the tablet is a direct copy from a stele set up by Kamose in one of the Theban temples', conjecture in 1916); Digital Karnak's page for a 'Victory Stela of Kamose' (Luxor Museum; 'Found in fragments in the foundation of the 2nd Pylon and the fill of 3rd Pylon'; the page does not say which stela it is);
        the Rutgers transliteration of 'The Second Stela of Kamose'; the Minot reader (fragments found 1932 and 1935, unsourced). Blocked: TLA. A search summary gave a different findspot for the second stela (foundation of a statue of Ramesses II, 1954); it was not opened and the two findspot statements differ.
      sources: [src-gardiner-1916-jea3, src-digital-karnak-victory-stela, src-rutgers-kamose-2013, src-minot-oer, src-tla-kamose, src-habachi-1972]
    basis: "Not read at the objects. Two findspot statements for the second stela differ; neither is settled."

  - id: kamose-tablet-findspot-1908
    state: proposed
    statement: >
      Carnarvon Tablet I was found in 1908 by the Carnarvon-Carter excavation, on a rock ledge among pottery and mutilated mummies in the courtyard of a Seventeenth Dynasty tomb (No. 9) at the Birabi site near the mouth of the Deir el-Bahari valley, Thebes.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 3
    adoption_note: "Stated in summaries as 'found by Lord Carnarvon in 1908'; the tomb number and the ledge are from the report."
    would_change_if: "field notes, Service des Antiquites records or the tomb itself show a different findspot, or the board is shown not to come from this deposit"
    anchor:
      type: interpretive
      description: >
        Carnarvon and Carter 1912, introduction and chapter V (Carter): 'During the work of 1908 the courtyard was found to contain great masses of pottery and mutilated mummies, and it was among these, on a rock ledge, that the important historical tablet referring to the expulsion
        of the Hyksos by the General Kamosi ... and the second broken tablet were recovered.' Gardiner 1916, p. 95, repeats the findspot from that book. Read in text; the excavators are the one witness.
      sources: [src-carnarvon-carter-1912, src-gardiner-1916-jea3]
      nodes: [{node: kamose-1908-carnarvon-tablet-found, verb: supports}]
    basis: >
      # V: both read 2026-10-14. One witness (the finders). Gardiner is a repeat of the same report, not corroboration. The excavators' own words on the text ('expulsion of the Hyksos', 'General Kamosi') are their reading, not the board.

