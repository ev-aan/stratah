  - id: kamose-tablet-date-of-writing
    state: contested
    statement: >
      Whether Carnarvon Tablet I was written within a few decades of the events it reports, or later and as literature, is argued. Gardiner 1916, Griffith 1912 and (via Gardiner) Newberry judge the hand to be of the end of the Seventeenth or very early Eighteenth Dynasty and the text a copy of a commemorative stela. Maspero 1909 wrote that the scribe of 'son livre' (the Ptah-hetep text that follows the board's description) 'avait vecu sans doute vers le temps de la XXe dynastie' because his writing seems to belong to the cursive hands of that period; Gardiner takes this to concern the Ptahhotpe copy, and Maspero separately called the historical text the beginning of a half-historical tale (adding that his guess that it opens a ghost story known from ostraca is 'not very certain'). Maspero does not say, in the passage read, that the hand of the historical text is of the Twentieth Dynasty. Weill 1913 reads the text as written after the final Theban victory and as literary, while granting that the hand is close to that of documents before the New Kingdom and keeping, as history, the memory of a war.
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "a palaeographical study of the hand by a specialist independent of these readers, or a dated parallel in the same hand, or the first stela's parallel is read"
    disputed_by:
      - {who: "A. H. Gardiner (1916), with F. Ll. Griffith and P. E. Newberry", kind: person, position: "hand of the end of the Seventeenth Dynasty; 'in no case can it have been written more than fifty years later'; a copy of a commemorative stela. His own concessions: 'The question as to its value as a historical document is better deferred', the text is 'the work of a very careless and ignorant copyist', and 'No doubt this kind of historical source is not all that could be desired'", source_read: "Gardiner 1916 pp. 96 to 110, read; Griffith ('written within a few years of the events recorded') read directly", via: direct}
      - {who: "G. Maspero (1909)", kind: person, position: "the text on the board is 'le commencement d'un conte a demi historique'; of its being the start of a ghost story he writes 'cela n'est pas bien certain'. Separately, of the scribe of 'son livre' (the paragraph after the board's description, which goes on to the Ptah-hetep text) he writes 'il avait vecu sans doute vers le temps de la XXe dynastie, car l'ecriture de son livre semble se rattacher aux mains cursives de cette epoque'. Gardiner 1916 p. 96 reports this as Maspero's opinion that the scribe of the Ptahhotpe duplicate lived towards the Twentieth Dynasty; it is not stated for the hand of the historical text", source_read: "Recueil de travaux 31, p. 146, OCR; Gardiner's report, p. 96", via: direct}
      - {who: "R. Weill (1913)", kind: person, position: "composed after the definitive Theban victory; 'exclusivement litteraire, retrospective'; 'une sorte de roman historique'; but he writes that the hand is so like pre-New-Kingdom documents that one is 'tres tente' to date it, as Griffith does, a few years after the events, and that, 'au point de vue proprement historique', one keeps the memory of a war in which Ahmose's predecessors at Thebes fought the powers of Lower Egypt", source_read: "Journal asiatique 1913, pp. 541 to 544, page images", via: direct}
    positions:
      - {label: "near-contemporary copy of a commemorative stela", holder: "Gardiner 1916; Griffith 1912; Newberry 1913 (via Gardiner)", ground: "palaeography (comparison with Moller's hieratic forms, Rhind and Ebers papyri) and the form of Egyptian commemorative stelae"}
      - {label: "text partly or wholly literature, composed later", holder: "Weill 1913; Maspero 1909 (a half-historical tale; his Twentieth-Dynasty remark concerns the scribe of the Ptahhotpe copy, as Gardiner reads him)", ground: "Weill: the content, which he reads as retrospective; Maspero: not stated in the passage read"}
    anchor:
      type: interpretive
      description: >
        Gardiner 1916 (read start to end, with the page images of pp. 97 to 107), Griffith 1912, Maspero 1909 p. 146 (OCR) and Weill 1913 pp. 541 to 544 (page images), each read in its own words. Newberry 1913 was not opened. Gardiner is both the main source and a party to the dispute; Weill and Maspero argue the other side in their own texts, where they are quoted above.
        The hand was not seen as a palaeographer would see it; the plates were viewed and no sign was read. The first-stela fragments were not read, so Gardiner's 'a direct copy from a stele' remains his conjecture here.
      sources: [src-gardiner-1916-jea3, src-griffith-translation, src-maspero-1909-rt31, src-weill-1913-ja]
    basis: "Four directly read positions; one more (Newberry) through Gardiner. Gardiner, Griffith and Newberry are not fully independent of one another (Griffith had Gardiner's help; Gardiner says he agrees with Griffith and Newberry). Maspero's Twentieth-Dynasty remark is about the scribe of the Ptah-hetep text, not shown to be about the historical text. Each author's concessions are listed beside the position. Not closed."
    next_step: "Open Newberry 1913; view the board's hand with a palaeographer; read what a modern palaeographer says."

