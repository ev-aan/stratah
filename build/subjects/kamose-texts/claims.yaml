        Read: Gardiner's translation (the king speaks of 'one prince in Avaris and another in Kush' who 'share the land with me' and says he wants 'to deliver Egypt'; no text read calls the Hyksos his overlord) and his Conclusions, where he writes that "In the romance of the Sallier papyrus Seqnenre is a more or less obedient vassal of the Hyksos ruler Apophis" (Kamose probably his successor). Breasted 1906 says of the Sallier tale that "Most of the current translations and interpretations of this document are largely the products of a vivid imagination", and Weill 1913 reads it as a romance.
        The Rutgers Part I commentary reads Kamose as resenting that Apophis calls him 'chief(tain)' while he calls himself 'ruler' (a reading of a passage whose grammar Toth says Habachi takes differently). The Sallier tale and the stelae were not read. Nothing read states that Thebes owed submission to Avaris at Kamose's accession, and nothing read denies it.
      sources: [src-gardiner-translation, src-gardiner-1916-jea3, src-breasted-1906-ar2, src-weill-1913-ja, src-rutgers-kamose-2013]
    basis: "The tablet reports a war, not an act of rebellion; 'rebelled' needs a source showing subjection, and none was read. Not filed refuted because the stelae and the Sallier tale were not read. (Earlier filed as contested; changed to proposed because no source read holds the rebellion reading.)"
    next_step: "Read the second stela's opening (Habachi 1972; Smith and Smith 1976) and the Sallier tale in a named edition; look for any statement of subjection."

