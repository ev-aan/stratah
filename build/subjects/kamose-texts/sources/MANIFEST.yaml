      provenance: "Printed in JEA 3 (1916) as Gardiner's rendering of the hieratic text, made from Herr Koch's 1910 photographs and his own study (Gardiner says some readings are 'by no means as certain as I could have wished'; he calls the writing the 'work of a very careless and ignorant copyist')."
      tests:
        - "Griffith's separate summary translation (chapter VI of Carnarvon and Carter 1912) gives the same booty line ('slaves, cattle ... honey') and the same Avaris/Ethiopia(Kush) line (could have failed). Griffith says he had Gardiner's help with readings, so the two are not independent."
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Hieratic not read; the word rendered 'slaves' was not seen", "No translation by a different scholar from a different reading of the board was read (Habachi, Smith, Redford and others not opened)"]
      next_step: "Read a second, independently made translation of the booty line (for example H. S. Smith, ZAeS 103, 1976) and the signs on Plate XIII."
      checked: 2026-10-14

  - id: src-carnarvon-carter-1912
    title: "Earl of Carnarvon and Howard Carter, Five Years' Explorations at Thebes: a record of work done 1907-1911 (Oxford: Henry Frowde, Oxford University Press, 1912), preface, chapter V (Carter) and chapter VI (Griffith)"
    url: https://www.gutenberg.org/ebooks/48382
    document_class: "excavators' report: testimony by the finders (not the object). Not primary data."
    read: "yes, directly (Project Gutenberg plain text, local sha256 8c06225228735e9f2615e458553b935b2216eb5dbc99ecb934c82cc3fcd2468c; preface, introduction paragraph on the tablets, chapter V and chapter VI read)"
    publisher_funding_control: >
      Excavation director and book author: the Earl of Carnarvon, who writes in the introduction 'I began tentative digging among the Kurneh hills ... in the spring of 1907' and in the preface thanks Maspero, Director-General of the Service des Antiquites (the Egyptian state antiquities service that licensed digs), and Mr Weigall of that service. Howard Carter was 'in charge of all operations'.
      The book does NOT state who paid for the work in the passages read; that Carnarvon paid is a search-summary lead, not read here. Printed by Horace Hart at the Oxford University Press for Henry Frowde (title page, read). Chapter VI was written by F. Ll. Griffith, who says he had help from Gardiner. Control of the finds (division with the Egyptian state) not read: UNRESEARCHED.
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Gutenberg #48382, produced from Internet Archive images by volunteers (credit line in the file); text of a 1912 Oxford printing, public domain. Holder of the original not recorded."
      tests:
        - "Gardiner 1916, writing four years later, gives the same find facts (Birabi, ledge near the entrance of a plundered Seventeenth Dynasty tomb, found by Carnarvon in 1908) and cites this book's plates and pages 30-37 (could have failed). Gardiner draws on this book, so he is not an independent witness to the find."
        - "Chapter V's account of the ledge and Griffith's chapter VI both place the historical text on the 'face' or 'other side' of a board whose Ptahhotpe copy is on the reverse; Gardiner describes the same board layout (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Plates XXVII and XXVIII (photographs of Tablet I) are images in the book and were not viewed", "Findspot rests on the excavators alone; no field notes or Service des Antiquites record read"]
      next_step: "View Plates XXVII-XXVIII in the Internet Archive scan of the 1912 printing; read the Cairo Museum entry for the tablet."
      checked: 2026-10-14

