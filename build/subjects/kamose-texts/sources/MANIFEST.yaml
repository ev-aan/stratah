      chapter V and chapter VI. Extract: sources/extracts/carnarvon-carter-1912-extract.txt.
    publisher_funding_control: >
      Open task. The introduction (read) has Carnarvon write 'I began tentative digging among the Kurneh hills ... in the spring of 1907'; the preface thanks Maspero (Director-General of the Service des Antiquites) and Weigall of that service; Carter was 'in charge of all operations'.
