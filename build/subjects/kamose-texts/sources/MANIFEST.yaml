      status: authenticated
      strength: moderate
      provenance: "Gutenberg #48382, produced from Internet Archive images by volunteers (credit line in the file; whether it matches this record was not checked); text of a 1912 Oxford printing, public domain. Holder of the original not recorded."
      tests:
        - "Gardiner 1916, four years later, gives the same find facts (Birabi, ledge near the entrance of a plundered Seventeenth Dynasty tomb, found by Carnarvon in 1908) and cites this book (pl. xxvii and xxviii, pp. 30-7) (could have failed). Gardiner draws on this book, so he is not an independent witness to the find."
        - "Maspero 1909, a separate account, gives a different place for the find (see src-maspero-1909-rt31); so the accounts do not all agree (could have failed)"
        - "The Gutenberg text and the Internet Archive scan of the same printing carry the same Griffith chapter (compared on the passages quoted) (could have failed)"
      tested_by: "Stratah dig session (not an independent review)"
      gaps: ["Findspot rests on the excavators alone against Maspero's different account; no field notes or Service des Antiquites record read", "Gutenberg credit line not compared with this record"]
      next_step: "Read the Service des Antiquites annual report for 1908 or Carter's notes for the find of the board."
      checked: 2026-10-16

