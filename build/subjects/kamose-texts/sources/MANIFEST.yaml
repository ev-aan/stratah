    read: "yes, the page as returned by the fetch tool (summarised by the tool, not read raw), 2026-10-14. The page text said, as reported by the tool, 'Current Location: Luxor Museum', 'Found in fragments in the foundation of the 2nd Pylon and the fill of 3rd Pylon', 'Dynasty 17, Second Intermediate Period (1555-1550 BCE)', 'Limestone', 'H: 231.00cm, W: 112.5cm, D: 28.0cm', credits 'C. Zarnoch, E. Sullivan'."
    publisher_funding_control: >
      The About page (as reported by the fetch tool): the project was designed and built at UCLA 'under the direction of Dr. Diane Favro (director of the ETC) and Dr. Willeke Wendrich'; in 2021 moved to UC Santa Cruz 'under the direction of Dr. Elaine Sullivan'. No funding source or sponsor is stated on the pages read: UNRESEARCHED (public universities; grants behind the project not looked up).
    authenticity:
      status: unchecked
      gaps: ["Page is a digital item with no independent capture (rule A8)", "Does not give a museum accession number or the text", "The page does not say which of Kamose's stelae it is; the content (an intercepted letter from Apophis to Kush) is that of the second stela per other sources not opened"]
      next_step: "Compare with the Luxor Museum record and Habachi 1972 (the editio princeps)."
      checked: 2026-10-14
      capture: "none by an independent party"

