# Sources for the kamose-texts dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Rebuilt 2026-10-16 after the independent review of PR #30 (log L-07 to L-12 list every correction; earlier log entries are not edited).
#
# What was actually opened and read, in one place:
#   - PAGE IMAGES of Carnarvon Tablet I: Plates XII and XIII of Gardiner 1916 and Plates XXVII and XXVIII of Carnarvon and Carter 1912 (viewed 2026-10-16).
#     They are photographs of the board. Viewing them is not reading the hieratic: no hieratic or hieroglyphic sign was read in them, and no numeral or word is
#     counted or identified from them in this dig. What is recorded from them is layout only (claim kamose-board-faces-as-photographed).
#   - Four printed readings of the tablet, each opened in its own pages: Maspero 1909, Griffith 1912, Weill 1913, Gardiner 1916.
#   - The Rutgers teaching texts on Kamose's second stela (Parts I, II and III, all pages, with the editor's commentary) and on the autobiography of Ahmose son of Ebana (Parts I to III),
#     and Breasted's 1906 translation of that autobiography.
#   - Digital Karnak's object page and About page, the Minot reader page, the Haifa abstract of Bronk Ramsey et al. 2010.
# NOT opened: the second stela or the first stela in any edition (Habachi 1972, Helck, Smith and Smith 1976, Lacau, Pritchard), Newberry 1913, the TLA, the Cairo or Luxor
# museum records, the Sallier papyrus tale, the full Bronk Ramsey paper, any video of the speaker. Each has its own entry below.
#
# Storage: public-domain extracts are stored in sources/extracts/ (verbatim, elisions marked, contrary passages kept). Nothing in copyright is stored; the Rutgers texts are cited by URL and by
# short fragments in claims only. The sha256 given is of the file as downloaded on the date shown, into a working folder outside the repository.
# Tests were run by the dig session, which is not an independent review.
#
# Owner rule applied: books, translations, commentaries and videos are claims on the same footing, never primary data. Primary data here would be the board and the stelae, or a
# reproduction whose signs were read. None of the signs was read here.
retrieved: 2026-10-14
rebuilt: 2026-10-16
sources:

  - id: src-gardiner-1916-jea3
    title: "A. H. Gardiner, 'The Defeat of the Hyksos by Kamose: the Carnarvon Tablet, No. I', Journal of Egyptian Archaeology 3 (1916), pp. 95-110, with Plates XII (right-hand portion) and XIII (left-hand portion) of the board"
    author: "Alan H. Gardiner"
    url: https://archive.org/details/in.ernet.dli.2015.70975
    document_class: "secondary: a scholar's reading and translation of a copied text (interpretive). Not primary data."
    read: >
      yes, directly. Internet Archive OCR text of the whole volume (sha256 22121d9e67c981a1d5786c52a7aec1b217690ebf54a826b4245be8a3b5123841) and the PDF of the volume (sha256 27c3964da7b1b88824dccfcca681dc35753cd1fb112d6f0237130a141f21089a,
      397 leaves, downloaded 2026-10-16 from https://archive.org/download/in.ernet.dli.2015.70975/2015.70975.Journal-Of-Egyptian-Archaeology-Vol3.pdf). The article was read from first page to last. Pages 98, 99, 105, 106 and 107
      (the translation of the booty line) were also read from the page images. Correction to the first pass: the volume's two plates of the board are Plate XII (right-hand portion, facing p. 96) and Plate XIII (left-hand portion, facing p. 97);
      the OCR header reads 'Plate XIII' over both. Extract (trimmed to the quoted lines, L-15; hosting flagged for the owner): sources/extracts/gardiner-1916-jea3-extract.txt.
    publisher_funding_control: >
      Open task. The title page reads 'Published by the Egypt Exploration Fund' (read in the OCR). The first pass's statement that Gardiner's work 'was not institutionally funded' is withdrawn (log L-10): the Griffith Institute page it rested on is
      not reproducible from this record (no URL was recorded; a guess on 2026-10-16 failed) and said at most that he often paid for publications; it does not speak to this article. Who paid for this article, and how the Fund was financed and
      controlled in 1916, are not known here. Next step: open the Griffith Institute's Gardiner biography and the Egypt Exploration Society's history pages at recorded URLs and record what they say.
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Item in.ernet.dli.2015.70975 on the Internet Archive, scanned at IGNCA Delhi from the Central Archaeological Library (Government of India stamp on the first page); the item page's rights field reads Out_of_copyright. The first page OCR reads 'VOLUME V' although the running heads read 'Journal of Egyptian Archaeology, Vol. III' and the article is in volume 3; likely a cover or binding fault, not checked. Holder of the paper original not recorded."
      tests:
        - "Running head 'Journal of Egyptian Archaeology, Vol. III', the article title, the author and the page range 95-110 found in the OCR and in page images; the volume's list of plates (found in the OCR) names 'The Defeat of the Hyksos by Kamose' with Plates XII and XIII (could have failed)"
        - "A second scan of the same volume (Internet Archive in.gov.ignca.26512, OCR sha256 170a1e26c1b5f6258588bd6dd70ba7a1edb82e86f56db19f3f3d27c4951a9425) carries the same title and passages; same library, so not an independent witness to the original printing (could have failed)"
        - "Gardiner's report of Carter's and Griffith's earlier readings agrees in substance with Carnarvon and Carter 1912, read separately (could have failed)"
      tested_by: "Stratah dig session (not an independent review)"
      gaps: ["The hieroglyphic transcription printed in the article and Plates XII and XIII were viewed but their signs were not read", "No second printing compared", "Cover mismatch (Vol. V vs III) not resolved"]
      next_step: "A reader of hieratic compares the signs of the booty line (l. 16 to 17) and of the date (l. 1) on Plates XII and XIII with Gardiner's translation."
      checked: 2026-10-16

