# Sources for the kamose-texts dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored in the repository; sources are cited by URL and the sha256 of the local working copy is recorded. Tests were run 2026-10-14 by the dig session, which is not an independent review.
# Owner rule applied: books, translations, commentaries and videos are claims on the same footing, never primary data. Primary data here would be the objects (Carnarvon Tablet I,
# the Kamose stelae), their images or squeezes. NO image of any object was viewed and NO hieratic or hieroglyphic sign was read. The only image seen was a typeset hieroglyphic
# transliteration handout (Rutgers), which is not the object. Funders and controllers of each work are traced below; where a source did not say, the entry says UNRESEARCHED.
retrieved: 2026-10-14
sources:

  - id: src-gardiner-1916-jea3
    title: "A. H. Gardiner, 'The Defeat of the Hyksos by Kamose: the Carnarvon Tablet, No. I', Journal of Egyptian Archaeology 3 (1916), pp. 95-110, with Plate XIII (photograph) in the volume"
    url: https://archive.org/details/in.ernet.dli.2015.70975
    document_class: "secondary: a scholar's reading of a copied text (interpretive). Not primary data."
    read: "yes, directly (Internet Archive OCR text of the whole volume, local sha256 22121d9e67c981a1d5786c52a7aec1b217690ebf54a826b4245be8a3b5123841; the article read start to end including the Conclusions)"
    publisher_funding_control: >
      Published by the Egypt Exploration Fund, London (volume title page, read in the OCR: 'PUBLISHED BY THE EGYPT EXPLORATION FUND'). The Egypt Exploration Society's own history page (ees.ac.uk, opened) says only that it was founded in 1882
      by Amelia Edwards and is silent on how the Fund was financed or who controlled it in 1916: UNRESEARCHED. A search summary (not opened) said Edwards raised money by subscription and lecture tours; that is a lead, not read.
      The author, Alan Gardiner: the Griffith Institute's 'Artefacts' biographical page (opened) says he was 'endowed with sufficient income from his father', a wealthy businessman, and 'often paid for publications himself or helped finance others'. So Gardiner's work was not
      institutionally funded, on that page; whether the Fund or Gardiner paid for this article is UNRESEARCHED. Who else shaped his reading (Griffith, Newberry, Maspero are thanked or cited in the article): not researched.
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Item in.ernet.dli.2015.70975 on the Internet Archive, scanned at IGNCA Delhi from the Central Archaeological Library (Government of India stamp on the first page); archive page rights field reads Out_of_copyright. The first page OCR reads 'VOLUME V' although the running heads in the text read 'Journal of Egyptian Archaeology, Vol. III' and the article is in volume 3; likely a cover or binding fault, not checked. Holder of the paper original not recorded."
      tests:
        - "Running head 'Journal of Egyptian Archaeology, Vol. III, Plate XIII' and the article title, author and page range 95-110 found in the OCR; agree with the bibliographic record given by a search summary (could have failed)"
        - "A second, independent scan of the same volume (Internet Archive in.gov.ignca.26512, OCR sha256 170a1e26c1b5f6258588bd6dd70ba7a1edb82e86f56db19f3f3d27c4951a9425) carries the same article title and the same passages ('Year 3' titulary, the Nefrusi passage); found by search of both OCR texts (could have failed). Same library, so not an independent witness to the original printing."
        - "Gardiner's own report of Carter and Griffith's earlier readings (year 7; Birabi findspot) agrees in substance with Carnarvon and Carter 1912, read separately (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["OCR only; page images not compared with the text", "Plate XIII (photograph of the right-hand portion) was not viewed; Gardiner's hieratic transcription is garbled in the OCR and was not read", "No second printing compared", "Cover mismatch (Vol. V vs III) not resolved"]
      next_step: "View Plate XIII and the hieratic transcription page images in the scan and compare the signs of the 'slaves' line and the regnal date with Gardiner's translation."
      checked: 2026-10-14

