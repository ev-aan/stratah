  - id: src-winckler-abel-1889
    title: "H. Winckler (ed.), nach den Originalen autographirt von L. Abel, Der Thontafelfund von El Amarna, Heft I (Koenigliche Museen zu Berlin: Mittheilungen aus den Orientalischen Sammlungen; Berlin: W. Spemann, 1889), preface dated Berlin, May 1889"
    url: https://archive.org/details/derthontafelfund01wincuoft
    document_class: "interpretive/hand copy: autograph drawings of the Berlin tablets by L. Abel, with an inventory and a preface. A copyist's drawing, not the object."
    read: preface and inventory page read as page images and text; plates 102 (both sides) and 103 (obverse) opened as images. NO sign was read from any plate (the reader cannot read cuneiform).
    files:
      - {what: "PDF from archive.org (462 pages)", sha256: 6ab7c91421eb09cb8ff8571341a0f115799fb39b667d0bf7550bb613e0b2eb4f, bytes: 13593641, downloaded: 2026-10-16}
      - {what: "Internet Archive OCR text (_djvu.txt)", sha256: 40f07ee1f9ea496b7d8f2b3dcea1b21d53c2ad30063e14a05d009d5cea4b4c7c, downloaded: 2026-10-16}
    extracts: [extracts/winckler-abel1889_preface_inventory.txt]
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Preface (read): the tablets were found at the beginning of winter 1887/88 at el-Amarna; most were acquired for the Royal Museums in Berlin through the unselfish efforts of Theodor Graf of Vienna; the acquisition was made possible above all by the generosity of Kommerzienrat J. Simon of Berlin, who gave the larger part of the collections Graf brought to Berlin to the museums as a gift. Copies of the Bulaq tablets were made possible by the support of the Academy of Sciences and the Royal Prussian government. The preface names Budge (PSBA 10, 1889, pp. 540-569) for the British Museum part and Sayce (PSBA 10, pp. 488-525) for private pieces. The copies of the Berlin tablets are by Ludwig Abel after the originals, with a facsimile of the script as faithful as possible (preface). Internet Archive item derthontafelfund01wincuoft carries possible-copyright-status NOT_IN_COPYRIGHT."
      tests:
        - "Inventory lines 102 and 103 (scan page 279) read 'Berlin VA. Th. 1642 ... an den Koenig, 0,15 x 0,09 m' and 'Berlin VA. Th. 1644 ... 0,19 x 0,09 m': these agree with Knudtzon's headings B 1642 and B 1644 (could have failed)"
        - "The plate captions on scan pages 308, 309 and 312 read 'Berlin, VA. Th. 1642' (front and back) and 'Berlin, VA. Th. 1644' (front): agree with the inventory (could have failed)"
        - "The preface cites Budge PSBA 10 pp. 540-569; PSBA 10 p. 540 opens Budge's paper on the British Museum tablets (could have failed)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps: ["Hand copy not compared with the tablet or a photograph", "No sign read: whether the plate lines 19 and 56 of plate 102 show the signs Knudtzon transliterates is not tested", "Not compared with a second printing"]
      next_step: "Have a person who reads cuneiform read plate 102 lines 19 and 56 and plate 103 lines 29-31 against Knudtzon's transliteration, then compare with a photograph of the tablets."
      checked: 2026-10-16

  - id: src-budge-psba10-1888
    title: "E. A. Wallis Budge, 'On Cuneiform Despatches from Tushratta ... and on the Cuneiform Tablets from Tell el-Amarna', Proceedings of the Society of Biblical Archaeology vol. 10 (1888), pp. 539-569; p. 540 read"
    url: https://archive.org/details/ProceedingsOfTheSocietyOfBiblicalArchaeologyVol101888
    document_class: "primary_text for what Budge reported in 1888 (an eyewitness account of seeing the tablets, with hearsay on the find). Not an account of the tablets' content."
    read: yes, directly. Page image of p. 540 (scan page 760) opened and read; the next pages only in OCR.
    files:
      - {what: "PDF of PSBA vol. 10 from archive.org", sha256: 4903aaad70d5a2c7e2ae8e1d8f383270d987f48d7c2a7be5be126e9e044061e8, bytes: 39602302, downloaded: 2026-10-16}
      - {what: "Internet Archive OCR text (_djvu.txt)", sha256: a8a1bc1c24268c712336ef951ab90cb7ab9ff3f829e7eaf8d03ab864b3680139, downloaded: 2026-10-16}
    extracts: [extracts/budge1888_psba10_p539-540.txt]
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Volume 10 (1887-88) of the Society's Proceedings, item ProceedingsOfTheSocietyOfBiblicalArchaeologyVol101888 on the Internet Archive. Budge says he had to leave for Mesopotamia 'on a mission for the Trustees of the British Museum' (p. 540, read), so the notes he took in December 1887 were not used then. Funding of the Society and of Budge's work not researched."
      tests:
        - "Winckler's 1889 preface names Budge, PSBA 10, p. 540 for the British Museum part, and Knudtzon 1915 p. 4 cites Budge PSBA 10 p. 540 for 'towards the end of the summer of 1887' and 'about the middle of December'; p. 540 on the page image has those words (could have failed)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps: ["Budge's own source for the find's date is not stated on p. 540 beyond rumour and what he saw", "Pages 541-569 (his readings of the tablets) not opened as images"]
      next_step: "Read Budge's History of Egypt vol. 4 (1902) p. 185-186, which Knudtzon cites for the 'gentleman in Egypt' report."
      checked: 2026-10-16

