# Sources for the amarna-habiru dig, with authenticity entries (rules A1-A10, build/SCHEMA.md). Rebuilt 2026-10-16 (round 2 after the review on PR #28).
# Files were downloaded outside the repository on 2026-10-16 and hashed (sha256). Short verbatim extracts of the public-domain books and the two CC BY papers
# are stored in sources/extracts/ (elisions marked, OCR errors left as they are). Nothing in copyright is stored.
# PRIMARY DATA for this subject is the cuneiform tablets (Berlin VA Th. 1642 and 1644 for letters 286 and 287) or their photographs or squeezes.
# None of that was read: CDLI returned HTTP 500 again on 2026-10-16 and no museum photograph was reached. What WAS opened is the printed documents:
# the page images of the 1915 edition (Knudtzon), the 1889 hand-copy plates and preface (Winckler and Abel), and the pages of the other books listed below.
# A hand copy is a drawing of the tablet by one copyist; no cuneiform sign was read from any plate.
# Wikipedia is not used. Funding and control of each author, publisher and sponsor: what a read source says is in `provenance`; the rest stays an open task (see log L-10).
retrieved: 2026-10-16
sources:

  - id: src-knudtzon-1915-v1
    title: "J. A. Knudtzon, Die El-Amarna-Tafeln, mit Einleitung und Erlaeuterungen, vol. 1 (Leipzig: J. C. Hinrichs, 1915; Vorderasiatische Bibliothek 2); preface dated Kristiania, June 1907"
    url: https://archive.org/details/dieelamarnatafel01knud
    document_class: "interpretive: an editor's transliteration (no cuneiform is printed), German translation and introduction. A claim about what this book prints is a claim about the book; what the tablet shows is a separate question."
    read: yes, directly. Page images opened and read (printed pp. 4, 5, 27, 38, 45-52 and the letters 286-290 on pp. 861-865, 870-871, 875, 877); the rest of the book only in OCR.
    files:
      - {what: "PDF from archive.org", sha256: 43ea5c781d769870c27c1db1338dbff9777691851c589734bea2f5360c273090, bytes: 50194758, downloaded: 2026-10-16}
      - {what: "Internet Archive OCR text (_djvu.txt)", sha256: aec993037828af99046207ba468a56b2b27cfd2819a8a8688ead9e771821a3f0, downloaded: 2026-10-16}
    extracts: [extracts/knudtzon1915-v1_pp4-5_discovery.txt, extracts/knudtzon1915-v1_p27_p38_p53_chronology.txt, extracts/knudtzon1915-v1_pp45-52_habiru.txt]
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Item dieelamarnatafel01knud on the Internet Archive, 1915 Hinrichs printing (title page and preface read). Publisher J. C. Hinrichs'sche Buchhandlung, Leipzig, in the series Vorderasiatische Bibliothek. The preface (read) thanks the series editors and the publisher for allowing departures from the series rules and thanks museums and private owners; it states no funder. The preface says Knudtzon again visited the museums in London and especially Berlin to examine some tablets more closely, that unclear signs of the originals are numbered 'Autogr.' 1-184 in the notes, and that he admits shortcomings in the translation and an error he now believes he made at the opening of the letters (his p. 989f; not read). Scanned copy holder not recorded here."
      tests:
        - "The line numbers where he says the Habiru name occurs (p. 45 note 1: 286,19; 286,56; 287,31; 288,38; 288,44(?); 289,24; 290,13 and 24) were looked for in the printed letters on the page images. Found: 286,19 and 56; 287,31; 288,38; 289,24; 290,13 and 24. At 288,44 the name appears only in a bracketed restoration, consistent with his question mark (could have failed)"
        - "Letter 286 is headed 'B 1642, WA 102, W 179' and letter 287 'B 1644, WA 103, W 180'; the 1889 plates 102 and 103 are captioned 'Berlin, VA. Th. 1642' and 'Berlin, VA. Th. 1644' on the plate images (could have failed)"
        - "He cites Budge PSBA 10 p. 540 for the date the find became known; Budge p. 540 was opened and has those words (could have failed)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps: ["Printed transliteration, not the signs: not compared with the tablets, a photograph or a squeeze", "Most pages seen only in OCR, which is noisy", "His own stated errors (p. 989f) not read"]
      next_step: "Compare letters 286 and 287 with a photograph of VAT 1642 and 1644 (CDLI or the Berlin museum) and with a modern edition."
      checked: 2026-10-16
    notes: "Knudtzon argues for the Habiru as a people and as the Hebrews, dating their arrival by 1 Kings 6:1 (pp. 47-49, read). That is his reading in the introduction, not a datum of the tablets."

