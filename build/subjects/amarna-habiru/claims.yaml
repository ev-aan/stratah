# Claims about what the 1915 edition prints carry anchor_checked: primary because the book's page images were opened and read; that is a check on the book, not on the tablet.
subject: amarna-habiru
title: 'The Amarna letters that name the Habiru: what five Jerusalem letters say, and what the speaker says they say'
question: What do the Amarna letters say about the Habiru, who wrote them, and when, compared with the speaker's '150 years after the expulsion'?
dig_status: open
headline: Knudtzon's 1915 edition has Abdi-Heba of Jerusalem say the Habiru plunder the king's lands
headline_claim: amarna-286-knudtzon-habiru-plunder
headline_status: draft
search_summary: The Amarna letters are cuneiform letters sent to the Egyptian court by Asiatic rulers, found at el-Amarna in 1887/88. In Knudtzon's 1915
  edition, read on page images, five letters from Abdi-Heba of Jerusalem (286 to 290) say the Habiru plunder the king's lands, take his cities, and were
  given land by rulers named by the writer. No passage read has Canaanite cities capturing them or links them to the Hyksos, and the letters are not Egyptian
  records. The tablets, their photographs and any modern edition were not read; the date of the letters and the Habiru's identity are open.
description: 'Second round of the dig on the Amarna Habiru passages, after the review on PR 28. READ DIRECTLY (page images opened and read): Knudtzon 1915
  vol. 1 (the preface, introduction pp. 4-5, 27, 38, 45-53 and the letters 286-290 on pp. 861-877); Winckler 1889 (preface and inventory, plus the hand-copy
  plates 102 and 103 as images, from which no sign could be read); Budge, PSBA 10 (1888) p. 540; Sayce, PSBA 10 p. 496; Petrie, Tell el Amarna (1894) section
  48; Breasted, Ancient Records of Egypt vol. 3 pp. 50 and 52 and vol. 2 p. 7 (translations); two open-access papers on the Hyksos and early 18th Dynasty
  chronology (Stantis et al. 2020; Bruins and van der Plicht 2025). READ IN OCR ONLY: Knudtzon vol. 2 (commentary by Weber and Ebeling), the rest of Breasted,
  Petrie''s dated-sherd passages. NOT READ: the tablets VA Th. 1642 and 1644 or any photograph (CDLI returned HTTP 500 on 2026-10-14 and 2026-10-16; the
  Berlin museum search gave no record), Moran 1992, Hornung et al. 2006, any scholarship after 1915 on the habiru. Claims about the letters are claims about
  what the 1915 edition prints, filed with a primary check on the book; what the tablets show is a separate, unread question (amarna-ea-286-signs-not-read).
  Three Dead Hidden claims are split into one assertion each; the videos are never an anchor and their wording could not be re-checked.'
divergence_note: The speaker's version has the Egyptians recording that Canaanite cities captured the Habira 150 years after the Hyksos expulsion, as bands
  of robbers, and has the Habiru the Hyksos. The five letters read are written by the ruler of Jerusalem to the king; in them the Habiru plunder, take the
  king's cities and are given land by named rulers, and no passage read has cities capturing them. The date match is not excluded by the ranges read but
  was not tested against a modern chronology. Who the Habiru were is a live dispute among the 1888-1915 scholars read, and none of them equates them with
  the Hyksos. The distance between the speaker's wording and the text, and between a 1915 editor's reading and the tablets, is what the dig records. The
  tablets themselves were not seen.
assessment:
  question: 'Do the Amarna letters that name the Habiru say what the speaker says: that Canaanite cities captured them 150 years after the Hyksos expulsion,
    and that they were the Hyksos?'
  answer: partly
  headline: 'Partly: the Habiru plunder and take the king''s land in the letters read, but no passage read has cities capturing them or links them to the
    Hyksos.'
  text: 'The five letters from Abdi-Heba of Jerusalem (EA 286 to 290) that name the Habiru were read as printed in Knudtzon''s 1915 edition, on page images
    of the book. They say the Habiru plunder all the king''s lands (286, 56), are the ones to whom named rulers (Milkilu, the sons of Labaya, Labaya with
    the land of Shechem) gave the king''s land (287, 289), take the king''s cities (288) and that the land falls away to them if no troops come (290). In
    none of the passages read is a city the one that captures them; in letter 287 the lands of Gezer, Ashkelon and Lachish are said to have given ''them''
    food, and the printed lines do not name the receivers. These are statements by one writer who says he is slandered, and the vol. 2 commentary says,
    of the writer''s sentence about the Rabis and the regents (286, 16ff.), that denunciations of this kind must be viewed very critically. The letters
    are written to the king by a ruler of Jerusalem, so they are not ''Egyptian records''. The speaker''s date is not excluded: on Knudtzon''s 1915 estimate
    the letters fall about 1385 to 1368 BCE, and modern chronologies of Ahmose''s conquest of Avaris range from about 1562 to 1506, but no modern date for
    the letters was read, so the 150 years could not be tested. Whether the Habiru were a people, the Hebrews, a Kassite group, Bedouin or a common noun
    (''allies'') is a live dispute among the 1888-1915 scholars read here; none of them equates the Habiru with the Hyksos. The tablets (Berlin VA Th. 1642
    and 1644) and any photograph of them were not opened: CDLI returned HTTP 500 and no museum photograph was reached. The 1889 hand-copy plates were opened
    but no sign could be read from them. Moran''s 1992 edition, a current chronology and any modern study of the habiru were not read, so every position
    after 1915 is missing. The claims about the letters are therefore about what one 1915 edition prints, not about what the tablets show.'
  key_points:
  - Knudtzon's edition has the Habiru plunder (286), take cities (288) and be given land by named rulers (287, 289); no passage read has cities capturing
    them.
  - The letters are from the ruler of Jerusalem to the king, not Egyptian records; the tablets and any modern edition were not read.
  - Whether the Habiru were a people, Hebrews, Kassites, Bedouin or 'allies' is disputed among the 1888-1915 scholars read; none links them to the Hyksos.
