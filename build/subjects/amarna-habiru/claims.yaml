- id: amarna-berlin-acquisition-per-winckler
  state: established
  statement: Winckler's 1889 preface states that most of the find was acquired for the Royal Museums in Berlin through the efforts of Theodor Graf of Vienna
    ('uneigennützigen Bemühungen'), that the acquisition was made possible by the generosity of Kommerzienrat J. Simon of Berlin, who gave the larger part
