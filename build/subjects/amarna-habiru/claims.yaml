# Built from a compact script in the author's scratchpad; edit by adding log entries and re-anchoring claims.
subject: amarna-habiru
title: 'The Amarna letters that name the Habiru: what two letters say, who wrote them, and what the speaker says they say'
question: What do the Amarna letters say about the Habiru, who wrote them, and when, compared with the speaker's '150 years after the expulsion'?
dig_status: open
headline_status: draft
search_summary: The Amarna letters are cuneiform letters sent to the Egyptian court by Asiatic rulers, found at el-Amarna in 1887/88. In Knudtzon's
  1915 edition two letters from Abdi-Heba of Jerusalem (286, 287) name the Habiru as plunderers of the king's lands and as people the king's land
  was given to by named rivals. Nothing read says Canaanite cities captured them, and the letters are not Egyptian records. The tablets, their
  images and any modern edition were not read; the date and the Hyksos link are open.
description: 'First dig on the Amarna Habiru passages. Sources actually read: Knudtzon 1915 (transliteration, translation and introduction, Internet
  Archive OCR) and Winckler 1889 (preface and inventory, OCR; hand-copy plates for other tablets looked at). Not read: any image of tablet VA
  Th. 1642 or 1644, CDLI (HTTP 500), the Berlin museum record, Moran 1992, any current chronology. Three Dead Hidden claims are split into parts
  and weighed; the videos are never an anchor.'
divergence_note: The speaker's version has Egyptians recording that Canaanite cities captured the Habira 150 years after the Hyksos expulsion,
  with the Habiru the Hyksos. The two letters read say the Habiru plunder the king's lands and were given land by local rivals, written by a Jerusalem
  ruler to the Egyptian king. The date match to 1400 BCE is within the range a 1915 edition gives and is untested against current chronology.
  The identity of the Habiru is a live dispute between a people (Knudtzon, equating them with Hebrews) and a social label (named from memory,
  not read). The gap between the speaker's wording and the text, and between a 1915 editor's biblical frame and the tablets, is the product here.
  The tablets themselves were not seen.
