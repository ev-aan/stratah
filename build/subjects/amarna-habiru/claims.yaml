- id: amarna-habiru-identity-positions-1888-1915
  state: contested
  statement: 'In the sources read from 1888 to 1915, the Habiru of the Jerusalem letters are taken as: the Hebrews, a people or tribes that had entered
    the land, with the Habiru ''sachlich identisch'' with the SA.GAZ people (Knudtzon: ''Ich möchte also, was auch Winckler jetzt tut, ḫabir(u) für עברים
    halten''; Winckler; the vol. 2 commentary; Jensen doubts the Hebrew link); a Kassite-origin group (Halévy, Scheil, Hilprecht, Peiser, as Knudtzon reports
    them; Knudtzon rejects this); the Shasu Bedouin of Seti I (Breasted); or a common noun, ''confederates'' or ''allies'' (Sayce, W. Max Müller, formerly
    Winckler).'
  statement_kind: judgment
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: 'no'
  would_change_if: the cited works and a modern edition with its introduction (Moran 1992 or an open equivalent) are read and the occurrences of the name
    are counted by context and date
  positions:
  - label: A people or tribes that had entered the land, to be taken as the Hebrews
    holder: J. A. Knudtzon, 1915 (read on the page images, pp. 46-48, 51-53)
    ground: A place-determinative follows the Habiru name at 289,24, so the name is a people's, not a common noun; the Habiru are set against the native
      population. He writes 'Dagegen läßt sich kaum etwas einwenden' against Conder's and Zimmern's equation with the Hebrews, on historical or linguistic
      grounds, and 'Ich möchte also, was auch Winckler jetzt tut, ḫabir(u) für עברים halten' (p. 48); he says 'Hebrews' may have covered more than in the
      Old Testament, and calls a Habiru immigration considerably older than the Israelites' 'ziemlich bedenklich' because 1 Kings 6:1 puts the Israelite
      entry several years before the time he gives for the Habiru; with the 480 years of that verse reduced by 20-30 the two entries could be one, 'was
      wohl zu erwägen ist'; he says we do not know where they came from, and that they had not been long in the land at the time of these letters.
  - label: The Habiru name reads for the logogram SA.GAZ; identity with the Hebrews settled
    holder: Winckler (via the vol. 2 commentary, OCR) and the commentators of vol. 2 (Weber and Ebeling), 1915
    ground: 'Boghazköy treaties: ''ilâni ḫa-bi-ri'' in one and ''ilâni SA.GAZ'' in two others in parallel places. The commentary adds that Jensen disputes
      the Hebrew link and that little more can be said.'
  - label: Kassite origin
    holder: Halévy, Scheil, Hilprecht and Peiser, as reported by Knudtzon (p. 47, page image read; their works not opened)
    ground: 'A Babylonian ''Habiraean'' with a Kassite name (IV R 34 no. 2) and a border-stone inscription of the time of King Marduk-ahe-erba (Scheil:
      confirms; Hilprecht: ''fast zur Gewißheit''). Knudtzon says this proves nothing for his question and that no Kassite bands are known in Palestine
      then.'
  - label: The Shasu Bedouin of Seti I are the Khabiri of the Amarna letters
    holder: J. H. Breasted, 1906 (ARE III, section 99, page image read), citing Ed. Meyer
    ground: '''That these Bedwin are the Khabiri of the Amarna Letters there can be no doubt''; the conditions Seti I faced ''are exactly those which we
      should expect in view of what we learn from the letters of Abdkhiba of Jerusalem''. This is Breasted''s comment; the translated inscription (section
      101) names the Shasu and not the Khabiri.'
  - label: A common noun, 'confederates' or 'allies'
    holder: 'A. H. Sayce, 1888 (PSBA 10 p. 496, page image read): ''Can these khabiri, or confederates, be the people of Hebron?''; W. Max Müller and earlier
      Winckler, as reported by Knudtzon (p. 47 note 1)'
    ground: Sayce's note is a question on line 24 of a tablet in M. Bouriant's hands, not one of the Berlin letters. Knudtzon rejects a pure common noun
      because of the determinative.
  disputed_by:
  - who: Knudtzon (1915) against the Kassite and common-noun readings
    kind: work
    position: a people or tribes that had entered the land, the Hebrews ('Ich möchte also ... ḫabir(u) für עברים halten', p. 48); not Kassites; not only
      a common noun
    source_read: yes (page images)
    via: Knudtzon pp. 46-48
  - who: Jensen (1909) against the Habiru-Hebrew identity
    kind: person
    position: doubts the identity of Habiru and Hebrews
    source_read: 'no'
    via: the vol. 2 commentary (OCR)
  - who: Halévy, Scheil, Hilprecht and Peiser
    kind: group
    position: Habiru were of Kassite origin
    source_read: 'no'
    via: Knudtzon p. 47 and notes (page image read)
  - who: Breasted (1906)
    kind: person
    position: Seti I's Bedwin (Shasu) are the Khabiri
    source_read: yes (page image)
    via: ARE III section 99
  - who: Sayce (1888)
    kind: person
    position: '''confederates'', tentatively the people of Hebron'
    source_read: yes (page image)
    via: PSBA 10 p. 496
  anchor:
    type: interpretive
    description: 'Read on the page images: Knudtzon pp. 46-48 and 50-53, Breasted ARE III section 99 (p. 50) and Sayce PSBA 10 p. 496. Read in OCR: the
      vol. 2 notes. The works of Halévy, Scheil, Hilprecht, Peiser, Winckler, Dhorme, Jensen, Müller, Conder and Zimmern were NOT opened: those positions
      are known only as these authors report them. No scholarship after 1915 was read.'
