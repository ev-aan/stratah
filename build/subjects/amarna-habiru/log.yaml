    entry: >
      ROUND 2: WHAT WAS OPENED AND READ (downloaded outside the repository on 2026-10-16, sha256 in the manifest). PAGE IMAGES opened and read: Knudtzon vol. 1 (PDF scan pages 7-8 preface, 16-17 pp. 4-5, 39 p. 27, 50 p. 38, 57-65 pp. 45-53, 873-877 and 882-883, 887, 889 for the letters 286-290); Winckler and Abel 1889 (scan page 11 preface, 279 inventory as text, 308-309 plate 102 front and back, 312 plate 103 front); Budge PSBA 10 p. 540 (scan page 760); Sayce PSBA 10 p. 496 (scan page 714); Petrie 1894 p. 23 (scan page 33); Breasted ARE II p. 7 (scan page 39) and ARE III pp. 50 and 52 (scan pages 82, 84). READ IN OCR/TEXT: Knudtzon vol. 2 notes on 286-287 and 67; the rest of the letters and introduction; Breasted ARE II sections 785-797 and an OCR search of vols. 2-4 for Apiru, Aperu, Khabiri, Habiru; Petrie's dated-sherd passage and the paragraph on who shared the cost; Budge's quotation of Sayce's Academy letters. READ AS BORN-DIGITAL TEXT: Stantis et al. 2020 and Bruins and van der Plicht 2025 (CC BY, Europe PMC XML). Short verbatim extracts of the public-domain books and the two CC BY papers are in sources/extracts/.
      WHAT COULD NOT BE READ. The plates were opened but the reader cannot read cuneiform: no sign of lines 19 or 56 (plate 102) or 29-31 (plate 103) was read, so the claim that the 1889 hand copy agrees with Knudtzon's transliteration is NOT made. CDLI (cdli.mpiwg-berlin.mpg.de, redirecting to cdli.earth) returned HTTP 500 on two attempts on 2026-10-14 and again on two attempts on 2026-10-16, and a guessed artifact address returned 404; not bypassed. The Berlin museum search page (recherche.smb.museum) returned an application page with no record. Moran 1992: in copyright, no open copy. Hornung, Krauss and Warburton 2006: only the publisher's paid page and an unauthorised upload (not used). YouTube watch pages: HTTP 429. GitHub's cdli-gh data repository: not reachable from this session. One web search and a Europe PMC search for an open-access scholarly paper on the habiru found none. Wikipedia: not used.
  - id: L-10
    date: 2026-10-16
    entry: >
      FUNDING, OWNERSHIP AND CONTROL, as the read sources state them (no insinuation; what is not stated is an open task). Winckler 1889 preface (page image): most of the find reached the Royal Museums in Berlin through the efforts of Theodor Graf of Vienna; the acquisition was made possible by J. Simon of Berlin, who gave the larger part of the collections Graf brought to Berlin to the museums as a gift; copying of the Bulaq tablets was supported by the Academy of Sciences and the Royal Prussian government. Budge PSBA 10 p. 540 (page image): he was sent to Mesopotamia on a mission for the Trustees of the British Museum. Petrie 1894 (OCR): Mr. Haworth and Mr. Kennard shared the cost of the excavations with him and Mr. Carter worked a part of the site on behalf of Lord Amherst of Hackney. Knudtzon 1915 preface (page image): published by J. C. Hinrichs'sche Buchhandlung, Leipzig, in the series Vorderasiatische Bibliothek; thanks to the series editors, the publisher, museums and private owners; no funder stated. Knudtzon vol. 2 (title page, OCR): notes and indexes by Otto Weber and Erich Ebeling.
      OPEN RESEARCH TASKS (not findings): who funded Knudtzon's work and the Vorderasiatische Bibliothek; who owned or controlled Hinrichs; what Graf and Simon were paid or gave, and who held the other parts of the find (Egyptian, British and private buyers, Bouriant, Danninos Pasha); who funded Winckler and Abel and the Prussian copying; who funded Budge's and Sayce's work and the Society of Biblical Archaeology; who funded Breasted's series; who funded the two open-access papers and what the excavator-author of the Hyksos paper (M. Bietak, per the author list) contributed to the data; and which museum holds the Berlin tablets now (the inventory numbers VAT 1642 and 1644 are in Knudtzon's headings; the current museum record was not reached).
  - id: L-11
    date: 2026-10-16
    entry: >
      WHAT THE TEXT READ SAYS, AND WHERE THE FACTS END (for the reader, in place of the summaries in L-05 and L-06, which stay as written). Five letters from Abdi-Heba (286-290), as Knudtzon prints them, name the Habiru: they plunder the king's lands (286, 56); the writer says he will ask the officer why he loves the Habiru and hates the rulers (286, 19); named rulers gave the king's land to them (287, 29-31; 289, 22-24); they now take the king's cities (288, 36-38); the land falls away to them (290, 13 and 24). In 290 the writer says Milkilu and Šuardatu hired people of Gezer, Gath and Keilah. In 287, 14-16 the lands of Gezer, Ashkelon and Lachish gave 'them' food and oil; who 'them' are is not stated in the printed lines (the vol. 2 commentary reads them as the Habiru). No passage read has Canaanite cities capturing the Habiru, and nothing read links the Habiru to the Hyksos. The letters are from the ruler of Jerusalem to the king and are not Egyptian records. The vol. 2 commentary's caution that denunciations of this kind in the letters must be viewed critically is kept beside them. The facts end here: that one 1915 edition prints these lines is read on page images; what the tablets show, how the Habiru are best understood after 1915, and the absolute date of the letters are not read. The speaker's wording could not be re-checked (L-08 item 7).
