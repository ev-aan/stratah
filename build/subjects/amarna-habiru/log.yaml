  - id: L-01
    date: 2026-10-14
    entry: >
      START. Handoff (amarna-habiru.yaml, written by another agent) named the object as 'Amarna letters Habiru EA 286 etc' with Moran, CDLI and Knudtzon as candidates; that identification was an unverified guess.
      Three speaker claims are tested, each split into parts and kept in the speaker's wording: dh-gBGfqlL_FFQ-08 (four parts), dh-APUenSDE2oM-08 (three parts), dh-HN0wNVpfunM-30 (two parts).
      Rule applied from the owner: books, translations, commentaries and videos are all claims; the object (the clay tablets), its images, squeezes and plates are primary data. No claim here rests on anything but books, so none is above proposed or searched_gap, evidence class interpretive (or the unread-object class for gaps), anchor_checked secondary or no, confidence low, weight at most 2.
  - id: L-02
    date: 2026-10-14
    entry: >
      WHAT WAS OPENED AND READ. (1) Knudtzon, Die El-Amarna-Tafeln vol. 1 (1915), Internet Archive OCR (sha256 aec99303...a3f0): letters 285-288 in transliteration and German translation, introduction passages on the Habiru, the Sutu, the date of the letters (pp. 27, 38) and the discovery (about p. 14). Quoted verbatim in claims.
      (2) Winckler and Abel, Der Thontafelfund von El Amarna Heft I (1889), Internet Archive OCR (sha256 40f07ee1...c7c): preface (find and acquisition) and the inventory line for VA Th. 1642 and 1644; plate pages 100, 101 and 176-181 were looked at as images (hand-copied autographs). Plate 102 (letter 286 in Winckler-Abel's numbering) was not reached; no sign was read from any plate, and I make no claim to read cuneiform from them.
      (3) A web search, whose results (Wikipedia pages, a b-hebrew list post, others) are leads only and were not used as support.
