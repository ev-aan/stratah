  - id: L-13
    date: 2026-10-17
    entry: >
      ROUND 3 (fixes after an independent review of commit 663b1da, verdict approve with non-blocking findings). Corrections, as a new entry; earlier entries are unchanged.
      N2: Knudtzon's identity position is now quoted as he wrote it on p. 48 ('Ich möchte also, was auch Winckler jetzt tut, ḫabir(u) für עברים halten', after 'Dagegen läßt sich kaum etwas einwenden' against Conder's and Zimmern's equation); the earlier 'possibly the Hebrews' and 'may be the Hebrews' weakened it, and he was listed in two bins. His reservations stay in the claim (the 1 Kings 6:1 dating, 'Hebrews' possibly wider than in the Old Testament).
      N3: 'named rivals' is not in the printed text; the surface line and claim 287 now say rulers named by the writer.
      N4: the vol. 2 commentary's 'Denunziationen dieser Art sehr kritisch angesehen werden müssen' is now stated with its scope (it follows the remark on 286, 16ff., the Rabis who loves the Habiru and hates the regents); my earlier wording extended it to the Habiru-plunder statements.
      N6: claim amarna-287-knudtzon-gezer-ashkelon-lachish-provisions now cites vol. 1 only (the vol. 2 reading of 'ihnen' as the Habiru is in the commentary claim, which stays below primary). The id amarna-287-knudtzon-cities-gave-land-to-habiru is kept; its text and basis now say the writer names two rulers (Milkilu and the sons of Labaya) as the givers and no city.
      N7: Knudtzon p. 51 is main text (a rhetorical question), not a note; and p. 49 says the SA.GAZ people are mentioned 'überaus häufig' without saying in whose letters; the claim is corrected.
      N8: the 1889 inventory entry for 102 reads 'Ardu(-Abd?-)hi-ba'; 103 reads 'Ardu-hi-ba'.
      N9: Breasted ARE II: p. 7 (sections 9-12) was viewed as a page image; section 8 (p. 6) and sections 13-15 (p. 8) were read in OCR only. Claims and manifest corrected.
      N10: Petrie's cost passage is in the preface (OCR), not in the section on the site. Claim and manifest corrected.
      N11: the history line of the node amarna-1887-letters-found-at-el-amarna rev 2 said the earlier text is kept in rev 1 above; it is only in version control (commit 8038593). New rev 3 of that node says so. The same untrue sentence ('The rev 1 text is kept above') was in the history of amarna-ea-286-287-habiru-passages rev 2, so that node also has a rev 3 with the same correction; no other field changed in either. The timeline pins are updated to rev 3.
      N13: Knudtzon p. 52 says a testimony of the Habiru's appearance near Lachish may perhaps be found at 288, 43f. This is now recorded, as his tentative reading, in amarna-sp-habira-captured-by-canaanite-cities: the translation of lines 43-45 on p. 871 reads 'Zimrida von Lakis, ihn haben Diener geopfert, welche sich angeschlossen haben den Iaptiḫ-Adda', with the Habiru name only as a bracketed restoration; it is not recorded as a text in which a city captures the Habiru.
      Left as owner decisions, unchanged: the primary-on-book-claims question, the null adoption rendering in build_site.py, the taxonomy proposal, and timeline.html (the renderer fails on BCE years).
