  - id: L-08
    date: 2026-10-16
    entry: >
      ROUND 2 (after the independent review on PR #28). CORRECTIONS, as new entries; L-01 to L-07 above are left as written.
      (1) Misattribution. L-02 and the first version of the node amarna-1887-letters-found-at-el-amarna credited the summer 1887 report to Sayce. Knudtzon p. 4 and the Winckler 1889 preface (page images opened) name Budge, PSBA 10 p. 540, and p. 540 was opened and has the words. The node is now rev 2 with a history line; the manifest entry src-sayce-via-knudtzon is replaced by src-budge-psba10-1888 and src-sayce-psba10-1888. Knudtzon's own date is 'in the autumn days or toward the close of 1887'; the node's 1887-12-01 is the dig's choice from Winckler's 'Anfang des Winters 1887/88', and the node status is now disputed.
      (2) Misstatement of Knudtzon on the SA.GAZ logogram. The first claim amarna-sp-bands-of-robbers-and-raiders said Knudtzon rejects 'robber' and that the common noun he mentions is 'robbers'. His p. 50 (page image) writes amêlu SA.GAZ = habbatu(m) (wahrscheinlich 'Räuber'), and argues that the names in the letters are nevertheless a people's, because of the place-determinative; the common-noun meaning he mentions for the Habiru name is 'Verbündete' (allies), with Sayce, W. Max Müller and earlier Winckler named in his note (p. 47). The claim is rewritten, with named positions: Knudtzon, Winckler, Dhorme and Jensen (the last three as the vol. 2 commentary reports them), and Sayce (PSBA 10 p. 496 read).
      (3) 'Kassite-era border-stone' in amarna-habiru-before-1550-attestation is withdrawn: Knudtzon p. 47 names an inscription on a border-stone of the time of king Marduk-ahe-erba and gives no era. The age was not looked up.
      (4) Chronology. The first node window (1420-1330 BCE) and the claim's 'Lehmann ... Amenophis III to 1318' were wrong or unsourced: the 1386 and 1318 figures are LIEBLEIN's in Knudtzon p. 27 (page image), Lehmann's are 1427-1392 and 1392-1376, and 1420 had no source figure. The node amarna-ea-286-287-habiru-passages is now rev 2: window 1385 to 1368 BCE, Knudtzon's own range for Amenophis IV (pp. 38, 53), single date the middle of it.
      (5) adoption_weight is now null ('not measured') on every claim; the first version gave 2 on eight speaker-claim parts with a note saying adoption was not assessed. evidence_class is no longer primary_text on any searched gap. Every claim that rests on 'not found' now carries absence_anchor: true.
      (6) Neutrality wording withdrawn. L-04's 'what Simon or the museums stood to gain' and 'who profited', L-05's 'the letter writer is an interested party ... testimony, not neutral records', the claims' 'partisan statement in a letter by an interested party' and 'an interested party in a letter accused of disloyalty', the manifest's 'Knudtzon's own frame is biblical', and the divergence note's 'is the product here' are not repeated. What replaces them: the letters' statements are described as the writer's own statements; the vol. 2 commentary's own caution ('Denunziationen dieser Art sehr kritisch angesehen werden müssen') is quoted; who funded, owned or sold is recorded as a sourced finding where a read source says so (L-10) and otherwise as an open task.
      (7) Process note ('a compact script in the author's scratchpad') removed from claims.yaml. The references to ~/dead_hidden_claims, a path outside the repository, are removed from the manifest and the transmission record, which now say that the claim wording and dates were supplied by an earlier agent, are not in the repository and could not be re-checked; the three video titles and the channel were confirmed from YouTube's oEmbed responses on 2026-10-16.
      (8) Claim ids kept. Four ids now cover a narrower assertion because a bundled speaker claim was split: amarna-sp-hyksos-exile-1550-captive is now only 'with their people captive' (the date is the new amarna-sp-hyksos-exile-1550-bc); amarna-sp-canaanite-cities-capture-hapiru-1400-bc is now only the event (the date is the new amarna-sp-capture-date-1400-bc); amarna-sp-khapiru-were-the-hyksos is now only the identification (the capture of cities is the new amarna-sp-khapiru-captured-canaanite-cities); amarna-287-knudtzon-cities-gave-land-to-habiru keeps its id although the givers named are rulers, not cities. State changes: the four edition claims (286 plunder, 286 officials, 287, letters-are-from-Asiatic-rulers) went from proposed/secondary to established/primary because their page images were opened and read; they are claims about the printed edition, not the tablet. amarna-sp-egyptians-recorded, amarna-sp-habira-captured-by-canaanite-cities and amarna-sp-canaanite-cities-capture-hapiru-1400-bc went from proposed to searched_gap. amarna-sp-hyksos-exile-1550-bc is new and contested (six published dates).
  - id: L-09
