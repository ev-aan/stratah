  - id: L-09
    date: 2026-10-15
    entry: >
      OPENED AND READ AS TEXT (downloads with curl, UTC 2026-10-14 to 2026-10-15). (1) Petrie, Six Temples at Thebes (1897), Internet Archive OCR text, sha256 4a98d46cd57194ea4ad45d560f8ff4440d31d9aa52afd62efa3c4d8006d23668 (identical to the file in L-02);
      sections 29, 48 and the note after 51 re-read. (2) Breasted, Ancient Records of Egypt vol. 3 (1906), OCR text, sha256 ed7d91750e03925004b5de21e05d2814d1e319f5f6cade0284a079feb0eeb958 (identical to L-02); sections 570-617 read, now including the Great Karnak Inscription
      (sections 572-592, for dates and for the parallel) and the Athribis stela (596-601). (3) van der Veen, Theis and Goerg, Journal of Ancient Egyptian Interconnections 2:4 (2010) 15-25, open-access PDF, sha256 72e4031899268a0e83cb3bd75e68a10e9d757e8a69fb348f19d190cca516a5f4; read in part (abstract, relief description,
      the discussion of the broken name, dating passage, notes 2 to 16 and 49 to 50); its hieroglyph characters are garbled in the text layer. (4) Hjelm, "Lost and Found?" (2016), author's copy on bibleinterp.arizona.edu, sha256 f7e0c4514692426f6e4cef90ac9cf7ab339d866e1d6d6d861567ca831bcd9d2d;
      pages 1 to 3 read. (5) The TLA open data set (Hugging Face thesaurus-linguae-aegyptiae/tla-late_egyptian-v19-premium, CC BY-SA 4.0), train.jsonl sha256 dfded75c7d34bc1f2f12e18af6936394dc0c5cadacd1229dc28d46751d6389df, searched for Israel, Askelon, Gezer, Yenoam, Kanaan and Merenptah in its
      3,606 intact sentences: no sentence from the stele (a search with no hit, not a read of the stele). Short excerpts are in sources/extracts/.
  - id: L-10
    date: 2026-10-15
    entry: >
      OPENED AND LOOKED AT AS IMAGES (correcting L-02, which said no plate image was looked at, and L-03, which said Duemichen's plate was not opened). (1) Petrie 1897 scan PDF, sha256 8bfa1289c1b7a1317c6f01f26665e08127523cb85654e4d23717e2d608047f91: Plate XIII (PDF page 69) and Plate XIV
      (PDF page 71, the facsimile, rendered at 200 and 400 dpi). Plate XIV shows 28 numbered lines (marks at every fifth line); the king's two cartouches stand in lines 26 and 28 and not in line 27. (2) Lacau, Catalogue general du Musee du Caire, Steles du Nouvel Empire vol. 1 fasc. 1 (1909), Internet Archive item
      LacauSteles1Fasc1, PDF sha256 f0e8d51d466c5d58cf570e25c0f2243c13fd7ce5898152a755bd0e2bd83ea378: printed pages 47, 52, 54, 55, 57 and 58 (the entry for 34025, with the typeset hieroglyphic text of the verso numbered to 28; line 27 begins at the marker "27" on page 58 and ends at "28") and Plate XIX (photograph).
      (3) Duemichen, Historische Inschriften I (1867), Google digitisation on the Internet Archive (bub_gb_54xCAAAAcAAJ), PDF sha256 4dcd7e7e0944a2f84b41aca7880de15635788b734a2968953e1cde1efd3dc77c: Taf. I (PDF page 9), fragments a, b and c; c shows 19 numbered lines.
      WHAT WAS NOT DONE: no sign was transliterated. The author is not an Egyptologist, no sign list or hieroglyphic edition was used, and the two copies were not compared sign by sign. So merneptah-hieroglyphic-israel-reading and merneptah-date-season-discrepancy stay searched_gap: the signs were looked at, not read.
      The OCR layer of Lacau's book is unreliable (it gave "n° 3 tl108" where the page image reads "n° 31408"), so every Lacau fact in the claims was taken from the images and transcribed in sources/extracts/lacau-1909-extract.txt.
  - id: L-11
    date: 2026-10-15
    entry: >
      WHAT THE READING FOUND. (1) Cairo record (R1-7; corrects L-04 item 6): Lacau 1909 lists the stele as Catalogue general 34025 (recto and verso, one slab) with Journal d'entree n° 31408, grey granite, 3 m 18 by 1 m 63 by 0 m 31, from Thebes, the funerary temple of Merneptah. The two numbers in the earlier search summaries are
      two registers of one object. The claim merneptah-cairo-accession-jE31408, filed as searched_gap in L-04 with the text "The stele is Cairo Egyptian Museum JE 31408 (one search summary gave Cairo 34025); neither book read gives an inventory number.", is now established on the 1909 catalogue (read as images) and says only what that
      catalogue says; the museum's current record was not opened. (2) Petrie calls the stone "black granite", Lacau "Granit gris": new claim merneptah-material-description-differs, a note on two descriptions, no test read. (3) Lacau says the Amenophis side was hammered by Amenophis IV and re-engraved by Seti I (added to merneptah-findspot-and-reuse). (4) Karnak duplicate:
      Duemichen's plate exists with 19 lines, as Petrie says; by Petrie's concordance its last line ends about a third of the way along line 27, so it is not shown to contain the Israel line (added to merneptah-duplicate-at-karnak and merneptah-forgery-allegation; the alignment itself was not checked). (5) Breasted's translations of the Karnak inscription (section 583) and the Athribis stela (section 598) give the
      same year, season and day as his section 607: new claim merneptah-libyan-war-year-5-parallels, one translator's three renderings, not an independent check of the Israel stele's date line; the Petrie/Spiegelberg season still differs and the gap stays open. (6) JAEI 2010 proposes an earlier writing of the name on a Berlin relief and quotes Hoffmeier's objection: new contested claim
      merneptah-israel-earlier-reading-proposal; it bears on "first mention" and is noted in merneptah-sp-stele-records-israel. (7) Hjelm 2016 says scholars have disagreed about how the hieroglyphs should be read and names other proposals: new contested claim merneptah-reading-israel-disputed; the 2002 article it cites was not opened. (8) No BCE year was found in Breasted's Merneptah sections (searched);
      Hjelm gives "around 1209 BCE" without a chronology. The absolute date stays a searched_gap and no regnal year is converted to a BCE year anywhere in this dig, including the timeline.
