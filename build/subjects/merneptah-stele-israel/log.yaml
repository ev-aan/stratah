    entry: >
      BLOCKED OR NOT OPENED (none bypassed). TLA record page (bot-verification page, tried again). UCL Digital Egypt (HTTP 403, tried again). Heidelberg digitisation of the Egypt Exploration Fund Archaeological Report 1896-97 (an Anubis bot-check page). A web page by Davidovits that a search result says argues Lacau's line 27 was altered (HTTP 403; known only from a search-result summary, which is not a read).
      A 2025 Studia Antiqua article on the determinative (Cloudflare challenge) and a 2020 JETS article (HTTP 403). Not located or not opened: Kitchen, Ramesside Inscriptions IV; Spiegelberg, ZAeS 34 (1896); Manassa 2003; the Athribis and Karnak originals; Hasel, Rainey, Stager, Yurco, Hoffmeier, Hjelm and Thompson 2002, Kitchen 2004; any chronology of the Nineteenth Dynasty
      (the Brill volume is not open access; a Scribd copy was not used); the Cairo Museum's current record. Plates XVII and XVIII of Lacau were not individually viewed. The OCR of Petrie sections 29, 48 and 51 and of Breasted was not compared with page images beyond the plates and pages listed in L-10.
  - id: L-13
    date: 2026-10-15
    entry: >
      CHANGES TO CLAIMS, AND WHY. Weights were not raised except merneptah-cairo-accession-jE31408 (searched_gap to established, evidential weight 4, confidence high, anchor_checked primary), because the 1909 catalogue entry was read as images and the claim is limited to what that entry says. All translation-based claims stay proposed, interpretive, secondary, weight 2 or lower.
      Reworded: merneptah-hieroglyphic-israel-reading and merneptah-date-season-discrepancy (say what was looked at and that nothing was transliterated); merneptah-absolute-date-bce (adds the Hjelm figure, as a statement, not a range); merneptah-forgery-allegation (the allegation page was tried and is blocked; adds what the 1867 fragment does and does not show);
      merneptah-findspot-and-reuse (adoption_note rewritten, R1-5: it now says the four speaker claim lines read do not mention the reuse; adds Lacau); merneptah-duplicate-at-karnak and merneptah-text-silent-on-nation-king-hyksos (plate viewed, not transliterated); the speaker claims merneptah-sp-stele-records-israel, merneptah-sp-date-1200-bc and merneptah-sp-single-nation (later sources added).
      New claims: merneptah-reading-israel-disputed, merneptah-israel-earlier-reading-proposal, merneptah-libyan-war-year-5-parallels, merneptah-material-description-differs. Added headline, headline_claim (headline_status stays draft: no claim on the stele's text is above secondary), assessment (answer "partly"), timeline.yaml, extracts and new manifest entries.
      The manifest's two phrases that restated the L-06 research task were removed so that L-06 is the only place it is recorded (R1-6). Nothing here makes a claim about the motives of any author or editor.
  - id: L-14
    date: 2026-10-20
    entry: >
      FIXES AFTER AN INDEPENDENT REVIEW. Each item was re-checked against the source before any change (Internet Archive items ancientrecordsof03brea, sixtemplesattheb00petruoft, LacauSteles1Fasc1 (PDF sha256 f0e8d51d...ea378, matches L-10), bub_gb_54xCAAAAcAAJ (PDF sha256 4dcd7e7e...7c, matches L-10); Hjelm 2016 and JAEI 2010 PDFs, sha256 as in L-09).
      (1) FIXED. Breasted section 606 (pp. 258-259) reads the stele with the title "Binder of Gezer" ("as indicated also in our Hymn of Victory (l. 27)"); 608 is "The Great Deliverance". The claim text said 608; the running page head on p. 259 reads "§ 608", which is probably how the number slipped. Now 606.
      (2) FIXED. Breasted section 583 prints "the third day of the third month of the third season (eleventh month)" (and "second day" for the night before) but no year; the text of that section starts in a lacuna. Year 5 is printed in 595 (Cairo column, "Year 5, second month of the third season (tenth month)") and 598 (Athribis stela, "Year 5 ... third day") and is stated in his summary in 570 ("Merneptah's fifth year"). Reworded in merneptah-libyan-war-year-5-parallels, the basis of merneptah-regnal-date-year-5, timeline u02 and the manifest line for Breasted. L-11 item (5) and L-13 are not edited; they said section 583 gives the same year, which this entry corrects.
      (3) FIXED. "Nation" is in Breasted's main text of section 606 (p. 259: "a specific town, or even nation, in such an epithet"), not in a footnote. Reworded in merneptah-text-silent-on-nation-king-hyksos.
      (4) FIXED. Lacau p. 47 itself prints, in the scene caption of the recto, "Le roi Amenophis III fait l'offrande du vin au dieu Amon"; the "per Petrie" attribution was wrong. merneptah-cairo-accession-jE31408 and merneptah-findspot-and-reuse now attribute it to Lacau, with the quotation as printed.
      (5) FIXED. Lacau printed pages 47, 52 and 58 re-read as page images (PDF pages 49, 54, 60): the printed text has accents (Stèle cintrée, Thèbes, funéraire, Meneptaḥ, Journal d'entrée du Musée, hiéroglyphes gravés). The extract file had them stripped although its header said they were kept; it is restored from the images (also "Stèle", not "Steles", in the two entry heads) and the p. 47 scene caption is added. Quotations in claims.yaml now use the accented text.
      (6) PARTLY WRONG, FIXED. The reviewer said the 1867 date comes only from item metadata. The title page image (PDF page 5) does print the imprint "Leipzig, J. C. Hinrichs'sche Buchhandlung, 1867"; the OCR text layer garbles the title page and has no 1867, and the manifest quoted only the field years 1863-1865. Timeline m01, its top note and the manifest now say the same thing: the title page gives the field years 1863-1865 and the imprint year 1867.
      (7) FIXED. Hjelm 2016 (page 1) puts the "people of the land of Hurru" reading under "From a historical Israel perspective" and also sets out a biblical and an ancient Israel perspective. merneptah-reading-israel-disputed now says so (statement and the disputed_by position). Her remark that the people determinative is "exceptional in Egyptian epigraphy" is on page 3, under a different heading; the claim now says "elsewhere in the chapter".
      (8) FIXED, AS AN OPEN POINT ONLY. JAEI 2010 note 16 gives its own transliteration of the name on CG 34025 and the Karnak duplicate, with the words "hill-country determinative"; Hjelm 2016 says a determinative of a people rather than a land. The two are recorded as an open point in merneptah-hieroglyphic-israel-reading and merneptah-reading-israel-disputed. No hieroglyph or transliteration was copied or made: the note's characters are garbled in the text layer and nobody here has checked the signs.
      (9) FIXED. Petrie 1897 section 29: "The greatest discovery in the temple was that of the black granite stele of Merenptah"; "the greatest prize of the year" is said of the upper part of a colossal statue of Merenptah, "next to the Israel inscription". Shared node merneptah-1896-petrie-finds-israel-stele is corrected as rev 2 with a history entry that quotes the rev 1 wording. Timeline m02 already had it right and still says it read rev 1; it was not changed.
      (10) FIXED. adoption_notes in merneptah-translations-name-israel ("repeated everywhere") and merneptah-hieroglyphic-israel-reading ("Universally stated as settled") now say "common in the summaries seen (not counted)" and "stated as settled in the popular and scholarly summaries seen (not counted)". No count of summaries was made.
      Also changed: the top note in timeline.yaml no longer lists the Duemichen date among those not read from the work (see item 6); timeline.html is regenerated from timeline.yaml; the Hjelm extract gains the three perspective sentences quoted in item 7. review_dig still lists some quotation flags: the matcher compares a window that starts three words before the quoted text, so verbatim quotations score 0.6 to 0.8 (for example "Thèbes, temple funéraire de Meneptaḥ" and "exceptional in Egyptian epigraphy" are exact substrings of the stored extracts). No weight, state, confidence or anchor_checked value was changed.
