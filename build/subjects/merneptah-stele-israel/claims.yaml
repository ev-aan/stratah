    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "The Israel reading is the standard one and is common in the summaries seen (not counted); the weight here comes from the two printed translations, not from that."
    would_change_if: >
      the hieroglyphic text (Plate XIV, Lacau's text, Kitchen's edition, the TLA record or the object) is transliterated and shows a different sign group, or a reading other than Israel is
      argued from the signs by a specialist (see merneptah-reading-israel-disputed), or the two translations turn out to rest on one faulty copy
    anchor:
      type: interpretive
      description: >
        Read in OCR text, again on 2026-10-15: Petrie 1897, section 48 (Spiegelberg's translation, part II c, last lines) and Breasted 1906, section 617 (Concluding Strophe, with the
        note on "his seed is not" in sections 603-605). Both books say they used the squeezes and photographs of the stele; Breasted also collated the Karnak duplicate.
        This is a read of translations, not of the signs. The signs of line 27 were looked at in Petrie's Plate XIV and in Lacau's 1909 typeset text but were not transliterated (see merneptah-hieroglyphic-israel-reading).
      sources: [src-petrie-1897, src-spiegelberg-tr-in-petrie, src-breasted-are3]
