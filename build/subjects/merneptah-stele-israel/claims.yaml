    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 5
    adoption_note: "Stated as settled in the popular and scholarly summaries seen (not counted); not checked here against the signs."
    would_change_if: "Line 27 is transliterated from Plate XIV, Lacau's text, Kitchen's Ramesside Inscriptions IV or the TLA record, or the object, and the sign group and its determinative are compared with the readings in the translations"
    next_step: >
      Transliterate line 27 (and the date line, line 1) from the two copies already opened (Petrie Plate XIV, PDF page 71 of the scan; Lacau 1909, printed pages 54 and 58) with a sign list, or ask an Egyptologist to;
      then compare with Kitchen RI IV or the TLA record once either can be opened. Settle the determinative: JAEI 2010 note 16 says "hill-country determinative", Hjelm 2016 says a people determinative.
    anchor:
      type: search-record
      description: >
        Opened and looked at: Petrie 1897, Plate XIV (28 numbered lines; line 27 is the second from last; the last line carries the king's two cartouches); Lacau 1909, printed pages 54 to 58 (typeset text, lines numbered
        to 28; line 27 begins at the marker "27" on page 58 and ends at "28"), and Plate XIX (photograph). An independent author team (JAEI 2010, note 16) cites Lacau pages 52-59, "esp. 58", for the names of this strophe,
