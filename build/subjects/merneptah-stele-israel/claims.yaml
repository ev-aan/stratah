      description: "Only Petrie's 1897 round figure 'about 1200 B.C.' for Merneptah's temple was read. See merneptah-absolute-date-bce."
      sources: [src-petrie-1897]
    basis: "The speaker's number is a round approximation. What the stele states is a regnal year (merneptah-regnal-date-year-5)."

