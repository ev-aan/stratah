subject: merneptah-stele-israel
title: "The Merneptah (Israel) Stele: what it says, where it was found, and what Dead Hidden says it says"
question: "What does the Merneptah Stele actually record about Israel?"
dig_status: open
headline: "Merneptah Stele: two printed translations list Israel among peoples it says Merneptah defeated"
headline_claim: merneptah-translations-name-israel
headline_status: draft

assessment:
  question: "What does the Merneptah Stele actually record about Israel?"
  answer: partly
  headline: "The two printed translations read here name Israel once, in a closing list of defeated places and peoples; the signs were looked at but not transliterated, and the BCE date is not established."
  text: >
    What was read. The text of the stele rests here on two printed English translations: Spiegelberg's, in Petrie's excavation report of 1897, and Breasted's of 1906.
    Both put Israel in the closing strophe of a hymn about Merneptah's victory, in a list with Canaan, Askelon, Gezer and Yenoam. Breasted translates "Israel is desolated, [...] his seed is not"; Spiegelberg
    "The people of Israel is laid waste,—their crops are not". Both say Canaan was seized or plundered on Merneptah's side. Neither says Israel conquered Canaan, was a nation or a united people, lacked a king,
    or came from the Hyksos, Hapiru or Shasu; that is an absence from two translations, so it is held at provisional confidence.
    What was looked at but not read. Two copies of the signs were opened as images: Petrie's facsimile (Plate XIV) and the typeset hieroglyphic text in the Cairo Museum catalogue of 1909 (Lacau),
    where line 27 is numbered. The signs were not transliterated by this author, so the reading "Israel" and the kind of sign that follows the name are not checked against the signs.
    What else was read. Lacau's catalogue gives the stele's museum numbers (Catalogue general 34025; Journal d'entree 31408), the only claim here that is established. A published fragment of a duplicate
    at Karnak (Duemichen 1867) was viewed as a plate. Two later scholarly papers were read in part: a 2010 article that proposes an earlier writing of the name on a Berlin relief (disputed in the article's own account),
    and a 2016 chapter that says scholars have disagreed about how the hieroglyphs should be read.
    The date. The hymn is dated year 5 of Merneptah in both translations. They give different seasons (inundation in Spiegelberg; third season, the eleventh month, in Breasted, who prints the same date for the
    Athribis stela and for the Karnak battle). The year is not converted to a BCE year here: no chronology of the Nineteenth Dynasty was read, and the round figures seen (1200 BC, about 1209 BCE) are statements, not a computed range.
    Coverage limits. Not read: the Egyptian text in an edition (Kitchen, Ramesside Inscriptions IV; the TLA record, blocked by a bot check), Spiegelberg's 1896 article, the Karnak and Athribis originals, the Cairo
    Museum's current record, and most post-1906 literature (several papers are paywalled or blocked). No claim here is rated above what that supports. The Dead Hidden videos were not watched and are not evidence.
  key_points:
    - "Both translations read (1897, 1906) name Israel once, in a closing list of defeated places and peoples with Canaan, Askelon, Gezer and Yenoam."
    - "Neither translation says Israel conquered Canaan, was a nation, lacked a king or came from the Hyksos, Hapiru or Shasu; this rests on two translations, not on the signs."
    - "The signs were viewed in two copies but not transliterated, and no BCE year is established; the Cairo numbers (CG 34025, JE 31408) come from the 1909 catalogue."
  basis: [merneptah-translations-name-israel, merneptah-text-canaan-seized-by-egypt, merneptah-text-silent-on-nation-king-hyksos, merneptah-hieroglyphic-israel-reading, merneptah-reading-israel-disputed, merneptah-cairo-accession-jE31408, merneptah-regnal-date-year-5, merneptah-absolute-date-bce]
  would_settle: >
    A transliteration of line 27 (and of the date line) from a hieroglyphic edition or the object, by someone who can read the signs: Kitchen's Ramesside Inscriptions IV, the TLA record (blocked here by a bot check),
    or the stele or its squeezes in Cairo. Also the Karnak and Athribis originals, Spiegelberg's 1896 article, the museum's current record, a chronology of the Nineteenth Dynasty read for its stated range, and the
    post-1906 literature on the name and its determinative (Hasel, Rainey, Yurco, Stager, Kitchen, Hoffmeier, Hjelm and Thompson), which was not opened here. This is a statement of coverage, not a conclusion.

search_summary: >
  The Merneptah Stele, a granite stele of Pharaoh Merneptah found by Flinders Petrie at Thebes in 1896, has a hymn that lists Israel among places and peoples Merneptah says he defeated. Two printed translations
  (1897 and 1906) read it that way. The signs were looked at in two copies (Petrie's facsimile and a 1909 Cairo catalogue) but not transliterated, and the absolute date was not established. The hymn text read does not say
  Israel conquered Canaan, was a nation or lacked a king, and does not mention the Hyksos, Hapiru or Shasu.
description: >
  Second pass on the Merneptah Stele. Read as text: Petrie, Six Temples at Thebes (1897, excavation report with Spiegelberg's translation); Breasted, Ancient Records of Egypt vol. 3 (1906, translation with notes,
  including the Karnak and Athribis parallels); a 2010 journal article (van der Veen, Theis, Goerg) and a 2016 chapter (Hjelm). Looked at as images: Petrie's Plates XIII and XIV, the Cairo Museum catalogue entry of 1909
  (Lacau: record, typeset hieroglyphic text, plate), and Duemichen's 1867 plate of the Karnak fragment. Not read: any hieroglyphic edition (Kitchen RI IV), the TLA record (blocked), the UCL page (blocked), Spiegelberg's
  1896 article, the Cairo Museum's current record, a chronology, and most post-1906 literature. Four Dead Hidden speaker claims are split into separate parts and weighed here; the videos are never an anchor.
divergence_note: >
  The popular and speaker version is that the stele shows Israel as a single nation in Canaan, with no king, having conquered Canaan, in 1200 BC, as the end of a chain
  from Hyksos to Hapiru to Shasu. The two translations read say something narrower: a closing list of defeated places and peoples in which Israel is one, desolated by
  Merneptah, with "his seed is not". They say Merneptah (Egypt) seized Canaan. They say nothing about Israel's government, its unity, a conquest by Israel, or any
  earlier names. The gap between the speaker's wording and the text is the product here. The signs themselves were looked at but not transliterated, and the absolute date is not established.

