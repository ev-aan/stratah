  - id: merneptah-reading-israel-disputed
    state: contested
    statement: >
      A 2016 scholarly chapter (Hjelm) says that scholars have disagreed about how the hieroglyphs of the name should be read and names other proposed readings (Sharon, Jizreel, Jeshurun, 'Asher); under the heading "From a historical Israel perspective" (one of three perspectives she sets out: historical, biblical and ancient Israel) it reads the entry as a people of the land of Hurru
      located in an area comprising Gezer and the city states Gaza, Ashkelon and Yeno'am; elsewhere in the chapter she calls the determinative of a people rather than a land "exceptional in Egyptian epigraphy". The two translations read here print "Israel".
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "The Israel reading is the one printed in both translations and used in the 2010 article read; the 2016 chapter says it is not the only one proposed. Neither count is evidence."
    would_change_if: >
      line 27 is transliterated and compared with the proposals, or the papers Hjelm cites (Hjelm and Thompson 2002) are read and show what signs each reading rests on
    disputed_by:
      - who: "Ingrid Hjelm (with Thomas L. Thompson, 2002)"
        kind: person
        position: "Says there are several possible readings of the hieroglyphs of the name; from what she calls a historical Israel perspective (the chapter also sets out a biblical and an ancient Israel perspective), reads the entry as a people of the land of Hurru located in an area comprising Gezer and the city states Gaza, Ashkelon and Yeno'am."
        source_read: src-hjelm-2016
        via: "Pages 1 to 3 of the author's copy of the 2016 chapter, read directly. The 2002 article it cites for the proposed readings was not opened."
    anchor:
      type: interpretive
      description: >
        Read directly: Hjelm 2016, pages 1 to 3 of the author's copy (extract in sources/extracts/hjelm-2016-extract.txt). She cites Hjelm and Thompson 2002, pp. 13-14, for the readings; that article was not opened,
        so what each proposal rests on in the signs is not known here. Translations: Petrie 1897 and Breasted 1906.
        OPEN POINT (JAEI 2010 note 16, re-read 2026-10-20): that note gives its own transliteration of the name on CG 34025 and the Karnak duplicate with a "hill-country determinative", while Hjelm says the determinative is that of a people rather than a land.
        The discrepancy is not resolved here: no sign was transliterated by this author and the note's characters are garbled in the text layer.
      sources: [src-hjelm-2016, src-petrie-1897, src-breasted-are3, src-jaei-2010]
    basis: "A report of what one later author says. It does not show the signs allow another reading."

  - id: merneptah-text-canaan-seized-by-egypt
    state: proposed
    statement: >
      In the same strophe the two translations say that Canaan was taken by Merneptah's side: Petrie/Spiegelberg "Seized is the Kanaan with every evil", Breasted "Plundered is Pekanan [...], with every evil". Askelon, Gezer and Yenoam are listed as taken or brought to nought beside it. The hymn presents Israel as one of those defeated, and Palestine "as a widow for Egypt".
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Often not mentioned when the stele is used to speak of Israel in Canaan."
    would_change_if: "the signs show a different subject or verb for the Canaan line, or a reading of the verbs as describing Israel's action rather than Egypt's"
    anchor:
      type: interpretive
      description: "Petrie 1897 section 48, II c; Breasted 1906 section 617 with note b ('Lit., the Canaan') and note on 'widow' (section 617, notes). Read in OCR as translations, 2026-10-14 and 2026-10-15."
      sources: [src-petrie-1897, src-spiegelberg-tr-in-petrie, src-breasted-are3]
    basis: >
      # V: read 2026-10-14 and 2026-10-15. Breasted section 605: "Israel ... was defeated and plundered by Merneptah"; section 606 (pp. 258-259) reads the stele together with Merneptah's title "Binder of Gezer" ("as indicated also in our Hymn of Victory (l. 27)"; the running page head on p. 259 reads "§ 608"). Section 608 is the "Great Deliverance" text.
      Passive verbs throughout; the hymn is an Egyptian victory poem. It does not name who held Canaan.

  - id: merneptah-text-silent-on-nation-king-hyksos
    state: proposed
    statement: >
      Neither translation of the hymn (Petrie/Spiegelberg 1897; Breasted 1906) says Israel was a nation, was united, had or lacked a king, or had earlier names or ancestors such as the Hyksos, Hapiru or Shasu. Israel appears only in the one line. The words "united" and "pacified" in the last couplet are about "all lands".
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    absence_anchor: true
    adoption_weight: 1
    adoption_note: "Not stated in the popular summaries seen."
    would_change_if: "the signs of the Israel line or its context show words the translators omitted, or any other part of the stele or its Karnak duplicate is read and mentions them"
    anchor:
      type: search-record
      description: >
        Searched the full English text of the hymn in both translations for: Hyksos, Shasu, Hapiru, Habiru, Apiru, nation, king (other than Egyptian kings and the general 'kings are overthrown'), conquer. No hit about Israel.
        Only Breasted's main text (section 606, p. 259) uses 'nation', about a title ('a specific town, or even nation, in such an epithet') and not about Israel. The Karnak duplicate was viewed as Duemichen's plate (fragment c, 19 lines) but not transliterated,
        and by Petrie's own concordance its last line ends about a third of the way along line 27, so it was not searched for these words.
      sources: [src-petrie-1897, src-spiegelberg-tr-in-petrie, src-breasted-are3, src-duemichen-1867]
    basis: >
      Absence from two translations. It does not show the signs lack these ideas. Capped at provisional (absence_anchor).

  # ------------------------- OBJECT FACTS -------------------------

  - id: merneptah-findspot-and-reuse
    state: proposed
    statement: >
      Petrie found the stele in 1896 in the south-west corner of the first court of Merneptah's temple at Thebes, where it had stood against the south wall and fallen forwards. Merneptah's hymn is cut on the rough back of a stele of Amenhotep III, which had been moved from Amenhotep III's temple and set back outward.
      Lacau's 1909 Cairo catalogue gives the find place as "Thèbes, temple funéraire de Meneptaḥ", says Merneptah had carried the stele of "Amenophis" to his funerary temple and used its back, and adds that the recto was almost entirely hammered out by Amenophis IV and re-engraved by Seti I.
      Lacau (p. 47) names the king of the recto as Amenophis III: "Le roi Amenophis III fait l'offrande du vin au dieu Amon".
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 3
    adoption_note: "Stated in most summaries. The four speaker claim lines read do not mention that the hymn is cut on the back of an earlier king's stele (the videos themselves were not read)."
    would_change_if: "Petrie's field notes, the Egypt Exploration or Cairo records, or the object itself show a different findspot or that the back-reuse belongs to another stele"
    anchor:
      type: interpretive
      description: >
        Petrie 1897, sections 29 and 48 (the excavator's own account), Breasted 1906 note d to section 602, and Lacau 1909 printed pages 47 and 52, entries "34025 (recto)" and "34025 (verso)" (read as page images).
        Breasted's note draws on Petrie and Spiegelberg, and Lacau's bibliography lists Petrie, so neither is shown to be an independent witness to the find.
      sources: [src-petrie-1897, src-breasted-are3, src-lacau-1909]
      nodes: [{node: merneptah-1896-petrie-finds-israel-stele, verb: supports}]
    basis: >
      # V: read 2026-10-14 and 2026-10-15. Petrie: "engraved on the back of the stele of Amenhotep III"; the front carries Amenhotep III's text (Plates X to XII are Amenhotep III stelae).
      One witness for the findspot (the excavator). The month of the find is not in the passages read. Lacau's catalogue number is in merneptah-cairo-accession-jE31408.

  - id: merneptah-duplicate-at-karnak
    state: proposed
    statement: >
      A duplicate of the inscription existed at Karnak, of which only a fragment survives, published by Duemichen. Petrie works out 34 lines for the Karnak copy and notes that it names Amen where the Thebes copy names Ptah as the speaker.
      By Petrie's concordance the last line of the fragment (Duemichen's line 19) ends about a third of the way along line 27 of the Thebes text.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Search summaries disagreed on where the duplicate is; both books read say Karnak."
    would_change_if: "the fragment's signs are read and aligned with the Thebes text and differ from Petrie's concordance, or Erman's study or a Karnak record shows the fragment is from another monument or another part of the Theban temples"
    anchor:
      type: interpretive
      description: >
        Petrie 1897, note signed W. M. F. Petrie after section 51 (read in OCR); Breasted 1906 note d to section 602 ('a duplicate original in Karnak, of which only a fragment has survived', published by Duemichen and Erman).
        Duemichen's plate (Historische Inschriften I, Taf. I) was opened and viewed on 2026-10-15: fragment c shows 19 numbered lines, which matches Petrie's "19". The signs were not transliterated, the fragment was not aligned
        with the Thebes text, and the Amen-for-Ptah point and the 34-line estimate were not checked.
      sources: [src-petrie-1897, src-breasted-are3, src-duemichen-1867]
    basis: >
      # V: Petrie and Breasted agree. Breasted collated the fragment and cites Duemichen and Erman, so this is two descriptions of the same published fragment, not two finds.
      The plate confirms that a published fragment with 19 lines exists. Resolves the Karnak-versus-elsewhere question as far as these books go: Karnak.

  - id: merneptah-cairo-accession-jE31408
    state: established
    statement: >
      Lacau's 1909 catalogue of the Cairo Museum lists the stele as Catalogue general no. 34025 (recto: a stele of "Amenophis", which Lacau's p. 47 describes as showing "Le roi Amenophis III fait l'offrande du vin au dieu Amon"; verso: Merneptah) and gives its Journal d'entree number as 31408: grey granite, 3 m 18 high, 1 m 63 wide, 0 m 31 thick,
      from Thebes, the funerary temple of Merneptah. The two numbers are two different registers of the same object in that record. Where the stele is now, and under which number, was not checked.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Repeated in encyclopedic summaries (JE 31408; CG 34025); here read at the museum's own 1909 catalogue."
    would_change_if: "the museum's own current record, Porter and Moss or Sourouzian give a different number for this object, or Lacau's page is shown to describe another stele"
    anchor:
      type: primary_text
      description: >
        Lacau 1909, printed page 47 (head of entry "34025 (recto)": material, height, width, thickness, find place; and the caption "Scène de droite. Le roi Amenophis III fait l'offrande du vin au dieu Amon") and printed page 52 (bibliography line "Journal d'entrée du Musée, n° 31408"; start of entry "34025 (verso)"),
        read as page images on 2026-10-15 (PDF pages 49 and 54; extract transcribed in sources/extracts/lacau-1909-extract.txt). The plate captions ("34.025 (recto)" Pl. XVI; "34.025 (verso)" Pl. XVII-XIX) agree with the text.
        Cross-check, not an anchor: an independent author team (JAEI 2010, note 16) cites the same catalogue for the stele as "CG 34025", pages 52-59 and Plates XVII-XIX.
      sources: [src-lacau-1909]
    basis: >
      # V: Lacau 1909 pp. 47 and 52 read as images, 2026-10-15. This is what the 1909 catalogue says. The museum's current record was not opened (src-cairo-record) and no claim here says where the stele is held now.
      Earlier versions of this claim (searched_gap, with the number from a search summary) are in the log: L-04 and L-11.

  - id: merneptah-material-description-differs
    state: proposed
    statement: >
      Petrie (1897) calls the stele "black granite"; Lacau's 1909 catalogue records "Granit gris" (grey granite). No stone identification or colour measurement was read.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: 1
    adoption_note: "Not noticed in the summaries seen."
    would_change_if: "the museum record or a stone identification names the rock and its colour"
    next_step: "Look for a stone identification in the museum's current record, Porter and Moss, or Sourouzian (1989)."
    anchor:
      type: interpretive
      description: "Petrie 1897 section 29 ('the black granite stele of Merenptah', read in OCR) and the contents list ('Black granite stele of Merenptah'); Lacau 1909 printed page 47 ('Granit gris', read as an image). Both are descriptions by people who saw the stone; neither reports a test."
      sources: [src-petrie-1897, src-lacau-1909]
    basis: "Two descriptions that differ in the colour word. This is a note on the sources, not a finding about the stone."

  # ------------------------- A PROPOSED EARLIER WRITING OF THE NAME (post-1906) -------------------------

  - id: merneptah-israel-earlier-reading-proposal
    state: contested
    statement: >
      A broken name on a Berlin pedestal relief (no. 21687) has been proposed (Goerg 2001; van der Veen, Theis and Goerg 2010) to be an archaic writing of "Israel", which the authors tentatively date to the reign of Ramesses II, earlier than Merneptah's stele.
      James Hoffmeier is quoted in that article as rejecting the reading on linguistic and orthographic grounds. The article's authors say the Ramesside date is "by no means certain".
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: 1
    adoption_note: "A proposal in one open-access article; the translations and the 2016 chapter read treat the Merneptah Stele as the earliest mention."
    would_change_if: "the relief's signs are read by a specialist and the proposed reading is accepted or rejected, or Hoffmeier's and Goerg's own texts are read"
    disputed_by:
      - who: "James Hoffmeier"
        kind: person
        position: "Rejects the reading: says it 'is plagued by serious linguistic and orthographic problems that preclude it from being Israel' (as quoted by the article's authors, who answer him)."
        source_read: src-jaei-2010
        via: "Quoted in JAEI 2010 (notes 5 and 49-50). Hoffmeier's own text was not opened."
    anchor:
      type: interpretive
      description: >
        JAEI 2010 (van der Veen, Theis, Goerg), read in part: abstract, description of the relief, the discussion of whether the broken name can read Israel, the dating passage and notes 2 to 16 and 49 to 50
        (extract in sources/extracts/jaei-2010-extract.txt). The sign-level argument could not be checked: the hieroglyph characters are garbled in the text layer and the relief was not seen.
        The article is written by the proposers, so the other side is known only as they quote it.
