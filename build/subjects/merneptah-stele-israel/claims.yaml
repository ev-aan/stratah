        Breasted prints the name with a transliteration whose characters are damaged in the OCR (only "-s-r-" and "-r" survive) and no sign group.
        OPEN POINT (found on re-reading JAEI 2010 note 16, 2026-10-20): besides the Lacau page numbers, note 16 gives its own transliteration of the name on CG 34025 and the Karnak duplicate and says it carries a "hill-country determinative"; Hjelm 2016 (page 3) says the determinative is that of a people rather than a land.
        The two statements differ. Neither was checked against the signs here, the note's transliteration characters are garbled in the text layer, and no sign was transliterated by this author; which is right is not known here.
        Searched and not opened: the TLA record (bot-verification page), UCL Digital Egypt (HTTP 403), Kitchen RI IV (not located), a web page said by a search result to argue that Lacau's line 27 was altered (HTTP 403).
        Searched with no hit: the TLA open data set of 3,606 intact Late Egyptian sentences (Hugging Face, v19), which has no sentence from this stele.
