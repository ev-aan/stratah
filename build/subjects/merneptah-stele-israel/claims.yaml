  - id: merneptah-libyan-war-year-5-parallels
    state: proposed
    statement: >
      Breasted's 1906 translation of the Athribis stela (section 598) is headed "Year 5, third month of third season (eleventh month), third day", and his summary (sections 570-571) puts the Libyan battle in Merneptah's fifth year; his Cairo column (section 595) is dated year 5, second month of the third season (tenth month).
      His translation of the Great Karnak Inscription (section 583) prints the third day of the third month of the third season (eleventh month) but not the year in that section.
      His translation of the Israel hymn (section 607) gives the same year, season and day, and he describes the hymn as celebrating that victory (section 602).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 1
    adoption_note: "Not stated in the popular summaries seen."
    would_change_if: "the Karnak or Athribis originals (Manassa 2003; Kitchen) or the Israel stele's own date line give a different year, season or day"
    anchor:
      type: interpretive
      description: >
        Breasted 1906, sections 570-571 (summary; "Merneptah's fifth year"), 583 (Great Karnak Inscription; day and month, no year printed there), 595 (Cairo column; year 5), 598 (Athribis stela; year 5), 602 and 607, read in OCR text on 2026-10-15 (extract in sources/extracts/breasted-1906-extract.txt).
        These are one translator's renderings of three texts, so they are not three independent dates. The Karnak and Athribis originals were not read.
      sources: [src-breasted-are3]
    basis: "Records what Breasted printed. The Israel stele's own date line is not checked against this; Petrie/Spiegelberg's season differs (merneptah-date-season-discrepancy)."

