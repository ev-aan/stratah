    statement: "In 1200 BC the Merneptah Stele records Israel (dh-HN0wNVpfunM-26, dh-K3pw12lBcXM-29 'by 1200 BC', dh-K3pw12lBcXM-30, dh-gBGfqlL_FFQ-09)."
