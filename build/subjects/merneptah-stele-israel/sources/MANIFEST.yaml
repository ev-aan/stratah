# Sources for the merneptah-stele-israel dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
#
# What "authenticity" means here: whether each SOURCE is what it says it is. It is not the answer to the dig's question.
# Tests were run by the dig author (2026-10-14 to 2026-10-15, UTC), which is not an independent review.
#
# Storage: nothing is stored as a full copy. sources/extracts/*.txt keep only the short passages that claims cite. Downloads were made with curl from the
# Internet Archive, an open-access journal site and a university-hosted PDF; the sha256 of each file as downloaded is recorded in the entry and in log L-09.
#
# How each source was read (the `read:` field):
#   text      = the printed text (OCR text layer of a scan, or a PDF text layer) was read
#   images    = page images (including hieroglyphic text and plates) were opened and looked at
#   not read  = not opened, or blocked
# Looking at hieroglyphs is not the same as transliterating them. No entry below says the signs were transliterated or checked against a hieroglyphic
# edition by a specialist: they were not (claim merneptah-hieroglyphic-israel-reading).
retrieved: 2026-10-15
sources:

  # ------------------------------------------------------------------ the 1897 excavation report and its plates
  - id: src-petrie-1897
    title: "W. M. F. Petrie, Six Temples at Thebes, 1896 (London: Bernard Quaritch, 1897), with a chapter by W. Spiegelberg"
    url: https://archive.org/details/sixtemplesattheb00petruoft
    document_class: "secondary: excavator report by the finder (testimony, not the object)"
    read: "text (Internet Archive OCR, sha256 4a98d46cd57194ea4ad45d560f8ff4440d31d9aa52afd62efa3c4d8006d23668; sections 29, 48 and the note after 51; re-read 2026-10-15) and images (the 106-page scan PDF, sha256 8bfa1289c1b7a1317c6f01f26665e08127523cb85654e4d23717e2d608047f91; Plates XIII and XIV, PDF pages 69 and 71)"
    sha256: 4a98d46cd57194ea4ad45d560f8ff4440d31d9aa52afd62efa3c4d8006d23668   # OCR text as downloaded
    stored_as: "sources/extracts/petrie-1897-extract.txt"
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Printed 1897 by Clowes for Quaritch (title page, read in the OCR). Internet Archive scan item sixtemplesattheb00petruoft, rights status NOT_IN_COPYRIGHT in the item metadata. Holder of the scanned copy not recorded here."
      tests:
        - "Title page, year and publisher read in the OCR and agree with the Internet Archive metadata (could have failed)"
        - "Petrie's statement that a duplicate existed at Karnak, published by Duemichen, agrees with Breasted's separate note and with Duemichen's plate, which was opened (could have failed; see src-duemichen-1867)"
        - "Petrie's and Spiegelberg's statement that the text was published in Zeitschrift fuer aegyptische Sprache 1896 agrees with the bibliography line in Lacau's 1909 catalogue entry, which lists Spiegelberg, Aeg. Zeits. XXXIV (1896) and Petrie's Plates XIII and XIV (could have failed; see src-lacau-1909)"
        - "Date, protocol and the Israel line of Spiegelberg's translation agree in substance with Breasted's separately collated translation (could have failed)"
      tested_by: "Stratah dig author session (not an independent review)"
      gaps: ["OCR text compared with page images only for Plates XIII and XIV, the imprint and the last strophe of section 48 (PDF page 38, where three OCR faults were found and corrected in the extract), not for the rest of sections 29, 48 and 51", "Not compared with a second printing or a holder copy"]
      next_step: "Compare the OCR of sections 29, 48 and 51 with the page images."
      checked: 2026-10-15
    notes: "Title says 1896 (the dig season); publication 1897."

  - id: src-petrie-pl-xiv
    title: "Petrie 1897, Plate XIV: facsimile copy of the inscription on the Merneptah stele (lines 1 to 28), 1:8, from the Internet Archive scan"
    url: https://archive.org/details/sixtemplesattheb00petruoft
    document_class: "interpretive: a hand facsimile of the signs, made from Spiegelberg's hand copy, Petrie's paper squeeze and photographs, not the object"
    derived_from: src-petrie-1897
    read: "images (PDF page 71 of the scan, rendered at 200 and 400 dpi and viewed; lines 1 to 28 are visible and numbered at every fifth line). The signs were NOT transliterated."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Plate in Petrie 1897; section 48 says it was made with a hand copy, a squeeze and E. Brugsch Bey's photographs; section 29 calls it the facsimile copy."
      tests:
        - "Line count and layout: the plate shows 28 lines, and Lacau's 1909 typeset text of the verso (src-lacau-1909-text) is numbered to 28; the two cartouche pairs stand in lines 26 and 28 in both (could have failed)"
      tested_by: "Stratah dig author session (not an independent review)"
      gaps: ["No sign-by-sign comparison with Lacau's text or with the object", "The plate is a copy made under the conditions Spiegelberg describes: the stele 'lay face downward' when he copied it"]
      next_step: "Transliterate lines 26 to 28 with a hieroglyphic edition (Kitchen RI IV, TLA) and compare the two copies sign by sign."
      checked: 2026-10-15

  - id: src-spiegelberg-tr-in-petrie
    title: "W. Spiegelberg's English rendering of the Merneptah hymn, in Petrie 1897, section 48 (Plates XIII, XIV)"
    url: https://archive.org/details/sixtemplesattheb00petruoft
    document_class: interpretive (translation)
    derived_from: src-petrie-1897
    read: "text (OCR of the printed translation)"
    stored_as: "sources/extracts/petrie-1897-extract.txt"
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Printed in Petrie 1897 as Spiegelberg's translation; Spiegelberg says he worked from a hand copy, Petrie's paper squeeze and E. Brugsch Bey's photographs, and had published the Egyptian text in Zeitschrift fuer Aegyptische Sprache 1896 (so section 48 gives translation only)."
      tests: ["Israel line compared with Breasted 1906 section 617: both put Israel in a list of defeated places, with Canaan, Askelon, Gezer and Yenoam named beside it (could have failed)"]
      tested_by: "Stratah dig author session (not an independent review)"
      gaps: ["Spiegelberg's Egyptian text (ZAeS 34) was not found and not read; question marks in the translation mark his own doubts", "Authenticity of the stele itself is a separate question (claim merneptah-forgery-allegation)"]
      next_step: "Read Spiegelberg's text in ZAeS 34 (1896)."
      checked: 2026-10-15

  # ------------------------------------------------------------------ Breasted 1906
  - id: src-breasted-are3
    title: "J. H. Breasted, Ancient Records of Egypt, vol. 3 (Chicago: University of Chicago Press, 1906), sections 570-617 (the Libyan war, the Great Karnak Inscription, the Athribis stela and the Israel stela)"
    url: https://archive.org/details/ancientrecordsof03brea
    document_class: "interpretive: translation with commentary"
    read: "text (Internet Archive OCR, sha256 ed7d91750e03925004b5de21e05d2814d1e319f5f6cade0284a079feb0eeb958; sections 570-571, 572-592 (read for dates and for the parallel with the Israel hymn), 596-601 and 602-617; re-read 2026-10-15)"
    sha256: ed7d91750e03925004b5de21e05d2814d1e319f5f6cade0284a079feb0eeb958   # OCR text as downloaded
    stored_as: "sources/extracts/breasted-1906-extract.txt"
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Item ancientrecordsof03brea on the Internet Archive, a 1906 printing. A 1962 Russell and Russell reprint (ancientrecordsof0003jame) is access-restricted and was not used."
      tests:
        - "Footnote d to section 602 gives the same findspot facts as Petrie (found by Petrie 1896 in the ruins of Merneptah's temple, text on the back of Amenhotep III's stela), but Breasted says he also had Brugsch's photographs and collated the Karnak duplicate (could have failed)"
        - "Section 607 date (year 5, day 3) agrees with Petrie's translation on year and day; the season differs (see claim merneptah-date-season-discrepancy)"
        - "Section 598 (Athribis stela) gives the same year, season and day as section 607, and section 583 (Karnak) the same season and day but no year in that section (year 5 for the Karnak text is from Breasted's summary, sections 570-571; see claim merneptah-libyan-war-year-5-parallels)"
      tested_by: "Stratah dig author session (not an independent review)"
      gaps: ["OCR only: page images not compared except as noted in log L-10", "Hieroglyphs of the Israel line not read by Breasted in the text layer: his transliteration of the name is damaged in the OCR", "Breasted's findspot note draws on Petrie and Spiegelberg, so it is not an independent witness to the find", "The Athribis and Karnak texts were read only as Breasted's translations"]
      next_step: "Compare the OCR with the page images for sections 603-617 and 583-598."
      checked: 2026-10-15

  # ------------------------------------------------------------------ the Cairo catalogue (holder's own record)
  - id: src-lacau-1909
    title: "P. Lacau, Catalogue general des antiquites egyptiennes du Musee du Caire, Steles du Nouvel Empire, vol. 1 fasc. 1, Nos. 34001-34064 (Cairo: Service des Antiquites de l'Egypte, 1909), entry 34025, printed pages 47 to 58"
    url: https://archive.org/details/LacauSteles1Fasc1
    document_class: "official_record: the museum's own printed catalogue entry (recto, a stele of 'Amenophis'; verso, Merneptah), with the registration number, material, size, find place and bibliography"
    read: "images (187-page PDF, sha256 f0e8d51d466c5d58cf570e25c0f2243c13fd7ce5898152a755bd0e2bd83ea378; printed pages 47, 52, 54, 55, 57 and 58 viewed; the French lines cited were transcribed from the images; the OCR text layer is unreliable for this book)"
    sha256: f0e8d51d466c5d58cf570e25c0f2243c13fd7ce5898152a755bd0e2bd83ea378   # PDF as downloaded
    stored_as: "sources/extracts/lacau-1909-extract.txt (the author's transcription of the French lines cited)"
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Printed catalogue of the Egyptian Antiquities Service for the Cairo Museum, 1909 (title page, 'Service des Antiquites de l'Egypte, Catalogue general'). Scan on the Internet Archive item LacauSteles1Fasc1, uploaded 2015-10-31. The scan's holder copy is not recorded."
      tests:
        - "The catalogue number 34025 lies in the volume's stated range 34001-34064 and the plate captions ('34.025 (verso)', Pl. XVII-XIX) agree with the text entry (could have failed)"
        - "An independent author team (van der Veen, Theis, Goerg, JAEI 2010, note 16) cites this catalogue for the stele as 'CG 34025', pages 52-59 (esp. 58) and Plates XVII-XIX; the line-numbered hieroglyphic text with markers 25 to 28 was found on printed page 58 (could have failed; see src-jaei-2010)"
        - "The bibliography line lists Petrie 1897 Plates XIII-XIV and Spiegelberg ZAeS XXXIV (1896), the publications Petrie's own text names (could have failed)"
      tested_by: "Stratah dig author session; the second test uses a source by other authors, still not an independent review of this dig"
      gaps: ["The museum's current record or database entry was not opened (src-cairo-record)", "Catalogue is dated 1909: it does not show where the stele is now", "Only entry 34025 was read, not the rest of the volume"]
      next_step: "Open the Egyptian Museum's own current record or a later inventory (Porter and Moss, Topographical Bibliography II; Sourouzian 1989) and confirm the number and where the stele is held."
      checked: 2026-10-15
    notes: "'JE' (Journal d'entree) and 'CG' (Catalogue general) are two different registers. Lacau gives the Journal d'entree as n° 31408 in the bibliography line and the Catalogue general number as 34025."

