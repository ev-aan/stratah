    url: https://archive.org/details/bub_gb_54xCAAAAcAAJ
    document_class: "interpretive: a hand copy of the signs of a damaged wall inscription, published as a plate"
    read: "images (63-page Google-digitised PDF from the Internet Archive, sha256 4dcd7e7e0944a2f84b41aca7880de15635788b734a2968953e1cde1efd3dc77c; PDF page 9, 'Hist. I. 1', viewed at 130 dpi). The signs were NOT transliterated and the plate was not aligned with the Thebes text."
    authenticity:
      status: authenticated
      strength: weak
      provenance: "Item bub_gb_54xCAAAAcAAJ, a Google Books digitisation, Hinrichs 1867 per the item metadata. Title page read as an image on 2026-10-20: 'In den Jahren 1863-1865 an Ort und Stelle gesammelt' (the field years) and, in the imprint, 'Leipzig, J. C. Hinrichs'sche Buchhandlung, 1867' (the OCR text layer garbles the title page and has no 1867)."
      tests: ["Taf. I shows fragment c with 19 numbered lines, which agrees with Petrie's statement that Duemichen's last line is '19' (could have failed; Petrie 1897, note after section 51)"]
      tested_by: "Stratah dig author session (not an independent review)"
      gaps: ["Signs not read; the fragment was not matched to the Thebes text", "That the Karnak copy names Amen where the Thebes copy names Ptah was not checked", "Only Taf. I was viewed"]
      next_step: "Transliterate fragment c, line 19, and align it with line 27 of the Thebes text."
      checked: 2026-10-15

