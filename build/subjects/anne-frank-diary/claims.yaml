  - id: afd-versions-abcd
    state: established
    statement: >
      The diary exists in four layers, which should not be called by one name. A is Anne's first diary (June 1942 to 1 August 1944, with the 1943 gap). B is her own rewrite, begun on 20 May 1944 with a book in mind. C is the compilation Otto Frank made in 1945 to 1947 (with the help of a radio script editor) from B, with passages from A,
      published as Het Achterhuis on 25 June 1947. D is the 1991 reader's edition compiled by Mirjam Pressler for the Anne Frank Fonds, based on C with material restored from the 1986 critical edition, which printed A, B and C together.
    statement_kind: reported
    evidence_class: interpretive
    confidence: high
    confidence_reasons:
      start: moderate
      start_because: "Secondary anchors; the editions and the manuscripts were not opened."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "Three separate bodies describe the same structure: the Anne Frank House, the Anne Frank Fonds (the copyright holder, a separate foundation) and the NIOD co-editor of the critical edition."}
      reviewed: false
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "Standard in scholarship; less known to general readers, who often take one book for the diary."
    would_change_if: "the critical edition's own description of the versions differing in any point (for example the extent of D)"
    next_step: "Open the Critical Edition's introduction on the versions, and compare version D's front matter."
    anchor:
      type: secondary
      description: >
        Anne Frank House, 'Two versions of Anne's diary' (from 20 May 1944 Anne rewrote a large part of her diary; title Het Achterhuis) and 'The complete works of Anne Frank' (the rewrite covers 12 June 1942 to 29 March 1944; the Annex was published on 25 June 1947; the 1986 scientific edition presents Anne's text,
        her rewrite and Otto's version on the same page); Anne Frank Fonds, 'Publications' (Otto Frank and the script editor Albert Cauvern: Version C; 1991 Mirjam Pressler compiles Version D for the Fonds); NIOD co-editor van der Stroom (versions a, b, c; version d by Pressler takes C as the base and adds about three-tenths more from the critical edition; the critical edition prints a, b, c in full).
        Read in full 2026-10-04.
      sources: [src-af-versions, src-af-complete-works, src-fonds-publications, src-vanderstroom-1999, src-af-sieben-fragen]

