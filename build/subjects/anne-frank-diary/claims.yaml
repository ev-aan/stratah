# ---------------------------------------------------------------------------
# SEARCH HEADLINE. It may only be a firm statement if the headline claim is established or refuted at HIGH confidence with its anchor read directly
# (docs/PUBLISH_GATE.md). The headline claim (afd-nl-forensic-conclusion) is established at MODERATE confidence on secondary anchors: the Dutch forensic
# report and the Critical Edition were not opened. So the headline stays DRAFT until those are read.
#
# Three questions are kept apart throughout (docs/AUTHENTICITY.md section 1):
#   Q1  Is the manuscript what it claims to be (Anne Frank's own handwriting, written 1942 to 1944)?       claims afd-1 to afd-4 groups below
#   Q2  Is the published text unaltered, or edited (versions A, B, C, D)?                                  claims afd-versions-abcd to afd-pseudonyms-gap
#   Q3  Is what the diary says true?                                                                        NOT tested here (afd-content-truth-not-tested)
# Denial claims are recorded as reception only (transmission.yaml) and carry no weight (threads.yaml).
# ---------------------------------------------------------------------------
headline: "Anne Frank's diary manuscripts are her own; the published editions are edited versions"
headline_claim: afd-nl-forensic-conclusion
headline_status: draft
assessment:
  question: "Is the Diary of Anne Frank authentic?"
  answer: "yes"
  headline: "Yes, to the best of our reading. The handwritten diaries are Anne Frank's own; the book most people read is her father's edited version of them."
  text: >
    Authenticity has three parts, kept apart here. (1) Are the surviving handwritten diaries what they claim to be? Three sets of expert examination are reported:
    German handwriting experts in 1960, the German federal police laboratory (BKA) in 1980 on paper and writing materials, and the Dutch state forensic laboratory in the early 1980s on handwriting,
    paper and ink. As reported, they found Anne Frank's hand throughout and materials in common use in the 1940s. The one reported anomaly, ballpoint ink (not made until 1951),
    concerned later additions in another hand, not Anne's text; the BKA said so itself in 2006. (2) Is the published text unaltered? No, and this is documented, not hidden:
    Anne wrote a first diary (A) and later rewrote it herself (B); her father, Otto Frank, made a compilation (C, first published in 1947) that omitted and changed some passages;
    a 1991 reader's edition (D) restored some of them. The 1986 critical edition prints A, B and C together. Edited is not forged. (3) Is what it says true? This dig does not test that.
    Our confidence is moderate, not high, because the forensic reports, the critical edition and the court judgments were not opened here; every finding about them comes from the
    institutions that commissioned or took part in them (the Anne Frank House, the Anne Frank Fonds, the Dutch war documentation institute) and from newspaper and fact-check reports.
    Provenance rests on the helpers' account, which comes from one origin. No anachronism has been found in the sources read, but that rests on absence.
    The forgery claims are traced in transmission.yaml; their spread is not evidence.
  key_points:
    - "Experts examined the handwriting (1960, 1980s) and the paper and ink (1980, 1980s) and, as reported, found Anne's hand and materials in use in the 1940s."
    - "The 1980 ballpoint finding concerned later additions in another hand, not Anne's text; the BKA said in 2006 that its report gives no ground to doubt authenticity."
    - "The published book is an edited compilation (her father's, 1947); the edits are documented and the 1986 critical edition prints the versions side by side."
  basis: [afd-nl-forensic-conclusion, afd-hamburg-graphology-1960, afd-bka-1980-scope, afd-ballpoint-not-anne, afd-versions-abcd, afd-otto-edits-documented, afd-no-anachronism-found]
  rated_claim: afd-nl-forensic-conclusion
  would_settle: "Opening the Dutch forensic report (or its summary in the critical edition), the 1980 BKA report and the court judgments, and, ideally, a fresh examination of the manuscripts by a laboratory unconnected to the parties."
search_summary: >
  Is the Diary of Anne Frank authentic? Yes, to the best of our reading: handwriting, paper and ink were examined by German and Dutch experts, and the 1980 ballpoint report concerned later additions
  in another hand, not Anne's text. The published book is her father's edited compilation, which is documented. Confidence is moderate because the reports themselves were not opened.
url_slug: is-the-diary-of-anne-frank-authentic

subject: anne-frank-diary
title: "Is the Diary of Anne Frank authentic?"
description: >
  A document-authenticity dig (docs/AUTHENTICITY.md). It keeps three questions apart: whether the handwritten diaries are what they claim to be (authorship and age of the
  handwriting, paper and ink); whether the published text is unaltered or edited (Anne's first diary A, her own rewrite B, Otto Frank's compilation C, the 1986 critical edition,
  the 1991 reader's edition D); and whether what the diary says is true (not tested here). It covers the forensic work (Hamburg 1960, the German federal police laboratory 1980,
  the Dutch state forensic laboratory in the early 1980s), the ballpoint allegation and how it was resolved, the court cases that tested forgery claims, and the provenance
  (the Secret Annex, the helpers, Otto Frank, the Dutch war documentation institute). The subject is a murdered child and a document; the dig stays on the document and the evidence.
divergence_note: >
  Evidence and belief diverge in four places. First, the popular forgery claim most often repeated today (that part of the diary is in ballpoint ink) traces to a four-page 1980 report
  on paper and writing materials whose own author body, the BKA, said in 2006 that it gives no ground to doubt authenticity; the claim persists without resting on a manuscript finding.
  Second, the usual answer to forgery claims, that the diary is the unaltered words of a girl, is also not quite right: the book most people read was edited and compiled by her father
  (and by others), and a reader's edition of 1991 changed it again. That is documented by the institutions that hold and publish the diary. Editing is a different thing from forgery,
  and a true story about editing lends no weight to a forgery claim. Third, courts are often said to have 'ruled the diary authentic'; the record we could read is narrower: Lubeck ended in
  a withdrawal, not a verdict, and on one reading the Dutch Court of Appeal in 2000 said it was not deciding authenticity but the manner of the attack (a party's quotation; judgment not read).
  Fourth, what all these findings rest on is thinner than the confident public statements suggest: here, every forensic result is known only through the institutions that commissioned
  or took part in the work.

claims:

  # =====================================================================
  # PROVENANCE (the Secret Annex, the helpers, Otto Frank, NIOD)
  # =====================================================================

  - id: afd-papers-found-after-arrest
    state: proposed
    statement: >
      After the eight people in hiding at Prinsengracht 263 were arrested on 4 August 1944, the helpers Miep Gies and Bep Voskuijl found Anne Frank's notebooks and papers in the Annex.
      Miep Gies kept them in a desk drawer and, when Anne's death was confirmed, gave them to Otto Frank (the Fonds dates this to August 1945).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    confidence_reasons:
      start: moderate
      start_because: "Anchored to secondary accounts (the Anne Frank House, the Anne Frank Fonds, the NIOD editor), so the start is moderate."
      steps:
        - {domain: risk_of_bias, effect: down1, reason: "All accounts trace back to one origin, the helpers' own testimony, and the people who tell it are the custodians of the diary. Count once, not three times."}
        - {domain: independent_corroboration, effect: none, reason: "The Anne Frank House says the helpers also gave statements in the Lubeck prosecution (1960 to 1961); that is a second record of their account, not an independent record of the handover, and its text was not seen."}
      reviewed: false
    assumptions:
      - text: "The helpers' account of who found and kept the papers is accurate."
        if_wrong: "The chain of custody between August 1944 and 1945 would have a gap; it would not by itself change the handwriting findings, which test the manuscripts, not the story of their keeping."
    alternatives:
      - text: "The papers were gathered or handled by others before Otto Frank received them."
        why_not_preferred: "No source read says so; the account of the helpers is consistent across the Anne Frank House, the Fonds and the NIOD editor."
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "Universal in the literature and museum accounts."
    would_change_if: "a primary record (Miep Gies's own testimony, Otto Frank's letters of 1945, or the Lubeck witness statements) that tells it differently or fills a gap"
    next_step: "Read the Lubeck helpers' statements (Otto Frank Archive OFA_104) and Otto Frank's letters of August to September 1945."
    anchor:
      type: secondary
      description: >
        Anne Frank House, 'The complete works of Anne Frank' (the helpers found the writings after the arrest and Miep Gies kept them in a desk drawer until she learned of Anne's death, then gave them to Otto Frank);
        Anne Frank Fonds, 'Publications' (the Red Cross confirmed the deaths in August 1945, and Miep Gies then gave Otto Frank the diary); NIOD editor van der Stroom (arrest on 4 August 1944 after betrayal;
        Otto Frank received the manuscripts after returning to Amsterdam). Read in full 2026-10-04. The date of the arrest is the editor's; the Anne Frank House gives it as 'the arrest' without a date on the pages read.
      sources: [src-af-complete-works, src-fonds-publications, src-vanderstroom-1999]

  - id: afd-manuscripts-held-by-niod
    state: established
    statement: >
      Otto Frank bequeathed his daughter's diaries to the Dutch state. They have been held by NIOD (the successor of the 1980s Dutch war documentation institute) since 1980 and are on loan to,
      and shown at, the Anne Frank House in Amsterdam.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    confidence_reasons:
      start: high
      start_because: "The holder's own statement was read in full, and an independent newspaper says the same of NIOD's possession."
      steps:
        - {domain: primary_anchor_read, effect: none, reason: "Already counted in the start."}
        - {domain: independent_corroboration, effect: none, reason: "The taz (2006) independently says NIOD has held the manuscripts since 1980."}
      reviewed: false
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 5
    adoption_note: "Not disputed in any source read."
    would_change_if: "a record of a different bequest, or of the manuscripts being held elsewhere"
    anchor:
      type: primary_text
      description: >
        Anne Frank House news release of 15 May 2018: 'In his will Otto Frank bequeathed the diaries of his daughter Anne to the NIOD ... and the Dutch state. The diaries were given on loan to the Anne Frank House
        organisation and are permanently exhibited in the Anne Frank House.' Read in full 2026-10-04. Corroborated by the taz (27 July 2006), which says the Dutch institute has held the manuscripts since 1980.
      sources: [src-af-2018-news, src-taz-2006-07-27]

  - id: afd-1943-notebooks-missing
    state: established
    statement: >
      Anne's first diary (A) does not survive in full. The red-checked diary runs from 12 June to 5 December 1942, the two surviving notebooks cover 22 December 1943 to 1 August 1944,
      and the notebooks for the period between (6 December 1942 to 21 December 1943) have not survived. Her own rewrite (B), made from 20 May 1944 on loose sheets, covers 12 June 1942 to 29 March 1944 and so
      fills the gap; it breaks off before her last four months.
    statement_kind: reported
    evidence_class: interpretive
    confidence: moderate
    confidence_reasons:
      start: moderate
      start_because: "Secondary anchors: the Anne Frank House and the NIOD editor describe the manuscripts; the manuscripts were not seen."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "The Anne Frank House and the NIOD editor (a different body) give the same structure; the German Anne Frank House document agrees."}
        - {domain: risk_of_bias, effect: down1, reason: "Both bodies have custody or editorial responsibility; neither is an outside examiner."}
      reviewed: false
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "Standard in accounts of the manuscripts."
    would_change_if: "the 1943 notebooks surfacing, or a catalogue of the manuscripts that lists them differently"
    next_step: "Read the Critical Edition's description of the manuscripts and its table of the surviving notebooks."
    anchor:
      type: secondary
      description: >
        Anne Frank House, 'The complete works of Anne Frank' (last entry in the first diary 5 December 1942; 'The 1943 notebooks have not survived'; two notebooks from 1944; the rewrite covers 12 June 1942 to 29 March 1944);
        NIOD editor van der Stroom (1999): the 1943 part must be assumed lost; version b is more than 300 closely written pages running to March 1944 and lacks the last four months. Read in full 2026-10-04.
      sources: [src-af-complete-works, src-vanderstroom-1999, src-af-sieben-fragen]

  # =====================================================================
  # Q1. IS THE MANUSCRIPT WHAT IT CLAIMS TO BE? (authorship, age of handwriting, paper and ink)
  # =====================================================================

  - id: afd-nl-forensic-conclusion
    state: established
    statement: >
      In the early 1980s the Dutch State Forensic Science Laboratory, commissioned by the Dutch state war documentation institute, examined the diary manuscripts (handwriting comparison and a document-technical
      analysis) and concluded that both Anne Frank's first diary (A) and her rewrite (B) were written by her in 1942 to 1944. Its report runs to over 250 pages; a summary of about 65 pages is printed in the 1986 Critical Edition.
    statement_kind: reported
    evidence_class: material
    confidence: moderate
    confidence_reasons:
      start: moderate
      start_because: "Secondary anchor: the report and its summary were not opened; the findings are described by the commissioning institute's editors and by the Anne Frank House."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "A separate set of examiners in a different decade (the Hamburg graphologists, 1960, afd-hamburg-graphology-1960) reached the same conclusion on authorship, and the German federal police laboratory (1980) found the materials in use in the 1940s (afd-bka-1980-scope)."}
        - {domain: risk_of_bias, effect: down1, reason: "The summary was compiled for and printed by the commissioning institute, and every description we read comes from it, the Anne Frank House (a party to the legal actions) or reports that rely on them. Count the descriptions as one origin."}
        - {domain: indirectness, effect: none, reason: "The conclusion is quoted word for word by two Anne Frank House documents (English page and the German PDF, with different page numbers), which agree."}
      reviewed: false
    assumptions:
      - text: "The institute's summary reports the laboratory's findings faithfully."
        if_wrong: "The strength of the finding would have to be re-read from the full report."
    alternatives:
      - text: "The conclusion is overstated by the commissioning institute, which had an interest in the result."
        why_not_preferred: "The laboratory is a state forensic body independent of the Frank family and of the Anne Frank Fonds; the Hamburg court (1990, as quoted by the taz) had the Dutch study and saw no reason to doubt the originals. But we did not read the report, so this stays an alternative to be closed by reading it."
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "Accepted by the institutions that hold, publish and exhibit the diary and in every fact-check read."
    would_change_if: "the full report or its summary showing a different conclusion or a method flaw; a later hand or later material in a manuscript; an independent re-examination that disagrees"
    next_step: "Read the forensic summary in the Critical Edition (pp. 121 to 186 of the 1986 Dutch edition; the revised English edition of 2003), then ask NIOD for research access to the full report."
    anchor:
      type: secondary
      description: >
        Anne Frank House, 'The authenticity of the diary of Anne Frank': most extensive investigation in the first half of the 1980s by the Netherlands Forensic Institute at the request of NIOD, a report of over 250 pages with a 65-page summary in the
        Critical Edition; NIOD's conclusion quoted: "The report of the Netherlands Forensic Institute has convincingly demonstrated that both versions of the diary of Anne Frank were written by her in the years 1942 to 1944".
        Same sentence in the German Anne Frank House document 'Sieben Fragen' (different printing, page 203 against page 186). NIOD editor van der Stroom (1999, a co-editor of the edition): the laboratory examined handwriting, paper and ink, 'zonder twijfel' (without doubt)
        both version A and version B were written by Anne in 1942 to 1944; report over 250 pages; summary at pp. 121 to 186. Read in full 2026-10-04. The report and the edition were not opened.
      sources: [src-af-authenticity, src-af-sieben-fragen, src-vanderstroom-1999]
      accessible: false

  - id: afd-hamburg-graphology-1960
    state: established
    statement: >
      In March 1960 a team of Hamburg graphologists, in a 131-page report prepared for the legal action Otto Frank had begun, concluded that all entries in the diaries and on the loose sheets, and all corrections and additions
      in Anne's manuscripts, were identical with Anne's handwriting, that the loose sheets were not written before the three diary books, and that the German text of the published book was true to its sources in substance and ideas.
    statement_kind: reported
    evidence_class: interpretive
    confidence: moderate
    confidence_reasons:
      start: moderate
      start_because: "Secondary anchor: the report was not opened; the Anne Frank House reports its conclusions."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "A different examining team, twenty years before the Dutch laboratory, reached the same conclusion on the hand (afd-nl-forensic-conclusion)."}
        - {domain: risk_of_bias, effect: down1, reason: "Reported only by the Anne Frank House, a party; the examiners worked in a case Otto Frank started, although the Lubeck prosecutor adopted the finding."}
      reviewed: false
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "Cited in the Anne Frank House accounts; less known than the Dutch report."
    would_change_if: "the 1960 report itself, showing a different conclusion, a thin comparison base or a lack of independence"
    next_step: "Request the 1960 report from the Anne Frank Stichting's Otto Frank Archive (OFA_104 and following) or the Lubeck prosecution file."
    anchor:
      type: secondary
      description: >
        Anne Frank House, 'The authenticity of the diary of Anne Frank' ('In March 1960, the Hamburg graphologists came to the conclusion in their 131-page report that all the notations in the diaries and the loose sheets ... were identical with Anne's handwriting;
        the loose sheets were not written before the three diary books; the German text 'may be considered true to its sources in substance and ideas''), repeated in the German PDF 'Sieben Fragen' (report 'im März 1960', 131 pages). Read in full 2026-10-04.
        The Anne Frank House research archive adds that the Lubeck prosecutor's office was convinced by an extensive graphological examination before it charged two men over a 1958 statement.
      sources: [src-af-authenticity, src-af-sieben-fragen, src-af-research-otto]
      accessible: false

  - id: afd-bka-1980-scope
    state: established
    statement: >
      The German federal police laboratory (BKA) stated in 2006 that its 1980 report for the Landgericht Hamburg answered only whether the paper and writing materials used for the diaries were in common use in the Second World War years,
      which it confirmed beyond doubt; that it found added 'Korrekturschriften' on the original pages in ballpoint paste, in use only from 1951, which it took to be later editorial notes by another hand; that it made no finding on authorship;
      and that the report 'cannot be used to cast doubt on the authenticity' of the diaries.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    confidence_reasons:
      start: high
      start_because: "The BKA's own statement was read in full, and its key sentences are matched word for word in an independent newspaper."
      steps:
        - {domain: primary_anchor_read, effect: none, reason: "Counted in the start: the statement itself was read."}
        - {domain: indirectness, effect: none, reason: "The claim is about what the BKA said in 2006 its 1980 report contained, not about the report; the report was not opened, and the claim says so."}
      reviewed: false
    assumptions:
      - text: "The 2006 statement describes the 1980 report accurately."
        if_wrong: "The scope of the 1980 report would need re-reading from the report; the claim about what the BKA stated would stand."
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Reported in the German press in July 2006 and cited by the Anne Frank House; the 1980 report itself is far better known as a 'forgery proof' in denial writing than for its actual scope."
    would_change_if: "the 1980 report showing wider or different findings than the 2006 statement describes; a correction by the BKA"
    next_step: "Obtain the 28 May 1980 report (Otto Frank Archive OFA_108 or the Hamburg court file) and compare it with the statement."
    anchor:
      type: primary_text
      description: >
        Bundeskriminalamt press release of 26 July 2006 (presseportal.de, 'Original-Content von: Bundeskriminalamt'), read in full: point 1 (only the question whether paper and writing means were common in the war years; confirmed 'zweifelsfrei'),
        point 2 (added 'Korrekturschriften' in ballpoint paste in use only from 1951; 'Offenbar handelt es sich dabei um nachtraeglich vorgenommene redaktionelle Anmerkungen bzw. Korrekturen eines weiteren Bearbeiters'), the conclusion that no finding on authorship was made, and
        "kann nicht dafür in Anspruch genommen werden, die Authentizität der Tagebücher der Anne Frank in Zweifel zu ziehen". The taz of 27 July 2006 quotes two of these sentences word for word and describes the report as four typed pages.
      sources: [src-bka-2006, src-taz-2006-07-27]

  - id: afd-materials-nl-lab
    state: established
    statement: >
      As reported, the Dutch laboratory found that most of the diary and loose sheets were written in grey-blue fountain-pen ink, with some thin red ink, green and red coloured pencils and black pencil for notes, and no ballpoint ink in Anne's writing.
      Together with the BKA's 1980 confirmation that the paper and writing materials were in common use in the war years, no material of a later date has been reported in Anne's text.
    statement_kind: reported
    evidence_class: material
    confidence: moderate
    confidence_reasons:
      start: moderate
      start_because: "The Dutch result is secondary; the BKA part is primary but concerns a different examination."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "Two separate laboratories (Dutch 1980s, German federal 1980) report materials in use in the war years."}
        - {domain: risk_of_bias, effect: down1, reason: "The Dutch description comes from the commissioning institute and the Anne Frank House; the BKA's statement was given under pressure over its report's use (taz), though it is against its own earlier impression."}
      reviewed: false
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "Standard in the fact-checks."
    would_change_if: "the full reports showing a different ink, paper or glue result, or a post-1944 material in Anne's own text"
    next_step: "Read the document-technical part of the forensic summary in the Critical Edition."
    anchor:
      type: secondary
      description: >
        Anne Frank House, 'The authenticity of the diary of Anne Frank' ('Document research by the Netherlands Forensic Institute ... revealed that most of the diary and loose sheets were written with gray-blue fountain pen ink', plus thin red ink, green and red coloured pencils
        and black pencil, 'But no ballpoint pen'); German PDF 'Sieben Fragen' (same, point 5). The BKA 1980 materials finding is in afd-bka-1980-scope. Read in full 2026-10-04; the reports were not opened.
      sources: [src-af-authenticity, src-af-sieben-fragen, src-bka-2006]
      accessible: false

  - id: afd-ballpoint-not-anne
    state: established
    statement: >
      No text written by Anne Frank has been reported in ballpoint ink. The 1980 BKA finding of ballpoint corrections concerned later additions in another hand: the BKA called them later editorial notes by another editor (2006), and the Dutch examination of the 1980s,
      as reported by the Anne Frank House, found ballpoint writing only on two loose note slips left among the pages by earlier examiners, in handwriting that differs from Anne's.
    statement_kind: reported
    evidence_class: material
    confidence: moderate
    confidence_reasons:
      start: moderate
      start_because: "The BKA part is primary (afd-bka-1980-scope); the Dutch part is secondary; the manuscripts and both reports were not opened."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "Independent of the Anne Frank House, the BKA itself says the ballpoint additions were later notes by another editor, and a Hamburg court (1990, quoted by the taz) saw no reason to doubt the originals after the BKA expert could not point to the corrections again."}
        - {domain: inconsistency, effect: down1, reason: "The accounts disagree on who made the later marks (an examining graphologist, an editor) and on whether page numbers were also in ballpoint (afd-ballpoint-detail-gap)."}
      reviewed: false
    assumptions:
      - text: "The ballpoint traces are confined to additions that are not Anne's text."
        if_wrong: "A ballpoint line inside Anne's own writing would be a decisive anachronism for that passage and would need its own claim."
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "The 'ballpoint' story is widely repeated online; the correction is in every fact-check read."
    would_change_if: "the forensic summary or the 1980 report showing ballpoint ink inside a passage in Anne's hand; or an examination of the manuscripts under magnification that finds it"
    next_step: "Read Critical Edition pp. 160 to 165 (1988 pagination as cited by Holocaust Denial on Trial) and the BKA report of 28 May 1980."
    anchor:
      type: secondary
      description: >
        BKA release of 26 July 2006 (afd-bka-1980-scope): the ballpoint 'Korrekturschriften' were apparently later editorial notes by a further editor. Anne Frank House, 'The authenticity of the diary of Anne Frank' and the German PDF 'Sieben Fragen' (point 5: the Dutch laboratory found
        the ballpoint only on two loose note slips of earlier examiners, unrelated to the diary text, in handwriting that differs 'in weitgehendem Maße' from the diary's). taz, 27 July 2006: the BKA expert, shown the originals in Amsterdam, could not find the ballpoint corrections again, and the Landgericht Hamburg's
        written reasons say the originals 'have passed through many hands' and the expert may have erred. Holocaust Denial on Trial (hdot) agrees that nothing in Anne's hand is in ballpoint. Read in full 2026-10-04; the reports and the judgment were not opened.
      sources: [src-bka-2006, src-af-authenticity, src-af-sieben-fragen, src-taz-2006-07-27, src-hdot-ballpoint]
      accessible: false

  - id: afd-ballpoint-detail-gap
    state: searched_gap
    statement: >
      We do not know exactly what carries the later ballpoint writing in the manuscripts. The accounts differ: two loose note slips left by an examining graphologist (Anne Frank House, which also says that in 1987 a relative of one examiner told it the notes were that examiner's),
      later comments by an editor (the Berlin Anne Frank Centre, via the taz of 11 July 2006), and also page numbers added partly in ballpoint, probably by Otto Frank (Holocaust Denial on Trial, citing the Critical Edition). All agree that none of it is Anne's text.
    statement_kind: search_result
    evidence_class: interpretive
    confidence: provisional
    evidential_weight: 2
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "The detail is rarely stated; the headline fact (not Anne's text) is stable."
    would_change_if: "the Critical Edition, the Dutch laboratory summary or the BKA report naming exactly which sheets carry the ballpoint"
    next_step: "Read Critical Edition pp. 160 to 165 (1988 pagination) and the corresponding pages of the 2003 revised edition; then the BKA report of 28 May 1980 (OFA_108)."
    anchor:
      type: search-record
      description: >
        Compared five accounts read on 2026-10-04 (Anne Frank House English page and German PDF, taz 11 July and 27 July 2006, Holocaust Denial on Trial) and the BKA release. They differ on who made the later marks and what they are. The primary sources that would settle it
        (Critical Edition pp. 160 to 165, the BKA report) are not open to us: the Internet Archive copy is a lending scan (401) and the BKA report is in a private archive.
      sources: [src-af-authenticity, src-af-sieben-fragen, src-taz-2006-07-11, src-taz-2006-07-27, src-hdot-ballpoint, src-bka-2006]

  - id: afd-paper-glue-gap
    state: searched_gap
    statement: >
      We could not confirm the detailed material dating that one fact-check attributes to the Dutch laboratory: infrared spectrometry showing the glue and binding fibres were in common use in the early 1940s, and X-ray fluorescence placing the paper's manufacture between 1939 and 1942.
    statement_kind: search_result
    evidence_class: material
    confidence: provisional
    evidential_weight: 2
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "Repeated by few outlets; the broad finding (materials consistent with the 1940s) is stable."
    would_change_if: "the document-technical part of the forensic summary stating these methods and results (or different ones)"
    next_step: "Read the document-technical section of the forensic summary in the Critical Edition, then check Full Fact's statements against it."
    anchor:
