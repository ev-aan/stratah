  - id: afd-levin-chronology
    state: established
    statement: >
      The allegation that the American writer Meyer Levin wrote the diary fails on the chronology: the Dutch first edition, Het Achterhuis, appeared on 25 June 1947 (3,036 copies), and Levin first read the diary in French translation in 1950 and then contacted Otto Frank. His dispute with Otto Frank was a stage-adaptation rights dispute,
      not a dispute about who wrote the diary. The target allegation is that Meyer Levin wrote the diary (circulated 1957 to 1958 and again in 2024). It is filed as established, not refuted, because the evidence read is secondary and Rule 9 needs material or primary-text evidence for a refutation.
    statement_kind: judgment
    evidence_class: interpretive
    confidence: high
    confidence_reasons:
      start: moderate
      start_because: "Secondary anchors."
      steps:
        - {domain: independent_corroboration, effect: up1, reason: "The Anne Frank House, the Anne Frank Fonds (a separate foundation) and an independent fact-checker (Full Fact) agree on the 1947 publication and on Levin's 1950 first reading; the Anne Frank House research page and Full Fact agree on the nature of the dispute."}
      reviewed: false
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "The Levin claim recirculates on social media (Full Fact, 2024) but is rejected in every source read."
    would_change_if: "a copy of a pre-1947 text by Levin, or evidence that Het Achterhuis was written after 25 June 1947"
    next_step: "Check a library copy of the first edition (1947) and its dated reviews, and Levin's dated letters to Otto Frank."
    anchor:
      type: secondary
      description: >
        Anne Frank Fonds, 'Publications' (first Dutch edition 25 June 1947, a print run of 3,000; French edition 1950; Meyer Levin read the diary and contacted Otto Frank); Anne Frank House, 'Publication of the diary' and 'The complete works' (first edition 3,036 copies, 25 June 1947);
        Anne Frank House research archive (the first allegations of 1957 to 1958 mentioned Levin; the conflict was over a stage adaptation); Full Fact, 7 March 2024 (Levin read a French translation in 1950; his suit concerned the stage play; the claim 'has no basis in fact'). Read in full 2026-10-04.
      sources: [src-fonds-publications, src-af-publication, src-af-complete-works, src-af-research-otto, src-fullfact-2024]

