# Sources for the anne-frank-diary dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
#
# What "authenticity" means in this file: whether each SOURCE is what it says it is (an institution's own page, an agency's own press release,
# a newspaper article, a scanned PDF). It is not the answer to the dig's question. Whether the diary manuscripts are Anne Frank's is the subject
# of claims afd-nl-forensic-conclusion and afd-hamburg-graphology-1960; the manuscripts themselves, the Dutch forensic report, the Critical Edition
# and the court judgments were NOT opened in this dig and are listed at the end as "not read" so that no claim can lean on them by accident.
#
# Storage: web pages were fetched with curl on 2026-10-04 (raw bytes hashed below). The full pages are not stored (copyright);
# sources/extracts/*.txt keep only the one or two sentences a claim cites (trimmed in round 1, log L-08), so a reader can check them. The BKA press release is stored in full
# (sources/bka-2006-07-26.txt) because it is short and an official statement.
#
# read: full = whole page or document fetched and read here; extract = the passages named were read in a fetched copy; not read = not opened.
# Independence note: the Anne Frank House (Anne Frank Stichting) and the Anne Frank Fonds (Basel) were plaintiffs in several of the cases below, and
# the Netherlands Institute for War Documentation (RIOD, now NIOD) commissioned the forensic work and edited the Critical Edition. Pages from those bodies are
# therefore accounts by parties, however careful. They are recorded as such in `tested_by`.
retrieved: 2026-10-04
sources:

