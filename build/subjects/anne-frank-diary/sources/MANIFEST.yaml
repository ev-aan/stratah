        - "Its account of the Lubeck, Frankfurt and Hamburg proceedings matches the Anne Frank House research archive page (src-af-research-otto), which cites the judgments, and, for the Hamburg 1980 BKA report, the taz report (src-taz-2006-07-27). [read]"
