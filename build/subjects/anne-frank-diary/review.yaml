      - id: R2-1
        target: "sources/extracts/*.txt (sieben-fragen, af-research-otto, vanderstroom-1999, fonds-publications, taz-2006, af-complete-works, af-authenticity); sources/MANIFEST.yaml src-faurisson-ihr `stored_as` (line 426)"
