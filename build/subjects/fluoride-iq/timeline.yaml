  src-ca9-2026:              {title: "Ninth Circuit memorandum, No. 25-384 (21 May 2026)", url: "https://cdn.ca9.uscourts.gov/datastore/memoranda/2026/05/21/25-384.pdf", authenticity: "authenticated, strong"}
