  src-cochrane-2024:         {title: "Cochrane review 2024, CD010856.pub3", url: "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11449566/fullTextXML", authenticity: "authenticated, moderate"}
  src-rfk-x-2024:            {title: "Kennedy post on X, 2 Nov 2024", url: "https://x.com/RobertKennedyJr/status/1852812012478398923", authenticity: "authenticated, moderate (platform record)"}
  src-do-2024:               {title: "Do et al., J Dent Res (online 18 Dec 2024)", url: "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11843800/fullTextXML", authenticity: "authenticated, moderate"}
  src-taylor-2025:           {title: "Taylor et al., JAMA Pediatr (online 6 Jan 2025)", url: "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11877182/fullTextXML", authenticity: "authenticated, moderate"}
  src-utah-hb81:             {title: "Utah H.B. 81 (2025)", url: "https://le.utah.gov/~2025/bills/static/HB0081.html", authenticity: "authenticated, strong"}
  src-epa-2025-04-07:        {title: "EPA release, 7 Apr 2025", url: "https://www.epa.gov/newsreleases/epa-will-expeditiously-review-new-science-fluoride-drinking-water", authenticity: "authenticated, strong"}
  src-pbs-2025-04-07:        {title: "AP via PBS, 7 Apr 2025", url: "https://www.pbs.org/newshour/health/rfk-jr-will-tell-cdc-to-stop-recommending-fluoride-in-drinking-water", authenticity: "news report"}
  src-fda-2025-05-13:        {title: "FDA release, 13 May 2025", url: "https://www.fda.gov/news-events/press-announcements/fda-begins-action-remove-ingestible-fluoride-prescription-drug-products-children-market", authenticity: "authenticated, strong"}
  src-florida-sb700:         {title: "Florida SB 700, Chapter 2025-22", url: "https://www.flsenate.gov/Session/Bill/2025/700", authenticity: "authenticated, strong"}
  src-efsa-2025:             {title: "EFSA opinion on fluoride (published 22 Jul 2025)", url: "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12280829/fullTextXML", authenticity: "authenticated, moderate"}
  src-fda-2025-10-31:        {title: "FDA release and CDER evaluation, 31 Oct 2025", url: "https://www.fda.gov/media/189421/download", authenticity: "authenticated, strong"}
  src-warren-2025:           {title: "Warren et al., Sci Adv (19 Nov 2025)", url: "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12629170/fullTextXML", authenticity: "authenticated, moderate"}
  src-fr-2026-01657:         {title: "EPA assessment plan, 91 FR 3722 (28 Jan 2026)", url: "https://www.federalregister.gov/d/2026-01657", authenticity: "authenticated, strong"}
