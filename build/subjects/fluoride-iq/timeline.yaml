timeline:
  id: fluoride-iq
  title: "Fluoride and children's IQ: the studies, the courts and the institutions (1945 to 2026)"
  as_of: "2026-10-03"
  note: >
    Times are UTC; every event here is known to the day, month or year only. Publication dates
    are online or issue dates as given in the cited record. Events marked "single" rest on one
    source. Panel B enlarges August 2024 to October 2026, when the US institutional position
    split. Policy events are adoption, not evidence.
panels:
  - id: years
    title: "Panel A: 1945 to July 2024 (one tick per ten years)"
    start: "1945-01-01T00:00:00Z"
    end:   "2024-07-31T00:00:00Z"
    tick_years: 10
    lanes: [history, research, legal, institutions]
  - id: recent
    title: "Panel B: August 2024 to October 2026 (one tick per two months)"
    start: "2024-08-01T00:00:00Z"
    end:   "2026-10-15T00:00:00Z"
    tick_hours: 1464
    lanes: [research, legal, institutions, media]
lanes:
  history:      {label: "Fluoridation and its opponents"}
  research:     {label: "Studies and reviews"}
  legal:        {label: "Courts and laws"}
  institutions: {label: "Agencies and cities"}
  media:        {label: "Statements and opinion"}
people:
  - {who: "Edward M. Chen", detail: "US District Judge (N.D. Cal.) who issued the 24 Sep 2024 findings in Food & Water Watch v. EPA; vacated on appeal 21 May 2026."}
  - {who: "Robert F. Kennedy Jr.", detail: "US Secretary of Health and Human Services from 2025; posted on 2 Nov 2024 that fluoride is 'an industrial waste' associated with IQ loss; said in Apr 2025 he would tell the CDC to stop recommending fluoridation (AP)."}
  - {who: "Lee Zeldin", detail: "EPA Administrator; announced the EPA's review of fluoride on 7 Apr 2025."}
  - {who: "Philippe Grandjean", detail: "Senior author of Choi et al. 2012 (the 'Harvard study') and of later benchmark-dose analyses."}
  - {who: "Christine Till", detail: "Senior author of the Canadian MIREC fluoride studies (2019, 2020)."}
