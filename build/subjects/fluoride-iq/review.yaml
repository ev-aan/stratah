notes: >
  Publish-gate review of PR #15 (head 0f60029). Conformance on the merge with origin/main: 0 errors,
  3 warnings for this subject (two established claims on secondary anchors; no taxonomy entry).
  Sources opened by the reviewer: 26 of the 67 cited in claims.yaml, fetched live and text-searched.
  The court documents and the NTP monograph were downloaded and their sha256 hashes match the manifest
  (Ninth Circuit 559ecd6d..., Doc. 445 c6330290..., NTP 4d156ef6...). Wording, dates and numbers
  that matched: NTP p. ii scope sentence, the moderate-confidence conclusion, 72 studies, 19 low risk
  of bias (3 cohort, 16 cross-sectional), 18 inverse, the countries, 0.59% (about 1.9 million),
  "appeared less consistent", "primarily on studies with estimated fluoride exposures higher than",
  "uncertainty remains", and the state-of-the-science retitling. Doc. 445 (filed 09/24/24): p. 2
  "unreasonable risk of reduced IQ in children", "does not conclude with certainty", "does not
  dictate precisely"; p. 6 4 mg/L / 10 = 0.4 mg/L; paras 121-122 on pp. 79-80. Ninth Circuit No.
  25-384 (filed 21 May 2026, not for publication): vacate and remand; "abused its discretion after
  the first bench trial by commandeering the case"; remand "to rule based solely on the first trial
  record"; standing remanded. It is a procedural ruling and did not reach the science, as the dig
  says. The court rulings are stated as what they are and are not. Also matched: the ADA misquote
  ("with any certainty"); Taylor 2025 Table 2 (all figures cited); Choi 2012 (27 studies, 2 Iran,
  SMD -0.45, 11.5 mg/L, "in many cases", "cannot be used to derive an exposure limit"); the HSPH
  release of 25 Jul 2012; EFSA 2025 (>1.5 mg/L); NASEM 2020 ch. 2 and 2021 ch. 2 quotes and FAN as a
  literature source; FDA 13 May 2025; 90 FR 25329 "not conclusive" (govinfo copy); FDA CDER
  evaluation "equivocal" (pdf p. 13), "hypothesis-generating" (p. 15); EPA releases of 7 Apr 2025,
  22 Jan 2026 and 3 Aug 2026; 91 FR 3722 (citation and date from the FR API; quote from the stored
  copy); Florida bill history (presented 15 May, approved 20 May 2025, Ch. 2025-22); NSF 2019 (328
  samples, arsenic 52%, mean 0.16, max 0.9, "none ... exceeded 1/10th"); CDC 2011 additives (95%
  FSA, phosphorite); the RFK Jr. post ("industrial waste", "IQ loss"; no arsenic); Green 2019
  (512 pairs, 0.69 vs 0.40, boys -4.49); Do 2024 (357, 1.07, margin 3.75); Warren 2025 (57,960,
  about 7% of an SD higher); Aggeborn & Ohman (0.14 SD bound, 81,776, mean .3533); Simon 2026
  abstract. Not opened by the reviewer: the CDC recommendations page (403), Grandjean 2024 Odense
  (Europe PMC 500), Utah H.B. 81 live (TLS failure; the stored enrolled text has "A person may not
  add fluoride to water" and effective 7 May 2025), eCFR 141.62 (blocked), the Choi-Grandjean
  statement repost (403), the Florida chapter-law text, the FDA 31 Oct 2025 release ("4 companies"),
  and the remaining 41 cited sources. Refuted claims: Rule 9 is met for fl-court-proved-harm,
  fl-harvard-study-applies-to-us and fl-additives-toxic-waste (each names a target and rests on
  primary text or test data). The narrative_drift class fits all three. Absence claims are marked
  and capped (fl-nazi-camps and the searched gaps). Nothing borrows weight from adoption, and
  threads.yaml sets confers_weight: false. Two blocking findings are in round 1: the NTP's scope is
  paraphrased more narrowly than the monograph states it (R1-1), and the surface text and
  fl-water-07-no-lower-iq say residence-based studies at community levels find no lower IQ, while the
  dig itself holds a 2026 US study (ECHO, exposure assigned by residential address) that reports
  lower fluid cognition above about 0.675 mg/L, which the assessment never mentions (R1-2). Not added
  to build/site.yaml.
rounds:
- round: 1
  reviewed_on: 2026-10-06
  head: 0f60029
  requests:
  - id: R1-1
    target: fl-ntp-silent-on-07; assessment.text; short_answer.except[fl-high-exposure-lower-iq].what_it_is_not
    severity: blocking
    finding: >
      The statement says the NTP "does not address whether fluoride added to drinking water at 0.7
      mg/L ... has a measurable effect on IQ". The monograph says it does not address whether "the
      sole exposure to fluoride added to drinking water" is associated with a measurable effect. The
      dig drops "sole", which is the qualifier that matters. The same section of the monograph (p. 84,
      the paragraph after the 1.9 million figure) also says the moderate-confidence conclusions "may
      also be relevant to people living in optimally fluoridated areas of the United States depending
      on the extent of their additional exposures to fluoride from sources other than drinking
      water", and that targeted US research is needed. The assessment ("The NTP itself says its
      review does not address 0.7 mg/L") and the short answer ("Not a finding about 0.7 mg/L: the NTP
      says so in its own words") leave a reader thinking the NTP is silent on fluoridated areas, when
      it states a conditional relevance. Keep "sole exposure" in the statement and surface lines, and
      add the p. 84 qualification.
    evidence: "NTP Monograph 08 (Aug 2024), sha256 4d156ef6... (matches manifest): p. ii 'What This Monograph Does Not Do'; p. 84 (pdf p. 104), opened and read by the reviewer."
  - id: R1-2
    target: fl-water-07-no-lower-iq; assessment.text and key_points[1]; short_answer.answer and summary; headline (draft); fl-echo-2026-change-point
    severity: blocking
    finding: >
      fl-water-07-no-lower-iq (established, moderate, weight 4) and the surface text say that studies
      comparing people by the fluoride level of the community water they lived on, at community
      levels, find no lower scores, and that "at 0.7 mg/L ... no effect has been shown". The dig also
      files fl-echo-2026-change-point. Its abstract (read by the reviewer) is a US cohort of 2,514
      children in which each child's prenatal water fluoride was assigned by linking census-tract
      levels to residential addresses, the same residence-based design. It reports fluid cognition
      0.67 points lower per 100 micrograms/L above a change point of 675 micrograms/L, and calls this
      "below current WHO and U.S. EPA thresholds". Its abstract-only status justifies keeping it
      proposed, but not leaving it out. It is missing from fl-water-07-no-lower-iq's positions, from
      the assessment basis and text, from the key points and from the short answer. A reader is told
      residence-based studies are uniformly null at community levels when the dig holds one, unread
      in full, that is not. Fix: narrow the claim to the five cohorts, name ECHO 2026 as a contrary
      report (abstract only, proposed), and make the surface lines say so ("no effect has been shown"
      should not stand unqualified while this is open). Reading the full paper is the stronger fix.
    evidence: "Simon et al. 2026, Am J Epidemiol, doi 10.1093/aje/kwag186, PMID 42596505; abstract opened by the reviewer through the Europe PMC REST API on 2026-10-06."
  - id: R1-3
    target: fl-state-bans-2025
    severity: non_blocking
    finding: >
      "Became the first US states to prohibit" is not supported by any cited anchor (the statutes
      show what Utah and Florida enacted, not that no state did so earlier), and the related gap
      fl-sq-other-state-bans is still open. Either anchor "first" or drop it. The Florida chapter
      law text (sections 31-32, p. 51) was not opened by the reviewer; only the bill history was.
    evidence: "Florida Senate bill history for SB 700 (2025) opened; Utah H.B. 81 stored enrolled text read; neither says 'first'."
  - id: R1-4
    target: short_answer.summary ("more than 150,000 people")
    severity: non_blocking
    finding: >
      The summed figure is mostly two studies that are not childhood IQ at 0.7 mg/L: Swedish
      conscripts on natural fluoride, mean about 0.35 mg/L, and US High School and Beyond achievement
      tests. Those two make up 139,736 of the 151,402. The summary figure's detail says this, but the
      short-answer sentence leads with the total. Consider giving the outcome mix next to the number,
      so the size does not carry more weight than the design supports.
    evidence: "Aggeborn & Ohman 2021 (gwern copy, hash matches) and Warren 2025 (Europe PMC full text) opened by the reviewer."
  - id: R1-5
    target: fl-harvard-study-applies-to-us; fl-additives-toxic-waste; fl-water-07-no-lower-iq
    severity: non_blocking
    finding: >
      Three anchors are third-party copies held as anchor_checked primary: the Choi-Grandjean
      statement (fluoridealert.org repost), the CDC 2011 additives fact sheet (pro-fluoridation
      group's mirror) and Aggeborn & Ohman (gwern.net). The dig discloses each one. Keep them listed
      as limits on the page. None of the three decides its claim on its own.
    evidence: "Manifest entries; CDC mirror and gwern copy opened by the reviewer; fluoridealert.org returned 403."
