  - id: fl-additives-toxic-waste
    state: refuted
    statement_kind: judgment
    refutes_target: >
      The claim that the chemicals used to fluoridate water put harmful levels of contaminants
      such as arsenic into tap water (the 'industrial co-product' part is true and is not the
      target)
    refutation_class: narrative_drift
    statement: >
      Fluoridation chemicals, as industrial co-products, put harmful levels of contaminants into
      tap water.
    evidence_class: primary_text
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: primary_anchor_read, effect: down1, reason: "The CDC fact sheet was read in a mirror copy; the NSF data are the certifier's own."}
    evidential_weight: 4   # of 5
    anchor_checked: primary
    adoption_weight: 3   # of 5
    adoption_note: >
      The 'industrial waste' wording was used by Robert F. Kennedy Jr. on 2 Nov 2024, before he
      became Health Secretary [read]; his post does not mention arsenic or other contaminants.
      Not measured.
    would_change_if: independent testing finds contaminants above the NSF/ANSI 60 limits in product as dosed
    anchor:
      type: certification-test-data
      description: >
        CDC engineering fact sheet (2011): most additives come from phosphorite rock used mainly
        in phosphate fertilizer manufacture; about 95% of fluorosilicic acid comes from captured
        gases in that process [read, mirror copy]. NSF fact sheet (2019), 2012-2017 samples
        (328): arsenic detected in 52%, mean 0.16 ppb, maximum 0.9 ppb, against the NSF limit of
        1 ppb and the EPA maximum of 10 ppb; "none of the samples exceeded 1/10th the U.S. EPA
        MCL" [read].
      accessible: true
      sources: [src-cdc-additives-2011, src-nsf-2019, src-rfk-x-2024]
    positions:
      - label: "Yes (what is real)"
        holder: "CDC fact sheet"
        ground: "Most fluoridation chemical is a co-product of phosphate fertilizer manufacture."
      - label: "No"
        holder: "NSF certification data"
        ground: "Measured contaminants in certified product were far below the limits."
    basis: >
      The deciding data are the certifier's own test results, not an independent laboratory's;
      would_change_if names the test that would overturn them.

