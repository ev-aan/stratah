    refutation_class: narrative_drift
    statement: >
      The 2012 "Harvard study" showed that fluoridated tap water in the US lowers children's IQ.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5
    anchor_checked: primary
