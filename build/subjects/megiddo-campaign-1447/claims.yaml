        Breasted's translations read name Amon-Re in texts he attributes to earlier reigns: Amenemhet I (vol. 1, section 484, 'for his father Amon-Re, lord of Thebes'); Thutmose I (vol. 2, sections 73, 88, 100); Thutmose II (127); Hatshepsut (sections 196, 219, 225, 253); and in the Megiddo account, 'my father Amon-Re' at section 418 and Amon-Re at section 425 (with Amon alone at sections 422, 423 and 430). A note ('Text has an Amon wrongly restored here') is printed after the start of section 424 in the OCR, so it may belong to section 423 or 424 (placement uncertain), and section 425 is partly bracketed. Barnhart's line 17 reads 'his father Amun Ra' in the introduction to the Annals. All are one translator's or a derived reading and the signs were not read. The dates of the earlier texts are Breasted's attributions.
