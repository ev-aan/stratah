  # ------------------------- DATE AND CHRONOLOGY -------------------------

  - id: megiddo-absolute-date-bce
    state: contested
    statement: >
      The Annals give only a regnal date for the battle (year 23 of Thutmose III); the year BC depends on the chronology used. Breasted (1906) puts the reign from 3 May 1501 to 17 March 1447 BC (from Meyer's lunar computation), so year 23 is 1479 BC (arithmetic on his table). Hornung, Krauss and Warburton (2006, Krauss's chapter) conclude that year 1 of Thutmose III is 1479 BC, so year 23 is 1457 BC (arithmetic ours: 1479 minus 22). Barnhart's page gives the battle as 1457 BC and names no chronology. Nelson (1913) says his chronology is Breasted's and gives 15 May 1479 BC. The figure 1447 BC is, in Breasted's table, the end of the reign; on the 2006 year 1 of 1479 BC it falls in year 33 (arithmetic ours). None of the chronologies read gives 1447 BC for year 23.
    statement_kind: judgment
    evidence_class: interpretive
    confidence: moderate
    evidential_weight: 3
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured: no source read counts how widely each year is repeated."
    would_change_if: >
      a chronology with a stated method (Kitchen, Beckerath, or a recomputation of the lunar dates) is read and gives year 23 outside 1457 BC and 1479 BC with stated reasons, or the sign reading of the date line changes the day or month and so the astronomical solution
    positions:
      - label: "year 23 = 1479 BC (year 1 = 1501 BC)"
        holder: "J. H. Breasted, Ancient Records of Egypt vol. 1, section 67 and note h (1906); followed by H. H. Nelson (1913), who says his chronology is Breasted's"
        ground: "Meyer's computation from the new-moon dates in years 23 and 24 of the Annals and a Sothic date; Breasted's note lists earlier computations by Mahler (accession 1504) and Lehmann (1515) that Meyer corrected to 1501"
      - label: "year 23 = 1457 BC (year 1 = 1479 BC)"
        holder: "E. Hornung, R. Krauss, D. A. Warburton (eds.), Ancient Egyptian Chronology (2006), Krauss's chapter III.8 and the resume, which says the chronology 'agrees with Beckerath and Kitchen' on 1479 BC for the accession (Kitchen and Beckerath not read)"
        ground: "two lunar dates of Thutmose III (the Megiddo date, year 23, and the Akhmenu foundation, year 24); of the two solutions Krauss finds astronomically workable (year 1 = 1479 or 1504 BC) only 1479 BC fits the synchronisms with Ramesses II (1279 BC) and Amenhotep I (year 9 = 1506 BC)"
      - label: "year 23 = 1457 BC, no chronology named"
        holder: "R. H. Barnhart, personal web page (2015)"
        ground: "'according to current scholarly calculations'; no chronology is named on the page"
      - label: "1447 BC for the recording or battle"
        holder: "the speaker (second-hand wording from the handoff file; videos not opened)"
        ground: "none stated; not read"
    disputed_by:
      - {who: "J. H. Breasted", kind: person, position: "year 23 = 1479 BC on year 1 = 1501 BC", source_read: "yes, vol. 1 section 67 and note h", via: "Ancient Records of Egypt, 1906"}
      - {who: "R. Krauss (in Hornung, Krauss, Warburton, eds.)", kind: person, position: "year 1 = 1479 BC, so year 23 = 1457 BC; 1504 BC is astronomically possible but excluded by synchronisms", source_read: "yes, pp. 420-422 and the resume", via: "Ancient Egyptian Chronology, 2006"}
      - {who: "unnamed (the speaker's source)", kind: unnamed, position: "1447 BC for the recording or battle", source_read: "no", via: "handoff wording; claims files and videos not opened"}
    next_step: "Read Kitchen's and Beckerath's chronologies, check the astronomical solutions in the book's table III.8.13, and have the lunar date recomputed independently."
    anchor:
      type: interpretive
      description: >
        Read: Breasted 1906 vol. 1 section 67 and notes f and h (OCR lines 4550-4572, stored in sources/extracts/pd-extracts.txt); Krauss 2006 pp. 420-422 and Hornung p. 202 (short fragments quoted only); the Nelson 1913 dates; the Barnhart page. Two independent chronologies (Breasted's Meyer-based scheme and the 2006 Krauss scheme) are read in their own words and differ by 22 years for year 23. Not read: Kitchen, Beckerath, Meyer, Parker, Wente. The Megiddo II table (printed p. 5) uses 1479 BC as the start of Stratum VIII without giving a reason there; that number is not the same thing as year 23 on Breasted's table and is kept apart here.
      sources: [src-breasted-are1, src-hkw-chronology, src-nelson-1913, src-barnhart-web, src-megiddo2-oip62]
      nodes:
        - {node: megiddo-annals-year-23-battle-of-megiddo, verb: qualifies}
        - {node: megiddo-annals-year-23-hkw-1457, verb: qualifies}
        - {node: megiddo-annals-variant-1457, verb: qualifies}
    basis: >
      # V: Breasted vol. 1 section 67 and Krauss pp. 420-422 read in their own words 2026-10-16. The difference of 22 years is arithmetic from two different values of year 1, not a dispute about the signs.
      anchor_checked is 'no' because the two sources differ rather than agree, so the secondary convention (two independent sources agreeing) does not apply; the weight rests on two read chronologies with stated methods.
      The 'contested' state reflects two chronologies with stated methods that give different years; it is not a dispute between equals. Krauss's own text says whether the recorded dates should be emended is moot and uses both possible dates, and the resume says the chronology agrees with Beckerath and Kitchen, who were not read.

  - id: megiddo-hkw-lunar-date-reading
    state: proposed
    statement: >
      Krauss (2006, p. 421) reads the Megiddo date as a lunar date: "regnal year 23, I Shemu 21, day of the feast of lunar day 1, exactly", with the Akhmenu foundation date in year 24 as the second lunar date of Thutmose III. He finds two astronomically workable possibilities: year 1 = 1479 BC (Megiddo on I Shemu 21) or year 1 = 1504 BC (Megiddo on I Shemu 20, which needs the day emended). He excludes 1504 BC because it cannot be reconciled with year 1 of Ramesses II = 1279 BC and year 9 of Amenhotep I = 1506 BC, "thus only 1 Thutmose III = 1479 BC remains". On the year 1504 BC alternative, year 23 would be 1482 BC (arithmetic ours). The chapter's summary says whether the recorded dates ought to be emended is "moot".
    statement_kind: reported
    evidence_class: interpretive
    confidence: moderate
    evidential_weight: 3
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured. Krauss's resume says Beckerath and Kitchen agree on 1479 BC for the accession; that is the book's statement and Kitchen and Beckerath were not read."
    would_change_if: "the astronomical solutions are recomputed independently and differ, or the date line is read differently, or Kitchen's or Beckerath's chronology is read and gives another year 1"
    anchor:
      type: interpretive
      description: >
        Read directly in the Internet Archive OCR of Hornung, Krauss, Warburton (2006): chapter III.8 'Lunar Dates of Thutmose III' (Krauss), pp. 420-422, the summary of chapter II.8 on pp. 478-479 and the resume. A single multi-author reference work, so one witness. The astronomical tables (III.8.12, III.8.13) are garbled in the OCR and were not used; the astronomy was not recomputed. The earlier 1504 BC figure also appears in Breasted vol. 1 note h as Mahler's accession date.
      sources: [src-hkw-chronology, src-breasted-are1]
      nodes: [{node: megiddo-annals-year-23-hkw-1457, verb: supports}]
    basis: >
      # V: read 2026-10-16. States what the chapter says. It leaves out and does not read the astronomy itself; the same chapter notes that Parker, Wente and Beckerath used slightly outdated parameters, and that the date is disputed in detail (see megiddo-battle-day-21-or-20).

  - id: megiddo-battle-day-21-or-20
    state: contested
    statement: >
      Whether the battle day in the date line should be read as I Shemu 21 or emended to I Shemu 20 is disputed in the literature Krauss summarises. Faulkner (JEA 28, 1942) pointed out that Thutmose III reached Megiddo on I Shemu 19, so that the battle "should" have been on the 20th, a day not mentioned in the report; Parker accepted the emendation. Wente argued that Helck showed no emendation is needed; Beckerath accepted Wente's judgment. Parker cited Spalinger to say Helck's argument lacks foundation. Breasted (1906, note to section 429) holds that the army came out onto the plain in the afternoon of the twentieth, camped that night and fought on the morning of the twenty-first.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "Faulkner's article, Helck, Wente, Parker and Spalinger are read in their own words, or the date line signs are read and show 20 or 21"
    disputed_by:
      - {who: "R. O. Faulkner and R. A. Parker", kind: person, position: "emend the battle day to I Shemu 20 because the king reached Megiddo on the 19th", source_read: "no", via: "Krauss 2006, p. 421 (n. 100 cites Parker, Calendars, 73, and Faulkner JEA 28, 1942, 4 and 11)"}
      - {who: "E. F. Wente, W. Helck and J. von Beckerath", kind: person, position: "no emendation needed; day 21 stands", source_read: "no", via: "Krauss 2006, p. 421 (nn. 101-102)"}
      - {who: "J. H. Breasted", kind: person, position: "day 21 stands; the army reached the plain on the afternoon of the 20th and fought on the morning of the 21st", source_read: "yes, note to section 429", via: "Ancient Records II, 1906"}
    next_step: "Read Faulkner's 1942 article (JEA 28, pp. 2-15) and Helck's argument (MDAIK 28, 1972), and read the date lines of Aruna (day 19) and the battle on Sethe's pp. 654-657."
