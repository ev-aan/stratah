      No reading of the date-line signs was made independently in this dig. The numerals and words come from Breasted's translation, from Krauss's and Barnhart's transliterations of Sethe's page IV 657, and from Nelson's translation. The builder viewed Sethe's page (at about 450 dpi) and one wall photograph that shows a column with numeral signs and did not decipher either.
