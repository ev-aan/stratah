    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    absence_anchor: true
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "an Egyptologist reads the date line from Sethe's plate, a squeeze or a wall photograph and states the signs"
    next_step: "Ask an Egyptologist to transliterate Sethe p. 657 lines 84-85 and the date column in the Vygus photographs (Lines_083-089) and compare with the readings of Breasted, Krauss and Barnhart."
    anchor:
      type: search-record
      description: >
        Searched: Sethe's p. 657 (viewed, PDF page 70), the wall photographs Lines_083-089 and Lines_078-098 (viewed), the Barnhart photomontage of lines 1-67 (viewed, which does not reach line 84). No transliteration of the date line by the builder is recorded. The builder's impression that the numeral groups on p. 657 look like 23 and 21 is a count of strokes by an AI and is not used.
