      description: >
        The two plate images were opened and viewed on 2026-10-14 (scan item dli.calcutta.09958, images n34 and n35; sha256 in the manifest). Captions read: Bl. 31 'Karnak. Inschriften. a. vor b. neben der Cella des Philippus', Bl. 32 'Karnak. Inschrift neben der Cella des Philippus'. The hieroglyphs were not transliterated. Sethe (pp. 645-646) names these plates as the earlier publication and says his edition adds to them.
      sources: [src-lepsius-denkmaeler-abth3, src-sethe-urk4-h9-10]
    basis: "Viewed, not read. It does not support any reading."

  - id: megiddo-date-line-signs-not-independently-read
    state: searched_gap
