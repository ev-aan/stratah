subject: megiddo-campaign-1447
title: "Thutmose III at Megiddo: what the Karnak Annals say, when, and what Dead Hidden says they say"
question: "What do the Egyptian records of Thutmose III's Megiddo campaign actually say, and do they show a date of 1447 BC, a gathering of armies against Pharaoh, a link to the Exodus, or a new god Amun-Ra?"
dig_status: open
headline_status: draft
headline: "Annals date Megiddo to Thutmose III's year 23; chronologies read give 1457 or 1479 BC, not 1447"
headline_claim: megiddo-absolute-date-bce
search_summary: >
  The Annals of Thutmose III, carved at Karnak, date the Megiddo battle by regnal year: year 23, first month of the season Shemu, day 21, the day of the feast of the new moon. The readings of that date line found here (Breasted 1906, Nelson 1913 on Sethe's text, Krauss 2006 and Barnhart on Sethe's edition) give those numerals; the signs themselves were not independently read. Year 23 is 1479 BC on Breasted's 1906 chronology and 1457 BC on the 2006 chronology read. 1447 BC is the last year of the reign in Breasted's table, not year 23. The Megiddo account in the translations read does not name the Exodus, Israel or Moses, and Amon-Re is named in texts translated from earlier reigns.
description: >
  What the Karnak Annals of Thutmose III say about the Megiddo campaign, and how that compares with three speaker claims. Read directly: Sethe's hand-copied hieroglyphic edition of the Annals (Urkunden IV, Heft 9/10, 1907; the German headings and notes, with the hieroglyphic pages viewed), the whole Barnhart web page line by line, Nelson's 1913 dissertation (translation and dates), the chronology chapter of Hornung, Krauss and Warburton (2006), the chronological table of the Megiddo II excavation report, and Breasted's Ancient Records of Egypt vols. 1 and 2 (1906), with a full search for the names in dispute. Viewed, not read: Lepsius's plates, the Karnak wall photographs on the Barnhart site. Not opened: Faulkner's 1942 article, Lichtheim's translation, Kitchen, Beckerath, Porter and Moss, Bissing's collation, the Berlin squeezes, the Dead Hidden claims files and videos. No claim here rests on a builder's reading of the hieroglyphs.
divergence_note: >
  The speaker version joins four things: a date (1447 BC), a gathering of "all the armies of the north" by a "vile prince" at Megiddo, an Exodus soon after, and a new god Amun-Ra tied to Moses. What was read supports one part in outline: the king's own account says a coalition under the "enemy of Kadesh" was at Megiddo, though the translations differ in wording and Sethe says Breasted's restorations of the damaged lines often do not fit the gaps. The date is a regnal date. The year BC depends on which chronology is used: Breasted (1906) gives 1479 BC for year 23, the 2006 chronology read gives 1457 BC, and neither gives 1447 BC, which is the last year of the reign in Breasted's table. The number 1479 BC is used for three different things in what was read and must be kept apart: year 23 on Breasted's chronology, year 1 of Thutmose III on the 2006 chronology, and the start of Stratum VIII in the Megiddo II excavation table. The translations read do not mention an Exodus, Israel or Moses in the Megiddo account (an absence claim, provisional). Amon-Re is named in the Megiddo account itself (in Breasted's sections 418 and 425, as Amon-Re; in 430 as Amon) and in texts Breasted attributes to Amenemhet I, Thutmose I and Hatshepsut. None of this is settled from the signs: the hieroglyphs were not independently read here.

assessment:
  question: "What do the Egyptian records of Thutmose III's Megiddo campaign say, and do they show a date of 1447 BC, a gathering of armies against Pharaoh, a link to the Exodus, or a new god Amun-Ra?"
  answer: partly
  headline: "Partly. The Annals record a coalition under Kadesh at Megiddo in year 23; no 1447 BC date, Exodus link or new god was found in the texts read."
  text: >
    The Annals date the battle by regnal year: year 23, first month of Shemu, day 21, the feast of the new moon. Breasted (1906, working from earlier copies) and Krauss (2006, quoting Sethe's 1907 edition) give the same numerals, and Barnhart's and Nelson's readings follow Sethe's copy. Year 23 is 1479 BC on Breasted's chronology and 1457 BC on the chronology of Hornung, Krauss and Warburton; as Krauss reports, Faulkner and Parker would emend the day to 20, while Wente (citing Helck) and Beckerath hold that 21 stands, and Breasted also keeps 21; Faulkner, Parker, Wente, Helck and Beckerath are known here only through Krauss. 1447 BC is the last year of the reign in Breasted's table. In the king's speech as carved, the enemy of Kadesh is at Megiddo with the chiefs of countries as far as Naharin; the translations differ in wording, and Sethe says Breasted's restorations of damaged lines often do not fit the gaps. The Megiddo account in the translations read does not mention the Exodus, Israel or Moses; that is an absence from translations and is held provisional. Amon-Re is named in the Megiddo account and in texts translated from earlier reigns. Limits: no one here read the signs; every reading is a translation or a transliteration of one hand-copied edition; Faulkner, Lichtheim, Kitchen and Beckerath were not opened.
  key_points:
    - "The Annals date the battle by regnal year 23, I Shemu 21; the readings found agree on the numerals, but the signs were not independently read here."
    - "Year 23 is 1479 BC on Breasted's 1906 chronology and 1457 BC on the 2006 chronology read; neither gives 1447 BC, the last year of the reign in Breasted's table."
    - "In the translations read the Megiddo account has no Exodus, Israel or Moses, and Amon-Re is already named; both statements are provisional readings of translations."
  basis: [megiddo-translation-battle-year-23, megiddo-absolute-date-bce, megiddo-hkw-lunar-date-reading, megiddo-battle-day-21-or-20, megiddo-translation-coalition-at-megiddo, megiddo-sethe-edition-statements, megiddo-text-silent-on-exodus-israel-moses, megiddo-sp-amun-ra-new-god]
  would_settle: "A reading of the date-line signs on Sethe's plate IV 657 or the wall by an Egyptologist, a chronology with a stated window for year 23 checked against an independent astronomical computation, and a hieroglyphic reading of the name lists and the account for any name the speaker links to the Exodus."

claims:

  # ------------------------- WHAT THE EDITION AND THE TEXT SAY -------------------------

  - id: megiddo-sethe-edition-statements
    state: established
    statement: >
      Sethe's 1907 edition of the Annals (Urkunden IV, p. 646) says that he collated the text against the original in 1905 and against the Berlin squeezes numbers 468 and 469, which, he says, often show more than is now preserved (our translation of his German). It also says that the restorations adopted by Maspero, Brugsch and Breasted (Ancient Records II, section 407 ff.) do not take the size of the gaps into account exactly ("nicht genau") and so prove wrong in very many cases ("in sehr vielen Fällen als unrichtig"), and that his own restorations are fitted to the measured gap using the space each sign takes elsewhere in the inscription. This claim is about what the edition says of itself, not about whether Sethe or Breasted is right.
    statement_kind: reported
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: null
    adoption_note: "Not measured: no source read counts how widely Sethe's criticism of the earlier restorations is known or followed."
    would_change_if: "a second reading of the handwriting on p. 646 differs from the builder's transcription, or Sethe's criticism is shown by a collation of the wall or squeezes to be wrong for the lines used here"
    anchor:
      type: primary_text
      description: >
        Sethe, Urkunden IV, Heft 9/10 (1907), printed p. 646, lines 1-18, and p. 645 (heading and list of earlier publications), read directly in the German handwriting from the page images of the Internet Archive item urkundenderdyna00helcgoog (PDF page 59 and 58); transcribed in sources/extracts/sethe-urk4-german-text-transcribed.txt. The hieroglyphic lines on the pages were viewed, not transliterated.
      sources: [src-sethe-urk4-h9-10, src-breasted-are2]
    basis: >
      # V: the German text was read directly from the scan on 2026-10-16, and Breasted's volume was opened to confirm that the restorations Sethe names are bracketed in sections 407 ff. (for example section 420, where "[the chief]" and "[all]" are in brackets and note e says the end of the speech is Maspero's restoration). Breasted's volume came out in 1906, before Sethe's Heft of 1907, which Nelson (1913) also says.
      The claim is that the edition says this. It does not decide which restoration is right; the scan's rights status is unstated and no image is stored.

  - id: megiddo-sethe-edition-covers-year-40
    state: established
    statement: >
      Sethe's heading to the piece of the Annals he calls Stück I (p. 645) says it covers "Jahr 22-24 und Jahr 40 seiner Regierung" (years 22 to 24 and year 40 of the reign) on the north wall of the eastern Annals hall, with lines 1-67 below the scenes of the temple gifts, lines 68-82 below the harem women, and line 83 onward running the full height of the wall. The wall text therefore includes an entry for year 40 as well as the year-23 battle. No source read gives the date on which the Annals were carved.
    statement_kind: reported
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "a reading of the wall or of Urk. IV p. 668 (the year 40 entry) shows the year 40 piece is on a different wall or was added later, or a source dating the carving is found"
    anchor:
      type: primary_text
      description: >
        Sethe, Urkunden IV, Heft 9/10, printed p. 645, lines 7-15 (heading), read directly in the German handwriting (PDF page 58); also the section headings on pp. 647 ('2. Jahr 22-23. Erster Feldzug'), 655 ('h. Der König bezieht ein Lager im Süden von Megiddo') and 657 ('i. Die Schlacht bei Megiddo'). Transcribed in sources/extracts/sethe-urk4-german-text-transcribed.txt.
      sources: [src-sethe-urk4-h9-10]
    basis: >
      # V: read directly 2026-10-16. The headings are the editor's, not the ancient scribe's. The year-40 section itself (p. 668) was not opened. Whether the carving of the wall happened before or after year 40 is not stated in any source read.

  - id: megiddo-translation-battle-year-23
    state: proposed
    statement: >
      The readings of the Annals' battle account found here give the date as year 23, first month of the season Shemu (the third season, the ninth month in Breasted's count), day 21, the day of the feast of the new moon, after a march that left the frontier at Tharu in year 22 (fourth month of Peret, day 25). Breasted (1906, section 430): "Year 23, first (month) of the third season (ninth month), on the twenty-first day, the day of the feast of the new moon", followed by "corresponding to the royal coronation" (the OCR shows editorial marks around these words that were not resolved). Krauss (2006, p. 421), transliterating Urk. IV 657, ends the line differently, with the words for "exactly": "day of the feast of lunar day 1, exactly". The king and army then defeat the enemy, who "fled headlong to Megiddo" and were hauled up into the city by their clothing.
    statement_kind: reported
    evidence_class: interpretive
    confidence: moderate
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: null
    adoption_note: "Not measured: no source read counts how widely the campaign and its date are described."
    would_change_if: >
      the signs of the date line (Sethe's plate IV 657, the Berlin squeezes, a wall photograph at full resolution) are read by an Egyptologist and give a different year, season, month or day, or the closing words of the date line are shown to read differently from either rendering
    anchor:
      type: interpretive
      description: >
        Two witnesses that are independent of each other: Breasted 1906 vol. 2, sections 415, 417, 425, 430-431 (a translation made from the Lepsius plates and earlier copies, before Sethe's edition appeared) and Krauss 2006 (Hornung, Krauss, Warburton, p. 421, and Hornung p. 202, working from Sethe's Urk. IV, which Sethe collated against the wall in 1905). Barnhart's transliteration and Nelson's translation follow Sethe's text and Breasted's help and are counted as one reading with Sethe's copy, not as further witnesses. Sethe's p. 657 was viewed (heading 'i. Die Schlacht bei Megiddo' read) and the date-line signs on it looked consistent with the numerals 23 and 21, but that is the builder's count of strokes and is not used as an anchor. The two renderings of the end of the line differ (Breasted: coronation, uncertain; Krauss and Barnhart: 'exactly' the new moon).
      sources: [src-breasted-are2, src-hkw-chronology, src-barnhart-web, src-nelson-1913, src-sethe-urk4-h9-10]
      nodes: [{node: megiddo-annals-year-23-battle-of-megiddo, verb: supports}]
    basis: >
      # V: translation passages read 2026-10-14 and 2026-10-16 (Breasted sections 415, 417, 425, 430); Krauss and Barnhart read in full for the date line. Both readers agree on the numerals 22, 23, I Shemu and 21. Breasted's note a to section 415 (the year-22 date at Tharu, 'twenty-fifth' day) says the day is lacking in Lepsius and Brugsch and is preserved by Champollion's early copy; this fits Sethe's own p. 647 note 'Datum nach Champ.' and Hornung's citation of that date at Urk. IV 647,12. Breasted's note to section 417 (the Gaza date) is a different one: Maspero has 'third day', Brugsch 'fourth', and the Karnak table of feasts agrees with fourth. So the early copies differ about the Gaza day and lack the Tharu day.
      A reading of translations and transliterations of copies, not of the signs. Secondary is used here because two independent readers agree on the numerals; the same convention is applied to every claim in this file.

  - id: megiddo-translation-coalition-at-megiddo
    state: proposed
    statement: >
      In the king's council speech as carved (Annals lines 19-25), the enemy at Megiddo is led by the "enemy of Kadesh", who has gathered to himself the rulers of countries as far as Naharin, consisting of the Kharu and the Kode, with their horses and troops, and who says he will fight the king at Megiddo. The readings differ. Breasted 1906 (section 420): "That [wretched] enemy, [the chief] of Kadesh, has come and entered into Megiddo ... He has gathered to himself the chiefs of [all] the countries [which are] on the water of Egypt, and as far as Naharin", with note b "An idiom for dependent upon or subject to". Nelson 1913: "chiefs of [all] the countries [which were] subject to Egypt as far as Naharin". Barnhart 2015: "that wretched enemy of Kadesh ... He assembled those princes of every foreign land loyal to Egypt together and (those) from Naharin". Breasted's note e says the end of the speech is Maspero's restoration, and Sethe (p. 646) says restorations of this kind do not take the gap size into account exactly and prove wrong in very many cases. For balance, Nelson 1913 (note 43), on the next passage (the officers' reply, lines 27-28, Breasted section 421), says Breasted's restoration "would seem to fill the lacuna as well as Sethe's" as far as the hieroglyphics are concerned, though it would not agree with the situation at the mouth of the pass; so the two editors' restorations are compared by a third reader there, not settled.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: >
      the signs of Sethe's p. 649 (lines 19-25) or the wall read by an Egyptologist show different wording, in particular for the title of the Kadesh leader, the word rendered 'all', and the phrase rendered 'on the water of Egypt', or an independent record (Canaanite, Hittite, or excavated at Megiddo) is read that confirms or contradicts the gathering
    anchor:
      type: interpretive
      description: >
        Read: Breasted 1906 vol. 2, section 420 with notes b and e, and sections 408 and 416; Nelson 1913 translation of lines 19-28 (OCR lines 1015-1030, stored in sources/extracts/pd-extracts.txt); Barnhart's translation of lines 19-24 with its notes. These are not independent: Nelson says he follows Sethe's text but sometimes adopts Breasted's words, and Barnhart says he consulted Breasted, Faulkner and Lichtheim. Sethe's p. 649 was viewed and the German footnotes read; the signs were not read.
      sources: [src-breasted-are2, src-nelson-1913, src-barnhart-web, src-sethe-urk4-h9-10]
    basis: >
      # V: the three renderings were compared on 2026-10-16. The only witness to the gathering read is the Egyptian king's own account. Brackets in Breasted mark restoration; Barnhart says he cannot make out signs under Sethe's hatching in places.
      The translators agree on the outline and differ on the Kadesh leader's title (Breasted restores 'chief' in brackets; Barnhart's line has none), on 'all' (bracketed by Breasted) and on how the phrase about Egypt is rendered. Breasted's own summary (section 408) says the king overthrows 'a coalition of practically all Syria at Megiddo, headed by the king of Kadesh'; that is his reading, not a second source.

  - id: megiddo-annals-location-and-edition-state
    state: proposed
    statement: >
      The descriptions read agree that the Annals are on a wall at Karnak, in a chamber of the temple of Amon built by Thutmose III, and that the upper and lower parts of the lines are damaged. Breasted (1906, section 391 and note) puts the Annals on the inside of the walls of the corridor around the granite sanctuary, north wall and west wall, in a text of 223 lines by his count (Mariette gave a different total, as Breasted's note quotes). Sethe's heading (p. 645) says the piece covering the first campaign is on the north wall of the eastern Annals hall. Barnhart's page says the account is about 108 columns on the north wall behind Pylon 6. A photomontage of lines 1-67 on Barnhart's site shows broken upper and lower edges. Breasted (section 391 note) and Sethe (p. 646) both say earlier copies were incomplete.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "current Karnak documentation or a museum or excavation record gives a different location, preservation state or line count"
    anchor:
      type: interpretive
      description: >
        Read: Breasted 1906 vol. 2, section 391 and its note (OCR lines 10559-10575, stored in sources/extracts/pd-extracts.txt); Sethe's heading and notes, pp. 645-647 (German text read directly); the Barnhart page's introduction. Viewed: the Barnhart photomontage of lines 1-67 and two wall photographs (Lines_083-089 and Lines_078-098). The wall itself and any modern Karnak documentation were not seen. The line counts differ by source (223 for the whole Annals in Breasted, 110 lines on the north wall in Mariette as Breasted quotes him, lines to 110 in Sethe's Stück I, about 108 columns in Barnhart) and are not reconciled here.
      sources: [src-breasted-are2, src-sethe-urk4-h9-10, src-barnhart-web, src-barnhart-photomontage, src-barnhart-wall-photos]
    basis: >
      # V: read and viewed 2026-10-16. Photographs are third-party with no stated licence and unchecked authenticity, so they are not an anchor. No inventory or find record for the wall was read.

  - id: megiddo-lepsius-plates-viewed
    state: searched_gap
    statement: >
      That the signs on Lepsius, Denkmaeler Abth. III Bl. 31 b and 32 (the plates Breasted and Sethe cite for the Annals) carry the date and speeches that the translations print has not been checked; Sethe says the Lepsius copy has gaps that the wall and the Berlin squeezes fill.
    statement_kind: search_result
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "an Egyptologist transliterates Lepsius Bl. 31 b and 32 and Sethe's plates and the date line matches or differs"
    next_step: "Have the date line (year 23, I Shemu, day 21) and the council speech transliterated from Lepsius Bl. 31 b and 32 and from Sethe p. 649 and p. 657, and compared with a wall photograph at full resolution."
    anchor:
