      CORRECTION to sources/extracts/pd-extracts.txt after a re-check (L-13 not edited). (1) The stored Nelson note 43 stopped after 'or the moun-' and left out the sentence the claim quotes. The extract now runs over OCR lines 1040-1052, so it includes Nelson's statement that Breasted's restoration 'would seem to fill the lacuna as well as Sethe's' as far as the hieroglyphics are concerned, and the note's end. The header range was fixed. (2) The file's header comment and the header of the Breasted notes block said an Amon was 'wrongly restored in section 423'; they now say section 423 or 424 (placement uncertain), as the claim already does (L-13(h)). (3) The sha256 of the regenerated extract file is recorded in a comment at the top of sources/MANIFEST.yaml (2873c01d...a57f).
