    entry: >
      ROUND 2 OPENED after the independent review of PR #32 (REDO verdict). WHAT WAS OPENED AND READ THIS ROUND.
      (1) K. Sethe, Urkunden der 18. Dynastie, Heft 9/10 (1907), Internet Archive item urkundenderdyna00helcgoog (Harvard copy, Google scan; PDF sha256 4561c68c...62f4). Printed pp. 644-650 and 655-658 were opened as page images; the German headings and notes on pp. 645, 646, 647, 655 and 657 were READ and transcribed (sources/extracts/sethe-urk4-german-text-transcribed.txt); the hieroglyphic lines were VIEWED and not transliterated. The earlier link on Barnhart's page to a Sethe PDF (handle.net) returns 404; this scan is a different copy found by searching the Internet Archive.
      (2) The whole Barnhart page, line by line (html sha256 9880b546...f04d), including every numbered line 1-103 with notes and the bibliography.
      (3) H. H. Nelson, The Battle of Megiddo (1913), OCR (sha256 fa99a0a7...c37b): preface, translation of lines 19-28, dates.
      (4) Hornung, Krauss, Warburton (eds.), Ancient Egyptian Chronology (Brill 2006), OCR (sha256 200f0ab8...ce39), through an Internet Archive upload used as an access path only: Hornung p. 202, Krauss chapter III.8 pp. 420-422, summary pp. 478-479, the resume.
      (5) Breasted vols. 1 and 2 re-opened (hashes match the manifest) and searched for the names in dispute (see L-08).
      (6) Megiddo II (OIP 62, 1948), PDF sha256 8321ac16...ec13: the chronological table (printed p. 5) read; the text layer searched; strata chapters not read.
      (7) Wall photographs on the Barnhart site by Mark Vygus: the lines 1-67 photomontage (sha256 313c0745...ffc3) and two column photographs (Lines_083-089, sha256 5bdffc61...5e3e9; Lines_078-098, sha256 b09419d4...328d3) VIEWED; no signs read.
      WHAT WAS BLOCKED OR NOT OPENED. Faulkner, 'The Battle of Megiddo', JEA 28 (1942); Lichtheim, Ancient Egyptian Literature II; Kitchen; Beckerath; Porter and Moss; Bissing's collation; the Berlin squeezes; Griffith's copy of Burton's drawing; Champollion's Notices descriptives; the Lepsius hieroglyphs; the year-40 section of the Annals (Sethe p. 668); the strata chapters of Megiddo II and any later Megiddo volume; the Dead Hidden claims files and videos and the handoff file (not in the repository, so the speaker wording is second-hand). The Wikipedia pages were not opened or used. No paywall or bot check was met or bypassed; the Internet Archive and the Barnhart site answered normally.
      NO CLAIM RESTS ON A BUILDER'S READING OF THE SIGNS. Two claims are set to anchor_checked primary (megiddo-sethe-edition-statements, megiddo-sethe-edition-covers-year-40); each is about what Sethe's printed German text says, read from the page. The builder viewed the date-line page IV 657 and thought the numeral groups looked like 23 and 21; that count is not used as an anchor (see megiddo-date-line-signs-not-independently-read).
  - id: L-08
    date: 2026-10-16
    entry: >
      CORRECTION of round-1 statements (log entries L-02, L-04 and L-06 are not edited; this entry corrects them). Round 1 said the volume-wide OCR of Breasted vol. 2 had no hit for 'Exodus', 'Israel' or 'Moses'. That was wrong for 'Israel'. Full search of the OCR on 2026-10-16 (section numbers are the nearest preceding section marker in the OCR, checked against the printed context).
      Breasted vol. 2: 'Israel' 1 hit, in a note in the Amenhotep III and Merneptah monuments section (section 879 area, OCR line 21576: "the hymn of victory, mentioning Israel: see III, 602 ff."), outside the Megiddo account. 'Hebrew' 7 hits: section 177 (a lexical note), section 437 (two lexical notes, inside the first campaign range 408-443, comparing Egyptian words with Hebrew words), section 583 (a note on the 'Hebrew Negeb', on a later campaign), section 672 (the vizier's office compared with the story of Joseph), section 756 (Breasted's main commentary: Semitic captives at the Amon-temple works, 'precisely what was afterward exacted of the Hebrews'), section 935 (a note, 'Like the Hebrew from Dan to Beersheba'). 'Armageddon' 0, 'Exodus' 0, 'Jacob' 0, 'Canaan' 0, 'Jerusalem' 1 (section 473, Abdkhiba of Jerusalem in a quoted Amarna letter), 'Joseph' 4 (section 672 and Josephus citations). 'Moses' 4 hits, all inside Ahmoses and Thutmoses.
      Breasted vol. 1: 'Israel' 2 hits (section 471, a note citing the 'Israel stela' for a word; section 489, 'the oldest account of pre-Israelitish Palestine'); 'Hebrew' 5 hits (preface, sections 177, 352, 620 'a good Hebrew name', 745); 'Exodus', 'Moses', 'Armageddon' 0.
      Barnhart's page: 'Israel' 1 hit (the modern country, in the page's own sentence); no Hebrew, Exodus, Moses, Jacob, Joseph or Armageddon. Nelson 1913: 'Israel' 0; 'Hebrew' in his own comments (OCR lines 996 and 1621), not in his translation; no Exodus or Armageddon. Hornung, Krauss, Warburton: 'Armageddon' 0, 'Exodus' 0, 'Israel' 18 (chronology of other reigns, not examined), 'Moses' 1 (a bibliography title).
      So the narrower statement stands (the Megiddo account, Breasted sections 406-433, Barnhart's lines 1-103 and Nelson's translation have no Exodus, Israel, Moses or Hebrews); the statement that Breasted vol. 2 as a whole has none was wrong, and the claim megiddo-text-silent-on-exodus-israel-moses now says what was found. Round 1 also said 'Hebrew' occurs only in footnotes; section 756 is Breasted's main commentary, not a line of the Annals, and the claim now says so. The next step round 1 named (read the name lists in a hieroglyphic edition) was NOT done this round (see L-12).
  - id: L-09
    date: 2026-10-16
    entry: >
      CORRECTION and WITHDRAWAL. (a) L-04 item (1) and the round-1 date claim said 'the speaker may be using the reign-end year'. That guessed the speaker's source. It is withdrawn: it was never a finding and carries no weight. What is recorded now is only that 1447 BC is the end of the reign in Breasted's table and year 33 on the 2006 year 1 (arithmetic ours), and that no chronology read gives it for year 23.
      (b) Round 1 reported only Breasted's 'wretched' for the Kadesh leader and treated the speaker's 'vile' as absent from the translations. Barnhart's translation uses 'vile' for the same Egyptian word (Xsy) in the introduction, line 16 and line 87, and 'wretched' in line 19; Breasted and Nelson use 'wretched'. The speaker's word is therefore present in one translation read (see megiddo-sp-word-vile).
      (c) The round-1 text 'the speaker's basis (for example a different meaning of new god)' is withdrawn as speculation; the claim megiddo-sp-amun-ra-new-god now states only the readings found.
      (d) L-05 said 'What each author stood to gain from the results: UNRESEARCHED'. A motive inquiry is not a coverage fact and is withdrawn; no such task is kept. The remark about a Rockefeller connection in L-05 and in the earlier funding claim came from an unread web search and is not relevant to these volumes; it is withdrawn.
      (e) The funding claim megiddo-funders-of-sources is REMOVED from claims.yaml (never published); the facts and open tasks are kept here (L-12). What the sources say about themselves, read directly: Breasted vol. 1 preface says his copying of monuments in European museums was part of a mission for a commission of the four Royal Academies of Germany for an Egyptian Dictionary 'endowed by the German Emperor', and thanks President Harper 'for his interest in this enterprise, and his unfailing support in arranging for my repeated absence in Europe', and the Board of Trustees of the University of Chicago 'for the same privileges'. The Dictionary endowment concerns the museum copying; the preface does not say who paid for the Chicago volumes, and nothing read says sponsorship affected content.
  - id: L-10
    date: 2026-10-16
    entry: >
      CHANGES TO claims.yaml AND THE MANIFEST made in round 2 (the PR is unmerged, so these edit the working draft; round 1 stays in version control). (1) src-dh-claims and src-search-summaries are removed from every anchor.sources; the first is named only in statements, adoption notes and the transmission record, and the second is retired from the manifest as unread snippets. The unread figure '1482' is no longer cited from search summaries; 1482 now appears only as our arithmetic on the 1504 BC alternative that Krauss weighs. (2) Every bundled speaker claim is split into one assertion per claim, in the speaker's wording as given in the handoff (second-hand): the year, the name Armageddon, a record of a battle, an enemy leader who gathered others, 'vile', 'prince', 'all the armies of the north', 'valley of Megiddo', three Exodus wordings and '1400 BC new age', 'new god', 'after the battle', 'god of Moses'. The round-1 ids megiddo-sp-1447-recorded-armageddon, megiddo-sp-vile-prince-gathered-armies, megiddo-sp-exodus-after-battle, megiddo-sp-amun-ra-new-god and megiddo-sp-amun-ra-is-god-of-moses are kept for one assertion each; no id is reused or renumbered. (3) One convention for anchor_checked: secondary only where two independent readers agree (Breasted 1906 and Krauss 2006 for the date numerals, for the existence of a battle record and for the existence of two chronologies); a single translator, a translation by someone who follows an earlier translator, or a copy of one edition is 'no', and the anchor description says so. (4) Adoption weights are 'not measured' (null) wherever no read source counts adoption. (5) No claim rates above 3 for evidential weight. (6) Headline and headline_claim added (draft), assessment added, timeline.yaml added, a proposed taxonomy entry written to PROPOSED_TAXONOMY.yaml (build/taxonomy.yaml is owner-only and not edited). (7) Nodes: new node megiddo-annals-year-23-hkw-1457 (variant); megiddo-annals-variant-1457 revised to rev 2 with a history line. (8) The divergence note no longer says Amon-Re is named 'in the battle account itself' without qualification: Breasted's sections 418 and 425 have Amon-Re, section 430 has Amon, section 425 is partly bracketed and note c at section 423 says an Amon was wrongly restored in one place. (9) Breasted's date-line quotation notes that the OCR shows editorial marks that were not resolved. (10) Short quotation only from copyrighted books (Krauss 2006, Barnhart): the book is cited as the work and the Internet Archive upload only as an access path; nothing copyrighted is stored. Public-domain extracts of Breasted 1906 and Nelson 1913 are stored verbatim with elisions marked in sources/extracts/pd-extracts.txt, with the passages that qualify the text kept.
  - id: L-11
    date: 2026-10-16
    entry: >
      WHAT SETHE'S OWN PAGES SAY, AND WHAT IT DOES TO ROUND 1 (read directly; transcription in sources/extracts). Page 646: Sethe collated the text against the original in 1905 and against Berlin squeezes 468 and 469; he says the restorations of Maspero, Brugsch and Breasted (Ancient Records II section 407 ff.) do not take the gap sizes into account and in very many cases prove wrong, and that his own restorations measure each gap by the space each sign takes elsewhere. Page 645: his Stück I covers years 22-24 and year 40 on the north wall of the eastern Annals hall, lines 1-67, 68-82 and 83 onward. Page 647 note f: 'Datum nach Champ.; jetzt das Ende zerstört' (date after Champollion; the end is now destroyed); which date the note belongs to was not determined by the builder; Breasted's note to section 417 says the day of the Gaza date survives only in Champollion's early copy. EFFECT: the round-1 reliance on Breasted's translation as the main witness is weaker than round 1 said, because Breasted's restored passages (for example the end of the council speech, section 420 note e) are the kind Sethe says often do not fit. The coalition claim now states this. It does not show Sethe is right; the plates were not measured.
  - id: L-12
    date: 2026-10-16
    entry: >
      OPEN RESEARCH TASKS (not claims; nothing here is a finding). (1) Who paid for and controlled the works used: the University of Chicago Press series 'Ancient Records' under William Rainey Harper's editorship (Chicago archive or a Breasted biography); the Lepsius expedition sent by King Friedrich Wilhelm IV of Prussia (a history of the expedition); Sethe's Urkunden series (Hinrichs, Leipzig); the Brill chronology volume's editors and funders; the Barnhart page's author, affiliation and any support (the page's text states none and lists a university and a webmail contact address). Each is a coverage task. (2) Read Faulkner JEA 28 (1942), Lichtheim AEL II, Helck MDAIK 28, Spalinger MDAIK 30 and Wente JNES 34 to get the positions of megiddo-battle-day-21-or-20 in their own words, and a second independent translation. (3) Read the Kitchen and Beckerath chronologies, and have the lunar solutions of Krauss's table III.8.13 recomputed independently (an independent astronomical calculation would be a synthetic cross-check, never an anchor). (4) Ask an Egyptologist to transliterate Sethe's p. 649 (council, lines 19-25) and p. 657 (date line) and the Vygus column photographs, and compare with Breasted, Krauss and Barnhart. (5) Read the Annals' name lists (Sethe pp. 779 ff.; Breasted section 405) in hieroglyphic form with an Egyptologist, for any argued link to biblical names. (6) Read the origin of the name Armageddon and treatments of the Exodus date, as named sourced positions, before weighing any speaker claim on them. (7) Read the Megiddo II strata chapters (IX and VIII) and later Megiddo volumes on how the Late Bronze strata are dated. (8) Get the Dead Hidden claims files or transcripts to replace the second-hand wording. (9) Ask who holds the Karnak wall documentation (Porter and Moss, Griffith Institute) and read it.
  - id: L-13
    date: 2026-10-16
    entry: >
      CORRECTION of L-11 (not edited; this entry corrects it), of the claim megiddo-translation-battle-year-23, of the manifest test for src-breasted-are2 and of the header of sources/extracts/pd-extracts.txt. They said Breasted's note 'the day is lacking in Lepsius and Brugsch, but is preserved by Champollion's early copy' belongs to the Gaza date in section 417. In the OCR it is note a to 'twenty-fifth' in section 415 (Tharu, year 22, fourth month of the second season, day 25). The note to section 417 (Gaza) is Maspero's 'third day' against Brugsch's 'fourth', with the Karnak table of feasts agreeing with fourth. The Tharu note fits Sethe's own p. 647 note f ('Datum nach Champ.') and Hornung's citation of the year-22 date at Urk. IV 647,12. L-11 also said the builder could not tell which date Sethe's note f belongs to; that is unchanged, but the Breasted note it was paired with was the wrong one. Claim, manifest and extract header are corrected.
      Further corrections from the independent review of commit 15b40a3. (a) megiddo-sethe-edition-statements now keeps Sethe's word 'genau' ('berücksichtigen die Größe der Lücken nicht genau', 'in sehr vielen Fällen als unrichtig'); L-11 and L-10 paraphrased it as 'often' and 'do not take the gap sizes into account'; the claim states his wording. (b) Nelson 1913 note 43 (OCR lines 1040-1048, stored in the extracts) says Breasted's restoration of the officers' reply (lines 27-28, section 421) 'would seem to fill the lacuna as well as Sethe's' as far as the hieroglyphics are concerned; it is now set beside Sethe's remark in megiddo-translation-coalition-at-megiddo. (c) The assessment basis now lists every claim its text relies on, and its text names both sides of the day-20 or day-21 question (Faulkner and Parker for 20; Wente citing Helck, and Beckerath, for 21; Breasted also keeps 21), all but Breasted known only through Krauss. (d) Timeline event m4 no longer says the speaker's 1447 'matches' the end of the reign; it says only that 1447 BCE is the end of the reign in Breasted's table (L-09(a) already withdrew the guess about the speaker's source). (e) megiddo-sp-name-armageddon now says the search covered Breasted, Nelson, Hornung-Krauss-Warburton and Barnhart, that Sethe's German scan is listed as a source but was NOT searched for the name, and that the Megiddo II text layer has 'Armageddon' only in a bibliography title (P. L. O. Guy, 'New light from Armageddon'); the absence flag and provisional cap stay. (f) megiddo-sp-title-prince now records Breasted's note a to section 420 ('The king of Kadesh') and Barnhart's introduction ('led by the king of Kadesh') as glosses by the editor and the page author, not translations of the line. (g) megiddo-absolute-date-bce is relabelled anchor_checked 'no' (L-10(3) said secondary): its two sources differ rather than agree, and the claim says so. (h) The description field no longer narrates the review. megiddo-sp-all-armies-of-the-north is marked absence_anchor true. L-10(8) and the Amon-Re claim said a note at 'section 423' says an Amon was 'wrongly restored'; in the OCR that note is printed after the start of section 424, so it may belong to 423 or 424 (placement uncertain), and the claim now says so. (i) Node megiddo-annals-variant-1457 is rev 3: the mention of the page's contact addresses is removed from the node text; the manifest still records that the page lists contact details.
