      DIG OPENED from a handoff (megiddo-campaign-1447.yaml, written by another agent). Its object identification ("Annals of Thutmose III Karnak Megiddo; Urk. IV; Lichtheim AEL II; Griffith Topographical Bibliography") was an unverified guess.
      Three speaker claims (dh-MNeiRTK5MmE-48, dh-wbdnR9qs9MU-60, dh-MvDtwF6S2C4-12) are kept in the speaker's wording as given in the handoff and split into separate claims: date, recording, gathering of armies, Exodus, new god Amun-Ra, Amun-Ra as the god of Moses. No headline (headline_status draft).
