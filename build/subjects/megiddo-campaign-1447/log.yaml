  - id: L-04
    date: 2026-10-14
    entry: >
      FINDINGS ON THE SPEAKER CLAIMS (all at translation level; none from the signs). (1) 1447 BC: Breasted 1906 gives 1447 BC as the END of Thutmose III's reign (17 March 1447), not the battle; his scheme puts year 23 at 1479 BC; a personal web page says 1457 BC. The speaker may be using the reign-end year; that is a hypothesis about the wording, carries no weight and is not stated as a finding.
      (2) Gathering at Megiddo: the translation has the king say the chief of Kadesh had gathered chiefs of countries as far as Naharin at Megiddo; this is the Egyptian side's account only, and part of the speech is restored. (3) Exodus: no mention in sections 406-433; the speaker's three wordings differ on whether the battle comes before or after the Exodus. (4) Amun-Ra: the translated Megiddo account already has the king invoke 'my father Amon-Re'; an earlier translation (Twelfth Dynasty, Amenemhet I) has Amon-Re too. (5) The word 'Armageddon' does not occur in vol. 2. Nothing is called refuted because only translations were read.
  - id: L-05
    date: 2026-10-14
    entry: >
      WHO FUNDED AND CONTROLLED THE SOURCES (traced as far as read). Breasted: his preface says his copying of monuments in European museums was part of a mission for a commission of four German Royal Academies (Berlin, Leipzig, Goettingen, Munich) for an Egyptian Dictionary 'endowed by the German Emperor'; the Chicago volumes are in a series 'under the general editorship of William Rainey Harper' published by the University of Chicago Press. Who paid for the Chicago volumes: UNRESEARCHED (one web search found nothing; the Rockefeller connection found belongs to the later Oriental Institute, not to these volumes).
      Lepsius: the scan's catalogued title says the expedition was sent by King Friedrich Wilhelm IV of Prussia (1842-1845); its financial control: UNRESEARCHED. Barnhart: the page states no funding or affiliation; the author is UNRESEARCHED. Dead Hidden: speaker's source and funding unknown.
      What each author stood to gain from the results: UNRESEARCHED.
  - id: L-06
    date: 2026-10-14
    entry: >
      WHERE THE FACTS END, AND WHAT STAYS OPEN. Known only through translations: the regnal date, the gathering and the king's account. Not known here: the wording of the signs, the absolute year BC (1479, 1457 and 1447 each appear; the contested claim keeps them side by side with named holders), when the Annals were carved, whether any outside source (Canaanite, Hittite, excavated Megiddo) confirms the gathering, and whether any Exodus tradition is linked to this campaign by anyone with a stated reason. The Exodus question is filed as an open gap, not weighed. Next steps: read Urkunden IV 645ff. with an Egyptologist, compare Lepsius Bl. 31 and 32 and a wall photograph, and read a chronology with stated method.
