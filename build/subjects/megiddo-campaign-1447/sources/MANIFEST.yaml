  - id: src-lepsius-denkmaeler-abth3
    title: "C. R. Lepsius, Denkmaeler aus Aegypten und Aethiopien, Abtheilung III, Blatt 31 and 32 (Berlin: Nicolai, 1849-1859), Karnak inscriptions beside the Cella of Philippus. Scan: Internet Archive item dli.calcutta.09958 (Band 5), images n34 and n35"
    url: https://archive.org/details/dli.calcutta.09958
    document_class: "plate drawings of the wall made by a Prussian expedition (1842-1845); a 19th-century copy, not the wall. Title (as catalogued on the Internet Archive for a companion scan, item denkmaelerausaeg05leps): the expedition was 'von Seiner Majestaet dem koenige von Preussen Friedrich Wilhelm IV ... gesendeten', so the sponsor named in the title is the Prussian crown; its control of the work beyond that: UNRESEARCHED"
    read: "viewed, not read. The two plate images were opened and their printed captions read (Bl. 31: 'Karnak. Inschriften. a. vor b. neben der Cella des Philippus'; Bl. 32: 'Karnak. Inschrift neben der Cella des Philippus'). The hieroglyphic lines were NOT transliterated or compared with any translation."
    authenticity:
      status: authenticated
      strength: weak
      provenance: "Digital Library of India scan on the Internet Archive; scan sponsor and rights status not given in the item metadata (rights unverified, so no image is stored in the repository). The plate numbers Bl. 31 and 32 and their subject match Breasted's citation of 'Lepsius, Denkmaeler III, 31 b and 32' for the Annals (src-breasted-are2 section 406)."
      tests:
        - "Plate captions say Karnak, beside the Cella of Philippus; Breasted's footnote to section 391 says the Annals walls surround the granite sanctuary that Philip Arrhidaeus inserted (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Signs not read", "Not compared with the wall or with Urkunden IV or Bissing's collation", "Breasted says Lepsius's text of the Annals is not fully accurate (section 391 note: none of the editions is accurate except Bissing)"]
      next_step: "An Egyptologist reads Bl. 31 b and Bl. 32 and the date line; compare with Urkunden IV and photographs of the wall."
      checked: 2026-10-14
      sha256: "3e196da5e1beddcb0e9106c668f075f2dace302275fb214f556153b9fd584f3f (n34.jpg, Bl. 31) and ddcd5f19a8757eaed4ca043da064de825ea1e713d38d9bf2cd19b129e20c88f0 (n35.jpg, Bl. 32), files downloaded to the session scratch area only"
      copy_of: "Lepsius, Denkmaeler Abth. III Bl. 31, 32"
      compared_with_holder_copy: "no"
    notes: "Not stored. Cite by URL only until the licence of this scan is confirmed."

