  - id: src-barnhart-web
    title: "Rhio H. Barnhart, The Battle and Siege of Megiddo: Transliteration, translation and some notes (personal web page, rhbarnhart.net), lines 1-103 of the Annals, from Sethe Urk. IV 647-667"
    url: https://www.rhbarnhart.net/The_Battle_of_Megiddo.html
    document_class: "interpretive: a personal web page with the author's own transliteration and translation of Sethe's hand-copied text, written for a hieroglyph study group (the page says it was started 20 April 2014 and completed 11 March 2015). Copyright status not stated; only short fragments are quoted; nothing is stored."
    read: "yes, the whole page was fetched directly and read line by line on 2026-10-16 (html sha256 9880b54624f43f47f1d36a019c44cfacbc6215b9e2c29dcec53776420d28f04d): introduction, every numbered line 1-103 with its notes, and the bibliography. This replaces the earlier 'fetched and summarised' entry."
    authenticity:
      status: authenticated
      strength: weak
      provenance: "Fetched from the author's own site. The page names the author (Rhio H. Barnhart), lists two contact addresses (one at ucdavis.edu, one at a webmail domain) and states no affiliation, role or funding in its text. Its source text is Sethe's hand-copied text (pp. 647-667), which is why it is a derived reading of the same copy and not an independent witness to the wall. Its bibliography lists Breasted 1906, Brugsch, Budge, Faulkner (a dictionary and JEA 28, 1942), Gardiner, Hoch, Lichtheim (2006), Nelson, Sethe and Vygus; the notes say Faulkner, Lichtheim and Breasted were consulted."
      tests:
        - "The numerals and words of the battle date line (year 23, first month of Shemu, day 21, feast of the new moon, 'exactly') agree with the transliteration in Krauss (src-hkw-chronology) and the numerals agree with Breasted's translation of the same line (could have failed)"
        - "The year-22 date (month 4 of Peret, day 25), Gaza (I Shemu 4) and Yehem (I Shemu 16) lines agree with the dates Hornung gives from Urk. IV 647,12, 648,9 and 649,3 (could have failed)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps: ["Derived from Sethe's copy, so it adds no second reading of the wall", "The author says some signs under Sethe's hatching cannot be made out and that some words are uncertain", "Author's training and affiliation not stated in the page text; the page says it is a study-group exercise"]
      next_step: "Compare the transliteration with Sethe's plates, sign by sign, with an Egyptologist."
      checked: 2026-10-16
      sha256: "9880b54624f43f47f1d36a019c44cfacbc6215b9e2c29dcec53776420d28f04d (megiddo.html)"
      copy_of: "none (original web page)"
      compared_with_holder_copy: "not_applicable"
    notes: "The page says 'The battle and siege of Megiddo took place, according to current scholarly calculations, in 1457 BC' and names no chronology; its own sentence 'the city of Megiddo in Israel' uses Israel as the modern country."

