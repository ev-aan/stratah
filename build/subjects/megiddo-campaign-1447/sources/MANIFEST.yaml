not_accepted_as_anchors:
  - "Wikipedia: orientation only, and not used"
  - "Search-engine summaries and snippets: leads, not reads (the earlier entry for them was retired from this list; no claim cites it)"
  - "The Dead Hidden videos and the handoff wording"
  - "A translation or a web copy of a book as a witness to the wall: a claim that needs the object or its images"
