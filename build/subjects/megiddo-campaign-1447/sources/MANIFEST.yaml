# Sources for the megiddo-campaign-1447 dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored in the repository; sources are cited by URL. Tests were run in this session (2026-10-14), which is not an independent review.
# Books, translations and web pages are claims, not primary data. The only primary-adjacent item looked at is the 1840s Lepsius plate drawing of the
# Annals (a 19th-century copy of the wall, not the wall). The signs were NOT transliterated, so no claim here rests on a reading of the hieroglyphs.
retrieved: 2026-10-14
sources:

  - id: src-breasted-are2
    title: "J. H. Breasted, Ancient Records of Egypt vol. 2, The Eighteenth Dynasty (Chicago: University of Chicago Press, 1906), sections 391-433 (the Annals, first campaign), 755-756"
    url: https://archive.org/details/ancientrecordsof02brea
    document_class: "interpretive: translation with commentary. A claim, not primary data. Author: James Henry Breasted. Publisher: University of Chicago Press, series 'Ancient Records under the general editorship of William Rainey Harper' (title page, read). Funders of the volume and of the series: UNRESEARCHED"
    read: yes, directly (Internet Archive OCR text from the Brigham Young University copy, sha256 cfd690f1a1858e162bf9c67969f02f2e963fc6a71271cf3e481d421621e7eb11; sections 391-433, 755-756 and the table of contents)
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Item ancientrecordsof02brea on the Internet Archive, contributor Harold B. Lee Library, sponsor Brigham Young University (item metadata). Title page and copyright page in the OCR say Volume II, University of Chicago Press, published March 1906. Not compared with a holder copy."
      tests:
        - "Title page, volume number, publisher and 'Published March 1906' read in the OCR and agree with the Internet Archive metadata (could have failed)"
        - "Breasted's citations of the Annals text to Lepsius, Denkmaeler III, 31 b and 32 (section 406) agree with the captions of the plates viewed in src-lepsius-denkmaeler-abth3 (Bl. 31 and Bl. 32 show Karnak inscriptions beside the Cella of Philippus) (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["OCR only; page images not compared (OCR garbles the calendar table at section 409)", "The translation was not checked against the signs", "Breasted says the complete text had never been edited together and that its upper parts are lost (section 391 note)"]
      next_step: "Read the hieroglyphic text (Urkunden IV 645ff., or Bissing's collation named by Breasted) with an Egyptologist and compare lines 1-67 and 67-100 of the battle account."
      checked: 2026-10-14
    notes: "Breasted's own preface (vol. 1) says his copying for the Berlin Dictionary was done for a commission of the four Royal Academies of Germany, the Dictionary being 'endowed by the German Emperor'. It does not say who paid for the Chicago volumes."

