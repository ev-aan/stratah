  - id: cvc-term-first-use
    state: established
    statement_kind: reported
    statement: >
      The earliest document we read that uses "turbo cancer" about COVID-19 vaccines is Etana Hecht's
      Substack post "Turbo-Cancer" of 4 August 2022, a summary of an interview with the Swedish
      pathologist Ute Kruger; two earlier write-ups of the same interview (27 and 28 July 2022) say
      "aggressive and unusual cancers" and not "turbo".
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3   # of 5
    anchor_checked: primary   # via Wayback copies
    adoption_weight: 2   # of 5
    adoption_note: "Republished by Global Research on 8 Aug 2022. Reach and republication are adoption."
    would_change_if: "an earlier document using the phrase about COVID-19 vaccines is found (cvc-sq-term-origin-earlier)"
    anchor:
      type: the-documents-themselves
      description: >
        Hecht (Wayback copy of etana.substack.com/p/turbo-cancer): "Dr. Kruger initially thought that
        these turbo cancers, as she calls them"; she writes that she "hate[s] the title" and that
        Kruger's testimony is "by nature anecdotal". Global Research republication, metadata 8 Aug
        2022. RAIR Foundation (27 Jul 2022) and myMedicalFreedom (28 Jul 2022) text-searched: no "turbo".
        Later amplification: DailyClout Report 61 (10 Mar 2023) titled with "Turbo Cancers". Secondary:
        Gorski (SBM, 19 Dec 2022) says he could not find who coined the term and cites an ar15.com comment
        of 30 Nov 2020 that we could not open. Whether Kruger herself used the term in the interview video
        is not verified (video not watched).
      accessible: true
      sources: [src-hecht-turbo-2022, src-globalresearch-2022, src-rair-kruger-2022, src-mymedfreedom-kruger-2022, src-dailyclout-61, src-sbm-turbo-2022]
    basis: >
      "Earliest we read" is a statement about our search, not a finding of who coined the term.
      It is the origin of the word, not evidence for the claim.

