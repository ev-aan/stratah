rounds:
- round: 1
  reviewed_on: 2026-10-06
  head: 3e2bb7a
  requests:
  - id: R1-1
    target: cvc-italy-cohort-lag; assessment.lean.because; short_answer.except (cvc-cancer-incidence-higher-after-vaccination).scale
    severity: blocking
    finding: >
      The surface text overstates the Pescara 365-day sensitivity run. lean.because says the cohort
      "reverses at a 12-month lag" and the short-answer scale says "the association is gone at a
      12-month lag for at least one dose". The paper says the one-dose association was "not
      significant anymore" and the three-dose HR was 0.90 (0.83 to 0.98), but also that at 365 days
      "breast and bladder cancer hospitalizations maintained their positive association with >=1
      dose". The claim cvc-italy-cohort-lag omits this, and only tests.yaml mentions it. A reader is
      told the Pescara signal disappears with a lag when part of it does not. Fix: say "not
      significant overall for at least one dose, below 1 for three or more doses; breast and bladder
      stayed raised" in the claim, the lean and the scale line; do not use "reverses" or "gone" for
      the one-dose result.
    evidence: 'Acuti Martellucci et al., EXCLI J 2025;24:690 (Europe PMC PMC12381369), Results, "Cancer hospitalizations by site": "Importantly, when a minimum time of 365 days was set, while breast and bladder cancer hospitalizations maintained their positive association with >=1 dose, the individuals who received >=3 doses showed a significantly lower likelihood of hospitalization for lung or prostate cancer (Table S4)." claims.yaml lines 68, 155, 689-735; tests.yaml line 49.'
  - id: R1-2
    target: assessment.text; assessment.key_points[2]; short_answer.basis; description; threads.yaml (thread on the Eens report)
    severity: blocking
    finding: >
      The surface lines say the Eens mouse report was "disowned" by its authors ("a disowned mouse
      report circulated widely"; "was disowned in its authors' own addendum"; "a disowned case
      report"). The addendum disowns the term "turbo cancer" and the causal reading, not the report:
      the paper is not retracted and the authors keep it, as cvc-eens-mouse-case-report correctly
      says. Readers of the key point will think the authors withdrew their observation. Fix: say the
      authors rejected the "turbo cancer" reading in an addendum (for example "a mouse case report
      whose authors rejected the 'turbo cancer' reading"); threads.yaml line 23 ("its authors disown
      the term") is accurate and can stay.
    evidence: 'Eens et al. addendum (Europe PMC PMC10622962, 20 Oct 2023): "we wish to unequivocally disassociate ourselves from this term. In our case report, there is not a single reference to a condition called ''turbo cancer''"; the paper (PMC10183601) stands with the addendum banner. claims.yaml lines 48, 58, 143, 272.'
  - id: R1-3
    target: assessment.basis (cvc-health-bodies-no-evidence)
    severity: blocking
    finding: >
      assessment.basis lists cvc-health-bodies-no-evidence, the NCI, EMA, ACS and ASCO statements,
      among the claims the answer "leans no" rests on. The claim's own basis says these statements are
      "filed as adoption", and the assessment text says so too. A basis list is the set of claims the
      answer draws weight from (SCHEMA N23; the page folds them under "The full reasoning"), so an
      adoption claim there lets institutional agreement carry weight toward the answer (REVIEW.md C,
      rules 1 and 2). The published vaccines-autism review applied the same test (key point on health
      bodies "is labelled adoption, is not in basis"). Fix: remove cvc-health-bodies-no-evidence from
      assessment.basis; key point 3 may keep naming them, as it labels them adoption.
    evidence: 'claims.yaml line 59 (basis list) against the claim cvc-health-bodies-no-evidence basis ("The statements are filed as adoption"); origin/main build/subjects/vaccines-autism/review.yaml notes, round 4.'
  - id: R1-4
    target: cvc-italy-cohort-lag (anchor description and basis)
    severity: non_blocking
    finding: >
      The anchor says the Malatesta and Manzoli letters "are about mortality, not the cancer outcome",
      and the basis says the critics "are not on the reassurance side". The Malatesta letter does
      address the cancer outcome: it welcomes the hazard ratios for colorectal, breast and bladder
      and adds that "the increase in tumors found by the authors could also be due to factors
      unrelated to actual increases". Reword to say their main argument is about mortality and that
      they also note the cancer excess could be an artefact. Also, src-excli-exchange-2026 is listed
      in this claim's anchor sources but is marked "metadata only" in the manifest; either drop it
      from the anchor or say it was not read.
    evidence: 'Malatesta et al., EXCLI J 2025 (Europe PMC PMC12853024), paragraphs 1-2. MANIFEST src-excli-exchange-2026 read: metadata only.'
  - id: R1-5
    target: search_summary
    severity: non_blocking
    finding: >
      "national registries show no surge" reads as all national registries; the dig read the US and
      Japanese series only (the English registry was blocked). Key point 1 already says "US and
      Japanese registries"; use the same words in search_summary.
    evidence: 'claims.yaml line 12 against cvc-no-registry-surge basis ("the English registry ... and Danish data were not read").'
  - id: R1-6
    target: cvc-no-registry-surge (anchor description)
    severity: non_blocking
    finding: >
      The quoted wording attributed to the 2026 report, "driven by increases in breast cancer among
      women and prostate cancer among men", is not in the PubMed abstract and is presumably from the
      CDC release, which the reviewer could not open. Name the source of the quotation in the
      description so a reader can find it.
    evidence: 'PubMed 42770880 abstract (read in full); SEER statistics page (read).'
  - id: R1-7
    target: build/taxonomy.yaml
    severity: non_blocking
    finding: 'No taxonomy entry for this subject (conformance warning; review_dig check fails). Owner-only path; log L-10 proposes the line. For the owner.'
    evidence: 'python3 build/conformance.py --base origin/main on the merge result; review_dig.py output.'
