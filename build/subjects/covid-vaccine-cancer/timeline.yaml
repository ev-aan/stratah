events:
  - {id: a01, panel: years, lane: research, time: "2020-11-30T12:00:00Z", precision: day, kind: witness, status: single, sources: ["src-sbm-turbo-2022"],
     label: "30 Nov 2020: an ar15.com forum comment reportedly reads 'I can't wait for the turbo cancer'",
     detail: "Reported by Gorski (Science-Based Medicine, 2022); we could not open the page (403, also via Wayback), so the date and wording are unverified. The context is not stated."}
  - {id: a02, panel: years, lane: research, time: "2020-12-10T12:00:00Z", precision: day, kind: data, status: reported, sources: ["src-polack-2020"],
     label: "10 Dec 2020: Polack et al. report the Pfizer-BioNTech trial in NEJM",
     detail: "Our text search of the main text found no cancer outcome; the trial ran about 6 months [abstract and text search]."}
  - {id: a03, panel: years, lane: media, time: "2022-07-27T12:00:00Z", precision: day, kind: media, status: single, sources: ["src-rair-kruger-2022"],
     label: "27 Jul 2022: RAIR Foundation writes up an interview with Ute Kruger: 'aggressive and unusual cancers'",
     detail: "The text has no 'turbo'. The interview video was not watched."}
  - {id: a04, panel: years, lane: media, time: "2022-07-28T12:00:00Z", precision: day, kind: media, status: single, sources: ["src-mymedfreedom-kruger-2022"],
     label: "28 Jul 2022: myMedicalFreedom publishes the same write-up",
     detail: "Text-searched: no 'turbo'."}
  - {id: a05, panel: years, lane: media, time: "2022-08-04T12:00:00Z", precision: day, kind: document, status: single, sources: ["src-hecht-turbo-2022"],
     label: "4 Aug 2022: Etana Hecht's post 'Turbo-Cancer' attributes the term to Kruger",
     detail: "Earliest document we read using the phrase about COVID-19 vaccines (via Wayback); Hecht calls the testimony 'by nature anecdotal'."}
  - {id: a06, panel: years, lane: media, time: "2022-08-08T12:00:00Z", precision: day, kind: document, status: single, sources: ["src-globalresearch-2022"],
     label: "8 Aug 2022: Global Research republishes the post",
     detail: "Page metadata date; the byline line reads 5 Aug 2022."}
  - {id: a07, panel: years, lane: media, time: "2022-11-21T12:00:00Z", precision: day, kind: media, status: single, sources: ["src-leadstories-2022", "src-died-suddenly-film"],
     label: "21 Nov 2022: the film 'Died Suddenly' is posted to Rumble",
     detail: "Our automated transcript has cancer statements at about 22:08 and 25:34 and no 'turbo' (error-prone; a human check is needed)."}
  - {id: a08, panel: years, lane: media, time: "2022-12-19T12:00:00Z", precision: day, kind: analysis, status: single, sources: ["src-sbm-turbo-2022"],
     label: "19 Dec 2022: David Gorski rebuts the claim in Science-Based Medicine",
     detail: "He says he could not find who coined the term and that use took off in summer and fall 2022 [Wayback copy]."}
  - {id: a09, panel: years, lane: media, time: "2023-03-10T12:00:00Z", precision: day, kind: media, status: single, sources: ["src-dailyclout-61"],
     label: "10 Mar 2023: DailyClout Report 61 carries Kruger's observations under a 'Turbo Cancers' title",
     detail: "Title and date only; the report was not analysed."}
  - {id: a10, panel: years, lane: journals, time: "2023-05-01T12:00:00Z", precision: day, kind: document, status: reported, sources: ["src-eens-2023"], flagged_sources: ["src-eens-2023"],
     label: "1 May 2023: Eens et al. publish a one-mouse lymphoma case report",
     detail: "One of 14 high-dose intravenous mice; 'a demonstration of direct causality remains difficult'. Not retracted."}
  - {id: a11, panel: years, lane: media, time: "2023-08-04T12:00:00Z", precision: day, kind: media, status: single, sources: ["src-makis-epoch-post-2023"],
     label: "4 Aug 2023: William Makis announces an Epoch Times article on 'turbo cancers' in young people",
     detail: "The Epoch Times article (28 Jul 2023) was not opened; excerpts via a Substack repost."}
  - {id: a12, panel: years, lane: media, time: "2023-08-31T12:00:00Z", precision: day, kind: analysis, status: single, sources: ["src-factcheck-2023"],
     label: "31 Aug 2023: FactCheck.org reports that the Eens paper does not show vaccines cause cancer",
     detail: "It quotes a post reading 'SHOCKING: New Study proves Pfizer mRNA induced turbo cancer'."}
  - {id: a13, panel: years, lane: institutions, time: "2023-10-10T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-nci-2023"],
     label: "10 Oct 2023: NCI page stamped updated: 'no evidence that COVID-19 vaccines cause cancer'",
     detail: "Same sentence read into the Senate record on 3 Jun 2026."}
  - {id: a14, panel: years, lane: journals, time: "2023-10-20T12:00:00Z", precision: day, kind: document, status: reported, sources: ["src-eens-addendum-2023"],
     label: "20 Oct 2023: Eens et al. publish an addendum disassociating themselves from 'turbo cancer'",
     detail: "'We wish to unequivocally disassociate ourselves from this term.'"}
  - {id: a15, panel: years, lane: institutions, time: "2023-12-06T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-fl-ladapo-letter-2023"],
     label: "6 Dec 2023: Florida's Ladapo writes to the FDA about DNA integration and oncogenes",
     detail: "The letter asks questions and reports no cancer cases."}
  - {id: a16, panel: years, lane: institutions, time: "2023-12-14T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-fda-marks-2023"],
     label: "14 Dec 2023: FDA's Peter Marks replies: 'nothing to indicate harm to the genome, such as increased rates of cancers'",
     detail: "A position statement based on surveillance; no new analysis."}
  - {id: a17, panel: years, lane: institutions, time: "2024-01-03T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-fl-halt-release-2024"],
     label: "3 Jan 2024: Florida's surgeon general calls for a halt to mRNA COVID-19 vaccine use",
     detail: "A recommendation to providers, not a ban."}
  - {id: a18, panel: years, lane: media, time: "2024-01-04T12:00:00Z", precision: day, kind: media, status: single, sources: ["src-cbs-ladapo-2024"],
     label: "4 Jan 2024: CBS quotes a physician linking the Florida argument to the 'turbo cancer' idea",
     detail: "The link is CBS's and the physician's characterisation."}
  - {id: a19, panel: years, lane: journals, time: "2024-04-08T12:00:00Z", precision: day, kind: document, status: reported, sources: ["src-gibo-2024"], flagged_sources: ["src-gibo-2024"],
     label: "8 Apr 2024: Cureus publishes Gibo et al. on Japanese cancer mortality after the third dose",
     detail: "RETRACTED on 26 Jun 2024. An ecological extrapolation with no individual vaccination status."}
  - {id: a20, panel: years, lane: research, time: "2024-05-03T12:00:00Z", precision: day, kind: data, status: reported, sources: ["src-zhang-2024"],
     label: "3 May 2024: Zhang and El-Deiry report spike lowering p53 activity in two cell lines",
     detail: "Plasmid-expressed spike; authors call it preliminary."}
  - {id: a21, panel: years, lane: journals, time: "2024-06-12T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-gibo-eoc-2024"], flagged_sources: ["src-gibo-2024"],
     label: "12 Jun 2024: Cureus issues an expression of concern on the Gibo paper",
     detail: "Notice text not read (PubMed record only)."}
  - {id: a22, panel: years, lane: journals, time: "2024-06-26T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-gibo-retraction-2024"], flagged_sources: ["src-gibo-2024"],
     label: "26 Jun 2024: Cureus retracts the Gibo paper",
     detail: "The correlation between mortality rates and vaccination status 'cannot be proven with the data presented'; the authors disagree."}
  - {id: a23, panel: years, lane: institutions, time: "2024-09-09T12:00:00Z", precision: day, kind: official, status: reported, sources: ["src-acs-2024"],
     label: "9 Sep 2024: American Cancer Society page revised: 'no information that suggests' vaccines cause cancer",
     detail: "The live page revised 24 Sep 2025 no longer has this section; why is not known."}
  - {id: a24, panel: years, lane: media, time: "2025-01-09T12:00:00Z", precision: day, kind: analysis, status: single, sources: ["src-contagion-2025"],
     label: "9 Jan 2025: Contagion Live reports a vendor count of 1.6 million posts using the term",
     detail: "Nov 2022 to Nov 2024; about 22 billion impressions; vendor data, not audited."}
  - {id: a25, panel: years, lane: research, time: "2025-02-20T12:00:00Z", precision: day, kind: data, status: reported, sources: ["src-msmr-nhl-2025"],
     label: "20 Feb 2025: US military report counts non-Hodgkin lymphoma 2017 to 2023",
     detail: "40, 34, 30, 29, 30, 38, 43 cases; no vaccination analysis."}
  - {id: a26, panel: years, lane: research, time: "2025-05-01T12:00:00Z", precision: month, kind: data, status: reported, sources: ["src-arn-2025"],
     label: "May 2025: Annual Report to the Nation: 2020 incidence dip, 2021 back to prepandemic levels",
     detail: "Incidence 425.6 in 2020 against 461.3 in other years per 100,000."}
  - {id: b01, panel: recent, lane: research, time: "2025-07-01T12:00:00Z", precision: day, kind: analysis, status: disputed, sources: ["src-acuti-martellucci-2025"],
     label: "1 Jul 2025: Pescara cohort: cancer hospital admission hazard ratio 1.23 after one dose",
     detail: "At a 365-day lag the one-dose association is not significant; three or more doses 0.90."}
