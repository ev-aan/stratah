timeline:
  id: covid-vaccine-cancer
  title: "COVID-19 vaccines and cancer: the 'turbo cancer' claim, the tests and the institutions (2020 to 2026)"
  as_of: "2026-10-06"
  note: >
    Times are UTC; most events are known to the day, month or year only. Publication dates are issue or
    online dates as given in the cited record. Events marked "single" rest on one source; "disputed" marks a
    finding whose meaning is contested; media and institution events are adoption, not evidence. Panel B
    enlarges June 2025 to October 2026.
panels:
  - id: years
    title: "Panel A: October 2020 to May 2025 (one tick per year)"
    start: "2020-10-01T00:00:00Z"
    end:   "2025-06-01T00:00:00Z"
    tick_years: 1
    lanes: [research, journals, institutions, media]
  - id: recent
    title: "Panel B: June 2025 to October 2026 (one tick per two months)"
    start: "2025-06-01T00:00:00Z"
    end:   "2026-10-15T00:00:00Z"
    tick_hours: 1464
    lanes: [research, journals, institutions, media]
lanes:
  research:     {label: "Studies and data"}
  journals:     {label: "Journals and editorial actions"}
  institutions: {label: "Agencies, officials and hearings"}
  media:        {label: "Media and online posts"}
people:
  - {who: "Ute Kruger", detail: "Swedish pathologist whose interview was summarised in the 4 Aug 2022 post; whether she used the term herself is not verified."}
  - {who: "Etana Hecht", detail: "Substack author of the 4 Aug 2022 post."}
  - {who: "Wafik El-Deiry", detail: "Oncotarget editor-in-chief and co-author of the Kuperwasser review and the spike-p53 paper; ACIP workgroup presenter; Senate witness."}
  - {who: "Joseph Ladapo", detail: "Florida State Surgeon General."}
  - {who: "Peter Marks", detail: "Director of FDA CBER at the time of the 14 Dec 2023 letter."}
