# Sources for the rekhmire-tomb-brickmaking dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored as a copy in the repository; sources are cited by URL and sha256 of the copy read. Tests were run in this session
# (2026-10-14), which is not an independent review.
# IMPORTANT: every text source here is a book, translation or commentary, i.e. a CLAIM about the scene, not primary data.
# The wall itself was not seen. The only images viewed are (a) Newberry's outline tracing (one cropped plate page, plate XXI area) and
# (b) a modern facsimile painting by Nina de Garis Davies on the Met site. No hieroglyphic sign was read from any image.
# Funding and control of each author, publisher and sponsor is recorded where a source read states it, otherwise UNRESEARCHED.
retrieved: 2026-10-14
sources:

  - id: src-newberry-1900
    title: "P. E. Newberry, The Life of Rekhmara, Vezir of Upper Egypt under Thothmes III and Amenhetep II (circa B.C. 1471-1448), with twenty-two plates (Westminster: Archibald Constable, 1900). Printed by Butler and Tanner, Frome and London"
    url: https://archive.org/details/TheLifeOfRekhmara
    document_class: "interpretive: author's summary and description of the tomb scenes, with outline tracings of the wall. A claim about the wall, not the wall. The preface says full translations are not given because they 'must of necessity be tentative'."
    read: "yes, directly (Internet Archive OCR text, file The_Life_of_Rekhmara_djvu.txt, sha256 1d0fc09f98bf834083fb8d7a66608f48ba5f165c16213abccacf0d5ceaa6f817; title page, preface, contents, pp. 13-14, 20, 37-38). Plate page (IA PDF page 107, PDF sha256 a59a5f39afde5e4a0a3ed49c68bdbee1e6622716c699141032a05442ceeeee3d) viewed as an image."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Google scan of the Princeton University library copy, uploaded to the Internet Archive by John Mark Ockerbloom (item description read); item licence field is the Public Domain Mark. Title page names Constable, Westminster, 1900. Holder of the physical copy today: Princeton University Library (per the item description; not otherwise checked)."
      tests:
        - "Title page year 1900 and publisher read in the OCR agree with the Internet Archive metadata date 1900 (could have failed)"
        - "Newberry's label translation 'captives brought by his Majesty ... for the works of the temple of Amen' agrees in substance with Breasted 1906 section 759 and with the quotation in Kitchen 1976 n. 19, which are separate works (could have failed)"
        - "Newberry's placing of Rekhmara in the second half of Thutmose III's reign (vizier from year 32) is consistent with Breasted 1906 section 663 ('during the latter half of the reign of Thutmose III'); the two are not independent, since Breasted cites Newberry's plates (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps:
        - "OCR only, apart from one plate page viewed. The plate page is cropped by the fold-out and the tracing is in outline, so skin colour, hair and dress that other authors use to identify peoples are not shown."
        - "No hieroglyphic sign was read from the plates."
        - "The tracing was made by Newberry, copied from the wall; it was not compared with the wall or with Virey 1889."
        - "Who funded Newberry's copying work at Thebes: UNRESEARCHED. The preface passages read name no funder (it thanks Spiegelberg for help and for checking his copy at Thebes in 1896)."
        - "Publisher Archibald Constable and Co: ownership and funding UNRESEARCHED."
      next_step: "Open the Heidelberg scan (blocked, see src-newberry-heidelberg) or the IA PDF at full resolution and read the label signs on plates XIX-XXI against Sethe, Urkunden IV."
      checked: 2026-10-14
    notes: "Newberry uses the spelling Thothmes/Amen. Quoted verbatim in the claims with that spelling."

  - id: src-breasted-are2
    title: "J. H. Breasted, Ancient Records of Egypt, vol. 2, The Eighteenth Dynasty (Chicago: University of Chicago Press, 1906), sections 663-664 (the tomb) and 756-759 (inspection of sculptors and builders); series 'Ancient Records' under the general editorship of William Rainey Harper"
    url: https://archive.org/details/ancientrecordsof02brea
    document_class: "interpretive: translation with commentary and footnotes. A claim about the wall, not the wall. Breasted's note on section 663 calls Virey's 1889 publication 'unusable'. Breasted's remark in section 756 comparing the scene to what 'was afterward exacted of the Hebrews' is his own gloss."
    read: "yes, directly (Internet Archive OCR text, file ancientrecordsof02brea_djvu.txt, sha256 cfd690f1a1858e162bf9c67969f02f2e963fc6a71271cf3e481d421621e7eb11; title page, sections 663-664, 755-759 with footnotes)"
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Internet Archive scan contributed by the Brigham Young University Harold B. Lee Library (the scan carries a memorial plate 'In memory of Steven F. Christensen'). Title page read: University of Chicago Press, Chicago, published March 1906, copyright The University of Chicago, London: Luzac, Leipzig: Harrassowitz. Item licence field not recorded here."
      tests:
        - "Title page publisher, year (1906) and volume title read in the OCR agree with the Internet Archive metadata (could have failed)"
        - "Section 759 label translation agrees in substance with Newberry 1900 p. 37 and with Kitchen 1976 n. 19 (separate works; could have failed)"
        - "Footnote to section 756 says some words 'are in Virey's copy (Memoires de la mission francaise au Caire, V, Pl. XV), but had been lost before Newberry's was made', which matches Newberry's own statement that his copy was made later than Virey's (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps:
        - "OCR only; page images not compared"
        - "No hieroglyphs read"
        - "Breasted worked from Newberry's plates (his note cites Newberry's Pls. XX and XXI) and Virey, so his reading is not independent of Newberry's tracing"
        - "Series sponsorship: the title page names William Rainey Harper as general editor and the University of Chicago Press as publisher. Who funded the series and Breasted's work, and how far the University or any donor controlled content: UNRESEARCHED."
      next_step: "Compare the OCR with the page images for sections 756-759 and read the signs on Newberry's plates XX and XXI."
      checked: 2026-10-14

  - id: src-kitchen-1976
    title: "K. A. Kitchen, 'From the Brickfields of Egypt', Tyndale Bulletin 27(1), pp. 137-147, DOI 10.53751/001c.30629"
    url: https://tyndalebulletin.org/article/30629.pdf
    document_class: "interpretive: article on brick-making in Egyptian texts as background to the Exodus account. A claim about the scene, not the scene. Kitchen's note 17 cites Davies 1943 and Davies 1935 as the definitive publication and Porter and Moss for tomb 100."
    read: "yes, directly (PDF text, 11 pages, 1.5 MB, sha256 9f46ce814d9323a45571449a81a48c3a8602a2aaea1e6d4341ed7e9674362c96; pp. 137-147 read in full text layer). The year 1976 and volume 27(1) come from a web-search result summary, not from the extracted PDF text, which prints no year."
    authenticity:
      status: authenticated
      strength: weak
      provenance: "Copy from tyndalebulletin.org (the PDF footer prints that site and the DOI). PDF metadata: scanned with a ScanSnap on 2021-12-01 and modified 2022-06-14, i.e. a modern digitisation of the printed article. Search results give Tyndale Bulletin 27(1), 1976."
      tests:
        - "Page headers 'TYNDALE BULLETIN' and page numbers 138-147 run in order through the PDF, and the first page opens the same article as the DOI title (could have failed)"
        - "Kitchen's quotation of the label 'Spoils (=captives) brought by His Majesty ... for the work of the temple of his father [Amun]' agrees in substance with Newberry 1900 and Breasted 1906 (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps:
        - "Year and volume not read in the file itself"
        - "Kitchen's identification of the workers as 'Syrians, Nubians, Egyptians' is stated without a source for the identification other than the note 17 citations (Davies 1943 pp. 54-56, pls. 58-60; Davies 1935 pls. 16-17), which were not opened"
        - "The article is written from the Exodus-background angle (it opens on Exodus 1:11-14 and 5:5ff.). Kitchen's institutional affiliation and who funds or controls the journal and its publisher: UNRESEARCHED (nothing about this was read in the article). The bibliography notes show only that Tyndale Press and IVF published other works Kitchen cites."
      next_step: "Open Davies 1943 pp. 54-56 and plates 58-60 and see what basis, if any, is given for the identification of the peoples."
      checked: 2026-10-14

  - id: src-met-facsimile-30-4-77
    title: "Metropolitan Museum of Art, record for 'Brickmakers, Tomb of Rekhmire', facsimile by Nina de Garis Davies, accession 30.4.77 (Open Access API object 544649) and its web image DT10882.jpg"
    url: https://www.metmuseum.org/art/collection/search/544649
    document_class: "official record of a museum plus an image of a modern copy of the wall (a facsimile), not the wall and not a squeeze"
    read: "yes, directly (API JSON fetched 2026-10-14, fields read: title, accession, dates, reign, medium, dimensions, credit line, region, artist, isPublicDomain). Image https://images.metmuseum.org/CRDImages/eg/web-large/DT10882.jpg (599 x 427 px) fetched and viewed; sha256 of the fetched file 9f7824cf8dde68d70e5a7aaea81d3969152f7569c27edee6fa2956860b171205. NOT stored in this repository (licence flag read in the record as isPublicDomain true, but the Met's own open-access policy page was not read)."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Held by the Metropolitan Museum of Art, New York; credit line 'Rogers Fund, 1930'; accession year 1930. The facsimile is by Nina de Garis Davies (1881-1965, per the record). What the Rogers Fund is and who controlled the Met's Egyptian Expedition that produced facsimiles of this tomb: UNRESEARCHED."
      tests:
        - "The accession number printed on the image, bottom right (30.4.77), was compared with the accession number in the API record and agrees (could have failed)"
        - "The image shows brick-making labour at a wall under construction, matching Newberry's description of the top row of the scene (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps:
        - "A facsimile is a painter's interpretation of the wall; how faithfully it follows the wall was not tested"
        - "The label signs in the image are not legible at 599 px and no sign was read"
        - "The record's date range (ca. 1479-1425 BCE) is the museum's catalogue range for the tomb, not a date for the facsimile or a dated reading of the scene"
        - "The web page of the record was blocked (HTTP 429) on the first attempt; the API record was obtained afterwards with an ordinary identifying user agent after a pause. See log L-03."
      next_step: "Open the Met's full-size image and Davies 1935 plates 16-17 and read the label signs."
      checked: 2026-10-14
      sha256: 9f7824cf8dde68d70e5a7aaea81d3969152f7569c27edee6fa2956860b171205
      copy_of: "https://images.metmuseum.org/CRDImages/eg/web-large/DT10882.jpg (the Met's own web-size file; the original on the wall was not seen)"
      compared_with_holder_copy: "no"

