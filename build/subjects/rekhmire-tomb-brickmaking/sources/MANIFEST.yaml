    read: "yes, directly (Internet Archive OCR text, file ancientrecordsof02brea_djvu.txt, sha256 cfd690f1a1858e162bf9c67969f02f2e963fc6a71271cf3e481d421621e7eb11; title page, sections 663-664, 755-759 with footnotes; re-read 756-759 on 2026-10-16)"
    stored_extracts:
      - {path: "extracts/breasted-are2-sections-756-759-extract.txt", sha256: ef59aff351a3f4ac263ca5ac71c44eca422d79a6f7823aa48483aded83f93777, what: "verbatim OCR extract, sections 756-759 with footnotes"}
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Internet Archive scan contributed by the Brigham Young University Harold B. Lee Library (the scan carries a memorial plate 'In memory of Steven F. Christensen'). Title page read: University of Chicago Press, Chicago, published March 1906, copyright The University of Chicago, London: Luzac, Leipzig: Harrassowitz. Item licence field not recorded here."
      tests:
        - "Title page publisher, year (1906) and volume title read in the OCR agree with the Internet Archive metadata (could have failed)"
        - "Section 759 label translation agrees in substance with Newberry 1900 p. 38 and with Kitchen 1976 n. 19 (separate works; could have failed)"
        - "Footnote to section 756 says some words 'are in Virey's copy (Memoires de la mission francaise au Caire, V, Pl. XV), but had been lost before Newberry's was made', which matches Newberry's own statement that his copy was made later than Virey's (could have failed)"
      tested_by: "Stratah dig sessions, 2026-10-14 and 2026-10-16 (not an independent review)"
      gaps:
        - "OCR only; page images not compared. The footnote letters in the OCR do not line up with the text, so which word a footnote belongs to is not established (the 'conquered' footnote and the 'Semitic' footnote)."
        - "No hieroglyphs read"
        - "Breasted worked from Newberry's plates (his note cites Newberry's Pls. XX and XXI) and Virey, so his reading is not independent of Newberry's tracing"
        - "Series sponsorship: the title page names William Rainey Harper as general editor and the University of Chicago Press as publisher; the front matter read states no funder. Who funded the series and Breasted's work: not read; a research task."
      next_step: "Compare the OCR with the page images for sections 756-759."
      checked: 2026-10-16

  - id: src-kitchen-1976
    title: "K. A. Kitchen, 'From the Brickfields of Egypt', Tyndale Bulletin 27(1), pp. 137-147, DOI 10.53751/001c.30629"
    url: https://tyndalebulletin.org/article/30629.pdf
    document_class: "interpretive: article on brick-making in Egyptian texts as background to the Exodus account. A claim about the scene, not the scene. Kitchen's note 17 cites Davies 1943 and Davies 1935 as the definitive publication and Porter and Moss for tomb 100."
    read: "yes, directly (PDF text, 11 pages, 1.5 MB, sha256 9f46ce814d9323a45571449a81a48c3a8602a2aaea1e6d4341ed7e9674362c96; pp. 137-147 read in the text layer; the Rekhmire passage is p. 140 with notes 17-19, p. 143 mentions the scene again, and pp. 146-147 Ra'amses). The PDF itself prints no year. The year and volume were taken on 2026-10-16 from the publisher's landing page https://tyndalebulletin.org/article/30629 (HTML sha256 0b1489c503c532bb1352b5b5e9de2cdfa98289ada205c5ede5eeaf8ec00fd2aa), whose metadata gives volume 27, issue 1, publication date 1976-05-01."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Copy from tyndalebulletin.org (the PDF footer prints that site and the DOI). PDF metadata: scanned with a ScanSnap on 2021-12-01 and modified 2022-06-14, i.e. a modern digitisation of the printed article. The publisher's landing page gives Tyndale Bulletin 27(1), 1976-05-01 (read 2026-10-16)."
      tests:
        - "Page headers 'TYNDALE BULLETIN' and page numbers 138-147 run in order through the PDF, and the first page opens the same article as the DOI title (could have failed)"
        - "The publisher's landing page title 'From the Brickfields of Egypt' and author 'K. A. Kitchen' match the PDF's first page (could have failed; added 2026-10-16)"
        - "Kitchen's quotation of the label 'Spoils (=captives) brought by His Majesty ... for the work of the temple of his father [Amun]' agrees in substance with Newberry 1900 and Breasted 1906 (could have failed)"
      tested_by: "Stratah dig sessions, 2026-10-14 and 2026-10-16 (not an independent review)"
      gaps:
        - "Kitchen's identification of the workers as 'Syrians, Nubians, Egyptians' is stated without a source other than the note 17 citations (Davies 1943 pp. 54-56, pls. 58-60; Davies 1935 pls. 16-17), which were not opened."
        - "Publisher and affiliation, as read on 2026-10-16: the publisher's page describes Tyndale Bulletin as 'the journal of Tyndale House, Cambridge, a UK-based research institute and residential library dedicated to biblical scholarship'; Tyndale House's own page (2026) gives its charitable purpose as 'to advance the evangelical Christian religion through promoting evangelical biblical scholarship and research'. Those are present-day statements. Who published and funded the journal in 1976, and what funded Tyndale House then, were not read. The article's own bibliography notes cite Tyndale Press and IVF titles. Research task: find the 1976 masthead or an account of the Bulletin's publisher then."
        - "Kitchen's own affiliation in 1976 is not printed in the pages read."
      next_step: "Open Davies 1943 pp. 54-56 and plates 58-60 and see what basis, if any, is given for the identification of the peoples."
      checked: 2026-10-16

