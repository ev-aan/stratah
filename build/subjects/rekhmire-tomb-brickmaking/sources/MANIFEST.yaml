  - id: src-urk-iv
    title: "K. Sethe, Urkunden der 18. Dynastie, vierter Band (Heft 13-16), Historisch-biographische Urkunden (Leipzig: J. C. Hinrichs'sche Buchhandlung, 1909); series Urkunden des aegyptischen Altertums, IV. Abteilung Band IV, ed. G. Steindorff; the Rekhmire texts are on pp. 1071-1175 (Urk. IV)"
    url: https://archive.org/details/urkunden-de-18.-dynastie.-vierter-band
    document_class: "hieroglyphic edition: Sethe's hand-copied hieroglyphic text of the inscriptions, with his German headings and notes. A copy of the wall made from earlier copies (Sethe's own listing for the brickmaking scene: Newberry pls. 19-21, Virey pls. 17-18, Lepsius Denkmaeler III 40/41; some parts 'Nach Abschrift von Newberry'). A claim about the wall, not the wall; the headings are Sethe's reading."
    read: "yes, directly (updated 2026-10-16; the first dig recorded this source as not located). Internet Archive PDF (6.6 MB, 297 pages, scanned images with no text layer; sha256 b48ab5cd728599ae149626a2a50d62feba92259f9c8ae69b1661c83576faf2bc) opened; printed pages IV 1096-1108 (headers only), 1101, 1102, 1146-1155 viewed page by page as images, and the German headings typed out. The hieroglyphic lines were looked at and not transliterated. The OCR text (sha256 3334e6bb0e5c09adff094b2792f83004c51f1adcf0abc0bdc434997e33086b77) is noisy and was used only for the printed contents list. Not viewed: pp. 1103-1145 and 1156 onward, so the vizier's duties text, the tribute scenes other than p. 1101-1102, and Sethe's notes elsewhere were not read."
    stored_extracts:
      - {path: "extracts/sethe-urk4-german-headings-transcription.txt", sha256: e3ca828fdc62e2dbcf906c87a7a34b3f2219b58d880e2fee51613076526f243c, what: "typed German headings, pp. 1102, 1146-1155"}
      - {path: "extracts/sethe-urk4-p1102.png", sha256: a7c79c5d9de784b61bf1d540edb3ec1828dd73f148b3a417a547e9510a106795, what: "page image, printed p. 1102 (PDF page 172), 100 dpi"}
      - {path: "extracts/sethe-urk4-p1146.png", sha256: 11344514375326b6f5d6c89884308791ecbf9525dd8ce319c2d5ba115acfc2af, what: "p. 1146 (PDF page 216)"}
      - {path: "extracts/sethe-urk4-p1147.png", sha256: bf957c7947bd4901a83e365dc5c4c76bbdf5002a9a1098d9a6c62c612bb8e549, what: "p. 1147 (PDF page 217)"}
      - {path: "extracts/sethe-urk4-p1151.png", sha256: c79e006daf756d0947e215ac5748aedad278cf8567078254f2e4ea95d3cf7894, what: "p. 1151 (PDF page 221)"}
      - {path: "extracts/sethe-urk4-p1152.png", sha256: 77eaae9373b21a62f034e68e5411e9d313f4b70e3d3a17bda7db695c5a8ceb5f, what: "p. 1152 (PDF page 222)"}
      - {path: "extracts/sethe-urk4-p1153.png", sha256: 5be3e5cc69c12a7a8fcc1e9df28cbe618b297d6d07965e79a10dcc8a8ff0978c, what: "p. 1153 (PDF page 223)"}
      - {path: "extracts/sethe-urk4-p1154.png", sha256: 0553e7029fe97ab61cbf479199ea734797486da8e47229fc1a9d3074fa2d0bd4, what: "p. 1154 (PDF page 224)"}
      - {path: "extracts/sethe-urk4-p1155.png", sha256: 430e5d0d492514be3f04baa7bf269f558261720dc37053cccf45f207d316ad96, what: "p. 1155 (PDF page 225)"}
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Internet Archive scan (item urkunden-de-18.-dynastie.-vierter-band; a second item, urkunden-de-18.-dynastie.-vierter-band_202411, carries the same PDF size 6640362). The scan's own source library was not read. Title page (OCR) names Kurt Sethe, J. C. Hinrichs'sche Buchhandlung, Leipzig, 1909, and the series Urkunden des aegyptischen Altertums IV. Abteilung Band IV, edited by Georg Steindorff. Item licence field not recorded."
      tests:
        - "The printed page numbers in the headers run in order IV 1144 to IV 1156 across PDF pages 214-226 (could have failed)"
        - "Sethe's list of earlier publications for the brickmaking section D (Newberry pls. 19-21) matches the plate numbers on which Newberry 1900 prints the scene (XIX-XXI, viewed in the IA scan of Newberry) (could have failed)"
        - "A later reader's pencil note on Newberry's plate XX in a different scan (Internet Archive TheLifeOfRekhmara) cites Sethe pp. 1152-1153 'D.2.a', and label D.2.a is on p. 1152 of this volume under that letter and number (could have failed; the annotator is unknown, so this is a consistency check only)"
        - "The vizier's heading on p. 1155 (section 333, offerings given by Thutmose III to the Amun temple) matches Newberry's section 10 'Rekhmara Inspects the Provisions of the Divine Offerings', plate XXII, which Sethe also cites (could have failed)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps:
        - "The hieroglyphic lines were not transliterated by the dig. Everything claimed from this source is Sethe's German heading or his stated sources; no word of any label has been read from the signs here."
        - "Sethe copied earlier copies; he did not collate against the wall in the pages read (his footnotes cite Lepsius, Hay, Virey and Newberry for variants), so this is not an independent view of the wall."
        - "Pages 1103-1145 and 1156 onward were not viewed."
        - "Funding of the Urkunden des aegyptischen Altertums series and of Sethe's edition: the title page names the editor and publisher only. Not read; a research task."
      next_step: "Ask a reader of hieroglyphs to transcribe Urk. IV 1152,9-1153,13 (labels a to d of the brickmaking scene) and compare with Newberry p. 38 and Breasted sections 758-759."
      checked: 2026-10-16

  - id: src-aston-2013
    title: "D. A. Aston, 'Radiocarbon, Wine Jars and New Kingdom Chronology', pp. 289-315 (page headers read), (c) 2013 Oesterreichische Akademie der Wissenschaften, Wien; PDF from austriaca.at"
    url: "https://austriaca.at/0xc1aa5572%200x00308d5a.pdf"
    document_class: "interpretive: a scholar's paper that tabulates several authors' chronologies of the 18th Dynasty and argues for his own. It reports other authors' schemes (Krauss 2007, Krauss and Warburton 2009, Schneider 2010, Bronk Ramsey and others 2010, Quiles and others 2013, Huber 2011); the originals were not opened."
    read: "yes, directly (PDF text, 28 pages, 237 KB, sha256 9a7825d28ab96f305a8cecc4adc11092fc6a28170172c8cf1947a6eed251635e; pp. 290-292 and 296-297 read closely for the tables below, the rest searched for dates). The journal title, volume and year of the printed issue are not in the pages read, only the page headers and the (c) 2013 line."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "PDF served by austriaca.at, the Austrian Academy of Sciences publisher site; its running header reads 'David Aston' and 'Radiocarbon, Wine Jars and New Kingdom Chronology' with page numbers 290 to 315 and a '(c) 2013 by Oesterreichische Akademie der Wissenschaften, Wien' line. PDF creation date 2014-05-08."
      tests:
        - "Page numbers in the running headers run in order 290 to 315 (could have failed)"
        - "Internal consistency of Aston's reproduction of Krauss 2007: each king's end year equals the next king's start year in the table (Thutmose III 1479-1425, Amenophis II 1425-1400, Tuthmosis IV 1400-1390) (could have failed)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps:
        - "Reports the schemes of others; none of the original tables (Krauss 2007, Krauss and Warburton 2009, Schneider 2010, Bronk Ramsey and others 2010, Hornung, Krauss and Warburton 2006) was opened. One author's account of them: not independent corroboration of their figures."
        - "Aston argues his own position (wine-jar dockets); his wording about other authors ('has been summarily dismissed', 'such a low chronology has not found much favour') is his view."
        - "Funding: not stated in the pages read."
      next_step: "Open Hornung, Krauss and Warburton (eds.), Ancient Egyptian Chronology (Leiden: Brill, 2006) and Bronk Ramsey and others, Science 328 (2010), and compare the tables."
      checked: 2026-10-16

  - id: src-met-bulletin-1930-12
    title: "N. de G. Davies (signed N. DE G. DAVIES at the end), essay on the graphic branch of the Egyptian Expedition, in 'The Egyptian Expedition 1929-1930', Bulletin of the Metropolitan Museum of Art, vol. 25 no. 12 (December 1930), Part II (the essay runs over roughly printed pp. 28-39; the exact range and its title line were not read from the images; printed pages 32, 33 and 38 were read closely)"
    url: https://archive.org/details/sim_metropolitan-museum-of-art-new-york-bulletin_1930-12_25_12
    document_class: "interpretive: a general essay by the man who copied and later published the Rekhmire tomb paintings, on how far Egyptian pictures of foreign peoples can be trusted. It does not discuss the brickmaking scene by name; it names the tribute row of Rekhmire's tomb. A claim about Egyptian art in general."
    read: "yes, directly (Internet Archive 'Serials in Microfilm' scan, PDF 71 pages, sha256 cb6b59dbed7eaabaea9b960f97aa588d532d013f1b89e532c055290f503f5357; OCR/text layer file sim_metropolitan-museum-of-art-new-york-bulletin_1930-12_25_12_djvu.txt sha256 e83f7beeb9ff30006a8a4ada7b4a54e09b20e86bf89f7dee25ef27b4c77bd502; PDF pages 60, 61 and 66 viewed as images, printed pages 32, 33 and 38). Quoted only in short fragments that were checked against the images. Not stored."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Internet Archive scan of the Bulletin of the Metropolitan Museum of Art, Dec 1930, digitised from the Serials in Microfilm collection (item description read). Published by the Metropolitan Museum of Art. Rights: first published in 1930, which on the usual United States rule entered the public domain on 1 January 2026; not checked against the Met's own rights statement, so only short fragments are quoted and nothing is stored."
      tests:
        - "The printed page number 38 and the running head 'Bulletin of the Metropolitan Museum of Art' appear on the page image where the OCR places the Rekhmire sentence (could have failed)"
        - "The essay ends with the signature 'N. DE G. DAVIES' in the OCR text (could have failed; read in the OCR only)"
      tested_by: "Stratah dig session, 2026-10-16 (not an independent review)"
      gaps:
        - "The essay's title and start page were not read from the image; the signature was read in the OCR only."
        - "It is a general essay about foreign peoples in Theban tomb art, not a discussion of the brickmakers."
        - "Funding of the Egyptian Expedition and of Davies's work: the Bulletin pages read do not state it in the passages seen; a research task."
      next_step: "Read Davies 1943, pp. 54-56, for his own statement on the brickmakers, and the Bulletin of Dec 1928 section II p. 39 that this essay cites."
      checked: 2026-10-16

