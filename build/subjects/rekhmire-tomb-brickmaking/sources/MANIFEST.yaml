# Sources for the rekhmire-tomb-brickmaking dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Revised 2026-10-16 (round 2, after the independent review of PR #33; the changes are listed in log.yaml L-07 onward).
# Nothing copyrighted is stored. Stored in this repository (sources/extracts/): verbatim public-domain extracts of Newberry 1900 and Breasted 1906 (OCR text), eight page images of
# Sethe 1909 (public domain) and a typed transcription of Sethe's German editorial headings. Everything else is cited by URL and sha256 of the copy read.
# Tests were run in these sessions (2026-10-14 and 2026-10-16), which are not independent reviews.
# IMPORTANT: every source here is a book, edition, translation, article or museum record, i.e. a CLAIM about the scene or a copy of it, not the wall. The wall itself was not seen.
# What was read from signs: Sethe's hand-copied hieroglyphs (Urk. IV, pp. 1102, 1146-1155) were opened and viewed page by page; the dig could not transliterate them with confidence,
# so no sign-level reading is claimed anywhere in this dig. Newberry's outline tracings (plates XIX-XXI) were viewed; they carry no colour.
# Funding and control of each author, publisher and sponsor is recorded only where a source read states it; the rest is listed as a research task in the gaps.
retrieved: 2026-10-14
revised: 2026-10-16
sources:

  - id: src-newberry-1900
    title: "P. E. Newberry, The Life of Rekhmara, Vezir of Upper Egypt under Thothmes III and Amenhetep II (circa B.C. 1471-1448), with twenty-two plates (Westminster: Archibald Constable, 1900). Printed by Butler and Tanner, Frome and London"
    url: https://archive.org/details/TheLifeOfRekhmara
    document_class: "interpretive: author's summary and description of the tomb scenes, with outline tracings of the wall. A claim about the wall, not the wall. The preface says full translations are not given because they 'must of necessity be tentative'."
    read: "yes, directly (Internet Archive OCR text, file The_Life_of_Rekhmara_djvu.txt, sha256 1d0fc09f98bf834083fb8d7a66608f48ba5f165c16213abccacf0d5ceaa6f817; title page, preface, contents, pp. 13-14, 19, 20, 37-38 (round 2 added p. 19 and re-read pp. 37-38 with the page break located). IA PDF sha256 a59a5f39afde5e4a0a3ed49c68bdbee1e6622716c699141032a05442ceeeee3d: plate pages for plates XIX, XX and XXI (PDF pages 102-108) viewed as images on 2026-10-16 (thumbnails of all; PDF page 104, plate XX, and page 108, the right part of plate XXI, at 100 dpi): outline tracings in red line, signs not transliterated by the dig. The IA copy carries a later reader's pencil notes on the plates citing 'Sethe: Urkunden XVIII Dyn pp 1152-1153 D.2.a' and 'Wreszinski: Atlas', whose author is unknown; they are not used as evidence."
    stored_extracts:
      - {path: "extracts/newberry-1900-extracts.txt", sha256: 4361c22aa8d4c66e03553c2ddb7ac6fe9a0d014b4aa9ea1961c341c91dbecf41, what: "verbatim OCR extracts, p. 19 and pp. 37-38"}
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Google scan of the Princeton University library copy, uploaded to the Internet Archive by John Mark Ockerbloom (item description read); item licence field is the Public Domain Mark. Title page names Constable, Westminster, 1900. Holder of the physical copy today: Princeton University Library (per the item description; not otherwise checked)."
      tests:
        - "Title page year 1900 and publisher read in the OCR agree with the Internet Archive metadata date 1900 (could have failed)"
        - "Newberry's label translation 'captives brought by his Majesty ... for the works of the temple of Amen' agrees in substance with Breasted 1906 section 759 and with the quotation in Kitchen 1976 n. 19, which are separate works (could have failed)"
        - "Newberry's plates XIX-XXI are the plates that Sethe 1909 (Urk. IV, p. 1151) lists for the brickmaking and building scene ('Newberry, Rekhmara pl. 19-21'); the numbers agree (could have failed; added 2026-10-16)"
      tested_by: "Stratah dig sessions, 2026-10-14 and 2026-10-16 (not an independent review)"
      gaps:
        - "OCR for the text; plates viewed as images. The tracing is in outline, so skin colour, hair and dress that other authors use to identify peoples are not shown."
        - "No hieroglyphic sign was transliterated by the dig from the plates."
        - "The tracing was made by Newberry, copied from the wall; it was not compared with the wall, with Virey 1889 or with Lepsius."
        - "Who funded Newberry's copying work at Thebes: the preface passages read name no funder (it thanks Spiegelberg for help and for checking his copy at Thebes in 1896; the dedication thanks his wife as his companion at Thebes for three years). Not stated in any page read; a research task, not a finding."
        - "Publisher Archibald Constable and Co: ownership and funding not read."
      next_step: "Compare Newberry's tracing with Davies 1943 pls. 58-60 and Sethe's autograph for the label signs, with a reader of hieroglyphs."
      checked: 2026-10-16
    notes: "Newberry uses the spelling Thothmes/Amen. Quoted verbatim in the claims with that spelling."

