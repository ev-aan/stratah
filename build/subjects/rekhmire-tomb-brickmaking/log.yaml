      ROUND 2 OPENED after the independent review of PR #33 (verdict REDO: no primary data, no headline, timeline or taxonomy entry, funding unresearched). Work continued on the same branch after merging origin/main. Earlier entries L-01 to L-06 are unchanged.
      WHAT WAS OPENED AND READ THIS ROUND. (1) Sethe, Urkunden der 18. Dynastie, vierter Band (1909), Internet Archive item urkunden-de-18.-dynastie.-vierter-band, PDF sha256 b48ab5cd728599ae149626a2a50d62feba92259f9c8ae69b1661c83576faf2bc (scanned images, no text layer):
      printed pages IV 1096-1108 (headers), 1101, 1102 and 1146-1155 viewed page by page as images; the German headings were typed out (sources/extracts/sethe-urk4-german-headings-transcription.txt) and eight page images are stored. The hieroglyphic lines were viewed and NOT transliterated.
      (2) Newberry 1900 plates XIX-XXI (IA PDF pages 102-108; page 104 and the right part of plate XXI at 100 dpi) and the text again: p. 19 (introduction) and pp. 37-38 with the page break located (the captive label and 'slaves (?)' are on p. 38). (3) Aston, Radiocarbon, Wine Jars and New Kingdom Chronology (c) 2013, PDF sha256 9a7825d28ab96f305a8cecc4adc11092fc6a28170172c8cf1947a6eed251635e, pp. 290-292 and 296-297.
      (4) Davies's 1930 essay, Bulletin of the Metropolitan Museum of Art vol. 25 no. 12 (Dec. 1930), PDF sha256 cb6b59dbed7eaabaea9b960f97aa588d532d013f1b89e532c055290f503f5357, printed pp. 32, 33 and 38. (5) Kitchen 1976: the PDF again, and the publisher's landing page tyndalebulletin.org/article/30629 (HTML sha256 0b1489c503c532bb1352b5b5e9de2cdfa98289ada205c5ede5eeaf8ec00fd2aa) for volume, issue and date (27(1), 1976-05-01).
      (6) Tyndale House pages (tyndalehouse.com/about and /about/doctrinal-basis, read 2026-10-16). (7) OCR text of the issues of the Bulletin of the Metropolitan Museum of Art 1929-1937 that the Internet Archive served (10 returned HTTP 500 and were not read), searched for Rekhmire, Rogers Fund and the Egyptian Expedition; only the Dec 1930 essay and the 1934-35 publication notices were used.
