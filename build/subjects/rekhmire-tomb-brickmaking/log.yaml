  - id: L-14
    date: 2026-10-16
    entry: >
      FIX ROUND after an independent review of commit 2001bb4 (APPROVE WITH NON-BLOCKING). Corrections, as new entry; L-07 to L-13 are unchanged. (1) Claim rekhmire-sp20a-older-than-ramses: the round-2 arithmetic paired the end of Thutmose III's reign in one scheme (1425 or 1415 BC) with the start of Ramesses II's in another (1290 Schneider, 1315 Huber). It now compares inside each scheme as Aston tabulates it (Krauss 2007; Krauss and Warburton 2009; Schneider 2010; Aston's second scenario that keeps 1479 BC): in each the gap is about 130 years, so 'more than a century' holds there; Huber's figures give no end year in the pages read and are not compared.
      (2) rekhmire-newberry-slaves-wording keeps `primary` with the basis now saying OCR read and page images of the text pages not viewed; rekhmire-breasted-conquered-rendering is relabelled from `primary` to `no` (OCR only; the footnote letters do not line up). (3) The citation of Aston's paper was wrong in the manifest and in L-07 context: the PDF's first page prints 'Ägypten und Levante/Egypt and the Levant 22, 2012, 289-315' (c) 2013; the manifest entry says so now. (4) rekhmire-sp02a-scene-shows-brickmaking: evidential weight lowered from 4 to 3, because the copyists are copies of one wall and the wall was not seen; state and check level unchanged.
      (5) The Kitchen manifest gap no longer sets a note about Tyndale Press and IVF titles beside the funding items: it is a plain description (the article's notes list such works among references, for example note 17) and no effect on any claim is asserted; L-04 stays as written and L-09 already noted its correction. (6) The 'no Sklave and no people's name' result in rekhmire-sethe-headings-vocabulary-absence covers only the Sethe pages viewed (pp. 1102, 1146 to 1155); pp. 1103-1145 and 1156 onward were not viewed, and 'Leibeigene' in the contents list was OCR-only and not checked against a page image: both now stated in that claim's anchor and next step.
      Left to the owner: the taxonomy proposal, the timeline.html (the renderer cannot draw BCE years), the adoption placeholder, the Met API ruling.
  - id: L-15
    date: 2026-10-16
    entry: >
      CORRECTION to L-14 item (1) and to claim rekhmire-sp20a-older-than-ramses. L-14 and the claim said the gap between the end of Thutmose III's reign and Ramesses II's accession was 'about 130 years' in each scheme. The per-scheme figures are not equal: Krauss 2007, 1425 to 1279 BC = 146 years (the 1279 is Aston's 'low chronology of 1479 and 1279 BC', p. 291, read as year 1 of Ramesses II); Krauss and Warburton 2009, 1415 to 1279 = 136; Schneider 2010, 1422 to 1290 = 132; Aston's second scenario, 1425 to 1294 = 131. The claim now states each and the range 131-146 years; 'more than a century' stays only as the summary. L-14 is not edited.
