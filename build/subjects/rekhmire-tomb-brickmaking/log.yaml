  - id: L-08
    date: 2026-10-16
    entry: >
      CORRECTION to L-02, L-05 and to claim rekhmire-sp02d-slaves. Round 1 reported that the only 'slaves' in the pages read was Newberry's doubtful rendering of a label line (p. 37 as then cited). That was incomplete: Newberry's introduction (p. 19) says prisoners of Thothmes III were 'sent as slaves to work for the god at Thebes', and the page of the 'captives' translation and of 'slaves (?)'
      is p. 38, not p. 37 (the section begins on p. 37; the OCR page marker 38 comes before both passages). New claim rekhmire-newberry-slaves-wording records both. Page numbers 11, 14 and 20 for the Newberry passages of claims sp01a and sp01b were located against the OCR page markers (the review had noted p. 11 was not tied to a page).
      The 'p. 141' cite in round 1's sp20a (Anastasi III and 'year 22 of Ramesses II or III') was a footnote (n. 26) and is no longer relied on.
  - id: L-09
    date: 2026-10-16
    entry: >
      CORRECTIONS answering review findings 4 to 10 on PR #33 (new entries, not edits of L-01 to L-06; the claims and the manifest were rewritten in this round and git holds round 1). (4) Breasted section 758 renders a word as 'conquered' with a footnote 'The captives of war shown in the same scene ?': added as claim rekhmire-breasted-conquered-rendering beside Newberry's 'slaves (?)', and added to the slaves claim. Whether the two translate one Egyptian word is not known (signs not transliterated).
      (5) rekhmire-sp20d-construction-before-ramses restated from contested to searched_gap; its disputed_by list removed (the two positions were not shown to be opposed and the claim is outside the Rekhmire question). (6) rekhmire-sp20a-older-than-ramses is now synthetic, judgment, with its assumption visible; its round-1 sentence 'some centuries before the 19th Dynasty' was wrong on the dates reported (about 1425 or 1415 BC against 1290 or 1315 BC for Ramesses II's accession, over a century) and is replaced.
      (7) The L-03 disclosure stands: on 2026-10-14 the Met Open Access API was reached with a descriptive user agent after a bot-check page; the owner may judge whether that counts as getting round a block. In round 2 no blocked host was retried or bypassed; each was asked once. (8) The key points of the assessment were shortened to 170 characters or fewer. (9) transmission step tx-rk-04 is marked UNVERIFIED (its date is from another dig's file; its text from claim lines only). (10) rekhmire-sp01c now states the three career ranges as printed and no longer says 'by roughly 25 to 70 years'.
      Also corrected: rekhmire-sp03-scene-dated-1470-1445 had anchor type `interpretive` and now has `search-record`; transmission tx-rk-02 called Breasted's Hebrews remark a 'heading note' but it is body text of section 756; the manifest entry for Kitchen no longer carries the words about the Exodus angle and doctrinal control (a plain research task replaces them). Adoption weights: round 1 gave numbers with notes such as 'standard in every summary seen', which had no read basis; they are now the placeholder 1 with 'Not measured'.
  - id: L-10
    date: 2026-10-16
    entry: >
      WHAT THE SIGNS ANSWER, AND WHAT THEY DO NOT. The checklist asked for the label signs to be read: whether any label names a people or uses a word for 'slave' or 'servant', and Breasted section 758's 'conquered' against Urk. IV. The dig opened Sethe's autograph pages and could identify many signs, but could not transliterate the labels with confidence and records no sign-level reading. Therefore these two questions remain open and are recorded as claim rekhmire-labels-sign-level-unread (searched_gap) with the next step: a reader of hieroglyphs on Urk. IV 1152-1153 (page images stored).
      What was read from the edition is Sethe's own German wording: the brickmaking section is D 'Die Bau- und Steinmetzarbeiten' (p. 1151), its first row is 'Bauarbeiten', one label (d, p. 1153) is headed 'Die Ziegel werden von Ausländern hergestellt', and captives assigned to the Amun temple are described in other scenes (pp. 1102, 1146-1147). Sethe's headings contain no people's name and no 'Sklave' on the pages viewed (searched_gap rekhmire-sethe-headings-vocabulary-absence). These are Sethe's readings of copies by Newberry, Virey, Lepsius and Hay and are not an independent view of the wall.
      Independence: Newberry, Breasted, Kitchen and Sethe read copies of one wall; Breasted worked from Newberry's plates and Virey; so agreement among them is not corroboration and the check level is `no` for claims about the label's sense and the workers' peoples. It is `primary` only where the claim rests on a copy or document viewed directly and says so: the scene is a brickmaking scene (sp02a, copies viewed), the labels are Egyptian writing (sp19d), what Sethe's headings print, and what Newberry, Breasted and Davies printed.
  - id: L-11
    date: 2026-10-16
    entry: >
      CHRONOLOGY (review checklist 4). Aston 2013 was read and the schemes recorded with named holders in claim rekhmire-reign-dates-schemes: Krauss 2007 (Thutmose III 1479-1425 BC, Amenophis II 1425-1400), Krauss and Warburton 2009 (1468-1415, 1415-1389; Aston reports Krauss no longer believes in it), Schneider 2010 (1476-1422 with amendments to 1479-1425), the 2010 radiocarbon model of Bronk Ramsey and others (accession of Thutmose III 1494-1483 at the 68% interval) with a 2013 extension (1496-1477), and Huber (accession 1504 BC). All figures are as Aston reports them: the original tables were not opened, so this is one reporter's account and the weights stay low.
      The claim that the scene dates to 1470-1445 BC remains absence-anchored (no date for the scene in any text read). rekhmire-absolute-chronology-gap stays open for the chronology volumes themselves.
  - id: L-12
    date: 2026-10-16
    entry: >
      FUNDING AND CONTROL (review checklist 5), recorded only where a source read states it. Tyndale Bulletin: the publisher's page (read 2026-10-16) calls it 'the journal of Tyndale House, Cambridge, a UK-based research institute and residential library dedicated to biblical scholarship'; Tyndale House's own page says its charitable purpose is 'to advance the evangelical Christian religion through promoting evangelical biblical scholarship and research' and invites gifts. These are present-day statements; who published and funded the Bulletin in 1976 and how Tyndale House was funded then were not read.
      Newberry 1900: the preface and dedication read name no funder. Breasted 1906: the title page and front matter read name the University of Chicago Press and the general editor only. Sethe 1909: the title page names the series editor and the publisher only. Metropolitan Museum: the facsimile's credit line reads 'Rogers Fund, 1930'; what the Rogers Fund is, and who funded the Egyptian Expedition and Davies's work, were not found in the Bulletin issues searched. Aston 2013: not stated in the pages read.
      Each remaining item is an open research task in the manifest, not a finding: who funded Newberry's copying and Constable's list; funders of the Ancient Records series; the 1976 publisher and funders of the Tyndale Bulletin; the Rogers Fund and the Egyptian Expedition; the series Urkunden des aegyptischen Altertums. No claim in this dig depends on funding or control.
  - id: L-13
    date: 2026-10-16
    entry: >
      STATE AT THE END OF ROUND 2, AND OWNER DECISIONS. The dig has a draft headline (headline_status draft; rekhmire-captive-label-text is proposed at low confidence, so it cannot be published as a headline), a timeline, and a taxonomy proposal in PROPOSED_TAXONOMY.yaml (build/taxonomy.yaml is owner-only and was not edited; the validator and review_dig.py report the missing taxonomy entry until the owner decides).
