      type: interpretive
      description: >
        The label is translated 'captives brought by his Majesty (i.e. Thothmes III.) for the works of the temple of Amen' (Newberry 1900 p. 38), 'Captivity which his majesty brought, for the works of the temple of Amon' (Breasted 1906 section 759),
        and 'Spoils (=captives) brought by His Majesty (=Tuthmosis III) for the work of the temple of his father [Amun]' (Kitchen 1976 n. 19). The word 'slaves' appears in Newberry in two places: his doubtful rendering 'slaves (?)' of a different, long label line (p. 38) and his own introduction (p. 19),
        see rekhmire-newberry-slaves-wording; Breasted renders that long line differently ('conquered', with a query, see rekhmire-breasted-conquered-rendering). Davies uses 'slave' for Syrians in Egypt generally and for women in another row of the tomb (rekhmire-davies-1930-slave-wording).
        Sethe's headings call the people of other scenes 'Gefangene' and, in the contents list, 'Leibeigene' (rekhmire-sethe-captives-assigned-temple-other-scene), and the brickmakers 'Ausländer'.
      sources: [src-newberry-1900, src-breasted-are2, src-kitchen-1976, src-urk-iv, src-met-bulletin-1930-12]
    basis: >
      # V: read 2026-10-14 and 2026-10-16. The label text read says captives or spoils; 'slaves' is a word of the commentators (Newberry's gloss and doubtful rendering; Davies for other figures). Whether captives of war working for a temple were slaves, and how an ancient Egyptian would have put it, is not addressed in the pages read.
      Round 1 wrote that the only 'slaves' in the pages read was Newberry's doubtful rendering; Newberry's p. 19 gloss was missed and is added here (log L-08).

  - id: rekhmire-captive-label-text
    state: proposed
    statement: "A label over a group in the scene is translated as saying the workers are captives brought by the king for the works of the temple of Amun."
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured (placeholder 1)."
    would_change_if: "the signs of the label, read from the wall, Urk. IV or Davies, give a different sense or name a people"
    anchor:
      type: interpretive
      description: >
        Newberry 1900 p. 38: 'The horizontal lines of hieroglyphs over the next group to the right inform us that the workers are "captives brought by his Majesty (i.e. Thothmes III.) for the works of the temple of Amen."'
        Breasted 1906 section 759 'By Brickmakers: Captivity which his majesty brought, for the works of the temple of Amon.' (with a footnote that these words are in Virey's copy but were lost before Newberry's was made).
        Kitchen 1976 n. 19: 'Or, over a Syrian, "Spoils (=captives) brought by His Majesty (=Tuthmosis III) for the work of the temple of his father [Amun]"'.
        Sethe's edition prints the labels of this scene in hieroglyphs (pp. 1152-1153) with the heading for the last of them 'Die Ziegel werden von Ausländern hergestellt'; the dig did not transliterate those signs, so Sethe's page is not counted as a fourth translation.
