    anchor:
      type: interpretive
      description: >
        Newberry 1900 p. 37: 'The horizontal lines of hieroglyphs over the next group to the right inform us that the workers are "captives brought by his Majesty (i.e. Thothmes III.) for the works of the temple of Amen."'
        Breasted 1906 section 759 'By Brickmakers: Captivity which his majesty brought, for the works of the temple of Amon.' (with a footnote that these words are in Virey's copy but were lost before Newberry's was made).
        Kitchen 1976 n. 19: 'Or, over a Syrian, "Spoils (=captives) brought by His Majesty (=Tuthmosis III) for the work of the temple of his father [Amun]"'.
      sources: [src-newberry-1900, src-breasted-are2, src-kitchen-1976]
    basis: >
      # V: three translations read 2026-10-14; they agree in substance. Not independent: Breasted used Newberry's plates and Virey's copy. The signs were not read; the footnote shows part of the label was already damaged by 1900.
      Kitchen's 'over a Syrian' attaches the label to a Syrian figure but does not give a source beyond note 17.

  - id: rekhmire-people-identification-basis
    state: contested
    statement: "The identification of the brickmaking workers as particular peoples (Semitic or Levantine, Nubian) rests on how commentators read the figures, not on a label naming a people in the pages read."
    statement_kind: judgment
