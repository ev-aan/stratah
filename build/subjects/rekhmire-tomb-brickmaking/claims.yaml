subject: rekhmire-tomb-brickmaking
title: "The brickmaking scene in the Tomb of Rekhmire (TT 100, Thebes): what the labels say, who the workers are, and what Dead Hidden says it shows"
question: "Does the Rekhmire brickmaking scene label its workers as captives or slaves, who are they (Nubian, Asiatic), and what dates the scene?"
dig_status: open
headline_status: draft
search_summary: >
  The tomb of the vizier Rekhmire at Thebes has a painted scene of brickmakers at work on a storehouse at Karnak. Two printed translations (Newberry 1900, Breasted 1906)
  render a label as "captives" the king brought for the works of the temple of Amun. Breasted calls some of the workers "clearly Semitic foreigners"; a 1976 article
  (Kitchen) says Syrians, Nubians and Egyptians. No label read names Hyksos, Hebrews or "slaves" for the brick workers, and the scene carries no date in the translations read.
  The wall, its signs and Davies's 1943 publication were not read.
description: >
  First dig on this scene. Read: Newberry, Life of Rekhmara (1900), Breasted, Ancient Records of Egypt II (1906, sections 663-664, 755-759), Kitchen, From the Brickfields
  of Egypt (Tyndale Bulletin, 1976), all as text (OCR or PDF text), and the Met's record and web image of a facsimile of the brickmakers panel (30.4.77). One page of Newberry's
  outline tracing was viewed. Not read: the wall, any hieroglyphic edition (Urk. IV), Davies 1935/1943, Virey 1889. Blocked: Heidelberg's copy of Newberry (bot check), the Met web page (HTTP 429).
  Six Dead Hidden speaker claims (dh-HN0wNVpfunM-01, -02, -03, -06, -19, -20) are split into separate parts and kept in the speaker's words. Books, translations and videos are all claims here,
  none is primary data.
divergence_note: >
  The speaker's version: Nubian and Levantine slaves, enslaved in Egypt from 1550 BC to about 1450 BC, made mud bricks, Hyksos among them, and the tomb walls record it, dated 1470-1445 BC.
  What the translations read say is narrower: a scene of the vizier inspecting temple works at Karnak, in which workers are labelled captives (or "captivity") brought by the king (Thutmose III per
  Newberry) for the temple of Amun, with Egyptian overseers. Two commentators name peoples (Breasted: some clearly Semitic; Kitchen: Syrians, Nubians, Egyptians) without giving the basis in the pages read.
  Breasted adds that this is "precisely what was afterward exacted of the Hebrews", which is his own comparison, not a label. The translations name no Hyksos, no 1550 BC and no date for the scene.
  The gap between the speaker's wording and the printed translations is the product here. What the signs show and how the peoples were identified remain unread.

assessment:
  question: "Does the Rekhmire brickmaking scene label its workers as captives or slaves, who are they (Nubian, Asiatic), and what dates the scene?"
  answer: partly
  headline: "Translations read call the brick workers captives brought by the king; some commentators name Semitic, Syrian and Nubian workers; no date for the scene itself was found."
  text: >
    Three printed works (Newberry 1900, Breasted 1906, Kitchen 1976) agree that a label calls the workers captives brought by the king for the work of the temple of Amun at Karnak. None of the
    three is the wall. Peoples are named by two of them (Semitic or Syrian; Nubian only by Kitchen) with no basis shown in the pages read. "Slaves" is the speaker's word; Newberry prints "slaves (?)" for a different line
    that he marks as uncertain. The Hyksos, the date 1550 BC and the range 1470-1445 BC are not in any text read. The tomb is placed in the career of the vizier, which the works read date between about 1479 and 1425 BCE.
  basis: [rekhmire-sp02d-slaves, rekhmire-captive-label-text, rekhmire-people-identification-basis]
  key_points:
    - "Three printed works read translate a label as captives (or spoils) brought by the king for the works of the temple of Amun; none is the wall, and no sign was read here."
    - "Breasted calls some workers clearly Semitic and Kitchen says Syrians, Nubians and Egyptians; no basis is given in the pages read, and no label read names a people or the Hyksos."
    - "No date for the scene itself was found; the works read date Rekhmire's career between about 1479 and 1425 BCE, not 1470-1445 or about 1400."
  would_settle: "Reading the label signs on the wall, in Sethe's Urkunden IV or in Davies's 1935 and 1943 plates, and finding what Davies says about the workers' origins."

