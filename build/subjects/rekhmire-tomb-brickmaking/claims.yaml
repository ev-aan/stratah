subject: rekhmire-tomb-brickmaking
title: "The brickmaking scene in the Tomb of Rekhmire (TT 100, Thebes): what the labels say, who the workers are, and what Dead Hidden says it shows"
question: "Does the Rekhmire brickmaking scene label its workers as captives or slaves, who are they (Nubian, Asiatic), and what dates the scene?"
dig_status: open
headline: "Translators read Rekhmire's brickmaker label as captives brought by the king for Amun's temple"
headline_claim: rekhmire-captive-label-text
headline_status: draft
search_summary: >
  The tomb of the vizier Rekhmire at Thebes has a painted scene of brickmakers at work on a storehouse at Karnak. Three translators (Newberry 1900, Breasted 1906, Kitchen 1976)
  render a label as captives, captivity or spoils that the king brought for the works of the temple of Amun. Sethe's hieroglyphic edition (1909) heads one label "The bricks are made by foreigners".
  Breasted calls some of the workers clearly Semitic; Kitchen says Syrians, Nubians and Egyptians; Newberry says many are certainly foreigners. Newberry glosses the temple's prisoners as slaves.
  The label signs were not transliterated, and no source read dates the scene itself.
description: >
  Round 2 (2026-10-16). Round 1 read three works and a museum record as text. Round 2 opened the hieroglyphic edition (Sethe, Urkunden der 18. Dynastie IV, 1909, pp. 1101-1102 and 1146-1155,
  page images viewed and the German headings typed out), Newberry's plates XIX-XXI (outline tracings), the Newberry text again (p. 19 and pp. 37-38 with the page break located), Aston's 2013
  paper reporting the competing chronologies, and Davies's 1930 essay in the Metropolitan Museum Bulletin on how far Egyptian pictures of foreigners can be trusted. The hieroglyphs were viewed
  and not transliterated, so no claim here rests on a sign read by this dig. Not opened: Davies 1943 and 1935, Virey 1889 (blocked or not found), Lepsius's plates, the original chronology tables.
  Six Dead Hidden speaker claims (dh-HN0wNVpfunM-01, -02, -03, -06, -19, -20) are kept split into separate parts in the speaker's words. Books, translations and videos are claims here, none is the wall.
divergence_note: >
  The speaker's version: Nubian and Levantine slaves, enslaved in Egypt from 1550 BC to about 1450 BC, made mud bricks, Hyksos among them, and the tomb walls record it, dated 1470-1445 BC.
  What the sources read say is narrower. A scene of the vizier inspecting temple works at Karnak includes brickmakers, and a label over a group of them is translated as captives (captivity, spoils)
  brought by the king for the temple of Amun (the king is Thutmose III in Newberry's and Kitchen's wording). Sethe's editorial heading calls them foreigners. Three commentators name peoples differently
  (Breasted: some clearly Semitic; Kitchen: Syrians, Nubians and Egyptians; Newberry: many certainly foreigners) and none gives the basis in the pages read. The word slaves is used by Newberry (his own gloss on
  the temple's prisoners, and a doubtful rendering of another label line) and by Davies for Syrians in Egypt generally; the label translations read say captives, captivity or spoils. The Hyksos, 1550 BC and a date for the scene
  are in no text read. Dates for the reign of Thutmose III differ between published schemes by up to some thirty-five years. The gap between the speaker's wording and the printed texts is the product here.
  What the label signs themselves say remains unread.

assessment:
  question: "Does the Rekhmire brickmaking scene label its workers as captives or slaves, who are they (Nubian, Asiatic), and what dates the scene?"
  answer: partly
  headline: "Translators read the label as captives brought by the king for Amun's temple; the workers' peoples, any slave status and the scene's date are not settled in what was read."
  text: >
    Three translators (Newberry 1900, Breasted 1906, Kitchen 1976) agree in substance that a label in the brickmaking scene calls the workers captives (captivity, spoils) brought by the king for the works of the temple of Amun.
    They share the same wall copies, so they are one line of evidence, and the signs were not transliterated here. Sethe's hieroglyphic edition (1909) was opened: it prints the scene as the building works of the vizier's
    temple inspection and heads one label "the bricks are made by foreigners" without naming a people. Peoples are named by three commentators differently, and none states a basis in the pages read. "Slaves" appears in Newberry
    as his own gloss on the temple's prisoners and as a doubtful rendering of one label line, and in Davies's 1930 essay for Syrians in Egypt and for women in a different row of the tomb; the label translations read say captives, captivity or spoils.
    No label date and no Hyksos or 1550 BC was found in the texts read, which is an absence in translations and headings, not in the signs. Published chronologies place the reign of Thutmose III (in whose later years and the early
    reign of Amenhotep II Rekhmire held office) between about 1504 and 1468 BC at the start, so any BC date for the scene depends on the scheme chosen.
  basis: [rekhmire-captive-label-text, rekhmire-sethe-heading-bricks-by-foreigners, rekhmire-people-identification-basis, rekhmire-sp02d-slaves, rekhmire-newberry-slaves-wording, rekhmire-labels-sign-level-unread, rekhmire-sp03-scene-dated-1470-1445, rekhmire-reign-dates-schemes]
  key_points:
    - "Three translators read the label as captives brought by the king for Amun's temple; they share the same wall copies, and this dig did not transliterate the signs."
    - "Authors name the workers differently (Semitic; Syrians, Nubians, Egyptians; foreigners); 'slaves' is Newberry's gloss, while the label translations say captives."
    - "No scene date was found in what was read; schemes start Thutmose III's reign between about 1504 and 1468 BC, so any BC date for the scene depends on the scheme."
  would_settle: "A reader of hieroglyphs transcribing the labels (Urk. IV 1152-1153; Davies 1943 pls. 58-60) and Davies's stated basis for naming the workers' peoples."

