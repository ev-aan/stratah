  - id: rekhmire-reign-dates-schemes
    state: contested
    statement: "Published schemes put the reign of Thutmose III, in whose later years and the early reign of Amenhotep II Rekhmire held office, at different absolute dates: 1479-1425 BC (the conventional low chronology, Krauss 2007), 1468-1415 BC (Krauss and Warburton 2009), an accession between 1494 and 1483 BC at the 68% interval (the 2010 radiocarbon model), and an accession in 1504 BC (Huber), all as reported by Aston 2013."
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured. Aston writes of Krauss and Warburton's 1468 scheme that it 'has not found much favour' (his words); that is his statement, not a count."
    would_change_if: "the original tables (Krauss 2007, Krauss and Warburton 2009, Bronk Ramsey and others 2010, Huber 2011) are opened and differ from Aston's reproduction, or a source dates the scene itself"
    disputed_by:
      - {who: "R. Krauss, 2007 (an Egyptian chronology for Dynasties XIII to XXV)", kind: person, position: "Thutmose III 1479-1425 BC, Amenophis II 1425-1400 BC; Aston calls this the conventional low chronology.", source_read: src-aston-2013, via: "the table headed 'KRAUSS 2007', p. 292"}
      - {who: "R. Krauss and D. A. Warburton, 2009 (The basis for the Egyptian dates)", kind: person, position: "Thutmose III 1468-1415 BC, Amenophis II 1415-1389 BC. Aston adds that in a letter of October 2012 Krauss told him he no longer believes in this chronology.", source_read: src-aston-2013, via: "the table headed 'KRAUSS and WARBURTON, 2009', p. 297, and the sentence after it"}
      - {who: "Th. Schneider, 2010", kind: person, position: "Thutmose III 1476-1422 BC with amendments in brackets that bring it back to 1479-1425 BC.", source_read: src-aston-2013, via: "the table headed 'SCHNEIDER 2010', p. 297"}
      - {who: "C. Bronk Ramsey and others, Science 328 (2010)", kind: group, position: "Accession of Thutmose III between 1494 and 1483 BC at 68% and between 1498 and 1474 BC at 95%; accession of Amenophis II between 1441 and 1431 BC at 68%. A 2013 extension (Quiles and others) gives Thutmose III between 1496 and 1477 BC at 68%. Aston says the 2010 result was 'summarily dismissed' by Huber.", source_read: src-aston-2013, via: "the tables 'A) Radiocarbon Dates, 2010' (p. 290) and 'B) Radiocarbon Dates, 2013' (p. 291)"}
      - {who: "P. J. Huber, 2011 (The astronomical basis of Egyptian chronology of the second millennium BC)", kind: person, position: "Year 1 of Thutmose III in 1504 BC and Year 1 of Ramesses II in 1315 BC, as Aston reports; Aston writes that he places no faith in Huber's chronology.", source_read: src-aston-2013, via: "p. 291 and note 12"}
