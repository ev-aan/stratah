      - {who: "J. H. Breasted, Ancient Records of Egypt II (1906)", kind: person, position: "'Some of these are clearly Semitic foreigners' (note g to section 758); 'the Semitic foreigners, who appear among the brickmakers' (section 756).", source_read: src-breasted-are2, via: "sections 756-758"}
      - {who: "K. A. Kitchen, Tyndale Bulletin (1976)", kind: person, position: "'A mixed group of workers (Syrians, Nubians, Egyptians)'; no basis stated beyond citing Davies 1943 and 1935 (n. 17).", source_read: src-kitchen-1976, via: "p. 140 and n. 17"}
    anchor:
      type: interpretive
      description: >
        Read as text: Newberry 1900 p. 37, Breasted 1906 sections 756-758 and note g, Kitchen 1976 p. 140 and nn. 17, 19. The one image viewed (Met facsimile 30.4.77) shows figures with different skin tones, hair and dress, but the dig did not classify them: it has no stated convention to apply.
      sources: [src-newberry-1900, src-breasted-are2, src-kitchen-1976, src-met-facsimile-30-4-77]
    basis: >
      # V: read 2026-10-14. The three positions are not in conflict about whether foreigners are present; they differ in how far they name peoples and none gives the basis. This claim records that gap.
      Not a finding that the identifications are wrong.

