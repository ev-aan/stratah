  - id: rekhmire-sp02a-scene-shows-brickmaking
    state: proposed
    statement: "A scene on the wall of his tomb shows ... making brick blocks in Egypt."
    speaker_claim: {id: dh-HN0wNVpfunM-02, as_stated: "A scene on the wall of his tomb shows Nubian slaves and Levantine slaves making brick blocks in Egypt.", cites: "tomb of Rekhmire"}
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 5
    adoption_note: "Famous and often reproduced (Kitchen: 'popular reproductions are legion'); the weight here is from the descriptions read and one facsimile image."
    would_change_if: "the wall, the Davies plates or Urk. IV show the figures are doing something other than brickmaking"
    anchor:
      type: interpretive
      description: >
        Newberry 1900 p. 37 ('men ... engaged in making bricks ... digging up earth with hoes, mixing it with water, and pressing out bricks with wooden moulds') ; Breasted 1906 sections 756-759 (brickmakers, bricklayers, builders at work);
        Kitchen 1976 p. 140 ('draw large jarfuls of water from a pool, mix water and clay with their hoes, and mould ... row upon row of bricks'). The Met facsimile image 30.4.77 was viewed: men carry and handle bricks and work with a hoe-like tool at a brick wall.
        The scene is in the tomb at Thebes (Karnak temple works), not the Delta, as Kitchen notes (p. 140).
      sources: [src-newberry-1900, src-breasted-are2, src-kitchen-1976, src-met-facsimile-30-4-77]
    basis: >
      # V: three descriptions read as text, one facsimile image viewed 2026-10-14 (a modern painted copy, not the wall). They are descriptions of the same panel by authors who knew each other's plates.
      The scene is real and described alike; the speaker's wording about who the workers are and their status is taken up in the next claims.

