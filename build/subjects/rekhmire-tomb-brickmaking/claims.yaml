  - id: rekhmire-sp02a-scene-shows-brickmaking
    state: established
    statement: "A scene on the wall of his tomb shows ... making brick blocks in Egypt."
    speaker_claim: {id: dh-HN0wNVpfunM-02, as_stated: "A scene on the wall of his tomb shows Nubian slaves and Levantine slaves making brick blocks in Egypt.", cites: "tomb of Rekhmire"}
    statement_kind: reported
    evidence_class: material
    confidence: moderate
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Not measured (placeholder 1). Kitchen writes that popular reproductions are legion; that is his remark, not a count."
    would_change_if: "the wall, the Davies plates or a reader of the signs show the figures are doing something other than brickmaking"
    anchor:
      type: material
      description: >
        Copies of the wall, viewed: Sethe 1909, Urk. IV pp. 1151-1155 (hand-copied hieroglyphs with German headings, page images stored): section D 'Die Bau- und Steinmetzarbeiten', sub-headings 'Bauarbeiten', 'Bei Leuten, die Erde am Fusse der Rampe ausschütten und Ziegel dazu herbeitragen' and 'Die Ziegel werden von Ausländern hergestellt';
        Newberry 1900 plates XIX-XXI (outline tracing of the scene, PDF pages 102-108 of the Internet Archive scan: a brick ramp, men carrying brick loads on yokes and in baskets) and his text p. 38 ('digging up earth with hoes, mixing it with water, and pressing out bricks with wooden moulds');
        the Met facsimile image 30.4.77 (men at a brick wall). Breasted 1906 sections 756-759 and Kitchen 1976 p. 140 describe the same panel. This is a statement about copies and descriptions of the painting, not about the wall seen.
        The scene is in the tomb at Thebes (Karnak temple works), not the Delta, as Kitchen notes on p. 140.
      sources: [src-urk-iv, src-newberry-1900, src-met-facsimile-30-4-77, src-breasted-are2]
    basis: >
      # V: Sethe's pages 1151-1155 and Newberry's plate pages viewed 2026-10-16; Newberry text, Breasted and Kitchen read as text 2026-10-14. Several independent-in-time copyists (Newberry, Sethe's cited Virey and Lepsius copies, Davies's facsimile) show the same scene,
      but they are copies of one wall; the wall was not seen. Weight lowered from 4 to 3 in the fix round (log L-14): the copyists are copies of one wall, not independent evidence of it, and the wall was not seen. `established` here means only that the scene is a brickmaking and building scene, not anything about the workers' peoples or status (taken up in the next claims).

