  - id: rekhmire-sp20a-older-than-ramses
    state: proposed
    statement: "The bas-relief is much older than Ramses;"
    speaker_claim: {id: dh-HN0wNVpfunM-20, as_stated: "The bas-relief is much older than Ramses; Ramses may have put his name on something already existing, as he is known to have done often, and the city was destroyed by a flood and moved; construction was underway in both his cities before him.", cites: "speaker's reasoning"}
    statement_kind: judgment
    evidence_class: synthetic
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured (placeholder 1)."
    would_change_if: "a dated reading of the scene's painting puts it after the 18th Dynasty (it would then not be Rekhmire's), or a chronology read directly puts Ramesses II closer to Thutmose III than the schemes reported by Aston do"
    anchor:
      type: synthetic
      description: >
        Our comparison, resting on an assumption. The scene is a painting on plaster, not a relief (Newberry 1900 p. 37 'a painting'; p. 38 'painted plaster'; Met 'Tempera on Paper' for its copy). 'Ramses' is not specified by the speaker; we take Ramesses II (or any 19th Dynasty Ramesses).
        Dates: Kitchen 1976 puts Papyrus Anastasi III in the time of Merenptah, 'c. 1220 BC' (p. 140), and Rekhmire 'c. 1450 BC'; Aston 2013 (pp. 292 and 297) tabulates schemes, and the comparison is made inside each scheme, not across them: Krauss 2007, Thutmose III ends 1425 BC and Ramesses I reigns 1292-1291 BC (Ramesses II follows); Krauss and Warburton 2009, Thutmose III ends 1415 BC and Sety I ends 1279 BC (Ramesses II follows);
        Schneider 2010, Thutmose III ends 1422 BC and Ramesses II begins 1290 BC; Aston's second scenario that keeps 1479 BC, Thutmose III ends 1425 BC and Ramesses II begins 1294 BC. Arithmetic per scheme (end of Thutmose III to Ramesses II's accession): Krauss 2007, 1425 to 1279 BC (Aston p. 291: 'a low chronology of 1479 and 1279 BC' for year 1 of Thutmose III and of Ramesses II) = 146 years; Krauss and Warburton 2009, 1415 to 1279 = 136 years; Schneider 2010, 1422 to 1290 = 132 years; Aston's second scenario, 1425 to 1294 = 131 years. The range is 131-146 years; as a summary, in each of the four the gap is more than a century. Huber's figures (Thutmose III from 1504 BC, Ramesses II from 1315 BC) give no end year for Thutmose III in the pages read, so no comparison is made for them.
        That is our arithmetic on reported dates and on the assumption that the scene was painted within Rekhmire's career; round 1 wrote 'some centuries', which these figures do not support (log L-09). A first version of this round-2 text paired end dates and start dates from different schemes; log L-14 corrects that.
      sources: [src-newberry-1900, src-kitchen-1976, src-met-facsimile-30-4-77, src-aston-2013]
    basis: >
      # V: read 2026-10-14 and 2026-10-16. The speaker's word 'bas-relief' is kept; the sources read describe a painting. The comparison is a calculation by this dig on reported dates and is `synthetic`; it is not a finding about any reading of the tomb.
    assumptions:
      - {text: "'Ramses' means Ramesses II (or any 19th Dynasty Ramesses), and the scene was painted within Rekhmire's career", if_wrong: "If the speaker meant Ramesses III (20th Dynasty), the gap is larger and the claim still holds; if the scene was repainted under a later king, the claim fails."}

