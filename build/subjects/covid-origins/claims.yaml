        holder: "Crits-Christoph et al."
        ground: "Wildlife DNA was in all SARS-CoV-2-positive samples from that stall; genotypes prioritise hosts to test."
      - label: "Not shown"
        holder: "Bloom"
        ground: "Samples with the most viral reads are not the ones rich in non-human mammal DNA."
    basis: "A shortlist, not an identification, by the authors' own description."

