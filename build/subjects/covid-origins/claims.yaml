  - id: co-wiv-illness-official-record
    state: established
    statement_kind: reported
    statement: >
      Official US statements on sick WIV researchers narrowed over time. The State Department (15 Jan 2021) said it had
      "reason to believe that several researchers inside the WIV became sick in autumn 2019 ... with symptoms consistent
      with both COVID-19 and common seasonal illnesses". ODNI 2021 called this "not diagnostic". ODNI 2023 said "We have
      no indications that any of these researchers were hospitalized because of the symptoms consistent with COVID-19",
      that some symptoms were not consistent with COVID-19, and that the information "neither supports nor refutes
      either hypothesis".
    evidence_class: primary_text
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: indirectness, effect: down1, reason: "These are official characterisations of unpublished intelligence; no names, dates or records are given."}
    evidential_weight: 3   # of 5
    anchor_checked: primary
    adoption_weight: 4   # of 5
    adoption_note: "The claim is on a White House page (2025) and in the House majority report; see co-wiv-researchers-infected-2019."
    would_change_if: WIV occupational-health records or stored sera are independently reviewed
    anchor:
      type: official-statements
      description: >
        State Department fact sheet, 15 Jan 2021 (Wayback copy); ODNI Updated Assessment ("not diagnostic of the
        pandemic's origins. Even if confirmed, hospital admission alone would not be diagnostic of COVID-19
        infection"); ODNI June 2023 ("One researcher may have been hospitalized in this timeframe for treatment of a
        non-respiratory medical condition"). WIV side: the WHO-China report records, from lab representatives, a staff
        health monitoring programme "with no reporting of COVID-19 compatible respiratory illness" and no serological
        evidence of infection; SAGO says no occupational health records, audits or absenteeism reports were provided
        [read].
      accessible: true
      sources: [src-state-wiv-factsheet-2021, src-odni-2021-updated, src-odni-2023-wiv, src-who-china-2021, src-sago-2025]
    basis: >
      Names and diagnoses appear only in press reports that were not verified and are not repeated here. The same
      fact sheet also says: "We have not determined whether the outbreak began through contact with infected animals or
      was the result of an accident at a laboratory in Wuhan."

