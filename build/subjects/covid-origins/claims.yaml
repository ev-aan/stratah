  # =====================================================================
  # C. THE LABORATORY-RELATED SIDE
  # =====================================================================

  - id: co-lab-hypothesis
    state: contested
    statement_kind: judgment
    statement: >
      The first human infection with SARS-CoV-2 was the result of a laboratory-associated incident (experimentation,
      animal handling or sampling) connected with the Wuhan Institute of Virology.
    evidence_class: interpretive
    confidence: low
    confidence_reasons:
      start: high
      steps:
        - {domain: indirectness, effect: down2, reason: "No document read shows that a laboratory held, made or released SARS-CoV-2 or a progenitor; the case rests on location, practice, a 2018 proposal and a sequence feature."}
    evidential_weight: 2   # of 5; circumstantial; weighed at the same standard as co-zoonosis-hypothesis, which has direct measurements at its putative site
    anchor_checked: primary
    adoption_weight: 4   # of 5
    adoption_note: >
      FBI (moderate, per press), DOE (low, per press) and, per a CIA spokesperson in Jan 2025, the CIA (low), the House
      Select Subcommittee majority (2024), Senate HELP minority staff (2022) and a White House page (2025) favour it;
      the confidence levels in the 2023 US text are redacted. Adoption, not evidence.
    would_change_if: >
      a laboratory record, sample or sequence shows SARS-CoV-2 or a progenitor was held there, or an infected laboratory
      worker is documented, or a natural progenitor and host are found
    disputed_by:
      - {who: "Democratic staff of the House Select Subcommittee", kind: institution, position: "Arguments for a lab origin are largely circumstantial but cannot be dismissed out of hand; impossible to draw conclusions without WIV records", source_read: src-house-dem-2024}
      - {who: "WHO SAGO", kind: institution, position: "No evidence other than speculation supports a laboratory-related incident; it cannot be ruled out without the requested information", source_read: src-sago-2025}
      - {who: "American Society for Microbiology", kind: institution, position: "Not enough available evidence to support the HELP staff report's overarching conclusion", source_read: src-asm-2022}
    anchor:
      type: official-reports-and-documents
      description: >
        ODNI June 2023 (read): "no indication that the WIV's pre-pandemic research holdings included SARS-CoV-2 or a
        close progenitor, nor any direct evidence that a specific research-related incident occurred"; "Some WIV
        researchers probably did not use adequate biosafety precautions at least some of the time"; as of January 2019
        WIV researchers performed SARS-like coronavirus experiments in BSL-2 laboratories. DEFUSE proposal text (read):
        co-defuse-text-fcs-plan. Furin site: co-fcs-unique-among-sarbecoviruses.
      accessible: true
      sources: [src-odni-2023-wiv, src-defuse, src-sago-2025, src-house-dem-2024, src-asm-2022]
    positions:
      - label: "Yes (what exists)"
        holder: "FBI; DOE; CIA (2025); House majority; HELP minority staff"
        ground: "Wuhan has the coronavirus laboratory; biosafety practice was not always adequate; the furin site is unusual; a 2018 proposal planned furin-site work."
      - label: "Not shown"
        holder: "SAGO; House Democrats; ASM; most US agencies (low confidence)"
        ground: "No record of a held progenitor or an incident; the records that could show it are closed."
    basis: >
      Filed as contested at low confidence, at the same standard as the natural hypothesis. Weight 2 and not 3 because
      the case is circumstantial: it measures the setting, not the virus.

  - id: co-odni-2023-wiv-findings
    state: established
    statement_kind: reported
    statement: >
      The US Intelligence Community's June 2023 report on the Wuhan Institute of Virology states that, as of January
      2019, WIV researchers performed SARS-like coronavirus experiments in BSL-2 laboratories; that some researchers
      probably did not always use adequate biosafety precautions; that it has no indication WIV's pre-pandemic holdings
      included SARS-CoV-2 or a close progenitor, no direct evidence of a specific research-related incident and no
      knowledge of a specific biosafety incident that spurred the pandemic; and that WIV scientists have genetically
      engineered coronaviruses with common laboratory practices, with no information that this involved SARS-CoV-2, a
      close progenitor or a backbone close enough to be the source.
    evidence_class: primary_text
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: indirectness, effect: down1, reason: "The text records what the Intelligence Community states; the intelligence behind it is unpublished and its first words in each paragraph are redacted."}
    evidential_weight: 3   # of 5, for the underlying facts; the record of what it says is complete
    anchor_checked: primary
    adoption_weight: 4   # of 5
    adoption_note: "An official assessment; adoption is information, not evidence about the virus."
    would_change_if: the classified annex or the underlying reporting is released, or WIV records are reviewed
    anchor:
      type: official-report
      description: >
        ODNI report declassified 23 June 2023 (read): "We continue to have no indication that the WIV's pre-pandemic
        research holdings included SARS-CoV-2 or a close progenitor, nor any direct evidence that a specific
        research-related incident occurred involving WIV personnel before the pandemic that could have caused the COVID
        pandemic." "We do not know of a specific biosafety incident at the WIV that spurred the pandemic." "Some WIV
        researchers probably did not use adequate biosafety precautions at least some of the time prior to the pandemic
        in handling SARS-like coronaviruses". The report also says it "does not address the merits of the two most likely
        pandemic origins hypotheses" and that a classified annex is "consistent with the unclassified assessments".
      accessible: true
      sources: [src-odni-2023-wiv]
    basis: >
      These sentences are cited by both sides: the first and fourth against the lab hypothesis as proven, the second and
      third for its plausibility. Shown whole here.

  - id: co-defuse-text-fcs-plan
    state: established
    statement_kind: reported
    statement: >
      The 2018 DEFUSE proposal (EcoHealth Alliance to DARPA, requesting USD 14,209,245, with WIV and UNC Chapel Hill as
      partners) says that, where spike sequences lack cleavage sites, "we will introduce appropriate human-specific
      cleavage sites and evaluate growth potential in Vero cells and HAE cultures". The public text names no S1/S2
      position, gives no sequence, contains no SARS-CoV-2 sequence, and says the chimeric backbone work would be BSL-3.
    evidence_class: primary_text
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: risk_of_bias, effect: down1, reason: "Read in a third-party OCR copy of a file posted by a volunteer group; the key sentence matches the House report's quotation, but the DARPA or EcoHealth file was not compared."}
    evidential_weight: 4   # of 5
    anchor_checked: primary
    adoption_weight: 4   # of 5
    adoption_note: "Cited by both sides; the proposal's meaning is disputed (see co-defuse-shows-engineered)."
    would_change_if: the DARPA or EcoHealth holder copy differs from the third-party copy
    anchor:
      type: grant-proposal
      description: >
        DEFUSE main volume (read, OCR): "We will analyze all SARSr-CoV S gene sequences for appropriately conserved
        proteolytic cleavage sites in S2 and for the presence of potential furin cleavage sites. ... Where clear
        mismatches occur, we will introduce appropriate human-specific cleavage sites and evaluate growth potential in
        Vero cells and HAE cultures." Synthesised spike genes "designed for insertion into SHC014 or WIV16 molecular clone
        backbones ... These are BSL-3". Cover letter dated 24 March 2018; form field "Date proposal submitted: 3/27/18".
        Budget line: subcontract to Prof. Baric "to oversee reverse engineering of SARSr-CoVs".
      accessible: true
      sources: [src-defuse]
    basis: >
      What is not in the public text: "inserted at S1/S2", any SARS-CoV-2 sequence, and "BSL-2" (which appears only in
      drafts, see co-defuse-drafts). The final proposal was public from Sept 2021; the drafts were released by FOIA in
      Dec 2023 to Jan 2024.

