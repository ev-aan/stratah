    evidential_weight: 4   # of 5, for the refutation of the literal wording
    anchor_checked: primary
    adoption_weight: 3   # of 5
    adoption_note: "Stated as one of five 'strongest arguments' on a US government page (2025); not measured among the public."
    would_change_if: the claim is restated as not found in any other sarbecovirus, which co-fcs-unique-among-sarbecoviruses records as established
    anchor:
      type: papers
      description: >
        Furin cleavage sites occur naturally in other coronaviruses: Andersen 2020 ("other human betacoronaviruses,
        including HKU1 (lineage A), have those sites"); Coutard 2020 (present in other coronavirus groups); Wu and Zhao
        2021 ("occurred independently for multiple times in the evolution of the coronavirus family"). What is true is
        narrower: no known sarbecovirus has one at that location (co-fcs-unique-among-sarbecoviruses) [read].
      accessible: true
      sources: [src-andersen-2020, src-coutard-2020, src-wu-zhao-2021, src-whitehouse-lableak]
    positions:
      - label: "Yes (what is real)"
        holder: "White House page; House majority"
        ground: "No known sarbecovirus has a furin site at S1/S2."
      - label: "No"
