      lab-side case and leaves the narrower fact standing.

  - id: co-ratg13-records
    state: established
    statement_kind: reported
    statement: >
      RaTG13, the bat virus then closest to SARS-CoV-2, is 96.2 percent identical to it (Zhou et al., Nature, Feb 2020).
      GenBank records it as submitted by WIV on 27 January 2020 with a collection date of 24 July 2013 and released on
      24 March 2020, and replaced by a second version on 13 October 2020. The Nature paper gives no collection year, and
      WIV's November 2020 addendum discusses sera from four 2012 miners without linking them to RaTG13.
    evidence_class: primary_text
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: indirectness, effect: down1, reason: "The collection date is the submitter's entry; the SAGO chronology (ID4991, a 2018 renaming) is not in the addendum text and is not used."}
    evidential_weight: 4   # of 5
    anchor_checked: primary
    adoption_weight: 2   # of 5
    adoption_note: "Disputed dates are shown on the timeline; not measured."
    would_change_if: WIV releases the sample records and sequencing dates for RaTG13
    anchor:
      type: records
      description: >
        GenBank MN996532.1 (read): "Submitted (27-JAN-2020)", "/collection_date="24-Jul-2013"", "On Oct 13, 2020 this
        sequence was replaced by MN996532.2." Zhou et al. 2020: "overall genome sequence identity of 96.2%" and RaTG13
        "previously detected in Rhinolophus affinis from Yunnan province" [read]. The addendum (read) has 13 serum
        samples from 4 patients received 1 July to 1 October 2012 and confirmed not infected by SARS-CoV-2.
      accessible: true
      sources: [src-genbank-ratg13, src-zhou-2020-ratg13, src-zhou-2020-addendum]
    basis: A record of dates and what the documents do and do not connect.

