        HELP staff (read): "the hypothesis of a natural zoonotic origin no longer deserves the benefit of the doubt"; also
        that precedent "favors the hypothesis that a natural zoonotic spillover" and that PRC non-transparency "prevents
        reaching a more definitive conclusion". Marshall 2023 (read, executive summary only): "The preponderance of
        circumstantial evidence supports an unintentional research-related incident." ASM (28 Oct 2022): "ASM does not
        believe there is enough available evidence about the origins of SARS-CoV-2 to support the report's overarching
        conclusion". Weaknesses visible in the documents: the database claim rests on one volunteer-group report
        (co-sq-wiv-database); the DEFUSE location claim is unsupported by the public text (co-help-defuse-location-claim); one
        footnote cites a paper that does not match its claim.
      accessible: true
      sources: [src-senate-help-2022, src-marshall-2023, src-asm-2022]
    basis: Burden-of-proof wording in the staff report ("clear and convincing evidence") is a position, not a finding.

  - id: co-china-whitepaper-2025
    state: established
    statement_kind: reported
    statement: >
      China's State Council Information Office white paper (April 2025) says "It is fair to say that the study on the
      origins of SARS-CoV-2 conducted in China has ended", that the virus may have entered China by cold-chain transport,
      and that a section of "Evidence Pointing to the US as the Origin of Covid-19" shows the US needs to be investigated. It
      cites no new evidence for the US claims beyond US sources it names.
    evidence_class: primary_text
    confidence: high
    confidence_reasons:
      start: high
      steps:
        - {domain: primary_anchor_read, effect: none, reason: "Full English text read."}
    evidential_weight: 5   # of 5, for the record
    anchor_checked: primary
    adoption_weight: 3   # of 5
    adoption_note: "An adoption record from a party whose records are in question."
    would_change_if: not applicable (a record)
    anchor:
      type: government-white-paper
      description: >
        White paper (read): "To date, no findings have contradicted the conclusions of the 'Joint WHO-China Study'";
        "there is a possibility that the outbreak in the market at the end of 2019 was introduced to China from abroad via
        cold-chain transportation"; it says "all 457 animal samples ... tested negative ... while 74 out of 923 environmental
        samples from the market were positive"; and that three US entities (Los Alamos, NIH, ODNI) concluded that WIV had
        "strict biosecurity protocols". The ODNI text read says some WIV researchers "probably did not use adequate
        biosafety precautions at least some of the time"; the Los Alamos and NIH reports were not read. SAGO notes the paper
        gives no new evidence for SAGO to review.
      accessible: true
      sources: [src-china-whitepaper-2025, src-odni-2023-wiv, src-nhc-whitepaper-news-2025]
    basis: "The US-origin claims are a government's allegations, recorded and not weighted."

