  - id: co-fcs-unique-among-sarbecoviruses
    state: established
    statement_kind: reported
    statement: >
      Published analyses state that no known sarbecovirus other than SARS-CoV-2 has a furin cleavage site at the S1/S2
      junction of its spike. In experiments the site matters: removing it weakens SARS-CoV-2 in human airway cells,
      hamsters, mice and ferret transmission. Furin cleavage sites do occur in other coronavirus groups, and bats are
      heavily under-sampled.
    evidence_class: synthetic
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: indirectness, effect: down1, reason: "The uniqueness statement is the papers' own and rests on the sequences known when they were written; this dig did not survey GenBank."}
    evidential_weight: 4   # of 5
    anchor_checked: primary
    adoption_weight: 3   # of 5
    adoption_note: "Used by both sides: as a sign of engineering by some, as consistent with natural evolution by others. Adoption, not evidence."
    would_change_if: a sarbecovirus with a natural S1/S2 furin site is found in a pre-2019 sample, or a construct carrying it is found in a laboratory
    anchor:
      type: papers
      description: >
        Chan and Zhan 2022 (read): "no known sarbecovirus except SARS-CoV-2 has an FCS insertion at the S1/S2 junction";
        they also say "an S1/S2 FCS emerging in a sarbecovirus is consistent with natural evolution". Temmam et al. 2022:
        "None of these bat viruses contains a furin cleavage site in the spike protein." Andersen 2020: polybasic sites
        "have not been observed in related 'lineage B' betacoronaviruses, although other human betacoronaviruses,
        including HKU1 (lineage A), have those sites". Johnson 2021, Peacock 2021 and Hoffmann 2020 show the site's role
        in experiments. Wu and Zhao 2021: furin sites "occurred independently for multiple times in the evolution of the
        coronavirus family". SAGO: elements "similar but not identical" are common in several other coronavirus groups.
      accessible: true
      sources: [src-chan-zhan-2022, src-temmam-2022, src-andersen-2020, src-johnson-2021-fcs, src-peacock-2021, src-hoffmann-2020, src-wu-zhao-2021, src-sago-2025]
    basis: >
      The site is unusual among its closest relatives. This fact does not by itself show whether it arose in nature or
      in a laboratory; the papers say so (SAGO's summary of the Lancet Commission: it "does not by itself identify the
      proximal origin of the virus, whether natural or laboratory").

  - id: co-fcs-not-found-in-nature
    state: refuted
    statement_kind: judgment
    refutes_target: >
      The claim on the White House page and in the House Select Subcommittee's press material that "The virus possesses a
      biological characteristic that is not found in nature" (the furin cleavage site)
    refutation_class: narrative_drift
