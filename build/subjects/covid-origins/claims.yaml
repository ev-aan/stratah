# ---------------------------------------------------------------------------
# SEARCH HEADLINE: rules as in gulf-of-tonkin/claims.yaml (1-7).
# It may only state a claim that is established or refuted at HIGH confidence with
# anchor_checked: primary. The headline claim (co-origin-not-established) is a searched gap
# (an absence, capped at provisional confidence), so the headline stays DRAFT by rule.
# The headline states the open question; it does not call either hypothesis refuted or established.
# ---------------------------------------------------------------------------
headline: "Where Did COVID-19 Come From? Not Settled: Market Evidence Disputed, Lab Case Circumstantial"
headline_claim: co-origin-not-established
headline_status: draft          # draft: the headline claim is an absence anchor, provisional by rule
search_summary: >
  Where did COVID-19 come from? Not settled. Early cases cluster around a Wuhan market, which critics
  dispute; the lab-origin case rests on circumstance; no progenitor virus is public on either side.
url_slug: where-did-covid-19-come-from

# ---------------------------------------------------------------------------
# ASSESSMENT (SCHEMA N23): the "Where it stands" box the site shows first. No percentages.
# ---------------------------------------------------------------------------
assessment:
  question: "Where did SARS-CoV-2, the virus that causes COVID-19, come from?"
  answer: "unsettled"
  headline: "Not settled. Neither a natural spillover nor a laboratory-related incident has been shown: the market evidence is disputed, the lab case is circumstantial, no progenitor is public."
  text: >
    Two hypotheses remain open, and each lacks its decisive piece. Natural spillover from animals
    (directly from bats or through an intermediate host) is supported by the clustering of the
    earliest recorded cases around the Huanan Seafood Wholesale Market in Wuhan, by SARS-CoV-2
    found in 74 of 923 environmental samples taken at the market after it closed, and by the sale
    of live mammals that can be infected. Against it: no infected animal has been found (457
    animal samples, all negative, were taken after closure), statisticians have published
    objections to the case-geography analysis, the genetic argument for two separate spillovers
    lost most of its stated strength in a 2023 erratum according to two critics (the erratum itself
    was not read), and the 2021 WHO-China report itself says no firm conclusion about the market's
    role can be drawn. A laboratory-related incident is argued from circumstance: the outbreak began in the city
    where the Wuhan Institute of Virology works on coronaviruses; the US Intelligence Community
    says WIV researchers performed SARS-like coronavirus experiments in BSL-2 laboratories as of
    January 2019 and probably did not always use adequate biosafety precautions; the virus has a
    furin cleavage site that no other known sarbecovirus has; and a 2018 grant proposal (DEFUSE,
    never funded by DARPA according to the sources read) described introducing furin sites into
    bat coronaviruses. Against it: the same US report says it has no indication that WIV's
    holdings included SARS-CoV-2 or a close progenitor and no direct evidence of a specific
    incident; the proposal is a plan, not a record of work done; and the furin site is not unique
    to SARS-CoV-2 among coronaviruses. Neither side has a progenitor virus: the closest known
    relatives score 96.8 (BANAL-52) and 96.2 (RaTG13) on the identity scale on which the US report puts a close
    progenitor above 99. What institutions say is shown separately because it is
    adoption, not evidence. Five US intelligence elements (with the National Intelligence
    Council) lean natural, the FBI and the Department of Energy lean lab and the CIA and one other
    could not decide (ODNI, 2023; confidence levels are redacted in the public text); the CIA said
    in January 2025, at low confidence, that a research-related origin is more likely (as
    quoted by CBS and AP; the CIA document was not read); WHO's advisory group SAGO (2025) says the
    weight of available evidence suggests zoonotic spillover but that it could not assess a laboratory
    route because data were not provided; the House Select Subcommittee majority (2024) calls a
    laboratory or research-related accident likely, and its Democrats say the arguments are largely
    circumstantial. None of these is an anchor. An HHS debarment of EcoHealth Alliance and its former president is
    about grant compliance, not about where the virus came from. Several items could not be read and are
    filed as searched gaps: the Science errata for two key papers, the CIA, FBI and DOE
    primary documents, the German intelligence service's assessment, the Wuhan database
    claim, the original early-2020 Proximal Origin messages and the documents ODNI released in June 2026.
  key_points:
    - "Animal-market case: early cases centred on the Huanan market and market samples carried the virus, but no infected animal was found and critics dispute the statistics."
    - "Lab case: circumstantial (location, biosafety, a 2018 proposal); no document read shows a lab held, made or released it. No progenitor is public on either side."
    - "Institutions differ (adoption, not evidence): US agencies split at low or moderate confidence, WHO's SAGO says zoonotic is better supported, a House report says lab."
  basis: [co-origin-not-established, co-no-progenitor-public, co-zoonosis-hypothesis, co-market-pattern, co-market-samples, co-lab-hypothesis, co-odni-2023-wiv-findings, co-fcs-unique-among-sarbecoviruses, co-defuse-shows-engineered, co-assessments-say-open]
  rated_claim: co-origin-not-established
  would_settle: >
    A progenitor virus (above 99 on that identity scale) found in an animal population, or in a
    laboratory's records and freezers, would move the weight most. Next: the more than 500
    early-pandemic sequences SAGO says were not shared; the early-case line list with onset dates and
    coordinates; sampling data for the animals sold at the market and its supply chain; and WIV's
    laboratory notebooks, sequence archives and staff health records, which WHO and NIH requested and
    did not receive. Not yet read, and listed as sub-questions (claims co-sq-...): both Science
    errata, the CIA, FBI and DOE primary statements, the BND assessment, the DARPA decision record, the
    WIV database record, the original January-February 2020 Proximal Origin messages and the June 2026
    ODNI release.

# ---------------------------------------------------------------------------
# SHORT ANSWER (owner rule, vaccines-autism log L-02): answer and name the exceptions where
# they exist, each pointing to the claim that carries its weight. The honest form for an open
# question is "Not settled", with what points each way and what is missing.
# ---------------------------------------------------------------------------
short_answer:
  question: "Where did SARS-CoV-2, the virus that causes COVID-19, come from?"
  answer: "Not settled, to the best of our knowledge. No infected animal, intermediate host or progenitor virus has been found, and no document read shows that a laboratory held, made or released the virus; except that two bodies of evidence point in opposite directions and each is disputed."
  summary: >
    The earliest recorded cases in Wuhan clustered around the Huanan Seafood Wholesale Market and the
    virus was found in market environmental samples; critics say how cases were found can explain
    the clustering and that the statistics do not show a market origin. The lab-related case rests
    on circumstance (the city, WIV's work, biosafety statements, the furin cleavage site and a 2018
    proposal); no record read shows an incident. Neither side has the virus's direct ancestor.
    The figures below are what the documents report; what institutions conclude is adoption and is
    shown separately.
  summary_figures:
    - figure: "174 December 2019 cases; of 168 with an exposure history, 55.4% had any market exposure and 44.6% none"
      detail: >
        Joint WHO-China report (2021): 174 cases with onset in December 2019 (100 laboratory-confirmed,
        74 clinically diagnosed). Of the 168 with an exposure history, 28.0% were exposed to the Huanan market
        only, 22.6% to other markets only and 4.8% to both. The report says a similar number of cases were
        associated with other markets as with Huanan and that "No firm conclusion therefore about the role
        of the Huanan Market can be drawn." Exposure to the Huanan market was part of the case definition for a
        short period until mid-January 2020.
      source: [src-who-china-2021]
      checked: full
    - figure: "74 of 923 market environmental samples positive; 0 of 457 animal samples"
      detail: >
        Liu et al. (China CDC, Nature 2023/2024): 70 positives by RT-qPCR and 4 by sequencing, from samples taken
        after the market closed on 1 January 2020; 457 samples from 188 animals of 18 species (collected from 18
        January, unsold freezer and refrigerator contents, stray animals, a fish tank) were all negative. The
        authors say the origin "cannot be determined from the analyses available".
      source: [src-liu-2023]
      checked: full
    - figure: "Closest known relatives 96.8% and 96.2% similar; a close progenitor would be more than 99 percent"
      detail: >
        BANAL-52 (Laos bat virus, 96.8%) and RaTG13 (Yunnan bat virus, 96.2% in the discovery paper and in the
        US report; 96.1% in a 2022 paper that may have used a different alignment; not recomputed). ODNI's 2023
        report says neither is close enough to be a direct progenitor.
      source: [src-odni-2023-wiv, src-temmam-2022, src-zhou-2020-ratg13]
      checked: full
    - figure: "US agencies, 2023: 5 natural (with the NIC), 2 lab, 2 undecided; confidence levels redacted"
      detail: >
        ODNI's June 2023 public text names the National Intelligence Council and four other agencies (natural), the
        Department of Energy and the FBI (laboratory-associated, "for different reasons") and the CIA and one other
        (unable to determine). Each statement begins with a redaction box, so the confidence levels are not legible; the
        2021 summary gave low confidence for natural and moderate for lab with agencies unnamed. The two are not
        merged.
      source: [src-odni-2023-wiv, src-odni-2021-summary]
      checked: full
    - figure: "What is and is not summed"
      detail: >
        Nothing here is added across sources. The 174 and 168 are different denominators from one report; the
        agency counts are positions, not evidence; the market samples and the case geography are different kinds of
        data from the same market and are not independent of each other (both come from China's early records).
  basis: >
    Open question: co-origin-not-established. Natural side: co-zoonosis-hypothesis, co-market-pattern,
    co-market-samples. Lab side: co-lab-hypothesis, co-odni-2023-wiv-findings. Missing on both sides:
    co-no-progenitor-public. Institutions are adoption: co-odni-2021, co-odni-2023-agencies, co-sago-2025,
    co-house-sscp-2024.
  except:
    - claim: co-market-pattern
      text: >
        The strongest published case for a natural origin: December 2019 cases cluster around the Huanan market
        in a way the authors say case-finding cannot explain.
      scale: >
        155 of the 164 Wuhan-resident December cases were located by digitising the WHO report's maps; the market
        lies inside the densest 1% contour (Worobey et al., as published).
      scale_sources: [src-worobey-2022, src-who-china-2021]
      what_it_is:
        - "A spatial analysis of early cases, published in Science in 2022, with an erratum in 2024 that was not read."
        - "Backed by market environmental samples and the sale of live mammals at the market."
      what_it_is_not:
        - "Not an identified infected animal: none has been found, and no market animal was tested before closure."
        - "Not undisputed: two statisticians' papers and a letter in a statistics journal dispute the analysis; the authors replied on arXiv."
    - claim: co-lab-hypothesis
      text: >
        The strongest case for a laboratory-related origin is circumstantial: location, WIV's coronavirus work
        and biosafety practice, the furin cleavage site and the 2018 DEFUSE proposal.
      scale: >
        The US report says WIV researchers performed SARS-like coronavirus experiments in BSL-2 laboratories as of
        January 2019; the DEFUSE proposal asked for USD 14,209,245 and was not funded according to the sources read.
      scale_sources: [src-odni-2023-wiv, src-defuse]
      what_it_is:
        - "A set of documented circumstances, adopted at stated low or moderate confidence by some agencies."
      what_it_is_not:
        - "Not a record of an incident: the same US report has no indication WIV held SARS-CoV-2 or a close progenitor."
        - "Not shown by the DEFUSE proposal, which is a 2018 plan and contains no SARS-CoV-2 sequence."
  also_true:
    - claim: co-hhs-debarment
      text: >
        HHS debarred EcoHealth Alliance (five years), its former president (five years) and the Wuhan
        Institute of Virology (ten years). The grounds are grant reporting and responsibility failures, not an
        origin finding.
      scale_sources: [src-hhs-eha-notice-2025, src-hhs-eha-arm-2025]
    - claim: co-assessments-say-open
      text: >
        The US Intelligence Community, WHO's Director-General and WHO's SAGO each state that the origin has
        not been established.
      scale_sources: [src-odni-2021-summary, src-odni-2023-wiv, src-who-dg-remarks-2021, src-sago-2025]

source_notices:
  - source: src-worobey-2022
    notice: >
      CORRECTED. Science published an erratum on 14 Mar 2024 (383(6688):eadp1133). Its content was not read; the
      figures from this paper in this dig are from the original text and may differ from the corrected version.
  - source: src-pekar-2022
    notice: >
      CORRECTED. Science published an erratum on 13 Oct 2023 (382(6667):eadl0585). Its content was not read. Two
      critics say it reduced the paper's Bayes factor for two introductions from about 60 to about 4 (see
      co-pekar-erratum-bf); the figures from this paper in this dig are as originally published.
  - source: src-liu-2023
    notice: >
      CORRECTED IN THE ARTICLE. A note added in proof says the early online version reported 73 positives by
      RT-qPCR out of 923 and that the final count is 70 by RT-qPCR plus 4 by sequencing, 74 in all. The joint WHO-China
      report (2021) still carries 73.
  - source: src-who-china-2021
    notice: >
      UPDATED. WHO's page says the report was updated on 6 April 2021 to remove a working note on page 13 and fix a
      name in the acknowledgements. Two different PDFs exist under WHO URLs; the 6 April file was read for this dig.
  - source: src-bloom-2021
    notice: >
      CORRECTED. A 2023 correction to this paper exists (Mol Biol Evol, msad201). Its text is an image in the PMC
      record and was not read.

subject: covid-origins
title: "Where Did SARS-CoV-2 Come From? (2002 to 2026)"
description: >
  A dig on the origin of COVID-19. It is filed as a set of claims about what is known, with the market-origin
  and laboratory-related hypotheses each tested in plain words at the same standard. The dig keeps apart (1) what
  studies and samples show, filed as synthetic or primary text; (2) what the primary documents say (the
  intelligence reports, the proposal, the grant records, the debarment notices); (3) the popular claims built on
  these, stated in plain words with Yes and No positions; and (4) the institutional record (agencies, WHO, a
  House report, a Senate staff report, China's white paper), filed as adoption, never as evidence. No claim says
  either hypothesis is refuted or established.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS (as in vaccines-autism and fluoride-iq):
#   anchor_checked: primary    the full document was fetched and read directly (sha256 in sources/MANIFEST.yaml)
#   anchor_checked: secondary  read only as an abstract, quoted by others, or reported by a news source
#   anchor_checked: no         not read
# Evidential weight is capped at 4 unless anchor_checked is primary.
# Statistics and reconstructions are filed as `synthetic`.
# Government assessments, congressional reports and WHO statements are ADOPTION. A claim that records what they say
# has evidential weight for the record only; none of them raises the weight of a claim about the virus.
# ---------------------------------------------------------------------------

divergence_note: >
  The gap here runs both ways, and it is visible in the sources. Institutions have said more than the evidence
  they publish. Parts of the US government and the House majority call a laboratory-related accident likely, while
  the US report they rely on says it has no indication that WIV held SARS-CoV-2 or a close progenitor and no direct
  evidence of a specific incident; a White House page states that a lab-related incident "is the most likely
  origin" without citing evidence on the page. In the other direction, WHO's advisory group says the weight of
  available evidence suggests zoonotic spillover, while its own report says the market's role is not conclusive,
  that it was given no raw data, and that it cannot rule a laboratory route out; a 2021 WHO-China report called a
  laboratory incident "extremely unlikely" on the strength of statements from laboratory representatives, and
  WHO's Director-General said that assessment "was not extensive enough". Meanwhile each side's strongest
  scientific paper has a published critique or a correction: the case-geography analysis (statisticians'
  objections), the two-lineage analysis (a 2023 erratum that two critics say cut its Bayes factor to about 4) and the
  market-sample interpretation (a 2023 reanalysis of the sequencing data). The direct evidence that would settle
  it is, on both accounts, held by China: early sequences and case data, market animal and supply-chain data, and
  laboratory records. Stratah records all of this and gives none of the institutional positions evidential weight.

claims:

  # =====================================================================
  # A. THE CORE QUESTION
  # =====================================================================

  - id: co-origin-not-established
    state: searched_gap
    statement_kind: search_result
    statement: >
      The origin of SARS-CoV-2 has not been established: no document or sample read for this dig shows an
      infected animal, an intermediate host, a progenitor virus, or a laboratory that held, made or released the
      virus.
    absence_anchor: true
    evidence_class: primary_text
    confidence: provisional
    evidential_weight: 3   # of 5, for the existence of the gap
    anchor_checked: secondary
    adoption_weight: 4   # of 5, shown separately
    adoption_note: >
      Stated by the US Intelligence Community (2021, 2023), WHO's Director-General (2021) and WHO's SAGO (2025); see
      co-assessments-say-open. A statement by institutions is adoption, not evidence.
    would_change_if: >
      a virus more than 99 percent similar to SARS-CoV-2 is found in an animal population or in a laboratory's records
      or freezers, or an infected market animal or its supplier is identified
    next_step: >
      Obtain the items listed in the discriminating tests: early sequences, market-animal and supply-chain sampling
      data, and laboratory records (dt-progenitor-search, dt-early-sequences, dt-market-animals, dt-wiv-records).
    anchor:
      type: search-record
      description: >
        Read in full or in the passages used (2026-10-05): ODNI 2021 and 2023 ("no confirmed animal source of SARS-CoV-2
        has been identified" and "no indication that the WIV's pre-pandemic research holdings included SARS-CoV-2 or a
        close progenitor"), the WHO-China report 2021, SAGO 2025, both House reports, both Senate staff products, the
        DEFUSE proposal and drafts, and the Baric transcript. None presents an infected animal, intermediate host or
        progenitor, or a laboratory record of one. This is a search of the documents we could open; the classified
        annex to the US report, China's laboratory records and its early data were not available to us.
      accessible: true
    basis: >
      Not settled does not mean equally weighted. The two hypotheses are weighed at their own claims
      (co-zoonosis-hypothesis, co-lab-hypothesis). A gap is not evidence for either.

  - id: co-assessments-say-open
    state: established
    statement_kind: reported
    statement: >
      The US Intelligence Community (2021 and 2023), WHO's Director-General (2021) and WHO's advisory group SAGO (2025)
      each say in their own documents that the origin of SARS-CoV-2 has not been established. The 2023 US report says
      both a natural and a laboratory-associated origin remain plausible.
    evidence_class: primary_text
    confidence: high
    confidence_reasons:
      start: high
      steps:
        - {domain: primary_anchor_read, effect: none, reason: "All four documents read at the passages quoted; hosts are official."}
    evidential_weight: 5   # of 5, for the record of what was said
    anchor_checked: primary
    adoption_weight: 4   # of 5
    adoption_note: "A record of what institutions say; adoption is information, not evidence about the virus."
    would_change_if: not applicable (a record of what documents say); it would change only if one of the institutions publishes a finding
    anchor:
      type: official-statements
      description: >
        ODNI 2021: "the IC remains divided on the most likely origin of COVID-19. All agencies assess that two
        hypotheses are plausible: natural exposure to an infected animal and a laboratory-associated incident."
        ODNI 2023: "All agencies continue to assess that both a natural and laboratory-associated origin remain
        plausible hypotheses to explain the first human infection." WHO Director-General, 30 Mar 2021: "all hypotheses
        remain on the table ... We have not yet found the source of the virus". SAGO 2025: "SAGO cannot conclude with
        certainty where and when this occurred" and "is not in a position to rule this out as a possibility" (the
        laboratory route) [read].
      accessible: true
      sources: [src-odni-2021-summary, src-odni-2023-wiv, src-who-dg-remarks-2021, src-sago-2025]
    basis: A record of statements, with the quotations above. It says nothing about which hypothesis is more likely.

  - id: co-no-progenitor-public
    state: searched_gap
    statement_kind: search_result
    statement: >
      No virus more than 99 percent similar to SARS-CoV-2 (the figure the US report uses for a close progenitor) has
      been published from any animal or any laboratory. The closest known relatives are 96.8 percent (BANAL-52) and 96.2
      percent (RaTG13) similar.
    absence_anchor: true
    evidence_class: primary_text
    confidence: provisional
    evidential_weight: 3   # of 5
    anchor_checked: secondary
    adoption_weight: 3   # of 5
    adoption_note: "The US report and SAGO both state the absence; adoption, not evidence."
    would_change_if: a virus more than 99 percent similar to SARS-CoV-2 is published from any source
    next_step: >
      Sample bats, other wildlife and market supply chains in and around Hubei and Yunnan and Laos, and release WIV's
      sequence archives for independent review (dt-progenitor-search, dt-wiv-records).
    anchor:
      type: search-record
      description: >
        ODNI 2023 (read) gives RaTG13 as 96.2 percent and BANAL-52 as 96.8 percent similar and says "Neither of these
        viruses is close enough to SARS-CoV-2 to be a direct progenitor", and defines a close progenitor as "a virus that
        probably would be more than 99 percent similar". Temmam et al. 2022 (read) report the Laos viruses; Zhou et al.
        2020 (read) report RaTG13 at 96.2 percent. Searched in the documents listed in co-origin-not-established; no
        record of a more similar virus was found. Not shown: that none exists in closed records. A Dec 2024 conference
        talk by a WIV scientist reported no new sequence closer to SARS-CoV-1 or SARS-CoV-2 (co-shi-2024-sequences;
        secondary).
      accessible: true
    basis: "The figure of 96.1 percent for RaTG13 in Temmam 2022 versus 96.2 percent elsewhere probably reflects a different alignment; it was not recomputed."

  # =====================================================================
  # B. THE ANIMAL-MARKET (ZOONOSIS) SIDE
  # =====================================================================

  - id: co-zoonosis-hypothesis
    state: contested
    statement_kind: judgment
    statement: >
      SARS-CoV-2 emerged through natural spillover from animals, either directly from bats or through an intermediate
      host, most likely through the live-animal trade in Wuhan.
    evidence_class: synthetic
    confidence: low
    confidence_reasons:
      start: high
      steps:
        - {domain: inconsistency, effect: down1, reason: "Each analysis cited for it (case geography, two lineages, sample co-occurrence) has a published critique or correction."}
        - {domain: indirectness, effect: down1, reason: "No infected animal, intermediate host or progenitor has been found; market samples were taken after closure and say where the virus was, not where it came from."}
    evidential_weight: 3   # of 5; measurements at the putative site, but not independent of each other and all disputed
    anchor_checked: primary
    adoption_weight: 4   # of 5
    adoption_note: >
      SAGO (2025): "The weight of available evidence reviewed by SAGO suggests zoonotic spillover"; NIC and four
      agencies lean natural at low confidence (2021; 2023 levels redacted); a commentary signed by virologists (J Virol
      2024). Not measured among the public. Adoption is information, not evidence.
    would_change_if: >
      an infected animal or a progenitor virus is found in the market's supply chain, or a bias-free case series
      shows the December clustering came from how cases were found
    disputed_by:
      - {who: "Stoyan and Chiu", kind: work, position: "The statistical conclusion that the market was the centre of the early cases is invalid; this does not reject zoonosis", source_read: src-stoyan-chiu-2023}
      - {who: "Weissman", kind: work, position: "Unlinked cases lying closer to the market than linked cases points to ascertainment bias, not a market origin", source_read: src-weissman-2024}
      - {who: "House Select Subcommittee majority", kind: institution, position: "SARS-CoV-2 likely emerged because of a laboratory or research-related accident", source_read: src-house-sscp-2024}
    anchor:
      type: papers-and-report
      description: >
        Worobey 2022 (as published), Liu 2023, Crits-Christoph 2024, Bloom 2023, Pekar 2022 and the WHO-China report
        2021, all read; see co-market-pattern, co-market-samples, co-wildlife-dna-co-occurrence, co-two-lineages and
        co-who-china-early-cases. SAGO: "it is not conclusive that the HSM was where the virus first spilled over."
      accessible: true
      sources: [src-worobey-2022, src-pekar-2022, src-liu-2023, src-crits-christoph-2024, src-bloom-2023, src-who-china-2021, src-sago-2025]
    flagged_sources: [src-worobey-2022, src-pekar-2022, src-liu-2023, src-who-china-2021]
    positions:
      - label: "Yes (what exists)"
        holder: "Worobey et al.; Pekar et al.; Crits-Christoph et al.; SAGO 2025"
        ground: >
          Early cases cluster around the market, the virus was in market samples (74 of 923), live mammals were sold
          there, and two lineages appear in early genomes.
      - label: "Not shown"
        holder: "Stoyan and Chiu; Weissman; Bloom 2023; Liu et al.'s own conclusion"
        ground: >
          No infected animal; the case statistics may reflect case-finding; samples were taken after closure; the Liu
          authors say the origin "cannot be determined from the analyses available".
    basis: >
      Filed as contested at low confidence. Weight 3 and not 4 because the measurements are at the putative site but
      every one is disputed or corrected and none is independent of China's early records. The lab hypothesis is
      weighed at the same standard in co-lab-hypothesis.

  - id: co-market-pattern
    state: contested
    statement_kind: judgment
    statement: >
      As published in 2022, the earliest December 2019 cases, including those with no known market link, were
      geographically centred on the Huanan market in a way that case-finding does not explain.
    evidence_class: synthetic
    confidence: low
    confidence_reasons:
      start: high
      steps:
        - {domain: inconsistency, effect: down1, reason: "Two statisticians' papers dispute the centre estimate and the test; the authors replied on arXiv."}
        - {domain: risk_of_bias, effect: down1, reason: "The WHO-China report says market exposure was part of the case definition until mid-January 2020; coordinates came from digitised maps, not a line list; the 2024 Science erratum was not read."}
    evidential_weight: 3   # of 5
    anchor_checked: primary   # original text read in full; the erratum was not (flagged)
    adoption_weight: 4   # of 5
    adoption_note: "Adopted by SAGO as showing the market played a significant role in early transmission and amplification; not measured among the public."
    would_change_if: >
      the case line list with onset dates and coordinates shows market-linked case-finding drove the clustering, or the
      corrected 2024 version of the paper changes its central result
    disputed_by:
      - {who: "Stoyan and Chiu", kind: work, position: "The centre of the case cloud is not shown to mark the origin; the Monte Carlo test is flawed; data quality is poor", source_read: src-stoyan-chiu-2023}
      - {who: "Weissman", kind: work, position: "Unlinked cases closer than linked cases (4.00 versus 5.74 km) is a collider-bias signature", source_read: src-weissman-2024}
    anchor:
      type: paper-and-critiques
      description: >
        Worobey et al. 2022 (pre-erratum text, read): coordinates for 155 of 164 Wuhan-resident December cases digitised
        from the WHO-China report's maps; the market lies inside the highest-density 1 percent contour; median distance
        to the market 4.28 km for all cases against a null median of 16.11 km; 4.00 km for cases without a known market
        link and 5.74 km for linked cases (unlinked closer, p=0.029). Reply: Debarre and Worobey 2024 (arXiv, read) say
        linked cases are mainly workers and unlinked cases lying closer is expected. The published JRSSA versions of
        the two critiques and the Science erratum were not read.
      accessible: true
      sources: [src-worobey-2022, src-stoyan-chiu-2023, src-weissman-2024, src-debarre-worobey-2024, src-who-china-2021]
    flagged_sources: [src-worobey-2022]
    positions:
      - label: "Yes"
        holder: "Worobey et al.; Debarre and Worobey (reply)"
        ground: "The market sits at the densest part of the early case map, and cases without a market link lie close to it."
      - label: "Not shown"
        holder: "Stoyan and Chiu; Weissman"
        ground: "The statistics do not show a market origin; case-finding or data limits can produce the pattern."
    basis: >
      The strongest published case on the natural side, and the most directly disputed. The authors themselves state
      that "insufficient evidence" exists "to define upstream events".

  - id: co-who-china-early-cases
    state: established
    statement_kind: reported
    statement: >
      The joint WHO-China report (2021) counted 174 cases with onset in December 2019 (100 laboratory-confirmed, 74
      clinically diagnosed). Of 168 with an exposure history, 55.4 percent had any market exposure (28.0 Huanan only,
      22.6 other markets only, 4.8 both) and 44.6 percent had none. The report says "No firm conclusion therefore about
      the role of the Huanan Market can be drawn."
    evidence_class: primary_text
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: indirectness, effect: down1, reason: "A report of case data supplied by Chinese authorities; the WHO team says it had difficulty accessing raw data and had limited time; Huanan exposure was part of the case definition until mid-January 2020."}
    evidential_weight: 4   # of 5, for the record of what the report says
    anchor_checked: primary
    adoption_weight: 3   # of 5
    adoption_note: "Joint WHO-China report; its lab-incident scoring is recorded separately in co-who-china-2021-assessment."
    would_change_if: >
      the Annex E4 case data, the line list and the discarded case records are reviewed jointly, as the report itself
      recommends, and the counts change
    anchor:
      type: official-report
      description: >
        WHO-China joint report, 6 Apr 2021 file, read: 174 cases reported to the national surveillance system with
        onset in December 2019; earliest onset 8 December 2019, "no history of exposure to the Huanan market"; 164
        resident in Wuhan; other exposures included cold-chain products 26.4 percent and live animals 11.8 percent; seven
        clusters (15 cases); three suspected cases with onset 1, 2 and 7 December were excluded by the Chinese team.
        "A similar number of cases were associated with other markets" [read].
      accessible: true
      sources: [src-who-china-2021]
    flagged_sources: [src-who-china-2021]
    basis: >
      A different dataset from the Lancet and NEJM series (66 percent of 41, 49 percent of 99, 55 percent of cases
      before 1 January): shares linked to the market differ by dataset and are not combined here.

  - id: co-earliest-case-date-disputed
    state: established
    statement_kind: reported
    statement: >
      Published sources give different dates for the earliest known COVID-19 case in Wuhan, and they measure different
      things: onset on 1 December (the first patient in a Lancet series), onset on 8 December (earliest onset reported in
      the WHO-China report, no Huanan exposure), hospitalisation on 12 December (a Nature paper), and a modelled
      lineage-B infection on about 18 November (Pekar et al.). No single earliest-case date is established.
    evidence_class: primary_text
    confidence: high
    confidence_reasons:
      start: high
      steps:
        - {domain: primary_anchor_read, effect: none, reason: "All four texts read; the claim is that they differ, which the texts show."}
    evidential_weight: 5   # of 5, for the record that they differ
    anchor_checked: primary
    adoption_weight: 2   # of 5
    adoption_note: "Not measured."
    would_change_if: not applicable (a record that sources differ); the dispute closes only if the early line list is released
    anchor:
      type: record-of-sources
      description: >
        Huang et al. 2020: "The symptom onset date of the first patient identified was Dec 1, 2019" and "No
        epidemiological link was found between the first patient and later cases". WHO-China report: "the earliest onset
        date reported to the NNDRS became ill on 8 December 2019". Wu et al. 2020: "since the first patient was
        hospitalized on 12 December 2019". Pekar et al. 2022: lineage B primary infection "around 18 November 2019 (23
        October-8 December)" and an unambiguous earliest case with onset 10 December (a seafood vendor, no published
        genome) [read]. The WHO report also records a 1 December onset in a man whose further illness began on 26
        December. Whether the 1 December patient is the same person across papers is not stated.
      accessible: true
      sources: [src-huang-2020, src-who-china-2021, src-wu-2020, src-pekar-2022]
    flagged_sources: [src-who-china-2021, src-pekar-2022]
    basis: Shown as a dispute on the timeline (timeline.yaml, event ev-earliest-case).

  - id: co-market-samples
    state: established
    statement_kind: reported
    statement: >
      China CDC reports that after the Huanan market closed on 1 January 2020, 74 of 923 environmental samples (70 by
      RT-qPCR and 4 by sequencing) were positive for SARS-CoV-2, and none of 457 animal samples (188 animals, 18 species,
      collected from 18 January) was positive.
    evidence_class: material
    confidence: moderate
    confidence_reasons:
      start: high
      steps:
        - {domain: risk_of_bias, effect: down1, reason: "Authors state the assay was not formally verified, sampling was biased toward wildlife shops and early-case shops, and collection began after closure."}
    evidential_weight: 4   # of 5
    anchor_checked: primary
    adoption_weight: 3   # of 5
    adoption_note: "Cited by both sides; China's white paper cites the same counts."
    would_change_if: an independent re-analysis of the raw sequencing data changes the positive count
    disputed_by:
      - {who: "Bloom", kind: work, position: "Positives not classified consistently (sample Q61 called positive on one read in about 200 million, and RT-qPCR negative)", source_read: src-bloom-2023}
    anchor:
      type: paper
      description: >
        Liu et al., Nature (read, publisher HTML): positivity 8.0 percent overall; 87.5 percent (56 of 64) of in-market
        positives in the West Zone; positives in 21 of 134 sampled shops; live virus isolated from three samples with Ct
        below 30; origin "cannot be determined from the analyses available"; human introduction to the market or the
        cold chain "cannot yet be ruled out". Note added in proof: the preview's "73" became 70 plus 4.
      accessible: true
      sources: [src-liu-2023, src-bloom-2023]
    flagged_sources: [src-liu-2023]
    basis: >
      What it shows is that the virus was widespread in the market in January 2020. It does not show an infected
      animal, and the authors say so.

  - id: co-wildlife-dna-co-occurrence
    state: contested
    statement_kind: judgment
    statement: >
      In market samples from one wildlife stall, SARS-CoV-2 RNA was found together with DNA of raccoon dog, civet,
      bamboo rat and other mammals, which makes those species candidate intermediate hosts.
    evidence_class: material
    confidence: low
    confidence_reasons:
