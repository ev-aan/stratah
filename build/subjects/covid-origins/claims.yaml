      description: >
        Andersen 2020 (read): "Our analyses clearly show that SARS-CoV-2 is not a laboratory construct" (see
        co-proximal-origin-text; criticised as stated too strongly). Chan and Zhan 2022 (read): a workflow existed that
        would make a recombinant virus "practically indistinguishable from a rare SARSr-CoV with a naturally emerging
        FCS". Neither side has the laboratory records that would settle it.
      accessible: true
