    disputed_by:
      - {who: "Bloom", kind: work, position: "Only 1 of 14 samples with a fifth or more raccoon-dog mitochondrial DNA contains any SARS-CoV-2 reads (1 of about 200,000,000); co-mingling is unlikely to reliably indicate infection", source_read: src-bloom-2023}
    anchor:
      type: paper
      description: >
        Crits-Christoph et al. (NIH author manuscript, read): five SARS-CoV-2-positive stall-A samples contained
        mitochondrial DNA of raccoon dog, hoary bamboo rat, dog and European rabbit; all five also contained human DNA;
