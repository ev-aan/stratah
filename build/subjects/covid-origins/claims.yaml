        ground: "No sign of a known backbone or design signature in the genome; furin sites occur in nature."
    basis: >
      Filed as proposed: no direct evidence for it, and no material that refutes it. A laboratory accident with an
      unmodified virus (co-lab-hypothesis) is a different claim from engineering.

