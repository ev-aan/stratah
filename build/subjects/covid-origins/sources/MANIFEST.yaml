# Sources for the covid-origins dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Research files are in the research set (the notes of streams o1 to o4); 'file_in_research_set' names the file read and
# 'sha256' is that file's hash, cross-checked against the stream's ALL_SHA256.txt when this manifest was generated.
# Only US-government and public-record texts that are small are stored in this repository (stored_as). No journal article text is stored.
# read: full = opened and read directly; partial = opened, read for the passages used; abstract = record or abstract only;
# secondary = known only through another document or a news report; not read = not opened.
# Access date for every source: 2026-10-05. Nothing was filled from memory: where a document could not be opened it is recorded as not read.
# Two WHO-China report PDFs exist under WHO URLs (6 April file read: e1ca927a2e3c373445022370e96264cb0febbfd3539ad72da2bc244230ba93a9; the earlier file is 837b2065456379582949282cc70a336081847b1ad5e1326146272efae6bffc25). The earlier file is in the research set (o4/src/WHO_joint_report_pre6Apr_version.pdf) and was not text-compared.
