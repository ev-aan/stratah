timeline:
  id: covid-origins
  title: Where did SARS-CoV-2 come from? Studies, records and assessments (2002 to 2026)
  as_of: '2026-10-06'
  note: Times are UTC; most events are known to the day, month or year only. Disputed dates are drawn with a ring at the other date and tagged disputed; they are not resolved here. Government, committee and WHO statements are adoption, not evidence. Events marked single rest on one source; several rest on press reports or documents that were not read and say so. SARS events (2002 to 2005) are orienting background only and lend no weight to any claim about SARS-CoV-2.
panels:
- id: early
  title: 'Panel A: Nov 2002 to Nov 2019 (one tick per two years)'
  start: '2002-07-01T00:00:00Z'
  end: '2019-12-01T00:00:00Z'
  tick_years: 2
  lanes:
  - science
  - institutions
- id: dec2019
  title: 'Panel B: Dec 2019 to Mar 2020 (one tick per two weeks)'
  start: '2019-12-01T00:00:00Z'
  end: '2020-03-31T00:00:00Z'
  tick_hours: 336
  lanes:
  - science
  - institutions
- id: after
  title: 'Panel C: Apr 2020 to Oct 2026 (one tick per year)'
  start: '2020-04-01T00:00:00Z'
  end: '2026-10-31T00:00:00Z'
  tick_years: 1
  lanes:
  - science
  - institutions
  - assessments
  - media
lanes:
  science:
    label: Studies, data and papers
  institutions:
    label: Institutions, grants and WHO
  assessments:
    label: Government and committee assessments (adoption)
  media:
    label: Testimony, releases and messages
people:
- who: Peter Daszak
  detail: Former president of EcoHealth Alliance; principal investigator of the DEFUSE proposal; suspended 21 May 2024 and debarred by HHS for five years (grant-compliance grounds).
- who: Ralph Baric
  detail: UNC Chapel Hill virologist; named subcontractor in DEFUSE; gave a transcribed interview to Senate HSGAC on 10 Apr 2026.
- who: Shi Zhengli
  detail: Wuhan Institute of Virology scientist; partner in DEFUSE; said in a Dec 2024 talk that new sequences were not closer to SARS-CoV-1 or SARS-CoV-2.
- who: Kristian Andersen
  detail: Lead author of "The proximal origin of SARS-CoV-2" (2020) and corresponding author of Worobey et al. 2022 (co-author of Pekar et al. 2022); testified to the House in 2023.
- who: Tedros Adhanom Ghebreyesus
  detail: WHO Director-General; said on 30 Mar 2021 that the laboratory-incident assessment "was not extensive enough" and that all hypotheses remain on the table.
