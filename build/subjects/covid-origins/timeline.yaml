- id: ev-proximal
  panel: dec2019
  lane: science
  time: '2020-03-17T12:00:00Z'
  precision: day
  kind: analysis
  status: disputed
  sources:
  - src-andersen-2020
  - src-virological-398
  label: 'The proximal origin of SARS-CoV-2: published 17 Mar 2020 (preprint post stamped 16 Feb)'
  detail: The Virological post carries a 16 Feb 2020 timestamp but links the published paper, so it was edited after posting or the stamp is that of the first post.
  alt_time: '2020-02-16T12:00:00Z'
  alt_note: '16 Feb 2020: Virological post timestamp'
- id: ev-pandemic
  panel: dec2019
  lane: institutions
  time: '2020-03-11T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-dg-2020-pandemic
  label: '11 Mar 2020: WHO characterises COVID-19 as a pandemic'
