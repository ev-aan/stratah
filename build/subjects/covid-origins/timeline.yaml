- id: ev-who-9jan
  panel: dec2019
  lane: institutions
  time: '2020-01-09T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-stmt-2020-01-09
  label: '9 Jan 2020: WHO says Chinese authorities report a preliminary novel coronavirus'
  detail: '"a preliminary determination of a novel (or new) coronavirus".'
- id: ev-genome-public
  panel: dec2019
  lane: science
  time: '2020-01-10T12:00:00Z'
  precision: day
  kind: data
  status: disputed
  sources:
  - src-virological-319
  - src-genbank-wh1
  - src-who-don-2020-01-12
  label: 'When the genome became public: 5, 10, 11, 12 or 14 Jan 2020 (different events)'
  detail: 5 Jan submission; 10 Jan text of the Virological post (timestamp 11 Jan 01:05 UTC); 12 Jan WHO says China shared the sequence and GenBank v1 release; 14 Jan GenBank v2. Each source dates a different event.
  alt_time: '2020-01-12T12:00:00Z'
  alt_note: '12 Jan 2020: WHO DON and GenBank v1 release date'
- id: ev-who-thailand
  panel: dec2019
  lane: institutions
  time: '2020-01-12T12:00:00Z'
  precision: day
  kind: official
  status: disputed
  sources:
  - src-who-thailand-2020
  label: 'WHO statement on novel coronavirus in Thailand: 12 or 13 Jan 2020'
  detail: URL slug says 12 Jan; page title and canonical link say 13 Jan.
  alt_time: '2020-01-13T12:00:00Z'
  alt_note: '13 Jan 2020: page title and canonical link'
- id: ev-ratg13-genbank
  panel: dec2019
  lane: science
  time: '2020-01-27T12:00:00Z'
  precision: day
  kind: data
  status: single
  sources:
  - src-genbank-ratg13
  label: '27 Jan 2020: RaTG13 genome submitted to GenBank by WIV'
  detail: Record released 24 Mar 2020; replaced by a second version 13 Oct 2020.
- id: ev-pheic
  panel: dec2019
  lane: institutions
  time: '2020-01-30T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-pheic-2020
  label: '30 Jan 2020: WHO declares a public health emergency of international concern'
  detail: '"the outbreak now meets the criteria for a Public Health Emergency of International Concern".'
- id: ev-zhou-2020
  panel: dec2019
  lane: science
  time: '2020-02-03T12:00:00Z'
  precision: day
  kind: analysis
  status: reported
  sources:
  - src-zhou-2020-ratg13
  label: '3 Feb 2020: Zhou et al. report RaTG13, 96.2 percent identical to SARS-CoV-2'
  detail: Received 20 Jan, accepted 29 Jan 2020. The text gives no collection year for RaTG13.
- id: ev-who-china-mission
  panel: dec2019
  lane: institutions
  time: '2020-02-20T12:00:00Z'
  precision: range
  end: '2020-02-24T23:59:00Z'
