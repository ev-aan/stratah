events:
- id: ev-sars-onset
  panel: early
  lane: institutions
  time: '2002-11-16T12:00:00Z'
  precision: day
  kind: data
  status: reported
  sources:
  - src-cdc-mmwr-sars-2003
  label: '16 Nov 2002: earliest SARS onset in the counts, Guangdong'
  detail: 'The CDC bulletin says 31 deaths occurred in Guangdong province between 16 November 2002 and 28 February 2003. Background: a different virus.'
- id: ev-sars-don
  panel: early
  lane: institutions
  time: '2003-02-11T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-don-2003-02-11
  label: '11 Feb 2003: WHO receives reports of an outbreak in Guangdong'
  detail: '"an outbreak of acute respiratory syndrome with 300 cases and 5 deaths in Guangdong Province".'
- id: ev-sars-alert
  panel: early
  lane: institutions
  time: '2003-03-12T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-sars-alert-2003
  label: '12 Mar 2003: WHO global alert on atypical pneumonia'
  detail: Reports of a severe pneumonia in Viet Nam, Hong Kong and Guangdong.
- id: ev-sars-agent
  panel: early
  lane: science
  time: '2003-04-01T12:00:00Z'
  precision: day
  kind: analysis
  status: disputed
  sources:
  - src-epmc-sars-abstracts
  label: 'Apr 2003: first papers name a novel coronavirus as the SARS agent'
  detail: 'Europe PMC first-publication dates: 1 Apr 2003 (Peiris et al., Lancet) and 10 Apr 2003 (Drosten et al. and Ksiazek et al., NEJM). Different papers, not a conflict over one date.'
  alt_time: '2003-04-10T12:00:00Z'
  alt_note: '10 Apr 2003: NEJM papers (Europe PMC first-publication date)'
- id: ev-sars-contained
  panel: early
  lane: institutions
  time: '2003-07-05T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-sars-contained-2003
  label: '5 Jul 2003: WHO says SARS outbreak contained worldwide'
  detail: '"the human chains of SARS virus transmission appear to have been broken everywhere in the world".'
- id: ev-sars-reservoir
  panel: early
  lane: institutions
  time: '2003-08-21T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-sars-mission-2003
  label: '21 Aug 2003: WHO, China and FAO mission on the SARS animal reservoir'
  detail: '"Finding its origin will most likely take years".'
- id: ev-sars-civets
  panel: early
  lane: science
  time: '2003-09-04T12:00:00Z'
  precision: day
  kind: analysis
  status: reported
  sources:
  - src-epmc-sars-abstracts
  label: '4 Sep 2003: SARS-like viruses isolated from civets in a Guangdong live-animal market'
  detail: Europe PMC first-publication date of the Science paper. Background only; this is a different virus and lends no weight to the SARS-CoV-2 claims (thread-sars-2003-background).
- id: ev-bats-2005
  panel: early
  lane: science
  time: '2005-09-27T12:00:00Z'
  precision: day
  kind: analysis
  status: reported
  sources:
  - src-lau-2005
  - src-epmc-sars-abstracts
  label: 'Sep 2005: bats identified as SARS-like coronavirus reservoirs'
  detail: PNAS print date 27 Sep 2005 and Science 29 Sep 2005. Background only.
- id: ev-mojiang
  panel: early
  lane: science
  time: '2012-04-26T12:00:00Z'
  precision: day
  kind: witness
  status: reported
  sources:
  - src-zhou-2020-addendum
  label: '26-27 Apr 2012: four miners admitted to a Kunming hospital (as described in WIV''s 2020 addendum)'
  detail: WIV says it received 13 serum samples from four patients between 1 July and 1 October 2012 and retested them in 2020, confirming they were not infected by SARS-CoV-2. The addendum does not link this to RaTG13.
- id: ev-ratg13-sample
  panel: early
  lane: science
  time: '2013-07-24T12:00:00Z'
  precision: day
  kind: data
  status: disputed
  sources:
  - src-genbank-ratg13
  - src-zhou-2020-addendum
  - src-sago-2025
  label: '24 Jul 2013 (GenBank collection date): bat coronavirus RaTG13 sample, Yunnan'
  detail: Collection date is the submitter's GenBank entry; the Nature paper gives no collection year; the addendum discusses 2012 sera and does not name RaTG13; SAGO gives 2013 in one place and another chronology that is not in the addendum text. Dispute shown, not resolved.
- id: ev-ge-2013
  panel: early
  lane: science
  time: '2013-10-30T12:00:00Z'
  precision: day
  kind: analysis
  status: reported
  sources:
  - src-ge-2013
  label: '30 Oct 2013: WIV-led team isolates a bat SARS-like coronavirus that uses human ACE2'
  detail: Nature; with EcoHealth Alliance authors.
- id: ev-r01-award
  panel: early
  lane: institutions
  time: '2014-05-27T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-hhs-eha-suspension-2024
  label: '27 May 2014: NIH/NIAID awards grant R01AI110964 to EcoHealth Alliance'
  detail: '"Understanding the Risk of Bat Coronavirus Emergence"; start 1 Jun 2014; WIV a participant. HHS 2024 memorandum. Several different end dates appear across the records.'
- id: ev-gof-pause
  panel: early
  lane: institutions
  time: '2014-10-17T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-hhs-eha-suspension-2024
  label: '17 Oct 2014: US funding pause on gain-of-function research (as described by HHS in 2024)'
  detail: Described in the 2024 memorandum; the pause document itself was not read.
- id: ev-menachery
  panel: early
  lane: science
  time: '2015-11-09T12:00:00Z'
  precision: day
  kind: analysis
  status: reported
  sources:
  - src-menachery-2015
  label: '9 Nov 2015: chimeric SHC014-spike virus in a mouse-adapted SARS-CoV backbone (UNC)'
  detail: A UNC paper, not a WIV paper.
- id: ev-niaid-letter
  panel: early
  lane: institutions
  time: '2016-05-28T12:00:00Z'
  precision: day
  kind: official
  status: single
  sources:
  - src-hhs-eha-suspension-2024
  label: '28 May 2016: NIAID writes to EcoHealth about possible gain-of-function research under the grant (as recorded by HHS)'
  detail: The 2016 letter itself was not read.
- id: ev-hu-2017
  panel: early
  lane: science
  time: '2017-11-30T12:00:00Z'
  precision: day
  kind: analysis
  status: reported
  sources:
  - src-hu-2017
  label: '30 Nov 2017: WIV paper on bat SARS-related coronaviruses and chimeric viruses'
  detail: Received 10 Feb, accepted 17 Oct 2017.
- id: ev-defuse-draft
  panel: early
  lane: institutions
  time: '2018-02-08T12:00:00Z'
  precision: day
  kind: document
  status: single
  sources:
  - src-defuse-drafts
  label: '8 Feb 2018: first rough draft of the DEFUSE abstract emailed (FOIA release; unvetted)'
  detail: From USGS FOIA release 2021-006245, OCR text; released publicly Dec 2023 to Jan 2024.
- id: ev-defuse
  panel: early
  lane: institutions
  time: '2018-03-24T12:00:00Z'
  precision: day
  kind: document
  status: disputed
  sources:
  - src-defuse
  label: '24 Mar 2018: EcoHealth Alliance submits the DEFUSE proposal to DARPA'
  detail: 'Cover letter dated 24 March 2018; the form field says "Date proposal submitted: 3/27/18". The final proposal was public from Sept 2021. Not funded according to the sources read; DARPA''s record not read.'
  alt_time: '2018-03-27T12:00:00Z'
  alt_note: 'Form field "Date proposal submitted: 3/27/18"'
- id: ev-wiv-illness
  panel: early
  lane: institutions
  time: '2019-10-15T12:00:00Z'
  precision: range
  end: '2019-11-30T00:00:00Z'
  kind: official
  status: reported
  sources:
  - src-state-wiv-factsheet-2021
  - src-odni-2023-wiv
  label: 'Autumn 2019: several WIV researchers reported ill (official wording)'
  detail: 'State Department 2021: symptoms "consistent with both COVID-19 and common seasonal illnesses"; ODNI 2023: "neither supports nor refutes either hypothesis". No names, no month.'
- id: ev-wiv-db
  panel: early
  lane: institutions
  time: '2019-09-12T12:00:00Z'
  precision: day
  kind: witness
  status: single
  sources:
  - src-senate-help-2022
  label: '12 Sep 2019 (claimed): WIV online database taken offline. NOT VERIFIED'
  detail: Claim in the HELP minority staff report, resting on a volunteer-group report and a newspaper editorial that were not opened; no archive capture found (co-sq-wiv-database).
- id: ev-lineage-b
  panel: early
  lane: science
  time: '2019-11-18T12:00:00Z'
  precision: approx
  kind: analysis
  status: inferred
  sources:
  - src-pekar-2022
  label: 'about 18 Nov 2019 (modelled): lineage B primary infection, 95 percent range 23 Oct to 8 Dec (as published)'
  detail: A model output, not an observed date. The 2023 erratum was not read; two critics say it changed the support for two introductions.
- id: ev-earliest-case
  panel: dec2019
  lane: science
  time: '2019-12-01T12:00:00Z'
  precision: day
  kind: data
  status: disputed
  sources:
  - src-huang-2020
  - src-who-china-2021
  label: 'Earliest known case: 1 Dec or 8 Dec 2019 onset (sources differ)'
  detail: '1 Dec: onset of the first patient in a Lancet series, "No epidemiological link was found between the first patient and later cases". 8 Dec: earliest onset reported in the WHO-China report, with no Huanan exposure. They may or may not be one person; the sources do not say.'
  alt_time: '2019-12-08T12:00:00Z'
  alt_note: '8 Dec 2019: earliest onset reported to the national surveillance system (WHO-China report)'
- id: ev-earliest-vendor
  panel: dec2019
  lane: science
  time: '2019-12-10T12:00:00Z'
  precision: day
  kind: data
  status: single
  sources:
  - src-pekar-2022
  label: '10 Dec 2019: onset of the earliest "unambiguous" case in Pekar et al., a seafood vendor'
  detail: No published genome. Differs from the 1 and 8 Dec dates above because it is a different case definition.
- id: ev-first-hosp
  panel: dec2019
  lane: science
  time: '2019-12-12T12:00:00Z'
  precision: day
  kind: data
  status: reported
  sources:
  - src-wu-2020
  label: '12 Dec 2019: "the first patient was hospitalized" (Wu et al., Nature)'
  detail: A hospitalisation date, not an onset date.
- id: ev-wuhan-notice
  panel: dec2019
  lane: institutions
  time: '2019-12-31T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-whc-notice-2019-12-31
  label: '31 Dec 2019: Wuhan Municipal Health Commission notice on pneumonia cases'
  detail: 'Page timestamp 13:38:05; the time zone is not stated. Gloss: 27 cases found, 7 severe, no obvious human-to-human transmission found (Chinese original read).'
- id: ev-who-informed
  panel: dec2019
  lane: institutions
  time: '2019-12-31T12:00:00Z'
  precision: day
  kind: official
  status: disputed
  sources:
  - src-who-don-2020-01-05
  - src-who-don-2020-01-12
  label: '31 Dec 2019: WHO China office informed of pneumonia of unknown cause'
  detail: WHO says its China Country Office "was informed"; the Worobey paper says the Chinese government notified WHO. A local public notice is not a notification to WHO.
- id: ev-market-closed
  panel: dec2019
  lane: institutions
  time: '2020-01-01T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-don-2020-01-05
  label: '1 Jan 2020: Huanan market closed (per media reports cited by WHO)'
  detail: No Chinese government closure notice was read.
- id: ev-don-5jan
  panel: dec2019
  lane: institutions
  time: '2020-01-05T12:00:00Z'
  precision: day
  kind: official
  status: reported
  sources:
  - src-who-don-2020-01-05
  label: '5 Jan 2020: WHO Disease Outbreak News, 44 patients as of 3 Jan'
  detail: '"no evidence of significant human-to-human transmission and no health care worker infections have been reported".'
- id: ev-wh1-submitted
