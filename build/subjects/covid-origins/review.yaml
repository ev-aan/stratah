  seafood vendor with no published genome); Huang et al. 2020 (1 Dec onset, no epidemiological link); Wu et al. 2020 (hospitalised
  12 Dec 2019); Liu et al. 2023 (publisher HTML: 923 and 457 samples, 188 animals / 18 species, 74 = 70 + 4, 87.5% (56/64)
  West Zone, 134/678 shops, three isolates with Ct<30, ''cannot be determined from the analyses available'', ''cannot yet
  be ruled out'', note added in proof); Crits-Christoph 2024; Temmam 2022 (96.8% BANAL-52, 96.1% RaTG13, no furin site); Chan
  and Zhan 2022 (both the ''no known sarbecovirus'' and the ''consistent with natural evolution'' sentences); GenBank MN996532.1
  (submitted 27-JAN-2020, collection 24-Jul-2013, replaced 13 Oct 2020); ODNI 2021 unclassified summary and Updated Assessment
  (stored copies: four elements and the NIC at low confidence, one element at moderate confidence, three unable to coalesce,
