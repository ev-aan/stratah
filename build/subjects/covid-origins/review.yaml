  HHS stored records (suspension effective 15 May 2024, EHA ineligible through 14 May 2029, Daszak notice of 21 May 2024 and
  ineligible through 20 May 2029, the WIV 17 Jul 2023 suspension and 19 Sep 2023 ten-year debarment in the ARM); House Oversight
  debarment release; State Department fact sheet of 15 Jan 2021 (stored copy: the ''reason to believe'' sentence); White House
  page (stored copy and the live page: ''A lab-related incident involving gain-of-function research is the most likely origin
  of COVID-19'', the five numbered items, metadata datePublished 2025-04-18 and dateModified 2025-08-15); House Oversight
  press release of 2 Dec 2024 (''The FIVE strongest arguments'', ''a biological characteristic that is not found in nature''),
  which is the actual holder of the refuted wording and is attributed as such; China''s white paper (all six pages: ''the
  study on the origins of SARS-CoV-2 conducted in China has ended'', the cold-chain sentence, ''Evidence Pointing to the US
  as the Origin of Covid-19'', 457 / 74 of 923, the Los Alamos/NIH/ODNI biosecurity sentence); NHC news item; McCowan 2025
  (''the Bayes factor dropped to 4''); Weissman EJW 2026 (''a less compelling ~4.3''); Stoyan and Chiu 2023; Andersen written
  testimony 2023 (''If convincing new evidence were to be discovered ...''). That is 33 sources opened; every anchor source
