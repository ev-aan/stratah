# ---------------------------------------------------------------- the pyramid question

- id: avaris-schiestl-2009-pyramid-discussion
  state: established
  statement: >-
    Schiestl (2009) records that, because of the roughly square foundation of the superstructure of tomb p/19-Grab 1, M. Bietak proposed a reconstruction as a small brick pyramid (Schiestl's footnote cites 'M. BIETAK 1994, 93'); that tomb p/21-Grab 1 would be exactly square (8.1 x 8.1 m) on a symmetrical reconstruction; that the archaeology cannot decide
    ('keine weiteren Argumente'); that private pyramids in the Middle Kingdom are 'vorstellbar, aber nicht sehr wahrscheinlich' (conceivable but not very probable) and the same holds for the buildings at Tell el-Dab'a; and that he proposes two reconstruction variants, a chapel and a tapering mastaba (his Tafel XXXII), neither a pyramid.
  statement_kind: reported
  evidence_class: primary_text
  confidence: moderate
  evidential_weight: 4
  anchor_checked: primary
  adoption_weight: 1
  adoption_note: Not measured. Bar-Ron 2017 and the speaker's claim lines (read) state a pyramid without reference to this discussion.
  would_change_if: >-
