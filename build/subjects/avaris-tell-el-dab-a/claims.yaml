- id: avaris-date-strata-as-published
  state: contested
  statement: >-
    The absolute dates of the cemetery, mansion and statue at F/I depend on the chronology used. The excavators' own figures moved between 2006
    and the FWF preliminary report: Schiestl (2006) gives stratum d/2 (phase H) as ca. 1820-1785 BC and d/1 (phase G/4) as ca. 1785-1750 BC; the
    FWF page gives phase H c. 1850-1815 BCE and phase G/4 c. 1815-1780 BCE. Rohl's 'New Chronology', as relayed by Bar-Ron (2017), would place
    the Twelfth Dynasty king Amenemhat III at about 1678-1631 BCE. The excavators' relative sequence (late 12th to 13th Dynasty) is not in dispute
    in the texts read.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 1
  anchor_checked: secondary
  adoption_weight: 2
  adoption_note: A round 'about 1900 BC' is given by the speaker; the advocacy papers use a lowered Egyptian chronology.
  would_change_if: >-
    a dated sequence for Tell el-Dab'a (radiocarbon series, ceramic chronology) is read from a named specialist and the strata windows are stated
    with reasons, or a lowered chronology is shown to fit independent anchors
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2006, p. 175, strata d/2 'ca. 1820-1785 B.C.', d/1 'ca. 1785-1750 B.C.'; FWF P 34601 section II.1, 'Phase H, Stratum d/2,
      c. 1850-1815 BCE' and 'Phase G/4, c. 1815-1780 BCE'; Bar-Ron 2017: 'Amenemhat III ... reigned from ca. 1678 to 1631 BCE'. Not read: any
      chronology study, radiocarbon series, or Rohl's own text.
    sources:
    - src-schiestl-2006
    - src-fwf-p34601
    - src-bar-ron-2017
  basis: >-
    # V: read 2026-10-14. Dates are as the sources print them. The excavators' own figures shift by about 30 years between 2006 and the FWF page;
    the reasons were not read.
  positions:
  - label: 'Conventional chronology: phase H about 1850-1815 BCE, G/4 about 1815-1780 BCE'
    holder: M. Bietak and team (FWF P 34601 preliminary results)
    ground: stated dates only; the basis was not read here
  - label: Slightly later dates for the same strata (d/2 ca. 1820-1785, d/1 ca. 1785-1750)
    holder: R. Schiestl 2006
    ground: stated dates only
  - label: 'Lowered ''New Chronology'': Amenemhat III about 1678-1631 BCE'
    holder: D. Rohl, via M. S. Bar-Ron 2017
    ground: claimed astronomical and other anchors, not read here
  disputed_by:
  - who: Bar-Ron 2017 and D. Rohl (New Chronology)
    kind: group
    position: Twelfth Dynasty is much later than the conventional dates
    source_read: Bar-Ron read; Rohl not opened
    via: Bar-Ron 2017
