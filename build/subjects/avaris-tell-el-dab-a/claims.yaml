# Dig: Tell el-Dab'a (Avaris). Every claim is secondary: no object, plate or photograph was examined for signs. Books, translations and videos are claims, not primary data.
subject: avaris-tell-el-dab-a
title: >-
  Tell el-Dab'a (Avaris): the palatial mansion, garden cemetery and Asiatic statue, and what Dead Hidden says they are
question: >-
  What was actually found at Avaris/Tell el-Dab'a (a palace with twelve columns, twelve tombs, a statue), when, and whom do the excavators say
  it represents?
dig_status: open
headline_status: draft
search_summary: >-
  At Tell el-Dab'a (ancient Avaris) in the eastern Nile Delta, an Austrian team under Manfred Bietak excavated in area F/I a mansion of the early
  13th Dynasty, a garden south of it that became an elite cemetery of Near-Eastern-style burials, and fragments of a smashed, larger-than-life
  statue of a seated Asiatic man. The excavation texts read give the strata dates as about 1850 to 1750 BCE, name no one, and do not mention twelve
  tombs or twelve columns; one reports bone fragments in the leading candidate tomb. The identification with Joseph or Jacob comes from outside
  the excavation, in advocacy papers that disagree with each other. The objects, plans and photographs were not seen here.
description: >-
  First dig on this object. Read: Schiestl 2006 (Agypten und Levante 16, open PDF), the auaris.at F/I page, the FWF P 34601 preliminary results
  (Bietak's team), a third-party copy of Bietak 2022 (Wiley encyclopedia), the 2011 excavation report, Bar-Ron 2017, Billington's 2022 review
  of Petrovich, and three Bible passages (KJV). Blocked or not opened: Bietak 1991b, 1996, Schiestl 2009, Eigner 1985, Rohl's books, Petrovich's
  book, two pages that returned 403/Cloudflare blocks. No object, plate or photograph was examined for signs, so every claim here is secondary.
  The Dead Hidden videos are claims, never anchors.
divergence_note: >-
  The speaker's version is: a palace with twelve columns, twelve tombs of Joseph and his brothers, a pyramid tomb with no bones, a statue of Joseph
  or Jacob, all about 1900 BC. The excavation texts read describe a real mansion, a real garden cemetery and a real statue of an Asiatic dignitary,
  dated about 1850 to 1750 BCE, but give no count of twelve for tombs or columns, no pyramid, no name, and report bones in the leading candidate
  tomb. The Joseph/Jacob story is carried by a separate advocacy line (Rohl, Petrovich, relayed by Bar-Ron and Billington) whose members disagree
  with each other and which the authors' own chronology and reading choices drive. Where the line runs between the excavators' record and the
  advocates' reading is the product here; the object-level record (plans, photographs, Bietak 1991b and 1996, Schiestl 2009) is the next thing
  to open.
claims:
- id: avaris-f1-mansion-garden-cemetery
  state: proposed
  statement: >-
    The excavators of Area F/I at Tell el-Dab'a (ancient Avaris) report a mansion of the early 13th Dynasty (phase G/4), a garden south of it,
    and an elite cemetery that later developed in that garden. Their own word for the building is 'palatial mansion'.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: secondary
  adoption_weight: 2
  adoption_note: >-
    Widely repeated in the advocacy literature read (Bar-Ron 2017, Billington 2022) as a 'palace'; the excavators' own reports read use 'palatial
    mansion'.
  would_change_if: >-
    the plans and field records of Area F/I (Bietak, Eigner and Martin monograph in preparation; Tell el-Dab'a XVIII) show a different building,
    phase or date, or the object-level record is read and differs from these summaries
  anchor:
    type: interpretive
    description: >-
      Read: FWF P 34601 preliminary results, section II.1 (Area F/I): 'South of the mansion, a garden was discovered with systematically planted
      trees and plant beds' and 'a cemetery developed within the former garden to the south, containing a series of elite tombs published by R.
      Schiestl'. Bietak 2022 (Wiley encyclopedia, copy): 'South of the two mansions were gardens, which were later used as a cemetery for dignitaries
      residing in those mansions.' Both come from the excavation director's team, so they are one origin, not two. No plan, photograph or field
      record was viewed.
    sources:
    - src-fwf-p34601
    - src-bietak-2022-eah
    - src-auaris-f1
  basis: >-
    # V: FWF document and Bietak 2022 text read 2026-10-14. Same team, same origin; treated as one witness. Says what the excavators publish;
    not the ground itself.
- id: avaris-statue-asiatic-dignitary
  state: proposed
  statement: >-
    Fragments of a smashed, larger-than-life limestone statue of a seated man were found at Tell el-Dab'a, Area F/I, between 1986 and 1988. Schiestl
    (2006) reconstructs it as about 2 m high, wearing a mushroom-shaped coiffure, with yellowish skin and a throw-stick or crook; the excavators
    read it as an Asiatic man holding a position of power.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: secondary
  adoption_weight: 3
  adoption_note: >-
    The statue is often shown and described; the excavators' reading (an Asiatic dignitary) is the baseline both the speaker and the advocacy
    literature start from.
  would_change_if: >-
    the fragments, the 1991 excavation report (Bietak 1991b) or Schiestl's 2009 monograph are read and give different dimensions, a different
    findspot or a different reading of the figure
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2006, Agypten und Levante 16, 173-185 (OeAW open PDF): 'All the pieces of the statue presented here were found between 1986
      and 1988 in a southeastern part of the cemetery F/I'; 'The seated figure of a man reaches a height of approximately 2 m'; 'The figure is
      approximately one and a half times life size.' Also read: auaris.at F/I page (Schiestl text): 'It portrayed a seated man wearing a striped
      cloak and a red, mushroom shaped headdress ... The skin color of the man is shown yellowish. In the right hand he is holding a throw stick'.
      Photographs in the PDF were not examined for detail; the reconstruction is Schiestl's, not the object.
    sources:
    - src-schiestl-2006
    - src-auaris-f1
    - src-fwf-p34601
    nodes:
    - node: avaris-1986-1988-statue-fragments-found
      verb: supports
  basis: >-
    # V: read 2026-10-14. Schiestl's size is a reconstruction ('Putting the pieces together'); the fragments themselves are a small part of the
    whole (his words).
- id: avaris-statue-identification-by-excavators
