  anchor:
    type: primary_text
    description: >-
      Read: Schiestl 2009, chapter II.4.7, pp. 62-65 (German, short fragments): 'Aufgrund des annahernd quadratischen Grundrisses der Fundamente des Oberbaues von F/I-p/19-Grab 1 wurde von M. Bietak eine Rekonstruktion als kleine Ziegelpyramide vorgeschlagen' (fn. 350: 'M. BIETAK 1994, 93'); 'Da hier jeweils nur die Fundamentlagen erhalten sind, konnen aus archaologischer Sicht keine weiteren Argumente in die Diskussion eingebracht werden';
      two pyramidia found in the area are 'kein Hinweis auf pyramidiale Bauten in der Gegend von Tell el-Dab'a'; 'Zwar ist ... eine Befundlucke fur nicht-konigliche Pyramiden vorstellbar, aber nicht sehr wahrscheinlich. Das gilt auch fur die Bauten von Tell el-Dab'a.' He proposes a chapel ('Variante 1') and a tapering mastaba with an inner room ('Variante 2'), which he marks as uncertain. Viewed: Tafel XXXII (computer views of the necropolis with vaulted chapels and tapering blocks; no pyramid).
      Bietak (1996) in the passage read describes the tomb as 'a nearly square superstructure with a chapel on the eastern side' and does not use the word pyramid there. Schiestl 2006 p. 175 says only that a vaulted chapel is suggested by parallels and that the superstructure cannot be reconstructed.
