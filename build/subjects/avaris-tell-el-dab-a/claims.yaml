# Dig: Tell el-Dab'a (Avaris). Second pass 2026-10-16: the excavators' own publications (Schiestl 2006, Schiestl 2009 with catalogue and plates, Bietak 1996) were read, and the figures in the open PDFs were viewed.
# What was read is the excavation team's reports and reconstructions; the statue fragments, the tombs and the bones themselves were not seen. Books, translations and videos are otherwise claims, not primary data.
# Claim ids from the first pass are kept. Where a claim was changed, split or re-labelled, the change is in log L-07 to L-12 (earlier log entries are unchanged).
subject: avaris-tell-el-dab-a
title: >-
  Tell el-Dab'a (Avaris): the palatial mansion, garden cemetery and Asiatic statue, and what Dead Hidden says they are
question: >-
  What was found at Avaris/Tell el-Dab'a (a palace with twelve columns, twelve tombs, a statue), when, and whom do the excavators say it shows?
dig_status: open
headline: "Avaris statue: the excavators judge its likely tomb older than the palace garden cemetery"
headline_claim: avaris-statue-findspot-ambiguous
headline_status: draft
assessment:
  question: "What was found at Avaris/Tell el-Dab'a (a palace with twelve columns, twelve tombs, a statue), when, and whom do the excavators say it shows?"
  answer: partly
  headline: "A mansion, a garden cemetery and a smashed statue of an Asiatic man were found; the excavators name no person, and the twelve-tomb and pyramid details are not in the texts read."
  text: >
    The excavators' publications read (Schiestl 2006 and 2009, Bietak 1996) describe a palatial mansion of the early 13th Dynasty in area F/I, a garden south of it that became a cemetery,
    and fragments of a smashed statue of a seated Asiatic man about 2 m high. They read him as a high-ranking Asiatic and name no person. Schiestl 2009 judges that the statue more likely
    stood over tomb p/19 no. 1, which belongs to the older cemetery (stratum d/2) and so predates the palatial residence (stratum d/1), while calling the stratigraphic attribution ambiguous.
    Two details in the Joseph accounts have a counterpart in the excavators' material: the plans show rows of column symbols along the long sides of the court (about twelve per side by our
    count of an image, which is a computed result and not an anchor), and Bietak proposed a small brick pyramid for the superstructure of p/19 no. 1, which Schiestl 2009 calls conceivable but not very probable.
    No count of twelve tombs was found in the excavators' texts read (they give six tombs in a series, five prominent tombs with tree pits in one row, and 74 classified tombs).
    Schiestl 2009 reports bone fragments of two individuals from the chamber of p/19 no. 1. The identifications with Joseph (Rohl, as relayed by Bar-Ron) and with Jacob
    (Petrovich, as relayed by Billington) come from outside the excavation reports. Not read: Bietak 1991b and 1994, Eigner 1985, Rohl, Petrovich, Kitchen, Ryholt; the objects, the bones and the tomb were not seen.
  key_points:
    - "The excavators report a mansion, a garden that became a cemetery and a smashed statue of an Asiatic man about 2 m high; they name no person."
    - "Their plans show rows of about twelve column symbols per long side of the court (our image count); Bietak proposed a pyramid; no count of twelve tombs was found."
    - "Schiestl 2009 judges the statue's likely tomb, with bone fragments of two people, older than the palace; the Joseph and Jacob readings come from other authors."
  basis:
    - avaris-f1-mansion-garden-cemetery
    - avaris-statue-asiatic-dignitary
    - avaris-statue-identification-by-excavators
    - avaris-statue-findspot-ambiguous
    - avaris-tomb-p19-1-bones
    - avaris-cemetery-tomb-counts
    - avaris-mansion-columns-count
    - avaris-schiestl-2009-pyramid-discussion
    - avaris-largest-tomb-pyramid
  rated_claim: avaris-statue-findspot-ambiguous
  would_settle: >-
    The excavators' plan of the F/I mansion with a legend and a stated column count; Bietak 1991b and 1994 and Eigner 1985 read in full; Rohl's and Petrovich's own texts read; a name or title
    read on the statue base or on another fragment; and a stratigraphic decision for tomb p/19 no. 1 in the forthcoming F/I monograph.
search_summary: >-
  At Tell el-Dab'a (ancient Avaris) an Austrian team under Manfred Bietak excavated a palatial mansion of the early 13th Dynasty, a garden that became an elite cemetery, and fragments of a smashed statue of
  a seated Asiatic man about 2 m high. The excavators' publications read name no person for the statue. The Joseph reading comes from Rohl as relayed by Bar-Ron and the Jacob reading from Petrovich as relayed
  by Billington. The tombs, bones and fragments were not seen; plans and photographs in open PDFs were viewed.
description: >-
  Second pass. Read: Schiestl 2006 (open PDF, figures viewed), Schiestl 2009 Tell el-Dab'a XVIII (open-access chapters, catalogue entry and plates viewed), Bietak 1996 (public scan), the auaris.at F/I page, FWF P 34601
  preliminary results (figures viewed), a third-party copy of Bietak 2022, the 2011 excavation report, Bar-Ron 2017 (figures viewed), Billington's 2022 review of Petrovich, and the Hebrew and KJV texts of three Bible passages.
  Blocked or not opened: Bietak 1991b, Bietak 1994, Eigner 1985, Rohl's books, Petrovich's book, Kitchen 2003, Ryholt 1997, two pages that returned 403/Cloudflare blocks. The Dead Hidden videos are claims, never anchors.
divergence_note: >-
  Coverage facts only. Bar-Ron (2017) states that the palace has two rows of twelve columns, that there were twelve prominent tombs, that one is a pyramid tomb whose body had been removed, and that the statue (which he gives as 3 m high)
  is the vizier Ankhu, whom he identifies with Joseph; he credits Rohl for these. Billington (2022) reports that Petrovich reads the statue as Jacob and the palace as built by Ephraim and Manasseh. The excavators' publications read
  (Schiestl 2006 and 2009, Bietak 1996) give the statue as about 2 m high and unnamed, report bone fragments of two individuals in tomb p/19 no. 1, report six tombs in a series and five tombs with tree pits in a row,
  describe columns on the four sides of the court, and give Bietak's proposed pyramid superstructure and Schiestl's judgment on it. The speaker's claims (video claim lines) match Bar-Ron's list in wording; the path by which they
  reached the speaker is not known. Where the excavation record and these readings differ is the subject of the claims below; the object-level record not yet read (Bietak 1991b, 1994; Eigner 1985) is the next thing to open.
claims:

# ---------------------------------------------------------------- what the excavators report

- id: avaris-f1-mansion-garden-cemetery
  state: established
  statement: >-
    The excavators of Area F/I at Tell el-Dab'a (ancient Avaris) report that in stratum d/1 (= G/4, early 13th Dynasty) the northern settlement was razed and replaced by two large residential complexes in Egyptian style,
    the so-called 'palace', that the area to the south was converted into a garden, and that after a short time the garden layout was abandoned and a cemetery of rows of very large tombs was built there.
    Schiestl (2009) writes that, 'despite the lack of any clear evidence for direct royal links', the building is more appropriately classified as an 'elite residence'.
  statement_kind: reported
  evidence_class: primary_text
  confidence: moderate
  evidential_weight: 4
  anchor_checked: primary
  adoption_weight: 2
  adoption_note: >-
    The building is called a 'palace' in Bar-Ron 2017 and in the speaker's claim lines (read); the excavators' texts read use 'palatial mansion', 'palatial residence' and 'palace' in quotation marks. Audience and citation counts were not measured.
  would_change_if: >-
    the plans and field records of Area F/I (the Bietak, Eigner and Martin monograph in preparation) show a different building, phase or date, or the forthcoming monograph reclassifies the building
  anchor:
    type: primary_text
    description: >-
      Read: R. Schiestl, Tell el-Dab'a XVIII (2009), English Summary p. 480: 'the settlement in the north is razed and replaced by two enormous residential complexes in Egyptian style, the so-called "palace",
      while the area in the south is converted into a garden'; 'a cemetery consisting of rows of very large tombs is built'; 'Despite the lack of any clear evidence for direct royal links, the name "palace" has become
      established ... more appropriately classified as an "elite residence"'. Chapter I p. 19 says that a palatial residence was built in stratum d/1. Same team, other texts read and not relied on here: FWF P 34601 section III.1 ('South of the mansion, a garden
      was discovered ... a cemetery developed within the former garden to the south'), Bietak 1996 ('Later the gardens were used as a cemetery for the functionaries of the palace'), Bietak 2022. These are one origin (the excavation
      team), not independent confirmations. The FWF plan (Fig. 1) and Bietak 1996 Fig. 18 were viewed and show a walled building complex with a courtyard, rooms, circles and a garden area to the south.
    sources:
    - src-schiestl-2009-td18
  basis: >-
    # V: Schiestl 2009 English Summary and chapter I read 2026-10-16. A statement of what the excavators publish; not the ground itself. The FWF text calls the same building 'palatial mansion' and describes its ground floor as likely an administrative complex; Schiestl 2009 (chapter X) says the function of the palatial building and its relation to the necropolis 'bleiben unklar' (remain unclear).

- id: avaris-statue-asiatic-dignitary
  state: established
  statement: >-
    Fragments of a smashed, larger-than-life limestone statue of a seated man were found at Tell el-Dab'a, Area F/I, between 1986 and 1988, in several tombs of the south-eastern cemetery. Schiestl (2006, 2009) reconstructs it as about 2 m high
    (about one and a half times life size), with a mushroom-shaped hairdo painted dark brownish red, yellowish skin, a striped cloak and a throw-stick or crook held in the right hand, and reads it as an Asiatic man in a position of power.
  statement_kind: reported
  evidence_class: primary_text
  confidence: moderate
  evidential_weight: 4
  anchor_checked: primary
  adoption_weight: 3
  adoption_note: >-
    The statue is described and shown in Schiestl 2006 and 2009, Bietak 1996, Bar-Ron 2017 and Billington 2022 (all read) as an Asiatic man; the size differs between them (see avaris-statue-height-2m-vs-3m). Audience was not measured.
  would_change_if: >-
    the fragments, Bietak 1991b or the F/I monograph are read and give different dimensions, a different findspot or a different reading of the figure
  anchor:
    type: primary_text
    description: >-
      Read: Schiestl 2006, Agypten und Levante 16, 173-185: 'All the pieces of the statue presented here were found between 1986 and 1988 in a southeastern part of the cemetery F/I'; 'The seated figure of a man reaches a height of approximately 2 m';
      'The figure is approximately one and a half times life size.' Schiestl 2009 chapter III.3.2 (pp. 80-84): reconstructed total height 'annähernd 2 m', about one and a half times life size; fragments in four tombs, the largest group (head, remains of an inscribed base)
      in a robbers' shaft from the superstructure to the chamber of F/I-p/19-Nr. 1. Viewed 2026-10-16: Schiestl 2006 Figs 2 and 3 (line drawings of the reconstruction; the head with a broad mushroom-shaped hairdo, the right hand raised to the shoulder,
      the seat and base), Fig. 5 (drawing of the garment with red, black and white stripes beside a photograph of the right shoulder fragment), Schiestl 2009 Tafel IV (photographs of the fragments in situ in the shaft of tomb p/19-Grab 1).
      The reconstruction is Schiestl's, based on a small part of the whole (his words: 'a very small part'); the figures show what he reconstructs, not the complete object.
    sources:
    - src-schiestl-2006
    - src-schiestl-2009-td18
    nodes:
    - node: avaris-1986-1988-statue-fragments-found
      verb: supports
  basis: >-
    # V: read 2026-10-16. Schiestl 2006 and 2009 are two treatments by one author, so one witness. Bietak 1996 gives the statue as 'nearly twice life-size' (same team).

- id: avaris-statue-identification-by-excavators
  state: established
  statement: >-
    Schiestl (2006) writes that the statue 'clearly shows an Asiatic man in power, a dignitary' that 'could also be read as a dignitary ruling over Asiatics'. Schiestl (2009, chapter IX) writes that the statue, from stratum d/2, conveys in its monumentality
    'einen nach aussen getragenen Machtanspruch' (a claim to power carried outward) while avoiding all royal attributes, Egyptian and Near Eastern, and proposes as a counter-model that the buried men of stratum d/1 were officials in Egyptian state service.
    Neither names a person.
  statement_kind: reported
  evidence_class: primary_text
  confidence: moderate
  evidential_weight: 4
  anchor_checked: primary
  adoption_weight: 1
  adoption_note: Not measured. The speaker's claim lines (read) and Bar-Ron 2017 and Billington 2022 (read) go to Joseph or Jacob; none of them states Schiestl's reading.
  would_change_if: >-
    a name or title is read on the statue base or another fragment, or the forthcoming F/I monograph argues a specific identity
  anchor:
    type: primary_text
    description: >-
      Read: Schiestl 2006, p. 183: 'While it clearly shows an Asiatic man in power, a dignitary, it could also be read as a dignitary ruling over Asiatics.' Schiestl 2009, chapter IX p. 212 (German, paraphrased with short fragments): the statue from stratum d/2
      'vermittelt in ihrer Monumentalitat einen nach aussen getragenen Machtanspruch. Sie vermeidet jedoch jegliche koniglichen Attribute'; p. 213: the buried men are 'Beamte im agyptischen Staatsdienst'. The sentence that cuts against a neat
      'no power' reading is the first of these: Schiestl does state that the statue expresses a claim to power; what he denies is royal status.
    sources:
    - src-schiestl-2006
    - src-schiestl-2009-td18
  basis: >-
    # V: read 2026-10-16 (German text layer; fragments given in plain ASCII). These are Schiestl's interpretations; they are not facts about the ground.

- id: avaris-statue-prince-of-retjenu-possible
  state: proposed
  statement: >-
    The FWF P 34601 preliminary report by Bietak's team writes that the statue may have represented a 'Prince of Retjenu', 'with the title serving as an honorary designation bestowed by the Egyptian crown upon the highest-ranking dignitary of Western Asiatic ancestry at Tell el-Dab'a',
    and records an amethyst scarab with the title 'Prince of Retjenu' and the name 'Sobekemhat'. It does not say the scarab belongs to this statue.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: 'no'
  adoption_weight: 1
  adoption_note: Not measured. Not repeated in the advocacy texts read.
  would_change_if: >-
    the forthcoming monograph or Bietak's reports argue the identification with reasons, or a name or title is read on the statue
  anchor:
    type: interpretive
    description: >-
      Read: FWF P 34601 section III.1 (not II.1 as the first-round note said): 'It is possible that this statue represented a "Prince of Retjenu", with the title serving as an honorary designation bestowed by the Egyptian crown upon the highest-ranking dignitary
      of Western Asiatic ancestry at Tell el-Dab'a.' The section heading ends 'Probable Residence of an Asiatic Dignitary (Prince of Retjenu?)'. Schiestl 2009 (chapter IX, p. 213) says the partly preserved title on the amethyst scarab from tomb F/I-m/18 no. 3
      'lasst sich nicht zu einem koniglichen Titel erganzen' and that all proposed readings point to an official title conferred by Egypt. One team, one origin; the FWF report is an unreviewed project report.
    sources:
    - src-fwf-p34601
    - src-bietak-2022-eah
  basis: A possibility flagged by the team in its own words; read 2026-10-16.

- id: avaris-statue-base-no-name-read
  state: searched_gap
  statement: >-
    Schiestl (2006, 2009) reports that of the hieroglyphic text on the surviving base block the only legible part is the word snTr 'incense' at the start of the lower line, that a second line above it is illegible, and gives no personal name.
  statement_kind: search_result
  evidence_class: interpretive
  confidence: low
  evidential_weight: 1
  anchor_checked: 'no'
  adoption_weight: 1
  adoption_note: Not measured. Not mentioned in the speaker's claim lines or the advocacy texts read.
  would_change_if: >-
    the base block, its photographs or a hand copy are read by an epigrapher and show a name or title, or Bietak 1991b (Taf. 16-17) or the F/I monograph publishes more text
  next_step: >-
    Have the photograph and drawing of the base block (Schiestl 2009 Tafel IV d; Bietak 1991b Taf. 16-17) read by an epigrapher.
  absence_anchor: true
  anchor:
    type: search-record
    description: >-
      Read: Schiestl 2006, p. 182: 'Of the hieroglyphic inscription the only legible part is the word [snTr], incense, written at the beginning of a horizontal line of text, running from right to left. Above it, a second horizontal line can just be made out, but the signs
      unfortunately remain illegible.' Schiestl 2009, III.3.2.1 p. 80: the block, 25 cm high, has two preserved horizontal lines on top, the lower legible, the upper not decipherable; the word 'incense' belongs to the offering formula. Viewed 2026-10-16: Schiestl 2009 Tafel IV d
      (photograph of the base fragment in situ): shallow carved lines are visible on the broken face; the signs could not be read by us at that resolution and angle (not read). The 2006 text layer prints the transliteration with a c; the 2009 text layer prints snTr; the signs were not checked
      against the printed page glyphs.
    sources:
    - src-schiestl-2006
    - src-schiestl-2009-td18
  basis: >-
    A statement about what Schiestl could read. It is not an absence in the object: the signs were not read here. Capped by absence_anchor.

- id: avaris-statue-findspot-ambiguous
  state: proposed
  statement: >-
    Schiestl (2006) says the statue's original position and stratigraphic attribution 'remain ambiguous'. Schiestl (2009) says the distribution of fragments gives no clear original place, that tomb p/19-Nr. 1 (stratum d/2) is favoured because the largest group of fragments lay there,
    that production in stratum d/2 fits the cemetery better, and that stratum d/2 is more likely; he treats p/21-Nr. 1 (d/1) as the alternative. On that reading the statue and its likely tomb are older than the palatial residence (stratum d/1).
  statement_kind: judgment
  evidence_class: primary_text
  confidence: low
  evidential_weight: 3
  anchor_checked: primary
  adoption_weight: 1
  adoption_note: >-
    The texts read give different strata: Bietak 2022 puts the chapel statue in phase H, Bar-Ron 2017 says it 'was found in Stratum G/4', Bietak 1996 says Eigner considers d/2 probable. Neither Bar-Ron nor the speaker's claim lines (read) mention the ambiguity. Audience not measured.
  would_change_if: >-
    the excavators publish a stratigraphic decision (the F/I monograph, expected early 2026 per the FWF report), or Bietak 1991b, 1994 or Eigner 1985 are read and say otherwise
  anchor:
    type: primary_text
    description: >-
      Read: Schiestl 2006, p. 175: 'Thus, unfortunately, the original position and stratigraphic attribution of the statue remain ambiguous.' Schiestl 2009: III.3.2.2 p. 84 ('Aus der Verteilung der Statuenfragmente lasst sich archaologisch kein eindeutiger ursprunglicher Aufstellungsort ableiten';
      'Eine Herstellung in Str. d/2 ist im Kontext der Gesamtnekropole stimmiger'; synchronous making of this statue and the small statuette from tomb l/19 no. 1 'erscheint hochst unwahrscheinlich'); English Summary p. 482: 'Its stratigraphic position remains ambiguous, but stratum d/2 is more likely';
      chapter X p. 216: set up in the superstructure of a tomb 'mit hoher Wahrscheinlichkeit des Str. d/2'; chapter IX p. 212 (note 2079) says that Bietak's preliminary reports discuss p/19-Nr. 1 as lying between d/2 and d/1 'und keine eindeutige Zuordnung getroffen'.
      Schiestl 2009 p. 212: with the statue older, 'ist jedoch die Gleichzeitigkeit mit der palatialen Residenz verloren'. Schiestl 2009 English Summary p. 480 also states that the name 'palace necropolis' applies only to the younger cemetery, stratum d/1. Viewed: Schiestl 2006 Fig. 1 (plan with the shaded tombs
      p/19-Nr. 1 and 10, o/20-Nr. 11, p/21-Nr. 1 where fragments were found).
    sources:
    - src-schiestl-2006
    - src-schiestl-2009-td18
    nodes:
    - node: avaris-1986-1988-statue-fragments-found
      verb: qualifies
  basis: >-
    # V: read 2026-10-16. A hedged judgment by the excavator (his words: 'more likely', 'tentatively'). Bietak 2022 ('Phase H') and Bietak 1996 (Eigner: probable d/2) point the same way; Bar-Ron's 'Stratum G/4' differs. Not an established stratigraphic fact.

- id: avaris-statue-height-2m-vs-3m
  state: proposed
  statement: >-
    The published heights of the statue differ. Schiestl (2006, 2009) gives 'approximately 2 m' (about one and a half times life size) for the reconstructed seated figure; Bietak (1996) says 'nearly twice life-size'; Bar-Ron (2017) says 'a 3-meter-high, sitting statue'.
    Bar-Ron's figure credits a reconstruction drawing of a coloured coat to Rohl (p. 118); no source for the 3 m figure is given in the text read.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: 'no'
  adoption_weight: 2
  adoption_note: 'The 3 m figure is repeated in Bar-Ron 2017 (read); the speaker''s claim lines (read) give no height. Audience not measured.'
  would_change_if: >-
    Rohl's text is read and gives the basis for 3 m, or the fragments are measured and the reconstruction revised
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2006 p. 175 ('approximately 2 m'; 'approximately one and a half times life size'; a depth of seat about 70 cm and total about 1.3 m including the base); Schiestl 2009 p. 83 ('annahernd 2 m'); Bietak 1996 ('nearly twice life-size'); Bar-Ron 2017 p. 4 ('with the broken remains of a 3-meter-high, sitting statue').
      Bar-Ron's picture of the statue is a coloured drawing with a coat in red, blue, black and white; Schiestl 2009 p. 82 fn. 487 quotes Rohl 1995 for the coat and does not accept the coat as a reconstruction of surviving parts (see avaris-schiestl-2009-on-rohl-coat).
      The two sets of numbers are not reconciled by any source read.
    sources:
    - src-schiestl-2006
    - src-schiestl-2009-td18
    - src-bar-ron-2017
    - src-bietak-1996
  basis: >-
    # V: read 2026-10-16. Both numbers are stated by their authors; neither is a measurement of the fragments. The difference is recorded, not resolved.

- id: avaris-munich-aas-7171
  state: proposed
  statement: >-
    A second Western Asiatic head with a mushroom-shaped hairdo, in the Museum of Egyptian Art in Munich (ÄS 7171), is named in the sources read. Schiestl (2006) calls it 'the closest parallel', 'recently acquired', and notes traces of a beard; Bietak (2022) writes that 'from this phase (G/4) seems to originate
    a high-quality statue of another Western Asiatic dignitary with a mushroom-shaped coiffure, now in the Museum of Egyptian Art in Munich (ÄS 7171)'. No source read gives a findspot for it.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: 'no'
  adoption_weight: 1
  adoption_note: Not measured. Not mentioned in Bar-Ron 2017, Billington 2022 or the speaker's claim lines (read).
  would_change_if: >-
    the Munich museum record or Wildung 2000 (no. 83) is read and gives a provenance, a date or a different attribution
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2006 p. 179: 'The closest parallel is a limestone head recently acquired by the Egyptian Museum in Munich', with 'traces of a beard' and footnote 12 'MAS 7171, WILDUNG 2000, 149, Nr. 83'. Bietak 2022 (third-party copy, p. 2 of the entry): 'From this phase (G/4) seems to originate a high-quality statue of another Western Asiatic dignitary with a mushroom-shaped coiffure,
      now in the Museum of Egyptian Art in Munich (AS 7171).' The two texts differ on how close the connection to Tell el-Dab'a is (a parallel in one, an origin 'seems' in the other). Not read: the museum record, Wildung 2000. Viewed: the head photograph on the auaris.at F/I page (pic_9) is of the Tell el-Dab'a head and shoulder, not the Munich head.
    sources:
    - src-schiestl-2006
    - src-bietak-2022-eah
  basis: Listed because it is a second object of the same type that a later reader could confuse with the F/I statue. Not used for any other claim.

- id: avaris-statue-prince-or-king-ryholt
  state: contested
  statement: >-
    The statue of the Asiatic man shows a king, or a treasurer, of the 14th Dynasty. (Position of K. Ryholt as reported by Schiestl 2009, p. 212; Ryholt's text was not read.)
  statement_kind: judgment
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: 'no'
  adoption_weight: 1
  adoption_note: Not measured. The speaker's claim line calls the figure 'a foreign king' in one wording (read); no text read links that wording to Ryholt.
  would_change_if: >-
    Ryholt 1997 (pp. 104-105, 359-378) is read and argues the reading, or a title or royal attribute is read on the statue or its tomb
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2009, p. 212 (German): 'In der Statue des asiatischen Mannes sieht K. Ryholt die Darstellung eines Konigs oder eines Schatzmeisters der 14. Dynastie.' Schiestl then states that Ryholt's reading of the cemetery as a 14th Dynasty royal necropolis is 'auf jeden Fall abzulehnen' (to be rejected in any case)
      and that 'die Frage bestehen bleibt' (the question remains) whether the cemetery could be a necropolis of Asiatic petty princes or kings; he lists objections: (1) the plan of the d/1 cemetery is egalitarian, (2) the individual tombs are modest next to official tombs at Abydos and Dahshur, (3) no royal insignia were found in the
      cemetery area, and the statue lacks royal attributes, (4) the partly preserved title on a scarab cannot be completed to a royal title. He adds that the statue is from stratum d/2 and so older than the palatial residence. The sentence that cuts against a neat 'no royal reading' summary is that Schiestl leaves the general question open before arguing against it.
      Ryholt's own words, his reasons and what he says about the statue are not known from a read source.
    sources:
    - src-schiestl-2009-td18
    - src-ryholt-1997
  basis: >-
    # V: Schiestl 2009 pp. 212-213 read 2026-10-16. The claim states Ryholt's position as Schiestl reports it. Schiestl's objections are his; Ryholt had no reply in anything read.
  positions:
  - label: 'King or treasurer of the 14th Dynasty'
    holder: K. Ryholt, as reported by R. Schiestl 2009 (Ryholt not read)
    ground: not known from a source read
  - label: 'No royal attributes; an official of the Egyptian state; question of petty princes left open before objections'
    holder: R. Schiestl 2009
    ground: egalitarian plan, modest tombs, no royal insignia, official title on the scarab, statue older than the palatial residence
  disputed_by:
  - who: R. Schiestl (2009, chapter IX)
    kind: person
    position: rejects Ryholt's reading of the cemetery as a 14th Dynasty royal necropolis and gives four objections to royal readings of the cemetery
    source_read: yes, Schiestl 2009 chapter IX
