  statement: >-
    The excavators read the statue as a high-ranking Asiatic dignitary of Tell el-Dab'a and have suggested, with a question mark, that he may
    have held the Egyptian-bestowed title 'Prince of Retjenu'. Schiestl also states that it could be read as 'a dignitary ruling over Asiatics'.
    None of these readings names a person.
  statement_kind: judgment
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: secondary
  adoption_weight: 2
  adoption_note: The excavators' reading is hardly seen in the speaker's wording, which goes to Joseph or Jacob.
  would_change_if: >-
    a name or title is read on the statue base or another fragment, or the 2009 and forthcoming Bietak/Eigner/Martin monographs argue a specific
    identity
  anchor:
    type: interpretive
    description: >-
      Read: FWF P 34601 (section II.1): 'It is possible that this statue represented a "Prince of Retjenu", with the title serving as an honorary
      designation bestowed by the Egyptian crown upon the highest-ranking dignitary of Western Asiatic ancestry at Tell el-Dab'a.' Schiestl 2006,
      p. 183: 'While it clearly shows an Asiatic man in power, a dignitary, it could also be read as a dignitary ruling over Asiatics.' The same
      FWF page records an amethyst scarab with the title 'Prince of Retjenu' and the name 'Sobekemhat'; no source read ties that name to this
      statue.
    sources:
    - src-fwf-p34601
    - src-schiestl-2006
  basis: >-
    # V: read 2026-10-14. These are the excavators' interpretations (interpretive, secondary), flagged by them as possibilities.
