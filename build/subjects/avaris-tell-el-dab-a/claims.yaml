  would_change_if: >-
    an independent record shows that the tomb held an embalmed body or coffin; or the Bible-based reading is tied to the tomb by a naming text
  anchor:
    type: interpretive
    description: >-
      Genesis 50:26 (Hebrew and KJV) says Joseph was embalmed and put in a coffin 'in Egypt', not in a tomb at Avaris. Bietak 2022: 'No mummification can be ascertained' in the Tell el-Dab'a burials, which are mostly in contracted posture with Near-Eastern customs, while 'Higher-ranking tombs before the Hyksos period had wooden coffins.'
      Schiestl 2009 (English Summary p. 482): evidence for two coffins in stratum d/2 and six in d/1 from traces of plaster and paint; 'The lack of preserved organic materials does not allow discussing whether some form of mummification or other special preparations for the body were undertaken.' The first is a general statement for the burials; the second says it cannot be discussed. Neither is a finding about a single tomb.
