- id: avaris-statue-findspot-ambiguous
  state: proposed
  statement: >-
    Where the statue originally stood, and in which stratum, is not settled in the publication read. Fragments were scattered over tombs of strata
    d/2 (phase H), d/1 (phase G/4) and possibly c; Schiestl names tomb p/19 no. 1 (d/2) as a very good possibility and tomb p/21 no. 1 (d/1) as
    also qualifying.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: secondary
  adoption_weight: 1
  adoption_note: >-
    The advocacy papers read place the statue in stratum G/4 beside the palace; Bietak 2022 puts the chapel statue in phase H. Neither the ambiguity
    nor the difference is mentioned there.
  would_change_if: >-
    the excavators publish a stratigraphic decision (Bietak, Eigner and Martin monograph, expected early 2026 per the FWF page), or Schiestl 2009
    settles it
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2006, p. 175: 'Thus, unfortunately, the original position and stratigraphic attribution of the statue remain ambiguous.'
      Bietak 2022: 'A chapel on top of a big tomb contained a larger-than-life-size statue of a high-ranking prince (Phase H).' Bar-Ron 2017:
      'it was found in Stratum G/4'. These three statements do not agree on the stratum.
    sources:
    - src-schiestl-2006
    - src-bietak-2022-eah
    - src-bar-ron-2017
    nodes:
    - node: avaris-1986-1988-statue-fragments-found
      verb: qualifies
  basis: '# V: read 2026-10-14. The disagreement is between texts read; no stratigraphic record was viewed.'
- id: avaris-tomb-p19-1-bones
  state: proposed
  statement: >-
    In the open publication read, the massive tomb p/19 no. 1 (Schiestl's leading candidate for the statue's original place) is described as completely
    plundered, but bone fragments from its burial chamber are assigned to two individuals, an adult male and a mature female.
  statement_kind: reported
  evidence_class: interpretive
  confidence: low
  evidential_weight: 2
  anchor_checked: secondary
  adoption_weight: 2
  adoption_note: >-
    The 'no bones' point is central to the speaker's identification with Joseph and to the advocacy papers; the excavators' reports read do not
    say the tomb was empty of bones.
  would_change_if: >-
    the anthropological report (K. Grossschmidt and team) is read and says otherwise, or the tomb in the speaker's account is a different tomb
    (p/21 no. 1 or another)
  anchor:
    type: interpretive
    description: >-
      Read: Schiestl 2006, p. 175: 'The tomb had been completely plundered and nothing was left of the original tomb equipment inside the chamber.
      Bone fragments from the burial chamber can be assigned to two individuals, an adult male and a mature female.' (footnote 4 thanks K. Grossschmidt
      and team). Not read: the anthropological report; the speaker does not say which tomb he means; Schiestl says tomb p/21 no. 1 'would also
      qualify' for the statue.
    sources:
    - src-schiestl-2006
  basis: >-
    # V: read 2026-10-14. This does not show the tomb the speaker means held bones; it shows the leading candidate did, per the excavators' anthropologists,
    as relayed by Schiestl.
  alternatives:
  - text: The speaker/advocates mean another tomb (for example p/21 no. 1) that may have been found without bones.
    why_not_preferred: No excavation report read says any tomb at F/I was found without bones; not excluded either.
