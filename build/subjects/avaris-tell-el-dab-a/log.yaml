  - id: L-04
    date: 2026-10-14
    entry: >
      WHO FUNDED AND CONTROLLED THE WORK (traced as far as sources opened allow; the rest is UNRESEARCHED). Excavation: directed by Manfred Bietak, described in the texts read as University of Vienna (Bietak 2022), University of Innsbruck and the Austrian Academy of Sciences (FWF page);
      the 2011 report is from the Austrian Archaeological Institute Cairo, which thanks the Egyptian Supreme Council of Antiquities, the Austrian Embassy and the Institute's director. The Tell el-Dab'a volumes appear in a series that Bietak himself edits (Untersuchungen der Zweigstelle Kairo, 'Herausgegeben ... von MANFRED BIETAK', page 1 of src-uzk-series-ad),
      so the excavation director also edited the publication of his team's reports. The 2022 entry is in a Wiley encyclopedia (a commercial publisher). A current project is labelled 'FWF Project P 34601'; the document does not expand FWF or name its funders in the text read, and Bietak 2022's bibliography mentions an 'ERC advanced grant The enigma of the Hyksos' (seen in a reference list only).
      Who funded the 1979-1989 F/I seasons that found the statue: UNRESEARCHED. Schiestl: affiliation and funding UNRESEARCHED. Advocacy side: Bar-Ron is a rabbi at Beth Midrash Ohel Moshe (Beit Shemesh) who thanks David Rohl as mentor; host Kankan Journal, funders of Bar-Ron, Rohl and the host: UNRESEARCHED.
      ABR (publisher of Billington's review) describes itself on its About page as 'a Christian Apologetics Ministry Dedicated to Demonstrating the Historical Reliability of the Bible through Archaeological and Biblical Research' and states it leads a licensed excavation in Israel; its donors and finances: UNRESEARCHED. Petrovich's publisher New Creation (as printed in the review) and Rohl's publishers: UNRESEARCHED.
      Nothing is asserted about funding beyond what is quoted above.
  - id: L-05
    date: 2026-10-14
    entry: >
      WEIGHING AND WHERE THE FACTS END. Established in the texts read, at a secondary level only: a mansion, a garden and a later elite cemetery at F/I; a smashed, larger-than-life statue of an Asiatic man with a mushroom coiffure, found 1986-1988; strata dates of roughly 1850-1750 BCE.
      Not found in what was read: twelve columns, twelve tombs, a pyramid, a name for the statue, or any text tying tombs or statue to Joseph, Jacob or the Fifteenth Dynasty. One text read (Schiestl 2006) says the leading candidate tomb p/19 no. 1 yielded bone fragments of two individuals; the speaker and the advocacy paper say the largest tomb had no bones; which tomb is meant is not stated.
      Opposing readings are kept as contested claims with named positions: (a) Rohl via Bar-Ron: Joseph (as the vizier Ankhu), pyramid tomb, no bones; (b) Petrovich via Billington: Jacob; (c) Bietak, Schiestl: an unnamed Asiatic dignitary, possibly a Prince of Retjenu. None is closed. The two advocacy positions contradict each other on who the statue is.
      The speaker claims are filed contested, proposed or searched_gap at weight 1; none is called refuted because the plans, the 1991 report and the 2009 monograph were not read, and the excavators' texts read are summaries. The descent claims (12 tribes; Fifteenth Dynasty) are searched gaps of the structural type.
      Dating: the excavators' own strata dates differ by about 30 years between 2006 and the FWF page; the reasons were not read. The speaker's 'about 1900 BC' is outside both.
