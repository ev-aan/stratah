      Adoption weights now say 'not measured' unless a read document repeats the claim; the evidential and adoption weights stay separate. Transmission: tx-av-02 now rests on Bar-Ron's own sentence about Rohl (read) and no longer lists specifics attributed to a source marked read: no; a 1994 event (tx-av-07, the pyramid proposal as reported by Schiestl) was added; the inferred wording 'appeared and reached the speaker' was removed.
