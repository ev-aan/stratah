  - id: L-10
    date: 2026-10-16
    entry: >
      CORRECTIONS TO FIRST-ROUND STATEMENTS (the earlier entries are unchanged; these replace them where they differ). (a) L-05 and the first-round claims said no pyramid was found in the excavators' texts. In the passages read then it was not; in Schiestl 2009 (pp. 64-65) a small brick pyramid for tomb p/19-Grab 1 is reported as Bietak's proposal (Bietak 1994 cited) and judged by Schiestl
      conceivable but not very probable. The pyramid claim is now filed with positions on both sides (avaris-largest-tomb-pyramid) and the excavator text as its own claim (avaris-schiestl-2009-pyramid-discussion). (b) L-05 said twelve columns were not found. No excavator's total of twelve was found; the plans show rows of about a dozen dots per long side by our count of an image, and Bar-Ron's caption says two rows of twelve; both are now recorded.
      (c) L-05 said the speaker's 'about 1900 BC' is outside both excavator date ranges. The printed absolute figures read are 1850-1750 BCE (FWF 1850-1780; Schiestl 2006 1820-1750; publisher abstract 1830-1750), and Schiestl 2009 p. 19 writes 'about the end of the 19th and beginning of the 18th century BC'; so 'about 1900' is earlier than any printed figure and near the early edge of that wording. (d) L-05 and the first-round claims (and search_summary and divergence_note) said the Petrovich and Rohl readings 'contradict each other' and that the 'two advocacy positions' disagree.
      What the sources read state: Bar-Ron (2017) names Rohl and states Joseph for the statue and says the earlier Syrian-style house 'fits what we would expect of the house of Jacob'; Billington (2022) reports that Petrovich argues the statue is Jacob and the four-room house under the palatial house was Jacob's, and writes that 'some conservative Bible scholars' suggested Joseph without naming Rohl; Bar-Ron does not mention Petrovich. The two readings differ in who the statue is; no source read states that either author disputes the other. The earlier wording is withdrawn.
      (e) The first-round divergence_note said the advocates' 'own chronology and reading choices drive' the story. That is a statement about cause or motive for which nothing read provides support; it is withdrawn and the note now lists coverage facts only. (f) The first-round wording that placed the Joseph reading outside the excavation as 'advocacy' and called ABR an apologetics ministry's site were the author's characterisations; the manifest now uses ABR's own description in quotation marks and the papers' own stated aims. (g) L-04 said the director 'edited the series that publishes his team's reports'. The editor line is read and stands as a bibliographic fact; its stated purpose is withdrawn.
      Funding tracing was uneven (partial on the excavation side, none on the other); both sides now use the same wording: who funded or controls the work is not read and is an open task, for the excavation side (FWF P 34601 and the ERC grant named in a reference list, the 1979-1989 seasons) and for the other side (Bar-Ron, the Kankan Journal, ABR, Rohl, Petrovich).
