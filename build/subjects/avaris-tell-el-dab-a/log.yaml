  - id: L-01
    date: 2026-10-14
    entry: >
      DIG OPENED from a handoff written by another agent (avaris-tell-el-dab-a.yaml). Its object identification ("Tell el-Daba Avaris excavations Bietak palace tombs statue; excavation reports")
      was an unverified guess. Nine Dead Hidden claim lines (dh-KNhzmEKodZg-19, -23; dh-qL1VmGF3BF8-02, -03, -04, -05, -29, -30, -37; dh-qL1VmGF3BF8-01 added for the 12-columns wording) were read in the
      claims files and split into 15 separate speaker claims (prefix avaris-sp-), each with the speaker's own wording kept. No headline is published (headline_status draft).
      The speaker's claims have no plain time or find numbers; the object is identified here as the area F/I mansion, garden cemetery and the statue of an Asiatic man at Tell el-Dab'a, which is the excavators' own reading of the find, not a certainty about what the speaker means.
