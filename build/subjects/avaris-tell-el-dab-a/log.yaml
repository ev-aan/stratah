  - id: L-08
    date: 2026-10-16
    entry: >
      SECOND ROUND: WHAT WAS OPENED AND READ. The owner's complaint was that the dig rested on summaries and translations. This round read the excavators' own publications and viewed the figures. (1) R. Schiestl, Tell el-Dab'a XVIII (OeAW 2009), open access on austriaca.at:
      chapter I (pp. 19-28), chapter II (pp. 29-72, read around the passages on superstructures and the pyramid discussion), chapter III (pp. 73-89, the statue section III.3), chapter IX (pp. 206-214, the Ryholt discussion and the 'officials of the Egyptian state' model), chapter X (pp. 215-216), the catalogue entry
      for tomb F/I-p/19-Grab 1 (pp. 287-290), the English Summary (pp. 479-484), and Tafeln IV and XXXII viewed. Hashes are in the manifest. (2) M. Bietak, Avaris, the Capital of the Hyksos (British Museum Press 1996), read in a public scan on archive.org (access path only; the book is the source; nothing stored): the passages on the statue, the palace columns and the six tombs; Figs 18-21 viewed at low resolution.
      (3) Figures viewed in PDFs already in hand: Schiestl 2006 Figs 1-6 (the plan of the south-eastern cemetery with labelled tombs, drawings of the reconstruction, photographs of chisel marks, the garment drawing and the fringe fragment; the article contains no figure of the inscribed base block, so the reviewer's mention of a base photograph in that article was not found; the base photograph is Schiestl 2009 Tafel IV d);
      FWF P 34601 Figs 1 and 2 (plans); Bar-Ron 2017 pp. 3-5 (a coloured plan, a photograph of a numbered model, a drawing of a coloured statue); the nine auaris.at thumbnails (100 pixels wide; no fine detail readable); Bietak 2022 figure captions (no figure of area F/I in the list). (4) The Hebrew of Genesis 50:22-26, Exodus 13:19 and Joshua 24:32 in a modern edition served by sefaria.org.
      (5) Billington's review re-fetched (hash differs from the first round in markup only). What the figures showed: Schiestl 2006 Fig. 1 labels more than twelve 'TOMB' numbers in its south-eastern part with numbering restarting in each grid square. FWF Fig. 1 shows rows of black dots along the two long sides of the courtyard H and along the portico; by our count of the 753 x 568 pixel image, twelve per long side
      (and three along each short side between the corners, about 30 in the ring), four dots in room M and nine black dots plus one open ring in the portico row E; Bar-Ron's coloured plan shows two rows of twelve larger and smaller circles with three between at each end. These counts are ours, made by eye on low-resolution images, and are filed as a computed result, never an anchor (claim avaris-mansion-columns-count).
      Bar-Ron's model photograph is numbered 1 to 12, with a pyramid-shaped top on no. 12 (claim avaris-model-numbered-1-to-12). Tafel IV d shows shallow carved lines on the base fragment; the signs could not be read by us. Tafel XXXII shows vaulted and tapering reconstructions of the superstructures, no pyramid.
