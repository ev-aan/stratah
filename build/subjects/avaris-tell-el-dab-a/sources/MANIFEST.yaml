# Sources for the avaris-tell-el-dab-a dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored in the repository; every source is cited by URL. sha256 values are of the copies fetched into a scratch directory on 2026-10-14.
# NO source below is primary data. Primary data for this subject is the statue fragments, the tombs, the plans and the photographs/drawings
# (Bietak 1991b; Bietak 1996; Schiestl 2009), none of which was viewed. Every book, article, translation and video here is a claim.
# Tests were run in this session (2026-10-14), which is not an independent review.
retrieved: 2026-10-14
sources:

  - id: src-schiestl-2006
    title: "Robert Schiestl, 'The Statue of an Asiatic Man from Tell el-Dab'a, Egypt', Agypten und Levante 16 (2006), 173-185"
    url: https://austriaca.at/0xc1aa5576_0x0016f30e.pdf
    document_class: "interpretive: excavator-team article describing and reconstructing the statue fragments. Author affiliation not read in the text layer (UNRESEARCHED). Published in the journal series of the Austrian Academy of Sciences (the publisher's open platform austriaca.at); funding of the work: UNRESEARCHED. The excavation was directed by M. Bietak, who also edits the Untersuchungen der Zweigstelle Kairo series (see src-uzk-series-ad)."
    read: yes, directly (PDF text layer, 14 pages, sha256 450afb4d9c4e6172f3e39ea20bc89a2da5c00954abac9d97d04cc82dd04dfdea). Photographs and drawings were NOT examined.
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Fetched from austriaca.at (the Austrian Academy of Sciences' open-access platform) on 2026-10-14. Journal, volume, year and pages printed in the PDF running heads (pp. 173-185) agree with the citation 'Agypten und Levante 16, 2006, 173-185' given independently on the auaris.at F/I page. Holder of the original print not recorded."
      tests:
        - "Running heads and page numbers in the PDF (173-185) match the citation on the auaris.at F/I page (could have failed)"
        - "Stratum dates, tomb p/19 no. 1 and the statue description agree in substance with the auaris.at F/I page text by the same author (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Text layer only; figures, photographs and drawings not viewed", "Not compared with the printed volume", "Peer-review status of the journal not checked"]
      next_step: "Compare with the printed volume, then read Schiestl 2009 (Tell el-Dab'a XVIII) for the tomb and statue contexts."
      checked: 2026-10-14

