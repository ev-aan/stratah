# Sources for the avaris-tell-el-dab-a dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored in the repository; every source is cited by URL. sha256 values are of the copies fetched into a scratch directory
# (first round 2026-10-14; second round, with figures viewed and the open-access monograph read, 2026-10-16).
# What counts as primary here: the excavators' own publications (Schiestl 2006, Schiestl 2009 with its catalogue and plates, Bietak 1996) are the
# nearest read material to the ground. They are reports and reconstructions by the excavation team, not the ground itself. The statue fragments, the
# tombs and the bones themselves were not seen. Figures in the open PDFs were viewed on 2026-10-16 (plans, drawings, photographs); a figure is
# described only as far as it could be read, and what could not be read is marked not read.
# Tests were run in these sessions by the author, which is not an independent review.
retrieved: 2026-10-14
retrieved_second_round: 2026-10-16
sources:

  - id: src-schiestl-2006
    title: "Robert Schiestl, 'The Statue of an Asiatic Man from Tell el-Dab'a, Egypt', Agypten und Levante 16 (2006), 173-185"
    url: https://austriaca.at/0xc1aa5576_0x0016f30e.pdf
    document_class: "interpretive for the author's reconstructions and readings; the claims marked primary_text state only what the article itself prints. Excavator-team article describing and reconstructing the statue fragments. Published in the journal series of the Austrian Academy of Sciences (open platform austriaca.at). Author affiliation as printed in the text layer: not read (open task)."
    read: >-
      yes, directly (PDF text layer, 14 pages, sha256 450afb4d9c4e6172f3e39ea20bc89a2da5c00954abac9d97d04cc82dd04dfdea). Figures viewed 2026-10-16 - Fig. 1 (plan of the south-eastern cemetery), Figs 2-3 (graphic reconstruction drawings), Fig. 4.1-4.2 (photographs of chisel marks), Fig. 5 (garment drawing and photograph), Fig. 6 (fringe fragment drawing). No figure in this article shows the inscribed base block.
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Fetched from austriaca.at (the Austrian Academy of Sciences' open-access platform) on 2026-10-14 and again 2026-10-16 (same sha256). Journal, volume, year and pages printed in the PDF running heads (pp. 173-185) agree with the citation 'Agypten und Levante 16, 2006, 173-185' given independently on the auaris.at F/I page. Holder of the original print not recorded."
      tests:
        - "Running heads and page numbers in the PDF (173-185) match the citation on the auaris.at F/I page (could have failed)"
        - "Stratum dates, tomb p/19 no. 1 and the statue description agree in substance with the auaris.at F/I page text by the same author (could have failed)"
        - "Tomb p/19 no. 1 superstructure size, annex size and two individuals agree with the catalogue entry in Schiestl 2009 (src-schiestl-2009-td18) (could have failed)"
      tested_by: "Stratah dig sessions, 2026-10-14 and 2026-10-16 (not an independent review)"
      gaps: ["Not compared with the printed volume", "Peer-review status of the journal not checked"]
      next_step: "Compare with the printed volume."
      checked: 2026-10-16

