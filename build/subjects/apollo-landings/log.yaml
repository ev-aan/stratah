  - id: L-21
    date: 2026-10-04
    entry: >
      CORRECTION of L-14 (d) and of the sample-dating claim (review round 1, R1-3). L-14 (d) said that "4.40 to 4.47 billion years" is in no
      source read. PSRD 2004 does give 4.40 billion years: for the Apollo 16 clast 67215 alone, a crystallisation age that "might have been
