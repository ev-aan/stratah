  - id: L-10
    date: 2026-10-04
    entry: >
      RESUMED by a dig author agent on branch dig/apollo-landings, from origin/main. The reason it was parked (primary hosts
      blocked) no longer holds: ntrs.nasa.gov, arxiv.org, nationalacademies.org, global.jaxa.jp, ilrs.gsfc.nasa.gov,
