# Timeline for the apollo-landings dig. Source of truth; timeline.html is generated by build/tools/render_timeline.py (rule T5).
timeline:
  id: apollo-landings
  title: Apollo landings, the records they left and the hoax polls (1969 to 2026)
  as_of: '2026-10-04'
  note: Times are UTC. Most events are known to the day, month or year only, so noon UTC is used for drawing and the precision field says what is known. Mission return
    dates are from the National Academies table; LROC and JAXA dates are the dates of their releases. Events marked single rest on one source. Panel B starts in 1995
    so the polls are visible.
panels:
- id: era
  title: 'Panel A: July 1969 to 1977 (one tick per year)'
  start: '1969-06-01T00:00:00Z'
  end: '1977-03-01T00:00:00Z'
  tick_years: 1
  lanes:
  - apollo
  - soviet
  - ground
  - records
- id: recent
  title: 'Panel B: 1995 to 2026 (one tick per three years)'
  start: '1995-01-01T00:00:00Z'
  end: '2027-01-01T00:00:00Z'
  tick_years: 3
  lanes:
  - ground
  - orbiters
  - records
  - reception
lanes:
  apollo:
    label: Apollo missions
  soviet:
    label: Soviet robotic missions
  ground:
    label: Laser ranging from Earth
  records:
    label: Records and reports
  orbiters:
    label: Orbiter imaging
  reception:
    label: Polls (adoption, not evidence)
people:
- who: Dick Nafzger
  detail: Goddard engineer who led NASA's Apollo 11 tape search team; quoted in NASA's 2009 final report and by Space.com.
- who: Marc Norman
  detail: Author of the 2004 PSRD summary on lunar anorthosite ages.
- who: P. J. Stooke
  detail: University of Western Ontario; author of the 2026 LPSC abstract on Chandrayaan-2 and LROC images.
sources:
  src-nasa-tapes-2009:
    title: 'The Apollo 11 Telemetry Data Recordings: A Final Report (NASA, 2009)'
    url: https://www.nasa.gov/wp-content/uploads/2015/01/398311main_apollo_11_report.pdf
    authenticity: authenticated, moderate
  src-nas-2019:
    title: National Academies of Sciences, Engineering, and Medicine. Strategic Investments in Instrumentation and Facilities for Extraterrestrial Sample Curation
      and Analysis (2019), chapter 2 (NAP page numbers
    url: https://www.nationalacademies.org/read/25312/chapter/4
    authenticity: authenticated, moderate
  src-murphy-2013:
    title: 'Murphy TW Jr. Lunar laser ranging: the millimeter challenge. Reports on Progress in Physics 76, 076901 (2013); arXiv:1309.6294 v1'
    url: https://arxiv.org/pdf/1309.6294
    authenticity: authenticated, moderate
  src-murphy-2011-l1:
    title: Murphy TW Jr. et al. Laser ranging to the lost Lunokhod 1 reflector. Icarus 211, 1103-1108 (2011); arXiv:1009.5720 v2
    url: https://arxiv.org/pdf/1009.5720
    authenticity: authenticated, moderate
  src-tn-d7080:
    title: 'English RA, Benson RE, Bailey JV, Barnes CM. Apollo Experience Report: Protection Against Radiation. NASA TN D-7080 (MSC S-329), March 1973'
    url: https://ntrs.nasa.gov/citations/19730010172
    authenticity: authenticated, strong
  src-psrd-2009:
    title: Martel LMV. Celebrated Moon Rocks. Planetary Science Research Discoveries, 21 Dec 2009 (Univ. of Hawaii; summary of NASA curator and CAPTEM presentations)
    url: http://www.psrd.hawaii.edu/Dec09/Apollo-lunar-samples.html
    authenticity: authenticated, weak
  src-gallup-1999:
    title: 'Gallup. Landing a Man on the Moon: The Public''s View (20 Jul 1999), with the 2001 note ''Did Men Really Land on the Moon?'' linked on the page'
    url: https://news.gallup.com/poll/3712/landing-man-moon-publics-view.aspx
    authenticity: authenticated, moderate
  src-jaxa-2008:
    title: 'JAXA press release, 20 May 2008: The ''halo'' area around Apollo 15 landing site observed by Terrain Camera on SELENE (KAGUYA)'
    url: https://global.jaxa.jp/press/2008/05/20080520_kaguya_e.html
    authenticity: authenticated, moderate
  src-spacecom-tapes-2009:
    title: Pearlman R. NASA Erased Moonwalk Tapes, Restores Copies. Space.com, 17 July 2009
    url: https://www.space.com/6994-nasa-erased-moonwalk-tapes-restores-copies.html
    authenticity: not_applicable
  src-lroc-first-look:
    title: Robinson M. LROC's First Look at the Apollo Landing Sites (LROC feature, 16 Jul 2009)
    url: https://lroc.im-ldi.com/images/157
    authenticity: authenticated, moderate
  src-lroc-a17:
    title: Robinson M. Exploring the Apollo 17 Site (LROC feature, 28 Oct 2009)
    url: https://lroc.im-ldi.com/images/72
    authenticity: authenticated, moderate
  src-lroc-skimming:
    title: Robinson M. Skimming the Moon (LROC feature, 6 Sep 2011)
    url: https://lroc.im-ldi.com/images/379
    authenticity: authenticated, moderate
  src-courde-2017:
    title: Courde C et al. Lunar laser ranging in infrared at the Grasse laser station. Astronomy & Astrophysics 602, A90 (2017); arXiv:1704.06443 v1
    url: https://arxiv.org/pdf/1704.06443
    authenticity: authenticated, moderate
  src-zhang-2022-tianqin:
    title: Zhang C et al. The facilities and performance of TianQin laser ranging station. Classical and Quantum Gravity 39(12), 2022 (doi 10.1088/1361-6382/ac6d3e)
    url: https://doi.org/10.1088/1361-6382/ac6d3e
    authenticity: authenticated, weak
  src-lpsc-2026-stooke:
    title: 'Stooke PJ. LROC-NAC and OHRC images of lunar mission sites: new insights. 57th Lunar and Planetary Science Conference (2026), abstract 1044'
    url: https://www.hou.usra.edu/meetings/lpsc2026/pdf/1044.pdf
    authenticity: authenticated, moderate
  src-ilrs-lunar:
    title: International Laser Ranging Service, Lunar Laser Ranging (LLR) science page, hosted at ilrs.gsfc.nasa.gov (last modified 30 Sep 2026)
    url: https://ilrs.gsfc.nasa.gov/science/scienceContributions/lunar.html
    authenticity: authenticated, moderate
events:
- id: a01
  panel: era
  lane: apollo
  time: '1969-07-20T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-nasa-tapes-2009
  label: '20 Jul 1969: Apollo 11 lands'
  detail: NASA's tape report opens 'When astronauts landed on the moon on July 20, 1969'. The clock time is not used; the dot is placed at noon UTC for drawing only.
- id: a02
  panel: era
  lane: apollo
  time: '1969-07-24T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '24 Jul 1969: Apollo 11 samples return (21.6 kg in the NAS table)'
  detail: NAS Table 2.1 gives the return date and mass; PSRD prints 21.8 kg for the same mission (see apollo-sample-masses-recorded).
- id: a03
  panel: era
  lane: ground
  time: '1969-08-01T12:00:00Z'
  precision: day
  kind: data
  status: single
  date_basis: stated
  sources:
  - src-murphy-2013
  label: '1 Aug 1969: first accurate laser ranges to the Apollo 11 reflector (Lick Observatory)'
  detail: 'Murphy''s review: ''less than two weeks after the landing'', from the 3.1 m telescope at Lick Observatory. Single source (Bender et al. 1973, which it
    cites, was not opened).'
- id: a04
  panel: era
  lane: apollo
  time: '1969-11-24T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '24 Nov 1969: Apollo 12 samples return (34.3 kg)'
  detail: NAS Table 2.1.
- id: a05
  panel: era
  lane: soviet
  time: '1970-09-24T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '24 Sep 1970: Luna 16 returns 101 g'
  detail: NAS Table 2.1 (0.10 kg) and text (101 g); LROC says 101 g.
- id: a06
  panel: era
  lane: soviet
  time: '1970-11-15T12:00:00Z'
  precision: month
  kind: document
  status: single
  date_basis: stated
  sources:
  - src-murphy-2011-l1
  label: 'Nov 1970: Lunokhod 1 delivers a French-built reflector'
  detail: 'Murphy et al. 2011: the Soviets landed Lunokhod 1 in November 1970. Only the month is stated.'
- id: a07
  panel: era
  lane: ground
  time: '1970-12-15T12:00:00Z'
  precision: month
  kind: data
  status: single
  date_basis: stated
  sources:
  - src-murphy-2011-l1
  label: 'Dec 1970: Soviet and French stations range the Lunokhod 1 reflector'
  detail: Murphy et al. 2011, citing Kokurin 1975 and Calame 1975 (neither opened). The ranging data were not published; the reflector was effectively lost until
    2010.
- id: a08
  panel: era
  lane: apollo
  time: '1971-02-09T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '9 Feb 1971: Apollo 14 samples return (42.3 kg)'
  detail: NAS Table 2.1.
- id: a09
  panel: era
  lane: apollo
  time: '1971-08-07T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '7 Aug 1971: Apollo 15 samples return (77.3 kg)'
  detail: NAS Table 2.1.
- id: a10
  panel: era
  lane: soviet
  time: '1972-02-25T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '25 Feb 1972: Luna 20 returns about 50 g (55 g in LROC)'
  detail: 'NAS gives 50 g and LROC 55 g: a disagreement, recorded in apollo-sample-masses-recorded.'
- id: a11
  panel: era
  lane: apollo
  time: '1972-04-27T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '27 Apr 1972: Apollo 16 samples return (95.7 kg)'
  detail: NAS Table 2.1.
- id: a12
  panel: era
  lane: records
  time: '1972-10-24T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-tn-d7080
  label: '24 Oct 1972: date line of NASA TN D-7080 (radiation report)'
  detail: The date at the end of the report's text, Manned Spacecraft Center, Houston. The report was issued in March 1973.
- id: a13
  panel: era
  lane: apollo
  time: '1972-12-19T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '19 Dec 1972: Apollo 17 samples return (110.5 kg)'
  detail: NAS Table 2.1. The last Apollo mission.
- id: a14
  panel: era
  lane: records
  time: '1973-01-30T12:00:00Z'
  precision: day
  kind: document
  status: single
  date_basis: stated
  sources:
  - src-psrd-2009
  label: '30 Jan 1973: last Apollo sample container logged into the lunar laboratory'
  detail: PSRD (summary of the NASA curator's presentation). Single secondary source.
- id: a15
  panel: era
  lane: records
  time: '1973-03-15T12:00:00Z'
  precision: month
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-tn-d7080
  label: 'Mar 1973: NASA issues TN D-7080; Table I lists crew skin doses for Apollo 7 to 15'
  detail: 'Table I: 0.16 rad (Apollo 7 and 8) to 1.14 rad (Apollo 14); limit 400 rads to the skin.'
- id: a16
  panel: era
  lane: soviet
  time: '1976-08-22T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-nas-2019
  label: '22 Aug 1976: Luna 24 returns about 170 g'
  detail: NAS Table 2.1 (0.17 kg) and text (170 g); LROC 'a larger sample, 170 grams'.
- id: b01
  panel: recent
  lane: reception
  time: '1995-07-19T12:00:00Z'
  precision: day
  kind: data
  status: reported
  date_basis: stated
  sources:
  - src-gallup-1999
  label: '19-20 Jul 1995: TIME/CNN poll, 6 per cent say the landing was staged'
  detail: As listed in Gallup's table. Belief, not evidence.
- id: b02
  panel: recent
  lane: reception
  time: '1999-07-13T12:00:00Z'
  precision: range
  kind: data
  status: reported
  date_basis: stated
  sources:
  - src-gallup-1999
  label: '13-14 Jul 1999: Gallup poll, 6 per cent staged, 89 per cent not'
  detail: n=1,061 adults, plus or minus 3 points. Belief, not evidence.
  end: '1999-07-14T23:59:00Z'
- id: b03
  panel: recent
  lane: orbiters
  time: '2008-05-20T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-jaxa-2008
  label: '20 May 2008: JAXA reports a probable exhaust halo at the Apollo 15 site (SELENE)'
  detail: Terrain Camera, 10 m resolution; the release calls the halo potential, then confirmed as the probable halo area.
- id: b04
  panel: recent
  lane: records
  time: '2009-07-16T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-nasa-tapes-2009
  - src-spacecom-tapes-2009
  label: '16 Jul 2009: NASA says the original Apollo 11 telemetry tapes were probably reused'
  detail: The final report and Space.com (17 Jul 2009, 'on Thursday'). The search team's conclusion is an inference.
- id: b05
  panel: recent
  lane: orbiters
  time: '2009-07-16T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-lroc-first-look
  label: '16 Jul 2009: LROC publishes first images of five Apollo sites (taken 11-15 July)'
  detail: Descent stages visible at 1.0 to 1.4 m per pixel; the page shows five sites and does not mention Apollo 12.
- id: b06
  panel: recent
  lane: orbiters
  time: '2009-10-28T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-lroc-a17
  label: '28 Oct 2009: LROC shows the Apollo 17 descent stage and rover tracks at 0.5 m per pixel'
  detail: From the 50 km orbit.
- id: b07
  panel: recent
  lane: ground
  time: '2010-04-22T12:00:00Z'
  precision: day
  kind: data
  status: reported
  date_basis: stated
  sources:
  - src-murphy-2011-l1
  label: '22 Apr 2010: APOLLO gets a return from the Lunokhod 1 reflector using LRO image coordinates'
  detail: Return arrived 270 ns later than predicted; LROC coordinates had been good to about 100 m (Murphy et al. 2011).
- id: b08
  panel: recent
  lane: orbiters
  time: '2011-09-06T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-lroc-skimming
  label: '6 Sep 2011: LROC low-altitude (about 22 km) images of Apollo 17'
  detail: 27 cm by 56 cm pixels, sampled at 25 cm.
- id: b09
  panel: recent
  lane: ground
  time: '2017-04-21T12:00:00Z'
  precision: day
  kind: document
  status: reported
  date_basis: stated
  sources:
  - src-courde-2017
  label: '21 Apr 2017: Grasse team''s paper on infrared lunar ranging posted (arXiv v1)'
  detail: Names the four stations then supplying range data; the team followed all five arrays on twenty nights in 2015.
- id: b10
  panel: recent
  lane: ground
  time: '2022-05-25T12:00:00Z'
  precision: day
  kind: document
  status: single
  date_basis: stated
  sources:
  - src-zhang-2022-tianqin
  label: '25 May 2022: Chinese station reports echoes from all five lunar reflector arrays'
  detail: Abstract only was read.
- id: b11
  panel: recent
  lane: orbiters
  time: '2026-03-15T12:00:00Z'
  precision: year
  kind: document
  status: single
  date_basis: inferred
  sources:
  - src-lpsc-2026-stooke
  label: '2026: abstract reports Chandrayaan-2''s camera viewed the Apollo 11 and 12 descent stages'
  detail: 57th LPSC; exact day not stated, drawn mid-March for placement only. Poster images not seen.
- id: b12
  panel: recent
  lane: ground
  time: '2026-09-30T12:00:00Z'
  precision: day
  kind: official
  status: reported
  date_basis: stated
  sources:
  - src-ilrs-lunar
  label: '30 Sep 2026: ILRS lunar page last modified; lists Apache Point, Grasse, Wettzell and Matera as main providers'
  detail: McDonald is said to have stopped in the 2010s.
