        severity: non_blocking
        finding: "'The gap is the footage, the radiation question and the lost original tapes' states why people doubt; no source read says so (Gallup and YouGov report percentages only). Notes such as 'doubt is common; expert acceptance is high' (apollo-radiation-survivable) and 'Widely repeated as an argument' (apollo-soviet-non-challenge) are unsourced, and the adoption_weight values for claims 'not polled' are the author's estimates. Reword as not measured."
        evidence: "claims.yaml lines 84-85, 378-379, 408-409; Gallup and YouGov pages opened."
