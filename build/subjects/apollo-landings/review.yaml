rounds:
  - round: 1
    reviewed_on: 2026-10-04
    requests:
      - id: R1-1
        target: "claims.yaml headline, search_summary, assessment.headline and assessment.key_points"
        severity: blocking
        finding: "The top-line text says more than the claims support. (a) The headline 'Moon landing hoax claims fail' (plural, general) and the assessment headline ('The claim that the landings were staged fails ... two narrower items stay open') list only the lost tapes and the photo claims as open. The dig's own weakest point, whether crews rather than robots did the work (apollo-crewed-landings-occurred at moderate; apollo-robotic-only-alternative proposed and called 'the strongest serious alternative'), is only in the long text and the divergence note, not in the headline or the key points. The refuted claim is the narrow one: hardware and reflectors were not taken to the Moon. (b) Key point 2 says NASA's orbiter images descent stages and tracks and 'a 2026 abstract says India's did too'; the abstract mentions descent stages and sites only, and tests.yaml says non-NASA imaging of tracks is NOT claimed. (c) search_summary says 'orbiters of NASA, Japan and India have imaged the sites'. JAXA reports a potential exhaust halo at one site (Apollo 15) at 10 m resolution with no hardware visible, using NASA comparison images; the India item is an abstract whose images were not seen. 'Imaged the sites' overstates both (REVIEW.md rule E)."
        evidence: "Opened by the reviewer: JAXA release 20 May 2008 ('potential halo', 'probable halo area was confirmed', 10 m, NASA images AS15-87-11719 and AS15-9430); Stooke LPSC 2026 abstract 1044 ('OHRC viewed the Apollo 11 and 12 sites including Surveyor 3'; 'OHRC has imaged ... the descent stages of Apollo 11 and Apollo 12'; no tracks, no other Apollo site). claims.yaml lines 9, 24-25 and 46-75 against 259-322."
        author_response: ""
        resolved: ""
      - id: R1-2
        target: "apollo-crewed-landings-occurred (state)"
        severity: blocking
        finding: "The claim is filed established, but its own anchor says 'No single record carries this ... Each is individually insufficient', evidence_class is synthetic, and the only track evidence is NASA's own LRO images. CONTRIBUTING section 2 says our own inference is synthetic and a new reading is proposed. Meanwhile apollo-robotic-only-alternative, its negation, rests on the same three records with the same weight and confidence, and is filed proposed. The two are held to different standards on identical evidence (REVIEW.md rule D). A reader is told as established that the crews walked on the surface and collected the samples, while the dig's own open question is whether they did."
        evidence: "claims.yaml lines 259-290 (anchor type convergence-of-records) against lines 292-322. CONTRIBUTING.md section 2."
        author_response: ""
        resolved: ""
      - id: R1-3
        target: "apollo-samples-are-lunar (statement); tests.yaml dt-independent-records finding; log L-14 (d)"
        severity: blocking
        finding: "The 4.46 billion year figure is mis-attributed. PSRD 2004 gives the 4.456 Ga Sm-Nd isochron for pyroxenes from four anorthosites together. The 67215 clast on its own gave a crystallisation age of 4.40 Ga ('allowing us to determine a precise crystallisation age of 4.40 billion years. But even that age might have been affected by the subsequent shock heating event'). The claim statement ('dating of lunar anorthosites, including a clast from Apollo 16 breccia 67215, gives ... about 4.46 billion years') and tests.yaml ('An Apollo 16 anorthosite clast dates to about 4.46 billion years') read as if the clast gives 4.46. Log L-14 (d) says '4.40 to 4.47 billion years' is not in any source read; 4.40 is in PSRD 2004. Also the claim id says 'samples are lunar' but a crystallisation age shows an age, not that the rock is lunar; the statement itself is only about age."
        evidence: "Opened by the reviewer: http://www.psrd.hawaii.edu/April04/lunarAnorthosites.html, the paragraph beginning 'My colleagues Lars Borg ... studied an anorthosite (rock 67215)' and the isochron caption (four anorthosites, 4.456). claims.yaml lines 182-216; tests.yaml dt-independent-records result."
        author_response: ""
        resolved: ""
      - id: R1-4
        target: "transmission.yaml tx-a-01 (step: origin)"
        severity: blocking
        finding: "Event tx-a-01 is typed step 'origin' with a named person, a book title and a 1976 date, all from a search-result summary the author could not open (read: no). The note concedes the summaries disagree (a 1974 pamphlet versus a 1976 book). Calling it the 'origin' of the idea is a historical claim about a named person that nothing read supports, and the event gives the title and employer as facts. Change the step to a neutral label (for example 'earliest reported, unverified') and mark the biographical detail as unread, or drop the event until a source is opened."
        evidence: "transmission.yaml lines 14-23; MANIFEST.yaml src-smithsonian-kaysing: read not_read, authenticity unchecked."
        author_response: ""
        resolved: ""
