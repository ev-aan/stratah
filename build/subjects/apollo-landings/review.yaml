  Confirmed exact: Courde station list, 100/100/300 corner cubes, 63 and 0.1 photons per second, 60 per cent of 2014 green normal points on Apollo 15, one night in 2014 against twenty in 2015 (section 3.3, Table 8), CNRS and CNES thanks; Murphy 2013 Lick 1 Aug 1969 'less than two weeks', Table 2 3775 photons per minute (62.9 a second); Murphy 2011 March 2010 LROC coordinates about 100 m, 22 April 2010, 270 ns, Lunokhod 1 landing November 1970; Murphy 2008 NASA and NSF funding; Merkowitz 'only' McDonald and OCA routine; ILRS station list, McDonald stopped, Zhuhai, last modified 30 Sep 2026; Zhang abstract five arrays, 234 normal points, 7 mm; TN D-7080 Table I values (7 .16, 8 .16, 9 .20, 10 .48, 11 .18, 12 .58, 13 .24, 14 1.14, 15 .30), 20 and 40 per cent, 400 and 50 rads, 'minimal', no major solar event, March 1973 cover, 24 Oct 1972 date line, no Apollo 16 or 17 value; tape report 45 tapes (3 stations x 15 reels), 'could draw only one conclusion', the 'degaussed, recertified, and reused' sentence, the closing 'either reused ... or disposed of them' and 'At no time did anyone recognize ...' sentences, the 8 Jan and 7 May 1981 weekly reports (Nafzger: 'didn't find a smoking gun'); Space.com briefing 'Thursday' (16 Jul 2009), Sydney, CBS and kinescopes, 40,000 boxes 1970 to 1974; NAS Table 2.1 masses and return dates (sum 381.7) and Luna 101, 50 and 170 g; curator 382 kg, 2200 samples, 300 g; PSRD 2009 21.8 kg and 2,196 samples (rows sum 381.9, as the author says); LROC dates, 1.0 to 1.4 m per pixel, 3.7 m deck, five sites shown, Apollo 14 astronaut tracks, Apollo 17 'Tracks are clearly visible', 50 cm, 27 x 56 cm pixels, Luna 20 55 g, Luna 24 170 g and 2 m; JAXA 'potential' then 'probable halo area was confirmed', 10 m, NASA comparison images; Stooke text; Gallup 6/89/5 and 1995 6/83/11, n=1,061, plus or minus 3, Capricorn One, 'not widespread'; YouGov 'one in five ... not at all sure'. All timeline dates (a01 to b12) match these sources.

  Rule checks. Headline: 87 characters, states the finding, headline_claim apollo-staged-hoax is refuted at high with anchor_checked primary, and its main anchors (Courde, Murphy 2013, ILRS) were opened in full; headline_status review is right. Rule 9: the refuted claim names its target (refutes_target), is class material and rests on station-team ranging papers and an ILRS page, not on belief or consensus; its basis line says so; no refutation_class is set, acceptable per log L-07. Polls (Gallup, YouGov, adoption_note fields) are used only as adoption and never support a claim. Assessment: exactly three key points, no percentage, answer no, no lean needed. transmission.yaml has confers_weight false, marks the Kaysing event read: no, and no claim cites it. No images are stored; the two stored NASA texts are US Government works; quotations are short and attributed.

