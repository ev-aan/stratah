subject: apollo-landings

discriminating_tests:

  - id: dt-independent-records
    question: >
      Do records that NASA does not control agree with the claimed landing sites,
      at the claimed places and in the claimed quantities?
    retires: apollo-staged-hoax
    predicts:
      landings-occurred: >
        IF hardware was landed at the sites, outside observatories should get laser returns from the
        site coordinates, and other nations' orbiters should see hardware or its effects there. Samples
        dated by laboratories should be lunar.
      staged-on-earth: >
        IF staged, at least one of these independent records should fail or
        disagree, because a single fake would have to defeat all of them at once.
    result:
      type: material
      finding: >
        Stations in several countries range the Apollo 11, 14 and 15 reflectors (the 2017 Grasse paper
        names APOLLO and McDonald in the US, Matera in Italy and Grasse in France; the ILRS page of 2026 names Apache Point,
        Grasse, Wettzell and Matera, and a Chinese station reports echoes from all five arrays). Japan's SELENE
        shows a probable Apollo 15 exhaust halo, and a 2026 abstract reports India's Chandrayaan-2 camera viewed the
        Apollo 11 and 12 descent stages. A pyroxene isochron on four lunar anorthosites gives 4.456 billion years and the Apollo 16
        clast 67215 alone 4.40 billion years, possibly shock-affected (secondary account only; an age, not proof of origin). No independent record was found to fail. Read in the resumed pass, 2026-10-04.
      accessible: true
    resolves: >
      The retirement rests on physical records anyone can re-measure, not on which
      side has more believers. The reflector and imaging anchors are V2 (documents read, 2026-10-04); the sample
      dating is secondary only and is not used for the retirement. See the header of claims.yaml.
    note: >
      D3 satisfied: retired by material convergence, never by popularity or by
      NASA's authority. The test does not retire every individual question about
      the photographs or film; those are handled as reception in threads.yaml.

  - id: dt-human-traces-vs-robotic
    question: >
      Are there surface traces consistent with humans walking and driving, and mass
      returned beyond robotic capability of the period?
    retires: apollo-robotic-only-alternative
    predicts:
      crewed: >
        IF crewed, foot trails, rover tracks and a returned mass of hundreds of kg
        should be present and imaged.
      robotic-only: >
        IF robotic only, trails and tracks of that kind should be absent, and returned
        mass should be in the range robotic missions achieved (101 g, 50 or 55 g and about 170 g
        for Luna 16, 20 and 24; about 0.32 kg in total).
    result:
      type: material
      finding: >
        Astronaut tracks (Apollo 14) and rover tracks (Apollo 17) are described in LROC's own releases
        (NASA's camera team, so not independent). Returned mass is about 382 kg, about 1,170 to 1,190 times the
        Soviet robotic total. A 2026 abstract says Chandrayaan-2 viewed the Apollo 11 and 12 descent stages; foot-trail
        imaging by a non-NASA orbiter is NOT claimed.
      accessible: true
    resolves: >
      Separates "something delivered these things" (reflectors, rocks) from
      "people did". Weaker than the first test: the trail imagery is not independent.
    note: >
      This is the harder test of the two: it addresses the only alternative that
      survives dt-independent-records.

# ---------------------------------------------------------------------------
# OPEN TESTS (not filed; no result yet):
#   - A fresh, newly commissioned ranging or imaging campaign by a party with no
#     prior stake, as an ongoing re-check rather than a one-time result.
#   - Independent imaging (non-NASA orbiter) of rover tracks or foot trails. This is the
#     single result that would lift apollo-robotic-only-alternative from moderate to high.
# ---------------------------------------------------------------------------
