# ---------------------------------------------------------------------------
# SEARCH HEADLINE: rules as in gulf-of-tonkin/claims.yaml (1-7). It may only state a claim that is
# established or refuted at HIGH confidence with anchor_checked: primary. The headline claim
# (apollo-staged-hoax) is anchored to documents opened and read in the resumed pass of 2026-10-04
# (log L-10 to L-20): the Grasse and APOLLO ranging papers, the ILRS science page, the LROC and JAXA
# releases and the LPSC 2026 abstract. headline_status is `review`: the independent reviewer and the owner decide
# whether it goes on the site; the author never marks it passed.
# ---------------------------------------------------------------------------
headline: "Moon landing hoax claims fail: outside labs still bounce lasers off Apollo's reflectors"
headline_claim: apollo-staged-hoax
headline_status: review
dig_status: resumed             # parked 2026-10-01; resumed 2026-10-04 (see below); not published
parked_on: 2026-10-01
park_reason: >
  (History, kept as filed.) Primary sources (NASA, NTRS, arXiv, IOP, NAS) were blocked in the working
  environment, so no anchor could be checked and nothing was verified against a primary document.
resumed_on: 2026-10-04
resume_reason: >
  The hosts that blocked the first pass are reachable: ntrs.nasa.gov, arxiv.org, nationalacademies.org,
  global.jaxa.jp, ilrs.gsfc.nasa.gov, lroc.im-ldi.com and the LPSC site opened. The V2 targets of
  docs/verification/2026-10-01-apollo-tonkin.md were run (log L-10 to L-20). Still blocked: science.org,
  journals.sagepub.com, smithsonianmag.com (403) and the IOP full text (bot check); psrd.hawaii.edu
  worked only over http. Several first-pass figures changed or were removed (log L-11 to L-18).
search_summary: >
  The question is whether the Moon landing hoax claims hold up. They do not: observatories in several countries still bounce lasers off Apollo's reflectors, and orbiters of NASA, Japan and India have imaged the sites.

subject: apollo-landings
title: "Did the Moon landing hoax claims hold up?"
description: >
  Did the Moon landing hoax claims hold up? The claim "humans landed on the Moon" does not have to rest on
  NASA's word. This dig keeps three things distinct: (1) what is left on the Moon and can be checked by
  anyone with the right instrument, (2) what was brought back and studied, and (3) the popular "hoax"
  narrative, which is filed as reception, not evidence. A hoax would need ONE fake to produce ALL of the
  independent physical records at once; each claim states what it does and does not show on its own. Gaps
  are listed: the photographic claims (shadows, flag, stars) were not tested in this pass.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS (governance, not a claim). Used in the `# V:` lines.
#   V0  recalled or single-source, not confirmed
#   V1  agrees across 2+ search results; primary document not opened
#   V2  primary document opened and the figure read directly
# This pass reached V2 for the items named in each claim's `# V:` line. What was NOT read is listed
# in log entry L-20 and in each source's `read:` field in sources/MANIFEST.yaml.
# ---------------------------------------------------------------------------

assessment:
  question: "Did the Moon landing hoax claims hold up?"
  answer: "no"
  headline: "No. The claim that the landings were staged fails against physical records that outside observatories and other space agencies can check; two narrower items stay open."
  key_points:
    - "Observatories in France, Italy, Germany, the US and China range the Apollo 11, 14 and 15 reflectors, and the French team's work is funded by CNRS and CNES."
    - "NASA's orbiter images Apollo descent stages and tracks; a 2026 abstract says India's did too. Apollo returned about 382 kg of rock, Soviet robots about 0.3 kg."
    - "Open: the original Apollo 11 tapes are lost (documented), and the photo claims (shadows, flag, stars) were not tested in this pass."
  text: >
    A staged event on Earth would not leave laser reflectors on the Moon that observatories in several
    countries still range. Courde et al. (2017, Grasse, France) name the stations then supplying lunar
    range data (APOLLO and McDonald in the US, Matera in Italy, Grasse), and report that the Apollo 11,
    14 and 15 arrays hold 100, 100 and 300 corner cubes. The International Laser Ranging Service page
    (last changed 30 Sep 2026) lists Apache Point, Grasse, Wettzell (Germany) and Matera as the
    main providers now, and a Chinese station's abstract reports echoes from all five arrays. The first accurate
    ranges came from Lick Observatory on 1 August 1969, less than two weeks after the Apollo 11 landing
    (Murphy 2013). NASA's LRO camera images the Apollo descent stages and the astronauts'
    tracks; the independent checks so far are Japan's SELENE (a probable exhaust halo at the Apollo 15
    site, 10 m resolution, so no hardware) and an abstract by a Canadian researcher that reports India's
    Chandrayaan-2 camera viewed the Apollo 11 and 12 descent stages (the images themselves were not
    seen). The radiation claim is answered by NASA's own dose table, which gives average crew skin doses
    of 0.16 to 1.14 rads for the lunar-distance flights in its table (Apollo 8 and 10 to 15), against a
    400-rad limit; those readings are NASA's, so they carry moderate confidence. Two limits matter. The
    narrower question of whether CREWS rather than robots did the work rests on the mass of returned rock
    and on NASA's own track images, and is held at moderate confidence. And the lost original tapes are a real, documented gap that
    affects one source of footage and none of the physical records. We did not test the claims about
    shadows, the flag and missing stars in photographs: that is a stated gap, not a finding. Polls
    are adoption, not evidence: a small minority of US adults told Gallup in 1999 that the landing was staged, and a
    later YouGov article uses a different wording, so the two are not compared (see the divergence note).
  basis: [apollo-staged-hoax, apollo-retroreflectors-on-moon, apollo-sites-imaged-by-non-nasa-orbiters, apollo-crewed-landings-occurred, apollo-radiation-survivable, apollo-original-sstv-tapes-lost, apollo-photo-anomalies-untested]
  rated_claim: apollo-staged-hoax
  would_settle: >
    A failure of any one of the independent records (an outside station getting no return from a site
    where one is expected; non-NASA imaging that does not match the sites; a sample shown to be terrestrial).
    For the open items: the Goddard weekly reports on the 1981 tape recall; a read of Apollo camera exposure
    records and the Apollo 16 far-ultraviolet camera star images for the photo claims; non-NASA imaging of
    foot trails or rover tracks, which would raise the crewed-versus-robotic claim.

divergence_note: >
  Evidence and adoption mostly agree: Gallup in July 1999 found 89 per cent said the government did not stage the landing, 6 per cent said it did and 5 per cent had no opinion (n=1,061, plus or minus 3 points; the TIME/CNN poll of 1995 found the same 6 per cent). YouGov's 2019 article says one in five are "not at all sure" the landing happened, which is a different question and was not seen as a table. Doubt is higher among those not alive in 1969 (same article). The gap is the footage, the radiation question and the lost original tapes. The tapes gap is documented, which is why it deserves a plain answer. The weakest evidential point is crewed versus robotic, not staged versus real.

claims:

  - id: apollo-retroreflectors-on-moon
    state: established
    statement_kind: reported
    statement: >
      Passive laser retroreflector arrays sit at the Apollo 11, 14 and 15 sites (100, 100 and 300 corner
      cubes) and are ranged by observatories run by organisations other than NASA, in more than one country.
    evidence_class: material
    confidence: high
    evidential_weight: 4   # of 5; papers report the measurements, raw ranging data not read; APOLLO is NASA and NSF funded, Grasse is CNRS and CNES funded
    anchor_checked: primary   # Courde 2017, Murphy 2013, Murphy 2011 and the ILRS page read directly in the resumed pass (log L-12)
    adoption_weight: 5   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not polled. Accepted across the relevant sciences; stations still use the arrays.
    would_change_if: >
      an outside station reports no return from a site's coordinates under conditions where one is expected, or ranging records are shown not to be independent of NASA
    anchor:
      type: independent-instrument-reproducibility
      description: >
        Courde et al. (A&A 602, A90, 2017; read in full text, arXiv v1) state that among the 40 stations
        of the International Laser Ranging Service "only four stations supply Earth-Moon range observations
        to the ILRS database: APOLLO (New Mexico, USA), McDonald (Texas, USA), Matera (Italy) and Grasse
        (France)", and that the Apollo 11 and 14 arrays have 100 corner cubes each and Apollo 15 has 300
        (Section 3.1.1). Their own station followed all five arrays on twenty nights in 2015 with an infrared laser, against
        one night in 2014 with green light (Table 8), and obtained about 60 per cent of its 2014 green-light normal points on Apollo 15. The photon rate on
        Apollo 15 is about 0.1 per second at Grasse and 63 per second at APOLLO, quoted from Murphy 2013, whose
        Table 2 gives 3,775 photons per minute for APOLLO's record run on Apollo 15 (about 63 a second; our arithmetic). The ILRS science page
        (read 2026-10-04, last modified 30 Sep 2026) lists the main observatories now as Apache Point, Grasse,
        Wettzell (Germany) and Matera, says McDonald stopped in the 2010s, and says a station at Zhuhai in
        China ranged the Apollo and Luna reflectors (Zhang et al. 2022; its abstract, read, reports echoes from
        all five arrays and 234 normal points). Murphy's review (read, section 3.1) says the first accurate ranges came from the 3.1 m telescope at
        Lick Observatory on 1 August 1969, less than two weeks after the Apollo 11 landing. The 2007 review by
        Merkowitz et al. (NASA Goddard authors) says only McDonald and the French station were then making
        routine lunar ranges. The French station's work is funded by INSU-CNRS and CNES (acknowledgement in
        Courde); APOLLO acknowledges NASA and NSF grants (Murphy 2008).
      accessible: true
      sources: [src-courde-2017, src-murphy-2013, src-ilrs-lunar, src-zhang-2022-tianqin, src-merkowitz-2007, src-murphy-2008-apollo]
    confidence_reasons:
      start: high
      start_because: "Primary papers and a service page by the station teams were read; the station list is the teams' own statement."
      steps:
        - {domain: risk_of_bias, effect: none, reason: "APOLLO is part funded by NASA, but the French, Italian, German and Chinese stations are not, and the Grasse paper names its own funders."}
        - {domain: independent_corroboration, effect: none, reason: "Several stations in different countries agree that the arrays respond; the ILRS page is NASA-hosted but names non-NASA observatories. Not raised further because the raw ranging data were not opened."}
    basis: >
      # V: V2 for the station list and the array sizes (Courde 2017, read), the 63 per second figure (Murphy 2013
      #    Table 2, read: 3775/60 = 62.9), the Lick date (Murphy 2013 section 3.1, read), the ILRS station list (read).
      #    The Zhang 2022 result is V1: the abstract only; the IOP full text was blocked by a bot check.
      # CORRECTION to the first pass (log L-12): it said four stations "APOLLO, McDonald, Matera, Grasse" as if they were
      #    current. That is Courde's 2017 list. The ILRS page now names Wettzell too and says McDonald stopped. The first
      #    pass also said the lost Lunokhod 1 reflector was "re-found by outside ranging": it was found with NASA's LRO
      #    images, then ranged by APOLLO (Murphy 2011); removed from this claim.
      This proves objects are at the sites and that they respond to lasers from several countries. It does NOT by
      itself prove humans placed them: the Soviet Lunokhod rovers carry reflectors too (the French-built arrays on Luna 17
      and Luna 21; Courde, Murphy 2013). See apollo-robotic-only-alternative.

  - id: apollo-sample-masses-recorded
    state: established
    statement_kind: reported
    statement: >
      NASA's curator and the National Academies record that six Apollo missions returned about 382 kg of lunar
      material (381.7 kg in one table, in about 2,200 samples), against about 0.3 kg from the three successful Soviet robotic sample returns.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 3   # of 5; the Apollo masses all come from NASA's own records, so they are one origin; the Luna masses disagree by 5 g between sources
    anchor_checked: primary   # NAS Table 2.1, the NASA curator page and PSRD read in the resumed pass (log L-14); the Soviet masses are read only as repeated by NAS and LROC
    adoption_weight: 5   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not polled. The totals are repeated across NASA, university and Academy pages.
    would_change_if: >
      the Lunar Sample Compendium or the Soviet records give different totals, or the 381.7 kg total is shown to be wrong
    anchor:
      type: published-record-read
      description: >
        The NASA curator page (curator.jsc.nasa.gov/lunar, read) says six Apollo missions "brought back 382
        kilograms (842 pounds)", about 2,200 samples, and "three automated Soviet spacecraft returned important
        samples totaling 300 grams". The National Academies report (2019, chapter 2, read) gives Table 2.1:
        Apollo 11 21.6, 12 34.3, 14 42.3, 15 77.3, 16 95.7, 17 110.5 kg (sum 381.7 by our arithmetic), and Luna 16, 20
        and 24 as 0.10, 0.05 and 0.17 kg; its text says Luna 16 returned 101 g, Luna 24 170 g and Luna 20 50 g. LROC
        (Arizona State University, read) says Luna 16 returned 101 g, Luna 20 55 g and Luna 24 about 170 g. PSRD
        (University of Hawaii, read) prints 2,196 samples and a 381.7 kg total but lists Apollo 11 as 21.8 kg, which makes
        its six rows sum to 381.9. So: the total is about 382 kg in every source; the Apollo 11 value is 21.6 (NAS) or
        21.8 (PSRD); Luna 20 is 50 g or 55 g; the Soviet total is about 0.32 kg either way; and the Apollo to Luna
        ratio is about 1,170 to 1,190.
      accessible: true
      sources: [src-nas-2019, src-nasa-curator, src-psrd-2009, src-lroc-luna]
    basis: >
      # V: V2 for what each page says. The masses are records, not independent measurements: the Apollo figures
      #    derive from NASA's curation, so they count as one origin. The Luna masses are not read in a Soviet source.
      # CORRECTIONS (log L-14): the first pass listed Apollo 11 as 21.8 kg (the six rows then do not sum to 381.7) and Luna 20
      #    as 55 g with an unresolved 30 g; the NAS gives 21.6 and 50 g. The 30 g figure was not found in any source read
      #    and is dropped. The first pass's ratio of about 1,170 is now stated as a range of about 1,170 to 1,190.
      This claim says what the records state. It does not show the rock is lunar (see apollo-samples-are-lunar) or
      that humans collected it (see apollo-crewed-landings-occurred).

  - id: apollo-samples-are-lunar
    state: established
    statement_kind: reported
    statement: >
      Radiometric dating of lunar anorthosites, including a clast from Apollo 16 breccia 67215, gives a crystallisation age of about
      4.46 billion years, consistent with early melting of the Moon.
    evidence_class: material
    confidence: moderate
    evidential_weight: 3   # of 5; read only as a summary by researchers of their own paper; the papers themselves were not opened
    anchor_checked: secondary   # PSRD (April 2004, by Marc Norman, Lunar and Planetary Institute and Australian National University) and the NAS chapter read; Norman et al. 2003 and the Apollo 11 conference papers not opened
    adoption_weight: 5   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not polled. Not measured; the dating is routine in planetary science.
    would_change_if: >
      an outside laboratory shows a documented returned sample to be terrestrial, or the dating is shown not to reproduce
    anchor:
      type: laboratory-dating-summary
      description: >
        PSRD (April 2004; the author is a participant in the work) reports a samarium-neodymium isochron on pyroxenes
        from four lunar anorthosites giving a crystallisation age of 4.456 billion years, and says earlier isochrons on
        three other anorthosites gave 4.29 to 4.54 billion, "an unexpectedly large range". The clast newly studied was from Apollo 16 breccia 67215. The NAS chapter says
        the Apollo samples changed the understanding of the Moon, Earth and solar system and are held at JSC, with a back-up
        store at White Sands.
      accessible: true
      sources: [src-psrd-2004, src-nas-2019]
    basis: >
      # V: V1-plus. Read in full, but both are summaries; the journal paper was not opened.
      # REMOVED from the first pass (log L-14): "about 150 laboratories" and "about 27 of the initial 110 Apollo 11
      #    investigators from six countries" (no source read supports either number); "older than most terrestrial rock" (no
      #    source read compares with Earth rock); "studied in many countries" (not shown by the pages read); "4.40 to 4.47 billion
      #    years" (the PSRD figure is 4.456 for one isochron, with a wider published range); the 1971 NASA and Soviet
      #    exchange (not read here). The authors of the 2003 paper may include NASA scientists (affiliations not read), so
      #    "outside NASA" is not claimed.
      TO RAISE: read Norman et al. 2003 and the Apollo 11 Lunar Science Conference papers. Like the reflectors, rocks
      alone do not prove a crew collected them.

  - id: apollo-sites-imaged-by-non-nasa-orbiters
    state: established
    statement_kind: reported
    statement: >
      Orbital images from NASA's LRO show Apollo descent stages and the astronauts' tracks, and the sites have also been
      examined by Japan's SELENE (a probable exhaust halo at Apollo 15) and, by one report, India's Chandrayaan-2.
    evidence_class: material
    confidence: moderate
    evidential_weight: 3   # of 5; the independent items are a release that says "potential halo" and an abstract whose images were not seen
    anchor_checked: primary   # the LROC pages, the JAXA release and the LPSC 2026 abstract were read in full as texts; no image file was analysed
    adoption_weight: 4   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not polled. Accepted among planetary scientists; less widely known to the public.
    would_change_if: >
      the JAXA or ISRO imaging is shown not to match the claimed sites, or the SELENE halo is attributed to something else
    anchor:
      type: independent-orbital-imaging
      description: >
        LROC (Arizona State University, NASA's camera team; pages read): the first Apollo-site images of 11 to 15 July 2009
        showed the descent stages, about 3.7 m across, at 1.0 to 1.4 m per pixel (Apollo 12 was not among the five sites in that set); a 50 km orbit gave 0.5 m per
        pixel in September 2009 and "tracks are clearly visible" at Apollo 17; a low pass about 22 km up in 2011 gave
        27 cm by 56 cm pixels (sampled at 25 cm) with new detail around the lunar module, rover and surface experiments.
        JAXA's release of 20 May 2008 reports that SELENE's Terrain Camera (10 m resolution, so no hardware visible)
        showed a brighter halo around the Apollo 15 site that the release first calls potential and then says
        was confirmed as the probable halo area; its comparison images are NASA's. Stooke (University of Western Ontario, LPSC abstract 1044, 2026,
        read) says ISRO's Chandrayaan-2 OHRC (about 25 cm per pixel) "viewed the Apollo 11 and 12 sites" including their descent
        stages; the poster images were not seen. As a check that LRO coordinates point at real hardware, LROC imaged
        the Luna 17 site in March 2010 (coordinates good to about 100 m) and APOLLO then got a return from the
        Lunokhod 1 reflector at the first good opportunity, 22 April 2010, 270 nanoseconds off prediction (Murphy 2011, read).
      accessible: true
      sources: [src-lroc-first-look, src-lroc-a17, src-lroc-skimming, src-jaxa-2008, src-lpsc-2026-stooke, src-murphy-2011-l1]
    basis: >
      # V: V2 for the texts above. Independence: LRO and its images are NASA's, so they are not independent of NASA; the
      #    independent items are JAXA (a halo, not hardware) and Stooke's abstract (Chandrayaan-2, images not seen).
      # CORRECTIONS (log L-15): the first pass said the Chandrayaan-2 camera imaged "the Apollo 12 site" and SELENE
      #    "detected" the halo; JAXA says a potential halo, and the abstract says descent stages of Apollo 11 and 12
      #    and the sites. It also said LRO imaged foot trails at Apollo 12, 14 and 17: the LROC pages read here show astronaut
      #    tracks at Apollo 14 and rover tracks at Apollo 17; the Apollo 12 and 14 low-altitude detail was promised "later this
      #    week" and its page was not read, so it is not claimed.
      TO RAISE: non-NASA images of the descent stages at the other four sites, or of foot trails.

  - id: apollo-crewed-landings-occurred
    state: established
    statement_kind: judgment
    statement: >
      Six Apollo missions (11, 12, 14, 15, 16, 17) landed crews on the Moon, and the crews walked on the surface and
      collected the returned samples.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3   # of 5; a convergence argument, our own inference, resting in part on NASA's own images
    anchor_checked: primary   # every piece read directly (see the sources); the inference joining them is ours
    adoption_weight: 4   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Gallup, July 1999 (read): 89 per cent said the government did not stage the landing. The poll asks "staged", not "crewed versus robotic".
    would_change_if: >
      independent (non-NASA) imaging of tracks or trails, or independent surface-station data, is found (raises it); or a robotic-only delivery of hundreds of kilograms is shown feasible (lowers it)
    anchor:
      type: convergence-of-records
      description: >
        No single record carries this. Reflectors at three Apollo sites respond to lasers from stations in several
        countries (apollo-retroreflectors-on-moon); about 382 kg came from six sites against about 0.3 kg from the three
        Soviet robotic returns, a ratio of about 1,200 (apollo-sample-masses-recorded); NASA's LRO shows tracks between
        hardware at Apollo 14 and rover tracks at Apollo 17 (apollo-sites-imaged-by-non-nasa-orbiters). Each is
        individually insufficient; together they fit one explanation better than the robotic alternative.
      accessible: true
      sources: [src-courde-2017, src-nas-2019, src-lroc-first-look, src-lroc-a17]
    basis: >
      Filed as our judgment (synthetic) because the step from "hardware and rock came from the Moon" to "crews did it" is an
      inference about robotic capability and the track images are NASA's. Contemporaneous Soviet non-challenge is NOT counted
      here (see apollo-soviet-non-challenge).
      # V: inherits the weakest link, so moderate. Unchanged from the first pass except for the figures and the checks above.
      # The narrower claim that the landings were not staged (apollo-staged-hoax) does not need the crewed-or-robotic
      # distinction, and is held higher.

  - id: apollo-robotic-only-alternative
    state: proposed            # was refuted; changed 2026-10-02 (log L-09): Rule 9 bars a refutation resting on synthetic evidence
    statement_kind: judgment
    statement: >
      The Apollo reflectors, samples and site hardware were delivered by uncrewed missions, with no humans on the surface.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3   # of 5
    anchor_checked: primary   # the masses and the track descriptions were read directly; the capability inference is ours
    adoption_weight: 1   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not measured. Rarely proposed outside specialist discussion.
    would_change_if: >
      independent imaging of rover tracks or foot trails is found (raises it), or a documented robotic return of hundreds of kg is shown (lowers it)
    refutes_target: "Apollo artifacts were placed and collected robotically only"
    anchor:
      type: capability-ratio-plus-surface-traces
      description: >
        About 382 kg returned from six sites against about 0.32 kg from the three successful Soviet robotic returns
        (Luna 16 101 g, Luna 20 50 or 55 g, Luna 24 170 g): a ratio of about 1,170 to 1,190 (NAS Table 2.1 and LROC, read).
        LROC (NASA's own camera team) shows tracks between the Apollo 14 lunar module and surface experiments package and
        rover tracks at Apollo 17; those images are NASA's and are the anchor here that is not independent. LROC also says Luna
        24 drilled to over 2 m and returned about 170 g.
      accessible: true
      sources: [src-nas-2019, src-lroc-luna, src-lroc-first-look, src-lroc-a17]
    basis: >
      # V: V2 for the masses (with the 50 g or 55 g Luna 20 disagreement recorded in apollo-sample-masses-recorded).
      # Unchanged from the first pass in state and class; only the figures changed (log L-14).
      It is the strongest serious alternative to the landings, and the only one that survives the reflector and sample
      claims individually. Rule 9 is met for naming its target; it stays proposed because its support is a capability
      inference.

  - id: apollo-staged-hoax
    state: refuted
    statement_kind: judgment
    statement: >
      The Apollo landings were staged on Earth: no Apollo hardware or reflectors were taken to the Moon.
    evidence_class: material
    confidence: high
    evidential_weight: 4   # of 5
    anchor_checked: primary   # the ranging papers, the ILRS page, the LROC pages and the JAXA release were read directly in the resumed pass
    adoption_weight: 1   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Gallup July 1999 (read): 6 per cent of US adults said the government staged or faked the landing, 89 per cent said it did not, 5 per cent no opinion (n=1,061; TIME/CNN 1995: 6, 83, 11). YouGov 2019 (article read, table not seen) says one in five are "not at all sure" it happened. The two wordings differ, so the figures are not compared. A Newsweek headline about Russia, mentioned in the first pass, was not read and is dropped.
    would_change_if: >
      any one of the independent records (outside ranging, imaging by other nations, laboratory dating) is shown to fail or to depend on NASA
    refutes_target: "Apollo landings were staged / faked"
    anchor:
      type: convergence-against-fabrication
      description: >
        A staging on Earth would have to account for: reflectors at the Apollo 11, 14 and 15 sites that observatories in
        France, Italy, Germany, the US and China range today, with the first accurate ranges made at Lick Observatory
        within two weeks of the Apollo 11 landing (apollo-retroreflectors-on-moon); descent stages and tracks imaged
        by orbiters, with Japan's SELENE and India's Chandrayaan-2 also examining the sites
        (apollo-sites-imaged-by-non-nasa-orbiters); and about 382 kg of rock returned (apollo-sample-masses-recorded).
        Only the first two are anchored here: the sample dating is held at secondary
        (apollo-samples-are-lunar) and is not used. See dt-independent-records.
      accessible: true
      sources: [src-courde-2017, src-murphy-2013, src-ilrs-lunar, src-lroc-first-look, src-jaxa-2008, src-lpsc-2026-stooke]
    confidence_reasons:
      start: high
      start_because: "The ranging papers, the service page, the LROC pages and the JAXA release were opened and read."
      steps:
        - {domain: risk_of_bias, effect: none, reason: "LRO and APOLLO are NASA funded; the French station (CNRS, CNES), the Italian and German stations, JAXA and the Canadian author are not."}
        - {domain: imprecision, effect: none, reason: "The refuted statement is a yes or no (were reflectors and hardware put on the Moon), not a measurement."}
        - {domain: unreported_negative_results, effect: none, reason: "No station reporting no return from an Apollo array was found; absence of such reports is not used as support."}
    basis: >
      Refuted by material anchors, not by NASA's authority or by popularity. The hoax claim needs one fake to defeat
      several unrelated records at once, including why the same reflectors answer laser pulses from stations in different countries.
      # V: V2 for the reflector and imaging anchors. The refutation does not depend on the sample dating (secondary) or
      #    on the crewed-or-robotic question; see apollo-crewed-landings-occurred (moderate).
      It names its target and does not claim that every question raised about the footage has been answered: the photographic
      claims are an open item (apollo-photo-anomalies-untested). refutation_class is not set (log L-07: the class definitions do not include a fit for a claim of this kind, and "fabrication" would assert intent we did not test).

