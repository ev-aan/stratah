  - id: apollo-radiation-survivable
    state: established
    statement_kind: reported
    statement: >
      NASA's own dosimeters recorded average crew skin doses of 0.16 to 1.14 rads on the lunar-distance Apollo missions
      in its table (Apollo 8 and 10 to 15), against a 400-rad skin limit set for the missions.
    evidence_class: material
    confidence: moderate
    evidential_weight: 3   # of 5; the readings are NASA's, not independent
    anchor_checked: primary   # NASA TN D-7080 read in full in the resumed pass (log L-10)
    adoption_weight: 3   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not measured. The Van Allen belts argument is a staple of hoax claims, so doubt is common; expert acceptance is high.
    would_change_if: >
      dosimetry outside NASA's records, or a recomputation of the belt transit from independent belt data, differing materially from the table
    anchor:
      type: dosimetry-table-read
      description: >
        NASA TN D-7080 (English et al., March 1973; read in full, 19 pages), Table I on printed page 3, average crew skin dose
        in rads by mission, "the averages of all readings on the thermoluminescent dosimeters": Apollo 7 0.16, 8 0.16, 9 0.20,
        10 0.48, 11 0.18, 12 0.58, 13 0.24, 14 1.14, 15 0.30. The text says individual readings varied about 20 per cent from the average,
        doses to blood-forming organs are about 40 per cent lower than at the skin, and the maximum operational dose limit was set at
        400 rads to the skin and 50 rads to the blood-forming organs. It says "radiation doses to Apollo crewmen have been minimal",
        that no major solar-particle event occurred during an Apollo mission, and that the belts were crossed rapidly. The
        table has no Apollo 16 or 17 values; the report was written in October 1972 (date line) and issued in March 1973.
      accessible: true
      sources: [src-tn-d7080]
    confidence_reasons:
      start: high
      start_because: "The report was read in full."
      steps:
        - {domain: indirectness, effect: down1, reason: "The dose figures are NASA's own measurements, with no outside dosimetry or belt-model check read."}
    basis: >
      # V: V2. The figures above are exactly as printed in Table I.
      # CORRECTIONS (log L-11): the first pass gave a mean of 0.46 rad for "nine lunar-distance missions" and an Apollo 17 value of
      #    0.55 rad. The table has nine missions (7 to 15) of which only seven (8, 10 to 15) went to lunar distance, no Apollo 17 value, and no mean.
      #    Our arithmetic from the table for those seven missions is a mean of about 0.44 rad; it is not in the report and is not claimed. The first pass also said
      #    most of each dose came from belt passage: the report does not say so in the pages read, so it is dropped.
      # The 400 rads is the program's limit, not a harm threshold. The claim is about dose, not the absence of any risk.
      TO RAISE: an independent dose reconstruction, or the Apollo 16 and 17 values.

  - id: apollo-original-sstv-tapes-lost
    state: searched_gap
    statement_kind: search_result
    absence_anchor: true
    statement: >
      NASA's search team did not find the roughly 45 original Apollo 11 slow-scan telemetry tapes and concluded they were
      probably recalled, degaussed and reused; the surviving footage comes from other recordings.
    evidence_class: primary_text
    confidence: low   # capped: absence anchor
    evidential_weight: 3   # of 5
    anchor_checked: primary   # NASA's final report read in full (scan, OCR); the weekly reports it cites were not seen
    adoption_weight: 5   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not polled. Widely known and accepted.
    would_change_if: >
      the original tapes, or records of their disposal that contradict NASA's 2009 account, are found
    next_step: >
      Read the Goddard weekly management reports the search team cites (8 January and 7 May 1981) and the Washington National Records Center transfer records, and log what they show about the tapes and the dates.
    anchor:
      type: search-record
      description: >
        NASA's "The Apollo 11 Telemetry Data Recordings: A Final Report" (read in full; the PDF is a scan, read by OCR)
        says the team estimated each of three tracking stations used 15 one-inch reels, 45 tapes in all, and that the lead,
        Richard Nafzger, could draw one conclusion: "The 45 Apollo 11 tapes were degaussed, recertified, and reused" to
        meet a tape shortage, citing Goddard weekly reports of January and May 1981. The closing section says
        Goddard "either reused the one-inch tapes to meet a network shortage in the early 1980s or disposed of them" and that
        "At no time did anyone recognize the unique content on roughly 45 tapes". Space.com (17 July 2009, read) reports
        the briefing of 16 July 2009 and a restoration from recordings made in Sydney (from Parkes and Honeysuckle Creek),
        CBS broadcast tapes and kinescopes at Johnson.
      accessible: true
      sources: [src-nasa-tapes-2009, src-spacecom-tapes-2009]
    basis: >
      # V: V2 for what the report says. It is an inference by the search team, not a record of disposal: the report says the tapes
      #    were "likely" gone; the count of 45 is the team's estimate.
      # CORRECTIONS (log L-16): the first pass said they "were erased and reused" and named Goldstone as a restoration source. The report
      #    says the team concluded this from circumstantial records; Space.com names Sydney, CBS and Johnson, not Goldstone. The 1981 timing is
      #    from the report; Space.com quotes a 1970 to 1974 recall of 40,000 boxes: two timings, not reconciled.
      A real, documented gap that the hoax narrative feeds on. The tapes were back-up telemetry, not the broadcast; the gap lowers
      the quality of one footage source and nothing else; it does not touch the reflectors or the orbital images.

