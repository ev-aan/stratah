        new Members" that is the State of Palestine's application (S/2024/312); rule and hashes in
        data/sc-vetoes-selection-note.md. The earlier file lacked that row; it was added on 16 Oct 2026.
        All 25 Security Council verbatim records (S/PV.3538 to S/PV.10000) were downloaded from
        documents.un.org and hashed (data/sc-vetoes-meeting-records.csv). In each, the result sentence
        ("owing to the negative vote of a permanent member") and the Against list were extracted by
        script and read; the Against list names the member the dataset names in 25 of 25 cases (meeting
        4438: the extracted result line is partly garbled but the Against list and the negative-vote
