  # =======================================================================
  # UN VOTES, VETOES AND RECOGNITION
  # =======================================================================
  - id: ipm-unga-voting-patterns
    state: established
    statement_kind: reported
    statement: >
      On 572 General Assembly roll calls about Palestine and the Middle East from 1993 to 2023
      (selection rule in data/SELECTION_RULE.md), the US voted No on almost all (489 No, 16 Yes, 66
      abstentions); Egypt, Qatar, Türkiye and Iran voted Yes on almost all; the UK, France, Germany,
      Ireland, Norway and Spain mostly voted Yes or abstained. Canada is the one country of the twelve
      whose pattern reversed twice: mostly Yes until 2003, mostly No from 2009 (no Yes votes at all from
      2012 to 2018), and more Yes than No again in 2024 and 2025.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Country voting records are rarely cited as a whole; single landmark votes are. Adoption is information, not evidence."
    would_change_if: "the official UN voting records differ from the dataset for these resolutions; or a different written selection rule changes the pattern"
    anchor:
      type: dataset
      description: >
        Voeten UNGA voting data version 33 (sha256 recorded) processed by data/analyze.py under a
        selection rule written before results were seen; output in data/unga-country-year-1993-2023.csv.
        2024-2025 from un-project.org (data/unga-country-year-2024-2025-unproject.csv), which agrees with
        Voeten on 4,235 of 4,236 overlapping votes; the one disagreement (Canada on A/RES/60/106, 2005)
        is unresolved. Official UN Digital Library voting pages could not be read from here, so the
        claim is held at secondary (rule P3).
      sources: [src-voeten-unvotes-v33, src-unproject-votes]
      accessible: true
    basis: >
      Canada's shifts and who governed: the move toward No began in 2004 to 2005 under Paul Martin
      (Liberal) and deepened from 2006 under Stephen Harper (Conservative); it stayed mostly No for
      eight years after Justin Trudeau (Liberal) took office in November 2015, and turned to more Yes
      than No in 2024, after 7 October 2023 [HoG not sourced]. So Canada's change of government in 2015 did not
      by itself change the votes. Synthetic (our computation), capped at weight 3 (rule P10).

  - id: ipm-sc-vetoes
    state: established
    statement_kind: reported
    statement: >
      From 1993 to September 2025 there were 25 Security Council vetoes of draft resolutions on Israel
      and Palestine: 23 by the United States, including Palestine's UN admission on 18 April 2024, and
      2 by China and Russia jointly, both of US-drafted texts in October 2023 and March 2024. The US
      vetoes were cast under each US president in that period, of both parties.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 3
    adoption_note: "The US veto pattern is widely cited; the China-Russia vetoes less so. Adoption is information, not evidence."
    would_change_if: "the official meeting records give a different count or tally"
    anchor:
      type: dataset
      description: >
        UN DPPA veto dataset downloaded and filtered (data/sc-vetoes-1993-2025.json); tallies read from
        un-project.org copies of the meeting records S/PV.*. The 4 Jun 2025 tally (14-1-0) is known only
        from a delegate's speech. Presidents by date are from general knowledge [HoG not sourced]:
        Clinton (1995, 1997), Bush (2001-2006), Obama (2011), Trump (2017-2018, 2025), Biden (2023-2024).
      sources: [src-dppa-vetoes, src-unproject-votes]
      accessible: true
    basis: "Held at secondary until the meeting records are read on the UN's own site."

  - id: ipm-recognition-dates
    state: established
    statement_kind: reported
    statement: >
      Of the twelve countries, Türkiye (15 November 1988), Qatar (16 November 1988), Egypt (18 November
      1988) and Iran (date unresolved) recognized the State of Palestine in 1988; Ireland, Norway and
      Spain on 28 May 2024; the UK and Canada on 21 September 2025; France on 22 September 2025.
      Germany and the US had not recognized it as of the latest statements found.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Widely reported. Adoption is information, not evidence."
    would_change_if: "an official record gives a different date; or Germany or the US announce recognition"
    anchor:
