  - id: ipm-six-ngos-pflp-arms
    state: contested
    statement_kind: judgment
    statement: >
      The six Palestinian NGOs Israel designated in October 2021 (Al-Haq, Addameer, DCI-Palestine,
      Bisan, UAWC, UPWC) are arms of the PFLP that divert European aid money to it.
    evidence_tier: designation
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Asserted by Israel's government; rejected by nine EU governments and many human-rights groups. Adoption is information, not evidence."
    would_change_if: "Israel publishes the evidence, or a European government's review finds money moving to the PFLP"
    decisions:
      - {date: 2021-10-22, decider: "Israel, Defense Minister Benny Gantz (signing date 19 or 22 Oct not resolved)", what: "designated the six as terrorist organizations", evidence_published: "no", in_power: "Israel: Naftali Bennett, Yamina [HoG not sourced]", sources: [src-nbctf-six-ngos-2021, src-toi-six-ngos-2021]}
      - {date: 2022-01-05, decider: "Netherlands, ministers De Bruijn and Knapen", what: "ended funding to UAWC after its own external review: no money flow to the PFLP and no PFLP control found, but 34 people with personal PFLP ties; Israel's material called not concrete enough", evidence_published: "letter public; review shared with MPs confidentially", in_power: "Netherlands: Mark Rutte, VVD [HoG not sourced]", sources: [src-nl-kamerstuk-23432-486]}
      - {date: 2022-06-30, decider: "European Commission (reported)", what: "lifted its suspension of funding to Al-Haq after the anti-fraud office found no suspicion of irregularities", evidence_published: "not found", in_power: "n/a (Commission)", sources: [src-aljazeera-olaf-2022]}
      - {date: 2022-07-12, decider: "Belgium, Denmark, France, Germany, Ireland, Italy, Netherlands, Spain, Sweden", what: "joint statement: no substantial information received from Israel that would justify changing policy", evidence_published: "n/a", in_power: "nine governments of differing parties", sources: [src-gov-ie-nine-states-2022, src-aa-nine-states-2022]}
    positions:
      - label: "Yes"
        holder: "Israel's Defense Ministry (2021, 2022)"
        ground: "Describes a covert PFLP network raising European money through deceit; evidence not published."
      - label: "Not shown"
        holder: "Nine EU governments (2022); the Netherlands' own review of UAWC"
        ground: "No substantial information received; the Dutch review found personal ties but no money flow."
