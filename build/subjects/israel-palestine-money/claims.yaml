      to UNRWA; Norway did not. Between March and July 2024 the European Commission, Canada, Sweden,
      Australia, Japan, Germany and the UK resumed. The US instead ended funding by law (March 2024)
      and executive order (February 2025). Sweden resumed in March 2024 and then ended all funding in
      December 2024. In December 2025 the General Assembly extended UNRWA's mandate to June 2029 by
      151 to 10 (the US and Israel against).
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Widely reported. Adoption is information, not evidence."
    would_change_if: "an official record shows a different date or decision for any listed government"
