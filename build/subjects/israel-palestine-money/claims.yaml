  - id: ipm-civil-terror-finance-cases
    state: established
    statement_kind: reported
    statement: >
      Three US civil cases sought damages for terror financing. Boim, as recited in a 2017 district-court opinion: a 2004 judgment of
      $156 million against defendants including the Holy Land Foundation, affirmed by the Seventh Circuit en banc in 2008. Linde v. Arab
      Bank: the district court's decision of 8 April 2015 records a jury verdict of liability under the Antiterrorism Act (2014) and cites
      about $32 million sent to 11 Hamas-controlled charities between 1999 and 2004 (about $15 million from a Saudi committee); the
      Second Circuit, in an opinion of 9 February 2018, vacated the challenged judgment on the ground of instructional error and remanded.
      Sokolow (Waldman) v. PLO: the Second Circuit opinion of 31 August 2016 records a jury award of $218.5 million, trebled to $655.5
      million, and vacated the judgment with instructions to dismiss because the federal courts lack personal jurisdiction over the
      defendants.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Adoption is information, not evidence."
    would_change_if: "the 2004 Boim judgment or the 2008 en banc opinion, which were not opened, say something different"
    anchor:
      type: primary_text
      description: >
        Linde district-court decision (8 Apr 2015), the Second Circuit opinions in Linde (9 Feb 2018, Case 16-2119) and Sokolow (31 Aug
        2016, Case 15-3135) downloaded from govinfo.gov on 16 Oct 2026 and read at the passages quoted (hashes in
        sources/MANIFEST.yaml), and the 2017 N.D. Ill. opinion in Boim read in full. The 2004 Boim judgment and the 2008 en banc opinion
        are known only as recited in the 2017 opinion.
      sources: [src-linde-arab-bank-2015, src-linde-2d-cir-2018, src-sokolow-2d-cir-2016, src-boim-2017]
      accessible: true
    basis: "Civil verdicts use a lower standard of proof than criminal convictions. Recorded as what the courts did."

