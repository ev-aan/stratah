  # =======================================================================
  # THE OWNER'S QUESTION: DOES POLITICS DRIVE IT?
  # =======================================================================
  - id: ipm-reversals-and-government-change
    state: proposed
    statement_kind: judgment
    statement: >
      In this pilot, decisions about funding and designations reversed mostly within the same
      government after a review or new conditions, not after a change of government: of 10 reversals
      recorded, 2 came with a change of government and 8 did not.
    evidence_class: synthetic
    confidence: provisional
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "The common view, expressed by the owner and widely, is that politics drives these decisions. This claim tests a narrow version of it. Adoption is information, not evidence."
    would_change_if: >
      a rule-selected, complete set of reversals by the twelve countries since 1993 gives a different
      split; or reversals coded here as review-led turn out to have followed a change of minister or
      coalition rather than of head of government
    reversals_counted:
      - {case: "US settler sanctions (E.O. 14115 revoked)", date: 2025-01-20, change_of_government: yes, stated_reason: "none for this item", claim: ipm-settler-sanctions-split}
      - {case: "UK UNRWA funding restored", date: 2024-07-19, change_of_government: yes, stated_reason: "Colonna review and UNRWA action plan", claim: ipm-unrwa-funding-reversals}
      - {case: "European Commission UNRWA funding resumed", date: 2024-03-01, change_of_government: no, stated_reason: "conditions: screening, audit", claim: ipm-unrwa-funding-reversals}
      - {case: "Canada UNRWA pause lifted", date: 2024-03-08, change_of_government: no, stated_reason: "investigations under way, oversight, humanitarian need", claim: ipm-unrwa-funding-reversals}
      - {case: "Sweden UNRWA resumed", date: 2024-03-09, change_of_government: no, stated_reason: "written UNRWA assurances", claim: ipm-unrwa-funding-reversals}
      - {case: "Australia UNRWA resumed", date: 2024-03-15, change_of_government: no, stated_reason: "updated agreement with conditions", claim: ipm-unrwa-funding-reversals}
      - {case: "Japan UNRWA resumed", date: 2024-04-02, change_of_government: no, stated_reason: "humanitarian situation; UNRWA governance measures", claim: ipm-unrwa-funding-reversals}
      - {case: "Germany UNRWA resumed", date: 2024-04-24, change_of_government: no, stated_reason: "UNRWA's role; Colonna recommendations", claim: ipm-unrwa-funding-reversals}
      - {case: "Sweden ended UNRWA funding", date: 2024-12-20, change_of_government: no, stated_reason: "'crisis of trust'; Israeli laws", claim: ipm-unrwa-funding-reversals}
      - {case: "European Commission lifted Al-Haq suspension", date: 2022-06-30, change_of_government: no, stated_reason: "anti-fraud office found no irregularities (news report only)", claim: ipm-six-ngos-pflp-arms}
    not_counted: >
      Canada's General Assembly votes (a drift over years, not a single decision: see
      ipm-unga-voting-patterns) and continuations that are not reversals (the Netherlands moving from a
      suspension to ending UAWC funding; the US moving from a pause to a law to an executive order).
    anchor:
      type: synthetic
      description: >
        Our coding of the reversals recorded in the claims named in reversals_counted. A reversal is a
        government undoing its own earlier decision on the same organization or program. Change of
        government means a different head of government on the reversal date than on the original
        decision date (heads of government from general knowledge except the UK in 2024, which the
        gov.uk pages label).
      sources: [src-eo-14148, src-ofac-20250124, src-uk-unrwa-pause-2024, src-uk-unrwa-resume-2024, src-ec-unrwa-resume-2024, src-canada-unrwa-resume-2024, src-se-unrwa-2024-06, src-au-unrwa-resume-2024, src-jp-unrwa-resume-2024, src-de-unrwa-resume-2024, src-riksdag-unrwa-2024, src-aljazeera-olaf-2022]
      accessible: true
    assumptions:
      - {text: "The ten reversals found are not a biased sample of all reversals.", if_wrong: "They are not random: eight come from the single UNRWA episode of 2024. A complete, rule-selected list could split differently."}
      - {text: "A government's stated reason is recorded as stated, not as its real motive.", if_wrong: "Rule P6/P11: motive is not assessed; the count says what changed and when, not why."}
    alternatives:
      - {text: "Politics drives these decisions, but through the same government reacting to domestic pressure, not through elections.", why_not_preferred: "Not testable from the public record collected here; it would need polling, parliamentary records and donor data by date."}
    basis: >
      Proposed and provisional: a computed count on a small, non-random set, eight of the ten from one
      episode (UNRWA in 2024). It answers a narrow version of the owner's question and shows the method.
      A second, separate test points the same way: US Security Council vetoes (ipm-sc-vetoes) were
      cast under presidents of both parties. A third points the other way: designations almost never
      come with published evidence, so for most of them one cannot tell from the record whether
      evidence or politics drove the decision (ipm-designation-evidence-gap).

