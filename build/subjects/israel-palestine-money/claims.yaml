  - id: ipm-us-appropriation-lines-2024-2025
    state: established
    statement_kind: reported
    statement: >
      US appropriation laws state these Middle East lines. Public Law 118-47 (23 Mar 2024): Foreign Military
      Financing grants of "not less than" $3,300,000,000 for Israel (Div. F, Sec. 7041(d)); $500,000,000 for
      Israeli Cooperative Programs in the defense appropriation (Div. A, Sec. 8072, of which $80,000,000 for Iron
      Dome procurement); "not less than" $1,650,000,000 for Jordan (Sec. 7041(e)); "not less than $1,425,000,000
      should be made available" for Egypt (Sec. 7041(a)). The same law bars funds to the Palestinian Authority
      unless the President certifies a waiver (Sec. 7040) and sets conditions and audits for the West Bank and Gaza
      program (Sec. 7039); neither section states a dollar amount. Public Law 118-50, Division A (24 Apr 2024):
      Foreign Military Financing $3,500,000,000 for Israel; Procurement, Defense-Wide $5,200,000,000 of which
      $4,000,000,000 for Iron Dome and David's Sling and $1,200,000,000 for Iron Beam for the Government of Israel;
      Operation and Maintenance, Defense-Wide $4,400,000,000 and Procurement of Ammunition, Army $801,400,000
      "to respond to the situation in Israel"; International Disaster Assistance $5,655,000,000 and Migration and
      Refugee Assistance $3,495,000,000 for humanitarian needs, with no Gaza-specific amount in the text; Sec. 308
      bars funds to UNRWA. Public Law 119-4 (Mar 2025) extends the Israel loan-guarantee authority to 30 Sep 2030
      and contains no other Israel line. Public Law 115-141, Div. S, Title X (Taylor Force Act), Sec. 1002 ("Findings": "Congress makes the
      following findings") includes, in paragraph (2): "The United States does not provide direct budgetary support to the
      Palestinian Authority. The United States does pay certain debts held by the Palestinian Authority and funds programs for
      which the Palestinian Authority would otherwise be responsible."
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Not measured for this combination of lines. Adoption is information, not evidence."
    would_change_if: "the enacted text differs from the govinfo copy; or the explanatory statements, which were not read, change what the lines cover"
    decisions:
      - {date: 2024-03-23, decider: "US Congress and President (P.L. 118-47)", what: "Israel FMF, Israeli Cooperative Programs, Jordan, Egypt lines; PA prohibition with waiver; West Bank and Gaza program conditions", evidence_published: "law text", sources: [src-plaw-118-47]}
      - {date: 2024-04-24, decider: "US Congress and President (P.L. 118-50 Div. A)", what: "supplemental lines listed above; UNRWA bar", evidence_published: "law text", sources: [src-plaw-118-50]}
      - {date: 2025-03-15, decider: "US Congress and President (P.L. 119-4)", what: "Israel loan-guarantee authority extended to 30 Sep 2030", evidence_published: "law text", sources: [src-plaw-119-4]}
    anchor:
      type: primary_text
      description: >
        The four public laws were downloaded from govinfo.gov on 16 Oct 2026 (hashes in data/PARTB_SELECTION_RULES.md)
        and the passages quoted were located by text search and read in context: P.L. 118-47 Sec. 7041, 8072, 7039,
        7040; P.L. 118-50 Div. A Titles I and III and Sec. 308; P.L. 119-4 (searched for Israel, Palestin, West
        Bank, Gaza, UNRWA, Foreign Military: one hit); P.L. 115-141 Title X Sec. 1002. Rows in
        data/documented-flows-2026-10-16.csv (PB-001 to PB-016). Not read: the explanatory statements with country
        tables, and any enacted FY2026 act.
      sources: [src-plaw-118-47, src-plaw-118-50, src-plaw-119-4, src-plaw-115-141-tfa]
      accessible: true
    basis: >
      Amounts are appropriation or floor amounts in law, not disbursements. ForeignAssistance.gov and the FY2026 act
      were not reachable or not located (see ipm-flows-unread-and-coverage).

  - id: ipm-pa-financing-statements-2016-2023
    state: established
    statement_kind: reported
    statement: >
      World Bank reports to the Ad Hoc Liaison Committee state these flows to and from the Palestinian Authority.
      September 2016: full-year donor support "not projected to exceed US$700 million" against a $1.3 billion deficit.
      September 2018: Saudi Arabia to resume budget support at $20 million a month. September 2019: Israel's
      deductions from clearance revenues of almost $12 million a month from March 2019 (law enacted 2018), which the
      PA refused to accept; the report states a Qatari $250 million loan, with two $25 million instalments disbursed in June and
      July 2019, and a footnote (9) that "Total Qatari funds amount to US$480" (unit as printed) consisting of a US$50 million
      grant to the PA, a US$250 million loan to the PA from the Qatar National Bank paid in instalments, and US$180 million to
      Gaza, some of which had been disbursed; the Arab League announced a $100 million a month safety net with no amounts deposited at the time of
      writing. November 2021: Israel advanced $153 million (NIS 500 million) of clearance revenues in September 2021;
      donor financing projected at $184 million ($83 million budget support, $101 million investment projects), 38
      percent of 2020. September 2022: donor financing projected at $315 million ($195 million budget support, $120
      million projects), first-half 2022 $80 million. September 2023: first-half 2023 donor financing $156 million
      ($118 million budget support, $38 million development financing) and Israeli deductions of $157 million; the
      report states no funding was received from Arab donors in the first half of 2023, unlike the previous year.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Not measured. Adoption is information, not evidence."
    would_change_if: "Palestinian Ministry of Finance or donor records give different amounts; or the World Bank revises the figures"
    anchor:
      type: primary_text
      description: >
        Six World Bank AHLC reports (Sept 2016, Sept 2018, Sept 2019, Nov 2021, Sept 2022, Sept 2023) downloaded from
        documents.worldbank.org through the World Bank documents API on 16 Oct 2026; the passages quoted were located
        by text search and read in context. The figures are the World Bank's own, projected or reported, and were not
        compared with Palestinian or donor records. Reports of 2017 and 2020 were downloaded but not used; no
        2024-2025 report was located.
      sources: [src-wb-ahlc-2016-09, src-wb-ahlc-2018-09, src-wb-ahlc-2019-09, src-wb-ahlc-2021-11, src-wb-ahlc-2022-09, src-wb-ahlc-2023-09]
      accessible: true
    basis: >
