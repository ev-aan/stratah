    statement_kind: reported
    statement: >
      From 1993 to September 2025 the UN's veto dataset lists 25 negative votes by permanent members of
      the Security Council on Israel-Palestine items: 23 by the United States and 2 by China and Russia
      together. 24 were votes on draft resolutions. One (22 December 2023, US) was a vote on an oral
      amendment, proposed by Russia, to a draft that was then adopted as resolution 2720. The US votes
      include the draft on Palestine's admission to the UN (18 April 2024, S/2024/312, 12-1-2); the China
      and Russia votes (25 October 2023, S/2023/792; 22 March 2024, S/2024/239) were on drafts submitted
      by the United States. Counting drafts only, the figures are 22 US and 24 in all.
