    anchor:
      type: primary_text
      description: >
        Dutch letter to parliament (Kamerstuk 23432-486) read in full in Dutch: the review found no
        financial flows between UAWC and the PFLP and no PFLP control, and listed 34 people with PFLP
        ties (28 board members, 12 holding posts in both at once). Nine-state statement read in two
        government copies. Israel's announcement read through a summarizing tool; the signed
        declaration was not found. The Commission's Al-Haq decision is known only from a news report.
      sources: [src-nl-kamerstuk-23432-486, src-gov-ie-nine-states-2022, src-aa-nine-states-2022, src-nbctf-six-ngos-2021, src-toi-six-ngos-2021, src-aljazeera-olaf-2022]
      accessible: true
    basis: >
      Contested at low confidence. The one review whose findings are public (the Dutch one) supports
      neither the full Israeli claim nor a clean bill: personal ties, no money flow found.

  # =======================================================================
  # UNRWA
  # =======================================================================
  - id: ipm-unrwa-staff-involvement
    state: established
    statement_kind: reported
    statement: >
      After Israel alleged in January 2024 that UNRWA staff took part in the 7 October 2023 attack, the
      UN's internal oversight office investigated 19 staff and reported in August 2024 that 9 "may have
      been involved" (they were dismissed), 9 cases had insufficient evidence and 1 had none. The
      evidence was not published.
    evidence_tier: regulator_finding
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Very widely reported, often in stronger forms on both sides (all of UNRWA implicated; or no evidence at all). Adoption is information, not evidence."
    would_change_if: "the OIOS report or Israel's dossier is published; or a court or later inquiry reaches a different count"
    decisions:
      - {date: 2024-01-28, decider: "UN Secretary-General", what: "12 staff implicated by Israel: 9 identified and dismissed, 1 dead, 2 being clarified", evidence_published: "no (Israel's dossier not public)", in_power: "n/a", sources: [src-un-sg-unrwa-2024-01-28]}
      - {date: 2024-04-20, decider: "Independent review led by Catherine Colonna", what: "found UNRWA's neutrality systems more developed than comparable bodies', with gaps; noted Israel had not yet provided evidence for a separate claim about staff membership of armed groups", evidence_published: "report public", in_power: "n/a", sources: [src-colonna-2024]}
