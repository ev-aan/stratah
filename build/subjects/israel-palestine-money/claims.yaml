# israel-palestine-money: who paid, designated, sanctioned and voted, and when it changed (pilot, 1993-2026)
# Opened 2026-10-07 at the owner's request (log L-01). Pilot scope: ten money/designation cases and the
# UN voting and recognition record of twelve countries. Everything else is filed as searched gaps.
#
# How to read the extra fields used here (they add to, never replace, the schema fields):
#   decisions: one entry per decision about a case. `decider` is the body that acted; `in_power` is the
#     head of government on that date, from general knowledge unless a source is named ([HoG not
#     sourced]); `evidence_published` says whether the evidence behind the decision is public.
#   evidence_tier: the strongest kind of decision on record for the case, in this order:
#     conviction > regulator_finding > designation > investigative_report > allegation.
#     A designation is a legal and political act; its evidence is usually not public.
#   Rule P5 (build/SCHEMA.md): timing beside money or a change of government shows timing only. It does
#   not show cause unless a source documents the link. Rule P6/P11: motive is not assessed.
# ---------------------------------------------------------------------------

subject:
  id: israel-palestine-money
  title: "Israel-Palestine: who paid, designated, sanctioned and voted, and when it changed (pilot, 1993 to 2026)"

headline: "Israel-Palestine money trail: of 10 reversals found, 2 came with a change of government"
headline_claim: ipm-reversals-and-government-change
headline_status: draft          # draft: the headline claim is proposed, not established
search_summary: >
  Who funded, designated, sanctioned and voted on Israel-Palestine since 1993, which governments disagreed, and whether reversals followed elections.
url_slug: israel-palestine-money-trail
dig_status: pilot_draft

assessment:
  question: "Who paid, designated, sanctioned and voted on what in the Israel-Palestine conflict since 1993, and do those decisions follow who is in power?"
  answer: "partly"
  headline: "Partly. Governments often disagree about the same group and rarely publish their evidence, but most reversals found here came within one government."
  text: >
    The pilot covers ten cases where money is said to have reached an armed party, or where a
    government acted to stop it, plus the UN voting and recognition record of twelve countries.
    Three things stand out. First, the strength of the record varies enormously. One case ended in
    criminal convictions upheld on appeal (Holy Land Foundation, US, 2008 and 2011). Most of the
    rest are designations: legal acts by a government whose evidence is classified or not
    published. Second, governments disagree often and on the record. The US designated Interpal in
    2003 while the UK charity regulator found no evidence to substantiate links; Israel designated
    six Palestinian NGOs in 2021 while nine EU governments said they had received no substantial
    information to justify changing policy; only Israel has designated Turkey's IHH; the UK and
    Canada sanction Israeli ministers and settler groups the US does not, and kept settler
    sanctions the US revoked. Third, on the user's question of whether politics drives it: of ten
    reversals recorded in the pilot, two came with a change of government (the US settler
    sanctions revoked on 20 January 2025; the UK's UNRWA funding restored in July 2024, which also
    cited an independent review). The other eight happened within the same government, mostly
    after an investigation, a review or new conditions. US Security Council vetoes run the other
    way: 23 since 1993, cast under every US president of both parties in that period. This is a
    small, non-random set of cases, so it does not settle the question; it shows how to test it.
    Money totals (US aid, Qatari grants, Iranian support) are recorded as each government states
    them; an "up to $100 million a year" Iranian figure is a US government estimate with no
    published method.
  key_points:
    - "One case ended in convictions upheld on appeal (Holy Land Foundation); most others are designations whose evidence is not published."
    - "Governments often disagree on the same group: US vs UK regulator (Interpal), Israel vs nine EU states (six NGOs), UK/Canada vs US (settlers)."
    - "Of 10 reversals found, 2 came with a change of government; 8 came within one government, mostly after a review. US vetoes span both parties."
  basis: [ipm-reversals-and-government-change, ipm-hlf-convicted, ipm-interpal-passed-money-to-hamas, ipm-six-ngos-pflp-arms, ipm-settler-sanctions-split, ipm-sc-vetoes]
  rated_claim: ipm-reversals-and-government-change
  would_settle: >
    A larger, rule-selected set of reversals (every designation, delisting and funding pause by the
    twelve countries since 1993, chosen by a written rule before reading outcomes), each coded for
    change of government and for any published new evidence; and the release of the evidence behind
    designations (court records, regulator reports, declassified files), which is what would let a
    reader tell an evidence-led decision from a political one.

divergence_note: >
  What is commonly said: "this charity funds terrorists", or "these designations are political". What
  the record shows: most designations rest on evidence the public cannot see, so neither statement can
  usually be checked. Where evidence was tested in public (the Holy Land Foundation trial, the Dutch
  government's own review of UAWC, the UN's internal investigation of UNRWA staff, the UK regulator's
  Interpal inquiries), the results were specific and often narrower than either side's claim: a
  conviction for about $12.4 million to Hamas-controlled committees; personal ties between UAWC staff
  and the PFLP but no money flow found; nine UNRWA staff who "may have been involved" out of 19
  investigated; and no substantiated Hamas link at Interpal by the UK regulator. The gap between a
  designation and a tested finding is the product of this dig.

leads_to:
  - {subject: oct7-warnings, why: "Several funding decisions here (UNRWA pauses, Qatari transfers approved by Israel's security cabinet in 2018) bear on what governments knew and did before 7 October 2023."}
  - {subject: netanyahu-profile, why: "Not yet dug. Decisions taken under Netanyahu governments that this dig records: the 2018 approval of Qatari cash into Gaza (reported), the 1997 Israeli designations of HLF and Interpal, and Samidoun's 2021 designation. The profile should cite these claims rather than copy them."}
  - {subject: israel-palestine-influence, why: "Not yet dug: money aimed at the politics (FEC, lobbying disclosures, FARA, university foreign-gift filings, Canada's lobbyist registry). See ipm-influence-ledger-gap."}

claims:

  # =======================================================================
  # CHARITIES AND NONPROFITS
  # =======================================================================
  - id: ipm-hlf-convicted
    state: established
    statement_kind: reported
    statement: >
      A US federal jury convicted the Holy Land Foundation and five of its leaders in November 2008
      of giving material support to Hamas, and the Fifth Circuit affirmed in December 2011. The
      Justice Department put the money at about $12.4 million, sent through zakat (charity)
      committees in the West Bank and Gaza that the appeals court described as Hamas social institutions.
    evidence_tier: conviction
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: >
      Widely cited in US terror-finance literature; also widely cited by critics as an example of a
      prosecution resting partly on undesignated committees and on testimony by Israeli agents under
      pseudonyms. Adoption is information, not evidence.
    would_change_if: >
      a later court vacated the convictions, or the trial record shows the $12.4 million figure
      describes something other than transfers to the committees
    decisions:
      - {date: 2001-12-04, decider: "US Treasury OFAC (E.O. 13224)", what: "assets blocked; designated SDGT", evidence_published: "partly: fact sheet public, classified record reviewed only by the court", in_power: "US: George W. Bush, Republican [HoG not sourced]", sources: [src-treasury-po841-2001, src-whitehouse-2001-12-04]}
      - {date: 2003-06-20, decider: "US Court of Appeals, D.C. Circuit", what: "designation upheld after in-camera review of classified evidence", evidence_published: "no (reviewed ex parte)", in_power: "Bush [HoG not sourced]", sources: [src-hlf-v-ashcroft-2003]}
      - {date: 2008-11-24, decider: "federal jury, N.D. Texas (retrial after a 2007 mistrial)", what: "HLF and five leaders convicted", evidence_published: "yes, public trial (some witnesses under pseudonym)", in_power: "Bush [HoG not sourced]", sources: [src-doj-hlf-2008]}
      - {date: 2011-12-07, decider: "US Court of Appeals, Fifth Circuit", what: "convictions affirmed", evidence_published: "yes, published opinion", in_power: "US: Barack Obama, Democrat [HoG not sourced]", sources: [src-el-mezain-2011]}
      - {date: 1997-05-06, decider: "Israel, Defence (Emergency) Regulations 1945", what: "declared an unauthorized association", evidence_published: "no", in_power: "Israel: Benjamin Netanyahu, Likud [HoG not sourced]", sources: [src-opensanctions-il-mod]}
    anchor:
      type: primary_text
      description: >
        DOJ release of 24 Nov 2008 read in full (the verdict and the $12.4 million figure). Fifth
        Circuit opinion in United States v. El-Mezain, 664 F.3d 467, read in its introduction,
        background, evidence and conclusion sections: it affirmed the individual convictions, called the
        zakat committees "Hamas social institutions", and accepted that none of the committees had
        itself been designated, finding error in an OFAC witness's lay testimony on that point but not
        reversing. The 2001 designation and the 2003 D.C. Circuit ruling were read in Treasury's release
        and the court's opinion. The 1997 Israeli date rests on the OpenSanctions copy of Israel's list.
      sources: [src-doj-hlf-2008, src-el-mezain-2011, src-treasury-po841-2001, src-hlf-v-ashcroft-2003, src-opensanctions-il-mod]
      accessible: true
    basis: >
      The strongest case in the pilot because the evidence was tested at a public trial and on appeal.
      Two limits travel with it: the money went to committees, not to Hamas's armed wing directly, and
      the court accepted that link from evidence including testimony by Israeli security officers.
      No government or regulator reached a different conclusion about HLF; the only divergence is the
      first trial, which ended in a mistrial in 2007 (date not verified).

  - id: ipm-interpal-passed-money-to-hamas
    state: contested
    statement_kind: judgment
    statement: >
      Interpal, a UK charity, passed money to Hamas.
    evidence_tier: designation
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: >
      Repeated in US government material since 2003; disputed by the UK regulator's findings as reported
      to Parliament. Adoption is information, not evidence.
    would_change_if: >
      the Charity Commission's own 2003 and 2009 reports, once read, say something different from the
      minister's and the NGO's accounts; or the US releases the evidence behind the 2003 designation;
      or a court rules on the question
    decisions:
      - {date: 1997-05-06, decider: "Israel, Defence (Emergency) Regulations 1945", what: "declared an unauthorized association", evidence_published: "no", in_power: "Israel: Netanyahu, Likud [HoG not sourced]", sources: [src-opensanctions-il-mod]}
      - {date: 2003-08-22, decider: "US Treasury OFAC (E.O. 13224)", what: "designated SDGT as 'a principal charity' hiding money flows to Hamas", evidence_published: "no; the release relies on unnamed 'reporting'", in_power: "US: George W. Bush, Republican [HoG not sourced]", sources: [src-treasury-js672-2003]}
      - {date: 2003-09-24, decider: "UK Charity Commission", what: "closed its inquiry and lifted restrictions; a minister told the Lords it found no evidence to substantiate links to Hamas's political or militant activities", evidence_published: "report exists but was not opened here", in_power: "UK: Tony Blair, Labour [HoG not sourced]", sources: [src-hansard-lords-2003-10-06, src-cc-interpal-2003]}
      - {date: 2008-07-07, decider: "Israel, Defense Minister Ehud Barak", what: "order against 36 Union of Good funds, reported to include Interpal", evidence_published: "no", in_power: "Israel: Ehud Olmert, Kadima [HoG not sourced]", sources: [src-ynet-union-of-good-2008]}
      - {date: 2009-02-27, decider: "UK Charity Commission", what: "per an NGO summary: insufficient evidence that partners promoted terrorism; weak partner checks; told to leave the US-designated Union of Good", evidence_published: "report exists but was blocked here", in_power: "UK: Gordon Brown, Labour [HoG not sourced]", sources: [src-csn-interpal-2009, src-cc-interpal-2009]}
    positions:
      - label: "Yes"
        holder: "US Treasury (2003); Israel (1997, 2008)"
        ground: "Designations stating that Interpal hid money flows to Hamas; evidence not published."
      - label: "No (not substantiated)"
        holder: "UK Charity Commission (2003, and as summarized for 2009)"
        ground: "Inquiries found no evidence to substantiate a Hamas link, while criticising partner checks."
    disputed_by:
      - {who: "UK Charity Commission", kind: institution, position: "No evidence found to substantiate links to Hamas's political or militant activities (2003, as reported to the House of Lords).", source_read: "Hansard, 6 Oct 2003 (read); the Commission's report itself blocked", via: src-hansard-lords-2003-10-06}
    anchor:
      type: primary_text
      description: >
        Treasury's 2003 release read in full: it calls Interpal a principal charity hiding money flows
        to Hamas and rests on "reporting indicates". Hansard (Lords, 6 Oct 2003) read through the
        official API: the minister's account of the Commission's 2003 finding. The Commission's own 2003
        and 2009 reports were blocked; the 2009 findings are from an advocacy group's summary. Current
        status checked in the OFAC list (still designated, entry 7917), the UK and EU lists (not
        listed) and the charity register (still registered; income for 2024 was £55,167).
      sources: [src-treasury-js672-2003, src-hansard-lords-2003-10-06, src-cc-interpal-2003, src-cc-interpal-2009, src-csn-interpal-2009, src-ofac-sdn-2026, src-uk-sanctions-list-2026, src-eu-consolidated-2026, src-cc-register-1040094]
      accessible: true
    basis: >
      The clearest case in the pilot of a regulator reaching a different conclusion from a designating
      government. The UK has never listed Interpal; the US has never delisted it. Neither side's
      underlying evidence was read here: the US evidence is not public, and the Commission's reports
      were blocked. Hence contested at low confidence, not settled either way.

  - id: ipm-irfan-canada-hamas-support
    state: established
    statement_kind: reported
    statement: >
      Canada revoked IRFAN-Canada's charity status in 2011 and listed it as a terrorist entity in April
      2014, stating it gave about $14.6 million in resources to organizations run by or linked to
      Hamas between 2005 and 2009. The evidence behind the listing has not been published, and
      IRFAN's court challenge was abandoned without a ruling on the merits.
    evidence_tier: regulator_finding
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Little public debate outside Canada. Adoption is information, not evidence."
    would_change_if: "the CRA's 2011 revocation letter shows different grounds; or a court reviews the listing on its merits"
    decisions:
      - {date: 2004-12-30, decider: "Israel, Defence (Emergency) Regulations 1945", what: "declared an unauthorized association", evidence_published: "no", in_power: "Israel: Ariel Sharon, Likud [HoG not sourced]", sources: [src-opensanctions-il-mod]}
      - {date: 2011-04-09, decider: "Canada Revenue Agency", what: "charity registration revoked, 'based in part' on support to Hamas", evidence_published: "summary only", in_power: "Canada: Stephen Harper, Conservative [HoG not sourced]", sources: [src-cra-irfan]}
      - {date: 2014-04-24, decider: "Canada, Governor in Council (Criminal Code s.83.05)", what: "listed as a terrorist entity (SOR/2014-97)", evidence_published: "no", in_power: "Harper [HoG not sourced]", sources: [src-gazette-sor-2014-97, src-ps-listed-entities]}
      - {date: 2019-08, decider: "IRFAN (applicant)", what: "abandoned its Federal Court judicial review; no merits ruling", evidence_published: "n/a", in_power: "Canada: Justin Trudeau, Liberal [HoG not sourced]", sources: [src-ps-qp-2019]}
      - {date: 2024-06-07, decider: "Canada, statutory review", what: "listing maintained", evidence_published: "no", in_power: "Trudeau [HoG not sourced]", sources: [src-ps-listed-entities]}
    anchor:
      type: primary_text
      description: >
        Canada Gazette SOR/2014-97 read in full (the listing; no evidence given). Public Safety's list
        page read in full (stated basis, the $14.6 million figure, review date 7 Jun 2024). CRA page and
        the 2019 Question Period note read through a summarizing tool. Searched the OFAC, EU and UK
        lists: IRFAN-Canada is on none of them.
      sources: [src-gazette-sor-2014-97, src-ps-listed-entities, src-cra-irfan, src-ps-qp-2019, src-ofac-sdn-2026, src-eu-consolidated-2026, src-uk-sanctions-list-2026]
      accessible: true
    basis: >
      Established as a record of what Canada decided and said, not as a finding that the money reached
      Hamas: that statement rests on evidence that is not public. The listing was kept by governments of
      both main parties (Conservative 2014, Liberal 2024).

  - id: ipm-samidoun-designations
    state: established
    statement_kind: reported
    statement: >
      Samidoun was designated by Israel (February 2021) as a front for the PFLP abroad, banned in
      Germany (November 2023, for incitement and propaganda rather than for money transfers), listed by
      Canada (11 October 2024) and designated by the US (15 October 2024) as a fundraiser for the PFLP.
      The EU and UK have not listed it. None of the four governments published its evidence.
    evidence_tier: designation
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Contested by the group and its supporters as a political designation. Adoption is information, not evidence."
    would_change_if: "any of the four governments publishes the evidence, or a court reviews a designation on its merits"
    decisions:
      - {date: 2021-02-28, decider: "Israel, Defense Minister Benny Gantz", what: "designated a terrorist organization (order dated 21 Feb in the list copy)", evidence_published: "no", in_power: "Israel: Benjamin Netanyahu, Likud [HoG not sourced]", sources: [src-nbctf-samidoun-2021, src-opensanctions-il-mod]}
      - {date: 2023-11-02, decider: "Germany, Federal Interior Ministry", what: "activity ban; Samidoun Deutschland dissolved", evidence_published: "reasons stated, not evidence", in_power: "Germany: Olaf Scholz, SPD [HoG not sourced]", sources: [src-bmi-samidoun-2023]}
      - {date: 2024-10-11, decider: "Canada, Governor in Council (s.83.05)", what: "listed (SOR/2024-204)", evidence_published: "no; description relies on 'open sources'", in_power: "Canada: Justin Trudeau, Liberal [HoG not sourced]", sources: [src-gazette-sor-2024-204, src-ps-listed-entities]}
      - {date: 2024-10-15, decider: "US Treasury OFAC (jointly with Canada)", what: "designated SDGT as 'a sham charity' raising money for the PFLP", evidence_published: "no", in_power: "US: Joe Biden, Democrat [HoG not sourced]", sources: [src-treasury-jy2646-2024]}
    anchor:
      type: primary_text
      description: >
        Treasury release (15 Oct 2024) and Canada Gazette SOR/2024-204 read in full. Israel's statement
        and Germany's release read through a summarizing tool. EU and UK lists searched: no entry.
      sources: [src-treasury-jy2646-2024, src-gazette-sor-2024-204, src-ps-listed-entities, src-nbctf-samidoun-2021, src-bmi-samidoun-2023, src-eu-consolidated-2026, src-uk-sanctions-list-2026]
      accessible: true
    basis: >
      The armed group named here is the PFLP, not Hamas. Germany's reasons concern advocacy and
      violence, so its ban is not a finding about money. Recorded as what each government did and said.

  - id: ipm-ihh-designated-only-by-israel
    state: established
    statement_kind: search_result
    statement: >
      Among the governments checked, only Israel has designated Turkey's IHH (in 2008, as one of 36
      Union of Good funds). Germany's 2010 ban, upheld in 2012, was of a separate Frankfurt
      association with a similar name. The US, EU and UK lists checked on 5-7 October 2026 have no
      IHH entry.
    evidence_tier: designation
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "IHH is widely described in Israeli and some US commentary as a Hamas supporter; Turkey treats it as a lawful foundation (official Turkish source not read). Adoption is information, not evidence."
    would_change_if: "an official list shows another government designating IHH; or Israel's original order shows a different date or entity"
    absence_anchor: false
    decisions:
      - {date: 2008-05-26, decider: "Israel, Defense Minister Ehud Barak (as reported)", what: "declared an unauthorized association (made public about 7 Jul 2008)", evidence_published: "no", in_power: "Israel: Ehud Olmert, Kadima [HoG not sourced]", sources: [src-opensanctions-il-mod, src-ynet-union-of-good-2008]}
      - {date: 2010-06-23, decider: "Germany, Federal Interior Ministry", what: "banned IHH e.V., a separate German association, for donations to Hamas-linked Gaza associations", evidence_published: "tested in court", in_power: "Germany: Angela Merkel, CDU [HoG not sourced]", sources: [src-bverwg-ihh-2012]}
      - {date: 2012-04-18, decider: "German Federal Administrative Court", what: "upheld the ban on IHH e.V.; funding of groups in Pakistan, Yemen, Sudan and Turkey did not meet the threshold", evidence_published: "yes (judgment)", in_power: "Merkel [HoG not sourced]", sources: [src-bverwg-ihh-2012]}
    anchor:
      type: dataset
      description: >
        OFAC SDN and alias files (5 Oct 2026), EU consolidated list (22 Sep 2026) and UK list (7 Oct
        2026) downloaded and searched for IHH, Insani Yardim, Yardim and Hurriyetleri: no IHH entry.
        The Israeli date rests on the OpenSanctions copy (not compared with the original). The German
        court's press release was read in full in German.
      sources: [src-ofac-sdn-2026, src-eu-consolidated-2026, src-uk-sanctions-list-2026, src-opensanctions-il-mod, src-bverwg-ihh-2012, src-ynet-union-of-good-2008]
      accessible: true
    basis: >
      The "only Israel" half is a search result against three Western lists; other countries' lists
