    statement: >
      Qatar's foreign ministry announced grants to Gaza including $150 million over six months (March
      2020), a $360 million grant for 2021 for salaries, needy families and power stations (January
      2021) and $500 million for reconstruction (May 2021). In 2018 Netanyahu publicly defended letting
      Qatar bring $15 million into Gaza for salaries, approved, he said, by his security cabinet; no
      Israeli government document on that approval was found.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Often described as 'Qatar funds Hamas' or as 'Netanyahu let cash into Gaza'; both compress a mix of humanitarian grants, salary payments and approvals. Adoption is information, not evidence."
    would_change_if: "the Israeli cabinet decision is read; or Qatar Fund for Development disbursement records show different amounts"
    decisions:
