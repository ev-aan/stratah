    statement_kind: reported
    statement: >
      On 24 May 2022 the US Treasury sanctioned four people and six companies in Sudan, Turkey, Saudi
      Arabia, Algeria and the UAE as part of what it called Hamas's secret investment portfolio, which
      it estimated held assets worth more than $500 million. That is Treasury's estimate of total
      assets, not an amount seized; no supporting documents were published.
    evidence_tier: designation
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "The $500 million figure is widely repeated, often without the word 'estimated'. Adoption is information, not evidence."
    would_change_if: "company records or court filings in the named countries show different ownership or values"
    decisions:
      - {date: 2022-05-24, decider: "US Treasury OFAC", what: "designations", evidence_published: "no", sources: [src-treasury-jy0798-2022]}
