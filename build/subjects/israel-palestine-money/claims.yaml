        Norway and Türkiye read through a summarizing tool; Qatar through its 1988 letter to the UN.
        Egypt's and Iran's dates rest on a list circulated by the Arab Group, OIC and NAM (A/78/846),
        which gives Iran 4 Feb 1988, before the 15 Nov 1988 declaration, so Iran's date is left open.
        "Not recognized" for Germany and the US rests on the latest statements found plus votes, not on
