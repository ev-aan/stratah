      grants rose, following the 1999 Clinton-Barak statement; a 2007 memorandum pledged $30 billion for
      FY2009 to FY2018. The US also guaranteed $10 billion of Israeli borrowing from 1992, reduced by $773.8
      million net for settlement spending, and $9 billion from 2003, reduced for settlement and barrier
      spending.
