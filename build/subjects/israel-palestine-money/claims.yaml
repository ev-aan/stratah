  # =======================================================================
  - id: ipm-unrwa-staff-involvement
    state: established
    statement_kind: reported
    statement: >
      After Israel alleged in January 2024 that UNRWA staff took part in the 7 October 2023 attack, the
      UN's internal oversight office investigated 19 staff and reported in August 2024 that 9 "may have
      been involved" (they were dismissed), 9 cases had insufficient evidence and 1 had none. The
      evidence was not published.
    evidence_tier: regulator_finding
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Very widely reported, often in stronger forms (all of UNRWA implicated; or no evidence at all). Adoption is information, not evidence."
    would_change_if: "the OIOS report or Israel's dossier is published; or a court or later inquiry reaches a different count"
    decisions:
      - {date: 2024-01-28, decider: "UN Secretary-General", what: "12 staff implicated by Israel: 9 identified and dismissed, 1 dead, 2 being clarified", evidence_published: "no (Israel's dossier not public)", sources: [src-un-sg-unrwa-2024-01-28]}
      - {date: 2024-04-20, decider: "Independent review led by Catherine Colonna", what: "found UNRWA's neutrality systems more developed than comparable bodies', with gaps; noted Israel had not yet provided evidence for a separate claim about staff membership of armed groups", evidence_published: "report public", sources: [src-colonna-2024]}
      - {date: 2024-08-05, decider: "UN Office of Internal Oversight Services", what: "of 19 staff: 9 may have been involved, 9 insufficient evidence, 1 no evidence", evidence_published: "outcome only", sources: [src-un-oios-2024-08-05]}
    anchor:
      type: primary_text
      description: >
        UN statements of 28 Jan and 5 Aug 2024 read in full on UNISPAL. The Colonna review was read
        through a summarizing tool (direct download refused); its sentence on missing Israeli evidence
        concerns Israel's March 2024 claim about staff membership, not the 7 October allegations, which
        it left to OIOS.
      sources: [src-un-sg-unrwa-2024-01-28, src-un-oios-2024-08-05, src-colonna-2024]
      accessible: true
    basis: "Recorded as the UN's own finding. Two of the 19 had died; the statement does not say which group they fall in."

  - id: ipm-unrwa-funding-reversals
