  - id: ipm-pa-finances-1993-2015
    state: established
    statement_kind: reported
    statement: >
      From Oslo to 2015, the Palestinian Authority was funded mainly by donor aid and by taxes Israel
      collects for it. Donors pledged over $2 billion in October 1993, $7.4 billion in Paris in December
      2007 and about $5.4 billion in Cairo in October 2014. IMF tables show external budget support of
      $1.76 billion in 2008, falling to $709 million in 2015. Clearance revenues collected by Israel under
      the 1994 Paris Protocol reached $2.05 billion in 2014 and 2015; Israel withheld them in 2001, from
      February 2006 to June 2007, in late 2012, and from December 2014 to March 2015 after the PA joined the
      ICC. The IMF estimated in 2003 that revenue diverted outside the PA budget from 1995 to April 2000 may
      have exceeded $898 million, mostly invested in PA-owned commercial companies later consolidated into
      the Palestine Investment Fund (valued at $633 million on 1 Jan 2003).
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "The '$900 million' Arafat-era figure is widely cited, often as personal theft; the IMF describes revenue kept outside the budget and invested in PA-owned companies. Adoption is information, not evidence."
    would_change_if: "IMF or World Bank originals differ from the UNISPAL copies; or the amounts withheld in each episode are found in official records"
    anchor:
      type: primary_text
      description: >
        IMF 2003 report read in full on imf.org (Table 5.2). World Bank report 28990-GZ and IMF reports to
        the Ad Hoc Liaison Committee read in full as UNISPAL copies (imf.org originals return 404). Paris
        2007 statement read in a third-party copy; Cairo 2014 chair's conclusions read through a summarizing
        tool. The amounts withheld in each episode were not found in official records.
      sources: [src-imf-2003-pa, src-wb-2004-pa, src-imf-ahlc-reports, src-paris-2007-statement, src-cairo-2014-chair, src-crs-rs22967, src-eca-2013-pegase]
      accessible: true
    basis: >
      US aid to the Palestinians was $414.5 million to $960 million a year from FY2008 to FY2015 (CRS),
      of which direct transfers to the PA totalled about $1.2 billion through 2013. EU budget support was
      EUR 2.94 billion over 2007 to 2012, EUR 939 million of it through PEGASE (European Court of Auditors).
      Arab states paid the 2001 Cairo pledge of $45 million a month in full; the 2002 Beirut pledge of $55
      million a month was about half met (IMF).

