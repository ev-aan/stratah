# israel-palestine-money: dated documents on funding, designations, sanctions and votes concerning Israel and Palestine (1993-2026)
# Opened 2026-10-07 (log L-01). Pilot scope: ten money/designation cases and the UN voting and recognition record of twelve
# countries; later passes added filed money records by channel. Gaps are recorded as coverage facts.
#
# How to read the extra fields used here (they add to, never replace, the schema fields):
#   decisions: one entry per decision about a case. `decider` is the body that acted; `evidence_published` says whether the
#     evidence behind the decision is public.
#   evidence_tier: the kind of decision on record for the case, in this order:
#     conviction > regulator_finding > designation > investigative_report > allegation.
#     A designation is a legal act; its evidence is usually not public.
#   Rule P5 (build/SCHEMA.md): timing beside money shows timing only. It does not show cause unless a source documents the
#   link. Rule P6/P11: motive is not assessed.
# ---------------------------------------------------------------------------

subject:
  id: israel-palestine-money
  title: "Israel-Palestine: dated records of money, designations, sanctions and votes (pilot, 1993 to 2026)"

headline: "Israel-Palestine money records: dated funding, designation and sanction documents, 1993-2026"
headline_claim: ipm-us-appropriation-lines-2024-2025
headline_status: draft          # draft: not yet through the publish gate
search_summary: >
  Dated documents on funding, designations, sanctions and votes concerning Israel and Palestine since 1993, with what was read and what was not.
url_slug: israel-palestine-money-trail
dig_status: pilot_draft

assessment:
  question: "What do public documents record about dated money flows, designations, sanctions and votes concerning Israel and Palestine since 1993?"
  answer: "partly"
  headline: "Partly. Documents record many dated flows and decisions; coverage differs by channel and document type, as stated below."
  text: >
    This dig records what documents state about dated money flows, designations, sanctions and votes concerning
    Israel and Palestine since 1993. It does not assess motive or effect. Each claim gives the decider or payer, date,
    amount, currency and document, and says whether the document was opened and read.
    Court and regulator records: ipm-hlf-convicted (convictions affirmed on appeal), ipm-civil-terror-finance-cases,
    ipm-irfan-canada-hamas-support and ipm-unrwa-staff-involvement. Designations and listings, each with decider and
    date: ipm-interpal-passed-money-to-hamas, ipm-samidoun-designations, ipm-ihh-designated-only-by-israel,
    ipm-six-ngos-pflp-arms and ipm-settler-sanctions-split. In several cases different bodies state different
    conclusions about the same organisation (for Interpal, the US designation and the UK Charity Commission's inquiries as
    reported to the House of Lords; for six Palestinian NGOs, Israel's designation and the statement of nine European
    governments that they had received no substantial information); the claims set the statements side by side. For most
    designations the evidence was not published (ipm-designation-evidence-gap). Funding decisions: ipm-unrwa-funding-reversals.
    UN records: ipm-unga-voting-patterns (572 roll calls; proposed, secondary anchor, see below), ipm-sc-vetoes (25 entries in the UN's list: 23 by the United
    States, one of them on an amendment, and 2 by China and Russia) and ipm-recognition-dates.
    Amounts are recorded as each government or filer states them: ipm-hamas-portfolio-estimate, ipm-iran-support-estimate
    (an estimate with no published method), ipm-qatar-gaza-payments, ipm-us-aid-to-israel, ipm-us-appropriation-lines-2024-2025,
    ipm-pa-financing-statements-2016-2023, ipm-donor-tables-west-bank-gaza-2016-2025, ipm-eu-funding-records-2024-2025,
    ipm-israel-us-media-fara, ipm-fara-receipts-read-by-eye-2026-10-16, ipm-campaign-lobbying-money,
    ipm-fec-committee-summaries-2022-2026, ipm-us-charities-idf-funding, ipm-us-charities-palestinian-side,
    ipm-uk-charity-register-selection and ipm-company-documents-lead-list-found.
    Coverage on 16 October 2026, as facts about what was read and at what depth, by channel.
    Israeli-government FARA filings (ipm-israel-us-media-fara, ipm-israel-influencer-payment-chain, ipm-fara-staff-political-donations,
    ipm-fara-payees-not-nonprofits): exhibits, amendments and supplemental statements read by eye for nine registrants, with onward-payment tables,
    influencer and exhibit detail and an extraction of staff political donations. FARA filings of principals labelled Saudi Arabia, Qatar, UAE,
    Türkiye, Iran, Egypt, Palestine, Kuwait and Jordan (ipm-fara-registrations-by-country-label, ipm-fara-receipts-read-by-eye-2026-10-16):
    register-wide counts and a pattern extraction of Item 14(a) for 153 rows; 19 statements read by eye at principal level; no
    onward-payment tables, no exhibit or contract detail and no staff-donation extraction. US charities and foundations: FIDF over twelve
    years with 3,053 funder grant entries from foundation and charity returns (ipm-us-charities-idf-funding, ipm-fidf-funders);
    settlement-related organisations and their named funders (ipm-us-charities-settlement-funding); the Palestinian-side and federation
    organisations in ipm-us-charities-palestinian-side and ipm-federations-to-israel read in several years each (data file) with no
    systematic funder drill-down. Datasets read in full by rule: OCHA FTS, OECD DAC2A, UK FCDO aid data, CORDIS, the UK Charity Commission
    extract, FEC bulk files for 87 committees selected by a written name-keyword rule plus earlier use, and award, notice and annual-report searches for 57 companies from
    one list and 191 others already in the dig. Documents read in full: US public laws of 2024-2025, World Bank reports on Palestinian
    Authority finance 2016-2023, two Commission pages, Security Council meeting records for all 25 votes. Not read: official budget or aid
    documents of Qatar, Türkiye, Iran, Egypt, Saudi Arabia and the Palestinian Ministry of Finance; UNRWA financial statements;
    ForeignAssistance.gov; Israeli and Hebrew-language registries; Dutch and German registers; FEC individual-donor receipts; defense.gov
    contract announcements (HTTP 403); 5 Foreign Military Sales notices (full lists in ipm-flows-unread-and-coverage and
    ipm-round2-unread-and-coverage). Anchor labels were corrected on 20 October 2026 (log L-27). Six claims whose primary document was not opened are held at state proposed with anchor_checked secondary: ipm-unga-voting-patterns (UN voting records not retrievable; Voeten and un-project compilations read), ipm-settlement-property-expos (news reports; the sales are private), ipm-canada-charities-revoked (Federal Court of Appeal document returned 403), ipm-israel-state-settlement-spending (Ministry of Finance returned 403; a civic mirror read), ipm-us-aid-israel-1993-2015 (official CRS host returned 403 or 404; a third-party mirror read) and ipm-gulf-turkey-iran-channels (UAE figure read in a newspaper copy; other parts by extraction). Nine claims whose figures were computed by script from an agency's own downloaded file carry anchor_checked primary, with the file named in the anchor. The files for ipm-qatar-channels-2016-2025 and ipm-turkiye-channels-2016-2025 were the OCHA FTS payer table and the OECD DAC2A extract, opened in full, with the World Bank passages for Qatar opened in the report's text layer rather than the whole report; the FARA examples and the UK register name search in those two claims are not covered by primary and are anchored in other claims or not re-anchored (stated in each anchor). For ipm-campaign-lobbying-money, hashes exist for the 2022 to 2026 FEC downloads but not for the webk20 file or the lda.gov API output (stated in its anchor). The nine are: ipm-campaign-lobbying-money, ipm-donor-tables-west-bank-gaza-2016-2025, ipm-uk-aid-west-bank-gaza-2017-2024, ipm-cordis-ec-contribution-by-country, ipm-qatar-channels-2016-2025, ipm-turkiye-channels-2016-2025, ipm-uk-charity-register-selection, ipm-fec-committee-summaries-2022-2026 and ipm-fec-schedule-e-and-contributions-2022-2026. Three claims stay established at a secondary anchor with an exception line stating why: ipm-votes-beside-money and the two company-document claims (ipm-company-documents-lead-list-found, ipm-company-documents-other-names-found; contract documents behind the awards not opened). Re-anchored to documents opened directly on 16 October 2026: ipm-crypto-seizures (Justice Department releases through its API), ipm-civil-terror-finance-cases (Second Circuit opinions) and ipm-votes-official-rollcall-tallies (official House and Senate roll-call files).
  key_points:
    - "Dated documents recorded: court rulings, government designations and sanctions, funding decisions, UN votes and filed money flows by channel."
    - "For most designations the evidence behind the decision was not published; where it was tested in public, the findings are recorded with their limits."
    - "Coverage differs by channel and document type; what was read, at what depth, and what was not read is stated in the coverage claims."
  basis: [ipm-hlf-convicted, ipm-civil-terror-finance-cases, ipm-irfan-canada-hamas-support, ipm-unrwa-staff-involvement, ipm-interpal-passed-money-to-hamas, ipm-samidoun-designations, ipm-ihh-designated-only-by-israel, ipm-six-ngos-pflp-arms, ipm-settler-sanctions-split, ipm-designation-evidence-gap, ipm-unrwa-funding-reversals, ipm-sc-vetoes, ipm-recognition-dates, ipm-hamas-portfolio-estimate, ipm-iran-support-estimate, ipm-qatar-gaza-payments, ipm-us-aid-to-israel, ipm-us-appropriation-lines-2024-2025, ipm-pa-financing-statements-2016-2023, ipm-donor-tables-west-bank-gaza-2016-2025, ipm-eu-funding-records-2024-2025, ipm-israel-us-media-fara, ipm-fara-receipts-read-by-eye-2026-10-16, ipm-campaign-lobbying-money, ipm-fec-committee-summaries-2022-2026, ipm-us-charities-idf-funding, ipm-us-charities-palestinian-side, ipm-uk-charity-register-selection, ipm-company-documents-lead-list-found, ipm-israel-influencer-payment-chain, ipm-fara-staff-political-donations, ipm-fara-payees-not-nonprofits, ipm-fara-registrations-by-country-label, ipm-fidf-funders, ipm-us-charities-settlement-funding, ipm-federations-to-israel, ipm-flows-unread-and-coverage, ipm-round2-unread-and-coverage, ipm-crypto-seizures, ipm-votes-beside-money, ipm-votes-official-rollcall-tallies, ipm-cordis-ec-contribution-by-country, ipm-qatar-channels-2016-2025, ipm-turkiye-channels-2016-2025, ipm-uk-aid-west-bank-gaza-2017-2024, ipm-uk-charity-register-selection, ipm-fec-schedule-e-and-contributions-2022-2026, ipm-company-documents-other-names-found]
  rated_claim: ipm-us-appropriation-lines-2024-2025
  would_settle: >
    Reading the documents listed as unread in ipm-flows-unread-and-coverage and ipm-round2-unread-and-coverage, and release of the
    evidence behind designations where governments hold it.

divergence_note: >
  Designations and sanctions are recorded with the decider, the date and whether the evidence behind them is public. For most, it
  is not, so the public record does not show what the evidence was. Where evidence was tested in public (the Holy Land Foundation
  trial, the Dutch government's review of UAWC, the UN's internal investigation of UNRWA staff, the UK Charity Commission's Interpal
  inquiries as reported to the House of Lords), the results are recorded as specific findings with their limits: a conviction for
  about $12.4 million to Hamas-controlled committees; personal ties between UAWC staff and the PFLP but no money flow found; nine
  UNRWA staff who "may have been involved" out of 19 investigated; and no evidence found to substantiate links to Hamas's political
  or militant activities at Interpal, as reported to the Lords.

