  - id: ipm-us-aid-to-israel
    state: established
    statement_kind: reported
    statement: >
      The Congressional Research Service (May 2025) puts total US aid to Israel at $174 billion in
      current dollars. The 2016 memorandum of understanding pledged $38 billion for fiscal years 2019 to
      2028 ($33 billion in military grants and $5 billion for missile defense), subject to yearly
      appropriation. The April 2024 supplemental law gave Israel $8.7 billion more ($3.5 billion in
      military grants, $4 billion for Iron Dome and David's Sling, $1.2 billion for Iron Beam).
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Widely reported; figures are often quoted without saying they are not inflation-adjusted. Adoption is information, not evidence."
    would_change_if: "the official CRS copy differs from the mirror; or later appropriations change the totals"
    decisions:
      - {date: 2024-04-24, decider: "US Congress and President (P.L. 118-50 Div. A)", what: "$8.7bn to Israel in three lines", sources: [src-plaw-118-50]}
    anchor:
      type: primary_text
      description: "P.L. 118-50 read on govinfo; the three lines add to $8.7 billion, matching CRS. CRS RL33222 read in a third-party mirror (official host refused), the source of the $174 billion and MOU figures."
      sources: [src-plaw-118-50, src-crs-rl33222-2025]
      accessible: true
    basis: >
      The enacted law anchors the 2024 figures directly; the cumulative and MOU figures rest on the CRS
      mirror. The same law also carried humanitarian lines partly for Gaza and barred UNRWA funding.
      Aid to Palestinians from the US, EU and Gulf states is not yet dug (ipm-palestinian-aid-gap).

