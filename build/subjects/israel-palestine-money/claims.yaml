  - id: ipm-israel-us-media-fara
    state: established
    statement_kind: reported
    statement: >
      US Justice Department FARA filings show Israel's government paying US media and content firms
      through Havas Media Germany (acting for the Israel Government Advertising Agency, LaPam) and
      directly through its Foreign Ministry. Amounts reported as received: Clock Tower X LLC (Brad
      Parscale) $15,000,000 from Oct 2025 to Mar 2026; Targeted Communications Global (an
      SKDKnickerbocker affiliate) $9,892,335.58 from Oct to Dec 2025; Show Faith by Works $2,313,791.50
      from Sep 2025 to Mar 2026; SKDKnickerbocker $150,000 from Jun to Jul 2025. Contracted but not yet
      reported as received: Clock Tower X $4,500,000 a month for Apr to Oct 2026 ($31,500,000), and
      Piro, Inc. $1,000,000 ($900,000 dated 30 Apr 2026 including $400,000 for video production with
      director, crew and on-camera talent, plus $100,000 dated 20 Jul 2026).
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Adoption is information, not evidence."
    would_change_if: "an amended filing changes the amounts; or later supplemental statements report different receipts"
    payments_onward:
      - {from: "Clock Tower X", to: "Sparkfire (direct engagement)", amount: 6500000.00, period: "Nov 2025 - Feb 2026", source: src-fara-7649-clocktowerx}
      - {from: "Clock Tower X", to: "Portman Road (media placement, consulting, polling)", amount: 4947000.00, period: "Oct 2025 - Feb 2026", source: src-fara-7649-clocktowerx}
      - {from: "Clock Tower X", to: "Salem Media (advertising)", amount: 566002.50, period: "Oct 2025 - Jan 2026", source: src-fara-7649-clocktowerx}
      - {from: "Clock Tower X", to: "Three Tech (managed content creation)", amount: 466800.00, period: "Oct - Dec 2025", source: src-fara-7649-clocktowerx}
      - {from: "Targeted Communications Global", to: "X Corp. (advertising)", amount: 1976014.31, period: "Oct 2025 - Mar 2026", source: src-fara-7553-targeted}
      - {from: "Targeted Communications Global", to: "Breakpoint Media (production)", amount: 480978.08, period: "Oct - Nov 2025", source: src-fara-7553-targeted}
      - {from: "Targeted Communications Global", to: "Breitbart News (advertising)", amount: 40000.00, period: "Nov 2025", source: src-fara-7553-targeted}
      - {from: "Targeted Communications Global", to: "Casbah Pictures (production)", amount: 25137.00, period: "Nov 2025", source: src-fara-7553-targeted}
      - {from: "Targeted Communications Global", to: "The Daily Caller (advertising)", amount: 7500.00, period: "Oct 2025", source: src-fara-7553-targeted}
    anchor:
      type: primary_text
      description: >
        FARA bulk register downloaded and filtered to Israel (314 foreign-principal rows, 1942-2026).
        Exhibits, amendments and six-month supplemental statements downloaded from efile.fara.gov and
        read. Receipt totals are the registrants' own stated totals and match the itemized lines. Clock
        Tower X disbursements total $13,061,802.50 as stated; the top payees are listed above. Targeted
        Communications disbursements total $3,584,196.40 and the itemized lines match exactly. Piro's
        figures are contract values; its first supplemental statement is not yet filed.
      sources: [src-fara-bulk-2026-10-07, src-fara-7649-clocktowerx, src-fara-7553-targeted, src-fara-7653-showfaith, src-fara-7552-skdk, src-fara-7732-piro, src-fara-7652-bridges, src-fara-7662-davis, src-fara-7234-merchanthouse]
      accessible: true
    basis: >
