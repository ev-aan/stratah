      sources: [src-uk-recognition-2025, src-ca-recognition-2025, src-es-recognition-2024, src-fr-recognition-2025, src-ie-recognition-2024, src-no-recognition-2024, src-tr-mfa-palestine, src-qatar-a-43-971, src-un-a-78-846, src-aa-regpk-2025-09-22]
      accessible: true
