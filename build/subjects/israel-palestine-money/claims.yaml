    statement: >
      The US State Department's Country Reports on Terrorism (2021, 2022 and 2023) say Iran provides
      "up to $100 million annually" in combined support to Palestinian armed groups including Hamas,
      Palestinian Islamic Jihad and the PFLP-GC. It is a US government estimate with no published
      method; the same 2023 report says there is no evidence Iran knew in advance of 7 October.
