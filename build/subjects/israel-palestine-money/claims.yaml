  - id: ipm-settler-sanctions-split
    state: established
    statement_kind: reported
    statement: >
      The US sanctioned violent settlers and settler groups under Executive Order 14115 (1 February
      2024), adding Amana, Hilltop Youth, Lehava and Hashomer Yosh among others by November 2024.
      President Trump revoked the order on 20 January 2025 without giving a reason, and on 24 January
      Treasury unblocked everyone listed under it, including a Palestinian armed group (Lions' Den).
      The UK and Canada kept their own settler sanctions, extended them to Amana (Canada June 2024,
      UK October 2024) and in June 2025 sanctioned Israeli ministers Ben-Gvir and Smotrich, whom the US
      has not sanctioned.
    evidence_tier: designation
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Less widely known than the charity cases. Adoption is information, not evidence."
    would_change_if: "an official list shows a different date, name or reinstatement"
    decisions:
      - {date: 2024-02-01, decider: "US President (E.O. 14115)", what: "settler-violence sanctions program created", evidence_published: "no per-person evidence", sources: [src-eo-14115, src-ofac-eo14115-actions]}
      - {date: 2024-02-12, decider: "UK, Foreign Secretary Cameron", what: "first settler sanctions", sources: [src-uk-settlers-2024-02]}
