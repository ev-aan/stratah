subject: israel-palestine-money
# Append-only excavation log. Corrections are new entries; earlier entries are never edited.

log:
  - id: L-01
    date: 2026-10-07
    entry: >
      Dig opened at the owner's request: a comprehensive dig on Israel and Palestine from the Arafat era
      to today, "all details, money flows, everything that can be verified". OWNER DECISIONS, in order:
      (1) follow the money first; (2) include who was behind money flowing in and out, and who was
      politically tied or influenced; (3) not only a US view: all countries, and including groups that
      fund nonprofits said to fund the fighting; (4) record not only whether something was illegal but
      who decided it, since "politics drives much of this"; (5) connect to each country's voting record;
      (6) some cases will tie into the planned Netanyahu profile; (7) the owner also raised capital flows
      into film and media, "it's a web". Scope agreed for this pilot: about ten money and designation
      cases from 1993 to today, plus the UN voting and recognition record of twelve countries (US,
      Canada, UK, France, Germany, Ireland, Norway, Spain, Qatar, Türkiye, Iran, Egypt). Deferred and
      filed as searched gaps: the influence ledger (campaign money, lobbying, FARA, university gifts),
      state media and film funding, aid to the PA and Gaza, settlement funding. For the media thread the
      owner was told it would be scoped to state budgets and filed transactions on every side, with a
      selection rule written before reading amounts, and that nationality or religion is never treated
      as a link (the "who funds Hollywood" framing is an antisemitic trope; see ipm-state-media-funding-gap).
      Checked first (standing rule): no money or voting dig existed on any branch; the oct7-warnings dig
      exists and is linked, not duplicated; the Netanyahu profile has not been started.
  - id: L-02
    date: 2026-10-07
    entry: >
      Research done in four parallel passes (charities; NGOs and UNRWA; sanctions and money; UN votes,
      vetoes and recognition), each told to open sources directly, keep quotes under 15 words, and record
      for every source whether it was read in full, through a summarizing fetch tool, or not at all.
      Blocked in this environment: the UK Charity Commission's Interpal reports (archive.org and the UK
      Government Web Archive), Israel's NBCTF list and Knesset site, state.gov's 2024 UNRWA statement,
      the official CRS host, press.un.org and the UN Digital Library voting pages. Where blocked, the
      claim says so and is held at secondary.
  - id: L-03
    date: 2026-10-07
    entry: >
      UN voting method. Selection rule written before results were seen (data/SELECTION_RULE.md): whole-
      resolution General Assembly roll calls from 1993 with Voeten's Palestinian-conflict flag or a title
      match on a fixed word list. 572 roll calls selected for 1993-2023 from Voeten version 33 (the current
      Dataverse release no longer carries vote-level data; version 33 ends 4 Jun 2024). Five data defects
      were corrected in data/analyze.py without changing the rule: blank flags before 2020, vote IDs
      reused in 2023-2024, country codes written as names in 2019, Türkiye rows unlabelled from Sep 2023
      (11 rows filled, all matching the second source), and duplicated votes. 2024-2025 counts come from
      un-project.org only (title match only, so not exactly the same rule); it agrees with Voeten on
      4,235 of 4,236 overlapping country votes. The one disagreement (Canada, A/RES/60/106, 2005) is open.
  - id: L-04
    date: 2026-10-07
    entry: >
      Heads of government are given beside every decision, as the owner asked, but almost all come from
      general knowledge, not from a source read in this pass. Each is marked [HoG not sourced]. The
      exception is the UK in January 2024, which the gov.uk page itself labels. Closing this is a
      next step before the reversal count (ipm-reversals-and-government-change) can leave `proposed`.
  - id: L-05
    date: 2026-10-07
    entry: >
      Corrections made while drafting, before any review: the State Department's Iranian-support figure is
      "up to $100 million annually", not "approximately"; Canada's General Assembly record shows no Yes
      votes from 2012 to 2018 (first draft said to 2015); Germany's 2010 IHH ban concerned a separate
      German association, not Turkey's IHH; Samidoun's designations name the PFLP, not Hamas. Not used as
      fact because only memory supported it: the sponsor of the 18 Oct 2023 Security Council draft.
  - id: L-06
    date: 2026-10-07
    entry: >
      Status: pilot draft for the owner. Not yet run through an independent review (docs/REVIEW.md). No
      review.yaml exists; the author does not write one. The subject has no taxonomy entry yet; that file
      is owner-only. Suggested entry: area Politics and Government, extra areas Current Events and
      Economics and Business; types "Is a widely shared claim true?" and "What did people know, and when?".
  - id: L-07
    date: 2026-10-07
    entry: >
      Check before hand-in (DIG_AGENT section 10). Re-opened twelve anchors directly and confirmed each
      cited figure or phrase is in the document: DOJ HLF verdict ($12.4 million); Treasury JY-0798 (more
      than $500 million); P.L. 118-50 ($1,200,000,000 for Iron Beam); E.O. 14148 Sec. 2(hhh) (revokes
      E.O. 14115); OFAC 24 Jan 2025 (E.O. 14115 removals); UN 5 Aug 2024 ("may have been involved");
      Canada SOR/2024-91 (Amana); nine-state statement, Auswärtiges Amt copy ("No substantial
      information..."; the gov.ie copy returned a short redirect page this time); Qatar MOFA ($360
      million); Treasury JS-672 (Interpal as a principal charity); P.L. 118-47 (until March 25, 2025);
      State Department CRT 2023 ("up to $100 million annually"), confirmed in the copy saved during
      research because state.gov returned a "Technical Difficulties" page on re-check. Not re-checked:
      sources read only through a summarizing tool (marked in the manifest).
  - id: L-08
    date: 2026-10-07
    entry: >
      CORRECTION. Owner's correction: Israel's government funding of film and media is documented
      fact and should be treated as such; the owner did not raise antisemitism or religion. Entry L-01
      and the first version of ipm-state-media-funding-gap added a framing about tropes and a rule about
      nationality and religion that the owner never raised. Removed from the claim: the statement now says
      the funding exists through Israel's own budgets and laws, and that what remains to dig is the
      amounts, recipients and years. L-01 is left unchanged (append-only); this entry supersedes its
      final sentences on the media thread.
  - id: L-09
    date: 2026-10-07
    entry: >
      Owner asked to follow Israel's money into US film and media, facts only, Israel only on this
      thread. Searched the FARA register (bulk data, 314 Israel rows) and read the exhibits, amendments
      and supplemental statements of the media and content registrants. Recorded as
      ipm-israel-us-media-fara (established, primary). Owner then asked how Israel funds US companies
      outside FARA; reported cases recorded as ipm-israel-non-fara-channels (contested, secondary).
      ipm-state-media-funding-gap narrowed to what remains.
  - id: L-10
    date: 2026-10-07
    entry: >
      Owner asked whether influencers are paid directly or through funds, then asked to add the answer to
      the dig. Added ipm-israel-influencer-payment-chain (established, primary) and two timeline events.
      Show Faith by Works' budget page was read as a high-resolution image because text extraction garbled
      its figures; the "Hollywood" line is a $50,000 salary line, not a production budget.
  - id: L-11
    date: 2026-10-07
    entry: >
      Owner asked to follow capital to cause through nonprofits, with no specific organizations in mind.
      Started from the money already documented: political-contribution sections of 149 FARA statements
      (ipm-fara-staff-political-donations); payees checked against IRS nonprofit data
      (ipm-fara-payees-not-nonprofits). Owner then asked about real-estate events at synagogues marketing
      property; recorded as ipm-settlement-property-expos from news reports, with the buyers' payments
      noted as private records.
  - id: L-12
    date: 2026-10-07
    entry: >
      Owner: continue the mission, capital in and out of the war and the layers of people and
      organizations; save the organizations; the goal is a large time map. Added data/ledger.yaml, a
      graph-ready record of 76 entities (governments, agencies, companies, charities, foundations, armed
      groups, committees) with registry ids (EIN, CRA BN, FARA number) and 60 dated transfers, each with
      its source. Two research passes: US charity and foundation returns (Form 990 / 990-PF), and Canadian
      charity data plus Israeli state settlement spending. Added three claims
      (ipm-us-charities-settlement-funding, ipm-canada-charities-revoked,
      ipm-israel-state-settlement-spending) and a settlement-funding lane on the timeline. Private
      individual donors are not named unless a public filing names them; donor-advised funds are recorded
      as the payer.
  - id: L-13
    date: 2026-10-07
    entry: >
      Check before push: Central Fund of Israel, Friends of Ir David and American Friends of Bet El revenue
      totals re-checked against the ProPublica organization API (IRS data); all match the research notes.
      Central Fund of Israel's fiscal year ends in January, so its figures are now labelled by the month the
      fiscal year ends.
  - id: L-14
    date: 2026-10-07
    entry: >
      OWNER DECISION: start date is the Oslo accords (1993) for now. Earlier periods (Fatah 1959, Arafat as
      PLO chairman from 1969) are out of scope until the owner extends it. Within 1993-2026 the thinnest part
      is money from 1993 to 2015: PA finances and donor aid from 1994, the IMF's 2003 review of PA accounts,
      Paris Protocol clearance revenues, and annual US aid figures.
  - id: L-15
    date: 2026-10-07
    entry: >
      Financial pass for 1993-2015 (owner approved). Two research passes: PA finances and donor aid; US aid
      to Israel, Qatar, Iran figures and civil terror-finance cases. Added 17 sources, four claims
      (ipm-pa-finances-1993-2015, ipm-us-aid-israel-1993-2015, ipm-civil-terror-finance-cases,
      ipm-qatar-gaza-2012-2014), ten timeline events and 57 ledger transfers (now 85 entities, 117
      transfers). Correction to a common figure: the $898 million Arafat-era number is the IMF's estimate of
      revenue kept outside the PA budget and invested in PA-owned companies, not a finding of personal
      theft. No US State Department report from 2004 to 2015 gives a dollar figure for Iran's funding of
      Hamas or PIJ; the Iran claim's anchor now says so.
  - id: L-16
    date: 2026-10-08
    entry: >
      Owner pointed to a reported Michael Dell donation to Friends of the IDF and asked why such donations
      were missing: "Find truth", "Find all of it". The gap was in scope selection: no pass had covered US
      charities funding the Israeli military. Added: FIDF and five other US soldier and veteran charities from
      their Form 990s; funders of FIDF from foundation and charity returns (data/fidf-funder-grants-2012-
      2025.csv, 3,053 grant entries, at least $200.2 million, 1,253 funders); gala pledges as reported pledges.
      Claims ipm-us-charities-idf-funding and ipm-fidf-funders; a military-charity lane on the timeline;
      ledger now 102 entities and 144 transfers. The Dell foundation's 2014 return (PDF) could not be read;
      ProPublica's PDF downloads return 403 to this environment.
  - id: L-17
    date: 2026-10-08
    entry: >
      Check before push: the funder total was recomputed from the CSV (paid 990-PF and Schedule I rows, exact
      duplicates removed): 3,053 rows, $200,213,009, 1,253 funders, matching the research report. Gala pages not
      fully read: Algemeiner 2018 (rate-limited), JNS 2018 (metadata only), JNS 2020 (no body).
  - id: L-18
    date: 2026-10-08
    entry: >
      Owner: "Continue through the list." Three research passes run in parallel: (1) Israel Bonds and US arms
      sales; (2) US charities on the Palestinian side and Jewish federation money to Israel; (3) campaign and
      lobbying money on all sides, and Gulf, Turkish and Iranian channels. Their rows are kept whole in four
      data files (israel-bonds-and-us-arms-sales.csv, charities-palestinian-side-and-federations.csv,
      campaign-lobbying-gulf-turkey-iran.csv, sipri-israel-arms-imports-1993-2025.csv), each row with its own
      source and read status. Added 16 sources, six claims, eight timeline events and the key transfers to the
      ledger. Known limits are recorded on each claim; the largest are that charity returns report by region,
      not Gaza or West Bank, and that Saudi, UAE and Turkish FARA receipts were not compiled.
  - id: L-19
    date: 2026-10-09
    entry: >
      Owner approved four more passes: sponsored congressional trips, member votes beside FEC money, the UN
      OCHA aid database, and the UN business database with fund exclusions. Added data folders trips/,
      votes-money/ (with a vote selection rule written before results), ocha-fts/ (flows compressed) and
      un-business-database/; 7 sources; claims ipm-congress-sponsored-trips, ipm-votes-beside-money,
      ipm-ocha-humanitarian-funding, ipm-un-settlement-business-list; five timeline events; ledger additions.
      Members of Congress are named as public officials in their own disclosures. The votes-and-money claim
      makes no inducement claim (P5, P9). Gaps: trips before 2019 (House) and 2022 (Senate) not online; 28 of
      34 votes not checked against official XML; the 2026 UN business update (A/HRC/63/20) not opened.
  - id: L-20
    date: 2026-10-16
    entry: >
      CORRECTIONS after the independent review of tip 0060974 (the review file is not in the repository; its findings are
      restated here). Earlier entries are unchanged. (1) ipm-ihh-designated-only-by-israel is an absence result: now
      marked absence_anchor, state proposed, confidence provisional, weight 2. The Ynet article of 7 Jul 2008 was opened and
      read in full on 16 Oct 2026: it names Barak, a ban on 36 funds, and Interpal, the Holy Land Foundation and the World
      Assembly of Muslim Youth as earlier bans; it does not name IHH or Turkey and gives no order date. The claim no longer
