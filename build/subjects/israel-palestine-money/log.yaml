      NBCTF site was opened (Hebrew page) but its list file could not be retrieved. The timeline entries that repeated the
      earlier wording were corrected. (2) ipm-sc-vetoes: the 22 Dec 2023 item is a vote on a Russian oral amendment, not a
      draft resolution (S/PV.9520: amendment 10-1-4, US against; the draft, S/2023/1029, was then adopted as resolution
      2720, 13-0-2). The 18 Apr 2024 US veto of the draft on Palestine's UN admission (S/2024/312, S/PV.9609, 12-1-2) was
      missing from data/sc-vetoes-1993-2025.json and has been added; all 25 meeting records were downloaded from
      documents.un.org, hashed, and each result and Against list read (data/sc-vetoes-meeting-records.csv). Counts:
      25 entries in the UN list, 23 US (22 drafts and one amendment), 2 China and Russia; drafts only: 24, of which
      22 US. The claim and the assessment text were reworded and the claim is now anchored on the records (primary). (3) The
      three gap claims that said threads were "not yet dug" (ipm-influence-ledger-gap, ipm-palestinian-aid-gap,
      ipm-settlement-funding-gap) were rewritten to list what has since been read and what remains. (4) Wording fixes:
      Canada's UN votes (Yes outnumbered No through 2007, 7 to 7 in 2008, No outnumbered Yes from 2009 to 2023, Yes
      outnumbered No in 2024 and 2025); Interpal "as reported to the Lords"; LaPam appears in the Bridges Partners filing
