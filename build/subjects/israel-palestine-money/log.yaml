      proposed with withdrawn: true and a reason; the documented actions it was built from remain as plain claims. Timeline: the FARA lane now lists the 19
      statements read by eye for all labels (Saudi Arabia, UAE, Qatar, Türkiye, Palestine) beside the earlier Israel entries; one news
