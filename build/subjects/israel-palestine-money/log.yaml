      country is listed (this adds United States Department of State, the Commission's Humanitarian Aid and Civil Protection
      Department, and the Red Crescent and charity labels); ranking sentences were removed; the UNRWA-payee figures cover all listed
      labels; FTS figures are dated: a later re-query returned $4,416,441,526 for 2025 against $4,439,168,803 in the downloaded file
      (the difference was not investigated). FEC: the group A and B totals were removed (per-committee rows only); the selection
      statement now says 71 name-keyword, 1 connected-organisation keyword and 15 added by earlier use; a re-count finds 86 of 87
