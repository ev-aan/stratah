      variants listed; the assessment key point on reversals now says eight of the ten come from one episode; the
      assessment now lists the claims held at a secondary anchor and states coverage by channel.
  - id: L-21
    date: 2026-10-16
    entry: >
      Documented-flows pass, same rules for every channel (data/PARTB_SELECTION_RULES.md; rows in
      data/documented-flows-2026-10-16.csv with payer, payee, amount, currency, year, document, document date, source id and
