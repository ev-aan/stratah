timeline:
  id: israel-palestine-money
  title: "Israel-Palestine money trail: designations, funding, sanctions and UN votes (1993 to 2026, pilot)"
  as_of: "2026-10-07"
  note: >
    Times are UTC; every event here is known to the day or month only, so dots are drawn at noon on
    the day. "Single" means one source was read for the event; "reported" means two or more agree.
    Each event's detail names who decided and who was head of government (from general knowledge
    unless marked otherwise). A dot beside a change of government shows timing only, not cause
    (rule P5). Panel C enlarges October 2023 to October 2026, when most of the funding and sanctions
    reversals happened.
panels:
  - id: years
    title: "Panel A: 1993 to 2016 (one tick per three years)"
    start: "1993-01-01T00:00:00Z"
    end:   "2016-12-31T00:00:00Z"
    tick_years: 3
    lanes: [charities, money, un]
  - id: middle
    title: "Panel B: 2017 to September 2023 (one tick per year)"
    start: "2017-01-01T00:00:00Z"
    end:   "2023-09-30T00:00:00Z"
    tick_years: 1
    lanes: [charities, ngos, money, settle, military, arms]
  - id: recent
    title: "Panel C: October 2023 to October 2026 (one tick per year)"
    start: "2023-10-01T00:00:00Z"
    end:   "2026-10-15T00:00:00Z"
    tick_years: 1
    lanes: [charities, ngos, money, media, settle, military, arms, politics, sanctions, un]
lanes:
  charities: {label: "Charities: designations and courts"}
  ngos:      {label: "NGOs and UNRWA"}
  money:     {label: "Aid, grants and seizures"}
  media:     {label: "Israel: payments to US media firms (FARA)"}
  settle:    {label: "Settlement funding: charities, foundations, state"}
  military:  {label: "US charities for Israeli soldiers (FIDF and others)"}
  arms:      {label: "Israel Bonds and US arms sales"}
  politics:  {label: "Campaign money, lobbying, other charities"}
  sanctions: {label: "Settler sanctions"}
  un:        {label: "UN votes and recognition"}
people:
  - {who: "Benny Gantz", detail: "Israeli Defense Minister; signed the 2021 designations of Samidoun and the six NGOs (NBCTF)."}
  - {who: "Ehud Barak", detail: "Israeli Defense Minister; reported as signing the 2008 order against 36 Union of Good funds, including IHH (Ynet; ITIC)."}
  - {who: "Benjamin Netanyahu", detail: "Israeli Prime Minister; defended allowing Qatari cash into Gaza in Nov 2018 (AFP report). A profile is planned as a separate dig."}
  - {who: "Philippe Lazzarini", detail: "UNRWA Commissioner-General; announced the dismissals of staff named by Israel in Jan 2024 (UN statement)."}
  - {who: "Catherine Colonna", detail: "Led the independent review of UNRWA's neutrality, reported 20 Apr 2024."}
  - {who: "David Cameron; David Lammy", detail: "UK Foreign Secretaries who announced settler sanctions (Feb and May 2024; Oct 2024) and, for Lammy, the restoration of UNRWA funding (Jul 2024)."}
  - {who: "Ahmed Hussen", detail: "Canadian minister who paused (26 Jan 2024) and resumed (8 Mar 2024) UNRWA funding."}
