events:
  # ---------------- Panel A: 1993 to Sep 2023 ----------------
  - {id: a01, panel: years, lane: un, time: "1995-05-17T12:00:00Z", precision: day, kind: official, status: single, sources: [src-dppa-vetoes],
     label: "17 May 1995: first US veto in this period (S/1995/394)",
     detail: "The first of 23 US vetoes on Israel-Palestine drafts from 1993 to Sep 2025, cast under presidents of both parties (President: Bill Clinton, Democrat [HoG not sourced])."}
  - {id: a02, panel: years, lane: charities, time: "1997-05-06T12:00:00Z", precision: day, kind: official, status: single, sources: [src-opensanctions-il-mod],
     label: "6 May 1997: Israel declares HLF and Interpal unauthorized associations",
     detail: "Date from the OpenSanctions copy of Israel's list; the original was not opened (PM: Netanyahu, Likud [HoG not sourced])."}
  - {id: a03, panel: years, lane: charities, time: "2001-12-04T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-treasury-po841-2001, src-whitehouse-2001-12-04],
     label: "4 Dec 2001: US designates the Holy Land Foundation (SDGT)",
     detail: "Treasury OFAC; part of the record classified (President: George W. Bush, Republican [HoG not sourced])."}
  - {id: a04, panel: years, lane: charities, time: "2003-08-22T12:00:00Z", precision: day, kind: official, status: single, sources: [src-treasury-js672-2003],
     label: "22 Aug 2003: US designates Interpal (SDGT)",
     detail: "Treasury cites 'reporting'; no evidence published (Bush [HoG not sourced])."}
  - {id: a05, panel: years, lane: charities, time: "2003-09-24T12:00:00Z", precision: day, kind: official, status: single, sources: [src-hansard-lords-2003-10-06],
     label: "24 Sep 2003: UK Charity Commission closes its Interpal inquiry",
     detail: "A minister told the Lords it found no evidence to substantiate Hamas links; the report itself was blocked (PM: Tony Blair, Labour [HoG not sourced])."}
  - {id: a06, panel: years, lane: charities, time: "2004-12-30T12:00:00Z", precision: day, kind: official, status: single, sources: [src-opensanctions-il-mod],
     label: "30 Dec 2004: Israel declares IRFAN-Canada an unauthorized association",
     detail: "From the OpenSanctions copy of Israel's list (PM: Ariel Sharon, Likud [HoG not sourced])."}
  - {id: a07, panel: years, lane: charities, time: "2008-05-26T12:00:00Z", precision: day, kind: official, status: disputed, sources: [src-opensanctions-il-mod, src-ynet-union-of-good-2008],
     alt_time: "2008-07-07T12:00:00Z", alt_note: "Ynet reported the order on 7 Jul 2008; the list copy dates it 26 May.",
     label: "May-Jul 2008: Israel outlaws 36 Union of Good funds, including IHH and (reported) Interpal",
     detail: "Defense Minister Ehud Barak (as reported). Israel is the only government found to have designated Turkey's IHH (PM: Ehud Olmert, Kadima [HoG not sourced])."}
  - {id: a08, panel: years, lane: charities, time: "2008-11-24T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-doj-hlf-2008, src-el-mezain-2011],
     label: "24 Nov 2008: jury convicts the Holy Land Foundation and five leaders",
     detail: "About $12.4 million to Hamas-controlled zakat committees (DOJ). Retrial after a 2007 mistrial."}
  - {id: a09, panel: years, lane: charities, time: "2009-02-27T12:00:00Z", precision: day, kind: official, status: single, sources: [src-csn-interpal-2009],
     label: "27 Feb 2009: UK Charity Commission's second Interpal report",
     detail: "Per an NGO summary only: insufficient evidence partners promoted terrorism; told to leave the Union of Good (PM: Gordon Brown, Labour [HoG not sourced])."}
  - {id: a10, panel: years, lane: charities, time: "2010-06-23T12:00:00Z", precision: day, kind: official, status: single, sources: [src-bverwg-ihh-2012],
     label: "23 Jun 2010: Germany bans IHH e.V. (a separate German association)",
     detail: "Upheld by the Federal Administrative Court on 18 Apr 2012 (Chancellor: Angela Merkel, CDU [HoG not sourced])."}
  - {id: a11, panel: years, lane: charities, time: "2011-04-09T12:00:00Z", precision: day, kind: official, status: single, sources: [src-cra-irfan],
     label: "9 Apr 2011: Canada revokes IRFAN-Canada's charity status",
     detail: "CRA cites about $14.6 million to Hamas-linked partners (PM: Stephen Harper, Conservative [HoG not sourced])."}
  - {id: a12, panel: years, lane: charities, time: "2011-12-07T12:00:00Z", precision: day, kind: document, status: single, sources: [src-el-mezain-2011],
     label: "7 Dec 2011: Fifth Circuit affirms the HLF convictions",
     detail: "The court accepted that none of the zakat committees had been designated (President: Barack Obama, Democrat [HoG not sourced])."}
  - {id: a13, panel: years, lane: un, time: "2012-11-29T12:00:00Z", precision: day, kind: data, status: reported, sources: [src-unproject-votes, src-voeten-unvotes-v33],
     label: "29 Nov 2012: UN gives Palestine observer-State status, 138-9-41",
     detail: "US and Canada No; UK and Germany abstain; France, Ireland, Norway, Spain, Qatar, Türkiye, Iran, Egypt Yes."}
  - {id: a14, panel: years, lane: un, time: "2012-01-01T00:00:00Z", end: "2018-12-31T23:59:00Z", precision: range, kind: data, status: single, sources: [src-voeten-unvotes-v33],
     label: "2012-2018: Canada casts no Yes vote on Palestine-related UN resolutions",
     detail: "Our count under a written selection rule. The pattern began under Harper (Conservative) and continued for years under Trudeau (Liberal) [HoG not sourced]."}
  - {id: a15, panel: years, lane: charities, time: "2014-04-24T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-gazette-sor-2014-97, src-cra-irfan],
     label: "24 Apr 2014: Canada lists IRFAN-Canada as a terrorist entity",
     detail: "No evidence published; kept at the 2024 review under a Liberal government (Harper [HoG not sourced])."}
  - {id: a16, panel: years, lane: money, time: "2016-07-01T00:00:00Z", precision: year, kind: document, status: single, sources: [src-crs-rl33222-2025],
     label: "2016: US-Israel MOU pledges $38 billion for FY2019-2028",
     detail: "$33bn military grants + $5bn missile defense, subject to appropriation (CRS, read in a mirror)."}
