# kind: data = machine-recorded; official = government or institutional statement or finding; witness = a person's account; media = a news outlet's own report; document = a published document; analysis = a scholar's account.
# status: reported = 2+ independent sources agree; single = one source (or several that trace to one); disputed = sources or parties differ; inferred = our inference.
# date_basis: stated | derived (a time-zone conversion or "after X" by us) | publication_proxy | inferred | dataset_field.
events:

  # ---------------- Panel A: before 7 October 2023 ----------------
  - {id: a01, panel: before, lane: plans, time: "2018-07-01T00:00:00Z", precision: year, date_basis: stated, kind: official, status: reported, sources: [s_cnn_shabak, s_npr_shabak],
     label: "2018: first version of Hamas's invasion plan known to the Shin Bet",
     detail: "The Shin Bet's published summary (4 Mar 2025, via CNN and NPR) says it knew two iterations, in 2018 and 2022, and did not take them seriously. Drawn at mid-year; only the year is stated."}
  - {id: a02, panel: before, lane: plans, time: "2022-07-27T12:00:00Z", precision: day, date_basis: stated, kind: official, status: single, sources: [s_ynet_idf],
     label: "27 Jul 2022: General Staff meeting orders preparations based on Jericho Wall; 'no action was taken'",
     detail: "Ynet's account of the IDF's published findings (27 Feb 2025): a classified General Staff meeting on 27 July 2022 at which a senior officer ordered preparations for war based on the plan. Time of day not stated."}
  - {id: a03, panel: before, lane: plans, time: "2022-10-01T00:00:00Z", precision: year, date_basis: stated, kind: official, status: reported, sources: [s_cnn_shabak, s_kiro7, s_mee_jw],
     label: "2022: second version of the plan; the New York Times says the 40-page 'Jericho Wall' document was obtained over a year before 7 Oct",
     detail: "Shin Bet summary (via CNN): a 2022 iteration. New York Times, 30 Nov 2023 (via KIRO 7 and MEE): a 40-page document with no set date; the Times could not determine whether the prime minister saw it. Drawn at late 2022 as an approximation of 'more than a year before'; the Times piece was not reached."}
  - {id: a04, panel: before, lane: intel_units, time: "2023-07-06T12:00:00Z", precision: day, date_basis: stated, kind: document, status: single, sources: [s_nbc_analysts, s_ctc],
     label: "6 Jul 2023: a signals-intelligence analyst emails that a Hamas exercise matches the Jericho Wall plan; replies call it 'imaginary'",
     detail: "NBC (1 Dec 2023): 'In an email on July 6'; the reply came six days later; confirmed by one anonymous senior Israeli official; first reported by Channel 12 and the Financial Times. One set of emails, not published. The analyst is not named."}
  - {id: a05, panel: before, lane: intel_units, time: "2023-07-15T12:00:00Z", precision: month, date_basis: publication_proxy, kind: witness, status: reported, sources: [s_ynet_meta, s_abc_spotters, s_ctc],
     label: "Months before 7 Oct: border observers report unusual activity (drills, holes, explosives)",
     detail: "A former observer to ABC (28 Jun 2024), CTC Sentinel, and an expert committee's review (Ynet, 10 Nov 2025): the observers' intelligence could have exposed the activity had it been analysed. The bar is a placeholder at July; the sources give no start date."}
  - {id: a06, panel: before, lane: leadership, time: "2023-04-15T12:00:00Z", precision: month, date_basis: stated, kind: official, status: single, sources: [s_ynet_bar],
     label: "Apr 2023: Bar says he recommended 'a focused, forceful move' to halt the erosion of deterrence",
     detail: "From Bar's April 2025 affidavit to the High Court as described by Ynet (29 Sep 2026); the affidavit was not opened. A general strategic recommendation, not a warning of 7 October."}
  - {id: a07, panel: before, lane: leadership, time: "2023-07-31T12:00:00Z", precision: day, date_basis: stated, kind: official, status: single, sources: [s_ynet_55],
     label: "31 Jul 2023: Bar tells the PM of a sharp rise in daily threat warnings; the PM: 'You need to hit them hard'",
     detail: "From excerpts the PM published (Ynet, 6 Feb 2026). A selected excerpt; the full transcript is not public. Bar later said a covert message was being prepared for Hamas's leader."}
  - {id: a08, panel: before, lane: leadership, time: "2023-07-15T12:00:00Z", precision: month, date_basis: stated, kind: official, status: disputed, sources: [s_ynet_bar],
     label: "Jul 2023: Bar's 'warning of war' to the PM before the judicial-overhaul vote (general; no date, no place)",
     detail: "Ynet (29 Sep 2026): Bar's affidavit backs reporting that in July 2023 he told the PM he was delivering a 'warning of war' with neither a specific date nor time. The PMO says the PM received no warning of 'a war in Gaza'."}
  - {id: a09, panel: before, lane: outside, time: "2023-09-15T12:00:00Z", precision: day, date_basis: stated, kind: media, status: disputed, sources: [s_ynet_book, s_yahoo_wapo],
     label: "15 Sep 2023 (per the book): Hamas leader's 'earthquake' message reaches the Shin Bet; the book says the Shin Bet chief passed it to the PM",
     detail: "The book's author (Ynet, 8 Sep 2026) gives the date. A former Palestinian official says he passed the message to Shin Bet officials and to an adviser to the UAE president, and that the intermediaries did not know whether, how or when Hamas would act (Washington Post). The PMO's denials do not address this message."}
  - {id: a10, panel: before, lane: leadership, time: "2023-09-21T12:00:00Z", precision: day, date_basis: stated, kind: official, status: single, sources: [s_ynet_55],
     label: "21 Sep 2023: security assessment; Bar: Hamas not interested in another round; the PM: Hamas's terms 'delusional'",
     detail: "From the PM's published excerpts (Ynet, 6 Feb 2026). Selected; not the full transcript."}
  - {id: a11, panel: before, lane: outside, time: "2023-09-25T12:00:00Z", precision: range, end: "2023-09-27T12:00:00Z", date_basis: inferred, kind: media, status: disputed, sources: [s_haaretz_nyt, s_ynet_book],
     label: "About 23 to 27 Sep 2023 (disputed): reported 45-minute call from the UAE president to the PM",
     detail: "Haaretz: 'a week and a half before' 7 Oct; Anadolu, summarising Haaretz: 23 Sep 2023; the New York Times: 'late September' (via Middle East Monitor). The PMO says no call took place and a call-log review found no trace. Anonymous or unpublished sources on one side, a denial on the other. See claims o7w-uae-call and log L-12."}
  - {id: a12, panel: before, lane: outside, time: "2023-09-26T12:00:00Z", precision: day, date_basis: stated, kind: media, status: disputed, sources: [s_ynet_egypt, s_haaretz_egypt, s_aj_warnings],
     label: "26 Sep 2023: reported visit of Egypt's intelligence chief to Israel, 67 minutes on the ground",
     detail: "The Atlantic (26 Sep 2026, via Ynet and Haaretz), citing officials from several countries and flight records it says are in the Israel Airports Authority logs; no one has said whom he met. Israel's then national security adviser denies any visit. Egypt has not commented (Al Jazeera, 30 Sep 2026). The same day Israel marked 50 years since the 1973 war."}
  - {id: a13, panel: before, lane: leadership, time: "2023-10-01T12:00:00Z", precision: day, date_basis: stated, kind: official, status: reported, sources: [s_ynet_bar, s_abc_au, s_jp_909744],
     label: "1 Oct 2023: PM convenes Gaza security assessment: 'calm' line; no mention of a foreign warning (per the NYT's reading of minutes)",
     detail: "Ynet (29 Sep 2026): his own released excerpts and the PMO summary (humanitarian easing; 'operational readiness for the targeted killings that were recommended'); the full transcript is not public. The New York Times, via ABC and the Jerusalem Post: he said the goal was to maintain calm and that action in Gaza might harm a Saudi deal. Bar's remarks omitted from the excerpts are reported by Ynet's own investigation."}
  - {id: a14, panel: before, lane: leadership, time: "2023-10-03T12:00:00Z", precision: day, date_basis: stated, kind: document, status: single, sources: [s_ynet_55, s_ynet_bar],
     label: "3 Oct 2023: military-intelligence and Shin Bet assessments: Hamas building strength slowly; calm for relief",
     detail: "Excerpts the PM published (Ynet, 6 Feb 2026) and a Shin Bet report of the same date (Ynet, 29 Sep 2026). Neither mentions a Hamas-initiated offensive, per Ynet."}
  - {id: a15, panel: before, lane: outside, time: "2023-10-05T12:00:00Z", precision: day, date_basis: stated, kind: media, status: single, sources: [s_ynet_egypt],
     label: "5 Oct 2023: reported further Egyptian message that the situation was unsustainable (no date or method)",
     detail: "The Atlantic via Ynet (26 Sep 2026), citing US, Egyptian and Israeli officials. Anonymous; the original was not reached. A CIA internal assessment of the same date is reported to have discussed escalation, not the ground assault."}

  # ---------------- Panel B: the night of 6 to 7 October 2023 (UTC) ----------------
  - {id: b01, panel: night, lane: idf, time: "2023-10-06T20:00:00Z", precision: approx, date_basis: derived, kind: official, status: single, sources: [s_ynet_bar],
     label: "About 23:00 Israel time (20:00 UTC): army officials told of unusual activity",
     detail: "Bar's April 2025 affidavit as described by Ynet: 'at around 11 p.m. on Oct. 6'. Converted to UTC by us."}
  - {id: b02, panel: night, lane: shin_bet, time: "2023-10-06T22:00:00Z", precision: approx, date_basis: derived, kind: official, status: single, sources: [s_npr_shabak],
     label: "01:00 Israel time: Shin Bet reports Hamas emergency preparedness, with signs of restraint",
     detail: "NPR on the Shin Bet summary: at 1 a.m. the agency reported Hamas conducting emergency preparedness while assessing it was not interested in escalation."}
  - {id: b03, panel: night, lane: shin_bet, time: "2023-10-07T00:03:00Z", precision: exact, date_basis: derived, kind: official, status: reported, sources: [s_npr_shabak, s_jp_shabak, s_ynet_bar],
     label: "03:03 Israel time: Shin Bet alert on SIM-card activity to the IDF, the police and the National Security Council",
     detail: "Shin Bet summary via NPR, Jerusalem Post and Ynet (on the affidavit): 'unusual preparations and the possibility of offensive intentions by Hamas'; the warning level assigned was wrong by Bar's own account. Whether and how the National Security Council passed it on is not public."}
  - {id: b04, panel: night, lane: idf, time: "2023-10-07T01:00:00Z", precision: approx, date_basis: derived, kind: media, status: single, sources: [s_ctc],
     label: "About 04:00 Israel time: situational assessment including the chief of staff",
     detail: "CTC Sentinel, summarising Israeli reports: 'at least one of which included IDF Chief of Staff LTG Herzi Halevi at 4 a.m.'"}
  - {id: b05, panel: night, lane: shin_bet, time: "2023-10-07T01:30:00Z", precision: exact, date_basis: derived, kind: official, status: single, sources: [s_npr_shabak],
     label: "04:30 Israel time: Shin Bet chief briefs deputies; a small team is sent south",
     detail: "NPR on the Shin Bet summary. The team was too small to stop the attack."}
  - {id: b06, panel: night, lane: shin_bet, time: "2023-10-07T02:15:00Z", precision: exact, date_basis: derived, kind: official, status: disputed, sources: [s_ynet_55, s_ynet_bar],
     label: "05:15 Israel time: Shin Bet situation assessment completed; Bar says he told officials to update the PM's military secretary",
