# Timeline data for the 7 October warnings dig. YAML is the source of truth; the diagram is generated
# by build/tools/render_timeline.py. Nothing here is a finding: every item is a REPORTED fact with its
# sources and a status, and the discrepancies are shown, not resolved. Official statements are shown beside material evidence.
timeline:
  id: oct7-warnings
  title: "Warnings before 7 October 2023 and what the prime minister knew: who reported what, and when"
  as_of: "2026-10-04"
  note: >
    Live story, as of 2026-10-04. Reports are being revised and denied. All clock times are UTC unless a note says otherwise;
    Israel was on summer time (UTC+3) on 6 to 7 October 2023, so 06:29 in Israel is 03:29 UTC (derived). Dates of reports are the outlet's publication date; where a source gives only a month or year, the event is drawn as a month or year.
    Named people are officials named in the cited reports and records, or journalists named as authors; no victim, hostage, minor or private individual is named.
    Each event states how its time was arrived at (date_basis). An accusation on this chart is an accusation, not a finding. Events marked inferred are placed by us at a midpoint (day precision at 12:00 UTC).

panels:
  - id: before
    title: "Panel A: signs and warnings before 7 October 2023 (years and months, UTC)"
    start: "2018-01-01T00:00:00Z"
    end: "2023-10-20T00:00:00Z"
    tick_years: 1
    lanes: [plans, intel_units, outside, leadership]
  - id: night
    title: "Panel B: the night of 6 to 7 October 2023 (UTC; Israel time is UTC+3)"
    start: "2023-10-06T18:00:00Z"
    end: "2023-10-07T08:00:00Z"
    tick_minutes: 60
    axes: [{label: "Israel time (UTC+3)", offset_hours: 3}]
    lanes: [shin_bet, idf, pm_office]
  - id: after
    title: "Panel C: reports, investigations and court steps, October 2023 to August 2026"
    start: "2023-10-01T00:00:00Z"
    end: "2026-08-28T00:00:00Z"
    tick_years: 1
    lanes: [reports, official_probes, courts_comptroller, pm_statements]
  - id: late
    title: "Panel D: the September 2026 reports and replies (days, UTC)"
    start: "2026-08-29T00:00:00Z"
    end: "2026-10-06T00:00:00Z"
    tick_hours: 72
    lanes: [news_reports, pmo_and_pm, other_governments, opponents_and_courts]

lanes:
  plans:               {label: "Hamas plan held by Israeli bodies"}
  intel_units:         {label: "Intelligence units and observers"}
  outside:             {label: "Warnings from outside Israel (reported)"}
  leadership:          {label: "Prime minister's meetings and records"}
  shin_bet:            {label: "Shin Bet"}
  idf:                 {label: "Army"}
  pm_office:           {label: "Prime minister's office"}
  reports:             {label: "Reports and findings"}
  official_probes:     {label: "IDF, Shin Bet and expert probes"}
  courts_comptroller:  {label: "State Comptroller and High Court"}
  pm_statements:       {label: "Prime minister's own statements"}
  news_reports:        {label: "Newspaper reports"}
  pmo_and_pm:          {label: "Prime Minister's Office and the PM"}
  other_governments:   {label: "UAE and Egyptian governments"}
  opponents_and_courts: {label: "Opponents, the Shin Bet chief and the courts"}

people:
  - {who: "Benjamin Netanyahu", detail: "Israel's prime minister; the subject of the claims. Every accusation about what he knew is a claim; he denies receiving any warning from the UAE or Egypt and says the security chiefs did not wake him."}
  - {who: "Ronen Bar", detail: "Then head of the Shin Bet. Says he warned the prime minister in general terms in 2023 and has said he will sue for defamation; the PMO says he knew of 'a real danger' on the night before and did not alert the PM. Accepted responsibility for the Shin Bet's failure on the night (Ynet)."}
  - {who: "Herzi Halevi", detail: "Then chief of staff. Said, per the book's account and Ynet, that he was not told of any UAE warning."}
  - {who: "Tzachi Hanegbi", detail: "Then head of the National Security Council. Called the 2023 reports of an Egyptian warning 'utterly fake'; denied to The Atlantic (Sept 2026) any visit or warning."}
  - {who: "Abbas Kamel", detail: "Then head of Egypt's General Intelligence Service. Reported to have visited Israel on 26 Sep 2023 and to have telephoned the prime minister; Egypt has not commented in 2026."}
  - {who: "Mohamed bin Zayed", detail: "UAE president. Reported to have telephoned the prime minister; his government's ministry declined to deny it."}
  - {who: "Avi Gil", detail: "The prime minister's military secretary on 7 Oct 2023; named in the PM's own account as the person who messaged him at 06:29 Israel time."}
  - {who: "Matanyahu Englman", detail: "State Comptroller; his core October 7 audits are suspended by a High Court order."}
  - {who: "Gadi Eisenkot, Naftali Bennett, Yair Lapid", detail: "Opposition figures quoted on the record; their statements are accusations by political rivals."}
  - {who: "Haaretz", detail: "Newspaper; published the 8 Sep 2026 investigation excerpted from a book by two of its journalists, 'Hostages: 843 Days of Abandonment'."}
  - {who: "Israel's Prime Minister's Office", detail: "Issues denials and releases excerpts; a party to the dispute."}

