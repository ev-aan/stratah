# Sources for the 7 October warnings dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# LIVE STORY, as of 2026-10-04. Every source below was opened and read by the author on 2026-10-04 (HTML fetched and its text read) unless its `read:` line says otherwise.
# Copied wire reports and syndicated copies count once. Reports that all trace to one underlying outlet (for example summaries of The Atlantic, The Wall Street Journal,
# The New York Times or Haaretz) are one origin each; they are adoption of that report, never corroboration.
# Only four short official texts are stored under sources/ (one or two sentences per quotation). Everything else is cited by URL.
# NOT REACHED (HTTP 403, paywall or script block) from this environment: The Atlantic (original), The Wall Street Journal (original), The New York Times (all pieces), the full Haaretz
# investigation of 8 Sep 2026 (headline and standfirst only), Times of Israel (all pages, 403), Israel Hayom (403), gov.il and shabak.gov.il (Cloudflare block), the IDF "October 7 inquiries" pages
# (Incapsula block), the Shin Bet's own published summary (read only through reports), the IDF's own published findings (read only through reports), the text of the High Court orders,
# Netanyahu's 55-page answers to the State Comptroller (read only through two Ynet reports), Ronen Bar's April 2025 affidavit (read only through Ynet), the Egyptian State Information Service
# or any other Egyptian official text of October 2023 (not located), France 24 and the Library of Congress pieces on the inquiry bill, The National, Channel 12 and Channel 14 broadcasts.
retrieved: 2026-10-04
sources:

