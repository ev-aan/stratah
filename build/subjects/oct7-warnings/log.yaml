  - id: L-06
    date: 2026-10-04
    entry: >
      ELECTION CONTEXT, recorded as context and not as evidence. The Israeli election is set for 27 October 2026. Reports of the UAE and Egyptian warnings appeared in the five weeks before it (Haaretz on 8 Sep; New York Times on 25 Sep; The Atlantic and PMO reply on 26 Sep; Wall Street Journal on 27 Sep). The Prime Minister's Office and his party call them an election-season smear by "left-wing" media; opposition leaders call for an inquiry.
      Timing is a reason for care in weighing anonymous leaks; it is not evidence that any report is false or true. The same applies to the prime minister's own releases of excerpts (6 Feb, 28 Sep).
  - id: L-07
    date: 2026-10-04
    entry: >
      FACT LEDGER, 2023 reporting (what was reported when; later changes are new entries). 9 Oct 2023: Yedioth Ahronoth reported that Egypt's intelligence chief spoke with the prime minister before the attack (via Haaretz 26 Sep 2026 and Ynet 8 Sep 2026); the PMO said the PM "has neither spoken, nor met, with the head of Egyptian intelligence since the formation of the government, neither directly nor indirectly" (via Ynet 26 Sep 2026).
      An Egyptian intelligence official told the Associated Press that Israel ignored warnings of "something big" (via Ynet and CTC Sentinel; the AP piece was not read). 11 Oct 2023: a US House committee chairman said "We do know the Egyptian intelligence did refer this to Israel" (Fox News, 12 Oct 2023); the Financial Times reported unnamed officials calling it a "general warning" (via CTC). 13 Oct 2023: Israel's national security adviser called the reports "utterly fake" (Haaretz headline).
      30 Nov to 1 Dec 2023: the New York Times reported the 40-page Jericho Wall document, said it set no date, and could not determine whether the PM saw it (via KIRO 7, MEE); NBC reported the July 2023 analyst emails (read); a US official told NBC the US intelligence community appears not to have received the document. 28 Jun 2024: ABC reported observers' accounts (read).
  - id: L-08
    date: 2026-10-04
    entry: >
      FACT LEDGER, official investigations. 27 Feb 2025: the IDF published four General Staff investigations (read through Ynet and JTA). 4 Mar 2025: the Shin Bet published a summary of its investigation (read through CNN, NPR, Jerusalem Post); the PMO responded that "On the night of the attack, the Shin Bet chief did not see fit to wake the Prime Minister" (NPR). April 2025: Bar's affidavit to the High Court (through Ynet).
      10 Nov 2025: the IDF chief presented an external committee's review of 25 internal probes (Ynet). 11 Nov 2025 and 6 Jan 2026: State Comptroller press releases (read, stored). 5 Feb 2026: the PM published 55 pages of answers (Ynet, 5 and 6 Feb). 10 May 2026: five-justice High Court hearing on the Comptroller's authority (Jerusalem Post). 23 Sep 2026: High Court deferred the commission petitions (JFeed; Haaretz; Jerusalem Post).
  - id: L-09
    date: 2026-10-04
    entry: >
      DISCREPANCY TO RESOLVE (not evidence of anything): the date of the High Court's interim order freezing eight core State Comptroller audits. The Comptroller's own press release of 6 Jan 2026 says "December 29, 2025"; the Jerusalem Post text on Yahoo (31 Dec 2025) says "on Wednesday" (31 Dec 2025 was a Wednesday), and the PM's video says "On Dec. 31, 2025, just six days after that meeting" (Ynet, 5 Feb 2026).
      A second order or a later formal order may explain the difference. Next step: read the order. The claim o7w-comptroller-scope states both dates.
  - id: L-10
    date: 2026-10-04
    entry: >
      DISCREPANCY TO RESOLVE: the IDF's 2025 probe, as reported by Ynet, says "There was no one who saw or detected any sign of this event in advance, not even at the lowest intelligence level", yet the same report lists "at least 10 warning signs in the two years before the war" and the Nov 2025 committee says the night's intelligence "could and should have led to an alert". Our reading (an assumption, in o7w-units-flagged): the first sentence refers to detecting the invasion as an event, the others to indicators.
      Next step: read the IDF text.
  - id: L-11
    date: 2026-10-04
    entry: >
      DISCREPANCY TO RESOLVE: the Egyptian contacts are described three ways. The Atlantic (26 Sep 2026, via Ynet, Haaretz, MEE and Jerusalem Post): a visit on 26 Sep 2023, a 67-minute stay, counterpart unknown. Yedioth Ahronoth (9 Oct 2023) and the Wall Street Journal (27 Sep 2026, via Haaretz and Al Jazeera): a telephone call to the prime minister, after two earlier warnings (June and September 2023, per the Journal).
      They are not necessarily contradictory (a visit, then a call), but the claims are filed separately (o7w-egypt-visit, o7w-egypt-call) because their sources and denials differ. The PMO's 2026 statement denies that the prime minister met or spoke with the chief; it does not address a visit to others.
  - id: L-12
    date: 2026-10-04
    entry: >
      DISCREPANCY TO RESOLVE: the date of the alleged UAE call. Haaretz says "a week and a half before" 7 October (Haaretz, 25 and 28 Sep 2026); Anadolu, summarising Haaretz, says "Sept. 23, 2023" (8 Sep 2026); the New York Times is reported as saying "late September 2023" (Middle East Monitor, 26 Sep 2026). The book's author says the Shin Bet chief received Hamas's leader's message on 15 Sep and the call followed "about a week and a half later" (Ynet, 8 Sep 2026).
      The timeline draws the call as a range (23 to 27 Sep). Next step: the book's text. A second item to resolve: the author says the call was held on "a special communications system" brought by an embassy representative, while the PMO says its review of the call log and of entries into the PMO found no trace; whether such a call would appear in a call log is not shown by any source read.
  - id: L-13
    date: 2026-10-04
    entry: >
      DISCREPANCY TO RESOLVE: the PMO's wording on Egypt's intelligence chief has changed in scope. 9 Oct 2023 (via Ynet): "has neither spoken, nor met, with the head of Egyptian intelligence since the formation of the government, neither directly nor indirectly". 26 Sep 2026 (read, stored): "In the months preceding October 7, Prime Minister Netanyahu neither met nor spoke with Abbas Kamel".
      28 Sep 2026 (via Haaretz): "Netanyahu has never met or spoken with the head of intelligence of a foreign country without their Israeli counterparts". The three are not the same statement; a narrower period and an added clause do not show a denial is false, but they are what a reader should compare. Also: the 2026 statement says "On October 11, 2023, Egypt officially denied that it had warned Israel"; the Egyptian text was not located, and one search summary (not read, not used) says Egyptian media quoted unnamed security sources. Next step: find the Egyptian text.
  - id: L-14
    date: 2026-10-04
    entry: >
      DISCREPANCY TO RESOLVE: the times of the morning of 7 October as given by three sources: the PMO's published answers, as reported by Ynet (military secretary informed the PM at 6:29 a.m. by WhatsApp; second call 6:44; Shin Bet assessment of 5:15 a.m. received by the military secretariat at 9:47); Bar's affidavit, as reported by Ynet (alert at 3:03 a.m.; 5:15 instruction to update the military secretary);
      CTC Sentinel (military secretary "reportedly" briefed at 6:15 a.m.). Times are Israel local time (UTC+3 on 7 Oct 2023, Israel's summer time). They are not necessarily contradictory (a briefing of the secretary, then a message to the PM), but who held the 3:03 a.m. alert in the National Security Council, and why 5:15 became 6:29, is not answered by any source read.
