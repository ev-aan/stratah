    entry: >
      NAMING DECISIONS. Named, as public officials who are the subject of claims or are named by official records: Benjamin Netanyahu (prime minister); Ronen Bar (then Shin Bet chief); Herzi Halevi (then chief of staff, named in Bar and the book's authors' accounts); Tzachi Hanegbi (then head of the National Security Council);
      Abbas Kamel (then head of Egypt's General Intelligence Service); Mohamed bin Zayed (UAE president, as the person said to have telephoned); Matanyahu Englman (State Comptroller); Gadi Eisenkot, Naftali Bennett and Yair Lapid (opposition figures, only for statements on the record); Avi Gil (the PM's military secretary, named in the PMO's own account of the morning).
      Not named: any victim, hostage, minor or private individual; the observers and analysts who raised warnings (referred to by role); the former Palestinian official and the Palestinian political figure named in the sources; the journalists are named only as authors of the cited reports; a relative of the prime minister and an opposition party leader who are subjects of a related claim are left out of the claims and described by role in the transmission record.
      The prime minister's trials and other legal proceedings are not discussed. Where the Shin Bet chief names the prime minister in a defamation suit, the suit is recorded only as the setting of a claim about what he was told.
  - id: L-04
    date: 2026-10-04
    entry: >
      TESTS WRITTEN BEFORE THE CLAIMS ("staged", "allowed", "knew"). Each is a claim to test, not a conclusion.
      (A) KNEW THE DATE: would need a communication naming the day and reaching him before 7 October, a record of his reaction, or testimony from a recipient. A search of published accounts of every warning found none.
      (B) ALLOWED IT / LET IT HAPPEN: would need (1) a specific warning that reached a decision-maker, (2) a decision or order to withhold a response (to hold forces back, to withhold an alert, to cancel a deployment), (3) the people who carried it out, and (4) records. The claim is distinct from "failed to heed general warnings" (a claim of negligence or judgment) and from "pursued a policy that strengthened Hamas" (documented as policy by the IDF and Shin Bet; responsibility disputed).
      (C) STAGED / ARRANGED: would need a communication between the Israeli side and Hamas's planners or an Israeli order directing the operation, and the cooperation of many people on both sides; the Hamas leaders' own planning documents, the services' admissions of failure and the border forces' deployment on the day are the material that would have to be explained.
      (D) THE CONVERSE CLAIM (the security chiefs knew and hid it from him): the same standard applies; it needs a specific warning that reached the chiefs, a decision not to pass it up, and records. Applied equally; see o7w-chiefs-knew-no-wake.
      Limits recorded now: the army and Shin Bet investigated themselves; the army's own external committee found two-thirds of its probes inadequate; no inquiry that can compel records has reported; the call logs and the minutes are held by the parties.
