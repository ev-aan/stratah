      NOT USED, AND WHY. A search summary said the Knesset passed a bill for a government-designed commission on first reading in July 2026 with the opposition boycotting; the France 24 and Library of Congress pages were blocked, so the bill's reading is not stated as fact in a claim (JFeed says only that the government told the court in July the legislation was not completed).
