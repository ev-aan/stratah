      CLOCK NOTE. The PMO's X post of 26 Sep 2026 shows "7:04 PM" on the page read, while Haaretz's embed of the same post shows "10:04 PM"; the pages use different time-zone displays and neither states one. The post's day is not in doubt; its hour is not used. WAM stamps the UAE statement 2026-09-08T21:29+04:00 (17:29 UTC); CNN published its piece at 11:10 a.m. ET on 8 Sep 2026 (15:10 UTC), so the UAE statement was issued after CNN's first piece (CNN's update at 7:14 p.m. ET includes it).
