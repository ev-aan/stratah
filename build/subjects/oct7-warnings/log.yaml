# Append-only excavation log. Corrections are new entries; earlier entries are never edited.
# GUARDRAILS FOR THIS DIG (set before any claim was written):
#  - Benjamin Netanyahu and other senior office-holders may be named as public officials, only as the subject of claims or where official records name them (owner's naming ruling, 2026-10-04).
#    No victim, hostage, minor or private individual is named. His legal proceedings are not discussed, except where a source ties them directly to the 7 October claims (here: the libel suits he says he
#    will bring over the UAE and Egyptian reports, and the Shin Bet chief's defamation suit, which are about those claims).
#  - Every accusation stays labelled a claim, never a finding. "Staged", "allowed" and "knew" are claims to test: who did what, how, and what evidence would show it.
#  - A discrepancy between reports is a discrepancy to resolve, not proof of fabrication. Early reporting on a live story is often wrong: every fact is logged with its source and when it was reported.
#  - Anonymous sourcing is stated and keeps a claim at the confidence it implies. Repeats are not corroboration; summaries of one outlet's report count once.
#  - Casualty counts and the politics of the war outside the "what was known beforehand" question are out of scope. Nothing here speculates about anyone's religion, ethnicity or beliefs.
#  - Wikipedia is never an anchor; search snippets and summaries are not primary reads. No source was used that the author had not opened, except where a claim says it rests on a report of a document.

log:
  - id: L-01
    date: 2026-10-04
    entry: >
      TOPIC OPENED by the owner: "What is known about warnings before the 7 October 2023 attack, and what did the Israeli prime minister know?" Framing chosen by the owner: a CLAIMS MAP. Many claims circulate that the prime minister knew of the attack in advance;
      the owner asked for each specific claim to be filed separately and tested against what the official and primary record shows, shows only partly, and does not establish: that Egypt's intelligence chief warned him; that Israeli authorities held the Hamas plan known as "Jericho Wall" and it was dismissed;
      that intelligence units, drills or monitoring reports flagged the attack; that the leadership "allowed it to happen" or let it happen deliberately; that he was told on a specific night and delayed or did nothing; that he knew the date.
      The owner's naming ruling of 2026-10-04 applies (see the header). Scoping only; no claim was written before the guardrails above were set.
  - id: L-02
    date: 2026-10-04
    entry: >
      METHOD AND LIMITS. Every source listed in sources/MANIFEST.yaml was fetched on 2026-10-04 and its text read (not search snippets). Four short official texts are stored as extracts with sha256 (the PMO's X statement of 26 Sep 2026, the UAE Foreign Ministry statement of 8 Sep 2026,
      two State Comptroller press releases). BLOCKED OR NOT REACHED: The Atlantic, the Wall Street Journal and the New York Times (all originals; their reports were read only through summaries by Haaretz, Ynet, ABC Australia, Jerusalem Post, Middle East Eye, Middle East Monitor, KIRO 7 and the Washington Post's own reporting);
      the full Haaretz investigation of 8 Sep 2026 and two other Haaretz pieces (paywall: first sentence only); Times of Israel and Israel Hayom (HTTP 403); gov.il, shabak.gov.il and idf.il (Cloudflare or Incapsula block), so the IDF's and Shin Bet's published findings, the PMO's own statements on gov.il and the Supreme Court orders were read only through reports;
      the prime minister's 55-page answers and Bar's April 2025 affidavit (through Ynet only); any Egyptian official text (none located); France 24 and Library of Congress pages on the inquiry bill; Channel 12 and Channel 14 broadcasts. Consequence: only the claim on the State Comptroller's press releases rests on a primary text opened by the author; every other claim is anchored at secondary or lower.
  - id: L-03
