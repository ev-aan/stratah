  - id: o7w-units-flagged
    state: contested
    statement: >
      The circulating claim that intelligence units, drills or monitoring reports "flagged" the attack and were ignored is partly supported and partly overstated: signs of unusual activity were reported and not read as an invasion warning (o7w-8200-analyst, o7w-observers, o7w-night-signs), but the IDF's first published probe also says, as Ynet quotes it, "There was no one who saw or detected any sign of this event in advance, not even at the lowest intelligence level"; CTC Sentinel also reports that the signals-intelligence analyst issued further warnings in the following weeks, that the Gaza Division then prepared a document warning of a large-scale invasion in which Hamas intended to take up to 250 hostages, and that she sent another warning a few days before 7 October.
