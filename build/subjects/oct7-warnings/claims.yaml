    would_change_if: >
      a recorded assessment before 7 October that named an imminent mass attack, or the IDF's text reconciling "no one who saw or detected any sign" with its list of earlier warning signs
    next_step: >
      Read the IDF findings in full and ask what "this event" means in the sentence quoted.
    disputed_by:
