    alternatives:
      - {text: "The services had a specific warning of a mass attack and suppressed it.", why_not_preferred: "No source read says so; the IDF, the Shin Bet and an external committee all describe indicators that were misread, and a suppressed specific warning would contradict their admissions."}
    evidential_weight: 3   # of 5
    anchor_checked: secondary
    adoption_weight: 4   # of 5
    adoption_note: >
