      - {who: "IDF expert committee reviewing the probes, Nov 2025, as reported", kind: institution, position: "Direct intelligence accumulated on the night which, if professionally analysed, could and should have led to an alert; observers' reports could have exposed unusual activity.", source_read: src-ynet-meta, via: "Ynetnews report on the committee's findings"}
    anchor:
      type: comparison-of-official-findings
      description: >
        Compares the sentence quoted from the IDF's 2025 probe with the other IDF-linked findings: Ynet (27 Feb 2025) [read] reports both the "no one who saw or detected" sentence and "at least 10 warning signs in the two years before the war", and that "We read the signals but we didn't see what they actually said"; Ynet (10 Nov 2025) [read] reports the committee's contrary emphasis. CTC Sentinel [read] adds: the analyst's "additional warnings about Hamas' plans over the coming weeks"; a Gaza Division document warning "that Hamas was planning a large-scale invasion and intended to take up to 250 hostages", with no specific time, date or location; and another warning from the same analyst "a few days before October 7". Shin Bet [via Ynet on Bar's affidavit, read]: the warning level was wrong. The discrepancy is recorded as a discrepancy to resolve, not as evidence of concealment.
      sources: [src-ynet-idf-0227, src-ynet-meta, src-ynet-bar, src-nbc-analysts, src-abc-spotters, src-ctc]
    basis: >
      Our own comparison, so a judgment. The claim as circulated (flagged and ignored) is partly right on indicators and wrong if it means a specific warning of the attack.

  # ===================== B. WARNINGS SAID TO HAVE REACHED THE PRIME MINISTER FROM OUTSIDE ISRAEL =====================

  - id: o7w-egypt-general-warning
