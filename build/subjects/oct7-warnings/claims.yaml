# ---------------------------------------------------------------------------
# NEWS REVIEW ENTRY (a CLAIMS MAP): warnings before the 7 October 2023 attack, and what the Israeli prime minister knew.
# LIVE STORY, as of 2026-10-04. The Israeli election is set for 27 Oct 2026 and the story is part of the campaign; reports are still arriving and are contested.
# Guardrails (docs/NEWS_REVIEW.md, docs/AGENT_RULES.md section 11) are set in log.yaml (header, L-01 to L-06) and apply to every claim here:
#  - Benjamin Netanyahu and other senior office-holders are named only as the subject of claims or where an official record names them (owner ruling 2026-10-04);
#    no victim, hostage, minor or private individual is named; his legal proceedings are not discussed;
#  - every accusation stays labelled a claim, never a finding; "staged", "allowed" and "knew" are claims to test (who did what, how, what evidence would show it);
#  - a discrepancy between reports is a discrepancy to resolve, not proof of fabrication; anonymous sourcing is stated and keeps the claim at the confidence that implies;
#  - copied and summarised reports count once per underlying outlet; repeats are adoption, not corroboration;
#  - nothing here speculates about anyone's religion, ethnicity or beliefs.
# Authored 2026-10-04 for independent review. The author does not write review.yaml.
# ---------------------------------------------------------------------------
headline: "Signs reported inside Israel's services; foreign warnings to Netanyahu disputed; no date found"
headline_claim: o7w-pm-personally-warned
