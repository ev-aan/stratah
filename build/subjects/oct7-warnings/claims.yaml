subject: oct7-warnings
title: "Warnings before 7 October 2023 and what the prime minister knew: a claims map"
description: >
  Many claims circulate that Israel's prime minister knew of the 7 October 2023 attack in advance: that Egypt's intelligence chief warned him, that Israel held Hamas's attack plan and dismissed it,
  that intelligence units and monitoring reports flagged it, that he was told on a specific night and did nothing, that he knew the date, and that he or the government let it happen or staged it.
  This entry files each claim separately and tests it against what the official and primary record shows, what it shows only partly, and what is not established. It is a live story: reports are still arriving, official inquiries are unfinished or contested, and the prime minister is named only as the subject of claims or where official records name him.

# ---------------------------------------------------------------------------
# VERIFICATION
# READ DIRECTLY 2026-10-04 (primary): the Prime Minister's Office statement on X (26 Sep 2026), the UAE Foreign Ministry statement (8 Sep 2026), two State Comptroller press releases (11 Nov 2025, 6 Jan 2026).
# READ DIRECTLY (secondary, news): Ynet (eight pieces), Haaretz (five pieces, three of them partly behind a paywall), Jerusalem Post (six), CNN (two), NPR, NBC (one in full), ABC Australia, ABC US, Al Jazeera (two), Washington Post (Yahoo copy),
#   Fox News, Jewish Chronicle, JTA, JFeed, KIRO 7 (copy of the NYT), Middle East Eye (two), Middle East Monitor, ThePrint, Anadolu, Israel National News, CTC Sentinel (scholarly synthesis), two commentaries.
# NOT REACHED: The Atlantic, the Wall Street Journal, the New York Times (all pieces), Times of Israel and Israel Hayom (403), gov.il, shabak.gov.il and idf.il (blocked), the Shin Bet and IDF published reports themselves,
#   the High Court orders, the PM's 55-page answers, Bar's affidavit, any Egyptian official text, Channel 12 and Channel 14 broadcasts. Full list in sources/MANIFEST.yaml and log.yaml.
# Consequence: no claim here rests on a primary document opened by the author except those on the State Comptroller's press releases; every other anchor is secondary and is marked so.
# ---------------------------------------------------------------------------

divergence_note: >
  Evidence and belief diverge in three places. First, abroad the commonest claim is that the prime minister knew and let it happen or even arranged it; nothing found supports that: every account of the warnings says they gave no date, target or method, and the army's and Shin Bet's own probes describe a surprise
  that their services misread. Second, in Israel the opposite claim is common, that the security chiefs knew the night before and hid it from him (a poll of Israeli voters cited by one commentator found 44 per cent thought there was a "betrayal from within"; we have not seen the wording); the Shin Bet's and army's own accounts say the night's signs were misread as readiness or a limited raid, which is a failure of judgment, not concealment, and a claim of concealment is contested.
  Third, the strongest-sounding recent claims, that the UAE and Egypt warned the prime minister personally, have been repeated by dozens of outlets, but they come from a few anonymous-source reports (Haaretz and its book, the New York Times, The Atlantic, the Wall Street Journal); repeats are adoption, not corroboration. The prime minister's side also rests on statements (a call-log review and a denial) that are not public records.
  The gap between what has been asserted and what has been shown is recorded claim by claim; statements by officials, on either side, are adoption-class until backed by material.

