    funding_and_control: "Davies writes (read) that the British Museum's epigraphic programme at Elkab was 'carried out with the kind permission of the Supreme Council of Antiquities of Egypt and the generous encouragement of the Belgian archaeological mission'; the field team is named (Davies, Hayman, Heindl, Kobylecki, Rossiter, Schenk). Who FUNDED the British Museum programme is not stated in the pages read: UNRESEARCHED. Publisher Peeters / Leuven Oriental Studies: funding UNRESEARCHED. The PDF is hosted on the site of a Spanish foundation (fundacionieae.es); the host's rights position was not checked."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Peeters (Leuven) 2009, OLA 191, title page and contents read in the extracted text; the file is an extract headed 'ELKAB AND BEYOND, Studies in Honour of Luc Limme, 2009'. Copy hosted by fundacionieae.es; not compared with a holder copy."
