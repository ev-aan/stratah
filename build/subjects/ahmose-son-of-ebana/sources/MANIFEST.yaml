      tests:
        - "Compared with the rendering reproduced on a web page that credits Lichtheim (src-aeo-lichtheim-page): the same events in the same order (Avaris, Sharuhen, Nubia, Aata, Teti-en, Kush) and the same four-person Avaris captive entry, with differences in the Sharuhen duration and in titles (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["The Egyptian text itself was not read", "OCR errors possible", "A translation never shows what the signs say"]
      next_step: "Read the signs on Lepsius Bl. 12 (or Urk. IV 1-11) against the translation."
      checked: 2026-10-14

  - id: src-breasted-are1-preface
    title: "J. H. Breasted, Ancient Records of Egypt, vol. 1, Preface (1906)"
    url: https://archive.org/details/ancient-records-of-egypt-vol-1-breasted
    document_class: "interpretive (the author's own account of how the work was made). Read only for who supported the work."
    read: yes, directly (Internet Archive OCR text EgyptianRecords1-Breasted1906_djvu.txt, sha256 52db64cfb87a1cc0cf4e554d27f61ac89a8f8442dbd3944816f0d9258595fdf0; the Preface only)
    authenticity:
      status: unchecked
      next_step: "Compare the Preface with the page image; read the series prospectus for any outside donor."
      checked: 2026-10-14
    notes: "The Preface (dated Williams Bay, Wis., 22 September 1905) says Breasted's mission to copy Egyptian monuments in European museums was made 'for a commission of the four Royal Academies of Germany (Berlin, Leipzig, Gottingen, and Munich), in order to make these documents available for an exhaustive Egyptian Dictionary endowed by the German Emperor'. It thanks President William R. Harper and the Board of Trustees of the University of Chicago for 'unfailing support in arranging for my repeated absence in Europe' and the staff of the University of Chicago Press."

