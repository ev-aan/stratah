        - "Davies's column counts (31 columns east wall, 8 south wall) agree with Breasted 1906 note a (31 lines, 8 lines) (could have failed)"
        - "Davies cites the autobiography as LD iii 12b-d and Urk. iv 1-11, and the Lepsius plate I opened is Abth. III Bl. 12, 'El Kab Grab 5' (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Not compared with a holder copy of the book", "Davies's own statement: the tomb is 'still incompletely published'; his full record of the inscription is promised for 'the final publication of the tomb', not seen", "The rights position of the hosted PDF was not checked; nothing is stored"]
      next_step: "Find the final publication of the tomb or a Griffith Institute / British Museum record of the epigraphic survey."
      checked: 2026-10-14

  - id: src-lepsius-ld3-bl12
    title: "R. Lepsius, Denkmaeler aus Aegypten und Aethiopien, Abtheilung III (Neues Reich), Blatt 12: 'El Kab Grab 5' (plate, drawn copy of the tomb inscription made by the Prussian expedition of 1842-1845)"
    url: https://archive.org/details/denkmaler-aus-aegypten-und-aethiopien
    document_class: "facsimile drawing of the object, 19th century (a copy, not the object)"
    read: "VIEWED, NOT READ. The plate image (page 15 of denkmaeler-5.pdf, which is 'Band V, Abtheilung III, Blatt I-XC') was rendered and looked at. It shows the long text in vertical columns beside a standing figure, with three smaller panels, and the caption 'El Kab Grab 5'. The signs were NOT transliterated or read. File denkmaeler-5.pdf sha256 04d9beeeaed07fad7c75740db78aa833485f140c4c9d06c7daeeefe0d54f96bc; not stored here."
    funding_and_control: "The Lepsius work's own title pages say it follows the drawings of the expedition sent by order of the King of Prussia, Friedrich Wilhelm IV, in 1842-1845, edited by Lepsius (read in the Internet Archive OCR of the text volume and of the plate volume's title). So the Prussian crown commissioned it. Who paid for what and what was left out: UNRESEARCHED."
    authenticity:
      status: authenticated
      strength: weak
      provenance: "Internet Archive item denkmaler-aus-aegypten-und-aethiopien (a Berlin, Nicolaische Buchhandlung 1849-1859 set, 12 PDFs; vol. 5 = Abth. III Bl. I-XC). Item metadata does not name the scanning sponsor in the part read. By date it is public domain; not verified on the item page."
      tests:
        - "Plate caption 'El Kab Grab 5' and 'Abth. III Bl. 12' agree with Breasted's citation 'Lepsius, Denkmaeler, III, 12, a and d' and with Davies's 'LD iii: 12b-d' (could have failed)"
        - "The volume's index text lists 'Blatt 12 ... Dynastie XVIII ... El Kab Grab 5' (OCR, could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["Signs not read", "Davies 2009 lists corrections to Lepsius's copy and says part of the wall is now less complete than when Lepsius drew it, so the plate is a copy with errors, not the wall", "Rights: public domain by date, not verified on the item page"]
      next_step: "Transliterate the columns about the Avaris, Sharuhen and Nubia captives from this plate and compare with Urk. IV 1-11 and Davies's corrections."
      checked: 2026-10-14

