# Sources for the ahmose-son-of-ebana dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored as a copy; sources are cited by URL and sha256 of the file read. Tests were run in this session (2026-10-14), which is not an independent review.
# Primary data for this subject is the wall inscription in tomb EK5 at El Kab, or its images and squeezes. NO source below is the object. The Lepsius plate is a
# 19th-century drawn copy of it; its signs were looked at but NOT read here. Every claim therefore rests on books, translations or articles (claims, not primary data).
# Funders and controllers of each work: recorded under `funding_and_control` only where a page that was opened says so; otherwise UNRESEARCHED.
retrieved: 2026-10-14
sources:

  - id: src-breasted-are2
    title: "J. H. Breasted, Ancient Records of Egypt, vol. 2, The Eighteenth Dynasty (Chicago: University of Chicago Press, 1906), sections 1-16, 38-39, 78-82 (Ahmose son of Ebana)"
    url: https://archive.org/details/ancient-records-of-egypt-vol-2-breasted
    document_class: "interpretive: translation with commentary, by a modern editor (not primary data)"
    read: yes, directly (Internet Archive OCR text file EgyptianRecords2-Breasted1906_djvu.txt, sha256 656c183758aeb8ac7367d3dd7056ab3a3d0517906d60f124056a9d882fc98b04; sections 1-16, 38-39, 78-82 and Breasted's notes to them)
    funding_and_control: "Title page (read): general editorship of William Rainey Harper; published by the University of Chicago Press 1906. Breasted's own Preface (vol. 1, read, see src-breasted-are1-preface) thanks Harper and the Chicago Trustees for arranging his absences in Europe. Whether any outside donor paid for the series or the press run: UNRESEARCHED."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: "Title page and imprint read in the OCR (University of Chicago Press, published March 1906, copyright 1906). Internet Archive item ancient-records-of-egypt-vol-2-breasted; the item metadata gives no sponsor, scanning centre or copyright status. The OCR opens with a Western Reserve University (Adelbert College) library stamp (reading from OCR, uncertain). Public domain by date."
      tests:
        - "Imprint, year and 'Volume II, The Eighteenth Dynasty' on the title page agree with the Internet Archive item title (could have failed)"
        - "Breasted's note that the text is on the wall of the cliff-tomb at El Kab in 31 lines (right wall) and 8 lines (door wall) agrees with Davies 2009 (31 columns east wall, 8 columns south wall) (could have failed)"
        - "Breasted's citation of Lepsius, Denkmaeler III, 12 matches the plate I opened (Abth. III Bl. 12, 'El Kab Grab 5') (could have failed)"
      tested_by: "Stratah dig session, 2026-10-14 (not an independent review)"
      gaps: ["OCR only; page images not compared with the OCR", "Breasted says he collated the Berlin squeeze no. 172; that squeeze was not seen here", "Not compared with a second printing"]
      next_step: "Compare the OCR with the page images for sections 6-16 and 80-81."
      checked: 2026-10-14

