# Sources for the ahmose-son-of-ebana dig, with authenticity entries (rules A1-A10, build/SCHEMA.md).
# Nothing is stored as a copy; sources are cited by URL and sha256 of the file read. Tests were run in this session (2026-10-14), which is not an independent review.
# Primary data for this subject is the wall inscription in tomb EK5 at El Kab, or its images and squeezes. NO source below is the object. The Lepsius plate is a
# 19th-century drawn copy of it; its signs were looked at but NOT read here. Every claim therefore rests on books, translations or articles (claims, not primary data).
# Funders and controllers of each work: recorded under `funding_and_control` only where a page that was opened says so; otherwise UNRESEARCHED.
retrieved: 2026-10-14
updated: 2026-10-16   # second pass: see log entries L-07 to L-12. Hashes below are of files fetched on 2026-10-16 and kept outside the repository.
sources:

