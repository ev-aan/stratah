  - id: L-04
    date: 2026-10-14
    entry: >
      FUNDING AND CONTROL, as far as read. Breasted's Preface (vol. 1) says his mission to copy European museum monuments was made for a commission of four Royal Academies of Germany for an Egyptian Dictionary 'endowed by the German Emperor', and thanks President Harper and the Chicago Trustees for supporting his absences in Europe and the University of Chicago Press staff. Whether any outside donor funded the series or press run: UNRESEARCHED.
      Lepsius's Denkmaeler: the title pages (OCR) say the expedition of 1842-1845 was sent by order of King Friedrich Wilhelm IV of Prussia; the details of who paid and who controlled the selection of what was copied: UNRESEARCHED. Davies 2009: the British Museum's epigraphic programme at Elkab was carried out 'with the kind permission of the Supreme Council of Antiquities of Egypt and the generous encouragement of the Belgian archaeological mission'; the funder of the programme is not stated in the pages read: UNRESEARCHED.
      Peeters / Leuven Oriental Studies, the University of California Press (Lichtheim), the Ancient Egypt Online site (J Hill), Fantuzzi's article and the University of Venice repository: funding UNRESEARCHED. No funding is asserted for any of these.
  - id: L-05
    date: 2026-10-14
    entry: >
      WEIGHING. The two translations read agree that Ahmose was given captives and slaves after Avaris (one man, three women), Sharuhen and Nubian campaigns, and disagree on the Sharuhen siege (6 years vs three) and on the title.
      They do not put the word Hyksos in his speech; the Hyksos reading of Avaris is Breasted's commentary. Nobody read says admiral. Davies corrects some published readings from the wall and notes that the tomb is still incompletely published.
      All claims resting on translations are filed proposed or contested, evidence class interpretive, anchor_checked secondary, confidence low, weight at most 2. The speaker claims are kept in his wording. 'The slaves were Nubians and Hyksos' is not called refuted: the signs were not read and Avaris is commonly tied to the Hyksos in the commentary; it is filed contested at weight 1.
      Hypotheses kept open with named positions: the title and rank (Breasted, the Lichtheim page, Davies), the siege length, the reading of column 27 (Davies vs Schulz as cited), the date of Ahmose I (Fantuzzi, Kitchen as reported, earlier authors unnamed), and who composed the text (Ahmose or his grandson Pahri).
  - id: L-06
    date: 2026-10-14
    entry: >
      WHERE THE FACTS END. Known only through books and a modern survey report: the existence and place of the tomb (Elkab no. 5), the layout (31 + 8 columns), the narrative as translated. Not established: the exact Egyptian words, the date of the carving beyond 'reign of Thutmose III' on stylistic grounds (Davies), the absolute date of the campaigns,
      who the captives were by origin, whether the 'slaves' were what the later term means (the Egyptian word was not read), and the finding-state of the wall today. What would move claims: a transliteration from the Lepsius plate or Urk. IV compared with the translations, Davies's final record of the tomb, a photograph or squeeze of the wall, a title-lexicon on the naval rank, a chronology with independent data.
      NEXT STEPS in order: (1) transliterate Lepsius Bl. 12 columns 12-19 and 26-28; (2) open the TLA text in a browser; (3) read Lichtheim's book and compare the web page; (4) trace funding of the British Museum Elkab programme and the University of Chicago series.
