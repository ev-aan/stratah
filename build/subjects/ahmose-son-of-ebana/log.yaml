      DIG OPENED from a handoff written by another agent (ahmose-son-of-ebana.yaml). Its identification (El Kab tomb autobiography; Urk. IV; Lichtheim AEL II) was an unverified guess; it was tested, and the tomb (Elkab no. 5) and the citations
      LD III 12 and Urk. IV 1-11 were confirmed only through Davies 2009 and Breasted 1906 (both read). Two Dead Hidden speaker claims (dh-HN0wNVpfunM-07, dh-K3pw12lBcXM-12) were split into
      separate claims and kept in the speaker's wording. No headline is published (headline_status draft). Owner rules applied from the start: books, translations and videos are all claims; none is primary data.
  - id: L-02
    date: 2026-10-14
    entry: >
      WHAT WAS OPENED AND READ. (1) Breasted, Ancient Records of Egypt II (1906), Internet Archive item ancient-records-of-egypt-vol-2-breasted, OCR text (sha256 656c1837...): sections 1-16, 38-39, 78-82 and notes.
      (2) Breasted vol. 1 (item ancient-records-of-egypt-vol-1-breasted, OCR sha256 52db64cf...): the Preface only, for who supported the work. (3) Ancient Egypt Online page 'Ahmose son of Ebana', raw HTML (sha256 7a60f40b...), translation text read in full; the page credits it to M. Lichtheim, AEL II (2006), and carries 'copyright J Hill 2010'.
      The wording was not compared with Lichtheim's book (not opened). (4) W. V. Davies 2009, OLA 191 chapter (PDF sha256 8c462f29...): introduction, facade and east/south wall, the autobiography description, the corrected readings; the north and west wall genealogy not read in full.
      (5) Fantuzzi's chronology article (PDF sha256 d4c103ec...): introduction and 'The problem'. (6) Lepsius, Denkmaeler Abth. III (Internet Archive item denkmaler-aus-aegypten-und-aethiopien, denkmaeler-5.pdf, sha256 04d9beee...): the plate Bl. 12 'El Kab Grab 5' was rendered to an image and LOOKED AT; the hieroglyphic signs were NOT transliterated or read, so no claim has anchor_checked primary.
      (7) OpenStreetMap Nominatim JSON for El Kab (orientation only). Nothing was stored in the repository; no image licence question arose because no image is stored.
