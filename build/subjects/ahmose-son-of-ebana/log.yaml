  - id: L-09
    date: 2026-10-16
    entry: >
      CORRECTIONS TO THE FIRST PASS (the review's findings). (a) Claim ahmose-text-nubians-as-targets cited Breasted sections 14, 39, 80 and 81 and said sections 80 and 81 describe the hanging Nubian leader. Re-read: section 81 is the Asiatic campaign to Retenu and Naharin and holds neither the Troglodyte term nor the hanging; both are in section 80. The claim now cites 14, 39 and 80.
      (b) 'Admiral': the first pass said no reading uses the word and that nobody read says admiral. That was too strong. Davies's bibliography (read) lists Kammerzell 1988, 'Texte aus dem Grab des Flottillenadmirals Ahmose' (the work was not found or read), and Sethe's autograph pages and German volume (read in this pass) use 'Lebensgeschichte des Admirals' as editorial headings. None of the four renderings of the title line says admiral. The claims were reworded to say that.
      (c) The word Hyksos: the web page's own introduction says Ahmose's father served 'in the early campaigns against the Hyksos'; Lichtheim's introduction and heading, Sethe's headings and a note reading the foes killed before the first Nubian campaign as Hyksos, and Breasted's heading and commentary also use the word. The claim now lists all of them; it stays true that no translated line of the speech has the word.
      (d) ahmose-composition-by-grandson-and-late-carving said 'not by Ahmose himself' and 'some decades after the campaigns'. The sources read say 'executed by' (Breasted) and 'directed by' (Davies) the grandson, and Davies says Ahmose made the tomb himself and lived to see it completed. Reworded; the sources do not say who composed the narrative.
      (e) ahmose-title-translations-differ-no-admiral was filed contested while its basis said the renderings may differ in emphasis rather than in fact; it is now proposed with listed alternatives. (f) anchor_checked secondary was generous for claims resting on one source (Fantuzzi; Davies's column 27): now no. For claims where three translations agree it stays secondary, with the note that they worked from the same text.
