  - id: L-13
    date: 2026-10-16
    entry: >
      FINDINGS OF THE SECOND PASS, coverage facts only. (1) Sethe 1914 and Lichtheim give the Sharuhen siege as three years and Breasted gives six (from the squeeze). On Sethe's 1906 autograph the year-group at the end of that line looked, to the reader at 200 dpi, like two rows of three strokes (six); this is not confirmed and is recorded as an unresolved observation, not a reading.
      (2) The slave-name list (Urk. IV 11) is translated by Sethe (9 men, 10 women, matching Breasted's note); Lichtheim does not translate it. Sethe glosses one name as 'the Asiatic' and one as 'of the Medjay tribe'; the list does not say Hyksos. (3) The TLA website returned its bot-verification page again (not bypassed); the TLA's open corpus release holds pre-New Kingdom witnesses and has no sentence of this text.
      (4) Kammerzell 1988 (TUAT II, 4, pp. 522-529) was not found; the Internet Archive items for other TUAT fascicles were opened and are the wrong ones. (5) The Sohag PDF host did not answer (connection reset). (6) A search for funding statements of the British Museum Elkab programme and the Chicago series found none in the pages read; funding stays UNRESEARCHED for every link.
      (7) Two new claims: ahmose-urk-autograph-captive-numerals (anchor_checked primary, numerals only, a copy, read by an AI model and needing a check by a person who reads hieroglyphs) and ahmose-slave-name-list-urk-iv-11. No claim is established; the headline stays draft.
      NEXT STEPS in order: (1) a person who reads hieroglyphs transliterates Urk. IV 3-5 and 10-11 from the 1906 autograph and checks the numerals, the Sharuhen year-group and the slave list; (2) open the TLA record in a browser; (3) find Kammerzell 1988 and compare Lichtheim's printed book with the upload; (4) trace funding of the British Museum Elkab programme and the University of Chicago series from their own records.
