  - id: ahmose-sp-slaves-were-nubians-and-hyksos
    state: contested
    statement: "The slaves he received were Nubians and Hyksos (dh-HN0wNVpfunM-07: 'received slaves, Nubians and Hyksos'); 'campaigns against the Hyksos and Nubians' (dh-K3pw12lBcXM-12)."
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: 3
    adoption_note: "Dead Hidden, 'Rekhmire' (HN0wNVpfunM) and 'Aamu, Hyksos, Habiru, Shasu' (K3pw12lBcXM). The Avaris and Hyksos link is standard in scholarly commentary."
    would_change_if: "the signs show the captives' origin named as Asiatics or Hyksos at Avaris, or show the Avaris captives' origin unstated; or the origin of the 'one man and three women' is discussed in a source read"
    anchor:
      type: interpretive
      description: "Translations say Ahmose took captives at Avaris (one man, three women, given as slaves), at Sharuhen (two women, captives given as slaves) and in Nubia (two men, two female slaves, etc.). They do not name the origin of the Avaris captives, and the word Hyksos is not in the speech (see ahmose-text-hyksos-word-not-in-the-speech). Avaris is identified as the Hyksos stronghold by Breasted's commentary (Manetho, Josephus) and not by the speech. The Nubian captives are from campaigns the translations describe as against Nubian Troglodytes or Bowmen, and 'campaigns against the Hyksos and Nubians' is consistent with the translations' places (Avaris, Sharuhen, Nubia)."
      sources: [src-breasted-are2, src-aeo-lichtheim-page]
    disputed_by:
      - {who: "J. H. Breasted", kind: person, position: "Avaris was the Hyksos stronghold and the siege of Sharuhen 'an extension of the campaign against the Hyksos'; his translation does not say the captives were Hyksos", source_read: true, via: "Ancient Records of Egypt II, sections 4 and 13 note b (OCR)"}
      - {who: "Dead Hidden (speaker)", kind: person, position: "the slaves were Nubians and Hyksos", source_read: "claim lines only", via: "dh-HN0wNVpfunM-07 (claims file; video not watched)"}
    basis: "# V: read 2026-10-14. The 'campaigns against Hyksos and Nubians' part is consistent with the places in the translations. 'The slaves were Hyksos' is not stated in either translation read. Not filed refuted: the signs were not read."

