      description: "The text is on the tomb wall at El Kab per Davies 2009, Breasted 1906 and the Lepsius plate caption (see ahmose-object-tomb-ek5-wall-inscription); it is a retrospective narrative of his campaigns and rewards, executed by his grandson per Breasted, and carved some time in the reign of Thutmose III per Davies's stylistic dating (see ahmose-composition-by-grandson-and-late-carving). 'War hero' is the speaker's word; the text lists valour rewards ('the gold of valour')."
      sources: [src-davies-2009, src-breasted-are2, src-lepsius-ld3-bl12]
    basis: "# V: read 2026-10-14. Place stated in -12 as 'Memphis' is a separate claim (ahmose-sp-place-memphis)."

