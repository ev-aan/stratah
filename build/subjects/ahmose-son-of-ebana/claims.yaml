      What the Egyptian signs say for the captive and slave passages (the words rendered "captive", "slave", "head", "hand", "spoil", the people-names rendered Asiatics and Nubian Troglodytes/Bowmen) was not read here.
    statement_kind: search_result
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "No popular account seen quotes the Egyptian."
    would_change_if: "Lepsius Bl. 12, Urk. IV 1-11, the TLA text or Davies's final record is transliterated and compared with the translations"
    next_step: >
      Transliterate columns 12-19 and 26-28 from the Lepsius plate (Internet Archive item denkmaler-aus-aegypten-und-aethiopien, denkmaeler-5.pdf page 15, Abth. III Bl. 12) and check each against Urk. IV 1-11 and Davies's corrections;
      open the TLA record in a browser, and look for Davies's final publication of the tomb.
    anchor:
      type: search-record
