        Searched: Breasted 1906 and the web page (translations, no signs in the text layer); Davies 2009 (some corrected readings, no full text); TLA (blocked by a bot-verification page); the Sohag PDF (connection refused); Urk. IV (no scan found).
        Viewed: the Lepsius plate image, but the signs were not transliterated.
      sources: [src-breasted-are2, src-davies-2009, src-lepsius-ld3-bl12, src-tla, src-sohag-translation, src-urk-iv]
