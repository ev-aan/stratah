      Lepsius's Denkmaeler (Abth. III Bl. 12, 'El Kab Grab 5') is the first copy and Davies's British Museum survey is a modern one. Lichtheim counts the lines as 1-31 on the east wall and 32-40 on the south wall (40 in all, against 31 + 8 = 39 in Breasted and Davies).
