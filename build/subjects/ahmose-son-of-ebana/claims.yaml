      Two scholars tie the tomb work to Ahmose's grandson Pahri (Pahery). Breasted (section 3): "The long inscription was therefore executed by Ahmose's grandson, Pahri". Davies: the accompanying scene shows work on the tomb "directed by his grandson, Pahery", and he dates both tombs "on stylistic and other grounds to the reign of Thutmose III"; "A more precise dating remains to be established".
