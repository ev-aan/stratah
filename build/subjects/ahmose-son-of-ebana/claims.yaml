subject: ahmose-son-of-ebana
title: "The autobiography of Ahmose son of Ebana (El Kab): what it says about captives, slaves, Hyksos and Nubians, and what the speaker says it says"
question: "What does the autobiography of Ahmose son of Ebana say about captives (Hyksos, Nubians) received as slaves?"
dig_status: open
headline_status: draft
headline: "Translations of Ahmose son of Ebana's tomb text say captives were given to him as slaves"
headline_claim: ahmose-translations-avaris-captives-given-as-slaves
search_summary: >
  Ahmose son of Ebana, a naval officer of El Kab, left a long autobiography on the wall of his tomb (Elkab no. 5). Three translations read (Breasted 1906, Sethe 1914, Lichtheim) and a web page
  copying Lichtheim say he was given captives as slaves after the fall of Avaris (one man and three women), after Sharuhen and on Nubian campaigns. In none of them does the word Hyksos
  occur in his speech; it occurs in editors' headings, notes and introductions. The Egyptian words were not read; only numeral strokes of a hand-drawn copy were looked at.
description: >
  Second pass (2026-10-16) on the first dig. Read: Breasted, Ancient Records of Egypt II (1906) and the preface of vol. 1; Sethe's German translation of Urk. IV 1-11 (1914); Lichtheim's translation
  (a third-party upload of the book); a web page that copies it; W. V. Davies's 2009 epigraphic report on the tomb; one chronology article (Fantuzzi); a PBS Empires excerpt. Looked at: Sethe's
  hand-drawn hieroglyphic autograph (Urk. IV 2-5, 1906; only numeral strokes and German headings, the Egyptian words not read) and one plate of Lepsius's Denkmaeler (signs not read).
  Not read: the Egyptian words, the Thesaurus Linguae Aegyptiae record (blocked by a bot-verification page), Kammerzell 1988 (not found), the Sohag translation (not reached), Vandersleyen,
  Schulz and Beylage. Eight speaker claims from two Dead Hidden videos are split into separate parts and weighed here. The videos are never an anchor and the translations are claims, not primary data.
divergence_note: >
  The speaker version is that Ahmose son of Ebana rose to admiral, and that his tomb autobiography records that he and his men received Nubians and Hyksos as slaves, including
  campaigns against the Hyksos and Nubians. The translations read say something narrower and different in wording: Ahmose is given captives and "male and female slaves"
  after named sieges and campaigns (Avaris, Sharuhen, Nubia); the word Hyksos is not in the speech as translated by Breasted, Sethe or Lichtheim (it is in their headings, notes and introductions);
  the people taken at Avaris are one man and three women; and the title is rendered "chief of the sailors" (Breasted), "Oberste der Schiffsmannschaft" (Sethe), "crew commander" (Lichtheim) or,
  from the wall, "commander of a ship's contingent" (Davies). None of those four renders the title line as "admiral". The word admiral does appear in Sethe's editorial headings ("Lebensgeschichte des
  Admirals") and in the title of a German translation listed in Davies's bibliography (Kammerzell 1988, "Flottillenadmirals", not read). Translators differ on details (the length of the Sharuhen siege),
  and Davies has corrected readings in the published text. The gap between the speaker's wording and the text as translated, and between the translations and the signs, is the product here.
  The signs themselves, the date of the events and who exactly the captives were remain unread or open.
assessment:
  question: "What does the autobiography of Ahmose son of Ebana say about captives (Hyksos, Nubians) received as slaves?"
  answer: partly
  headline: "In translation the text says captives and slaves were given to Ahmose after Avaris, Sharuhen and Nubian campaigns; it does not say, in those translations, that they were Hyksos."
  key_points:
    - "Three translations and a web copy agree: after Avaris Ahmose took one man and three women, and the king gave them to him as slaves. Later grants are also called slaves."
    - "The word Hyksos is not in his speech in the translations read; it appears in editors' headings and notes. The origin of the Avaris captives is not stated in them."
    - "No Egyptian word was read here. The words behind slaves, captives and the people-names were not, so the wording rests on translators."
  text: >
    The question is what the tomb text says, not what happened. Breasted (1906), Sethe (1914), Lichtheim and a web page copying Lichtheim all give Ahmose captives at Avaris (one man and three
    women, four heads), after Sharuhen and on Nubian campaigns, and use words for slaves in the grants. The speaker's claim that the slaves were Nubians and Hyksos is partly matched: Nubian
    campaigns with captives and female slaves are in the translations, and Sethe's note reads the "Asiatics" killed before the first Nubian campaign as Hyksos, but no translated line calls the
    Avaris captives Hyksos. A slave-name list on the door wall is translated only by Sethe (Urk. IV 11); he glosses one name as 'the Asiatic' and one as 'of the Medjay tribe', and the list does
    not say Hyksos. The claim that he rose to admiral is a gloss: none of the four renderings of his title line says admiral, though an editorial heading by Sethe and the title of Kammerzell's
    translation use the word. The translations were not checked against the signs, one passage (the length of the Sharuhen siege) is rendered differently by Breasted and the other
    three, and the date of the events is not fixed.
  basis:
    - ahmose-translations-avaris-captives-given-as-slaves
    - ahmose-translations-sharuhen-and-nubia-captives
    - ahmose-text-hyksos-word-not-in-the-speech
    - ahmose-slave-name-list-urk-iv-11
    - ahmose-title-translations-differ-no-admiral
    - ahmose-hieroglyphic-text-not-read
  rated_claim: ahmose-translations-avaris-captives-given-as-slaves
  would_settle: "A transliteration of Urk. IV 1-11 (or the wall, or a collated edition) read against the translations for the words rendered slave, captive, head and hand and the people-names, a title-lexicon reading of the rank, and a source in which the origin of the Avaris captives is stated."

claims:

  # ------------------------- WHAT THE TEXT SAYS (translations read; the signs were read only for numerals) -------------------------

  - id: ahmose-translations-avaris-captives-given-as-slaves
    state: proposed
    statement: >
      Three translations (and a web page copying one) say that after Avaris was taken Ahmose brought away one man and three women, four persons, and the king gave them to him as slaves.
      Breasted (1906, section 12): "I took captive there one man and three women, total four heads, his majesty gave them to me for slaves."
      Sethe (1914, Urk. IV 4): "1 Mann und 3 Frauen, zusammen 4 Köpfe. Sie wurden mir zu Sklaven gegeben."
      Lichtheim (Ancient Egyptian Literature II, p. 13) has "one man, three women; total, four persons" and "gave them to me as slaves"; the web page copying her has the same words.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured. Two web pages were read that repeat the item (a PBS Empires excerpt credited to Tyldesley 2001, which paraphrases it as 'let me keep them as slaves', and the Ancient Egypt Online page); that is two pages, not a measure of how widely it is held."
    would_change_if: >
      a transliteration of the signs (Urk. IV 4, Lepsius Bl. 12, or the wall) shows a different number of captives or a word that the translators render "slaves" but that means something else, or Lichtheim's printed book differs from the upload and the web page
    anchor:
      type: interpretive
      description: >
        Read: Breasted 1906 section 12 (OCR); Sethe 1914 translation volume, Urk. IV 4 (OCR checked against the page image); Lichtheim, Ancient Egyptian Literature II, p. 13 (OCR of a third-party upload) and the Ancient Egypt Online page (raw HTML,
        credited there to Lichtheim). Three independently made translations and a copy agree on the figures and on "slaves". The translators all worked from the same text (Lepsius's copy, the Berlin squeeze, later Sethe's edition), so the agreement shows the
        translators read the figures alike, not that the signs were separately confirmed. See ahmose-urk-autograph-captive-numerals for the one place the autograph was read.
        Independence: Breasted, Sethe and Lichtheim translate the same text (Lepsius's copy, the Berlin squeeze and Sethe's edition), and the Ancient Egypt Online page is a copy of Lichtheim, so they are not independent confirmations of the signs. Labelled no for that reason: the label secondary needs agreement across independent sources.
      sources: [src-breasted-are2, src-breasted-tr-ahmose, src-sethe-urk-deutsch-1914, src-lichtheim-ael2, src-aeo-lichtheim-page]
      nodes:
        - {node: ahmose-ebana-2009-davies-documents-tomb-ek5-at-el-kab, verb: qualifies}
    basis: >
      # V: Breasted, Sethe and Lichtheim passages read 2026-10-14 and 2026-10-16. Breasted's note b to section 6 says the tomb elsewhere lists a total of 9 men and 10 women for the gifts, and that his narrative sums differently; the totals were not recomputed here.
      Says what the translators printed. It does not by itself show what the signs say.

  - id: ahmose-urk-autograph-captive-numerals
    state: proposed
    statement: >
      In a scan of Sethe's hand-drawn hieroglyphic copy of the autobiography (Urk. IV 4, 1906), the captive entry that follows the capture of Avaris appears to carry, in one run, the numeral strokes 1, 3 and 4
      (one, three, four), the figures that the translations give for one man, three women and four heads. The words the numerals count were not read, and the count was made by an AI reader, not an Egyptologist.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured; no popular account seen shows the hieroglyphs."
    would_change_if: "a person who reads hieroglyphs transliterates Urk. IV 4 from the scan and finds different numerals, or the wall or a squeeze is shown to read differently from Sethe's copy"
    anchor:
      type: interpretive
      description: >
        Looked at: Sethe, Urkunden der 18. Dynastie, Heft 1 (1906), the autograph page Urk. IV 4 (page 13 of the PDF), rendered at 200 and 350 dpi; an AI model counted the numeral strokes in the entry after the line about the town of Avaris is taken (a run of 1, III and IIII).
        This is a look at a hand-drawn copy of the inscription (not the wall, and not a collated edition), at the scale of a 200 dpi bitonal scan, and only of stroke counts. The words rendered "man", "women", "heads" and "slaves" were not read, so the text itself was not read.
        The claim is therefore labelled anchor_checked no, not primary. That the counts match the translations is what the translators print; it is not an independent test of the counts, and has not been checked by a person who reads hieroglyphs.
      sources: [src-sethe-urk-iv-heft1]
    basis: "# V: page opened and stroke counts looked at 2026-10-16 (viewer: an AI model, not an Egyptologist). A copy made from Lepsius's plate and the Berlin squeeze, so it shares their limits (Davies lists corrections to Lepsius's copy). Correction of the first-pass label (primary, primary_text, weight 2): see log L-14."

  - id: ahmose-translations-sharuhen-and-nubia-captives
    state: proposed
    statement: >
      The translations also give Ahmose captives and slaves on later campaigns: after Sharuhen "two women and one hand" (Breasted section 13: "giving me the captives for slaves"); on the Nubian campaign of the first king "two living men, and three hands" and "two female slaves" (section 14); under Amenhotep I "two female slaves" more (section 39); and in a rebellion episode "five heads" and land, with "It was done to all the sailors likewise" (section 15).
      Lichtheim's rendering of the same passages says "given to me as slaves" (Sharuhen), "two female slaves" (Nubia) and "the whole crew". Sethe (1914) has "zwei Sklavinnen" for the first Nubian campaign.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the signs read differently for these passages, or Davies's full record of the inscription corrects them (he has already corrected other readings in the later columns)"
    anchor:
      type: interpretive
      description: >
        Read: Breasted 1906 sections 13, 14, 15 and 39 (OCR); Sethe 1914 Urk. IV 5-8 (OCR checked against the image for the first Nubian campaign); Lichtheim pp. 13-14 (OCR) and the Ancient Egypt Online page.
        Breasted's note d to section 14 says the two female slaves are not the two captives just taken, against earlier translators (Renouf, Petrie), which is itself a point on which translators differ.
        Independence: Breasted, Sethe and Lichtheim translate the same text (Lepsius's copy, the Berlin squeeze and Sethe's edition), and the Ancient Egypt Online page is a copy of Lichtheim, so they are not independent confirmations of the signs. Labelled no for that reason: the label secondary needs agreement across independent sources.
      sources: [src-breasted-are2, src-breasted-tr-ahmose, src-sethe-urk-deutsch-1914, src-lichtheim-ael2, src-aeo-lichtheim-page]
    basis: >
      # V: read 2026-10-14 and 2026-10-16. The count of "heads", "hands" and "slaves" depends on how each translator reads the nouns; compare claim ahmose-sharuhen-duration-and-title-renderings-differ.

  - id: ahmose-text-hyksos-word-not-in-the-speech
    state: proposed
    statement: >
      In the speech as printed in the translations read (Breasted 1906, Sethe 1914, Lichtheim and the web page copying her), the word "Hyksos" does not occur. The people besieged at Avaris are not called Hyksos; Sharuhen is a city in Palestine; the foes slain before the first Nubian campaign are
      "Asiatics" (Breasted), "nomads of Asia" (Lichtheim and the web page) or, in Sethe's German, Mntjw, with his footnote saying the old name is used "hier für die Hyksos". The word Hyksos is in the editors' framing: Breasted's heading "Campaign against the Hyksos; Siege of Avaris" and his
      commentary (section 4: "This can be no other than the city called Avaris by Manetho"); Sethe's section heading "Vertreibung der Hyksos" and his note that Avaris was the capital of the Hyksos kings; Lichtheim's heading "Expulsion of the Hyksos" and her introduction ("the decisive battles against the Hyksos"); and the web page's introduction, which says his father served "in the early campaigns against the Hyksos".
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    absence_anchor: true
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the signs of the passages show a word that the translators rendered as 'Asiatics', 'nomads of Asia' or left out that is read as Hyksos (hq3 h3swt), or a transliteration of Urk. IV 1-11 shows the Avaris captives' origin named"
    anchor:
      type: search-record
      description: >
        Searched the English text of the speech in Breasted 1906 sections 6-16, 39 and 80-82, the German text of Sethe 1914 (Urk. IV 1-11), Lichtheim's translation (OCR) and the full translation on the Ancient Egypt Online page for the word Hyksos: no hit in the speech; the hits are in headings, notes, commentary and introductions (listed in the statement).
        The Egyptian text was not searched (the words were not read).
        Independence: Breasted, Sethe and Lichtheim translate the same text (Lepsius's copy, the Berlin squeeze and Sethe's edition), and the Ancient Egypt Online page is a copy of Lichtheim, so they are not independent confirmations of the signs. Labelled no for that reason: the label secondary needs agreement across independent sources.
      sources: [src-breasted-are2, src-breasted-tr-ahmose, src-sethe-urk-deutsch-1914, src-lichtheim-ael2, src-aeo-lichtheim-page]
    basis: >
      Absence of a word from four translations. It does not show the signs lack the idea. Capped at provisional (absence_anchor). The Avaris-Hyksos identification rests on the editors' commentary (Breasted reads Manetho and Josephus; Sethe glosses in his notes), not on the speech.

  - id: ahmose-text-nubians-as-targets
    state: proposed
    statement: >
      The translations present the Nubian campaigns as campaigns against "Nubian Troglodytes" (Breasted, sections 14, 39 and 80) or "Nubian Bowmen" (Lichtheim and the web page; Sethe has "nubische Beduinen" and "nubische Nomaden"), with named places Khenthennofer and Kush, under Ahmose I, Amenhotep I and Thutmose I; captives and "female slaves" are taken (see ahmose-translations-sharuhen-and-nubia-captives).
      Breasted section 80 (and Lichtheim and Sethe at the corresponding passage) describe a Nubian leader hung head downward at the prow of the royal ship.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured."
    would_change_if: "the signs of the people-name are read and the terms (Troglodytes, Bowmen, nomads) turn out to render different words or one word with a different sense"
    anchor:
      type: interpretive
      description: "Read: Breasted 1906 sections 14, 39 and 80 (OCR; correction made 2026-10-16: section 81 is the Asiatic campaign to Retenu and Naharin, and holds neither the Troglodyte term nor the hanging), Sethe 1914 Urk. IV 5-9, Lichtheim p. 14 and the web page's translation. Davies 2009 (col. 35) confirms from the wall a hanging figure of 'the Nubian leader' with the king's arrow in his chest, as a determinative. The ethnonym itself was not read from the signs. Independence: Breasted, Sethe and Lichtheim translate the same text (Lepsius's copy, the Berlin squeeze and Sethe's edition), and the Ancient Egypt Online page is a copy of Lichtheim, so they are not independent confirmations of the signs. Labelled no for that reason: the label secondary needs agreement across independent sources."
      sources: [src-breasted-are2, src-sethe-urk-deutsch-1914, src-lichtheim-ael2, src-aeo-lichtheim-page, src-davies-2009]
    basis: "# V: read 2026-10-14 and 2026-10-16. Davies's note on column 35 is about a determinative; he does not discuss the ethnonym in the pages read."

  - id: ahmose-slave-name-list-urk-iv-11
    state: proposed
    statement: >
      A list of named slaves belongs to the inscription (Urk. IV 11, on the door wall). Lichtheim does not translate it ("not translated here"). Sethe's German translation (1914) gives it as personal names only (nine men and ten women; Breasted's note b to section 6 also says 9 men and 10 women),
      with Sethe's notes giving meanings for some: P3-mdj as "Der vom (nubischen) Stamme Matoi", one name as "Der Asiat", one as "Der von Abydos", and others as foreign names. The list does not say "Hyksos".
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    adoption_weight: null
    adoption_note: "Not measured; no popular account seen mentions the list."
    would_change_if: "the signs of Urk. IV 11 are transliterated and the names or their glosses differ, or the list is read in a source that discusses the origin of the named persons"
    anchor:
      type: interpretive
      description: >
        Read: Sethe 1914 translation volume, Urk. IV 11, section 11 b, OCR checked against the page image (the names and Sethe's footnotes 2, 3, 9 and 10 to 18); Lichtheim p. 12 (the sentence that the list is not translated); Breasted's note b to section 6 (the totals).
        The hieroglyphic list on the door wall was not read. The glosses are Sethe's; the reader did not check them.
      sources: [src-sethe-urk-deutsch-1914, src-lichtheim-ael2, src-breasted-are2]
    basis: "# V: read 2026-10-16. One editor's translation and glosses; the nineteen-person total agrees with Breasted's note. This list is the only place in the pages read where individual slaves are named."

  - id: ahmose-title-translations-differ-no-admiral
    state: proposed
    statement: >
      The title of Ahmose son of Ebana is rendered in several ways: "chief of the sailors" (Breasted, section 80: "One appointed me chief of the sailors"), "Oberste der Schiffsmannschaft" (Sethe 1914: "zum Obersten der Schiffsmannschaft gemacht"), "crew commander" (Lichtheim, copied on the web page: "crew commander";
      her introduction says "commander of a crew") and, from the wall, "commander of a ship's contingent" (Davies 2009: the principal figure is identified in the first column as "commander of a ship's contingent, Ahmose Son-of-Ibana, justified").
      None of these four renders the title line as "admiral". The word does appear in Sethe's editorial headings ("Lebensgeschichte des Admirals Ahmose", on his autograph pages and in the German volume) and in the title of Kammerzell 1988, "Texte aus dem Grab des Flottillenadmirals Ahmose", listed in Davies's bibliography (the work itself was not found or read).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: null
    adoption_note: "Not measured. 'Admiral' is in two editors' headings or titles that were read (Sethe; the Kammerzell title as listed); no popular account was read that uses the word."
    would_change_if: "the Egyptian title (which Davies transliterates hry-hnt, as read from the wall) is studied in a title-lexicon such as Schulman 1964 or Gnirs 1996 (both cited by Davies, not read) and shown to be the highest naval rank, or Kammerzell 1988 is opened and its basis for 'Flottillenadmiral' read"
    anchor:
      type: interpretive
      description: >
        Read: Breasted 1906 section 80 (OCR); Sethe 1914 Urk. IV 1 and 8 and his headings (OCR and page images of the autograph headings); Lichtheim p. 12 and p. 14 (OCR); the web page's translation; Davies 2009, section on the east and south walls (first column), note 10 (which lists the literature on the title, not read) and the bibliography entry for Kammerzell 1988.
        These are four scholars' renderings of one title line, plus one editor's heading; the signs were not read here.
        Independence: Breasted, Sethe and Lichtheim translate the same text (Lepsius's copy, the Berlin squeeze and Sethe's edition), and the Ancient Egypt Online page is a copy of Lichtheim, so they are not independent confirmations of the signs. Kept secondary because Davies's rendering is from the wall and is a separate source, but the other renderings are not independent of each other.
      sources: [src-breasted-are2, src-sethe-urk-deutsch-1914, src-sethe-urk-iv-heft1, src-lichtheim-ael2, src-aeo-lichtheim-page, src-davies-2009, src-kammerzell-1988]
    alternatives:
      - {text: "'Chief of the sailors' (Breasted) or 'Oberste der Schiffsmannschaft' (Sethe): a rank over crews", why_not_preferred: "not weighed against the others; none is checked against a title-lexicon"}
      - {text: "'Crew commander' (Lichtheim)", why_not_preferred: "not weighed against the others"}
      - {text: "'Commander of a ship's contingent' (Davies, for the title as written on the wall in the tomb's first column)", why_not_preferred: "Davies gives this for one title on the wall; whether it is the same title as the one in the narrative was not checked"}
      - {text: "'Flottillenadmiral' (the title of Kammerzell 1988, as listed)", why_not_preferred: "the work was not read, so the basis is unknown"}
    basis: >
      # V: read 2026-10-14 and 2026-10-16. The renderings may differ in emphasis rather than in fact. What would close it: the rank in the Egyptian navy structure from a title-lexicon, read. 'Admiral' is left open as a claim about the speaker's wording (see ahmose-sp-rose-to-admiral).

  - id: ahmose-sharuhen-duration-and-title-renderings-differ
    state: contested
    statement: >
      The translations disagree about the length of the siege of Sharuhen: Breasted renders "for 6 years" and says Lepsius had "5", Champollion's text and Brugsch had "6", and that his own check of the Berlin squeeze "has a clear '6'";
      Sethe's German (1914, Urk. IV 4) says "Man belagerte Šrḥn drei Jahre", Lichtheim says "three years" and the web page has the same wording.
