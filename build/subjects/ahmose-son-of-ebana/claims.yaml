  - id: ahmose-davies-reading-two-days-not-one-slave
    state: contested
    statement: >
      A published reading of column 27 of the inscription is disputed. The usual reading is "I brought his majesty back to Egypt in two days". An alternative, "I brought back one slave", has been proposed (Schulz 1995, as cited by Davies). Davies, who examined the wall, says the vertical sign is not 'slave' but 's' and reads "I brought them in two days to Egypt", with 'them' the people, cattle and prisoner of the preceding passage.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: null
