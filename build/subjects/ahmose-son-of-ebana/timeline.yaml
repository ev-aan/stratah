# Timeline data for the Ahmose son of Ebana dig. YAML is the source of truth; the diagram is generated by build/tools/render_timeline.py (never edit timeline.html by hand).
# Only the modern chain of copies, editions and translations is drawn. The campaigns and the carving have no absolute date in any source read (see claim ahmose-date-of-events-not-fixed:
# one article gives the accession of Ahmose I as 1550 to 1540 Cal BC, other authors 1580 to 1550; Davies dates the tomb decoration to the reign of Thutmose III on stylistic grounds).
# The renderer cannot draw years before the common era, so those are described in the notes and in the shared node ahmose-i-accession-window-fantuzzi, not as dots.
timeline:
  id: ahmose-son-of-ebana
  title: "The Ahmose son of Ebana autobiography: copies, editions and translations, 1842 to 2010"
  as_of: "2026-10-16"
  note: >
    Dates are years of the cited works as read. The text itself is carved in a tomb at El Kab; no source read gives an absolute date for it or for the campaigns it describes (reigns of Ahmose I, Amenhotep I and Thutmose I; tomb decoration in the reign
    of Thutmose III per Davies on stylistic grounds). Every dot is a work about the text, not the text. The Lepsius plate and Sethe's autograph are copies of the inscription, not the wall.
    Editions are drawn as documents, translations and reports as analysis.

panels:
  - id: copies
    title: "Panel A: Copies, editions, translations and reports, 1842 to 2010 (one tick per twenty years)"
    start: "1840-01-01T00:00:00Z"
    end: "2012-01-01T00:00:00Z"
    tick_years: 20
    lanes: [copies, translations, reports]

lanes:
  copies:       {label: "Copies of the inscription"}
  translations: {label: "Translations"}
  reports:      {label: "Reports and web pages"}

people:
  - {who: "R. Lepsius", detail: "Led the Prussian expedition of 1842 to 1845 whose drawn copy of the tomb text is Denkmaeler Abth. III Bl. 12 (title pages, per the dig's first pass)."}
  - {who: "J. H. Breasted", detail: "Translated the text in Ancient Records of Egypt II (1906) and says he collated the Berlin squeeze no. 172."}
  - {who: "K. Sethe", detail: "Edited the hieroglyphic text (Urk. IV 1-11, 1906) and published a German translation (1914)."}
  - {who: "M. Lichtheim", detail: "Translated the text in Ancient Egyptian Literature II (the printing Davies cites is 1976; the upload read is of a later edition)."}
  - {who: "W. V. Davies", detail: "Reported the British Museum survey of the tomb in 2009 (OLA 191), with corrected readings of some columns."}

sources:
  s_lepsius:  {title: "Lepsius, Denkmaeler aus Aegypten und Aethiopien, Abth. III Bl. 12 (Internet Archive)", url: "https://archive.org/details/denkmaler-aus-aegypten-und-aethiopien", authenticity: "authenticated, weak (a drawn copy; signs not read here)"}
  s_breasted: {title: "Breasted, Ancient Records of Egypt II (1906), Internet Archive OCR", url: "https://archive.org/details/ancient-records-of-egypt-vol-2-breasted", authenticity: "authenticated, moderate"}
  s_sethe_h1: {title: "Sethe, Urkunden der 18. Dynastie, Heft 1 (1906), Internet Archive", url: "https://archive.org/details/urkunden-der-18.-dynastie-erster-band", authenticity: "authenticated, moderate (hand-copied edition; numerals and headings read)"}
  s_sethe_de: {title: "Sethe, Urkunden der 18. Dynastie, uebersetzt (1914), Internet Archive", url: "https://archive.org/details/urkunden-der-18.-dynastie-i", authenticity: "authenticated, moderate"}
  s_lichtheim: {title: "Lichtheim, Ancient Egyptian Literature II (third-party upload on the Internet Archive)", url: "https://archive.org/details/MiriamLichtheimAncientEgyptianLiteratureVolII", authenticity: "unchecked (edition not identified; not a holder copy)"}
  s_davies:   {title: "Davies, The tomb of Ahmose Son-of-Ibana at Elkab (OLA 191, 2009), hosted PDF", url: "https://fundacionieae.es/wp-content/uploads/2024/11/The_tomb_of_Ahmose_Son-of-Ibana_at_Elkab-1_compressed.pdf", authenticity: "authenticated, moderate"}
  s_aeo:      {title: "Ancient Egypt Online, Ahmose son of Ebana (copyright J Hill 2010; two captures with different hashes)", url: "https://ancientegyptonline.co.uk/ahmoseebana/", authenticity: "unchecked"}

events:
  - {id: e1, panel: copies, lane: copies, time: "1849-01-01T00:00:00Z", end: "1859-12-31T00:00:00Z", precision: year, kind: document, status: single, sources: [s_lepsius],
     label: "1849-1859: Lepsius's Denkmaeler Abth. III Bl. 12 'El Kab Grab 5' (drawn copy from the expedition of 1842-1845)",
     detail: "The date is the printed span of the set, a proxy for publication. The plate was looked at in this dig; its signs were not read. Davies lists corrections to Lepsius's copy. Shared node ahmose-ebana-1849-lepsius-plate-ld-iii-12-el-kab-grab-5."}
  - {id: e2, panel: copies, lane: translations, time: "1906-03-01T00:00:00Z", precision: year, kind: analysis, status: single, sources: [s_breasted],
     label: "1906: Breasted's translation, Ancient Records of Egypt II (sections 1-16, 38-39, 78-82)",
     detail: "University of Chicago Press, March 1906 per the title page. Reads Lepsius and the Berlin squeeze; renders the Sharuhen siege as six years and the title as chief of the sailors."}
  - {id: e3, panel: copies, lane: copies, time: "1906-01-01T00:00:00Z", precision: year, kind: document, status: single, sources: [s_sethe_h1],
     label: "1906: Sethe's hand-copied hieroglyphic text, Urk. IV 1-11",
     detail: "Heft 1 of Urkunden der 18. Dynastie. Its autograph pages carry the German heading 'Lebensgeschichte des Admirals'. Only numerals and headings were read in this dig."}
  - {id: e4, panel: copies, lane: translations, time: "1914-06-01T00:00:00Z", precision: year, kind: analysis, status: single, sources: [s_sethe_de],
     label: "1914: Sethe's German translation of Urk. IV 1-11, with notes",
     detail: "Vorwort dated June 1914. Translates the slave-name list that Lichtheim omits, renders the Sharuhen siege as three years and the title as Oberste der Schiffsmannschaft."}
  - {id: e5, panel: copies, lane: translations, time: "1976-01-01T00:00:00Z", precision: year, kind: analysis, status: single, sources: [s_lichtheim],
     label: "1976: Lichtheim's translation, Ancient Egyptian Literature II (the printing Davies cites)",
     detail: "Date from Davies's citation (Lichtheim 1976: 13); the upload read here is of a later edition, not identified. Renders the title as crew commander and the Sharuhen siege as three years."}
  - {id: e6, panel: copies, lane: reports, time: "2009-01-01T00:00:00Z", precision: year, kind: analysis, status: single, sources: [s_davies],
     label: "2009: Davies reports the British Museum survey of tomb Elkab no. 5 (OLA 191)",
     detail: "Describes the tomb and the autobiography's 31 + 8 columns and gives corrected readings of some columns; the tomb is still described as incompletely published. Shared node ahmose-ebana-2009-davies-documents-tomb-ek5-at-el-kab."}
  - {id: e7, panel: copies, lane: reports, time: "2010-01-01T00:00:00Z", precision: year, kind: analysis, status: single, sources: [s_aeo],
     label: "2010: Ancient Egypt Online page copies the Lichtheim translation (copyright line 2010)",
     detail: "The web page's translation matches Lichtheim's book in the passages compared. The page's hash changed between two captures in October 2026."}
