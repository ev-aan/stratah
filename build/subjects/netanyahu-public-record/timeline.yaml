timeline:
  id: netanyahu-public-record
  title: 'Benjamin Netanyahu: dated records, 1996 to 2026'
  as_of: '2026-10-16'
  note: >-
    Every dot is a dated record from one or more documents read, with a link to the first source. Dots say what
    a document records; none says the matter is true. Times are UTC and are not meaningful where precision is day,
    month or year. Secondary sources (CRS) and unofficial reposts are marked by kind 'analysis' and status 'single'.
    Nothing here is assessed or ranked.
