subject: netanyahu-public-record
title: 'Benjamin Netanyahu: public record and public-cost data from primary documents'
question: >-
  What do primary public documents say about Benjamin Netanyahu's offices, election results, court records, own
  recorded statements and the public cost of the residences used by Prime Ministers?
dig_status: open
headline: 'Benjamin Netanyahu: offices, elections, court records, statements and public costs'
headline_status: draft
as_of: '2026-10-16'
search_summary: >-
  What do primary documents say about Benjamin Netanyahu's offices, election results, court records, own statements
  and the public cost of the residences used by Prime Ministers? This page lists what each document says, with its
  date, issuer and place, and states which documents could not be read: the Knesset's records, the Israeli courts'
  records and his personal financial disclosures.
description: >-
  A data page built from documents the builder opened and read: Central Elections Committee results for the 21st
  to 25th Knesset, State Comptroller reports (April 2024 on Prime Ministers' residences; May 2026 on the structure
  of government), the International Criminal Court's press release, decisions, judgments and party filings in the
  Situation in the State of Palestine, the President of Israel's office, the U.S. Congressional Record and UN General
  Assembly verbatim records for his addresses, and Congressional Research Service reports for the criminal case,
  which could not be read from Israeli sources. Every claim says what one document says, with its date. The page
  makes no assessment of the person, gives no motive and draws no conclusion from any figure. Where a record could
  not be opened, the page says so as a coverage fact.
divergence_note: >-
  This page does not measure what people believe about him and takes no position on any characterisation of him.
  Where two documents give different accounts of the same matter (the Court and Israel on jurisdiction; the Prosecution
  and Israel on the warrants; his statement on the ICC decision and the Court's release; the Comptroller's two periods
  for a total), both are stated with their sources and neither is preferred. The gap recorded is between what the
  documents state and what could not be read: the Knesset's own records, the Israeli court and Attorney General
  records of the criminal case, the General Assembly record of 2025, and any declaration of his assets. The Hebrew
  documents were read by the builder, a language model, and have not been checked by a Hebrew reader.
