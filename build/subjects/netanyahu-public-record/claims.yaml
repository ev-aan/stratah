  statement: >-
    A Government of Israel page, 'ICC's Lack of Jurisdiction', states: "Israel's position is that the ICC lacks
    any jurisdiction on this matter given, among other reasons, that no sovereign Palestinian state exists nor does
    any territory belonging to such an entity." The ICC's Pre-Trial Chamber I decision of 5 February 2021 (summarised
    on the ICC situation page and in ICC-01/18-374) held by majority that the Court's territorial jurisdiction in
    the Situation extends to Gaza and the West Bank, including East Jerusalem. The two positions are stated side
    by side.
  evidence_class: primary_text
  confidence: moderate
  statement_kind: reported
  evidential_weight: 3
  anchor_checked: secondary
  adoption_weight: 3
  adoption_note: >-
    Not measured. The field is required by the validator; for a record fact no poll or count of believers is used,
    so 3 is a stated placeholder (open decision for the owner).
  would_change_if: either party's published position changing
  anchor:
    type: primary_text
    description: >-
      Government of Israel page govextra.gov.il/foreign-affairs/icc/home, read in the stored extract. Read: "Israel's
      position is that the ICC lacks any jurisdiction on this matter given, among other reasons, that no sovereign
      Palestinian state exists nor does any territory belonging to such an entity.". ICC situation page (stored
      extract) read: "This followed Pre-Trial Chamber I's decision on 5 February 2021 that the Court could exercise
      its criminal jurisdiction in the Situation and, by majority, that the territorial scope of this jurisdiction
      extends to Gaza and the West Bank, including East Jerusalem.".
    sources:
