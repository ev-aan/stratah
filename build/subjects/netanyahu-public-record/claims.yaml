- id: np-gov-35-36-37-comptroller-2026
  state: established
  statement: >-
    A State Comptroller special report of May 2026 states that the 35th Government was headed by Benjamin Netanyahu
    and served from May 2020 to June 2021; that the 36th Government was headed by Naftali Bennett and Yair Lapid,
    from mid-2021 through the end of 2022; and that the 37th Government is headed by Benjamin Netanyahu, since the
    end of 2022. It also states that the coalition agreements for the 35th Government were signed in May 2020, for
    the 36th in June 2021 and for the 37th in December 2022.
  evidence_class: primary_text
  confidence: moderate
  statement_kind: reported
  evidential_weight: 3
  anchor_checked: primary
  adoption_weight: 3
  adoption_note: >-
    Not measured. The field is required by the validator; for a record fact no poll or count of believers is used,
    so 3 is a stated placeholder (open decision for the owner).
  would_change_if: >-
    the Knesset's or the Official Gazette's records giving different dates for the formation or end of any of the
    three governments
  anchor:
    type: primary_text
    description: >-
      State Comptroller of Israel, Special Report 75C, May 2026, English abstract (22 pages), read in full as a
      stored extract. Read: "their number peaked in the 35th Government, headed by Benjamin Netanyahu (which served
      from May 2020 to June 2021), declined somewhat in the 36th Government, headed by Naftali Bennett and Yair
      Lapid (from mid-2021 through the end of 2022), and increased again under the current government – the 37th
      Government, headed by Benjamin Netanyahu (since the end of 2022)" and, in the abstract: "For the formation
      of the 35th Government, headed by Benjamin Netanyahu, in May 2020, coalition agreements were signed between
      the Likud faction and several Knesset factions. For the formation of the 36th Government, headed by Naftali
      Bennett and Yair Lapid, in June 2021, coalition agreements were signed between the Yesh Atid faction and several
      Knesset factions. For the formation of the 37th Government, headed by Benjamin Netanyahu, in December 2022".
    sources:
    - src-mev-gov-structure-2026
    accessible: true
  basis: >-
    # V: report abstract read; the Knesset and Official Gazette records of the dates were not reachable. The report's
    subject is the structure of government (number of ministries); the dates are stated in passing. Day-level dates
    of swearing-in are not given by this source; see np-pres-37th-swearing-photo for 29 December 2022. The report's
    findings about ministries are not reproduced here.
