- id: np-court-hcj-3132-15
  state: proposed
  statement: >-
    An English translation of HCJ 3132/15, Yesh Atid Party v. Prime Minister (decided 13 April 2016), hosted by
    the Cardozo Law School Israeli Supreme Court Project, recites that on 14 May 2015, in presenting his new government
    before the Knesset, Prime Minister Benjamin Netanyahu assumed the roles of Minister of Foreign Affairs, Minister
    of Health, Minister of Communications and Minister of Regional Coordination, and that, following a judgment,
    he ceased to serve as Minister of Health, a deputy minister being appointed Minister of Health on 2 September
    2015. The translation's abstract says the petition challenged the Prime Minister's authority to serve simultaneously
    as a minister, and that the High Court (President Naor, with Deputy President Rubinstein and Justices Joubran
    and Hendel concurring, Justice Melcer dissenting) denied the petition, subject to a "warning of voidance" giving
    the Government eight months.
  evidence_class: primary_text
  confidence: moderate
