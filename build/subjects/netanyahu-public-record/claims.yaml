    so 3 is a stated placeholder (open decision for the owner).
  would_change_if: >-
    the Prime Minister's Office or the Government Press Office publishing a different text, date or place for the
    statement
  anchor:
    type: primary_text
    description: >-
      Embassy of Israel in Kathmandu, news page (stored extract). Read: "The antisemitic decision of the international
      court in The Hague is a modern Dreyfus trial, and it will end the same way. One hundred and thirty years ago,
      the French Jewish officer Alfred Dreyfus was falsely accused of treason by a biased French court."; "The decision
      to issue an arrest warrant against me, the democratically elected prime minister of the State of Israel, and
      our former defense minister was made by a rogue prosecutor who is trying to extricate himself from sexual
      harassment charges, and by biased judges who are motivated by anti-Semitic sentiments against the one and
