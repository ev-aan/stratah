    the residence in Caesarea in 2019, about NIS 19,097,000 for securing the private alternative residence on Azza
    Street and renting apartments for operational and security personnel in 2023, and about NIS 7,710,000 for securing
    additional residences in Caesarea and renting apartments for security personnel in 2023. A key-figures box in
    the same report gives NIS 26.8 million for the private residences on Azza Street and in Caesarea during his
    tenure as Prime Minister from December 2022 to November 2023, including about NIS 10.4 million on safety and
    security works on the balcony windows of the private residence on Azza Street.
