- id: np-pm-statement-icc-2024
  state: proposed
  statement: >-
    An Embassy of Israel (Kathmandu) news page, last updated 2 December 2024, carries a statement attributed to
    Prime Minister Benjamin Netanyahu responding to the ICC decision. It begins "The antisemitic decision of the
    international court in The Hague is a modern Dreyfus trial, and it will end the same way. One hundred and thirty
    years ago, the French Jewish officer Alfred Dreyfus was falsely accused of treason by a biased French court."
    It says "The decision to issue an arrest warrant against me, the democratically elected prime minister of the
    State of Israel, and our former defense minister was made by a rogue prosecutor who is trying to extricate himself
    from sexual harassment charges, and by biased judges who are motivated by anti-Semitic sentiments against the
    one and only Jewish state." and "Israel does not, Israel will not recognize the validity of this decision."
    It ends "Our enemies are your enemies, and our victory will be your victory, the victory of civilization over
    barbarism and tyranny".
