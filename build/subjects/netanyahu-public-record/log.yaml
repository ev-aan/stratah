    entry: >
      RULE REFINEMENT, recorded for transparency. The statement-quotation rule of L-02 was first drafted as 'the first two sentences and the last sentence as printed'. Before any claim text was written it was refined to 'the first two sentences and the last sentence before any closing thanks or stage direction', because several statements end only in thanks or applause, which carry no content (for example '[Applause, the Members rising.]').
      The refinement was made on the form of the endings, not on what any statement says, and is applied identically to all sixteen addresses. The sentence splitter is mechanical; two openings are mostly salutations and are quoted as printed. For the one statement where the sentence reporting the decision on the warrant is quoted in addition (np-pm-statement-icc-2024) the reason is stated in the claim.
