  - id: L-05
    date: 2026-10-16
    entry: >
      HOW DOCUMENTS WERE LOCATED. A web search engine restricted to official domains (icc-cpi.int, library.mevaker.gov.il, congress.gov, embassies.gov.il, president.gov.il and similar) was used to find the addresses of ICC court records, State Comptroller PDFs, CRS reports and embassy pages that the sites' own search pages did not give to this environment.
      Search results and their summaries were never used as anchors or as facts; every claim rests on a document that was downloaded, hashed and read. Some search summaries asserted facts (for example about dates of ICC filings and the content of a Prime Minister's statement) that were used only as pointers; where a summary was wrong or unsupported by the document opened, the document governs
      (for example, a search summary attributed a quotation about the pardon request to the Prime Minister that, in the page opened, is the President's). Wikipedia was not used. No news outlet was used as an anchor. Statements and filings relayed by news outlets (for example the Times of Israel headline cited in a CRS footnote) were not read.
  - id: L-06
    date: 2026-10-16
    entry: >
      EXTRACTS AND REDACTIONS. Raw downloads are kept outside the repository; the repository holds plain-text extracts made with pdftotext (-raw for most, -layout for the CRS excerpts) or a small stdlib HTML-to-text script, with control characters removed. Each extract has its own SHA-256 in the manifest; each source has the SHA-256 and size of its raw download.
      Redactions and trims, all declared in the extract headers: the ICC press release extract replaces a press-contact line (a staff member's name, telephone and e-mail) with a marker; the ICC-01/18-471-Anx1 extract keeps paragraphs 1 to 5 and 51 to 53 only and drops paragraphs 6 to 50, which relay media reports and allegations about named and unnamed persons who are not parties to the record;
      the Congressional Record, UN, CRS and Versa extracts keep only the passages used (the address, the statement, the excerpt) with the document's own heading data. Page furniture printed inside the UN and Congressional records (document symbol, date, page number) is left in the extract and shown as '[...]' where a quotation skips it.
  - id: L-07
    date: 2026-10-16
    entry: >
      QUOTE CHECK. Every passage that a claim quotes in its anchor description was passed through a script that requires it to occur, after collapsing whitespace, in the named stored extract (fragments joined by '[...]' must occur in order); a passage that did not match stopped the build. 223 passages in 67 claims; the list is in sources/QUOTECHECK.txt.
      A second heuristic check looked for the quoted passages of each claim's statement in that claim's stored sources and flagged 29 items; each flagged item was examined: they are the builder's own English glosses (not quotations), Hebrew list names whose internal quotation marks (gershayim) confuse the pairing, a hyphenation artifact ('Adelson-owned' is printed 'Adelson- owned' across a line break), a source misprint ('ofHungary’s') restored in the quotation, and nested quotation marks normalised to single quotes.
      build/tools/review_dig.py's own quote matcher reports many quotations from long extracts as 'not found' because its fuzzy index looks at a limited number of word positions; those reports were not treated as findings and the exact check above is the record. Neither check replaces opening the source; the reviewer is expected to do that.
