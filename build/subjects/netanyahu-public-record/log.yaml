      N7, RIGHTS. A short rights note is added to the manifest entry of every stored extract. Terms pages read on 2026-10-16: mevaker.gov.il/en/terms-of-use (State Comptroller reports may be copied and circulated free of charge for any purpose, in full or in complete sections, with the report's name and date noted and no changes other than technical ones); govinfo.gov/about/policies (works of the United States Government are in the public domain under 17 U.S.C. 105; Government publications may contain copyrighted material used with permission); versa.cardozo.yu.edu/terms-and-conditions (refers to the terms of Yeshiva University, which were not opened; the page footer prints a Cardozo School of Law copyright line). CRS: the document's own disclaimer, read, says CRS Reports are works of the United States Government and may be reproduced in their entirety, with a caution on third-party material. Terms pages that returned HTTP 404 or were blocked, and so were not read: the President's Office, the embassies site, the ICC and the United Nations documents site. Terms not read for the Central Elections Committee and the Government of Israel (govextra) pages. No extract was deleted.
