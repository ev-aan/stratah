subject: netanyahu-public-record
# Append-only. Corrections are new entries; earlier entries are never edited. Times are UTC. All requests went through the session's egress proxy (TLS re-terminated there; the origin certificate was not inspected).
log:
  - id: L-01
    date: 2026-10-16
    entry: >
      DIG OPENED by the builder agent at the owner's instruction "No spin, just data" for Benjamin Netanyahu. Scope approved by the owner: public record plus financial data. Public record means dated facts with sources: offices held and dates, election results,
      parliamentary votes where documented, court filings and rulings (indictment, proceedings, rulings, pardon-related filings) and his own recorded statements with source, date and place. Financial data means official disclosures, state comptroller and court-record figures, declared assets and funding records,
      from the primary document where reachable. Sources: English-readable primary documents only. A reviewer who has not seen this work will check it; the builder does not review itself and has not written review.yaml.
      An earlier Stage 1 design (eight claims, Hebrew sources, no finance, never committed) was read as a starting plan only. Nothing from it was reused without being re-fetched and re-read here: the five Central Elections Committee pages came back byte-identical (same SHA-256) to the Stage 1 copies;
      the ICC release and situation page were re-downloaded and had changed (living pages); the President's Office post of 29 December 2022 was re-read from its REST record.
  - id: L-02
    date: 2026-10-16
    entry: >
      SELECTION RULES, written before any statement or record was read for this dig. (1) Sources are the issuing bodies' own documents wherever reachable (Central Elections Committee, State Comptroller, ICC, UN, U.S. Government Publishing Office, the President's Office); where an Israeli primary source is blocked,
      a U.S. Congressional Research Service report is used and marked as a secondary account. (2) Statements: every address to a joint meeting of the U.S. Congress and every UN General Assembly general-debate statement that could be located in the official record; for each, the first two sentences and the last sentence before any closing thanks or stage direction are quoted, and nothing from the middle.
      (3) Courts: every public ICC record located that concerns the warrants or his name, quoting each record's own disposition and its parties' stated requests side by side. (4) Money: where a figure is stated for him, the same measure for the other office-holders in the same document is stated beside it (Bennett and Lapid in the Comptroller's report).
      (5) An accusation, a draft, a request or a party filing is recorded as such and never as a finding. (6) No motive, characterisation or implication is stated by this page. Absence is recorded only as what was searched and not reached or not found (capped at provisional).
