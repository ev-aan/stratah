      PASSAGES DELIBERATELY NOT REPRODUCED, for the neutrality rule (no motive, no belief counts). Two clauses of Congressional Research Service text were left out of the quoted passages and the omission is stated in the claims: the clause of IN11068 that gives a reason for the timing of the April 2019 elections (a stated motive), and the poll figure on whether he should resign in R44245 v66 (a count of opinion, which carries no weight here).
