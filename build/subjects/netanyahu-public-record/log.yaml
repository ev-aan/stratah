    entry: >
      HEBREW. The Central Elections Committee pages, the President's Office posts of 2022-12-29 and 2026-05-13 and the embassy announcement on the 26th Knesset election are in Hebrew. The builder, a language model, read them; the claims quote the Hebrew as printed and add English glosses marked as the builder's (source tr-hebrew-glosses, authenticity unchecked).
      No Hebrew reader has checked list names, glosses or the Hebrew quotations. Hebrew documents the builder could not or did not open (Knesset, courts, gov.il) are listed as not read in the gap claims; nothing is said about their content. The State Comptroller's full Hebrew reports were not opened; only the English abstracts were.
  - id: L-11
    date: 2026-10-16
    entry: >
      SYMMETRY CHECK, as the owner's neutrality instruction requires. Records adverse to him are stated (ICC press release, decisions and the Court's own findings; CRS's description of the allegations; the Comptroller's findings about the Caesarea security measures and the summary statements). Records favourable to or in the interest of him or of Israel are stated at equal length: the Appeals Chamber's reversal of 24 April 2025; the Court's own statement that the Article 19(2) decision dealt only with timing; Israel's filings and the Prosecution's responses side by side;
      the Government of Israel's position page; his own statements with the same quotation rule; the Comptroller's remarks on other Prime Ministers beside his; the High Court of Justice decision HCJ 3132/15 (in translation) denying a petition against his holding more than one portfolio. Where the documents describe the same fact differently the page shows both and does not choose. The balance of the page reflects which documents were reachable, not a selection by content; the gap claims list what was not reachable on either side
      (for example the Attorney General's announcements and the indictment, which could add detail to the criminal case, and the Knesset's records).
