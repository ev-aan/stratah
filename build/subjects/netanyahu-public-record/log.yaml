  - id: L-14
    date: 2026-10-16
    entry: >
      FIX ROUND opened after an independent review of commit afb09eb (reviewer findings B1 to B3 and N1 to N7). Corrections below are new entries; earlier entries and ids are unchanged.
      B1, EXTRACT ORDER. The stored extracts of UN verbatim records A/67/PV.12 and A/68/PV.23 had been made with pdftotext -raw, which jumps between the two printed columns of those pages and skipped and misordered text. The opening of the 2012 address in the claim np-stmt-unga-2012 was therefore wrong. Both extracts were regenerated from the PDF with each page cropped into a left and a right half, read left then right (A/67/PV.12 about 20.6 KB; A/68/PV.23 about 20.1 KB), and their SHA-256 values in MANIFEST.yaml were updated. As printed, the 2012 address opens with the two sentences "It is a pleasure to see the General Assembly presided over by the Ambassador [page footer skipped] from Israel, and it is good to see all of the representatives here." and "Three thousand years ago, King David reigned over the Jewish State in our eternal capital, Jerusalem." The claim now quotes those; the 2013 claim was rebuilt from the regenerated extract (its opening and closing were checked and are unchanged in substance). QUOTECHECK.txt was regenerated.
      RE-CHECK OF ALL PDF-DERIVED EXTRACTS, 34 in number (13 ICC court records, 4 Congressional Record addresses, 12 UN records, 2 State Comptroller abstracts, 3 CRS documents). For each, every sentence of 40 characters or more in the stored extract was looked for, in order, in four renderings of the raw PDF (pdftotext -layout; default reading order; page cropped into 2 columns; into 3 columns), counting sentences found and inversions of order. Result: no further misordering or truncation was found. Only A/67/PV.12 and A/68/PV.23 had been wrong. For A/67/PV.12 the 2-column rendering finds all 184 sentences with 0 inversions (the default reading order shows 35 inversions, which is why -raw failed). For the other eleven UN records the best rendering finds all but 6 to 10 of the 74 to 226 sentences, with 0 or 1 inversion; the sentences not found differ from the rendering by a few words, where a printed page header or footer falls inside them, and the one inversion in each is the President's repeated welcoming introduction sentence, which occurs twice in the record. ICC records: 0 inversions in the layout rendering for 10 of 13; 1, 1 and 3 in ICC-01/18-422, -423 and -431, which on inspection are sentences or footnote citations that occur more than once in the document, so the search finds the first occurrence (not an ordering error). Congressional Record: 0 inversions (default reading order). Comptroller abstracts: 0 and 1 inversion (a sentence that occurs both in the summary and in the body). CRS: 0 inversions (the earlier head-of-document and excerpt duplication in the v66 extract no longer arises after the v66 extract was re-made). The 15 extracts that were made from HTML or JSON pages (Central Elections Committee, President's Office, embassies, Government of Israel, ICC press release and situation page, Cardozo) are not paginated PDF text and were not subject to this test.
