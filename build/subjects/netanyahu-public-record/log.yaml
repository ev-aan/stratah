    entry: >
      ARITHMETIC AND INTERNAL-CONSISTENCY TESTS RUN (recorded in the manifest as tests). Central Elections Committee pages: seats sum to 120, valid votes sum to the page total and the Likud share recomputes, on all five. State Comptroller April 2024: the Netanyahu items sum to the stated NIS 27.8 million (960,000 + 19,097,000 + 7,710,000 = 27.77 million) and the 2023 items to the stated NIS 26.8 million (26.81 million); the three Prime Ministers' figures sum to about NIS 56.3 million against NIS 56 million;
