  - id: L-11
    date: 2026-10-16
    entry: >
      CORRECTION TO L-09 and a point from a second reading of Breasted vol. III section 588. L-09 said the speaker's 'at least three groups were circumcised' (dh-wbdnR9qs9MU-43) was not made a separate claim. It now is: sp-43b-three-groups-circumcised, state contested.
      Reason: in Breasted's printed list heading the phrase 'who had no foreskins' follows three names (Sherden, Shekelesh, Ekwesh), although his note a applies it to the Ekwesh alone; Muller (1893, p. 358) reads the raiders as a body as lacking krn't and as not circumcised. No source read counts three circumcised peoples. This heading was not mentioned in the first pass.
      Also in this entry: the first-pass text said 'one group from the Aegean' for the Ekwesh; the Aegean origin of the Ekwesh is Breasted's 'not impossibly the Achaeans' and is not in the Egyptian text. Also, Edgerton and Wilson print a plate 44 text with three names (Peleset, Denyen, Shekelesh; note 15a: 'Only 3 names here, but 5 names in Pl. 46:18'); the confederation count of five rests on plate 46 line 18 and Breasted section 65.
  - id: L-12
    date: 2026-10-16
    entry: >
      SECOND FIX ROUND, after an independent review of commit 68a1787. Corrections by new entry; earlier entries are not edited.
      (a) Softening of L-08(c): L-08(c) said the first pass was wrong that Muller reads krn't as 'horn'. More exactly: Breasted's note attributes 'krnt = horn = phallus' to Muller's 1888 article in the Proceedings of the Society of Biblical Archaeology, which was not opened; Muller's 1893 book, read here (p. 358), differs from Breasted's report of the 1888 article in saying the sea raiders were not circumcised. The two Muller texts may differ in what they argue; that was not checked.
      (b) Breasted's position on the circumcision wording is now stated in full in sp-41c1 and sp-43b: besides note a (the phrase 'who had no foreskins' belongs to the Ekwesh), his note on 'phalli with the foreskins' says krn't 'is something which the Sherden and the other allies did not have (l. 54)' and that 'foreskin' is 'very probable'. L-11 gave only the first. Neither Breasted nor Muller counts three circumcised groups; the speaker's 'three' matches the three names printed before the phrase in the list heading.
      (c) anchor_checked is now 'no' on sp-year8-names-five-peoples (weight lowered from 3 to 2), sp-nine-bows-stock-phrase, sp-39b2-took-prisoners and sp-41a1-denyen-captured, whose own text says the sources are not independent (Edgerton and Wilson revise Breasted). 'secondary' stays on sp-nine-names-across-two-reigns, sp-40e and sp-oxit18b, which use Cline 2015 as a second, modern reading, with the limits stated in each claim.
      (d) absence_anchor: true added to sp-nine-bows-stock-phrase (the absence part of its statement, which also underlies the draft headline), sp-40b, sp-41a2, sp-41a4, sp-oxit18a and sp-oxit18c.
      (e) sp-year5-peleset-line-renderings: Muller's p. 360 is now cited only for the active rendering ('die verheerten ihr Land'); in the passage read he does not date the line or mention the Libyans. 'Victims' is attributed to Moreu alone, not to Edgerton and Wilson. Wuthrich-Matic and Ben-Dor are known only from Moreu's quotation and are no longer listed among the anchor sources.
      (f) sp-year5-sea-peoples-with-libyans: Maspero (following Chabas), as reported in Breasted's section 44 note, added as a holder of the year 8 reference (Maspero and Chabas not opened); Moreu's 'year 5 line' now says Ramses III year 5.
      (g) sp-41d2-hebrews: discloses Breasted's cross-references 'See Israel passage, III, 604' in the notes to sections 39 and 58 of the Ramses III year 5 inscription.
      (h) Assessment basis now also lists sp-40d, sp-41b2, sp-43b, sp-year5-peleset-line-renderings and sp-nine-bows-stock-phrase. Node medinet-habu-ramses-iii-year-8-inscription is rev 3, with the plate list reworded (plates 36 and 41 are titled with Sea Peoples subjects in the OIP 8 list; plate 40 analyses a ship). The Muller extract now starts with the sentence rebutting Brugsch's 'circumcised Colchian' claim.
