    date: 2026-10-16
    entry: >
      WHAT CHANGED IN claims.yaml. Bundled speaker claims were split into one assertion per claim, in the speaker's wording, each with one anchor. Retired ids and where their parts went:
      sp-39b-defeated-prisoners-recorded -> sp-39b1-fought-and-defeated, sp-39b2-took-prisoners, sp-39b3-recorded-names-of-peoples.
      sp-40-hittites-biggest-force -> sp-40a-hittites-biggest-force, sp-40b-peoples-of-modern-turkey, sp-40c-peoples-of-greece, sp-40d-peoples-of-rome, sp-40e-isles-and-crete.
      sp-41a-denyen-akeshi-captured -> sp-41a1-denyen-captured, sp-41a2-denyen-danaans, sp-41a3-denyen-tribe-of-dan, sp-41a4-akeshi-ekwesh-captured.
      sp-41b-castration-vs-hands -> sp-41b1-castrated, sp-41b2-hands-cut-off-instead. sp-41c-aegean-group-circumcised (which also folded in dh-wbdnR9qs9MU-43's 'three groups') -> sp-41c1-aegean-group-circumcised; the 'three groups' wording is not made a separate claim in this pass because no source read carries a count of circumcised groups (open item).
      sp-41d-only-israel-circumcised-hebrews -> sp-41d1-only-israel-circumcised, sp-41d2-hebrews. sp-43a-return-and-200-miles -> sp-43a1-came-back, sp-43a2-200-miles-inland.
      sp-oxit15-nine-bows-hittite-1300-1150 -> sp-oxit15a-dates-1300-1150, sp-oxit15b-nine-bows-confederation, sp-oxit15c-organized-by-hittites, sp-oxit15d-attacked-egypt-and-lost.
      sp-oxit16-denen-shardana -> sp-oxit16a-denen-and-shardana, sp-oxit16b-danaans-or-denenians. sp-oxit18-peleset-philistines -> sp-oxit18a-peleset-arrived-canaan-1175, sp-oxit18b-peleset-are-philistines, sp-oxit18c-peleset-not-indigenous, with the translation dispute in a separate claim sp-year5-peleset-line-renderings.
      sp-karnak-names-and-circumcision -> sp-karnak-names-merneptah-year5 (the circumcision wording moved into sp-41b2 and sp-41c1). New claims: sp-year5-sea-peoples-with-libyans, sp-sea-peoples-scene-hands-and-branding, sp-nine-names-across-two-reigns, sp-nine-bows-stock-phrase.
      Every claim whose support is 'not found in the passages read' now carries absence_anchor: true. Single-translator claims that were marked secondary are now marked no; secondary is kept only where two or more renderings by different scholars were read (the second not always independent; the claim says so). Adoption weights that cited 'popular accounts' no one read are 1 with 'not measured'; adoption weights above 1 name the one article read.
      Added a headline (draft), headline_claim, an assessment with three key points and would_settle, timeline.yaml, a taxonomy proposal for the owner (PROPOSED_TAXONOMY.yaml; build/taxonomy.yaml was not touched) and a manifest that lists each OCR or PDF text layer as its own entry with derived_from.
      Evaluative lines in the first claims (for example 'fits that part of the speaker's claim', 'a premise nothing here supports', 'only the last part has a basis') were replaced by statements of what each passage says and what was not found. The shared node medinet-habu-ramses-iii-year-8-inscription got rev 2 narrowing the plate range.
