      (3) Muller, Asien und Europa (1893, Archive OCR of the Toronto copy, sha256 13b2c032...): pp. 355-360 read in German, rest searched. (4) Cline 2015 read in full (sha256 4e81ac2a... unchanged). (5) Moreu 2023 read again (sha256 610b2bc5... unchanged). (6) OIP 8 PDF re-downloaded (sha256 e0e6447a... unchanged); plate 42 (pdf p.113) opened as a page image and its caption read; the plate 47 caption page read (47 C, 'A Sherden warrior in action', detail from the scene on plate 18).
      Breasted vol. III (sha256 4fd049a4... unchanged) sections 570, 574, 579, 587-588 were re-read for quotations. The Archive item for Ancient Records vol. I returned HTTP 500 on re-download; the first-pass hash stands and was not re-checked.
