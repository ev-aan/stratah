  - id: L-08
    date: 2026-10-16
    entry: >
      CORRECTIONS TO EARLIER ENTRIES (earlier entries are not edited). (a) L-03 and the first manifest said the ISAC page for SAOC 12 gave no PDF link and the PDF was not fetched. That was wrong: the correctly titled ISAC page (historical-records-ramses-iii-texts-medinet-habu-volumes-i-and-ii-translated) links https://isac-assets.s3.amazonaws.com/isac-publications/saoc12.pdf, which was fetched and read in this pass (L-07). The first pass had used a differently titled page found by search.
      (b) L-03 and the first manifest named 'Muller 1888'. The book read is Muller, Asien und Europa, 1893 (Archive item record); Breasted cites a 1888 article in the Proceedings of the Society of Biblical Archaeology for the krn't argument, and that article was not opened.
      (c) L-05 and the first claims said Muller reads krn't as 'horn' (phallus), relying on Breasted's report. Muller's own p. 358 (read now) says the sea raiders were not circumcised and the inscription says the opposite, and that the hands were taken because they had no krn't. Claims sp-41c1 and sp-41b2 now record both readings.
      (d) L-04 and the first manifest said 'what the donors stood to gain' and 'what Breasted, Moreu and Cline stood to gain' were unresearched. That wording framed motive and is withdrawn. The open tasks are: funding statements, grants and publisher of the works read were not traced, and whether the donors named in the OIP 8 foreword had any say in what was published was not traced. The first manifest also said Breasted 'directs the institute that publishes'; the pages read show only that he edits the series and signed the foreword. His office is not stated in the pages read, and the claim is removed. The Rosenwald gift is now quoted from the foreword ('the enlargement of the headquarters and especially ... the erection of a library building').
      (e) Several first-pass claims used a bare 'year 5' for Merneptah's campaign and a different reading of Ramses III. Merneptah year 5 (the Karnak inscription, vol. III) and Ramses III year 5 (the Libyan war inscription in the second court, vol. IV sections 36-58) are different events in different reigns, and are now named in full everywhere.
