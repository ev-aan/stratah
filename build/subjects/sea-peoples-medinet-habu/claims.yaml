subject: sea-peoples-medinet-habu
title: "Sea Peoples at Medinet Habu and the Karnak inscription of Merneptah: what the texts and reliefs show, and what the speaker adds"
question: "Which peoples do the Egyptian records name, what happened to the prisoners, and what do the Medinet Habu reliefs show?"
dig_status: open
headline_status: draft
headline: "Egyptian texts list five Sea Peoples per reign, nine in all; no list is called Nine Bows"
headline_claim: sp-nine-names-across-two-reigns
search_summary: >
  Two Egyptian records are involved: Merneptah's Great Karnak Inscription (Merneptah year 5, against Libyans and 'Northerners') and the texts and reliefs of Ramses III at Medinet Habu (Ramses III year 5, against Libyans; Ramses III year 8, against the Northerners).
  In the translations read (Breasted 1906; Edgerton and Wilson 1936) the Karnak text names Ekwesh, Teresh, Luka, Sherden and Shekelesh, and the Ramses III year 8 text names Peleset, Thekel, Shekelesh, Denyen and Weshesh.
  These are translations, not the signs. The signs and the walls were not read. Speaker claims are split into one assertion each and weighed; the videos are never an anchor.
description: >
  Sources read: the Epigraphic Survey's OIP 8 (1930) front matter, list of plates and five plates (drawings and photographs; signs not read), Breasted's Ancient Records of Egypt vols. III and IV (1906) in Internet Archive OCR including the Ramses III year 5 sections 36-58,
  Edgerton and Wilson's Historical Records of Ramses III (SAOC 12, 1936) for the main Sea Peoples texts, Muller's Asien und Europa (1893) in part, and two modern articles (Moreu 2023; Cline 2015 in full).
  Not read: the hieroglyphic text, Kitchen's Ramesside Inscriptions, Ben-Dor 2015, Wuthrich and Matic 2023, any chronology beyond Cline, the walls. Funders and publishers of the works read are not traced beyond what a source states.
divergence_note: >
  The speaker version describes one 'confederation of nine peoples', called the Nine Bows, organised by the Hittites, with castration, circumcised prisoners and a return invasion '200 miles inland', and calls a circumcised Aegean group Hebrews.
  In the translations read: the Nine Bows is a stock phrase for Egypt's enemies and sits next to separate lists of five named peoples; nine distinct names appear only when the Merneptah year 5 list and the Ramses III year 8 list are counted together (Cline 2015 counts nine).
  The Kheta (Hatti) are listed among lands that could not stand before the Northerners in the Ramses III year 8 text. Merneptah year 5 and Ramses III year 5 are different events: Breasted reads the Ramses III year 5 inscription as already naming sea peoples beside the Libyans, and Edgerton and Wilson print the same lines under the heading of the northern war usually dated to year 8.
  The circumcision passage is in Merneptah's Karnak text and concerns the Ekwesh; Breasted (1906) and Muller (1893) read the word differently. No passage read mentions castration of prisoners, Hebrews, or a 200-mile devastation.
  None of this was checked against the signs.

assessment:
  question: "Do the Egyptian records read here support the speaker's account of a nine-people 'Nine Bows' confederation, organised by the Hittites, whose prisoners were castrated or circumcised Hebrews?"
  answer: partly
  headline: "Partly: the records read support northern peoples defeated, prisoners taken and hands counted, but not a Hittite-organised nine-people confederation, castration or Hebrews."
  key_points:
    - "Supported in the translations read: victory claims over named northern peoples in two reigns, with prisoners, counted hands and nine names across both lists."
    - "Not found in the passages read: a Hittite organiser, Rome, castration, Hebrews or a 200-mile devastation; the Kheta are listed among lands wasted or cut off."
    - "Open: translators differ on the Peleset line of Ramses III year 5 and on the circumcision word in Merneptah year 5; no hieroglyphic sign was read here."
  text: >
    The speaker's account joins two reigns. Merneptah's Great Karnak Inscription (Merneptah year 5) names Ekwesh, Teresh, Luka, Sherden and Shekelesh as Northerners with the Libyans. The Ramses III year 8 inscription names Peleset, Thekel, Shekelesh, Denyen and Weshesh as the confederation.
    Counting the names of both lists gives nine (one name, Shekelesh, is in both), which is how Cline 2015 counts. The Egyptian phrase 'Nine Bows' is, in every passage read, a stock expression for Egypt's enemies. Edgerton and Wilson (1936) say their work is a revision and amplification of Breasted's translations, so their agreement with Breasted is not two independent confirmations.
    In the Ramses III year 8 text the Hatti (Kheta) are one of the lands that 'could not stand' before the Northerners (Breasted: 'they were wasted'; Edgerton and Wilson: '(but they were) cut off'). Cline 2015 says the Sea Peoples 'may have been as much victims as oppressors'; Moreu 2023 argues the five peoples of year 8 were victims and that Mycenaean Greeks and proto-Phrygians were the invaders. None of the three sources read names the Hittite state as organiser.
    Prisoners and hands: Ramses III's scenes show prisoners and severed hands. Edgerton and Wilson describe a Sea Peoples scene (plate 42) with two piles of hands and prisoners branded on the shoulder, and a Libyan victory scene with hands and phalli (plate 23). No passage read says prisoners were castrated.
    The Ekwesh passage in Merneptah's Karnak text says the Ekwesh 'had no foreskins', which Breasted reads as circumcised; Muller (1893) says the inscription says the opposite of the pirates having been circumcised. The speaker's 'three groups' and 'Hebrews' are not in any text read.
    Weights stay low because every claim rests on translations, none on the signs, and several rest on one translator.
  basis: [sp-nine-names-across-two-reigns, sp-year8-names-five-peoples, sp-karnak-names-merneptah-year5, sp-40a-hittites-biggest-force, sp-41b1-castrated, sp-41c1-aegean-group-circumcised, sp-41d2-hebrews, sp-43a2-200-miles-inland]
  would_settle: "A reader of Egyptian comparing the signs of OIP 8 plates 27-28 (Ramses III year 5), 42, 44 and 46 and Merneptah's Karnak lines 52-56 with Kitchen's RI IV and V and Wuthrich and Matic 2023; and a dated chronology for the two reigns."

claims:

  # ------------------------- THE OBJECTS AND WHAT WAS SEEN -------------------------

  - id: sp-oip8-plates-seen
    state: proposed
    statement: >
      OIP 8 prints facsimile drawings and photographs of Ramses III's Medinet Habu walls, including Sea Peoples scenes: plate 46 'The Inscription of the Year 8' (drawing), plate 42 'Ramses III celebrating his victory over the Sea Peoples', plate 44 'Ramses III presenting captives of the Sea Peoples to Amon and Mut', plate 53 A and B 'The branding of prisoners' and 'Egyptian scribes recording prisoners' (details from the scene on plate 42), and plate 54 A 'A pile of lifeless hands severed from the enemy' (detail from the scene on plate 23, which the list of plates titles 'Ramses III celebrating his victory over the Libyans').
    statement_kind: reported
    evidence_class: material
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured: no popular account of these plates was read."
    would_change_if: "the plates are compared with the wall or another recording and the captions or scene assignments are wrong, or plate 23 is opened and shows another subject"
    anchor:
      type: material
      description: >
        Opened and looked at in the OIP 8 PDF: plate 42 (pdf p.113), plate 44 (p.117), plate 46 (p.121), plate 53 (p.135), plate 54 (p.137), and read the printed captions and the list of plates. The images are modern drawings and photographs of the wall, not the wall.
        On plate 42 the drawing shows a large figure of the king at right with columns of text above, a chariot at left, a row of figures and, in a lower register, rows of seated and standing figures; the printed caption is 'Ramses III celebrating his victory over the Sea Peoples'.
        On plate 54 A a heap of carved hands is shown; on plate 53 A and B carved rows with vertical marks and, in B, figures and a framed block that the caption calls scribes. 'Branding' and 'scribes' are the captions' words, not read from the pictures here. No hieroglyphic sign was read.
      sources: [src-oip8]
      nodes: [{node: medinet-habu-ramses-iii-year-8-inscription, verb: supports}]
    basis: >
      # V: plates 42, 44, 46, 53, 54 viewed as images and captions read, 2026-10-14 and 2026-10-16. One source (the Survey's own volume). Not anchor_checked primary: the wall itself was not seen and no signs were read.
      The editors' foreword (read) credits the artist Bollacher with 'discovery of prisoners being branded with a hot iron (Plate 53, A)'; that is the editors' report about their own drawing and photograph.

  - id: sp-oip8-hands-in-libyan-scene
    state: proposed
    statement: >
      The pile of severed hands photographed in OIP 8 plate 54 A is captioned as a detail from plate 23, the scene titled 'Ramses III celebrating his victory over the Libyans'. Edgerton and Wilson describe plate 23 as 'the counting of three piles of hands and one of phalli' before 'four lines of Libyan captives'.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "plate 23 is opened and shows another subject, or the wall differs from the caption and description"
    anchor:
      type: interpretive
      description: "OIP 8 list of plates (entries 23 and 54 A) and the caption on plate 54 (read); SAOC 12 plate 23 description, printed page 14 (read in the PDF text layer). Plate 23 itself was not opened."
      sources: [src-oip8, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf]
    basis: >
      # V: caption and list read; SAOC 12 description read 2026-10-16. Two books by the same expedition, so one tradition rather than two independent reads.

  - id: sp-sea-peoples-scene-hands-and-branding
    state: proposed
    statement: >
      Edgerton and Wilson (1936) describe the Sea Peoples scene on plate 42 as one in which 'Scribes record the numbers in two piles of severed hands' and captives 'are led up to two officials, who brand them on the shoulder'. Breasted (1906, section 76) describes officials superintending 'the counting of the hands severed from the fallen of the enemy' in a year 8 scene before Peleset prisoners, recorded 'by four scribes'.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "the wall or a collation shows the scene on plate 42 has no hands or no branding, or Breasted's section 76 scene is a different scene from plate 42"
    anchor:
      type: interpretive
      description: "SAOC 12 plate 42 description (printed page 42, read in the PDF text layer); Breasted vol. IV section 76 (read in the OCR); OIP 8 plate 42 page image (viewed, caption read, hands and branding not distinguished by this session) and plates 53 A and B captions."
      sources: [src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf, src-breasted-are4, src-breasted-are4-ocr, src-oip8]
    basis: >
      # V: both descriptions read 2026-10-16. Breasted (1906) and Edgerton and Wilson (1936) are not independent (the later is a revision of the earlier). The description is the translators' of a wall they worked at; it was not checked against the wall.

  - id: sp-year5-sea-peoples-with-libyans
    state: contested
    statement: >
      Breasted (1906) reads the Peleset-and-Thekel line of the Ramses III year 5 inscription (the Libyan war inscription in the second court at Medinet Habu) as showing sea peoples already fighting beside the Libyans in Ramses III's fifth year. Edgerton and Wilson (1936) print the same lines under the heading 'the Northern War, traditionally dated by Egyptologists to the year 8', and say the inscription 'bears the date "year 5"' yet 'contains also a record of events which we usually date "year 8."'
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "the signs or Kitchen RI V show the passage belongs to the Libyan war of Ramses III year 5, or to the northern war of year 8, or the inscription is composed in two stages"
    anchor:
      type: interpretive
      description: >
        Breasted vol. IV section 44 and its notes (read in the OCR): 'in an inscription of the year 5 it can only refer to the Libyan war of that year; and ... we must conclude that the sea-peoples already assisted the Libyans in this war', and 'This is again rendered evident by the hands cut off as trophies as in the Libyan war of Merneptah. Had there been only Libyans in the battle, we should have had only phalli.'
        Breasted section 52 describes 'five rows of captive Libyans and sea-peoples' with 'severed hands and phalli', in a Ramses III year 5 relief. Section 59: 'Already in Ramses III's fifth year' maritime peoples 'had sent some of their advanced galleys to assist the Libyans'.
        SAOC 12 plates 27-28 description (printed page 19; the analysis with 'll. 51-59' is on page 20): the inscription 'bears the date "year 5." Yet an analysis of its contents makes it apparent that it contains also a record of events which we usually date "year 8"', with 'll. 51-59: the Northern War' in the analysis.
      sources: [src-breasted-are4, src-breasted-are4-ocr, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf]
    positions:
      - label: "Sea peoples were already with the Libyans in Ramses III year 5"
        holder: "Breasted 1906, vol. IV sections 44 (note), 52 and 59 (read)"
        ground: "the Peleset line sits in an inscription dated year 5; hands cut off as trophies in the relief; Breasted's own wording"
      - label: "The Northerners passage in the year 5 inscription records events usually dated year 8"
        holder: "Edgerton and Wilson 1936, plates 27-28 description (read)"
        ground: "analysis of the contents of the inscription"
    disputed_by:
      - {who: "Edgerton and Wilson 1936 (a revision of Breasted's translations)", kind: work, position: "the inscription dated year 5 also records events usually dated year 8", source_read: true, via: src-edgerton-wilson-1936}
    next_step: "Read Kitchen RI V and the year 5 and year 8 texts in the signs; check whether any other source separates the two campaigns."
    basis: "Two readings by the same school, one of which revises the other. This is a different question from Merneptah year 5 (Karnak), which is a different reign and is not in play here."

  - id: sp-medinet-habu-location-year8
    state: proposed
    statement: >
      Breasted (1906) places the year 8 inscription on the front of the north tower of the second pylon of Ramses III's temple at Medinet Habu on the west bank at Thebes (Luxor) and the naval scene on the outside north wall; Edgerton and Wilson (1936) give plate 46 as 'Great Temple, interior, first court, west wall, north of great doorway'. Cline 2015 gives 1177 BC for Ramses III year 8; no chronology other than Cline's was read.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 2
    adoption_note: "1177 BC is stated in one popular-press article read (Cline 2015); extent of use not measured."
    would_change_if: "a chronology of the Twentieth Dynasty is read and puts Ramses III year 8 elsewhere, or Porter and Moss or Kitchen give another wall position"
    anchor:
      type: interpretive
      description: "Breasted 1906 vol. IV footnote ('Occupying the entire front of the north tower of the second pylon in the Medinet Habu temple') and notes to sections 74-76 ('Outside north wall of second court'); SAOC 12 plate 46 footnote (printed page 49); OIP 8 plate 46 caption 'The Inscription of the Year 8'; Cline 2015 p. 67 ('in the eighth year of Ramses' reign, 1177 bc'). Breasted and Edgerton and Wilson count the courts differently; this session did not reconcile them. Coordinates from OpenStreetMap Nominatim (orientation only)."
      sources: [src-breasted-are4, src-breasted-are4-ocr, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf, src-oip8, src-cline-2015, src-nominatim]
      nodes: [{node: medinet-habu-ramses-iii-year-8-inscription, verb: supports}]
    basis: "The wall position is agreed in sense by two translators of one tradition; 1177 BC rests on one article. No chronology was read."

  # ------------------------- NAMES IN THE TEXTS (as translated) -------------------------

  - id: sp-year8-names-five-peoples
    state: proposed
    statement: >
      In Breasted's 1906 translation of Ramses III's year 8 inscription the invaders' 'main support' is five named peoples: Peleset, Thekel, Shekelesh, Denyen and Weshesh (section 65), and Edgerton and Wilson (1936, plate 46 line 18) read 'Their confederation was the Peleset, Theker, Shekelesh, Denye(n), and Weshesh, lands united'. Captives over two lines of a prisoner scene are labelled 'the vanquished of Denyen' and 'the vanquished of Peleset' (Breasted section 82) or 'the fallen ones of Denyen' and 'the fallen ones of Peleset' (Edgerton and Wilson, plate 44).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "The five names are stated in one popular-press article read (Cline 2015, p. 68); extent not measured."
    would_change_if: "the signs of plate 46 or Kitchen's translation give other names or another count"
    anchor:
      type: interpretive
      description: >
        Breasted 1906 vol. IV (OCR) sections 65 and 82; SAOC 12 plate 46 line 18 (printed page 53) and plate 44 lines 23 and 24 (printed page 48); Cline 2015 p. 68 ('Peleset, Tjekker, Shekelesh, Danuna, and Weshesh', a translation he does not name). The plate 44 caption 'captives of the Sea Peoples' is the modern editors' title, not an Egyptian term. Signs not read.
        Three renderings read, from two scholars' translations and one unnamed; Edgerton and Wilson revise Breasted, so independence is partial.
      sources: [src-breasted-are4, src-breasted-are4-ocr, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf, src-cline-2015, src-oip8]
    basis: "# V: read 2026-10-14 (Breasted) and 2026-10-16 (Edgerton and Wilson, Cline). Spellings differ by translator; the five names agree."

  - id: sp-karnak-names-merneptah-year5
    state: proposed
    statement: >
      In Breasted's 1906 translation of Merneptah's Great Karnak Inscription (Merneptah year 5) the title names Ekwesh, Teresh, Luka, Sherden and Shekelesh as 'Northerners coming from all lands', and the news of the coalition names 'Sherden, Shekelesh, Ekwesh, Luka, Teresh' with the Libyan chief Meryey.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 2
    adoption_note: "The five names are stated in one popular-press article read (Cline 2015, p. 69); extent not measured."
    would_change_if: "the Karnak wall, Kitchen RI IV or a later translation reads the names differently"
    anchor:
      type: interpretive
      description: "Breasted 1906 vol. III (OCR) sections 574 and 579 and notes (read). Cline 2015 p. 69 lists the same five names ('Eqwesh, Teresh, Lukka, Shardana, Shekelesh, northerners coming from all lands'), a translation he does not name. Breasted notes the Karnak text lost the upper ends of lines and that earlier copies were inexact. Signs not read."
      sources: [src-breasted-are3, src-breasted-are3-ocr, src-cline-2015]
    basis: >
      # V: read 2026-10-14 and 2026-10-16. Two renderings of one list; the second is a modern article that does not say whose translation it uses, so independence is not established; anchor_checked is therefore no.

  - id: sp-nine-names-across-two-reigns
    state: proposed
    statement: >
      Counting the names in the two lists read (the Merneptah year 5 title: Ekwesh, Teresh, Luka, Sherden, Shekelesh; the Ramses III year 8 confederation: Peleset, Thekel, Shekelesh, Denyen, Weshesh) gives nine distinct names, with Shekelesh in both. Cline 2015 counts 'nine different groups of Sea Peoples named by either Merneptah or Ramses III or both'.
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Counted in one popular-press article read (Cline 2015, p. 69); extent not measured."
    would_change_if: "the signs or another translation give other names, treat two names as one people (for example Denyen and Ekwesh), or the Sherden are counted as part of the year 8 list"
    anchor:
      type: interpretive
      description: "Counted from the lists in Breasted vol. III section 574 and vol. IV section 65 (read in OCR), the same lists in SAOC 12 plate 46 line 18 (read), and Cline 2015 p. 69 (read), which makes the same count of nine and says Shardana and Shekelesh 'are present in both' invasions. Cline's own list of nine adds the Shardana to the Ramses III side because they appear elsewhere in his sources; the count of nine from the two lists alone is this dig's."
      sources: [src-breasted-are3, src-breasted-are3-ocr, src-breasted-are4, src-breasted-are4-ocr, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf, src-cline-2015]
    basis: "# V: lists read in two translations and counted 2026-10-16; Cline's count read the same day. The nine names come from two reigns, not from one record."

  - id: sp-nine-bows-stock-phrase
    state: proposed
    statement: >
      In the Ramses III passages read, 'Nine Bows' occurs as a phrase for Egypt's enemies generally, not as the heading of a list of nine named peoples: for example 'laying low the Nine Bows' (Breasted section 38), 'my might overthrows the Nine Bows' (section 54), and 'driving out for her the Nine Bows' (Edgerton and Wilson, plate 46).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "the signs or another reading use 'Nine Bows' as a numbered list of nine peoples in a record of these wars"
    anchor:
      type: interpretive
      description: >
        Breasted vol. IV sections 38, 49, 54, 55, 57 and 123 (read in the OCR) and SAOC 12 plates 23, 27, 29, 42, 43 and 46 (read), each translating the phrase as a stock epithet.
        Two translators from the same school, with the phrase appearing in the same sense in both.
      sources: [src-breasted-are4, src-breasted-are4-ocr, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf]
    basis: "# V: read 2026-10-16. A reading of translations; the signs were not read."

