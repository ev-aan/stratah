  - id: sp-year5-peleset-line-renderings
    state: contested
    statement: >
      The sentence about the Peleset and Thekel in the Ramses III year 5 inscription (not Merneptah year 5) is rendered by Breasted (1906) as 'the Peleset, the Thekel, who devastate their land. Their soul came, in the last extremity', and by Edgerton and Wilson (1936) as 'namely the Peleset, Thekk[er], ... They were cut off <from> their land, coming, their spirit broken'. Moreu (2023) argues from this line that the Peleset were victims, and quotes Ben-Dor (2015) as 'Their land was devastated' (passive).
    statement_kind: reported
    evidence_class: interpretive
    confidence: low
    evidential_weight: 2
    anchor_checked: 'no'
    adoption_weight: 1
    adoption_note: "Not measured."
    would_change_if: "the signs of plates 27-28 line 51-52 or Kitchen RI V, Ben-Dor 2015 or Wuthrich and Matic 2023 are read and decide between the active and the passive rendering"
    anchor:
      type: interpretive
      description: >
        Breasted vol. IV section 44 (read in the OCR): 'The northern countries are unquiet in their limbs, even the Peleset, the Thekel, who devastate their land. Their soul came, in the last extremity. They were warriors upon land, also in the sea.' Breasted refers to Muller (Asien und Europa, 360) for one word; Muller (1893, p. 360, read) prints 'die verheerten ihr Land' (who ravaged their land) for the same clause.
        SAOC 12 plates 27-28 lines 51-52 (printed page 30): 'The northern countries quivered in their bodies, namely the Peleset, Thekk[er], ... They were cut off <from> their land, coming, their spirit broken. They were thr-warriors on land; another (group) was on the sea.' The angle brackets mark a word the translators supply; note 52a says the translation 'assumes that some preposition has fallen out before t3.sn'.
        Moreu 2023 (read) quotes Breasted, Ben-Dor 2015 ('Their land was devastated') and Wuthrich and Matic 2023 ('cut off <from> their land') and says the later renderings are passive; Ben-Dor and Wuthrich-Matic were not read. The passive 'cut off' wording is already in Edgerton and Wilson 1936, which Moreu cites only for year 8.
      sources: [src-breasted-are4, src-breasted-are4-ocr, src-mueller-1893, src-mueller-1893-ocr, src-edgerton-wilson-1936, src-edgerton-wilson-1936-pdf, src-moreu-2023, src-ben-dor-wuthrich]
    positions:
      - label: "The Peleset and Thekel devastated their land (active), as sea peoples fighting beside the Libyans"
        holder: "Breasted 1906 section 44 and Muller 1893 p. 360 (read)"
        ground: "translation of the clause; Breasted's note reads the sea peoples as already in Ramses III's war of year 5"
      - label: "The Peleset and Thekel were cut off from their land (passive): victims"
        holder: "Edgerton and Wilson 1936 plates 27-28 (read); Moreu 2023 reading Ben-Dor 2015 and Wuthrich-Matic 2023 (not read)"
        ground: "translation of the clause with a supplied preposition"
    disputed_by:
      - {who: "Edgerton and Wilson 1936", kind: work, position: "'They were cut off <from> their land, coming, their spirit broken'", source_read: true, via: src-edgerton-wilson-1936}
      - {who: "Moreu 2023 (self-published PDF; reads Ben-Dor and Wuthrich-Matic)", kind: person, position: "the Peleset and Tjeker were victims whose land was devastated by others", source_read: true, via: src-moreu-2023}
    next_step: "Read Ben-Dor 2015, Wuthrich and Matic 2023 and Kitchen RI V; have the signs of the line read."
    basis: >
      Four renderings of one clause read (Breasted, Muller, Edgerton and Wilson, and Moreu's quotation of two others). The dispute is about the translation of one clause; this claim does not decide it. Moreu 2023 is a labelled position by one author, not a reviewed result.
      This claim is about the Ramses III year 5 inscription. Merneptah year 5 is the Karnak inscription and has no Peleset in it.

