    anchor_checked: secondary
    adoption_weight: 3
    adoption_note: "Dead Hidden; the 'three groups' wording was not found."
    would_change_if: "the signs show 'foreskin' at the Ekwesh line, or another body of text or excavated evidence on the practice of the named peoples is read"
    anchor:
      type: interpretive
      description: "Breasted vol. III section 588 renders the Ekwesh as having no foreskins and gives other peoples as uncircumcised. The 'three groups' wording is not in any passage read. Whether the Ekwesh came from the Aegean is Breasted's guess ('not impossibly the Achaeans')."
      sources: [src-breasted-are3, src-breasted-are4]
    positions:
      - label: "Ekwesh circumcised (no foreskin)"
        holder: "Breasted 1906, section 588 and note (read)"
        ground: "translation of the Karnak list"
      - label: "The word read as foreskin is 'horn' (phallus)"
        holder: "Muller, as reported in Breasted's note (Muller's own work not opened)"
        ground: "a different reading of the word krn't"
    disputed_by:
      - {who: "Muller (as reported by Breasted)", kind: person, position: "krn't means horn/phallus, not foreskin", source_read: false, via: src-breasted-are3}
    next_step: "Read Kitchen RI IV lines 52-56 and any study of the Karnak word; read Muller 1888."
    basis: "Contested on the reading of one word. No claim is made here about the Aegean."

  - id: sp-41d-only-israel-circumcised-hebrews
    state: searched_gap
    statement: "Only the 12 tribes of Israel were circumcised at that time, so these men from the Aegean are Hebrews (dh-wbdnR9qs9MU-41)."
    statement_kind: search_result
    evidence_class: interpretive
