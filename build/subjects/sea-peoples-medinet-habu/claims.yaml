    would_change_if: "the Egyptian records read name the Hittite king as organiser, or a chronology gives the dates"
    anchor:
      type: search-record
      description: "The two texts read date the events by regnal year only (Merneptah year 5, Ramses III year 8). Cline 2015 (opening read) gives 1177 BC for year 8; no chronology was read. 'Organized by the Hittite Empire' is not in any passage read; see sp-40-hittites-biggest-force."
      sources: [src-breasted-are4, src-cline-2015, src-breasted-are3]
    basis: "A bundled claim: date range, Nine Bows, Hittite organiser, attack and defeat. Only the last part has a basis in the texts read."

  - id: sp-oxit16-denen-shardana
    state: proposed
    statement: "Two of the Sea Peoples groups of particular interest are the Denen and the Shardana; the Danaans are either Danaans or Denenians (dh-oXit2KG1N1s-16)."
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
