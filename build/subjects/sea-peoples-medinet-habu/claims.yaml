    would_change_if: "the signs or a later reading identify the Sherden or Denyen differently, or a Danaan-Denyen link is argued"
    anchor:
      type: interpretive
      description: "Sherden appear in Merneptah's Karnak title among the Northerners (Breasted vol. III) and in the year 8 naval scene description ('manned by Peleset and Sherden', section 74); OIP 8 plate 47 C is captioned 'A Sherden warrior in action' on a scene list entry from plate 18 (caption read). Papyrus Harris section 403 lists the Sherden among those 'taken captive ... settled in strongholds'. Breasted writes 'the Denyen or Danaoi' as a possibility."
      sources: [src-breasted-are4, src-breasted-are3, src-oip8]
    basis: "The Sherden appear in more than one role in the sources as read. The Danaan equation is a book's guess."

  - id: sp-oxit18-peleset-philistines
    state: contested
    statement: "The Peleset, one of the Sea Peoples, arrived in Canaan about 1175 BC after the defeat; they are the Philistines, not indigenous to Canaan (dh-oXit2KG1N1s-18)."
    statement_kind: judgment
    evidence_class: interpretive
