    anchor:
      type: search-record
      description: "Searched the Karnak passages (Breasted vol. III) and the year 8 and Papyrus Harris passages (vol. IV) read: no mention of Israel, Hebrews or tribes in the Ekwesh passage. The 'only Israel' premise is outside the Egyptian texts and was not researched."
      sources: [src-breasted-are3, src-breasted-are4]
    basis: "A claim that rests on a premise nothing here supports; the identification is not in the texts read."

  - id: sp-43a-return-and-200-miles
    state: searched_gap
    statement: "The Sea Peoples came back after the confederation failed, laid waste to the coast of Egypt and all cities for about 200 miles inland (as recorded in Egyptian records) (dh-wbdnR9qs9MU-43)."
    statement_kind: search_result
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
    anchor_checked: 'no'
    absence_anchor: true
    adoption_weight: 2
    adoption_note: "Dead Hidden."
    would_change_if: "a text is found saying the Northerners laid waste Egyptian coastal cities 200 miles inland, or a record of a later return is read"
    next_step: "Read Kitchen RI V and Edgerton-Wilson; check Papyrus Harris and the year 11 Medinet Habu texts in full."
    anchor:
      type: search-record
      description: "In Breasted vol. IV the Ramses III text says the Northerners wasted the lands from Kheta to Alasa, set up a camp in Amor, and were caught at the harbour mouths of Egypt (sections 64, 65, 82). The OCR of vol. IV was searched for 'miles': the only distances are about eleven miles in a Libyan pursuit and unrelated entries; no 200-mile passage found. Breasted's Wenamon commentary says the Peleset and Thekel 'settled along the eastern coast of the Mediterranean as subjects of the Pharaoh' after year 8."
      sources: [src-breasted-are4]
    basis: "Absence from one translation, not from the Egyptian record. Capped by the absence rule."

  - id: sp-oxit15-nine-bows-hittite-1300-1150
    state: proposed
    statement: "Between 1300 and 1150 BC the Sea Peoples appear, in a confederation of 'Nine Bows' organized by the Hittite Empire, which attacked Egypt and lost (dh-oXit2KG1N1s-15)."
    statement_kind: judgment
    evidence_class: interpretive
    confidence: low
    evidential_weight: 1
