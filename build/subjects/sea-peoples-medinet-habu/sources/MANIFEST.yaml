# Sources for the sea-peoples-medinet-habu dig (rules A1-A10, build/SCHEMA.md).
# Revised 2026-10-16 in the fix pass (log entries L-07 onward). First pass: 2026-10-14.
# Texts are kept OUTSIDE the repository (scratch folder); their sha256 is recorded here. Only short verbatim extracts of the public-domain 1906 and 1893 books are stored in sources/extracts/ so the quote check has text to match.
# OIP 8 and SAOC 12 are CC BY-NC-ND 4.0 (ISAC pages): not stored, cited by URL, plate and page.
# Primary data for this subject is the temple walls at Medinet Habu and the Karnak wall. No one on this dig saw the walls. What was read: modern drawings and photographs (OIP 8, four plates in the first pass and plate 42 in the second), and
# translations with notes (Breasted 1906; Edgerton and Wilson 1936, whose preface says they worked at the wall; Muller 1893 in part). No hieroglyphic sign was read. So no claim here is anchor_checked primary.
# Tests were run by the dig session, which is not an independent review.
# Each translation or book is one entry; its OCR or PDF text layer is a separate entry with derived_from (A9). Authenticity of the book does not cover the OCR.
