    url: https://archive.org/details/cu31924082479258
    document_class: "interpretive: translation with commentary by one editor, who is also the foreword author of src-oip8. Author, publisher and funders of the 1906 work: the preface read for vol. I names only President Harper and the Trustees of the University of Chicago (see src-breasted-are1-preface); any funder beyond that UNRESEARCHED"
