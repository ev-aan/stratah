# Sources for the sea-peoples-medinet-habu dig (rules A1-A10, build/SCHEMA.md).
# Nothing is stored in the repository: OIP 8 is CC BY-NC-ND 4.0 per the ISAC catalogue page (images not stored, cited by URL); the Archive OCR texts and two articles were
# downloaded to a scratch folder only, and their sha256 is recorded here. Tests were run by the dig session on 2026-10-14, which is not an independent review.
# Primary data for this subject is the temple walls at Medinet Habu and the Karnak wall. The session saw only modern drawings and photographs of Medinet Habu (OIP 8 plates 44, 46, 53, 54) and
# did NOT read the hieroglyphic signs, so no claim here is anchor_checked primary. Books and translations are claims, not data.
retrieved: 2026-10-14
sources:

  - id: src-oip8
    title: "The Epigraphic Survey (H. H. Nelson, field director), Medinet Habu Volume I: Earlier Historical Records of Ramses III, Oriental Institute Publications 8 (Chicago: University of Chicago Press, 1930), plates 1-54, with foreword and list of plates"
    url: https://isac.uchicago.edu/publications/medinet-habu-volume-i-earlier-historical-records
    pdf_url: "https://isac-assets.s3.amazonaws.com/isac-publications/oip8_0.pdf (VersionId LQPPP3ygR0LJrTXdvn44f14OYIGc7I9o); the older link isac.uchicago.edu/.../docs/oip8.pdf returned the catalogue HTML page, not the PDF"
    document_class: "facsimile drawings and photographs of the wall (modern reproduction of the object, not the object); foreword by Breasted. Excavator and funders: see provenance"
    read: "yes. Front matter and foreword read in the PDF text layer; list of plates read; plates 44 (pdf p.117), 46 (p.121), 53 (p.135) and 54 (p.137) opened as page images and looked at. The hieroglyphic signs on those plates were NOT read."
    rights: "CC BY-NC-ND 4.0, copyright University of Chicago (ISAC catalogue page, read). Images not stored here (ND/NC); cited by URL and plate number."
    authenticity:
      status: authenticated
      strength: moderate
      provenance: >
        Published by the University of Chicago Press, June 1930, as Oriental Institute Publications vol. VIII (title page and imprint read). Edited by James Henry Breasted. Field director Harold Hayden Nelson; epigraphers Edgerton, Williams, Wilson; artists Bollacher, Canziani, Chubb; photographers Morrison, Lind, Hartman (title page read).
        Funding as printed in the foreword (read): the Oriental Institute was founded in 1919 'by contributions from Mr. John D. Rockefeller, Jr., since followed by additional support from the same generous donor, from the General Education Board, and from the International Education Board'; in 1926 Julius Rosenwald contributed funds for the Chicago House headquarters and library (library since endowed by the General Education Board); the internet publication was supported by Misty and Lewis Gruber (title page). Breasted, the editor, both directs the institute that publishes and wrote the foreword. What the donors stood to gain, and any editorial control by them: UNRESEARCHED.
      tests:
        - "Plate captions in the list of plates agree with the captions printed on the plate pages opened (54 A 'pile of lifeless hands ... detail from scene shown on plate 23'; 53 A and B 'detail from scene shown on plate 42'; plate 46 'The inscription of the year 8'); could have failed"
        - "Publisher, year and series number on the title page agree with the ISAC catalogue record (Chicago 1930, 54 plates) read in the search result and catalogue page; could have failed"
      tested_by: "Stratah dig session, 2026-10-14 (not independent of the claimant)"
      gaps: ["Hieroglyphs not read by this session", "Drawings are an epigraphers' reproduction; collation against the wall or against Egyptian Antiquities Service records not possible here", "Plate 23 and plate 42 not opened", "OIP 9 (Later Historical Records) not opened"]
      next_step: "Have a reader of Egyptian transliterate plate 46 columns and the caption columns over the prisoner rows of plates 42-44, and compare with Edgerton and Wilson 1936 and Kitchen RI V."
      checked: 2026-10-14
      capture: "ISAC catalogue page (isac.uchicago.edu), fetched 2026-10-14; PDF sha256 e0e6447afbad85d9ef2679324c19bc2038f5a4a5858dc8042524f651f8547880 (45,000,574 bytes, 138 pages, scratch copy only)"

