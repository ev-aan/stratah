history:
- rev: 1
  date: '2026-10-14'
  change: Created by the amarna-habiru dig from Knudtzon 1915 OCR. The date window is our reading of Knudtzon's own chronology and is a placeholder, not an established date.
- rev: 2
  date: '2026-10-16'
  change: >-
    Placeholders removed. Rev 1 gave a window of 1420 to 1330 BCE and a time of 1370 BCE with a note that both were placeholders; the 1420 start had no source
    figure. Rev 2 sets the window to the range Knudtzon himself gives for the reign of Amenophis IV (about 1385 to 1368 BCE, pp. 38 and 53, page images read), says the
    single date is the middle of that range, and drops the 1330 end taken from a lower chronology, which rev 1 attributed to Lehmann. That attribution was wrong: the
    1386 and 1318 figures are Lieblein's as Knudtzon reports them (p. 27, page image read), and Lehmann's figures are 1427-1392 and 1392-1376. The letters 288, 289 and 290 were read and added;
    rev 1 covered 286 and 287 only. The rev 1 text is kept above.
