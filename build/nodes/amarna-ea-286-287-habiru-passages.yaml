id: amarna-ea-286-287-habiru-passages
rev: 2
type: document
label: 'Amarna letters EA 286 to EA 290 (Abdi-Heba of Jerusalem to the king): passages naming the Habiru'
time: '-1377-01-01'
precision: range
date_basis: derived
kind: document
status: single
what: >-
  In Knudtzon's 1915 edition the letters 286 (Berlin tablet VA Th. 1642), 287 (VA Th. 1644), 288, 289 and 290, all sent from Jerusalem by Abdi-Heba,
  name the Habiru. Page images of the printed letters were read. Knudtzon's German: 286, 56 "Die Habiru plündern alle Länder des Königs"; 286, 19
  (the writer says he will ask the king's officer) "Warum liebt ihr die Habiru, und die Regenten haßt ihr?"; 287, 29-31 "diese Tat ist die Tat
  Milkilis und die Tat der Söhne Labajas, welche gegeben haben das Land des Königs den Habiru"; 288, 36-38 "Jetzt aber nehmen die Habiru die
  Städte des Königs"; 289, 22-24 Labaja "und das Land Šakmi (alles) gegeben haben den Habiru"; 290, 13-14 "Abgefallen ist das Land des Königs
  zu den Habiru". The letters give no year. The date window is Knudtzon's own estimate for the time of Amenophis IV (about 1385 to 1368 BCE,
  pp. 38 and 53), which he reaches from the reigns of Assyrian and Babylonian kings and from a chain of contemporaries of Labaja and Abdi-Heba.
  The node's single date is the middle of that range and is not a date any source gives. Other scholars he cites put the two reigns elsewhere
  (Lehmann 1427-1392 and 1392-1376; Lieblein, with Amenophis III to 1318; both as reported by Knudtzon, p. 27); modern chronologies were not read.
window:
  earliest: '-1385-01-01'
  latest: '-1368-12-31'
  begin_note: 'Knudtzon 1915 p. 38 and p. 53: he would put the reign of Amenophis IV at about 1385 to 1368 and thinks the letters of Abdi-Heba belong to it. 1385 is the start of that reign in his reckoning (his reasoning allows up to about 1395 at the earliest, p. 38).'
  end_note: 'Knudtzon 1915 p. 38 and p. 53: the end of the same reign, 1368 BCE. This is one editor''s 1915 estimate; Lehmann''s figures as he reports them (1392-1376) fall partly outside it, and a modern absolute chronology was not read.'
