id: object-carnarvon-tablet-i
rev: 3
type: object
label: 'Carnarvon Tablet I: a hieratic writing-board with a text about Kamose on one face (called the obverse by Gardiner 1916 and in the 1912 report''s introduction, and the reverse on the 1912 report''s plate captions)'
time: '1908-01-01'
precision: year
date_basis: stated
kind: document
status: single
what: >-
  A wooden writing-board covered with stucco, found in 1908 (see the find node for the two differing accounts of the place). Gardiner 1916 describes it as one of a pair of hieratic boards; Tablet I bears the historical text on one face and, on the other, a copy of the beginning of the
  Proverbs of Ptahhotpe and the lines of a draughtsboard. The faces are named inconsistently in print: Gardiner 1916 calls the historical face the obverse, and so does the introduction of the 1912 report (the historical text 'on its obverse', the Ptah-hetep copy 'on its reverse'); the plates of the same 1912 report are captioned 'Carnarvon Tablet I. Obv.' for the face with the ruled grid and 'Rev.' for the face with the continuous
  text, and Griffith's chapter in the same book speaks of 'the face of the tablet' for the Ptahhotpe lines and the draught-board and 'the other side' for the historical text. Photographs of both faces were viewed (1912 plates) and of the text face (JEA plates); no sign on them was read.
  Griffith counts the historical lines as 'no less than seventeen long lines' and says flaking of the stucco has robbed the text of one line and most of two more. The text is written, in Gardiner's reading, in a hand of the end of the Seventeenth Dynasty. Maspero 1909 wrote that the scribe of 'son livre' (the Ptah-hetep text, in the paragraph after his description of the board) lived towards the Twentieth Dynasty because his writing resembled the cursive hands of that period; Gardiner reports this as concerning the Ptahhotpe duplicate. Maspero is not shown to say it of the hand of the historical text.
  The date of the writing and the regnal year in the text are disputed (see the dig's claims). Gardiner says a missing corner of Tablet II was bought by Petrie and was in his own hands in 1916, with the larger fragment in the Cairo Museum. Where Tablet I is now was not read in a source opened here.
object:
  class: hieratic writing-board, stuccoed wood
  material: wood with stucco (fine plaster) writing surface (Griffith, chapter VI note, in Carnarvon and Carter 1912)
  museum: 'not established here'
  accession: 'not established here'
  held_now:
    status: not established
    as_of: '2026-10-16'
    note: >-
      Gardiner 1916 says part of Tablet II is in the Cairo Museum. Griffith's footnote in the 1912 report cites 'Jequier, Le Papyrus Prisse et ses variantes (Pap. Brit. Mus. 10371 and 10435, Tablette Carnarvon au Caire), Paris, 1910'; Gardiner's footnote cites the same book as Paris, 1911. The two printed years differ and are not resolved here.
      Neither says where Tablet I is held now. No museum record was opened.
