type: object
label: 'Carnarvon Tablet I: a hieratic writing-board whose obverse (per Gardiner 1916 and Griffith 1912) carries a text about Kamose'
time: '1908-01-01'
precision: year
date_basis: stated
kind: document
status: single
what: >-
  A wooden writing-board covered with stucco, found in 1908 on a rock ledge among pottery and mutilated mummies in the courtyard of a Seventeenth Dynasty tomb
  (No. 9) at the Birabi site, near the mouth of the Deir el-Bahari valley (Carter, in Carnarvon and Carter 1912). Gardiner 1916 describes it as one of a pair of
  hieratic boards; Tablet I bears the historical text on one face and, on the other, a copy of the beginning of the Proverbs of Ptahhotpe and the lines of a draughtsboard.
  The text of the historical face is written, in Gardiner's reading, in a hand of the end of the Seventeenth Dynasty. The date of the writing and the regnal year in the text are
  disputed (see the dig's claims). Gardiner says a missing corner of Tablet II was bought by Petrie and was in his own hands in 1916, with the larger fragment in the Cairo Museum.
  Where Tablet I is now was not read in a source opened here (a search-result title gave Cairo JE 41790; not opened).
