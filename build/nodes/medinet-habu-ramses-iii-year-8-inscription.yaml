id: medinet-habu-ramses-iii-year-8-inscription
rev: 3
type: document
label: 'Ramses III, year 8: the great inscription and Sea Peoples reliefs at Medinet Habu, Thebes'
time: '-1177-01-01'
precision: year
date_basis: inferred
kind: document
status: reported
what: >-
  A long inscription dated to year 8 of Ramses III, cut on the north tower of the second pylon of his temple at Medinet Habu, with relief scenes of a land and a naval battle and prisoners on the outside north wall.
  The Epigraphic Survey published drawings and photographs of it in 1930 (OIP 8; its list of plates titles plates 29-34, 36-39, 41-44 and 46 with Sea Peoples subjects or the year 8 inscription, plate 40 analyses one Egyptian ship in the naval scene, and later plates print details, among them plate 53; plate 35, the lion hunt, is not among them). The date 1177 BC is the single year given by Cline 2015 for regnal year 8; no chronology was read, so the year is a placeholder
  for ordering and could differ by several years. Breasted's 1906 translation names Peleset, Thekel, Shekelesh, Denyen and Weshesh.
