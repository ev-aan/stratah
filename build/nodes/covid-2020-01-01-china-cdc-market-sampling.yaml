what: Liu et al. (China CDC, Nature 2023) report environmental sampling in and around the market from 1 January to 2 March 2020; animal
  sampling began on 18 January, and some stray animals were sampled until 30 March; 74 of 923 environmental samples tested positive
  for SARS-CoV-2, and of the 64 positives collected inside the market, 56 were in its West Zone. What this pattern means for the origin
  is disputed in this dig; this node records only where and when the samples were taken. A map pin marks where this source says something
  was observed, sampled or reported. It is not a claim about where the virus originated.
