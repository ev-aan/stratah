id: avaris-1986-1988-statue-fragments-found
rev: 1
type: event
label: "1986-1988: Austrian team finds fragments of a smashed larger-than-life statue of an Asiatic man in cemetery F/I, Tell el-Dab'a (Avaris)"
time: '1986-01-01'
end: '1988-12-31'
precision: year
date_basis: stated
kind: document
status: single
what: >-
  Schiestl (2006) says all the pieces of the statue he presents were found between 1986 and 1988 in a southeastern part of cemetery F/I at
  Tell el-Dab'a by the Austrian Archaeological Institute under Manfred Bietak. The head and part of the right fist came from the upper layer
  of a robbers' pit in tomb p/19 no. 1; the right shoulder came from the entrance shaft of tomb p/21 no. 1; a left foot from tomb o/20 no. 11.
  The month and day of each find are not given in the passage read.
place:
  name: "Tell el-Dab'a, area F/I (southeastern part of the cemetery)"
  note: "Named by Schiestl 2006 and the auaris.at F/I page. No coordinates are given in the sources read; none are guessed here."
