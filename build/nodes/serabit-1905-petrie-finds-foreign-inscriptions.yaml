id: serabit-1905-petrie-finds-foreign-inscriptions
rev: 2
type: event
label: '1905: Petrie''s Sinai expedition finds inscriptions in an unknown script at Serabit el-Khadim (temple and mine L)'
time: '1905-01-01'
precision: year
date_basis: derived
kind: document
status: reported
what: >-
  Petrie's 1906 book says inscriptions "in unknown characters" were found on figures in the Hathor temple at Serabit el-Khadim,
  and that his wife noticed a fragment with unrecognised signs near the mine marked L on his Map 3, where he then found
  remains of "about eight tablets, roughly cut". Gardiner and Peet (1917) number eleven such monuments, Sinai 345 to 355, as
  copied by the Egypt Exploration Fund expedition of 1904-5. The year is derived: Gardiner and Peet say "winter of 1904-5" and
  Albright says "early 1905"; Haring (2019) says "winter campaign of 1905-1906"; Petrie's own preface, printed May 1906, says only
  "last winter". The sources read disagree on the season, so only the year 1905 is given and the month is not known here.
  Rev 2 (2026-10-16): the Egypt Exploration Fund's own report for 1905-1906 (p. 31, read) says Petrie's book is an account of his work for the Fund
  "in 1904-5"; Petrie's pages read give the party's dates (left Suez 3 December; at Serabit 11 January to 18 March) with no year; the Fund's party was at Serabit
  therefore in January to March of 1905 if the season was 1904-5 (the National Geographic page says "1906" for Sinai 346). Gardiner (1916) says the expedition found a series of ten, and a squeeze of
  Weill's, marked as from Maghârah, brings the total to eleven; Gardiner and Peet's Table V lists 348 as "Magharah ?".
