what: 'Caubet states that the "Letter from the General" was "discovered in 1956 in the House of Rapanu" at Ugarit (citing Nougayrol
  1968: 69-79 and Yon 1997), and that it and "other letters from the same archives mentioning menacing boats off the shore of
  Ugarit lack any names of officials or kings". Month and day are not given; the 1 June in `time` is a placeholder for the
  year only. Whether this letter is one of the "ships" letters in the speaker''s claim, or the tablet said to have been found
  in an oven, is NOT established by this source.'
