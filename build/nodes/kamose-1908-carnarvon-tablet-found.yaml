id: kamose-1908-carnarvon-tablet-found
rev: 2
type: event
label: '1908: the writing-board now called Carnarvon Tablet I is found by Lord Carnarvon''s excavation at Thebes (the place is given differently by two printed accounts)'
time: '1908-01-01'
precision: year
date_basis: stated
kind: document
status: disputed
what: >-
  Two printed accounts of the find were read, and they differ on the place. (1) The excavators' report (Carnarvon and Carter, published 1912, chapter V by Carter) says the Birabi site was examined in 1908, that it produced a Seventeenth Dynasty tomb (No. 9), and that among the
  pottery and mutilated mummies in its courtyard, on a rock ledge, 'the important historical tablet referring to the expulsion of the Hyksos by the General Kamosi' and a second broken tablet were recovered. Carter's text places the site 'about one hundred and fifty
  metres north-east of the mouth of the Der el Bahari valley', 'between the native house Beit el Meleitan and the village mosque'. Gardiner (1916) repeats this account and says the board was found on a ledge near the entrance to a plundered tomb in the Birabi.
  (2) Maspero, in a note dated Cairo, 23 April 1909, says: 'Au mois de fevrier de l'an dernier, le comte de Carnarvon, fouillant a Thebes dans la montagne de Drah abou'l Neggah, y recueillit, parmi les deblais de fouilles anterieures, les deux morceaux d'une tablette a ecrire'
  (in February of last year, Count Carnarvon, digging at Thebes in the mountain of Drah Abu'l Naga, collected among the spoil of earlier excavations the two pieces of a writing tablet). This gives February 1908 and a find among earlier spoil; it does not name tomb No. 9 or the Birabi.
  Whether the two names refer to the same spot, and which account is right, is not settled by anything read. The excavators' description of the text is the excavator's, not a reading of the board.
place:
  name: 'Birabi site, courtyard of tomb No. 9, near the mouth of the Deir el-Bahari valley, Theban necropolis (Carter 1912); Maspero 1909 names Drah Abu el-Naga instead'
  note: 'Named by Carter in Carnarvon and Carter 1912, chapter V; Maspero 1909 gives a different place name. No coordinates given by either; none are guessed here.'
