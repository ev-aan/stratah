id: kamose-1908-carnarvon-tablet-found
rev: 1
type: event
label: '1908: Carnarvon and Carter find the writing-board now called Carnarvon Tablet I at the Birabi site, Thebes'
time: '1908-01-01'
precision: year
date_basis: stated
kind: document
status: single
what: >-
  The excavators' report (published 1912) says the Birabi site was examined in 1908, that it produced a Seventeenth Dynasty tomb (No. 9), and that among the pottery and mutilated
  mummies in its courtyard, on a rock ledge, 'the important historical tablet referring to the expulsion of the Hyksos by the General Kamosi' and a second broken tablet were
  recovered. Carter's text places the site 'about one hundred and fifty metres north-east of the mouth of the Dêr el Bahari valley', 'between the native house Beit el Meleitên and the
  village mosque'. The month and day are not given in the passages read. The report's description of the text is the excavator's, not a reading of the board.
place:
  name: 'Birabi site, courtyard of tomb No. 9, near the mouth of the Deir el-Bahari valley, Theban necropolis'
  note: 'Named by Carter in Carnarvon and Carter 1912, chapter V. No coordinates given; none are guessed here.'
