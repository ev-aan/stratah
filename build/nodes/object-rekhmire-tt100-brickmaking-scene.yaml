  begin_note: >-
    Earliest start 1479 BCE is the start of the Met's date range for the Davies facsimiles of this tomb ("ca. 1479-1425 BCE",
    Met open-access record 544649); Newberry 1900 gives circa 1471 for the same period.
  end_note: >-
    Latest end 1425 BCE is the end of the Met range; Newberry gives 1448 and Kitchen c. 1450. Absolute dates of the reigns of
    Thutmose III and Amenhotep II were not read from a chronology volume; Aston 2013 reports several schemes (claim rekhmire-reign-dates-schemes), and the window remains the spread of the three works read.
