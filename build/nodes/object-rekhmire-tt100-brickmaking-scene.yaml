label: 'Tomb of Rekhmire (TT 100), Thebes: painted scene of brickmakers, sculptors and masons at work (Karnak temple works)'
time: '-1450-01-01'
precision: year
date_basis: derived
kind: document
status: disputed
what: >-
  A painted wall scene in the tomb-chapel of the vizier Rekhmire on the hill of Sheikh Abd el-Qurna, Thebes (tomb number 100 in
  Porter and Moss, per Kitchen 1976 note 17). Newberry 1900 (p. 37) calls it "a painting" of the vizier inspecting brickmakers,
  sculptors and masons at certain temple buildings at Karnak, with the two lower rows destroyed. Its labels, as translated by
  Newberry and Breasted, say the brick workers are "captives brought by his Majesty (i.e. Thothmes III.) for the works of the temple of Amen" (Newberry) and "Captivity which his majesty brought, for the works of the temple of Amon" (Breasted) and that
  bricks are being made to build a storehouse anew at Karnak. The scene carries no regnal year in the translations read.
  The time shown is a single marker (Kitchen's "c. 1450 BC" for Rekhmire); the window is the spread across the dates read
  (Newberry 1471-1448, Kitchen c. 1450, Met catalogue 1479-1425), which are dates of Rekhmire's career, not a date for the painting
  itself. The wall and its signs were not seen; a copy (Nina de Garis Davies facsimile, Met 30.4.77), Newberry's outline tracing and Sethe's hand copy of the labels (Urk. IV pp. 1151-1155, viewed in round 2) were viewed, and no sign was transliterated.
