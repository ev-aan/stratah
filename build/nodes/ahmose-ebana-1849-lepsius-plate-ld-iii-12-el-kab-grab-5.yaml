what: >-
  A plate in the Internet Archive scan of Lepsius's Denkmaeler (Berlin, Nicolaische Buchhandlung, listed by the item as 1849-1859; the plate's own year is not
  printed in the part viewed) shows four panels captioned 'El Kab Grab 5': a seated pair and a standing offerant, two blocks of columns, and a large block of long vertical
  columns of hieroglyphs beside a standing figure with a staff. The volume index text lists it as Blatt 12, Dynasty XVIII, El Kab Grab 5. Breasted (1906) and Davies (2009) both cite
  it as the first publication of the autobiography (Breasted, 'Lepsius, Denkmaeler, III, 12, a and d'; Davies, 'LD iii: 12b-d'). The plate was looked at; its signs were NOT read.
  It is a nineteenth-century drawn copy, which Davies says he corrects in places.
