label: "2017-12-29: Rabbi M. S. Bar-Ron's paper presents the Tell el-Dab'a palace, 12 pillars, 12 tombs and pyramid tomb as Joseph's (following D. Rohl)"
time: '2017-12-29'
precision: day
date_basis: stated
kind: document
status: single
what: >-
  A paper dated 29 December 2017 by Rabbi Michael S. Bar-Ron (Beth Midrash Ohel Moshe, Beit Shemesh) states that the Tell el-Dab'a Area F palace has
  'two central rows of 12 stately pillars', that the garden cemetery had '12 prominent tombs', that a 'grand pyramid tomb' held 'the broken remains of a
  3-meter-high, sitting statue', that the body in that tomb 'had long been removed', and that this fits the biblical Joseph (as the vizier Ankhu in David
  Rohl's chronology). It cites Rohl's books and a 1996 Bietak text for these points. The paper is a record of what the author claimed on that date; it is not
  evidence for the claims.
sources:
- title: "M. S. Bar-Ron, The Seal of Joseph in His Palace at Tell ed-Daba (29 Dec 2017), PDF on kankanjournal.com, introduction and 'What Identifies the Palace as Joseph's'"
