id: object-serabit-sinai-345-sphinx
rev: 1
type: object
label: 'Sinai 345: small sandstone sphinx from Serabit el-Khadim with a hieroglyphic line and linear-script lines (British Museum EA 41748 per Haring 2019)'
time: '1905-01-01'
precision: year
date_basis: derived
kind: document
status: reported
what: >-
  The node's time is when the object was first recorded (Petrie's 1905 expedition). The date the sphinx was made is not
  established here; Gardiner and Peet's 1917 table gives "Middle Kingdom ?", Petrie 1906 argued about 1500 BCE, and Haring (2019)
  says it is "nowadays commonly dated to the late Middle Kingdom". Petrie 1906 describes a small sphinx with, on the shoulder,
  a dedication to Hathor "Mistress of Turquoise" in Egyptian hieroglyphs, a very small rough sign between the paws that he reads
  as a Horus-name, and along the base a line of signs he could not read, the same five signs as on the squatting figure Sinai 346.
  Gardiner and Peet's Plate LXXXII (viewed here) is a hand-copy facsimile of the shoulder, paws, right side and left side.
