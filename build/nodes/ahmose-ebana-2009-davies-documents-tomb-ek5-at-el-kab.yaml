date_basis: publication_proxy
kind: document
status: single
what: >-
  Davies's chapter (Orientalia Lovaniensia Analecta 191, Peeters, 2009) says the tomb of Ahmose Son-of-Ibana is Elkab no. 5, a rock-cut chapel in the
  south face of the main sandstone hill at Elkab, and that its autobiographical text is carved in 31 columns on the east wall and 8 columns on the south wall
  beside the doorway. He calls the tomb 'still incompletely published' and dates its decoration to the reign of Thutmose III on stylistic and other grounds,
  adding that 'a more precise dating remains to be established'. The node's date is the year of the book, used because no survey date is given in the pages read.
  It is a modern scholar's report, not the wall.
