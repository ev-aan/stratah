id: amarna-1887-letters-found-at-el-amarna
rev: 2
type: event
label: '1887/88: clay tablets with cuneiform letters are found at el-Amarna, Middle Egypt, and sold to Berlin, London, Cairo and others'
time: '1887-12-01'
precision: month
date_basis: stated
kind: document
status: disputed
what: >-
  The accounts read give the find a different time. Budge (PSBA 10, 1888, p. 540) writes that "towards the end of the summer of 1887"
  it became known that a collection of clay tablets in cuneiform had been discovered in Egypt, that only about three hundred pieces had been
  dug up by the natives, and that "about the middle of December last" he saw a considerable number of them. Winckler (1889, preface) writes
  that the tablets, letters of Asiatic princes and governors to the Egyptian court of the 15th century, were found "im Anfang des Winters
  1887/88" at el-Amarna, the ruin site of the residence founded by Amenophis IV; most went to the Royal Museums in Berlin through Theodor Graf
  of Vienna, made possible by a gift of most of the Graf collections by Kommerzienrat J. Simon of Berlin; part went to the British Museum
  (for which he names Budge) and part to Bulaq. Knudtzon (1915, p. 4) quotes Budge for both dates and concludes the first find "must have
  been made in the autumn days or toward the close of the year 1887". Sayce (PSBA 10, p. 488) writes that about 200 tablets had been
  offered for sale in Cairo and Ekhmim. Petrie (1894, section 48) says the tablets came from the block of chambers numbered 19 on his plan,
  that natives showed him and Sayce the place, and that he believes they lay in the south-west room. The exact month is not fixed by the
  passages read, and Budge's "became known" and Winckler's "found" are different things.
place:
  name: 'el-Amarna (Tell el-Amarna), Middle Egypt'
  note: 'Named by Winckler 1889, Budge 1888, Petrie 1894 and Knudtzon 1915. No coordinates are given in the passages read and none are guessed here. Inside the site, Petrie (1894, section 48) names the block of chambers numbered 19 on his plan (Pls. XXXV, XLII, not opened) as the find-spot, on the testimony of natives and from fragments he found there.'
