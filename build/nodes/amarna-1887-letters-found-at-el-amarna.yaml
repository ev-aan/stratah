history:
- rev: 1
  date: '2026-10-14'
  change: Created by the amarna-habiru dig from Winckler 1889 preface and Knudtzon 1915 (quoting Sayce) in the Internet Archive OCR. Date is the editor's stated winter 1887/88; Sayce's differing statements are in the text above.
- rev: 2
  date: '2026-10-16'
  change: >-
    Correction of an attribution and added reading. Rev 1 said Knudtzon quotes Sayce for the date the find became known. Knudtzon
    (1915, p. 4, page image opened) and Winckler (1889, preface, page image opened) both name Budge, PSBA 10, p. 540, for the words 'towards the end
    of the summer of 1887' and 'about the middle of December'; Budge's p. 540 was opened and has them. The text above is rewritten to say so. Sayce's own
    statement (PSBA 10, p. 488, about 200 tablets offered for sale in Cairo and Ekhmim) and Petrie's find-spot account (1894, section 48) are added.
    The 'time' of 1887-12-01 and its precision are unchanged and stay the dig's choice, taken from Winckler's 'Anfang des Winters 1887/88'; Budge's
    'became known' towards the end of summer 1887 is earlier, so the status is changed from single to disputed. Knudtzon's own date is 'autumn
    days or toward the close of 1887'. The earlier text is kept in rev 1 above.
