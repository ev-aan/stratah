type: event
label: 'Serabit el-Khadim alphabetic inscriptions: proposed dates range from the Egyptian Middle Kingdom (about 1830 BCE) to about 1300 BCE; no single date is established'
time: -1831-01-01T00:00:00Z
end: -1300-12-31T00:00:00Z
precision: range
date_basis: inferred
kind: analysis
status: disputed
what: >-
  This node records a spread of proposals, not a date. As reported by Haring (2019) and Wilson-Wright (2019), both read:
  Wilson-Wright 1831 to 1777 BCE (reigns of Amenemhat III and IV; also Darnell and others); Hamilton c. 1850 to 1500 BCE
  in stages; Briquel-Chatonnet the Second Intermediate Period (c. 1650 to 1550); Albright c. 1550 to 1450 BCE (1966, read);
  Petrie about 1500 BCE (1906, read); Sass about 1300 BCE in his later work. The bar is the full span of those proposals; the
  start of the bar is the earliest of them and is not a best estimate. The `time` field is that earliest proposal only because
  a node needs one.
window:
  earliest: -1850-01-01
  latest: -1300-12-31
  begin_note: 'Earliest start proposed in the sources read: Hamilton c. 1850 BCE (as reported by Haring 2019); Wilson-Wright 1831 BCE.'
  end_note: 'Latest end proposed in the sources read: Sass about 1300 BCE (as reported by Haring 2019, citing Sass 2004-5, 157); Hamilton assigns one text c. 1250 BCE to the later corpus.'
