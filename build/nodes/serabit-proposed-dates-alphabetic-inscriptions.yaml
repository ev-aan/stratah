id: serabit-proposed-dates-alphabetic-inscriptions
rev: 2
type: event
label: 'Serabit el-Khadim alphabetic inscriptions: proposed dates range from about 1850 BCE to about 1250 BCE (most 1831 to 1300 BCE); no single date is established'
time: -1831-01-01T00:00:00Z
end: -1250-12-31T00:00:00Z
precision: range
date_basis: inferred
kind: analysis
status: disputed
what: >-
  This node records a spread of proposals, not a date. As reported by Haring (2019) and Wilson-Wright (2019), both read:
  Wilson-Wright 1831 to 1777 BCE (reigns of Amenemhat III and IV; also Darnell and others); Hamilton c. 1850 to 1500 BCE
  in stages; Briquel-Chatonnet the Second Intermediate Period (c. 1650 to 1550); Albright c. 1550 to 1450 BCE (1966, read);
  Petrie about 1500 BCE (1906, read); Sass about 1300 BCE in his later work. The bar is the full span of those proposals; the
  start of the bar is the earliest of them and is not a best estimate.
  Rev 2 (2026-10-16) adds: Gardiner 1916 (read): at all events not later than 1500 BCE, with the end of the Twelfth Dynasty possibly "a more probable date"; Gardiner and Peet 1917 Table V: "Middle Kingdom ?" for all of 345 to 355;
  Albright 1966 (read): 1550-1450, 345 about 1475 under Hatshepsut, but the alphabet's origin possibly "forced back into the Twelfth Dynasty"; Wilson-Wright 2026: Senwosret III to Amenemhat IV (1837-1764 BCE), citing Parker 2022 (unread);
  Tallet and Laisney 2024: late Middle Kingdom, agreeing with Parker. The bar's end moves from 1300 to 1250 BCE so that the text and the window agree with Hamilton's latest text; the earliest stays Hamilton's 1850. The `time` field is that earliest proposal only because
  a node needs one.
