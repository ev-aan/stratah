what: >-
  The Metropolitan Museum of Art's open-access record 33.8.17, "Leaders of the Aamu of Shu" (tempera on paper, 63.5 x 81.5 cm,
  scale 1:1, Rogers Fund 1933), by Norman de Garis Davies, field "excavation: MMA graphic expedition 1931", locale "Tomb of
  Khnumhotep (Tomb 3)". The stored image shows two men in patterned garments each leading an animal (one a gazelle, one an ibex),
  a column of strokes and arch signs at top left, and signs at top and right. It is a modern artist's copy of part of the wall,
  not the wall. The Met's API record carries the flag isPublicDomain true and an empty rightsAndReproduction field (read 2026-10-14 and again 2026-10-16). The Met's web page and Open Access policy page could not be read (HTTP 429 on both), so the terms of reuse are not recorded here and the image is not stored in this repository; it is linked at the holder's image server.
