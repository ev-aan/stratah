variant_reason: 'A different absolute year for the same regnal date (year 23, I Shemu day 21). The page says "according to current scholarly calculations" and names no chronology, so this is a stated number, not a worked one. The same year follows from the 2006 chronology of Hornung, Krauss and Warburton (see the variant node megiddo-annals-year-23-hkw-1457), which the page does not cite.'
what: >-
  The page "The Battle and Siege of Megiddo" by Rhio H. Barnhart says: "The battle and siege of Megiddo took place, according to current scholarly calculations, in 1457 BC." The page names no chronology. It is a personal web page with the author's own transliteration and translation of lines 1-103 of the Annals from Sethe's hand-copied text (Urk. IV 647-667), written for a hieroglyph study group; it states no affiliation, licence or funding in its text (contact details on the page are recorded in the manifest). Its bibliography lists Breasted 1906, Faulkner (a dictionary and JEA 28, 1942), Lichtheim, Nelson, Sethe and others.
