id: merneptah-1896-petrie-finds-israel-stele
rev: 2
type: event
label: '1896: Petrie finds the Merneptah (Israel) stele in the first court of Merneptah''s temple, Thebes'
time: '1896-01-01'
precision: year
date_basis: stated
kind: document
status: single
what: >-
  Petrie's excavation report (published 1897) says the black granite stele of Merneptah, engraved on the back of a stele of
  Amenhotep III, lay in the south-west corner of the first court of Merneptah's temple at Thebes, apparently overthrown forwards
  against the south wall, resting on a column base. The report is titled "1896" and section 29 calls the find of the stele "the greatest discovery in the
  temple". ("The greatest prize of the year" is said in the same section of the upper part of a colossal seated statue of Merenptah, "next to the Israel inscription".) The month and day of the find are not given in the passages read.
place:
  name: 'Temple of Merneptah, first court (south-west corner), Thebes'
  note: 'Named by Petrie 1897, section 29. No coordinates given; none are guessed here.'
sources:
