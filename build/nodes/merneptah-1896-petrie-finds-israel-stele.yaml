- rev: 1
  date: '2026-10-14'
  change: Created by the merneptah-stele-israel dig from Petrie 1897, sections 29 and 48. The find year rests on the book's title and its "greatest prize of the year"; the month is not read.
- rev: 2
  date: '2026-10-20'
  change: >-
    Correction after independent review, checked against the Internet Archive OCR of Petrie 1897, section 29 (item sixtemplesattheb00petruoft).
    rev 1 paraphrased Petrie as calling the stele "the greatest prize of the year". Section 29 says "The greatest discovery in the temple was that of the black granite stele of Merenptah";
    "the greatest prize of the year" is said of the upper part of a colossal seated statue of Merenptah, "next to the Israel inscription". The `what` text now says so. Nothing else in the node changed; the find year (from the report's title) is unaffected. The rev 1 wording stays in the repository history and in this entry.
