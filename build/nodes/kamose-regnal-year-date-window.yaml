history:
- rev: 1
  date: '2026-10-14'
  change: >-
    Created by the kamose-texts dig. A window, not a date: the single time (1550 BCE) is the speaker's and Digital Karnak's end date, not a result. No chronology of the Seventeenth Dynasty was opened;
    the window rests on our inference from the New Kingdom start range.
- rev: 2
  date: '2026-10-16'
  change: >-
    Removed `certainly_covers` (1550 BCE only), which rev 1 gave. Under N18 that field means a span all authorities agree on; only two web pages without an authority and the speaker give 1550, and the lower bound of the window is the dig's own guess, so no such span exists here.
    The begin_note now says plainly that the 1575 BCE bound is the dig's guess with a five-year allowance. The year readings in `what` now name Maspero and Weill as well as Gardiner. The time, the window bounds and the sources are unchanged.
