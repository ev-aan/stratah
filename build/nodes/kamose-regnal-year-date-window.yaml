# Shared node. Append-only: a change is a new `rev` plus a `history` entry, never an overwrite. See build/SCHEMA.md, Nodes.
id: kamose-regnal-year-date-window
rev: 2
type: event
label: 'Kamose''s campaign year in BCE: not fixed by anything read; two web pages give about 1555 to 1550 BCE without an authority, and a radiocarbon range for the start of the next dynasty bounds it from one side'
time: -1550-01-01T00:00:00Z
precision: year
date_basis: inferred
kind: analysis
status: disputed
what: >-
  The speaker's date is 1550 BC (handoff wording only). Two web pages read (Digital Karnak, a project record; Minot State University's HIST 105 reader) give Kamose's reign as about 1555 to 1550 BCE, with no stated authority for the figures. Bronk Ramsey and colleagues (Science, 2010; abstract read)
  report a radiocarbon-based range of 1570 to 1544 BCE for the START of the New Kingdom, the dynasty after Kamose's. Kamose's last years fall shortly before that start. That link, and its size, is our inference and was not read in any source; it is the basis of the window below.
  The single time shown (1550 BCE) is the end of the web pages' range and the speaker's figure. It is not a result and is not a best estimate. No source read gives a span that all authorities agree on, so no `certainly_covers` span is given (rev 1 gave one; see history).
  The Carnarvon Tablet itself gives only a regnal year (year 3 in Maspero 1909, Weill 1913 and Gardiner 1916; year 7 in Griffith 1912), so no BCE date is read from it.
window:
  earliest: -1575-01-01
  latest: -1544-12-31
  begin_note: >-
    Our guess, not read in any source: the earliest end of the radiocarbon range for the start of the New Kingdom (1570 BCE, Bronk Ramsey et al. 2010) plus an allowance of five years for a reign that ends as that dynasty begins. The size of the allowance is the dig's own and could be larger or smaller.
  end_note: >-
    The latest end of the same radiocarbon range (1544 BCE). The page figures of 1555 to 1550 BCE sit inside the window. Whether Kamose's reign ended exactly where the New Kingdom begins, or overlapped Ahmose's, is not settled by anything read here.
