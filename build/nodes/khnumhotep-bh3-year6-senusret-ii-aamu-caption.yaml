    Added the Kamrin article (full text read 2026-10-16) as a source. It renders the roll as "Year 6 ... accounting of the Aamu that the son of the Mayor, Khnumhotep, brought because of mesdemet; being Aamu of Shu, number amounting to thirty-seven", from Newberry's facsimile of the roll, and lists differing renderings by Goedicke, Kessler, Vernus, Staubli and Rabehl (not read directly). The `what` text, the placeholder `time` and the window are unchanged. The signs were still not read by the author of this node.
