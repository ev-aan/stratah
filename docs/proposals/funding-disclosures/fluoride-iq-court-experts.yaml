# Expert witnesses in Food & Water Watch v. EPA, N.D. Cal. No. 3:17-cv-02162-EMC
# Sources: src-fww-v-epa-2024 (Dkt. 445, Findings of Fact & Conclusions of Law, filed 24 Sep 2024;
#          line numbers refer to sources/fww-v-epa-2024-doc445.txt)
#          src-fww-fee-order-2026 (Dkt. 503, Order Awarding Fees & Costs, filed 5 Jan 2026; 11 pp.)
#
# Shared compensation finding (applies to every plaintiffs' testifying expert; no per-expert amounts exist):
#   Dkt. 503 p. 10: plaintiffs' itemized costs comprised travel, expert fees, Westlaw and transcripts
#   (citing Dkt. 481 paras 100-122); plaintiffs sought recovery only for fees paid to their testifying
#   experts, not consulting experts (citing Dkt. 481 para 109). Court awarded $496,745 in costs in total,
#   payable by EPA (p. 1 "Plaintiffs now seek ... fees and costs from EPA"; p. 11 conclusion), stayed
#   pending appeal. p. 10: plaintiffs did not deny they fully recouped litigation expenses through
#   targeted fundraising ($663,702 per EPA's opposition). The order names no expert and states no
#   expert-fee figure, and states nothing about fees EPA paid its own experts.
#   Separately, EPA earlier agreed to $102,727.33 in taxable costs (p. 2, citing Dkt. 454); not itemized.
#
# Side attribution: the court labels only Barone and Savitz as EPA's experts, and uses "Plaintiffs' experts"
# only in passages citing Grandjean (and, in the preceding sentence, Hu). Hu, Lanphear, Thiessen and
# Berridge are cited as trial witnesses without a party label in Dkt. 445, so they are marked unclear.
# Affiliations: Dkt. 445 states none for any witness beyond the EPA/plaintiffs labels.
#
# Authorship: checked against Europe PMC author lists (14 Oct 2026). The court gives a first name only
# for Grandjean (Philippe); for the others the match is by surname (+ initial) only and is noted as such.
# Re-checked 14 Oct 2026 by an independent checker: line references, party labels and fee-order figures.

- expert: "Philippe Grandjean"
  called_by: plaintiffs
  affiliation_as_stated: "not stated; court describes him as lead author of two pooled BMCL analyses (Grandjean 2022, Grandjean 2023)"
  record: [{source: src-fww-v-epa-2024, where: "lines 3203-3238 ('Plaintiffs' experts' passage citing Grandjean), 3503-3519, 5014-5030, 5382-5497, 5966, 8705-8746"}]
  compensation: "not stated by name; included only within the aggregate $496,745 costs award (testifying-expert fees among them), payable by EPA, src-fww-fee-order-2026 p. 10-11, if he was a plaintiffs' testifying expert"
  authored_dig_sources: [src-grandjean-2024-odense, src-grandjean-2019-review, src-choi-2012]
  note: "Dkt. 445 line 5014 confirms lead authorship of Grandjean (2022) [Trial Ex. 124] and Grandjean (2023) [Trial Ex. 119]; line 5030 says EPA itself had cited a Grandjean pooled benchmark-dose analysis. Europe PMC lists Grandjean P as first author of the 2024 Odense paper (Eur J Public Health), sole author of the 2019 review, and last author of Choi 2012."

