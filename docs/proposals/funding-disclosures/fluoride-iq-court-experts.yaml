  note: "Testimony cited from Dkt. 395 (31 Jan 2024, first trial day). Line 3219 cites Hu and Grandjean together immediately before the sentence at 3223 beginning 'Plaintiffs' experts credibly testified', but the court never labels Hu by party. Authorship by name match only: 'Hu H' appears on Bashash 2017, Grandjean 2024 (Odense) and Malin 2024 author lists; identity with the witness is not confirmed by the court text. Outside the court record, the papers' own disclosures differ on his role: Malin 2024 says Hu testified as a nonretained expert at the request of the US Department of Justice; Grandjean 2024 (Odense) says he was a fact witness. Neither is used to set called_by."

