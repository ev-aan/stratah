# Worked example for docs/proposals/funding-disclosures.md (not in force).
# Funding and competing-interest records for 37 studies and reviews cited by build/subjects/fluoride-iq,
# read 2026-10-14 from each document's own funding and disclosure sections, then re-opened by an
# independent checker (24 OK, 8 fixed, 5 could not be opened). Paraphrased; context only, never evidence.
- source: src-ntp-2024
  read: full_text
  read_from: 'NTP Monograph 08 PDF (final 508 version incl. erratum): Contributors, Peer Review, BSC Review, Acknowledgements
    and Conflict of Interest front-matter sections; Erratum note p. 87'
  url: https://ntp.niehs.nih.gov/sites/default/files/2024-08/fluoride_final_508.pdf
  checked: 2026-10-14
  funders:
  - name: Intramural Research Program, National Institute of Environmental Health Sciences, National Institutes
      of Health
    kind: government
    country: US
    grants:
    - ES103316
    - ES103317
    note: work performed for the National Toxicology Program, Public Health Service, US Department of Health and
      Human Services
  - name: US Department of Health and Human Services (contract GS00Q14OADU417)
    kind: government
    country: US
    grants:
    - GS00Q14OADU417 (Order No. HHSN273201600015U)
    note: contract under which the work was performed for NTP; the Acknowledgements sentence does not name the contractor.
      ICF (Reston, Virginia) staff are listed in the contributor pages as providing contract oversight and doing
      screening, extraction and drafting support
  funding_statement: 'The Acknowledgements say the work was supported by the NIEHS Intramural Research Program and
    performed for NTP under an HHS contract. NTP is itself part of HHS/NIEHS, so the report was commissioned and
    paid for in-house by the US federal government; the front matter also records that the NTP Director delayed
    the May 2022 release for additional review by an NTP Board of Scientific Counselors working group.

    '
  funder_role: Not stated as a separate role; NIEHS/NTP staff are the authors and the funder, and the NTP Director
    and BSC Chair decided on the extra review round.
  competing_interests:
    declared_none: not_stated
    items:
    - who: Protocol reviewers, technical reviewers of the draft, and peer-review panel members (as a group)
      what: certified they have no known real or apparent conflict of interest related to fluoride exposure or neurodevelopmental
        and cognitive effects; no individual disclosures are listed
  corrections:
  - date: '2024-09-04'
    notice_url: https://ntp.niehs.nih.gov/sites/default/files/2024-08/fluoride_final_508.pdf
    what: Erratum changing 'Two children from each grade' to 'Two classes from each grade' in a study description;
      does not touch funding or COI.
  gaps: The COI statement covers reviewers and peer reviewers only; it says nothing about the NTP/NIEHS or ICF authors'
    own interests, so declared_none is not_stated for the authors. The BSC working group's own COI handling is in
    its separate report, which was not read. Individual reviewer COI forms are not published in the monograph.
