next_steps_for_agent:
  - Open at least one primary edition or the object image and read the line-27 signs; quote the translation verbatim with the edition named.
  - Find the Cairo museum record or a rights-clear plate; record holder, inventory number, sha256 of any stored image.
  - Confirm findspot, the Amenhotep III reuse, and where the duplicate is.
  - Check whether the stele says anything about 'no king', 'nation' or 'conquered Canaan' in the text itself (read, do not rely on summaries).
  - Separately: the Hyksos > Hapiru > Shasu > Israel identity chain is NOT in this stele; file it as its own claim set. Leave it `proposed` with a searched-gap next_step.
  - Place the stele as a shared node (place + time) per SCHEMA Nodes; time window with reasons.
  - Report what was blocked. Do not guess.

constraints:
  - "Do not bypass bot checks or paywalls. Record them as blocked."
  - "Verify each archive's licence before storing images; otherwise keep link + thumbnail only."
  - "Do not edit SCHEMA/conformance/docs; open a proposal instead."
  - "Mark where the facts end (best of current knowledge). Keep different or opposing hypotheses open for further study as contested claims with named positions; do not close them early."
  - "Books, translations and videos are all claims needing proof, on the same footing. Proof is the object, its images or squeezes. For every author and publisher the agent relies on, trace who funded and controlled the work and record it; do not treat a book as an anchor."
