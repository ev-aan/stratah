subject_candidate: merneptah-stele-israel
purpose: >
  Several Dead Hidden claims lean on the Merneptah (Israel) Stele. Source the object itself (image first), read the
  line-27 passage in an edition, and weigh each speaker claim. Keep every speaker claim exactly as stated.

speaker_claims_to_test:   # ids in ~/dead_hidden_claims/<video>.yaml
  - id: dh-HN0wNVpfunM-26
    as_stated: "In 1200 BC the Merneptah Stele records Israel as a single nation in Canaan, still without a king, the only well-organized people to have conquered Canaan."
  - id: dh-K3pw12lBcXM-29
    as_stated: "By 1200 BC the Aamu-Hyksos, who became Hapiru, who became Shasu Yahweh, turned into Israel, as in the stele of Merneptah."
  - id: dh-K3pw12lBcXM-30
    as_stated: "At the time of the Merneptah stele they are united into a nation without a king who had conquered large parts of Canaan."
  - id: dh-gBGfqlL_FFQ-09
    as_stated: "Records are silent for 200 years until 1200 BC when Israel is first mentioned as a distinct group in Canaan; the Hyksos slaves became the people of Israel."
split_note: "Each claim bundles several assertions (date, 'Israel' reading, 'nation', 'no king', 'conquered Canaan', identity chain). Test them separately."

object_facts_to_confirm:   # from a web search summary only; NOT yet confirmed in a primary source
  - "Cairo Egyptian Museum JE 31408; found by Flinders Petrie at Thebes in 1896 (secondary summary)"
  - "Carved on the back of an Amenhotep III stele (secondary summary)"
  - "A poorly preserved duplicate exists at Karnak; search summaries DISAGREE on where the duplicate is (Karnak vs another part of the Theban temple). Resolve in a primary edition."
  - "Line 27 read as 'Israel' by most scholars; at least one fringe source alleges a forgery. Treat as a claim to examine, with the sign group read from the image."
  - "Date c. 1208 BCE (secondary). Speaker says '1200 BC'."

